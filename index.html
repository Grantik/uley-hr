<style>
/* Surface: Learn + Inspect. Left rail = table of contents of one binder; the reading column is a case file.
   Colour carries meaning only in the case blocks: brown = their text now, blue = the law, green = what we propose. */
:root {
  --paper: #f6f7f9; --sheet: #fff; --ink: #1d2433; --muted: #5d6677; --line: #d9dde5;
  --accent: #23497e; --accent-soft: #e6edf7;
  --was: #8a4b14; --was-bg: #fbf3ea; --law: #23497e; --law-bg: #eef3fa; --new: #2f6b4a; --new-bg: #eaf5ee;
  --hi: #a3282c; --hi-bg: #fbeaea; --mid: #8a6100; --mid-bg: #fbf2d9; --lo: #4d5666; --lo-bg: #eef0f4;
  --cm: #d7f0e0; --cm-line: #2f6b4a;
  --f-display: "PT Serif", Georgia, serif; --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", Consolas, monospace; --rail: 300px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--f-body); }

button { font: inherit; cursor: pointer; }

  background: var(--paper); border-bottom: 1px solid var(--line); }
.top b { font-family: var(--f-display); }
.menu-btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 12px; min-height: 44px; }
.layout { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
nav.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
  background: var(--sheet); padding: 22px 14px 40px; scrollbar-width: thin; }
.rail .brand { font: 700 20px/1.2 var(--f-display); margin: 0 8px 4px; }
.rail .ver { font: 12px/1.3 var(--f-mono); color: var(--muted); margin: 0 8px 18px; }
.rail h4 { font: 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 20px 8px 8px; }
.rail a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink);
  padding: 7px 8px; border-radius: 6px; font-size: 15px; line-height: 1.3; }
.rail a:hover { background: var(--paper); }
.rail a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.rail a .n { font: 12px/1.3 var(--f-mono); color: var(--muted); white-space: nowrap; padding-top: 2px; }
main { min-width: 0; padding: 32px 28px 120px; }
.col { max-width: 800px; margin: 0 auto; }
.eyebrow { font: 13px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #4a5263; }
h1 { font: 700 clamp(25px, 4vw, 34px)/1.18 var(--f-display); margin: 6px 0 16px; text-wrap: balance; }
h2 { font: 700 24px/1.25 var(--f-display); margin: 40px 0 12px; padding-top: 14px; border-top: 2px solid var(--ink); text-wrap: balance; }
h3 { font: 700 19px/1.3 var(--f-display); margin: 24px 0 8px; }
p, li { text-wrap: pretty; }
.lead > p, .lead li { max-width: 70ch; }
.doc-body table, .meta { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
.doc-body table { display: block; overflow-x: auto; }
.doc-body th, .doc-body td, .meta th, .meta td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; text-align: left; }
.doc-body th { background: var(--paper); font-weight: 700; }
.doc-body thead:has(th:empty:only-child, th:empty + th:empty) { display: none; }
.doc-body td { background: var(--sheet); min-width: 110px; }
.meta th { width: 150px; background: var(--paper); font-weight: 400; color: var(--muted); }
.meta td { background: var(--sheet); }
.doc-body code { font: inherit; background: #eef0f4; border-radius: 4px; padding: 0 3px; }
.doc-body blockquote { margin: 10px 0; padding: 10px 14px; background: var(--new-bg); border-radius: 8px; }
.doc-body blockquote p { margin: 6px 0; }
.lbl { font: 700 13px/1.2 var(--f-mono); font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin: 26px 0 6px; }
.lbl-bylo { color: var(--was); } .lbl-zakon { color: var(--law); } .lbl-stalo { color: var(--new); }
.lbl-ne, .lbl-kak, .lbl-utochnit, .lbl-cena, .lbl-uver { color: #4a5263; }
.sec-bylo { background: var(--was-bg); border-radius: 8px; padding: 2px 14px; }
.sec-zakon { background: var(--law-bg); border-radius: 8px; padding: 2px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.chip { font: 13px/1.5 var(--f-mono); padding: 2px 8px; border-radius: 999px; background: var(--lo-bg); color: var(--lo);
  text-decoration: none; white-space: nowrap; }
a.chip:hover { outline: 1px solid var(--line); }
.chip.imp-высокая { background: var(--hi-bg); color: var(--hi); } .chip.imp-средняя { background: var(--mid-bg); color: var(--mid); }
.rows { display: grid; gap: 8px; margin: 12px 0; }
.row { display: grid; gap: 4px; text-decoration: none; color: var(--ink); background: var(--sheet); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; }
.row:hover { border-color: #b8c2d3; }
.row .t { font: 700 17px/1.3 var(--f-display); }
.row .id { font: 13px/1.3 var(--f-mono); color: var(--muted); }
.row .sub { color: var(--muted); font-size: 15px; }
ol.start { padding-left: 0; list-style: none; counter-reset: s; margin: 12px 0; display: grid; gap: 10px; }
ol.start li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 0 10px; background: var(--sheet);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
ol.start li::before { content: counter(s); font: 700 22px/1.2 var(--f-display); color: var(--accent); grid-row: span 2; }
ol.start a { font: 700 17px/1.3 var(--f-display); text-decoration: none; }
ol.start p { margin: 4px 0 0; color: #343c4c; font-size: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.filters .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs a { text-decoration: none; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
  background: var(--sheet); font-size: 15px; min-height: 40px; display: inline-flex; align-items: center; }
.tabs a.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
select { font: inherit; font-size: 15px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); min-height: 40px; max-width: 100%; }
details { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; margin: 12px 0; }
details > summary { cursor: pointer; padding: 12px 0; font: 700 17px/1.3 var(--f-display); }
details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.btn { border: 1px solid var(--line); background: var(--sheet); color: var(--accent); border-radius: 8px; padding: 8px 12px; min-height: 42px; }
.btn.main { background: var(--accent); color: #fff; border-color: var(--accent); }
.pager { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin: 30px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
.pager a { text-decoration: none; max-width: 40%; font-size: 15px; }
.note { background: var(--accent-soft); border: 1px solid #c6d4ea; border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 16px; }
.count { font: 13px/1.3 var(--f-mono); color: var(--muted); }
.dl { display: grid; gap: 10px; margin: 12px 0; }
.dl .card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.dl .card .t { font: 700 17px/1.3 var(--f-display); }
.dl .card p { margin: 4px 0 10px; color: var(--ink); }
.dl .meta2 { font: 13px/1.4 var(--f-mono); color: var(--muted); margin: 0 0 10px; }
.dl .st { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--mid-bg); color: var(--mid); }
.dl .st.ok { background: var(--new-bg); color: var(--new); }
.dl .files { display: flex; flex-wrap: wrap; gap: 8px; }
.dl .files a { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 700; }
.dl .files a:hover { background: var(--accent-soft); }
.dl .files a span { font: 13px/1 var(--f-mono); color: #4a5263; font-weight: 400; }
.dl .tizer { background: var(--accent-soft); border-color: #c6d4ea; }
.dl .tizer ol { margin: 6px 0 10px; padding-left: 22px; }
.cm { background: var(--cm); box-shadow: inset 0 -2px 0 var(--cm-line); cursor: pointer; }
#cmbtn { position: absolute; z-index: 41; display: none; }
#dlg { position: fixed; inset: auto 0 0 0; z-index: 50; background: var(--sheet); border-top: 2px solid var(--ink); padding: 16px;
  display: none; box-shadow: 0 -10px 30px rgba(20, 30, 50, .15); }
#dlg .in { max-width: 780px; margin: 0 auto; display: grid; gap: 10px; }
#dlg blockquote { margin: 0; padding: 8px 12px; background: var(--paper); border-radius: 6px; max-height: 120px; overflow: auto; font-size: 15px; }
#dlg textarea { width: 100%; min-height: 110px; font: 16px/1.45 var(--f-body); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
#dlg .acts { display: flex; gap: 10px; justify-content: flex-end; }
#pop { position: absolute; z-index: 40; max-width: 340px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; box-shadow: 0 8px 28px rgba(20, 30, 50, .18); font-size: 15px; display: none; }
.cmlist .item { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.cmlist blockquote { margin: 6px 0; padding: 6px 10px; background: var(--cm); border-radius: 6px; font-size: 15px; }
.cmlist .acts { display: flex; gap: 14px; font-size: 14px; }
.badge { font: 12px/1 var(--f-mono); background: var(--cm); border-radius: 999px; padding: 3px 7px; }
.badge:empty { display: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flash { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 900px) {
  .top { display: flex; }
  .layout { grid-template-columns: 1fr; }
  nav.rail { position: fixed; z-index: 30; left: 0; top: 0; width: min(86vw, 330px); transform: translateX(-102%);
    transition: transform .2s ease; }
  body.menu nav.rail { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .2); }
  main { padding: 18px 14px 120px; }
  .meta th { width: 110px; }
  .sec-bylo, .sec-zakon { padding: 2px 10px; }
  .pager a { max-width: 46%; }
}
@media (prefers-reduced-motion: reduce) { nav.rail { transition: none; } }
@media print { nav.rail, .top, #cmbtn, .pager, .btn { display: none !important; } .layout { display: block; } }
</style>
</head>
<body>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Оглавление"></nav>
  <main><div class="col" id="view"><p class="eyebrow" style="padding-top:24px">Загружаю страницу. Если ничего не появилось, открой ссылку в обычном браузере: Chrome, Safari или Firefox.</p></div></main>
</div>

</div></div>
<script>
const DATA = {"data": "17.11.2026", "zagolovok": "Разбор кадровых положений компании: было — стало", "vvedenie": "<p>Мы прочитали 16 действующих положений и регламентов, которые ты прислала, — 237 страниц, а также\nформы КДП по воинскому учёту и выгрузки остатков отпусков и компенсаций. Искали связи между документами, места, где\nдокументы расходятся друг с другом, с практикой или с законом, и то, что устарело. Получилось 177 кейсов, 123 из них\nвысокой важности.<\/p>", "vvedenie2": "<p>Каждый кейс устроен одинаково:<\/p>\n<ul>\n<li><strong>Было<\/strong> — дословно ваш пункт, с номером документа и пункта;<\/li>\n<li><strong>Что не так<\/strong> — к чему это ведёт на деле;<\/li>\n<li><strong>Закон<\/strong> — дословная цитата нормы и её редакция;<\/li>\n<li><strong>Стало (предлагается)<\/strong> — новый текст пункта в стиле вашего документа;<\/li>\n<li><strong>Как будет работать<\/strong> — кто что делает после правки;<\/li>\n<li><strong>Уточнить у HR и КДП<\/strong> — чего мы не знаем о практике;<\/li>\n<li><strong>Цена вопроса<\/strong> и <strong>Уверенность<\/strong> — сколько это стоит, если удалось посчитать, и насколько мы уверены.<\/li>\n<\/ul>\n<p>Документы обозначены номерами от 01 до 16: например, «12, п. 4.21» — Правила внутреннего трудового распорядка, пункт\n4.21. Весь список — на странице «Документы: реестр».<\/p>\n<p>Это предложения, а не готовые правила. До утверждения их смотрят юристы компании, решения принимает руководитель\nкомпании (Леван). Где мы не знаем, как у вас на деле, мы так и пишем и спрашиваем.<\/p>", "skachat": [{"nazv": "Разбор 16 положений: 177 кейсов «было — стало (предлагается)»", "zachem": "Всё, что на этой странице, одним документом: читать, править, распечатать.", "status": "готово", "gotovo": true, "fajly": [{"imya": "hr-keysy-16-polozheniy.docx", "format": "DOCX", "razmer": "352 КБ"}, {"imya": "hr-keysy-16-polozheniy.pdf", "format": "PDF", "razmer": "2,9 МБ"}], "data": "18.11.2026"}, {"nazv": "Вопросы к HR и КДП: 90 вопросов с местом для ответа", "zachem": "Впиши ответы прямо в файл и пришли его: без них часть кейсов остаётся предположением.", "status": "ждёт твоих ответов", "gotovo": false, "fajly": [{"imya": "hr-voprosy-kdp.docx", "format": "DOCX", "razmer": "19 КБ"}], "data": "18.11.2026"}, {"nazv": "Долг по отпускам: оценка от 11.11 и сводка выгрузки", "zachem": "Сколько стоят накопленные дни отпуска. Только общие цифры, без сотрудников.", "status": "готово", "gotovo": true, "fajly": [{"imya": "hr-dolg-otpuskov.docx", "format": "DOCX", "razmer": "13 КБ"}, {"imya": "hr-dolg-otpuskov.pdf", "format": "PDF", "razmer": "84 КБ"}], "data": "18.11.2026"}, {"nazv": "График отпусков на 2027 год: предложение от 13.11", "zachem": "Порядок и сроки графика, три варианта для руководителя компании.", "status": "черновик: ждёт твоего решения и ответа юристов", "gotovo": false, "fajly": [{"imya": "hr-grafik-2027-proekt.docx", "format": "DOCX", "razmer": "19 КБ"}, {"imya": "hr-grafik-2027-proekt.pdf", "format": "PDF", "razmer": "144 КБ"}], "data": "18.11.2026"}, {"nazv": "Пакет для ИИ-клиента компании", "zachem": "Законы дословно, кейсы по темам, системный промпт, контрольные вопросы и инструкция для загрузки в Knowledge.", "status": "готово; заработает, когда ИТ подключит ИИ-клиент", "gotovo": true, "fajly": [{"imya": "uley-hr-knowledge.zip", "format": "ZIP", "razmer": "408 КБ"}], "data": "18.11.2026"}], "tizer": {"zagolovok": "Скоро сама: загрузи пакет в ИИ-клиент компании и спроси…", "voprosy": ["Что не так с запретом испытания в положении об испытании и что предлагается?", "Как по закону оплачивать сверхурочные начиная со 121-го часа в году?", "Как затребовать объяснение до дисциплинарного взыскания и когда составлять акт, если объяснения нет?"]}, "dalshe": "<h2>Что нужно от тебя<\/h2>\n<ol>\n<li>\n<p><strong>Ответы на вопросы.<\/strong> На странице «Вопросы к HR и КДП» по каждой теме до десяти вопросов, к части из них есть\n   варианты ответа: можно выбрать вариант или ответить своими словами. Без ответов часть кейсов остаётся\n   предположением.<\/p>\n<\/li>\n<li>\n<p><strong>Комментарии к кейсам.<\/strong> Под каждым кейсом есть кнопка «Комментарий»: что не так, что у вас на деле по-другому,\n   с чем не согласна. Комментарии хранятся в этом браузере. Когда закончишь, открой «Мои комментарии», нажми\n   «Скопировать всё» и пришли текст.<\/p>\n<\/li>\n<\/ol>", "proverka": "<ul>\n<li>\n<p>Цитаты в «Было», «Закон» и пояснениях сверены программой с текстом вашего документа, закона или записи\n  встречи: проверено 1 015 цитат, расхождений 0. Сканы распознаны программой, спорные места сверены с картинкой\n  страницы. Текст в «Стало (предлагается)» — наш, с источниками его не сверяли.<\/p>\n<\/li>\n<li>\n<p>У цитат закона программа сверила номер статьи: проверено 360 ссылок «статья — цитата», расхождений 0.<\/p>\n<\/li>\n<li>\n<p>Тексты законов взяты с consultant.ru с датой редакции; Трудовой кодекс — в редакции от 25.05.2026, включая\n  изменения, которые вступили в силу 01.09.2026. Юристы компании разбор ещё не проверяли.<\/p>\n<\/li>\n<li>\n<p>Суммы по отпускам посчитаны программой по выгрузкам КДП, без имён сотрудников.<\/p>\n<\/li>\n<\/ul>", "voprosy_vvod": "<p>По каждой теме — вопросы, без ответов на которые кейсы остаются предположениями. Где есть варианты,\nвыбери вариант или напиши свой. Ответить можно кнопкой под темой: ответ сохранится в «Моих комментариях».<\/p>", "dok": {"01": "Кодекс деловой этики (ред. 2, 05.10.2021)", "02": "Политика о сверхурочной работе и работе в выходные и праздничные дни (ред. 2, приказ № 51/2025 от 01.07.2025)", "03": "Положение для дистанционных работников (приказ № 8-ЛС.2023 от 25.01.2023)", "04": "Положение о коммерческой тайне (ред. 28.04.2020, приказ № 12_2020)", "05": "Положение о конфиденциальной информации и коммерческой тайне (ред. 14.06.2018, приказ № 03_2018)", "06": "Положение о несчастных случаях (приказ 7-ЛС.2023 от 25.01.2023)", "07": "Положение о порядке прохождения испытания при приёме на работу (ред. 27.01.2020)", "08": "Положение о системе управления охраной труда (приложение к приказу 4-ЛС.2023 от 25.01.2023)", "09": "Положение об обработке и защите персональных данных работников (ред. 01.06.2017)", "10": "Положение об оплате труда, премировании и доп. социальных мероприятиях (ред. 4 от 18.07.2025)", "11": "Положение по СОУТ/СОС (приказ 6-ЛС.2023 от 25.01.2023)", "12": "Правила внутреннего трудового распорядка (ред. 4, приказ № 29_2022 от 03.11.2022)", "13": "Регламент адаптации новых сотрудников (ред. 25.03.2021)", "14": "Регламент оформления командировок (ред. 3 от 20.11.2024)", "15": "Регламент по использованию такси (от 01.08.2022)", "16": "Регламент согласования отпусков (ред. 2 от 08.09.2021)"}, "nachalo": [{"slug": "PRIEM-01", "tekst": "Положение об испытании не позволяет назначать испытание женщинам с детьми до полутора лет, а закон с 01.09.2026 запрещает его женщинам с детьми до трёх лет. Правка в одну строку."}, {"slug": "VREM-03", "tekst": "Положение об оплате труда устанавливает за сверхурочные 150% за первые два часа и 200% за следующие. С 01.09.2026 закон требует не меньше двойной оплаты за каждый час начиная со 121-го часа в году: этого правила в положении нет."}, {"slug": "OTP-05", "tekst": "У 60 из 232 сотрудников больше 30 дней неиспользованного отпуска (выгрузка КДП на 11.11.2026); компенсация за дни сверх 30 по расчёту в выгрузке — 23,5 млн руб. Перенос в положениях упомянут, но не сказано, кто проверяет рабочий год и предельную дату."}, {"slug": "OTP-01", "tekst": "Порядка утверждения годового графика отпусков в положениях нет, а график 2027 года уже собирают. По закону график утверждают не позднее чем за две недели до нового года, с учётом мнения профсоюза, если он есть."}, {"slug": "DISC-01", "tekst": "Почти все кадровые документы подписывают в Диадоке, а ПВТР описывают электронный документооборот только для дистанционных. Положения о введении ЭДО, которого требует закон, в комплекте нет."}, {"slug": "SKVOZ-05", "tekst": "По полученным копиям нельзя подтвердить, кто из работников ознакомлен с какой редакцией: листы ознакомления в копиях ПВТР и регламента такси пусты. Это не значит, что не знакомили: учёт разбросан по Диадоку и бумажным папкам."}, {"slug": "PRIEM-06", "tekst": "Регламент адаптации требует проводить встречи наставника вечером, после рабочего дня. По тексту выходит работа за пределами рабочего времени; если на деле встречи проходят днём, надо поправить текст."}, {"slug": "DISC-07", "tekst": "По тексту ПВТР акт об отказе дать объяснение можно составить сразу, а закон даёт работнику два рабочих дня. Если так и делают, взыскание можно оспорить."}, {"slug": "KOM-01", "tekst": "Регламент командировок не называет размер суточных: отсылает к закону или приказу, которого в комплекте нет."}], "gruppy": [{"kod": "OTP", "nazv": "Отпуска", "glavnoe": "<p>Пять кейсов, с которых начать разговор с руководителем HR:<\/p>\n<ol>\n<li><strong><a href=\"#/k/OTP-01\">К-OTP-01<\/a> — годовой график.<\/strong> В ЛНА нет порядка его подготовки и утверждения, а 2027 год уже собирают; сначала назначить владельца, срок и юридическую процедуру.<\/li>\n<li><strong><a href=\"#/k/OTP-02\">К-OTP-02<\/a> — извещение под роспись.<\/strong> Письмо за 2–3 недели подтверждено практикой, но надо доказать именно подпись и не путать её с просьбой работника.<\/li>\n<li><strong><a href=\"#/k/OTP-03\">К-OTP-03<\/a> — единый маршрут.<\/strong> 16, 12, 10 и практика 1С/Диадок говорят разными языками; без одного маршрута будут дубли, пропущенные сроки и ручные оригиналы.<\/li>\n<li><strong><a href=\"#/k/OTP-05\">К-OTP-05<\/a> — накопленные дни.<\/strong> По выгрузке КДП на 11.11.2026 у 60 из 232 больше 30 дней; дни сверх 30 стоят 23,5 млн руб., за осень при увольнениях выплачено 2,6 млн руб.; рабочих лет в выгрузке нет, а вариант «половина в 2027» требует юристов.<\/li>\n<li><strong><a href=\"#/k/OTP-20\">К-OTP-20<\/a> — ЭДО.<\/strong> Фактический электронный процесс шире текста ПВТР; до массовой автоматизации нужно найти ЛНА об ЭДО и резерв на бумаге.<\/li>\n<\/ol>\n<p>Почему эти пять: они связывают уже начатый график 2027, законный срок извещения, денежный риск, работу КДП и сквозной способ подписания. <a href=\"#/k/OTP-04\">К-OTP-04<\/a> (оплата), 07 (отзыв), 08 (обязательный отпуск за свой счёт), 15 (увольнение) проверяются вместе с юристами и бухгалтерией.<\/p>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Противоречие / недостающее звено<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">График на год<\/td>\n<td style=\"text-align: left;\">16, 1.2, 1.5, 2.4; 12, 4.11–4.22; ТК 123<\/td>\n<td style=\"text-align: left;\">КДП, работники, руководители, HR, генеральный директор; профсоюзный орган при наличии<\/td>\n<td style=\"text-align: left;\">По ответам HR: Google-таблица → приказ → Диадок; отображение в 1С Кабинете<\/td>\n<td style=\"text-align: left;\">Нет порядка годового утверждения в присланных ЛНА; это не означает, что графика нет на деле<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Отпуск по графику<\/td>\n<td style=\"text-align: left;\">16, 1.1–1.6; 12, 4.18; 10, 10.12<\/td>\n<td style=\"text-align: left;\">Работник, непосредственный руководитель, руководитель проекта, ассистент, КДП, HR, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Письма, бумага и сканы по текстам; 1С Кабинет, задача 1С, Диадок по встрече<\/td>\n<td style=\"text-align: left;\">Повторная просьба и визы вместо запуска от графика; разные сроки и получатели<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Извещение и оплата<\/td>\n<td style=\"text-align: left;\">12, 4.18, 5.6; 10, 10.12; 16, 1.1<\/td>\n<td style=\"text-align: left;\">КДП, работник, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Письмо за 2–3 недели по ответам HR; способ получения подписи надо проверить<\/td>\n<td style=\"text-align: left;\">Письмо о согласовании не равно извещению под роспись; заявление поставлено условием оплаты<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Перенос и накопленные дни<\/td>\n<td style=\"text-align: left;\">12, 4.21; 16, 1.2, 1.5; ТК 124<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, КДП, HR, генеральный директор<\/td>\n<td style=\"text-align: left;\">Рабочая таблица, 1С; проект журнала Decision Flow<\/td>\n<td style=\"text-align: left;\">Нет полного порядка причин, согласия, рабочего года и предельной даты; неформальная загрузка подменяет перенос<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Деление<\/td>\n<td style=\"text-align: left;\">12, 4.15–4.16; ТК 125<\/td>\n<td style=\"text-align: left;\">Работник и уполномоченный работодатель<\/td>\n<td style=\"text-align: left;\">График, заявление, задача 1С<\/td>\n<td style=\"text-align: left;\">Интервал в три месяца и отдельная виза; предложения улья о днях — ещё не решения<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Отзыв<\/td>\n<td style=\"text-align: left;\">12, 4.20; ТК 125; 10, расчёты<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, КДП, подписант приказа, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Приказ; подтверждённый канал подписания<\/td>\n<td style=\"text-align: left;\">Общая фраза не показывает запреты и специальный режим для вредных условий<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Замена деньгами<\/td>\n<td style=\"text-align: left;\">12, 4.21; ТК 126<\/td>\n<td style=\"text-align: left;\">Работник, КДП, работодатель, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Заявление и приказ; 1С<\/td>\n<td style=\"text-align: left;\">Совокупный остаток нельзя сравнивать только с 28; нужна разбивка по рабочим годам<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Увольнение и компенсация<\/td>\n<td style=\"text-align: left;\">12, 2.16.3–2.16.5, 4.21; 10, 10.13; ТК 127, 140<\/td>\n<td style=\"text-align: left;\">КДП, бухгалтерия, руководитель, подписант приказа<\/td>\n<td style=\"text-align: left;\">1С, Диадок; обходной лист<\/td>\n<td style=\"text-align: left;\">Право записано, контроль сверки всех лет и начисления явно не назначен; архив расчётов не открыт<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Обязательные неоплачиваемые отпуска<\/td>\n<td style=\"text-align: left;\">16, 1.1, 1.7, прил. 2; 12, 4.22; ТК 128<\/td>\n<td style=\"text-align: left;\">Работник, КДП, работодатель; руководитель информируется<\/td>\n<td style=\"text-align: left;\">Общий маршрут писем и виз, форма без основания<\/td>\n<td style=\"text-align: left;\">Плановое согласование за 14 дней не подходит обязательным внезапным основаниям<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Учебный отпуск / иное отсутствие<\/td>\n<td style=\"text-align: left;\">16, 1.7; 12, 4.6, 4.9, 4.23<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, КДП<\/td>\n<td style=\"text-align: left;\">Заявление, подтверждающий документ; уведомление о болезни<\/td>\n<td style=\"text-align: left;\">Один отпускной алгоритм распространяется на разные правовые события<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Семейное событие<\/td>\n<td style=\"text-align: left;\">10, 8.2, 8.7–8.8; 12, 4.22<\/td>\n<td style=\"text-align: left;\">Работник, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Заявление; ЭДО или бумага<\/td>\n<td style=\"text-align: left;\">Есть три оплачиваемых дня, но их нельзя подменять неоплачиваемыми и наоборот; 8.8 про материальную помощь<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Продолжительность / учёт<\/td>\n<td style=\"text-align: left;\">12, 4.12–4.17; 16, прил. 1–2; ТК 115, 120–122<\/td>\n<td style=\"text-align: left;\">КДП, работник, бухгалтерия<\/td>\n<td style=\"text-align: left;\">1С, формы с датами и числом дней<\/td>\n<td style=\"text-align: left;\">28 дней без оговорки об удлинении; нет явной сверки праздников и рабочих лет в маршруте<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Замещение и передача дел<\/td>\n<td style=\"text-align: left;\">16, 2.1–2.5; 12, 4.18–4.19; 10, 4.4, 4.10<\/td>\n<td style=\"text-align: left;\">Руководитель, уходящий и замещающий, КДП, работодатель<\/td>\n<td style=\"text-align: left;\">Почта, приказ, акт/перечень дел<\/td>\n<td style=\"text-align: left;\">Менее года в 2.4; назначение не состыковано с оформлением дополнительной работы; солидарная ответственность<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Сообщения перед отпуском<\/td>\n<td style=\"text-align: left;\">16, 2.2, 2.6; 12, 3.2.29, 5.9<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, замещающий<\/td>\n<td style=\"text-align: left;\">Почта, Slack по ЛНА; Mattermost по ответам HR<\/td>\n<td style=\"text-align: left;\">Нужны подтверждение действующего канала и единый владелец информирования<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Страна и работа за рубежом<\/td>\n<td style=\"text-align: left;\">16, 1.1; 12, 3.2.13<\/td>\n<td style=\"text-align: left;\">Работник, HR, юристы; руководитель и ИБ только при работе<\/td>\n<td style=\"text-align: left;\">Письмо о стране; Confluence для требований к рабочему месту<\/td>\n<td style=\"text-align: left;\">Указ 2020 года в базе отсутствует; отпуск нельзя смешивать с переносом рабочего места<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">День отдыха за работу в выходной<\/td>\n<td style=\"text-align: left;\">02, 5.2–5.4; 16, 1.7; ТК 153<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">Согласие с выбором компенсации, заявление<\/td>\n<td style=\"text-align: left;\">Не отпуск из ежегодного остатка; основная правка в группе VREM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<ol>\n<li>Есть ли отдельный приказ/порядок годового графика и кто утвердил график 2026 года?<\/li>\n<li>Есть ли выборный орган первичной профсоюзной организации?<\/li>\n<li>Что именно подписывает работник перед ежегодным отпуском: извещение, график или заявление; где хранится дата подписи?<\/li>\n<li>Какой маршрут сейчас главный: 1С Кабинет → задача 1С → Диадок → приказ КДП или старый почтовый/бумажный?<\/li>\n<li>Есть ли ЛНА об ЭДО, какие категории и документы он покрывает, где согласия и бумажный резерв?<\/li>\n<li>Можно ли разложить остатки по рабочим годам, выделить дни 2027 года и получить дату среза?<\/li>\n<li>Сколько случаев работы в запланированный отпуск было в 2026 году и оформлены ли перенос/отзыв приказами?<\/li>\n<li>Где приказ с перечнем должностей НРД и действует ли он сейчас?<\/li>\n<li>Как оформляют обязательный отпуск без сохранения зарплаты, семейные три оплачиваемых дня и учебный отпуск?<\/li>\n<li>Как КДП и бухгалтерия сверяют остаток дней и компенсацию при увольнении; можно ли получить остатки с разбивкой по рабочим годам?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li><strong>ТК ст. 136<\/strong> была в доборе, поэтому не отсутствует; срок оплаты приведён дословно.<\/li>\n<li><strong>ТК ст. 127, 139<\/strong> есть в основном; <strong>ст. 125<\/strong> есть там же с редакцией 25.05.2026.<\/li>\n<li>Для точного вывода о стране отпуска и режиме повышенной готовности <strong>нет текста указа мэра Москвы от 05.03.2020<\/strong>: юристам проверить первоисточник и актуальность.<\/li>\n<li>Для отдельных учебных отпусков и гарантий в доступном корпусе <strong>не были подняты статьи ТК 173–177 и специальные федеральные нормы<\/strong>: проверить юристам до окончательного текста маршрута <a href=\"#/k/OTP-10\">К-OTP-10<\/a>.<\/li>\n<li>Для компенсации при увольнении в базах нет отдельной полной разметки всех правил расчёта; ст. 139 и 140 есть, спорные детали проверить бухгалтерии и юристам.<\/li>\n<li>В базе нет полного текста локального акта о введении ЭДО: без него нельзя окончательно утвердить массовый электронный маршрут.<\/li>\n<\/ul>", "keysy": [{"id": "К-OTP-01", "slug": "OTP-01", "title": "Рабочая таблица отпусков есть, порядка утверждения годового графика в ЛНА нет", "imp": "высокая", "docs": ["10", "12", "16"], "meta": [["Документы", "16, пп. 1.2, 1.5, 2.4; 12, пп. 4.11–4.22; 10, п. 10.12"], ["Тип", "пробел"], ["Кто решает", "руководитель HR; руководитель компании — выбор порядка; юристы до утверждения"], ["Важность", "высокая: график следующего года уже собирают, но у порядка нет закреплённого владельца и срока"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.2: «если направленные сотрудником даты не заняты, то предварительно вносит направленные сотрудником даты в график отпусков»; п. 1.5: «отмечает отпуск в графике отпусков как согласованный».<\/p>\n<p><strong>Что не так.<\/strong> Это внесение отдельного отпуска по ходу работы, а не порядок утверждения графика на год. По ответам HR от 10.11 годовой график на деле собирает КДП в ноябре, затем оформляет приказ и ознакомление: отсутствие графика у компании не установлено. Риск — неясно, кто завершает сбор, проверяет права работников, подписывает окончательную версию и учитывает профсоюзное мнение. Предложение от 13.11 о единственном приказе не снимает противоречий с ПВТР и оплатой само по себе.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 123 ч. 1: «Очередность предоставления оплачиваемых отпусков определяется ежегодно в соответствии с графиком отпусков, утверждаемым работодателем с учетом мнения выборного органа первичной профсоюзной организации не позднее чем за две недели до наступления календарного года в порядке, установленном статьей 372 настоящего Кодекса для принятия локальных нормативных актов». Ст. 372 ч. 2: «не позднее пяти рабочих дней со дня получения проекта указанного локального нормативного акта»; ч. 3: «обязан в течение трех дней после получения мотивированного мнения провести дополнительные консультации». Это сроки закона, а не готовый календарь всей подготовки.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 16 перед разделом 1 добавить раздел 0; новые пункты:<\/p>\n<blockquote>\n<p>0.1. График отпусков на следующий календарный год подготавливается подразделением кадрового делопроизводства и утверждается Генеральным директором не позднее 17 декабря текущего года. Указанный срок является внутренним сроком Общества и применяется с соблюдением требований статьи 123 Трудового кодекса Российской Федерации.<\/p>\n<p>0.2. Руководитель кадрового делопроизводства организует сбор пожеланий работников, сверку прав на отпуск, неиспользованных отпусков по рабочим годам и согласование покрытия работ с руководителями подразделений. Пожелания работников не являются утверждённым графиком. Права работников на отпуск в удобное для них время проверяются до утверждения графика.<\/p>\n<p>0.3. Руководитель HR ежегодно утверждает календарь подготовки графика с датами сбора пожеланий, проверки, рассмотрения руководителями подразделений, юридической проверки и передачи на подпись. При наличии соответствующего профсоюзного органа календарь предусматривает получение его мнения и предусмотренные законом консультации.<\/p>\n<p>0.4. КДП хранит утверждённую версию графика и основания последующих изменений; обеспечивает доведение графика до работников в установленном порядке. Изменения рабочих таблиц не изменяют утверждённый график без оформления основания изменения.<\/p>\n<p>0.5. График обязателен для работника и работодателя. Порядок предоставления отпуска по графику, извещения и оплаты установлен настоящим Регламентом и Положением об оплате труда.<\/p>\n<\/blockquote>\n<p>В 12 после 4.11 добавить 4.11.1: <code>Подготовка, утверждение и изменение графика отпусков осуществляются по Регламенту согласования отпусков. График обязателен для работника и работодателя.<\/code> Пункты 16, 1.2 и 1.5 меняются в <a href=\"#/k/OTP-03\">К-OTP-03<\/a>: они больше не создают второй график. Для 2027 года рекомендовать отдельный приказ <strong>вместе с точечными правками<\/strong> 12, 4.18 и 10, 10.12; юридическую достаточность комплекта проверить. Выборы: список выборов руководителя компании: вопросы о порядке графика и норме отдыха; ни один вариант не позволяет отложить требования закона.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП открывает сбор в существующей таблице. 2. Decision Flow получает проверенную КДП версию и направляет руководителю список нестыковок, не подменяя его решение. 3. КДП организует юридическую и, при наличии, профсоюзную процедуру. 4. Генеральный директор утверждает, КДП фиксирует версию, подписи и отдельные извещения.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельный порядок/приказ о графике и профсоюзный орган? Кто и когда утвердил последний график?<\/p>\n<p><strong>Цена вопроса.<\/strong> Арифметически две недели до 01.01.2027 — 18.12.2026; предлагаем 17.12.2026 с запасом, а не выдаём спорный способ исчисления за юридическое заключение. Расчёт программой. Только вычитание пяти рабочих дней даёт 10.12.2026 для профсоюзной передачи к 17.12; <strong>это не безопасный полный срок<\/strong>, поскольку не включает консультации, протокол и подпись. Экономию не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пробелу присланных текстов; средняя по фактическому порядку и календарю внедрения до ответов компании.<\/p>"}, {"id": "К-OTP-02", "slug": "OTP-02", "title": "Просьба работника за две недели не заменяет извещение работодателя под роспись", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "16, п. 1.1; 12, пп. 4.18, 5.6; ТК 123"], ["Тип", "пробел; расходится с практикой"], ["Кто решает", "руководитель HR; юристы — способ подтверждения извещения"], ["Важность", "высокая: работодатель должен доказать своевременное извещение, а отпуск не зависит от повторного желания уйти"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.1: «Сотрудник компании заблаговременно, но не позднее чем за 14 календарных дней до предполагаемого ухода в отпуск направляет по служебной электронной почте соответствующее письмо руководителю проекта и своему непосредственному руководителю». 12, п. 4.18: «заявление по форме о предоставлении очередного отпуска». Ответы HR 10.11, п. 3.1: «За 2-3 недели Руководитель и Сотрудник получают уведомление по почте о предстоящем отпуске».<\/p>\n<p><strong>Что не так.<\/strong> Напоминание на практике есть: утверждать, что КДП никого не извещает, неправильно. Но из ответа нельзя понять, фиксируется ли именно подпись работника и дата, а письмо работника начальнику не выполняет обязанность работодателя. Если график есть, отсутствие новой просьбы не отменяет его обязательность. По ответу HR сотрудники иногда продолжают работу с разрешения руководителя: нужно отличать это от оформленного переноса.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 123 ч. 2–3: «График отпусков обязателен как для работодателя, так и для работника»; «О времени начала отпуска работник должен быть извещен под роспись не позднее чем за две недели до его начала». ТК ст. 124 ч. 2: «работодатель по письменному заявлению работника обязан перенести ежегодный оплачиваемый отпуск на другой срок, согласованный с работником» при перечисленных в этой части нарушениях оплаты/извещения.<\/p>\n<p><strong>Стало (предлагается).<\/strong> 16, п. 1.1 заменить, правило о стране вынести на отдельное решение <a href=\"#/k/OTP-14\">К-OTP-14<\/a>:<\/p>\n<blockquote>\n<p>1.1. Предоставление ежегодного оплачиваемого отпуска в даты утверждённого графика не требует повторного согласования дат и не ставится в зависимость от заявления работника. КДП извещает работника о времени начала отпуска под роспись не позднее чем за две недели до его начала; направление документа организуется заблаговременно с учётом времени получения подписи. При законно введённом электронном документообороте подпись оформляется в установленном для соответствующего документа порядке; в иных случаях — на бумаге. Дата получения подписи и подписанный документ хранятся КДП.<\/p>\n<p>1.1.1. Напоминание по электронной почте или сообщение в корпоративном мессенджере не заменяет требуемое законом извещение под роспись. Отсутствие подписи своевременно передаётся руководителю КДП для организации надлежащего извещения и проверки оснований переноса; молчание не считается подписью или согласием на перенос.<\/p>\n<p>1.1.2. Руководитель организует замещение и освобождение работника от задач на период отпуска. Работа вместо предусмотренного графиком отпуска допускается только после надлежащего оформления изменения его сроков либо отзыва в предусмотренном законом порядке.<\/p>\n<\/blockquote>\n<p>В 12, 4.18 убрать обязательность заявления для отпуска по графику (полная редакция в следующем кейсе). В 10, 10.12 запуск оплаты от даты графика — <a href=\"#/k/OTP-04\">К-OTP-04<\/a>. Отдельное ознакомление с графиком не объявлять автоматически доказательством извещения о каждом отпуске: проверить содержание и дату подписи.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Подтверждённая дата графика запускает задачу КДП в Decision Flow; проектный запас — три недели, правовой предел — две. 2. КДП получает подпись в законном канале и отмечает подтверждение, не просто отправку. 3. До предельного срока неподписанные документы разбирает руководитель КДП. 4. По графику готовятся оформление и оплата без повторного разрешения руководителя; исключение идёт в перенос, не в переписку о загрузке.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Что именно подписывает работник перед отпуском, в какой день и где хранится подтверждение? Бывают ли оформленный отпуск и фактическая работа одновременно?<\/p>\n<p><strong>Цена вопроса.<\/strong> На условном отпуске с 05.04.2027 крайняя дата извещения по вычитанию четырнадцати дней — 22.03.2027 (Расчёт программой.). Стоимость спора и время напоминаний не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по обязанности; средняя по тому, какие доказательства уже собирает КДП.<\/p>"}, {"id": "К-OTP-03", "slug": "OTP-03", "title": "Три маршрута заявления и бумажный оригинал против 1С Кабинета и Диадока", "imp": "высокая", "docs": ["10", "12", "16"], "meta": [["Документы", "16, пп. 1.3–1.6, прил. 1–2; 12, п. 4.18; 10, п. 10.12"], ["Тип", "противоречие между документами; расходится с практикой; лишняя ручная работа"], ["Кто решает", "руководитель HR; юристы — форма и ЭДО; руководитель КДП — единый маршрут"], ["Важность", "высокая: один отпуск получает разные сроки, адресатов и доказательства"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.3: «подает заявление на отпуск по установленному шаблону (Приложение № 1 или Приложение № 2) на бумажном носителе с собственноручной подписью». 16, п. 1.4: «в виде сканированной копии на имя начальника кадрового делопроизводства, специалиста по кадровому делопроизводству» за «5 (пять) рабочих дней». 16, п. 1.6: оригинал «не позднее чем за 3 (три) рабочих дня». 12, п. 4.18: «Не менее чем за 2 недели» заявление «в Бухгалтерию» с «ФИО работника, которому поручается временно исполнять обязанности». 10, п. 10.12: оплата при условии заявления «не менее, чем за две недели». В форме 16, прил. 1, нет поля замещающего; в прил. 2 нет поля причины отпуска без сохранения заработной платы. По встрече 11.11: заявка в 1С Кабинете, согласование задачей в 1С, заявление через Диадок, приказ делает КДП.<\/p>\n<p><strong>Что не так.<\/strong> Сотрудник и КДП могут не знать, какой из сроков и адресатов главнее. Скан и последующий бумажный оригинал дублируют операцию; фактический электронный маршрут не совпадает с текстом 2021 года. Для отпуска по утверждённому графику заявление не должно быть дополнительным разрешением; для отпуска вне графика нужен отдельный тип заявки. Нельзя утверждать, что текущий ЭДО юридически введён для всех: в ПВТР он описан для дистанционных работников, а из встреч следует более широкая практика. Поэтому сначала проверить локальный акт об ЭДО, категории работников и согласия.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.2 ч. 2: «Электронный документооборот вводится работодателем на основании локального нормативного акта»; такой акт содержит, в частности, «перечень электронных документов и перечень категорий работников». ТК ст. 22.3 ч. 8–9: «Работник или лицо, поступающее на работу, осуществляющие взаимодействие с работодателем посредством электронного документооборота, вправе направлять в адрес работодателя заявления, уведомления и сообщения» через информационную систему работодателя; направленные так сообщения считаются полученными «на следующий рабочий день после их направления». ТК ст. 8: «Нормы локальных нормативных актов, ухудшающие положение работников ... не подлежат применению».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 16 заменить пп. 1.3–1.6 и добавить:<\/p>\n<blockquote>\n<p>1.3. Для ежегодного оплачиваемого отпуска по утверждённому графику отдельное заявление работника не является условием предоставления отпуска. Подтверждение получения извещения оформляется по п. 1.1 настоящего Регламента.<\/p>\n<p>1.4. Для отпуска вне утверждённого графика, переноса, отзыва, отпуска без сохранения заработной платы, учебного отпуска и иного отсутствия работник направляет одну заявку в информационной системе работодателя, если такой порядок введён работодателем для данного документа и категории работников. В заявке указываются вид отпуска или отсутствия, дата начала и окончания либо количество календарных дней, основание и приложенные подтверждающие документы, если они требуются законом или настоящими локальными нормативными актами.<\/p>\n<p>1.5. Заявка направляется непосредственному руководителю для решения только в случаях, когда его решение требуется законом, графиком или настоящим Регламентом. Для обязательного отпуска без сохранения заработной платы отсутствие разрешения руководителя не является основанием для отказа.<\/p>\n<p>1.6. КДП проверяет заявку, формирует кадровый документ и направляет его на подписание в установленном работодателем ЭДО. Если ЭДО не применяется к работнику или документу, КДП принимает бумажный документ. Скан заявления не является заменой оригинала, если иной законный способ подписания не установлен.<\/p>\n<p>1.7. Сроки подачи заявки устанавливаются отдельно для каждого вида отсутствия и не могут отменять график, право на обязательный отпуск или срок, установленный законом. Техническое отсутствие заявки по графику не переносит отпуск автоматически.<\/p>\n<p>1.8. Форма ежегодного отпуска содержит вид отпуска, даты или количество дней, рабочий год при необходимости, дату и подпись работника либо электронную подпись; форма отпуска без сохранения заработной платы содержит причину и подтверждение, если оно нужно. Визирование и поле замещающего включаются только если это необходимо для маршрута, но не подменяют извещение.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.18 заменить: <code>Для отпуска по утверждённому графику заявление не является условием предоставления. Для отпуска вне графика и иных видов отсутствия заявление подаётся по Регламенту согласования отпусков. КДП оформляет документ и хранит подтверждение его подписания.<\/code> В 10, п. 10.12 заменить условие «при условии» на ссылку на дату графика и законный маршрут оплаты (<a href=\"#/k/OTP-04\">К-OTP-04<\/a>). В формах 16 убрать персонализированный адресат и добавить поля только после юридической проверки; не переносить в них имена.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. 1С Кабинет принимает один тип заявки и вид отсутствия. 2. Правила маршрута проверяют: график, обязательность, рабочий год и подтверждающий документ. 3. Задача уходит только нужному решающему; при отпуске по графику повторного согласования нет. 4. КДП создаёт приказ/кадровый документ в Диадоке или на бумаге согласно проверенному ЭДО-порядку. 5. Система хранит идентификатор заявки, решение, подпись и ссылку на приказ; старую таблицу и почтовые копии не ведут параллельно после переходного периода.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Действует ли отдельный ЛНА по ЭДО для всех работников, какие заявления включены и какие категории дали согласие? Может ли 1С Кабинет передавать заявку в КДП без ручной пересылки? Кто сейчас получает заявление: КДП или бухгалтерия?<\/p>\n<p><strong>Цена вопроса.<\/strong> Для условного отпуска с 05.04.2027 арифметические даты по старым маршрутам: 14 календарных дней — 22.03, 5 рабочих дней — 29.03, 3 рабочих дня — 31.03 (Расчёт программой.); разрыв между 5 рабочими и 14 календарными днями — 7 календарных дней. Часы ручной работы не замеряли.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по документному расхождению и содержанию форм; средняя по законности массового ЭДО до получения ЛНА об ЭДО.<\/p>"}, {"id": "К-OTP-04", "slug": "OTP-04", "title": "Условие заявления в положении об оплате не связано с датой графика", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, п. 10.12; 12, п. 4.18; ТК 124, 136; КоАП 5.27, ч. 6"], ["Тип", "противоречие между документами; проверка юристами"], ["Кто решает", "руководитель HR; бухгалтерия; юристы до утверждения текста"], ["Важность", "высокая: задержка отпускных — отдельный денежный и административный риск"]], "html": "<p><strong>Было.<\/strong> 10, п. 10.12: «Оплата отпуска Работникам производится не позднее чем за три дня до его начала, при условии, что Работник, уходящий в отпуск, написал об этом заявление не менее, чем за две недели». 12, п. 4.18: «Не менее чем за 2 недели до предполагаемого отпуска работник должен предоставить в Бухгалтерию заявление». По ответам HR отпуск в 1С Кабинете согласует руководитель, заявление приходит через Диадок, приказ делает КДП.<\/p>\n<p><strong>Что не так.<\/strong> Законный срок оплаты начинается от начала отпуска, а условие заявления привязывает его к шагу, который в присланных документах расходится по сроку и адресату с 16, п. 1.4. Для отпуска по графику такой фильтр может оставить сотрудника без оплаты в установленный срок, если сотрудник не подал повторное заявление. Приёмка 13.11 прямо оставила оценку возможного ухудшения для юристов; нарушение не объявляется установленным без проверки фактов оплаты.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 136 ч. 9: «Оплата отпуска производится не позднее чем за три дня до его начала». ТК ст. 124 ч. 2: «Если работнику своевременно не была произведена оплата за время ежегодного оплачиваемого отпуска ... то работодатель по письменному заявлению работника обязан перенести ежегодный оплачиваемый отпуск». КоАП ст. 5.27 ч. 6: «Невыплата или неполная выплата в установленный срок заработной платы, других выплат, осуществляемых в рамках трудовых отношений ... влечет предупреждение или наложение административного штрафа на должностных лиц в размере от десяти тысяч до двадцати тысяч рублей ... на юридических лиц - от тридцати тысяч до пятидесяти тысяч рублей».<\/p>\n<p><strong>Стало (предлагается).<\/strong> 10, п. 10.12 заменить:<\/p>\n<blockquote>\n<p>10.12. Оплата ежегодного оплачиваемого отпуска производится не позднее чем за три дня до его начала. Для отпуска по утверждённому графику бухгалтерия получает основание для расчёта из утверждённого графика и кадрового документа; отсутствие отдельного заявления работника не является основанием для переноса срока оплаты. Для отпуска вне графика, переноса, отзыва и иных видов отсутствия основание и порядок оплаты определяются кадровым документом и настоящим Положением с соблюдением Трудового кодекса Российской Федерации. При нарушении срока КДП и бухгалтерия незамедлительно передают информацию руководителю HR и оформляют предусмотренные законом действия.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.18 применить редакцию <a href=\"#/k/OTP-03\">К-OTP-03<\/a>. В процесс «График на год» добавить обязательный выход: для каждой даты — задача бухгалтерии с датой начала и контрольным сроком оплаты. В 10, п. 11.1 не повторять новые санкции, а оставить ссылку на закон; проверка фактических начислений по закрытому архиву невозможна.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Утверждение графика и приказ/кадровый документ передают дату начала в бухгалтерию. 2. КДП проверяет извещение и реквизиты. 3. Бухгалтерия ставит внутренний контроль раньше правового предела. 4. После выплаты хранит подтверждение; просрочку сразу эскалирует, а не ждёт заявления. 5. Отдельно сверяется перенос при позднем извещении или оплате.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли случаи оплаты позже трёх дней? Вычисляет ли 1С контрольную дату автоматически? На основании чего бухгалтерия сейчас считает отпускные по отпуску из графика?<\/p>\n<p><strong>Цена вопроса.<\/strong> Для условного начала 05.04.2027 арифметическое «три календарных дня» даёт 02.04.2027; внутренний срок предлагаем 01.04.2027 (Расчёт программой.), потому что праздничный/выходной календарь и порядок фактического зачисления в базе не проверены. Рубли задержек и компенсаций не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту ст. 136 и необходимости убрать неоднозначное условие; средняя по квалификации уже случившихся выплат.<\/p>"}, {"id": "К-OTP-05", "slug": "OTP-05", "title": "Перенос и накопленные дни не имеют полного маршрута, а половина долга может оставаться просроченной", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "12, п. 4.21; 16, пп. 1.2, 1.5; ТК 123–124; предложение по графику 2027"], ["Тип", "пробел; риск расхода с законом; расходится с проектом решения"], ["Кто решает", "руководитель компании — вариант погашения; руководитель HR — процесс; юристы — законность плана"], ["Важность", "высокая: по выгрузке КДП на 11.11.2026 у 60 из 232 сотрудников больше 30 дней; дни сверх 30 стоят 23,5 млн руб."]], "html": "<p><strong>Было.<\/strong> 12, п. 4.21: «В исключительных случаях, когда предоставление отпуска работнику в текущем году может неблагоприятно отразиться на нормальном ходе работы Общества, допускается с согласия работника перенесение отпуска на следующий рабочий год». Там же: «При увольнении работник получает компенсацию за все неиспользованные дни отпуска». 16, п. 1.2 допускает «ближайшие свободные даты возможного отпуска», но срока и основания переноса не задаёт. В ответах HR 10.11: «Свыше 30-ти дней отпуска = 56 человек из 232». Встреча 11.11 подтверждает, что выгрузка и дата утверждения графика ещё не получены.<\/p>\n<p><strong>Что не так.<\/strong> ЛНА требует согласия для исключительного переноса, но не задаёт кто проверяет причину, рабочий год, новую дату, уведомление и запись. Проект графика предлагает половину накопленных дней в 2027 году, остальное — в 2028-м. Это может сократить долг, но для части дней оставить превышение законного предела; нельзя показывать такой план руководителю HR как готовый без ответа юристов. По практике руководитель иногда разрешает продолжать работу из-за загрузки — без приказа это не оформленный перенос.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 124 ч. 3: «В исключительных случаях, когда предоставление отпуска работнику в текущем рабочем году может неблагоприятно отразиться на нормальном ходе работы организации, индивидуального предпринимателя, допускается с согласия работника перенесение отпуска на следующий рабочий год, если иное не предусмотрено настоящим Кодексом». Далее та же часть: «При этом отпуск должен быть использован не позднее 12 месяцев после окончания того рабочего года, за который он предоставляется». Ч. 4: «Запрещается непредоставление ежегодного оплачиваемого отпуска в течение двух лет подряд». ТК ст. 8: «Нормы локальных нормативных актов, ухудшающие положение работников ... не подлежат применению».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.21 заменить и добавить:<\/p>\n<blockquote>\n<p>4.21. Перенос ежегодного оплачиваемого отпуска допускается только в случаях и порядке, предусмотренных статьёй 124 Трудового кодекса Российской Федерации. Для переноса по производственной необходимости руководитель подразделения направляет в КДП обоснование, указывает рабочий год, количество дней, новую дату и подтверждение согласия работника. Руководитель КДП проверяет, что перенос исключительный, новая дата не выходит за установленный законом предел и работник не лишается отпуска два года подряд. Перенос оформляется приказом или иным кадровым документом до даты начала первоначального отпуска; запись хранится вместе с графиком.<\/p>\n<p>4.21.1. Если оплата отпуска произведена несвоевременно либо работник извещён позднее чем за две недели, КДП по письменному заявлению работника оформляет перенос на согласованный срок.<\/p>\n<p>4.21.2. Отсутствие работника в утверждённые даты по причине производственной загрузки не оформляется продолжением работы по устной договорённости. Руководитель обязан своевременно инициировать предусмотренный законом перенос либо отзыв.<\/p>\n<p>4.21.3. Для каждого неиспользованного дня ведётся связь с рабочим годом, основанием переноса, согласованной датой и датой фактического отпуска. Накопленные дни не списываются без предусмотренного законом основания.<\/p>\n<\/blockquote>\n<p>В 16, пп. 1.2 и 1.5 заменить рабочие отметки графика на описание проверки заявки вне графика; отменить «ближайшие свободные даты» как единственное правило. В проекте графика 2027 варианты А/Б оставить только как вопросы руководителю компании; предложение «половина» не утверждать до юристов, как уже указано в вопросах от 13.11. В журнале процесса «Перенос» хранить причину, согласие, рабочий год, новую дату и приказ.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Еженедельная выгрузка 1С без ФИО показывает остаток, рабочий год и запланированные даты. 2. Красный флаг создаётся при риске двух лет или 12-месячного предела; руководитель группы объясняет потребность. 3. КДП проверяет основания, получает согласие и предлагает дату; юрист отвечает по спорным накопленным дням. 4. Подписывается кадровый документ, график обновляется одной версией. 5. Раз в месяц HR получает список не закрытых переносов и причин.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Включают ли остатки 28 дней 2027 года? Как разложить остатки по рабочим годам? Есть ли оформленные приказы о прежних переносах? Что на деле происходит, когда сотрудник не уходит из-за проектной загрузки?<\/p>\n<p><strong>Цена вопроса.<\/strong> По выгрузке КДП об остатках отпусков на 11.11.2026 (сводка программой, без ФИО): 232 сотрудника, остаток всего 6 238,97 дня; больше 30 дней у 60 человек (25,9%; в ответе HR 10.11 было 56), у 22 больше 60 дней, у 12 больше 90, у 4 больше 120. Дни сверх 30 — 1 878,73 дня, компенсация за них по среднему заработку на 12.11.2026 — 23 544 296,90 руб. (совпадает с итоговой строкой выгрузки). Для сравнения, при увольнениях с 07.09 по 13.11.2026 компенсация за 15 человек составила 2 647 748,79 руб. Сценарий «половина в 2027» (Расчёт программой.) пересчитан от ответа HR и требует пересчёта по выгрузке с разбивкой по рабочим годам. Условный пример, не данные отдельного сотрудника: при остатке 175 дней, если он уже включает 28 дней нового года, 28 + (175 − 28) / 2 = 101,5, с округлением вверх 102 дня в 2027; если не включает, 28 + 175 / 2 = 115,5, с округлением вверх 116 дней; значения 175 и 203 — соответственно без и с добавлением 28. В рублях — в начале этого блока, по выгрузке; разбивки по рабочим годам в выгрузке нет. Законность оставления второй половины до 2028 не установлена.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пробелу маршрута и данным HR; низкая по допустимому плану погашения без разложения рабочих лет и ответа юристов.<\/p>"}, {"id": "К-OTP-06", "slug": "OTP-06", "title": "Деление отпуска: интервал в три месяца не согласован с правилом частей", "imp": "средняя", "docs": ["12"], "meta": [["Документы", "12, пп. 4.15–4.16; список выборов руководителя компании: выбор 4; ТК 125"], ["Тип", "правило компании без маршрута; противоречие проекту выбора"], ["Кто решает", "руководитель компании — выбор нормы; юристы — проверка ухудшения"], ["Важность", "средняя: сотрудник и руководитель получают разные ожидания о допустимой частоте частей"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.15: «По соглашению между работником и работодателем ежегодный оплачиваемый отпуск может быть разделен на части. При этом хотя бы одна из частей этого отпуска должна быть не менее 14 календарных дней». 12, п. 4.16: «интервал между двумя периодами отпусков не должен быть менее 3 месяцев. Иное использование отпуска допускается по согласованию с непосредственным руководителем». В выборе 4 политики отпуска варианты различаются: любые части; один день не больше трёх раз в год; части не короче пяти рабочих дней. Это черновой выбор руководителя компании, не действующее правило.<\/p>\n<p><strong>Что не так.<\/strong> ПВТР одновременно задаёт минимум 14 дней, интервал и возможность иного использования по согласованию, но не говорит, кто фиксирует соглашение и как считать «период». Правило трёх месяцев не заменяет соглашение о частях; вариант лимита однодневных частей из черновика нельзя выдавать за ЛНА. Допустимый график зависит от длины каждой части и прав работника; числовой лимит из одного интервала здесь не выводим.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 125 ч. 1: «По соглашению между работником и работодателем ежегодный оплачиваемый отпуск может быть разделен на части. При этом хотя бы одна из частей этого отпуска должна быть не менее 14 календарных дней».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.16 заменить:<\/p>\n<blockquote>\n<p>4.16. Остаток ежегодного оплачиваемого отпуска после части продолжительностью не менее 14 календарных дней распределяется между работником и работодателем по соглашению сторон и отражается в утверждённом графике. Само по себе превышение или сокращение интервала между частями не заменяет соглашения сторон и не отменяет требования п. 4.15. Ограничения на количество и минимальную длительность остальных частей устанавливаются отдельным решением работодателя и применяются после доведения их до работников.<\/p>\n<p>4.16.1. Заявка на изменение дат части отпуска направляется в КДП с указанием согласованной новой даты и подтверждением согласия работника и руководителя, если такое согласование требуется. КДП проверяет, что после изменения сохраняется часть не менее 14 календарных дней.<\/p>\n<\/blockquote>\n<p>До выбора руководителя компании в проекте правил отпусков не переносить вариант Б как обязательный. После выбора записать одну норму в 12 и один алгоритм в 16/процессе «Отпуск по графику»; не оставлять одновременно интервал, лимит однодневных частей и «не короче недели».<\/p>\n<p><strong>Как будет работать.<\/strong> 1. При сборе графика работник предлагает части. 2. КДП проверяет 14 календарных дней и рабочий год. 3. Руководитель группы согласует производственную возможность, но не может единолично убрать законный минимум. 4. График фиксирует согласованные части; изменение проходит через КДП.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сохраняют ли сейчас интервал три месяца? Что означает «период» — дата начала или весь отрезок? Как фиксируется согласие на остальные части? Какой вариант выберет руководитель компании?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; длительность операций согласования и число отказов неизвестны.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту 12 и ТК 125; средняя по тому, как правило применяется на деле.<\/p>"}, {"id": "К-OTP-07", "slug": "OTP-07", "title": "Отзыв из отпуска записан без новых запретов и без исполнителя приказа", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "12, п. 4.20; 16, п. 1.7; ТК 125 в ред. 25.05.2026; ФЗ 144-ФЗ от 25.05.2026"], ["Тип", "устарело после изменения закона; пробел маршрута"], ["Кто решает", "юристы; руководитель HR — процесс; работодатель — подписант приказа"], ["Важность", "высокая: отзыв затрагивает согласие работника и защищённые категории"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.20: «Отзыв работника из отпуска допускается только с его согласия и по приказу работодателя. Неиспользованная в связи с этим часть отпуска должна быть предоставлена по выбору работника в удобное для него время в течение текущего рабочего года или присоединена к отпуску за следующий рабочий год». 16, п. 1.7 распространяет общий алгоритм на «ежегодного оплачиваемого отпуска, отпуска без сохранения заработной платы, учебного отпуска и иных случаев отсутствия». ФЗ 144‑ФЗ от 25.05.2026 вступил в силу 01.09.2026: ввёл части 3–4 ст. 125 и изложил прежнюю часть 3 как часть 5. Запрет для несовершеннолетних и беременных не появился впервые в 2026 году.<\/p>\n<p><strong>Что не так.<\/strong> Формула 12 не содержит запрета отзыва несовершеннолетних и беременных, а также специального правила для вредных/опасных условий. Закон действует и без повторения в ЛНА, но кадровому маршруту не хватает проверки категории, письменного согласия, новой даты и приказа. Нельзя отзывать человека только потому, что руководитель просит в почте.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 125 ч. 2: «Отзыв работника из отпуска допускается только с его согласия». Ч. 3: «Отзыв из отпуска работника, занятого на работах с вредными и (или) опасными условиями труда, не допускается, за исключением случаев предотвращения катастрофы, производственной аварии либо устранения последствий катастрофы, производственной аварии или стихийного бедствия, требующих непосредственного привлечения указанного работника исходя из возложенной на него трудовой функции». Ч. 5: «Не допускается отзыв из отпуска работников в возрасте до восемнадцати лет и беременных женщин». ФЗ 144‑ФЗ: «Настоящий Федеральный закон вступает в силу с 1 сентября 2026 года».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.20 заменить:<\/p>\n<blockquote>\n<p>4.20. Отзыв работника из ежегодного оплачиваемого отпуска допускается только с его письменного согласия и по приказу работодателя. До подготовки приказа КДП проверяет, не относится ли работник к категории, отзыв которой запрещён статьёй 125 Трудового кодекса Российской Федерации, и фиксирует основание отзыва, использованные дни и новую дату. Для работника, занятого на работах с вредными и (или) опасными условиями труда, отзыв допускается только в случаях и по порядку, установленным статьёй 125 Трудового кодекса Российской Федерации. Неиспользованная часть предоставляется по выбору работника в удобное для него время в текущем рабочем году или присоединяется к отпуску за следующий рабочий год.<\/p>\n<\/blockquote>\n<p>В 16, п. 1.7 добавить: <code>Порядок отзыва не применяется к отпуску без сохранения заработной платы и учебному отпуску, если закон не устанавливает иное; для ежегодного оплачиваемого отпуска действует п. 4.20 ПВТР.<\/code> В процессах добавить карточку отзыва и запрет закрыть её без согласия, проверки категории и приказа. Если есть вредные условия, проверить коллективный договор/ЛНА для порядка специального случая.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель подаёт обоснование через процесс. 2. КДП проверяет вид отпуска и защищённую категорию. 3. Работник подписывает согласие либо отказ. 4. Уполномоченный работодатель издаёт приказ. 5. КДП и работник выбирают новую дату, обновляют график и журнал.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли работники во вредных/опасных условиях и где хранится список? Как получают письменное согласие и кто подписывает приказ? Были ли отзывы после 01.09.2026?<\/p>\n<p><strong>Цена вопроса.<\/strong> Денежную цену не считали; остаток дней после отзыва должен попасть в реестр. Факт отзывов не подтверждён.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по изменению закона и необходимости проверки категорий; средняя по наличию таких категорий и практике.<\/p>"}, {"id": "К-OTP-08", "slug": "OTP-08", "title": "Общий маршрут за 14 дней и разрешение руководства не подходят обязательному отпуску за свой счёт", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "16, пп. 1.1, 1.7, прил. 2; 12, п. 4.22"], ["Тип", "противоречие закону при буквальном применении общего согласования к обязательным случаям"], ["Кто решает", "руководитель HR; юристы до утверждения"], ["Важность", "высокая: внезапное обязательное основание нельзя блокировать плановым сроком и визой"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.7: «Указанный в настоящем разделе алгоритм (порядок) является релевантным для ... согласования/предоставления ... отпуска без сохранения заработной платы, учебного отпуска и иных случаев отсутствия сотрудника на работе в рабочее время». 12, п. 4.22: «по его письменному заявлению и с разрешения руководства Общества может быть предоставлен отпуск без сохранения заработной платы». Приложение 2 содержит вид отпуска, дни, даты и визу руководителя, но не основание.<\/p>\n<p><strong>Что не так.<\/strong> ПВТР верно описывает отпуск по соглашению, но не отделяет обязательные случаи. Применение ко всем случаям срока 14 дней, свободных дат и разрешения лишает смысла право на отпуск при внезапном событии. Не установлено, что КДП действительно отказывает: оценка относится к буквальному универсальному маршруту. Извлекать причину из общей переписки неудобно и раскрывает лишние сведения широкому списку копий.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 128 ч. 2: «Работодатель обязан на основании письменного заявления работника предоставить отпуск без сохранения заработной платы»; в том числе «работающим пенсионерам по старости (по возрасту) - до 14 календарных дней в году», «работающим инвалидам - до 60 календарных дней в году», «работникам в случаях рождения ребенка, регистрации брака, смерти близких родственников - до пяти календарных дней». Перечень в базе шире этих примеров: при сборке правил нельзя ограничиться ими.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Сохранить текст 12, 4.22 про отпуск по соглашению и добавить:<\/p>\n<blockquote>\n<p>4.22.1. В случаях, предусмотренных частью второй статьи 128 Трудового кодекса Российской Федерации, иными нормами Трудового кодекса, федеральными законами либо коллективным договором, отпуск без сохранения заработной платы предоставляется на основании письменного заявления работника в пределах соответствующей гарантии. Разрешение непосредственного руководителя не является дополнительным условием обязательного отпуска.<\/p>\n<p>4.22.2. Работник указывает основание и даты, обращается в КДП при возникновении основания; КДП проверяет право и продолжительность и организует оформление безотлагательно. Сроки предварительной подачи и проверки доступности дат, установленные для планового ежегодного отпуска, к обязательным случаям не применяются. Руководитель получает информацию о сроках отсутствия в объёме, необходимом для организации работы.<\/p>\n<\/blockquote>\n<p>В 16 вместо распространения общего алгоритма на всё отсутствие принять разграничение <a href=\"#/k/OTP-10\">К-OTP-10<\/a>; в прил. 2 добавить <code>Основание отпуска: ____; подтверждающий документ (если требуется): ____<\/code>. Юридически значимое заявление подписывается по <a href=\"#/k/OTP-03\">К-OTP-03<\/a>; указание причины в карточке не отменяет письменной формы. Не превращать уведомление руководителя в разрешение.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник выбирает обязательный или согласуемый отпуск и основание. 2. КДП проверяет законную гарантию и использованный лимит, не отправляя обязательный случай начальнику на разрешение. 3. Подписывается заявление и оформляется отсутствие. 4. Руководитель получает даты, бухгалтерия — вид неоплачиваемого периода. Срочный случай при сбое системы КДП принимает на бумаге, а не возвращает ждать срока.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас оформляют внезапный обязательный отпуск, какие документы и сроки подтверждения требуют? Есть ли дополнительные гарантии коллективного договора?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; сведения об отказах и длительности согласования отсутствуют.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по разграничению права и соглашения; средняя по применению старого маршрута на деле.<\/p>"}, {"id": "К-OTP-09", "slug": "OTP-09", "title": "Три оплачиваемых дня по семейному событию есть, но смешаны с материальной помощью и общим маршрутом", "imp": "средняя", "docs": ["10", "12", "16"], "meta": [["Документы", "10, пп. 8.2, 8.7–8.8; 16, п. 1.7, прил. 1–2; 12, п. 4.22"], ["Тип", "пробел"], ["Кто решает", "руководитель HR; юристы и бухгалтерия — оформление и оплата"], ["Важность", "средняя: существующую льготу легко потерять при переписывании политики"]], "html": "<p><strong>Было.<\/strong> 10, п. 8.7: «Работнику по личному заявлению предоставляется 3 (Три) календарных дня дополнительного оплачиваемого отпуска в случаях рождения ребенка, регистрации брака, смерти близкого родственника, указанного в п. 8.2». Пункт 8.8: «Предоставление материальной помощи производится при представлении Работником документов, подтверждающих наступление чрезвычайных обстоятельств». В 16 формы предусмотрены для ежегодного оплачиваемого отпуска и отпуска без сохранения заработной платы; отдельной формы семейной льготы нет.<\/p>\n<p><strong>Что не так.<\/strong> Это уже действующее преимущество компании, не новая рекомендация улья. Условие 8.8 сформулировано о материальной помощи: автоматически распространять его на отпуск и отказывать без справки нельзя. Три оплачиваемых дня не заменяют до пяти неоплачиваемых по обязательному основанию; сотрудник выбирает нужные виды отдельно. Дата использования семейной льготы, необходимость подтверждения и маршрут расчёта требуют уточнения, а не самостоятельного ограничения её годовым лимитом.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 116 ч. 2: «Работодатели с учетом своих производственных и финансовых возможностей могут самостоятельно устанавливать дополнительные отпуска для работников»; «Порядок и условия предоставления этих отпусков определяются коллективными договорами или локальными нормативными актами». ТК ст. 128 ч. 2: «работникам в случаях рождения ребенка, регистрации брака, смерти близких родственников - до пяти календарных дней» без сохранения заработной платы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Пункт 10, 8.7 сохранить по объёму гарантии, добавить:<\/p>\n<blockquote>\n<p>8.7.1. Указанный в п. 8.7 оплачиваемый отпуск оформляется по личному заявлению работника с указанием события и дат, отдельно от заявления о материальной помощи. Он не уменьшает ежегодный основной отпуск и не заменяет обязательный отпуск без сохранения заработной платы по статье 128 Трудового кодекса Российской Федерации. КДП регистрирует заявление при обращении работника, формирует кадровый документ и направляет сведения для оплаты в бухгалтерию. Внезапное событие не требует предварительного планового согласования за 14 дней.<\/p>\n<\/blockquote>\n<p>В 16 добавить отдельный вид заявки <code>Дополнительный оплачиваемый отпуск по п. 8.7 Положения об оплате труда<\/code>; в 12 после 4.17 — ссылку на 10, 8.7. В проекте правил отпусков снять предположение, что ответ о собственных днях неизвестен: норма уже найдена; подтверждение применения получает HR. Новые сроки использования, годовые лимиты и обязательные справки не устанавливать до решения работодателя и проверки юристов.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник указывает событие, вид и даты в одной заявке. 2. КДП проверяет основание и отдельно разъясняет неоплачиваемую гарантию. 3. Бухгалтерия получает кадровый документ на оплачиваемые дни. 4. Заявка о материальной помощи при необходимости идёт своим маршрутом и не блокирует отпуск.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Когда можно использовать три дня относительно события, как подтверждают событие и как оформляют срочную оплату? Это правило реально применяют?<\/p>\n<p><strong>Цена вопроса.<\/strong> Число оплачиваемых дней — 3 из п. 8.7, не экономия. Возможные 3 оплачиваемых + 5 неоплачиваемых = 8 дней отсутствия по отдельным основаниям и заявлениям (Расчёт программой.), не единый автоматический восьмидневный отпуск. Рубли не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по наличию льготы; средняя по деталям её применения.<\/p>"}, {"id": "К-OTP-10", "slug": "OTP-10", "title": "Один алгоритм 16, п. 1.7 смешивает ежегодный, учебный, неоплачиваемый отпуск и иные отсутствия", "imp": "высокая", "docs": ["10", "12", "16"], "meta": [["Документы", "16, п. 1.7; 12, пп. 4.6, 4.9, 4.23; 10, п. 10.4"], ["Тип", "ошибка конструкции процесса"], ["Кто решает", "руководитель HR; КДП; юристы — специальные виды отпусков"], ["Важность", "высокая: разные основания и документы получают один срок и один набор виз"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.7: «Указанный в настоящем разделе алгоритм (порядок) является релевантным для ... согласования/предоставления ежегодного оплачиваемого отпуска, отпуска без сохранения заработной платы, учебного отпуска и иных случаев отсутствия сотрудника на работе в рабочее время». 12, п. 4.23: «в первый день невыхода уведомить об этом своего непосредственного руководителя» и после восстановления «предъявить ... оправдательные документы (лист нетрудоспособности)». 12, п. 4.9 требует письменное заявление для изменения графика работы приказом генерального директора. 10, п. 10.4 отдельно исключает отпуск без сохранения зарплаты из фактически оплачиваемого времени.<\/p>\n<p><strong>Что не так.<\/strong> У ежегодного отпуска есть график и извещение, у обязательного неоплачиваемого — заявление и гарантия, у учебного — документы, у болезни — уведомление и листок нетрудоспособности, у изменения графика — отдельный приказ. Общий маршрут с одинаковыми 14/5/3 днями и визами может задержать одно событие и неправильно учесть другое. Формулировка 16 не назначает исполнителя проверки основания.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 122 ч. 1: «Оплачиваемый отпуск должен предоставляться работнику ежегодно». ТК ст. 128 ч. 1: «По семейным обстоятельствам и другим уважительным причинам работнику по его письменному заявлению может быть предоставлен отпуск без сохранения заработной платы». ТК ст. 8: «Нормы локальных нормативных актов, ухудшающие положение работников ... не подлежат применению».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 16, раздел 1, после 1.7 вставить:<\/p>\n<blockquote>\n<p>1.8. Виды отсутствия оформляются по самостоятельным маршрутам:\n1) ежегодный оплачиваемый отпуск по графику — по разделу 0 и п. 1.1 настоящего Регламента;\n2) ежегодный оплачиваемый отпуск вне графика и перенос — по заявке и проверке условий статьи 124 Трудового кодекса Российской Федерации;\n3) отпуск без сохранения заработной платы по соглашению — по письменному заявлению и соглашению сторон;\n4) обязательный отпуск без сохранения заработной платы — по письменному заявлению и проверке права без разрешения руководителя как дополнительного условия;\n5) учебный отпуск и иные специальные отпуска — по заявлению и документам, предусмотренным применимыми нормами;\n6) временная нетрудоспособность — по уведомлению о невыходе и документу, предусмотренному законом;\n7) изменение режима работы и иные отсутствия — по самостоятельному кадровому маршруту.<\/p>\n<p>1.9. КДП определяет маршрут по виду события, проверяет документы и срок, формирует кадровый документ и ведёт журнал решения. Руководитель отвечает за замещение только после получения сообщения о подтверждённых датах; он не утверждает право на обязательное отсутствие.<\/p>\n<\/blockquote>\n<p>В 16, п. 1.7 заменить «релевантным для ... иных случаев» ссылкой на 1.8. В 12, пп. 4.6, 4.9, 4.23 сохранить правила уведомления и документов, но добавить ссылки на 1.8; в 10, п. 10.4 не использовать формулу «не учитывается» как решение о стаже отпуска — это отдельная проверка КДП по ТК 121. В каталог процессов добавить отдельные строки вместо универсальной <code>Отпуска и иное отсутствие<\/code>.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Событие или заявление поступает в 1С Кабинет/КДП. 2. Форма требует выбрать вид; неверный вид возвращается автору с причиной. 3. КДП проверяет право и документы. 4. Только нужные роли получают задачу. 5. Решение и подтверждение идут в Диадок или на бумаге; изменение графика и табеля получает бухгалтерия.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие виды учебного отпуска и подтверждения встречаются? Есть ли отдельные формы для болезни, переноса и изменения графика? Кто сейчас классифицирует заявку в 1С?<\/p>\n<p><strong>Цена вопроса.<\/strong> Времени по универсал
