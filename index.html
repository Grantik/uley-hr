тся. Условия допуска сверх 120 часов проверяются дополнительно по пунктам 2.2.1–2.2.2.<\/p>\n<\/blockquote>\n<p>В формах убрать самодекларацию как доказательство медицинского допуска; вместо неё поле КДП: «Необходимость и наличие предусмотренного законом заключения проверены; дата проверки ___». Медицинские документы не прикладывать к общей карточке согласования. При объединении пп. 2.5 и 2.7 сохранить ученический договор и все иные категории. Ночной размер 10, п. 4.6 не уменьшать; юридическую проверку минимума сделать до изменения.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель указывает вид работ и ночные интервалы. 2. КДП проводит проверку без передачи диагноза руководителю. 3. Работник подписывает необходимые согласия и ознакомление с правом отказа. 4. КДП подтверждает допуск либо возвращает заявку. 5. Бухгалтерия отдельно учитывает ночную доплату.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где хранится актуальная проверка категорий и кто подтверждает медицинский допуск?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; штрафные суммы без разбора состава нарушения не приводятся.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по необходимости разделить проверки; полнота категорий и минимум ночной оплаты — юристам.<\/p>"}, {"id": "К-VREM-17", "slug": "VREM-17", "title": "Изменение графика приказом не закрывает обязательное неполное время", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "12, пп. 4.2, 4.3, 4.9; 03, п. 2.16"], ["Тип", "устарело; пробел"], ["Кто решает", "HR, КДП и юристы"], ["Важность", "высокая: заявление по обязательному основанию может зависнуть в обычном согласовании"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.9: «По согласованию с непосредственным руководителем и письменному заявлению работника с указанием времени и уважительных причин Работнику может быть изменён или смещён график работы только приказом Генерального директора Общества.» 03, п. 2.16: режим дистанционного работника устанавливается «по своему усмотрению, если иное не предусмотрено трудовым договором о дистанционной работе».<\/p>\n<p><strong>Что не так.<\/strong> Добровольный сдвиг начала рабочего дня и обязанность установить неполное время по предусмотренному законом основанию — разные ветви. В ПВТР нет нового срока принятия решения, а слово «может» выглядит как неограниченное усмотрение. Кроме того, когда меняется договорное условие, одного приказа недостаточно; конкретную форму изменения проверяют по договору. Свободный режим дистанционной работы также нельзя определять только по короткому изложению в документе 03, игнорируя другие ЛНА.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 93 ч. 2, ред. 144‑ФЗ от 25.05.2026 (144‑ФЗ): «Решение об установлении работнику ... неполного рабочего времени принимается работодателем не позднее пяти рабочих дней с даты обращения работника с такой просьбой, оформленной в письменном виде». ТК ст. 102 ч. 1: при гибком времени начало, окончание или общая продолжительность дня «определяется по соглашению сторон». ТК ст. 72, ред. 25.05.2026: «Соглашение об изменении определенных сторонами условий трудового договора заключается в письменной форме». ТК ст. 312.4 ч. 2 предусматривает самостоятельный режим, только «Если иное не предусмотрено коллективным договором, локальным нормативным актом ... трудовым договором, дополнительным соглашением к трудовому договору».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 12, п. 4.9:<\/p>\n<blockquote>\n<p>4.9. Изменение установленного режима рабочего времени по соглашению сторон оформляется письменным соглашением, когда изменяются условия трудового договора, и приказом Работодателя. Если Работник обращается об установлении неполного рабочего времени по обязательному для Работодателя основанию части второй статьи 93 ТК РФ, КДП регистрирует письменное обращение в день получения; решение принимается не позднее пяти рабочих дней с даты обращения. Согласование с руководителем не отменяет предусмотренную законом обязанность. Режим и срок неполного времени устанавливаются по правилам статьи 93 ТК РФ; специальные ограничения продолжительности дня сохраняются.<\/p>\n<\/blockquote>\n<p>Заменить 03, п. 2.16:<\/p>\n<blockquote>\n<p>2.16. Режим рабочего времени дистанционного работника определяется в соответствии со статьей 312.4 ТК РФ коллективным договором, локальными нормативными актами, трудовым договором или дополнительным соглашением. Если режим такими документами не установлен, Работник определяет его по своему усмотрению. Время взаимодействия с Работодателем включается в рабочее время.<\/p>\n<\/blockquote>\n<p>Согласовать вторую правку с группой DISC. Для краткого согласованного сдвига, не меняющего договорное условие, юристы определяют необходимую форму отдельно; не навязывать всем новый договор.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП регистрирует заявление и определяет обязательную либо договорную ветвь. 2. Руководитель уточняет организационные условия, не блокируя законную обязанность. 3. HR контролирует срок. 4. КДП оформляет соглашение/приказ и передает режим в табель; Decision Flow фиксирует даты и решение.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли такие заявления сейчас и как фиксируется дата поступления? Какие договоры содержат фиксированное время?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет реестра заявлений и задержек.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по сроку и различию ветвей; форма конкретного изменения — после проверки договора.<\/p>"}, {"id": "К-VREM-18", "slug": "VREM-18", "title": "Отпускной маршрут распространяется на любое отсутствие, включая отдых за переработку", "imp": "средняя", "docs": ["02", "12", "16"], "meta": [["Документы", "16, пп. 1.1–1.7; 02, пп. 3.6, 5.1–5.4; 12, пп. 4.5–4.6"], ["Тип", "противоречие процедур; неопределённая область действия"], ["Кто решает", "HR и КДП; согласовать с группой OTP и DISC"], ["Важность", "средняя: для короткого отсутствия могут потребовать отпускной комплект и сроки"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.7: «Указанный в настоящем разделе алгоритм (порядок) является релевантным для ... согласования/предоставления ежегодного оплачиваемого отпуска, отпуска без сохранения заработной платы, учебного отпуска и иных случаев отсутствия сотрудника на работе в рабочее время.» П. 1.1 требует обращение «не позднее чем за 14 календарных дней» до предполагаемого ухода в отпуск. Скан 16, страницы 1–2, номера и срок сверены по изображениям. 12, п. 4.6 требует уведомлять руководителя при уходе более чем на 20 минут, «в том числе на обеденный перерыв»; п. 4.5 говорит, что обед не входит в рабочее время.<\/p>\n<p><strong>Что не так.<\/strong> Буквальная область 16 шире отпусков: туда попадают отгул за переработку, медицинское отсутствие и другие случаи, для которых есть или нужны специальные правила. Нельзя автоматически требовать отпускные сроки там, где отсутствие не является ежегодным отпуском. Для обеда в ПВТР смешаны уведомление о перемещении и учёт отсутствия в рабочее время. Практика отказов не подтверждена; это неоднозначность документов.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 152 ч. 1 и 153 ч. 4–5, ред. 25.05.2026: специальные правила отдыха за сверхурочные и выходной приведены в <a href=\"#/k/VREM-06\">К-VREM-06<\/a>. ТК ст. 108 ч. 1: перерыв для отдыха и питания «в рабочее время не включается». Специальных норм для каждого иного вида отсутствия в этом разборе нет — проверить юристам, а не вводить один срок для всех.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Общий порядок разделения видов отсутствия — <a href=\"#/k/OTP-10\">К-OTP-10<\/a>; ниже только дополнение для отдыха за переработку и обеда, не второй самостоятельный отпускной маршрут. При сборке встроить его в согласованную редакцию 16, п. 1.7 и связанных пунктов:<\/p>\n<blockquote>\n<p>1.7. Настоящий раздел регулирует согласование и предоставление отпусков с учетом специальных гарантий ТК РФ. Предоставление времени отдыха за сверхурочную работу и дня отдыха за работу в выходной или нерабочий праздничный день осуществляется по разделу 5 Политики 02. Иные виды отсутствия оформляются по соответствующему основанию; сроки и разрешающие визы для ежегодного отпуска на них автоматически не распространяются.<\/p>\n<\/blockquote>\n<p>Заменить 12, п. 4.6:<\/p>\n<blockquote>\n<p>4.6. О необходимости покинуть рабочее место в установленное рабочее время более чем на 20 минут Работник заранее уведомляет непосредственного руководителя. Порядок оформления отсутствия определяется его основанием. Использование установленного перерыва для отдыха и питания не является отсутствием в рабочее время; уведомление об организационных обстоятельствах не заменяет и не сокращает этот перерыв.<\/p>\n<\/blockquote>\n<p>Это не изменение ежегодных отпускных сроков: их общий текст согласует OTP. Сохранение уведомления о выходе из офиса в целях безопасности, если оно нужно, оформить отдельно и не превращать в разрешение на обед.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник выбирает основание отсутствия. 2. Форма направляет в отпускной процесс, отдых за переработку или специальную ветвь. 3. КДП проверяет основание и часы/дни. 4. Табель получает правильный вид времени; обед не уменьшает отработанную норму сверх установленного перерыва.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> На какие отсутствия сейчас реально применяют п. 1.7 и зачем включили обед в уведомление?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: число таких согласований неизвестно.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по широкой формулировке и различию процедур; фактическая нагрузка уточняется.<\/p>"}, {"id": "К-VREM-19", "slug": "VREM-19", "title": "Редактура: цель, самоназвание и частичные повторы Политики 02", "imp": "низкая", "docs": ["02", "12"], "meta": [["Документы", "02, пп. 1.1, 2.5, 2.7–2.8, 4.4; 12, пп. 4.2–4.3, 4.17"], ["Тип", "ошибка в тексте; редактура"], ["Кто решает", "руководитель HR; итоговую сборку проверяют юристы"], ["Важность", "низкая: убрать неоднозначные ссылки, не менять гарантии"]], "html": "<p><strong>Было.<\/strong> 02, п. 1.1 в текстовом слое: «НастоящаяПолитикаразработана вцелях регламентациипорядкапривлечения к сверхурочной работе»; п. 4.4: «Процедура оформления аналогична п.3 Положения». П. 2.8 содержит «ОООО». В 12, п. 4.3: «учетного период»; п. 4.17: «с ненормированным рабочим графиком». Пп. 2.5 и 2.7 Политики частично дублируются, но 2.7 дополнительно называет ученический договор.<\/p>\n<p><strong>Что не так.<\/strong> Цель 02 не упоминает работу в выходные и праздники, хотя документ регулирует её. Самоназвание «Положение» делает ссылку неясной. Слитные слова в 1.1 и 3.8 — ошибка текстового слоя: на изображениях PDF пробелы есть, поэтому не выдавать их за ошибку утверждённого оригинала. Содержательные различия форм, лимитов и гарантий разобраны отдельно; здесь только редакционная сборка.<\/p>\n<p><strong>Закон.<\/strong> Отдельная норма для опечаток не нужна. ТК ст. 8 ч. 4 (ред. 25.05.2026) не допускает применение ухудшающих норм; объединение повторов не должно удалять защищенную категорию. Полного текста ст. 203 в базе нет, перечень дополнительно проверяют юристы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить начало 02, п. 1.1:<\/p>\n<blockquote>\n<p>1.1. Настоящая Политика определяет порядок привлечения к сверхурочной работе, работе в выходные и нерабочие праздничные дни, оформления дежурств, учета времени и выбора предусмотренной компенсации.<\/p>\n<\/blockquote>\n<p>В 4.4 использовать «раздел 3 настоящей Политики», как в <a href=\"#/k/VREM-09\">К-VREM-09<\/a>. В 2.8 убрать лишнюю букву в организационно-правовой форме без изменения работодателя. В 12, п. 4.3 исправить «учетного периода»; в 4.17 — «ненормированным рабочим днем». Объединять пп. 2.5 и 2.7 только с сохранением ученического договора и всех прочих ограничений, после проверки <a href=\"#/k/VREM-16\">К-VREM-16<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. HR собирает согласованную редакцию. 2. КДП сверяет номера и все внутренние ссылки. 3. Юристы проверяют, что редактура не изменила круг лиц и выплаты. 4. Работники знакомятся с утвержденной версией по действующему законному порядку.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Нет отдельного вопроса; изменения ролей и каналов согласуются по <a href=\"#/k/VREM-07\">К-VREM-07<\/a> и группе DISC.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> высокая: сверены текстовый слой и изображения спорных мест.<\/p>"}]}, {"kod": "PLAT", "nazv": "Оплата труда и премии", "glavnoe": "<ol>\n<li><strong><a href=\"#/k/PLAT-07\">К-PLAT-07<\/a> — премия и дисциплинарное взыскание.<\/strong> Два действующих ЛНА дают разные формулировки; сначала нужно юридическое решение, иначе можно спорить о выплате задним числом.<\/li>\n<li><strong><a href=\"#/k/PLAT-08\">К-PLAT-08<\/a> и 09 — проектные схемы 2–3.<\/strong> Ошибка ссылки 5.9.1 и арифметическая несостыковка 3x/3,6x блокируют воспроизводимый расчёт.<\/li>\n<li><strong><a href=\"#/k/PLAT-11\">К-PLAT-11<\/a> — расчётный листок.<\/strong> Зарплата, удержания и компенсация должны быть видны работнику; форма и факт доставки — практический контроль бухгалтерии.<\/li>\n<li><strong><a href=\"#/k/PLAT-19\">К-PLAT-19<\/a> и 20 — задержка выплат.<\/strong> В 11.2 указан оклад вместо среднего заработка, а компенсация по ст. 236 не превращена в шаг расчёта.<\/li>\n<li><strong><a href=\"#/k/PLAT-02\">К-PLAT-02<\/a> и 10 — индексация и персональная надбавка.<\/strong> Нужно не перепутать общее повышение реального содержания с индивидуальным решением и не начислять надбавку без размера, срока и понятной роли.<\/li>\n<\/ol>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Кто участвует: роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Связь, пробел или противоречие<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Начисление и выплата зарплаты<\/td>\n<td style=\"text-align: left;\">10: 2.2–3.4, 10.1–10.9; 12: 3.5, 6.1–6.6<\/td>\n<td style=\"text-align: left;\">КДП, главный бухгалтер, руководители<\/td>\n<td style=\"text-align: left;\">По ответам HR от 10.11: табель в 1С, рассылка руководителям, подписи главного бухгалтера и КДП в Диадоке; банк<\/td>\n<td style=\"text-align: left;\">Даты совпадают, но последний рабочий день смешан с последним календарным; период аванса не определён<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Повышение оклада и индексация<\/td>\n<td style=\"text-align: left;\">10: 3.4; в 12 специального порядка нет<\/td>\n<td style=\"text-align: left;\">работодатель, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">приказ, дополнительное соглашение<\/td>\n<td style=\"text-align: left;\">Повышение по решению работодателя есть; порядка индексации поиском по присланным ЛНА не найдено<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Доплаты за время и дополнительную работу<\/td>\n<td style=\"text-align: left;\">10: 4.1–4.10; 02: 1.2, 2.8–2.9, 3.4–3.8; 12: 4.3, 4.17<\/td>\n<td style=\"text-align: left;\">руководитель, генеральный директор, исполнительный директор, директор департамента ИБ, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">почта, табель, приказ, согласие<\/td>\n<td style=\"text-align: left;\">Разбор сверхурочных, выходных, НРД, часовой ставки и совмещения — группа VREM; не заменять их премией<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Персональная надбавка<\/td>\n<td style=\"text-align: left;\">10: 5.1–5.2; 3.4<\/td>\n<td style=\"text-align: left;\">исполнительный и генеральный директора, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">решение и приказ<\/td>\n<td style=\"text-align: left;\">Нет размера, основания, срока; нельзя считать региональной только по названию<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Общие премии<\/td>\n<td style=\"text-align: left;\">10: 2.4, 6.1–6.8.4; 12: 8.1–8.3, 9.10<\/td>\n<td style=\"text-align: left;\">непосредственный руководитель, отдел персонала, генеральный/финансовый директора, КДП<\/td>\n<td style=\"text-align: left;\">служебная записка, приказ; по ответам HR — 1С и Диадок<\/td>\n<td style=\"text-align: left;\">Общая свобода решения спорит с правом на выплату по согласованной схеме; у части мотивов нет размера<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Премии и взыскания<\/td>\n<td style=\"text-align: left;\">10: 6.3, 6.10.3; 12: 9.2–9.10<\/td>\n<td style=\"text-align: left;\">руководитель, КДП, генеральный директор, бухгалтерия, юристы<\/td>\n<td style=\"text-align: left;\">приказ о взыскании отдельно от расчёта премии<\/td>\n<td style=\"text-align: left;\">В 10 — право не платить, в 12 — обязательный запрет поощрений; смысл коэффициента дисциплины не определён<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Согласование проектных премий<\/td>\n<td style=\"text-align: left;\">10: 6.9–6.11, приложение 1<\/td>\n<td style=\"text-align: left;\">руководитель подразделения, генеральный, финансовый и HR-директора, бухгалтерия<\/td>\n<td style=\"text-align: left;\">служебная почта, форма, Word, приказ<\/td>\n<td style=\"text-align: left;\">Ссылки 5.9.1 отсутствуют; единая форма не раскрывает выручку и формулу схемы 3; утверждение схемы и выплата — разные решения<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Реферальная премия<\/td>\n<td style=\"text-align: left;\">10: таблица 6.8.3; 07: 1.7–1.8, 2.18–2.20, 3.3; 13: разделы 3–4 как связь с адаптацией<\/td>\n<td style=\"text-align: left;\">отдел персонала, руководитель, КДП, генеральный директор, бухгалтерия<\/td>\n<td style=\"text-align: left;\">приём и конец испытания, записка, приказ; на практике учёт в 1С<\/td>\n<td style=\"text-align: left;\">Письменное заключение об испытании есть, но передача события в расчёт премии не описана; без испытания второй этап не определён<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ценный подарок<\/td>\n<td style=\"text-align: left;\">10: 7.1–7.3; 12: 8.1–8.3, 9.10<\/td>\n<td style=\"text-align: left;\">руководитель, отдел персонала, генеральный/финансовый директора, КДП<\/td>\n<td style=\"text-align: left;\">представление, закупка, приказ<\/td>\n<td style=\"text-align: left;\">Не смешивать трудовое поощрение с праздничным подарком по 9.4<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Материальная помощь<\/td>\n<td style=\"text-align: left;\">10: 8.1–8.8; 12: 7.2<\/td>\n<td style=\"text-align: left;\">работник, HR-директор, генеральный директор, бухгалтерия<\/td>\n<td style=\"text-align: left;\">заявление по почте, подтверждающие документы, приказ<\/td>\n<td style=\"text-align: left;\">Не определены дата и база регионального МРОТ, срок решения и выплаты; рождение ребёнка не названо в 8.8 прямо<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Семейные дни и отпускные<\/td>\n<td style=\"text-align: left;\">10: 8.7, 10.12; 12: 4.18, 4.22; 16<\/td>\n<td style=\"text-align: left;\">работник, руководитель, HR, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">заявление, приказ, 1С Кабинет сотрудника/Диадок по встрече 11.11<\/td>\n<td style=\"text-align: left;\">Оплачиваемые семейные дни сохранить; условие оплаты отпуска по заявлению и связь со ст. 128 — группа OTP<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ДМС и другие социальные меры<\/td>\n<td style=\"text-align: left;\">10: 9.1–9.5; 12: 7.1–7.2; ответы HR 10.11, разделы 1.1, 2.1, 4.4<\/td>\n<td style=\"text-align: left;\">работник, HR, КДП, страховая, бухгалтерия<\/td>\n<td style=\"text-align: left;\">заявление, приложение страховщика, перевод на расчётный счёт<\/td>\n<td style=\"text-align: left;\">9.5 описывает изменение программы, но не возникновение права; удержание из зарплаты там не установлено; часть бенефитов из ответов HR в ЛНА не описана<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Расчётный листок<\/td>\n<td style=\"text-align: left;\">12: 6.7, приложение 1; 10: 10.10, 11.1<\/td>\n<td style=\"text-align: left;\">бухгалтерия, работник, КДП<\/td>\n<td style=\"text-align: left;\">личный кабинет 1С либо служебная почта<\/td>\n<td style=\"text-align: left;\">Молчание за три рабочих дня считается вручением; в форме не выделены основания удержаний и компенсация за задержку<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Удержания, авансы и возмещение ущерба<\/td>\n<td style=\"text-align: left;\">10: 10.10; 14: 4.2, 5.1–5.2; 15: 2.6; 12: 10.4<\/td>\n<td style=\"text-align: left;\">бухгалтерия, КДП, работник, юристы<\/td>\n<td style=\"text-align: left;\">заявление, расчёт, распоряжение, банковский перевод<\/td>\n<td style=\"text-align: left;\">Заявление не должно подменять проверку законного основания; такси не означает автоматическое удержание, ДМС — отдельный добровольный платёж<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Справки о заработке<\/td>\n<td style=\"text-align: left;\">10: 10.11; общие правила ЭДО в 12: 1.3, 5.5–5.7<\/td>\n<td style=\"text-align: left;\">работник, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">лично под подпись, Диадок<\/td>\n<td style=\"text-align: left;\">Не назван срок выдачи; общий порядок кадрового ЭДО проверяет DISC<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Увольнение и расчёт<\/td>\n<td style=\"text-align: left;\">10: 10.13; 12: 2.16; 07: 3.4<\/td>\n<td style=\"text-align: left;\">КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">кадровое событие, расчёт, банк<\/td>\n<td style=\"text-align: left;\">ТК 140 теперь есть в базе; привязать к дню увольнения, а не последнему фактическому выходу — передать PRIEM; премию за уже заработанный период не терять<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Задержка выплаты<\/td>\n<td style=\"text-align: left;\">10: 11.1–11.2; 12: 3.1, 3.5<\/td>\n<td style=\"text-align: left;\">работник, бухгалтерия, КДП, работодатель<\/td>\n<td style=\"text-align: left;\">письменное уведомление, расчёт компенсации<\/td>\n<td style=\"text-align: left;\">Оклад вместо среднего заработка; нет рабочего шага начисления компенсации<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение правил оплаты<\/td>\n<td style=\"text-align: left;\">10: 12.1–12.3; 12: 13.8<\/td>\n<td style=\"text-align: left;\">генеральный директор, HR, КДП, юристы, представительный орган при наличии<\/td>\n<td style=\"text-align: left;\">приказ, ознакомление под роспись; правомерный ЭДО<\/td>\n<td style=\"text-align: left;\">Порядок ознакомления и учёта мнения не раскрыт; применение к ранее возникшим отношениям не означает разрешение уменьшать уже заработанное<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Границы предложений.<\/strong> Нормы ниже взяты только из сохранённых баз: (далее ), (далее ) и других разрешённых файлов. Ссылки — адреса источников из этих баз, интернет не открывался. ТК — редакция от 25.05.2026; отдельные даты последних поправок приводятся только там, где они есть в тексте. Известные будущие поправки из базы не выдаются за действующие.<\/p>\n<p>Все пункты в блоках <strong>Стало<\/strong> — проекты. Новые сроки, назначения ответственных и настройки надо отдельно утвердить; они не названы действующей практикой. Decision Flow — предлагаемый маршрут заявки, решения и журнала, не расчётная система, не электронная подпись и не доказанная интеграция с 1С/Диадоком. До проверки соединений КДП переносит подтверждённые сведения вручную; зарплата и персональные документы не публикуются в общих каналах.<\/p>", "voprosy": "<p><strong>Вопросы HR и КДП (не больше десяти).<\/strong><\/p>\n<ol>\n<li>Какие виды премий фактически выплачивались за последние 12 месяцев и какие закреплены в договорах?<\/li>\n<li>Что означает «Дисциплина» в схеме 3, применялась ли схема и есть ли иная форма расчёта?<\/li>\n<li>Применялись ли 6.10.2–6.10.3, какой пункт указан в приказах и формах?<\/li>\n<li>Как закрываются периоды зарплаты и как фиксируются уточнения табеля после выплаты?<\/li>\n<li>Есть ли акт об индексации и дата последнего повышения; платится ли персональная надбавка?<\/li>\n<li>Утверждена ли форма расчётного листка отдельным приказом и фиксируется ли доставка?<\/li>\n<li>Какие удержания и добровольные платежи реально используются; были ли споры?<\/li>\n<li>Как оформляется событие прохождения испытания и реферальная премия; что при приёме без испытания?<\/li>\n<li>Кому и с какой даты предоставляется ДМС; есть ли обещания в договорах и массовое подключение?<\/li>\n<li>Кто исполняет полномочия исполнительного директора и какие роли заведены в 1С/Диадок?<\/li>\n<\/ol>", "nehvatilo": "<p><strong>Статьи, которых не хватало в предыдущей базе и которые добраны для этой работы.<\/strong> ТК 129, 132, 134, 136, 137, 140, 142, 192–194, 236, 238, 241, 247–248 — для понятий оплаты, индексации, листка, удержаний, расчёта, задержки, взысканий и ущерба; ТК 57 — для условий оплаты и дополнительного страхования; ТК 22.3 — для трёх рабочих дней по документам; ТК 71 — для события окончания испытания. ТК 131 и 138 в разрешённой базе нет — проверить юристам. ТК 151, 152 и 153, нормы о совмещении и сверхурочных, оставлены группе VREM; их не дублировал.<\/p>", "keysy": [{"id": "К-PLAT-01", "slug": "PLAT-01", "title": "Даты зарплаты совпадают, но период расчёта и последний день описаны двусмысленно", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 10.2–10.7; 12, пп. 6.2–6.4"], ["Тип", "пробел"], ["Кто решает", "руководитель HR и главный бухгалтер; юристы до утверждения"], ["Важность", "высокая: текст должен давать бухгалтерии однозначную дату и оплачиваемый период"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 10.6, стр. 8: «Первая часть заработной платы (аванс) выплачивается работникам Общества 15 числа месяца, за который она была начислена, - пропорционально отработанному периоду».<\/li>\n<li>Там же: «Вторая часть заработной платы выплачивается работникам Общества в последний рабочий день (30/31 (28/29 в феврале) числа) месяца, за который она была начислена».<\/li>\n<li>12, п. 6.3, стр. 13: «в последний рабочий день 28/29/30/31 числа месяца, за который она была начислена».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Между документами здесь не разные даты: они повторяют одно правило. Но последний рабочий день не всегда совпадает с перечисленными календарными числами; ещё и следующий пункт переносит выплату накануне выходного. Не определено, какая часть работы входит в платёж в середине ещё не законченного дня. Это повод уточнить расчёт и табель, а не объявлять выплату в текущем месяце незаконной или переносить деньги на следующий месяц без решения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 136 ч. 6 (ред. 25.05.2026): «Заработная плата выплачивается не реже чем каждые полмесяца. Конкретная дата выплаты заработной платы устанавливается правилами внутреннего трудового распорядка, коллективным договором или трудовым договором не позднее 15 календарных дней со дня окончания периода, за который она начислена». Ч. 8: «При совпадении дня выплаты с выходным или нерабочим праздничным днем выплата заработной платы производится накануне этого дня». Источник: ст. 136, https://www.consultant.ru/document/cons_doc_LAW_34683/a0a891ee650687026ef53d5d1194983419be6793/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Не менять текущие даты до проверки. Заменить 10, п. 10.6 и 12, п. 6.3 одинаковым текстом:<\/p>\n<blockquote>\n<p>Заработная плата выплачивается за первую половину текущего месяца 15-го числа текущего месяца, за вторую половину текущего месяца — в последний календарный день текущего месяца. При совпадении установленной даты с выходным или нерабочим праздничным днём применяется порядок переноса, установленный пунктом 10.7 Положения об оплате труда и пунктом 6.4 Правил внутреннего трудового распорядка. Расчёт производится с учётом фактически отработанного времени. Бухгалтерия и кадровая служба обеспечивают передачу данных табеля до выплаты и учёт уточнений без задержки причитающихся Работнику сумм.<\/p>\n<\/blockquote>\n<p>Такой текст годится, <strong>если бухгалтерия подтвердит расчёт полной половины месяца к этой дате<\/strong>. Если нет — не подставлять выдуманный день отсечения: главный бухгалтер и юристы готовят другой согласованный календарь с сохранением требований закона и условий договоров. В 10, п. 10.3 оставить обе подписи табеля; уточнить исполнение, а не убрать главного бухгалтера.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Главный бухгалтер и КДП показывают обезличенный пример расчёта каждой половины месяца, включая последний рабочий день до календарного конца.<\/li>\n<li>Юристы сверяют даты с договорами; HR выбирает с ними окончательный одинаковый текст для 10 и 12.<\/li>\n<li>КДП передаёт подтверждённый табель бухгалтерии; календарь выплат в процессе только напоминает и фиксирует исполнение, деньги считает и переводит бухгалтерия.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как закрывают последние дни каждой половины месяца; как учитывают уточнения табеля и кто контролирует недоплату?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: расчётных ведомостей и платёжного календаря нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в двусмысленности текста; средняя в проекте: зависит от устройства расчёта.<\/p>"}, {"id": "К-PLAT-02", "slug": "PLAT-02", "title": "Повышение оклада по усмотрению не описывает порядок индексации", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, п. 3.4; 12, раздел 6"], ["Тип", "пробел"], ["Кто решает", "руководитель компании: параметры; HR и бухгалтерия: исполнение; юристы: проверка"], ["Важность", "высокая: нет понятного порядка сохранения реального содержания зарплаты"]], "html": "<p><strong>Было.<\/strong> 10, п. 3.4, стр. 2: «Размер оклада может повышаться по решению Работодателя. Повышение оклада оформляется приказом (распоряжением) руководителя Организации и дополнительным соглашением к трудовому договору с соответствующим Работником».<\/p>\n<p><strong>Что не так.<\/strong> Этот пункт о персональном повышении, а не о периодичности и способе индексации. Поиск основы слова индекс по присланным текстам ЛНА специального правила не дал; это не доказывает отсутствия отдельного акта у компании. Нельзя ни объявить фактическую неиндексацию, ни считать любую разовую премию достаточной заменой без проверки юристов.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 134 (ред. 25.05.2026): «Обеспечение повышения уровня реального содержания заработной платы включает индексацию заработной платы в связи с ростом потребительских цен на товары и услуги»; другие работодатели — «в порядке, установленном коллективным договором, соглашениями, локальными нормативными актами»., ст. 134, https://www.consultant.ru/document/cons_doc_LAW_34683/12fdabe1c6c090a33e327161c95b4d430b5629c9/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Сохранить 3.4. Дополнить документ 10 пунктом 3.5; рекомендуемый вариант, а не требование закона именно о таком коэффициенте:<\/p>\n<blockquote>\n<p>3.5. Индексация заработной платы производится ежегодно с января по индексу потребительских цен за предшествующий календарный год, опубликованному Росстатом по Российской Федерации. При значении индекса выше ста процентов оклады и установленные в твёрдой денежной сумме ежемесячные надбавки увеличиваются на соответствующий коэффициент. При отсутствии роста цен уменьшение выплат не производится. Выплаты, определяемые в процентах от оклада, рассчитываются от проиндексированного оклада. Бухгалтерия подготавливает расчёт после опубликования индекса; при необходимости производится доплата с января. Персональное повышение за квалификацию или изменение обязанностей не заменяет индексацию. Кадровая служба оформляет приказ и необходимые дополнительные соглашения. Индексация применяется ко всем Работникам, включая совместителей.<\/p>\n<\/blockquote>\n<p>До утверждения HR выясняет, нет ли уже более благоприятного порядка; его не ухудшают. В ПВТР, раздел 6, добавить ссылку на 3.5, а не другую формулу. Выбор 11 улья о региональных надбавках этот вопрос не решает. Вариант компании с иной периодичностью и механизмом возможен только после юридической проверки; рекомендация — единый проверяемый коэффициент без ежегодного нового решения о самом праве.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR получает действующий акт об индексации, если он есть, и согласует с руководителем компании параметры.<\/li>\n<li>Бухгалтерия вносит официальный опубликованный индекс и адрес публикации в расчёт; программа выполняет арифметику, человек проверяет.<\/li>\n<li>КДП оформляет документы; бухгалтерия начисляет повышение и доплату, процесс фиксирует завершение.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельный акт и когда проводилась последняя индексация?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: фонда оплаты труда и выбранного коэффициента нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле присланного комплекта; средняя в полноте сведений о компании.<\/p>"}, {"id": "К-PLAT-03", "slug": "PLAT-03", "title": "Заявление работника смешано с законным основанием удержания", "imp": "высокая", "docs": ["10", "14", "15"], "meta": [["Документы", "10, п. 10.10; 10, п. 9.5; 14, пп. 4.2, 5.1–5.2; 15, п. 2.6"], ["Тип", "пробел"], ["Кто решает", "главный бухгалтер и юристы; HR утверждает маршрут"], ["Важность", "высокая: можно ошибочно списать спорную сумму из зарплаты"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 10.10, стр. 8: «Удержания из заработной платы Работника производятся только в случаях, предусмотренных Трудовым кодексом РФ и иными федеральными законами, а также по заявлению Работника».<\/li>\n<li>15, п. 2.6, стр. 4: «Сотрудник обязуется компенсировать Организации стоимость поездки на такси в случае, если будет установлено осуществление поездки с нарушением Сотрудником требований настоящего Регламента».<\/li>\n<li>10, п. 9.5, стр. 8: «Работник вносит сумму доплаты на расчётный счет компании».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Компенсация такси, возврат аванса и добровольная доплата за ДМС — разные операции. Заявление само по себе не освобождает от проверки основания, суммы, срока, возражений и ограничений удержания. Документ 15 не говорит прямо об удержании: нельзя приписывать ему уже введённый автоматический вычет. В ДМС записан перевод на счёт, его не заменяем удержанием из черновика улья.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 137 ч. 1 (ред. 25.05.2026): «Удержания из заработной платы работника производятся только в случаях, предусмотренных настоящим Кодексом и иными федеральными законами». Ч. 3 для перечисленных там случаев: «не позднее одного месяца со дня окончания срока, установленного для возвращения аванса, погашения задолженности или неправильно исчисленных выплат, и при условии, если работник не оспаривает оснований и размеров удержания»., ст. 137, https://www.consultant.ru/document/cons_doc_LAW_34683/0b97a8e40bb5179ac150db9bb34324c945278f2d/. Для ущерба дополнительно ст. 247 ч. 1: «работодатель обязан провести проверку для установления размера причиненного ущерба и причин его возникновения»; ст. 248 — порядок взыскания, обе в. ТК 138 о размерах удержаний в базе нет, проверить юристам. Правовой режим добровольного распоряжения зарплатой по заявлению по одной ст. 137 окончательно не определяем.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 10, п. 10.10:<\/p>\n<blockquote>\n<p>10.10. Удержания из заработной платы производятся исключительно в случаях и порядке, предусмотренных Трудовым кодексом Российской Федерации и иными федеральными законами. До удержания Бухгалтерия проверяет основание, размер, соблюдение срока принятия решения и применимых ограничений; в предусмотренных законом случаях — отсутствие возражений Работника. Заявление Работника не заменяет такую проверку. При наличии спора документы направляются юристам; спорная сумма не удерживается вне предусмотренного законом порядка. Добровольное перечисление Работником денежных средств Организации учитывается отдельно от удержаний из заработной платы.<\/p>\n<\/blockquote>\n<p>В 15, п. 2.6 дописать: Возмещение и возможное удержание производятся после проверки оснований и в установленном законом порядке с применением пункта 10.10 Положения об оплате труда. Саму допустимость возмещения такси проверяет группа KOM. В 14, пп. 4.2 и 5.2 добавить такую же ссылку только для задолженности по авансу. В 10, п. 9.5 сохранить банковский перевод.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Бухгалтерия получает документы по конкретному основанию и выбирает вид операции: удержание по закону, добровольный платёж либо спор.<\/li>\n<li>Проверяет условия; спор уходит юристам, а не в автоматическое уменьшение зарплаты.<\/li>\n<li>Подтверждённое удержание отражается с основанием в расчётном листке; добровольный платёж сверяется с банком отдельно.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие виды удержаний и добровольных платежей фактически используются?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: реестра операций и сумм нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в необходимости различать операции; средняя в юридической квалификации добровольных распоряжений.<\/p>"}, {"id": "К-PLAT-04", "slug": "PLAT-04", "title": "Общее усмотрение работодателя не отделено от уже обещанных выплат", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 2.4, 6.1, 6.7, 6.8.3, 6.10.1, приложение 1; 12, пп. 8.1–8.3"], ["Тип", "противоречие внутри документа"], ["Кто решает", "руководитель компании: выбор системы; юристы до изменения"], ["Важность", "высокая: согласованная премия может восприниматься как отменяемый подарок"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 2.4, стр. 2: «Организация имеет право начислять определенным Работникам исключительно по своему усмотрению».<\/li>\n<li>10, п. 6.1, стр. 4: «Премирование Работников является правом, а не обязанностью Работодателя».<\/li>\n<li>10, приложение 1, стр. 10: «Цели по достижении которых появляется право на выплату премии».<\/li>\n<li>10, п. 6.10.1, стр. 5: «выплачивается исключительно при достижении поставленных целей».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Право установить разовую премию и обязанность выполнить уже согласованную систему не разделены. Даже в одном документе форма говорит о праве на выплату, а общий пункт — о полном усмотрении. Премия как поощрение не перестаёт из-за этого быть частью зарплаты; наличие мотива за месяц само по себе ещё не доказывает регулярную практику. Компенсационные выплаты в конце 2.4 также надо явно отделить от усмотрения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 129 ч. 1 (ред. 25.05.2026): «стимулирующие выплаты (доплаты и надбавки стимулирующего характера, премии и иные поощрительные выплаты)» входят в определение зарплаты. ТК ст. 135 ч. 1: «Заработная плата работнику устанавливается трудовым договором в соответствии с действующими у данного работодателя системами оплаты труда». Ст. 22 ч. 2: «соблюдать ... локальные нормативные акты, условия коллективного договора, соглашений и трудовых договоров» (многоточие здесь заменяет пропущенный текст)., ст. 129, 135, 22; адрес ст. 135: https://www.consultant.ru/document/cons_doc_LAW_34683/ec0a7a4cf2bbf1f8f89970fd480c3fc9ed860f82/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 2.4 вместо предложения о переменной части:<\/p>\n<blockquote>\n<p>Переменная часть включает компенсационные и стимулирующие выплаты. Компенсационные выплаты начисляются при наличии предусмотренных законом и настоящим Положением оснований. Стимулирующие выплаты начисляются в соответствии с установленными видами, размерами, сроками, основаниями и условиями. Усмотрение Работодателя применяется к принятию решения о разовом поощрении и определению его размера в пределах настоящего Положения, но не отменяет обязательств, уже возникших из трудового договора или утверждённой схемы премирования при выполнении её условий.<\/p>\n<\/blockquote>\n<p>В конце 6.1 добавить:<\/p>\n<blockquote>\n<p>Положения настоящего пункта не являются основанием для отказа в выплате премий, право на которые возникло у Работника в соответствии с трудовым договором и установленной системой премирования.<\/p>\n<\/blockquote>\n<p>В ПВТР 8.3 после ссылки на подарки добавить ссылку на раздел 6 документа 10 о премиях. Выбор 7 улья — только решение о будущей системе: А (только разовые), Б (квартальная и разовые), В (годовая и разовые). Рекомендация до выбора: сохранить действующие обязательства, собрать применяемые виды и договорные обещания. Не отменять разделы 6–7 целиком типовым текстом; остальные разделы 10 новая политика премий вообще не заменяет. Порядок изменения договоров — ст. 72, 74, юристам.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП и бухгалтерия составляют обезличенный перечень фактически применённых видов и условий договоров.<\/li>\n<li>На карточке премии руководитель видит: уже установленная выплата или новое разовое поощрение; финансовое согласование не переоткрывает заработанное право.<\/li>\n<li>Компания выбирает будущую систему; КДП меняет связанные пункты и договоры законным способом, бухгалтерия сохраняет расчёт прежних периодов.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие виды реально платятся и какие закреплены в договорах?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: выгрузки выплат нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в текстовой неоднозначности; юридическая природа каждого вида зависит от условий и практики.<\/p>"}, {"id": "К-PLAT-05", "slug": "PLAT-05", "title": "Не у всех оснований премии есть размер и условия", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 6.8.1, 6.8.3–6.8.4; 12, п. 8.1"], ["Тип", "пробел"], ["Кто решает", "руководитель компании: размеры и виды; HR и юристы: текст"], ["Важность", "высокая: по перечню мотивов нельзя однозначно составить расчёт"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.8.1, стр. 4: «за добросовестное исполнение трудовых обязанностей»; «в иных важных случаях».<\/li>\n<li>10, п. 6.8.4, стр. 5: «К юбилейным и праздничным датам премия выплачивается на основании приказа ... на основании служебной записки Отдела персонала».<\/li>\n<li>12, п. 8.1, стр. 14: «другие виды поощрения (по усмотрению руководства)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Для двух мотивов из 6.8.1 таблица 6.8.3 не даёт суммы или потолка; программная сверка — расчёт программой. Юбилейная премия тоже без размера и критериев даты. Часть таблицы переносится со страницы на страницу: мотивы за досрочный выход и повышенную нагрузку продолжают строку с потолком до 50% оклада, их не надо ошибочно объявлять безразмерными. Слова об иных поощрениях в ПВТР не определяют сам вид.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 3 (ред. 25.05.2026): «определяются виды премий и их размеры, сроки, основания и условия выплаты премий работникам». ТК ст. 191 ч. 2: «Другие виды поощрений работников за труд определяются коллективным договором или правилами внутреннего трудового распорядка»., ст. 135 и 191; https://www.consultant.ru/document/cons_doc_LAW_34683/055e8e833d20da93d226dfde983a5076ee2a4ba2/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Не подставлять новые суммы за компанию. Рекомендуется сохранить названные основания, но до утверждения дополнить таблицу их размерами и условиями по отдельному решению руководителя компании. Готовое общее дополнение к 6.8.3:<\/p>\n<blockquote>\n<p>Для каждого основания премирования в таблице настоящего пункта устанавливаются размер либо правило определения размера, период оценки, условия возникновения права и срок выплаты. Применяемое основание и соответствующая строка таблицы указываются в служебной записке и приказе. Изменение таблицы не отменяет уже возникших обязательств перед Работниками. Основания, предусмотренные трудовым договором, применяются на условиях соответствующего договора.<\/p>\n<\/blockquote>\n<p>Для 6.8.4 готовая вводная часть:<\/p>\n<blockquote>\n<p>Юбилейные и праздничные премии назначаются по перечню дат, кругу получателей и размерам, установленным в таблице настоящего пункта. Отдел персонала готовит служебную записку по наступлении предусмотренного события; выплата оформляется приказом Генерального директора или уполномоченного им лица.<\/p>\n<\/blockquote>\n<p><strong>Окончательные строки таблиц без решения о деньгах не готовы:<\/strong> HR предлагает либо сохранить виды с установленными компанией параметрами (рекомендация), либо исключить открытый мотив на будущее с юридической проверкой обязательств. Для ПВТР 8.1 заменить последний подпункт: Иные виды поощрения вводятся путём внесения изменений в настоящие Правила. Не считать отсутствие нормы о размере в документе доказанной невыплатой.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR собирает используемые мотивы и юбилейные даты; компания выбирает размеры и критерии.<\/li>\n<li>Юристы проверяют заполненные таблицы и переходные условия, КДП оформляет изменения.<\/li>\n<li>При заявке руководитель выбирает конкретную строку; незаполненная новая строка возвращается на настройку, но заработанное по договору не блокируется.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> По каким правилам сейчас назначают эти выплаты и юбилейные даты?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Суммы и круг получателей должен выбрать руководитель компании.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: пробел виден в тексте; распределение строк таблицы дополнительно проверено по структуре PDF в программой, без визуального рендера.<\/p>"}, {"id": "К-PLAT-06", "slug": "PLAT-06", "title": "Срок выплаты премии начинается с приказа, а срок самого решения не установлен", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 6.8.2, 6.11.1–6.11.3; 12, п. 6.3"], ["Тип", "пробел"], ["Кто решает", "HR, финансовый директор, главный бухгалтер и юристы"], ["Важность", "высокая: премия за известный период может ждать приказа или устранения замечаний без конечной даты"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.8.2, стр. 4: «не позднее календарного месяца, следующего за месяцем издания Приказа».<\/li>\n<li>10, п. 6.11.1, стр. 6: «в течение одного месяца после подтверждения HR директором, Финансовым директором и Генеральным директором».<\/li>\n<li>10, п. 6.11.3, стр. 6: «в течение месяца после предоставления данных и устранения замечаний, если таковые были».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Ни подписание приказа по общей премии, ни согласование, ни исправление замечаний не имеют конечного срока. Для схемы 2 не назван сам период, по результатам которого HR направляет записку. При этом нельзя объявить все квартальные или годовые премии незаконно поздними по одному общему правилу о зарплате: квалификацию выплаты и допустимый срок надо проверить юристам. Практики задержек у нас нет, найден именно пробел текста.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 3 (ред. 25.05.2026): «определяются виды премий и их размеры, сроки, основания и условия выплаты премий работникам». ТК ст. 136 ч. 6: «не позднее 15 календарных дней со дня окончания периода, за который она начислена»., ст. 135;, ст. 136. Как сочетать нормы с квартальной, годовой и проектной премией, проверить юристам: специального разъяснения в базе нет.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 6.8.2 и отослать к нему 6.11.1–6.11.3:<\/p>\n<blockquote>\n<p>По каждому виду премии срок выплаты, срок представления расчёта, ответственные за подтверждение показателей и срок принятия решения устанавливаются настоящим Положением либо утверждённой до начала оцениваемого периода схемой премирования. Не допускается определять конечный срок выплаты исключительно датой будущего приказа или устранения замечаний без установленного конечного срока. Замечания к отдельным данным не приостанавливают выплату бесспорной причитающейся суммы в установленный срок. Увольнение Работника само по себе не прекращает право на премию за выполненные условия. Расчёт при увольнении производится с учётом пункта 10.13 и требований закона.<\/p>\n<\/blockquote>\n<p>В каждой из схем перед утверждением заполнить календарь: окончание периода → подтверждение данных → решение → конкретная дата выплаты. <strong>Даты не выбраны за компанию:<\/strong> это оставшаяся часть проекта, а не скрытые пустые места. Для ежемесячной зарплатной премии юристы отдельно сверяют ст. 136; для квартальной и выручки — момент возникновения права и доступность данных. Не заменять все существующие сроки одним более поздним.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR и бухгалтерия составляют перечень видов с юридической квалификацией и календарём.<\/li>\n<li>Процесс напоминает руководителю о данных; просрочку решения показывает ответственному, но не сдвигает срок автоматически.<\/li>\n<li>Бухгалтерия получает приказ и проверенный расчёт до выплаты; по увольняемому сверяет уже возникшие обязательства вместе с PRIEM.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие периоды используются в схеме 2, когда доступны выручка и оценки, сколько длится согласование?<\/p>\n<p><strong>Цена вопроса.<\/strong> Иллюстрация неопределённости, не факт компании: при приказе 26.02.2027 о премии за январь п. 6.8.2 допускает выплату до 31.03.2027 — 59 дней после конца месяца (расчёт программой). Законность именно такого срока зависит от вида выплаты; автоматический вывод о нарушении не делается.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии срока решения; средняя в правовой оценке сроков отдельных премий.<\/p>"}, {"id": "К-PLAT-07", "slug": "PLAT-07", "title": "Полный запрет поощрений при взыскании не согласован с правилом о снижении премии", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, п. 6.3; 12, п. 9.10; 10, п. 6.10.3"], ["Тип", "противоречие между документами; правовая оценка требует юристов"], ["Кто решает", "юристы до выбора руководителя компании; HR фиксирует практику"], ["Важность", "высокая: можно остановить премию, которая входит в зарплату, без понятного периода и предела"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.3, стр. 4: «Работодатель вправе не выплачивать премии Работникам, имеющим дисциплинарные взыскания».<\/li>\n<li>12, п. 9.10, стр. 14: «В течение срока действия дисциплинарного взыскания меры поощрения, указанные в Правилах, к работнику не применяются».<\/li>\n<li>10, п. 6.10.3, стр. 6: «Дисциплина» — одна из трёх переменных схемы; отдельное определение дисциплины в тексте не дано.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Положение 10 формулирует право работодателя, ПВТР — безусловный запрет на весь срок взыскания; для премии, входящей в зарплату, это разные последствия. В ТК 135 ч. 3 есть право работодателя предусмотреть ограниченное условие, но из одной нормы нельзя автоматически заключить, что действующие пункты уже незаконны: это прямо отмечено приёмкой карты 13.11. Смысл коэффициента «Дисциплина» не раскрыт; не смешивать его с самим взысканием до решения юристов.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 3 (ред. 25.05.2026): «работодатель ... вправе предусмотреть условие о том, что снижение размера премии работнику в связи с применением к нему дисциплинарного взыскания ... осуществляется в отношении только тех входящих в состав заработной платы работника премий, которые начисляются за период, в котором к работнику было применено соответствующее дисциплинарное взыскание, а размер такого снижения премии не может приводить к уменьшению размера месячной заработной платы работника более чем на 20 процентов». Важно слово «вправе предусмотреть»., ст. 135, ред. 25.05.2026, https://www.consultant.ru/document/cons_doc_LAW_34683/ec0a7a4cf2bbf1f8f89970fd480c3fc9ed860f82/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> До ответа юристов не отменять действующий текст и не применять новую формулу задним числом. После ответа, если они подтвердят выбранный вариант, заменить 10, п. 6.3 и 12, п. 9.10 одним правилом:<\/p>\n<blockquote>\n<p>Наличие дисциплинарного взыскания учитывается при премировании только в порядке, прямо установленном системой премирования. Если Работодатель предусматривает снижение входящей в состав заработной платы премии в связи с дисциплинарным взысканием, снижение относится только к премии за период, в котором применено взыскание, и не может уменьшать размер месячной заработной платы Работника более чем на 20 процентов. Наличие взыскания не является основанием для невыплаты уже начисленной премии за другой период. Благодарность и ценный подарок являются самостоятельными видами поощрения и применяются по решению Работодателя в соответствии с настоящими Правилами.<\/p>\n<\/blockquote>\n<p>Смысл «Дисциплина» в 6.10.3 прописать отдельно: показатель, источник данных, период, предел влияния и связь (или отсутствие связи) с взысканием. Если юристы выберут вариант без снижения, убрать из формулы коэффициент или дать ему иное проверяемое содержание. Приёмка карты исправила прежнюю оценку «хуже закона» на «проверить юристам»; сохранить эту оговорку.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП регистрирует взыскание с датой применения и периодом действия; бухгалтерия не меняет начисление автоматически.<\/li>\n<li>Юристы проверяют вид премии: входит ли в зарплату и к какому периоду относится.<\/li>\n<li>После утверждения правила процесс применяет только записанную формулу, показывает расчёт и лимит; спорная заявка уходит юристам.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли случаи неполной или невыплаченной премии из-за взыскания; что означает «Дисциплина» в схеме 3?<\/p>\n<p><strong>Цена вопроса.<\/strong> Иллюстрация, не данные компании: при окладе 1 и премии 2 лишение всей премии составляет 66,7% месячной зарплаты; 20% от неё — 0,60 оклада (расчёт программой). Фактические выплаты не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в расхождении формулировок; высокая в цитате нормы; низкая в окончательном правовом выводе до юристов.<\/p>"}, {"id": "К-PLAT-08", "slug": "PLAT-08", "title": "Ссылка на несуществующий пункт ломает проектные премиальные схемы", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 6.9.1–6.9.2, 6.10.2–6.10.3; приложение 1"], ["Тип", "ошибка в тексте"], ["Кто решает", "руководитель HR и генеральный/финансовый директора; юристы до утверждения"], ["Важность", "высокая: схема может ссылаться на несуществующий порядок согласования"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.10.2, стр. 5: «Устанавливается в размере согласованного в порядке пункта 5.9.1. настоящего Положения процента от выручки проекта».<\/li>\n<li>10, п. 6.10.3, стр. 6: «Подлежит применению после ее согласования на основании пункта 5.9.1. настоящего Положения».<\/li>\n<li>10, п. 6.9.1, стр. 5: «Перед стартом работ по каждому проекту Руководитель подразделения согласовывает ... документ, содержащий ... запрос на применение конкретных схем премирования».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В разделе 5 есть только пункты 5.1–5.2; 5.9.1 в тексте нет. Реальный порядок согласования находится в 6.9.1, но схема 3 ещё и «действует по истечении одного года» и требует данных опросников. Ошибка ссылки не делает автоматически недействительной выплату, но оставляет непонятным, какой документ считать основанием.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 3: «определяются виды премий и их размеры, сроки, основания и условия выплаты премий работникам»., ст. 135, ред. 25.05.2026, адрес из <a href=\"#/k/PLAT-07\">К-PLAT-07<\/a>.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 10, п. 6.10.2 заменить «пункта 5.9.1» на «пункта 6.9.1». В п. 6.10.3 заменить «пункта 5.9.1» на «пункта 6.9.1». Перед утверждением перепроверить форму приложения 1 и все ссылки по документу; не менять номера других пунктов только по OCR. В приложении 1 сохранить имеющееся поле номера схемы; дополнить его полями: применяемый пункт 6.10, период оценки, дата возникновения права, дата и основание выплаты. Для схемы 2 отдельно указать источник выручки и уменьшающийся процент; для схемы 3 — источник показателя дисциплины.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель подразделения до старта проекта направляет форму генеральному и финансовому директорам.<\/li>\n<li>После согласования отправляет утверждённую схему HR-директору; HR сверяет, что ссылка и схема совпадают.<\/li>\n<li>При событии выплаты КДП и бухгалтерия используют только утверждённую форму и приказ; ссылку проверяет чек-лист, а не память сотрудника.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой пункт указан в действующих формах и приказах по проектным премиям; применялась ли схема 2 или 3 за последний год?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: суммы проектов и выручка не предоставлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: ссылка проверена по полному тексту 10.txt.<\/p>"}, {"id": "К-PLAT-09", "slug": "PLAT-09", "title": "Формула схемы № 3 не сходится с заявленным максимумом", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 6.10.3, 6.11.3"], ["Тип", "ошибка в тексте / пробел"], ["Кто решает", "руководитель компании и юристы; HR проверяет методику"], ["Важность", "высокая: годовой результат формулы может быть на 20% выше заявленной годовой массы"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.10.3, стр. 6: «Максимальная бонусная масса для Руководителя продукта в год = 3м месячным окладам (3x)».<\/li>\n<li>Там же: «Реальная бонусная масса для Руководителя продукта в каждый квартал = (3x/4)*k».<\/li>\n<li>Там же: «Оценка непосредственного руководителя Работника принимает значение от 0,8 до 1,2» и «Оценка по дисциплине принимает значение от 0,2 до 1».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Если k = 1 (опросник 5 из 5), оценка руководителя максимальна 1,2, а дисциплина 1, формула даёт 0,90 оклада за квартал и 3,60 за четыре квартала, хотя заявлена максимальная масса 3. Это расчёт формулы, а не утверждение о фактической выплате (расчёт программой). Кроме того, что именно означает «Дисциплина», документ не говорит. Без выбора: ограничить коэффициент, изменить массу 3 на 3,6 или иначе связать показатели — автоматический расчёт небезопасен.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 3 требует указать виды, размеры, сроки, основания и условия премии; точную формулу оставляет локальному акту. Цитата: «определяются виды премий и их размеры, сроки, основания и условия выплаты премий работникам»., ст. 135, ред. 25.05.2026.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Рекомендация — сохранить действующие коэффициенты, а не урезать уже обещанную премию ради заголовка. Заменить подпункт 1 методики 6.10.3:<\/p>\n<blockquote>\n<ol>\n<li>Базовая бонусная масса за год составляет три месячных оклада (3x). Итоговый размер премии определяется по подпунктам 2–6 настоящей методики. При максимальных значениях всех коэффициентов расчётный размер за квартал составляет 0,9 месячного оклада, за четыре квартала — 3,6 месячного оклада при неизменном окладе. Отдельное ограничение итоговой премии тремя окладами не применяется.<\/li>\n<\/ol>\n<\/blockquote>\n<p>Этот вариант должен выбрать руководитель компании после проверки юристов: он сохраняет формулу, но исправляет описание её результата. Альтернатива — установить иной потолок на будущее с юридической проверкой договорных условий и переходного периода; готового уменьшения выплат здесь не предлагаем. В 6.11.3 добавить: расчёт сопровождается значениями каждого коэффициента и ссылкой на версию методики. Смысл дисциплины согласовать по <a href=\"#/k/PLAT-07\">К-PLAT-07<\/a>. Пока вопрос не решён, спорные расчёты проверяют люди; это не основание задерживать бесспорную причитающуюся сумму.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR фиксирует выбранную формулу и тестовые крайние значения в приложении.<\/li>\n<li>Бухгалтерия выполняет расчёт программой; КДП сверяет приказ и период.<\/li>\n<li>При коэффициенте вне диапазона или неполных данных процесс блокирует расчёт и требует решения роли, а не подставляет ноль.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Утверждалась ли схема 3 и есть ли действующая форма с иной формулой?<\/p>\n<p><strong>Цена вопроса.<\/strong> Расчёт формулы: превышение заявленного максимума при описанном сценарии составляет 0,60 оклада в год, то есть 20% от заявленной массы 3x (расчёт программой). Фактических данных нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в арифметической несостыковке и пробеле определения дисциплины; средняя в варианте правки.<\/p>"}, {"id": "К-PLAT-10", "slug": "PLAT-10", "title": "Персональная надбавка не имеет размера и срока", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 5.1–5.2; 10, п. 3.4; 12, раздел 6"], ["Тип", "пробел"], ["Кто решает", "руководитель компании: система; юристы и HR: текст"], ["Важность", "высокая: начисление нельзя воспроизвести по ЛНА"]], "html": "<p><strong>Было.<\/strong> 10, пп. 5.1–5.2, стр. 3: «персональная ежемесячная надбавка к окладу»; «Указанные надбавки могут устанавливаться в исключительных случаях Работникам по решению Исполнительного директора на основании Приказа Генерального директора».<\/p>\n<p><strong>Что не так.<\/strong> Нет размера или правила расчёта, условий начала и окончания, основания пересмотра и порядка отмены. В карте положений роль исполнительного директора отмечена как требующая проверки: в ответах HR названы руководитель HR и КДП, а отдельное действующее исполнение этой роли не подтверждено. Нельзя считать надбавку региональной: документ называет её персональной, районных коэффициентов в этом комплекте не найдено.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 2: «Системы оплаты труда, включая размеры тарифных ставок, окладов (должностных окладов), доплат и надбавок компенсационного характера ... и системы премирования, устанавливаются ... локальными нормативными актами». ТК ст. 132 ч. 2: «Запрещается какая бы то ни было дискриминация при установлении и изменении условий оплаты труда». /, ред. 25.05.2026, ст. 132 и 135.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Если компания хочет сохранить институт, заменить 5.1–5.2:<\/p>\n<blockquote>\n<p>5.1. Работникам в исключительных случаях может устанавливаться персональная ежемесячная надбавка к окладу. Предложение непосредственного руководителя содержит обоснование надбавки, размер в рублях либо процентах от оклада, дату начала и срок действия либо указание на бессрочное установление. Размер и условия закрепляются в приказе Генерального директора и трудовом договоре либо дополнительном соглашении к нему.\n5.2. Решение об установлении надбавки принимает Исполнительный директор; КДП оформляет приказ Генерального директора и необходимые изменения договора. Уменьшение и отмена не производятся только по истечении срока внутреннего согласования: применяются условия трудового договора и установленный законом порядок изменения оплаты.<\/p>\n<\/blockquote>\n<p>Это готовая минимальная правка без выдуманного нового основания и без отмены действующего согласующего. Если компания хочет критерии квалификации, дефицитности или нагрузки, она должна выбрать их отдельно и одинаково применять к сопоставимому труду. Если роль исполнительного директора отсутствует, её заменяют после решения по <a href=\"#/k/PLAT-22\">К-PLAT-22<\/a>. Если надбавка не применяется — возможность отмены 5.1–5.2 рассматривается только после проверки договоров и выплат. Выбор 11 улья о региональных надбавках не подменяет решение о персональной надбавке.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель подаёт обоснование; HR проверяет единообразие критерия и договор.<\/li>\n<li>Генеральный директор утверждает размер и срок; КДП оформляет приказ и соглашение.<\/li>\n<li>Бухгалтерия начисляет только по действующей записи; окончание срока вызывает проверку.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли действующие надбавки, кому и по какому основанию; существует ли роль исполнительного директора?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: реестра надбавок и размеров нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле текста; средняя в фактическом применении.<\/p>"}, {"id": "К-PLAT-11", "slug": "PLAT-11", "title": "Расчётный листок отправляется, но форма и срок возражений сформулированы не полностью", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "12, п. 6.7 и приложение 1; 10, пп. 10.10–10.11"], ["Тип", "пробел"], ["Кто решает", "главный бухгалтер и HR; юристы до утверждения формы"], ["Важность", "высокая: работник должен видеть состав зарплаты и удержания"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 6.7, стр. 13: «Не позднее дня выплаты второй части заработной платы ... направляется расчетный листок по форме Приложения № 1».<\/li>\n<li>Там же: «Работодатель считается выполнившим требование о вручении Работнику расчетного листка ... при условии неполучения от работника письменных возражений или уведомления о неполучении расчетного листка ... по истечении 3 (трех) рабочих дней».<\/li>\n<li>Приложение 1, стр. 16: «Начислено: Удержано:»; «НДФЛ»; «Выплачено»; «Общий облагаемый доход».<\/li>\n<li>10, п. 10.11, стр. 8: «Справки о размере заработной платы, начислениях и удержаниях из нее выдаются Работнику на основании его заявления».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Три рабочих дня после отправки — внутреннее правило о возражениях, а не замена обязанности выдать листок. В текстовом слое формы уже есть поле общей суммы к выплате; его сохраняем. Отдельного названия поля основания каждого удержания и компенсации за задержку в этом слое нет; общие строки могут позволять их раскрывать, поэтому не называем саму форму незаконной. Надо проверить реальное заполнение. Личный кабинет 1С и почта в ПВТР названы, но не показано, как фиксируются отправка и недоставка.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 136 чч. 1–2 (ред. 25.05.2026): «При выплате заработной платы работодатель обязан извещать в письменной форме каждого работника» о «составных частях заработной платы», «размерах иных сумм», «размерах и об основаниях произведенных удержаний» и «об общей денежной сумме, подлежащей выплате»; «Форма расчетного листка утверждается работодателем с учетом мнения представительного органа работников»., ст. 136, https://www.consultant.ru/document/cons_doc_LAW_34683/a0a891ee650687026ef53d5d1194983419be6793/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 12, п. 6.7:<\/p>\n<blockquote>\n<p>Не позднее дня выплаты второй части заработной платы Работнику направляется расчётный листок в личном кабинете в программе 1С или по служебному адресу электронной почты, указанному Работником. Расчётный листок содержит составные части заработной платы, иные начисленные суммы, каждое удержание с основанием, общую сумму к выплате и сведения о выплате компенсации за задержку при её начислении. Форма расчётного листка утверждается Работодателем с учётом мнения представительного органа работников в порядке статьи 372 Трудового кодекса Российской Федерации. Бухгалтерия сохраняет подтверждение даты и способа направления; при выявленной недоставке направляет документ повторно допустимым способом. Три рабочих дня для возражений не освобождают Работодателя от обязанности выдать листок и не лишают Работника права оспорить расчёт.<\/p>\n<\/blockquote>\n<p>Работодатель утверждает подготовленную КДП и бухгалтерией форму; если есть представительный орган, пройти ст. 372. В 10, п. 10.10 дать ссылку на 12, п. 6.7, а 10.11 не смешивать со стандартным листком.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Бухгалтерия формирует листок; программа подставляет начисления, удержания и основания из расчёта.<\/li>\n<li>Бухгалтерия сохраняет доступное подтверждение размещения в кабинете или отправки по почте; возможности журнала 1С предварительно проверяются, не предполагаются готовыми.<\/li>\n<li>Сотрудник видит листок и задаёт возражение; бухгалтерия регистрирует его, а спорное начисление проверяется отдельно.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Утверждалась ли форма отдельным приказом и фиксируется ли факт доставки в 1С?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: число недоставленных листков и обращений неизвестно.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в требованиях ст. 136; средняя в оценке реального заполнения формы: использован текстовый слой PDF, визуальный вид не проверен.<\/p>"}, {"id": "К-PLAT-12", "slug": "PLAT-12", "title": "Окончательный расчёт надо привязать к дню прекращения договора и не терять заработанную премию", "imp": "высокая", "docs": ["07", "10", "12"], "meta": [["Документы", "10, п. 10.13; 07, п. 3.4; 12, п. 2.16"], ["Тип", "устарело или неясно"], ["Кто решает", "руководитель HR, главный бухгалтер и юристы"], ["Важность", "высокая: ошибка затрагивает последний платёж и спор о премии"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 10.13, стр. 8: «При прекращении действия трудового договора окончательный расчет по причитающейся Работнику заработной плате производится в последний день работы».<\/li>\n<li>07, п. 3.4, стр. 3: «Увольнение работника производится с оплатой труда за фактически отработанное время».<\/li>\n<li>10, п. 6.8.2, стр. 4: «Выплата премий ... осуществляется не позднее календарного месяца, следующего за месяцем издания Приказа».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> «Последний день работы» может читаться как последний фактический выход, хотя закон использует день прекращения договора; при отпуске или болезни это может быть разная дата. Пункт 6.8.2 не говорит, как обработать премию за уже завершённый период после увольнения. Не утверждаем, что каждая премия должна попасть в расчёт немедленно: сначала установить, возникло ли право и какой срок выбран в системе.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 140 ч. 1 (ред. 25.05.2026): «При прекращении трудового договора выплата всех сумм, причитающихся работнику от работодателя, производится в день увольнения работника». Ч. 2: «В случае спора о размерах сумм ... работодатель обязан ... выплатить не оспариваемую им сумму»., ст. 140, https://www.consultant.ru/document/cons_doc_LAW_34683/274f022222909efcef192f7615b143e34309164f/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 10, п. 10.13:<\/p>\n<blockquote>\n<p>При прекращении трудового договора окончательный расчёт всех причитающихся Работнику сумм производится в день увольнения. Если Работник в день увольнения не работал, суммы выплачиваются не позднее следующего дня после предъявления требования о расчёте. При споре выплачивается неоспариваемая сумма. Бесспорные премиальные суммы, уже причитающиеся на дату увольнения, включаются в окончательный расчёт. Для выплат, право на которые возникает после этой даты по установленной системе, КДП и Бухгалтерия отдельно фиксируют основание и законный срок; сам факт увольнения не отменяет заработанного права. Настоящий пункт не ограничивает более ранний расчёт.<\/p>\n<\/blockquote>\n<p>В 07, п. 3.4 фразы о последнем дне работы нет. Дополнить его ссылкой: все причитающиеся при увольнении суммы выплачиваются по пункту 10.13 Положения об оплате труда. Согласовать с группой PRIEM, не переписывая её процедуру увольнения. В 12, п. 2.16 проверить связанную ссылку. Премиальные сроки согласовать с <a href=\"#/k/PLAT-06\">К-PLAT-06<\/a>; не выплачивать автоматически бонус, для которого право ещё не возникло.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП создаёт событие прекращения договора и дату увольнения.<\/li>\n<li>Бухгалтерия рассчитывает все бесспорные суммы; КДП передаёт сведения о завершённых периодах премирования.<\/li>\n<li>Спорная премия получает отдельную отметку и юридическую проверку, но бесспорный расчёт не задерживается.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас считают премии при увольнении и где записано событие возникновения права?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: выгрузки увольнений и премий нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в норме ст. 140 и двусмысленности 10.13; средняя для премий до проверки системы.<\/p>"}, {"id": "К-PLAT-13", "slug": "PLAT-13", "title": "Порядок возмещения ущерба и формулировка ПВТР не связаны", "imp": "высокая", "docs": ["10", "12", "15"], "meta": [["Документы", "12, пп. 3.2.22, 4.19, 10.4; 10, п. 10.10; 15, п. 2.6"], ["Тип", "противоречие между документами; проверка юристами"], ["Кто решает", "юристы и руководитель HR; бухгалтерия исполняет утверждённый порядок"], ["Важность", "высокая: нельзя превращать внутренний текст о материальной ответственности в автоматический вычет"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.22: «работник обязан возместить работодателю причиненный ему прямой действительный ущерб»; далее: «работник несет материальную ответственность как за прямой действительный ущерб, так и за ущерб, возникший у Общества в результате возмещения им ущерба иным лицам».<\/li>\n<li>12, п. 4.19: «оба работника несут солидарную ответственность ... включая финансовую».<\/li>\n<li>12, п. 10.4: «Работник и Работодатель возмещают друг другу только прямой действительный ущерб».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Фраза 3.2.22 о возмещении ущерба третьим лицам сама по себе соответствует определению прямого ущерба в ТК 238: её не объявляем противоречием. Вопрос — солидарная финансовая ответственность по 4.19 и отсутствие в нём связи с проверкой и законным порядком взыскания. Основной разбор ответственности ведёт DISC, здесь только связь с удержанием зарплаты. Статьи 238, 241–245, 247–248 теперь есть в доборе; не утверждаем, что получен весь диапазон 238–250.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 238 ч. 1: «Работник обязан возместить работодателю причиненный ему прямой действительный ущерб. Неполученные доходы (упущенная выгода) взысканию с работника не подлежат». ТК ст. 247 чч. 1–2: «работодатель обязан провести проверку для установления размера причиненного ущерба и причин его возникновения»; «Истребование от работника письменного объяснения ... является обязательным». ТК ст. 248 ч. 1: «Взыскание с виновного работника суммы причиненного ущерба, не превышающей среднего месячного заработка, производится по распоряжению работодателя»; условия судебного взыскания проверяют по полной ч. 2 этой статьи, а не по обобщению о любом споре., ст. 238, 247, 248, ред. 25.05.2026.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Передать DISC предложение заменить после проверки юристами оговорку о солидарной финансовой ответственности в 12, п. 4.19 ссылкой на главу 39 ТК. Пункт 3.2.22 не переписывать как ошибочный; пункт 10.4 о взаимной ответственности также не заменять текстом только об ответственности работника. Для дополнения пункта 10.10 документа 10 предлагается:<\/p>\n<blockquote>\n<p>Работник возмещает Работодателю только прямой действительный ущерб в случаях и порядке, установленных Трудовым кодексом Российской Федерации и иными федеральными законами. До решения о возмещении Работодатель устанавливает размер и причину ущерба, истребует письменное объяснение и предоставляет Работнику возможность ознакомиться с материалами проверки. Удержание из заработной платы производится только в предусмотренном законом порядке и с учётом пункта 10.10 Положения об оплате труда.<\/p>\n<\/blockquote>\n<p>В 15, п. 2.6 не подставлять исходную фразу как новую. Добавить согласованную с KOM ссылку на пункт 10.10 документа 10: факт нарушения правил поездки не означает автоматического удержания из зарплаты. Действующие гарантии и формы передачи дел сохраняются; новое соглашение не может само создать не предусмотренную законом ответственность.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель фиксирует событие и сохраняет документы.<\/li>\n<li>Комиссия/назначенные специалисты устанавливают размер и причину; КДП запрашивает объяснение.<\/li>\n<li>Юристы выбирают распоряжение, добровольное соглашение или суд; бухгалтерия не удерживает до основания.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> В каких случаях реально взыскивали ущерб и есть ли утверждённая процедура проверки?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: реестр ущерба и возмещений отсутствует.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в наличии внутренних расхождений и цитатах норм; высокая в том, что правку должны подтвердить юристы.<\/p>"}, {"id": "К-PLAT-14", "slug": "PLAT-14", "title": "Ручную передачу премиальной записки надо связать с оформлением приказа", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 6.8.2–6.8.3, 6.11.1–6.11.3; ответы HR от 10.11, раздел 1.1"], ["Тип", "лишняя ручная работа; фактический маршрут требует подтверждения"], ["Кто решает", "руководитель HR и руководитель компании; юристы при изменении ЛНА"], ["Важность", "высокая: документы могут вести заявку не к той роли и системе"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.8.2: «Основанием для издания такого приказа является служебная записка непосредственного руководителя работника ... на имя Генерального директора».<\/li>\n<li>10, п. 6.8.3: размер определяется «на основании предложений непосредственного руководителя работника или Отдела персонала».<\/li>\n<li>10, п. 6.11.1: «направляет ее по служебной электронной почте HR-Директору»; подтверждение — «HR директором, Финансовым директором и Генеральным директором».<\/li>\n<li>Ответ HR от 10.11, раздел 1.1: «Командировки, сверхурочные, премии и подарки, справки с места работы (приказы) 1С, Диадок = 5%»; там же: «все процедуры кадров уходят на подпись СЕО и работнику (Диадок, бумага)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Документ 10 разводит общую премию (записка непосредственного руководителя на имя генерального директора) и проектную схему 1 (записка HR-директору после запуска), а ответы HR описывают общий кадровый поток через 1С/Диадок и подписи. Это не доказывает, что практика нарушает документ: возможно, 1С/Диадок — только оформление уже принятого решения. Нужно отделить инициатора, решающего, оформляющего приказ и платящего бухгалтера; не вносить в «как сейчас» неподтверждённый маршрут.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 135 ч. 2–3: «системы премирования устанавливаются ... локальными нормативными актами»; «определяются виды премий и их размеры, сроки, основания и условия выплаты»., ст. 135, ред. 25.05.2026.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Не менять ЛНА по одному ответу HR. В каталог процесса «Премии / разовая премия» записать как проверяемый маршрут:<\/p>\n<blockquote>\n<p>Инициатором является непосредственный руководитель либо Отдел персонала в пределах пункта 6.8.3; для проектных схем действует пункт 6.11. Решение и размер подтверждает Генеральный директор либо лицо по доверенности; Финансовый директор согласует в случаях, предусмотренных Положением. КДП проверяет комплект и оформляет приказ; Бухгалтерия начисляет и выплачивает по приказу и утверждённой схеме. Канал подачи и система подписи определяются действующим порядком ЭДО; электронная карточка не заменяет служебную записку и приказ.<\/p>\n<\/blockquote>\n<p>В 10, пп. 6.8.2 и 6.11.1 добавить таблицу процесса с колонками: инициатор, решающий, проверяющий комплект, оформляющий приказ, начисляющий, срок, канал. При фактическом переходе на другой канал менять ЛНА и связанные формы, а не только каталог.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель выбирает вид премии и заполняет обязательные поля основания, периода и суммы.<\/li>\n<li>КДП проверяет комплект, направляет на предусмотренное согласование и хранит приказ.<\/li>\n<li>Бухгалтерия начисляет; журнал хранит роли и дату решения, не общие сведения о зарплате.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Используется ли 1С/Диадок только для приказа или там же подаются и с
