/strong> Новичок, Наставник и приглашённые коллеги обязаны участвовать в рабочем мероприятии после окончания дня. Общие правила компании требуют специального оформления работы сверх установленной продолжительности, а регламент адаптации этого не учитывает. Если на деле встречаются в рабочие часы, проблема только в устаревшем тексте; если нет — надо проверить учёт и оплату, а не сразу объявлять все встречи неоплаченными сверхурочными.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 99 ч. 1 (ред. 25.05.2026): «Сверхурочная работа - работа, выполняемая работником по инициативе работодателя за пределами установленной для работника продолжительности рабочего времени». Ч. 5: «Не допускается привлечение к сверхурочной работе беременных женщин, работников в возрасте до восемнадцати лет». Особенности суммированного учёта, неполного времени и иных режимов проверяет группа VREM; название встречи не выводит её из рабочего времени.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 13, п. 3.3.4, заменить предложение о вечере:<\/p>\n<blockquote>\n<p>Встречи по адаптации проводятся в пределах установленного рабочего времени каждого участника и включаются в его рабочую нагрузку. Наставник согласует время с новым сотрудником и приглашенными работниками с учетом их режимов работы. Невозможность согласовать время не является основанием для обязательной встречи после окончания рабочего дня. При необходимости работы за пределами рабочего времени применяется действующий порядок привлечения к такой работе с соблюдением запретов, оформления, учета и компенсации.<\/p>\n<\/blockquote>\n<p>В обеих строках раздела 4 заменить комментарий о встречах после дня на: <\/p>\n<blockquote>\n<p>В пределах установленного рабочего времени всех участников.<\/p>\n<\/blockquote>\n<p>Остальные требования о знакомстве с командой сохранить. Отдельное исключение для адаптации в 02 и 10 не вводить; при их изменении группой VREM сохранить эту отсылку к общему порядку.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR/Наставник планирует встречи в доступные рабочие интервалы.<\/li>\n<li>Руководитель освобождает соответствующую часть нагрузки.<\/li>\n<li>Если требуется выход за режим, он рассматривается отдельно, до встречи, по правилам сверхурочной/выходного дня; журнал адаптации не заменяет согласие и приказ.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> В какое время реально проводят встречи и учитывается ли участие всех приглашённых?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: длительность встреч и фактические режимы неизвестны.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту; средняя по последствиям на практике.<\/p>"}, {"id": "К-PRIEM-07", "slug": "PRIEM-07", "title": "Порядок ознакомления с ЛНА начинается после оформления", "imp": "высокая", "docs": ["12", "13"], "meta": [["Документы", "13, пп. 3.2.1–3.2.2; 12, п. 2.10 и приказ о введении ПВТР, п. 3"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR и КДП; юристы до утверждения текста"], ["Важность", "высокая: приёмный чек-лист может поставить обязательное ознакомление после договора"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>13, п. 3.2.1: «После оформления сотрудника, HR специалист проводит вводную презентацию и знакомит с внутренними источниками информации».<\/li>\n<li>13, п. 3.2.2: «Специалист по кадровому делопроизводству оформляет нового сотрудника в соответствии с ТК РФ, знакомит с внутренними документами под подпись».<\/li>\n<li>12, п. 2.10: «При приеме на работу (до подписания трудового договора) Работодатель знакомит лицо, поступающее на работу, под подпись с настоящими Правилами внутреннего трудового распорядка, иными локальными нормативными актами, инструкциями и положениями, непосредственно связанными с трудовой деятельностью работника».<\/li>\n<li>Приказ о введении 12, п. 3: «ознакомить всех работников, а также всех вновь принимаемых работников до заключения с ними трудового договора».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 13 порядок чтения выглядит частью первого дня после оформления, а в 12 он до подписания договора. Это нельзя назвать доказанным нарушением на практике: в ответах HR сказано, что документы дают до приёма, но действующий регламент не отражает это однозначно. Для новичка нужен один момент и одна отметка, иначе КДП не видит, какая версия правила действует.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 68 ч. 3 (ред. 25.05.2026): «При приеме на работу (до подписания трудового договора) работодатель обязан ознакомить работника под роспись с правилами внутреннего трудового распорядка, иными локальными нормативными актами, непосредственно связанными с трудовой деятельностью работника, коллективным договором». ТК ст. 22 ч. 2 (ред. 25.05.2026): «знакомить работников под роспись с принимаемыми локальными нормативными актами, непосредственно связанными с их трудовой деятельностью».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 13, п. 3.2.2:<\/p>\n<blockquote>\n<p>3.2.2. До подписания трудового договора специалист по кадровому делопроизводству знакомит лицо, поступающее на работу, под подпись с Правилами внутреннего трудового распорядка, иными локальными нормативными актами, непосредственно связанными с трудовой деятельностью, и коллективным договором при его наличии. Ознакомление проводится в бумажной форме или в кадровом электронном документообороте в установленном порядке. После оформления сотрудника специалист по кадровому делопроизводству передает в личное дело подтверждение ознакомления.<\/p>\n<\/blockquote>\n<p>В 13, п. 3.2.1, заменить начало на формулировку: <strong>В первый рабочий день сотрудник Отдела персонала встречает нового сотрудника,<\/strong> затем сохранить текст о знакомстве с КДП и системным администратором и вводной презентации. В welcome-презентации оставить только организационные материалы, не заменяющие подпись. В 12, п. 2.10 и приказе оставить этот же срок; ссылки в 03 на дистанционный порядок согласовать с общим ЛНА об ЭДО.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Оффер/приём запускает закрытый список обязательных ЛНА по должности.<\/li>\n<li>КДП получает подтверждение ознакомления до подписи договора. При отказе или технической проблеме немедленно организует законный резервный способ; исключение не оформляется одним разрешением юриста.<\/li>\n<li>В день выхода HR проводит вводную встречу и отмечает только организационные материалы.<\/li>\n<li>Подтверждения попадают в личное дело и реестр подписей.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Практика даёт обязательные ЛНА до договора всем кандидатам или только тем, кто подписывает через кадровый ЭДО? Сколько документов входит в список?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. В встреча с HR и КДП 11.11 сказано, что до приёма знакомят с 50–60 документами, но это оценка разговора, не выгрузка.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту нормы и различию формулировок; средняя по фактическому порядку.<\/p>"}, {"id": "К-PRIEM-08", "slug": "PRIEM-08", "title": "ЭДО для кадровых документов не описан единым порядком", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "12, п. 1.3 и пп. 5.5–5.7; 03, п. 2.5; встреча с HR и КДП 11.11"], ["Тип", "пробел и устаревшая связь с законом"], ["Кто решает", "руководитель компании — ввод ЭДО; юристы — ЛНА и категории работников"], ["Важность", "высокая: почти все кадровые подписи идут через Диадок, а ПВТР описывают ЭДО главным образом для дистанционных"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 1.3: «Электронный документооборот, предусмотренный настоящими Правилами трудового распорядка осуществляется в соответствии со статьями 312.2 и 312.3 Трудового кодекса Российской Федерации».<\/li>\n<li>12, п. 5.5: «Ознакомление дистанционных/частично дистанционных работников … осуществляется путем рассылки информации по официальным служебным адресам электронной почты … либо в формате ЭДО путем проставления УКЭП работника».<\/li>\n<li>встреча с HR и КДП 11.11: «Кадровые документы почти все подписываются в Диадоке, кроме немногих сотрудников».<\/li>\n<li>встреча с HR и КДП 11.11: «Системы задач для кадров нет, “всё в почте”».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Действующий ПВТР связывает ЭДО с дистанционной работой, а практика шире. Отправка письма сама по себе не даёт того же подтверждения, что кадровый ЭДО. Неизвестно, введён ли общий порядок решением работодателя и какой ЛНА содержит систему, виды документов, сроки подписания и инструктаж. Это пробел документа, а не утверждение, что подписи в Диадоке недействительны.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.2 чч. 1–3 и 10–12 (ред. 25.05.2026): «Электронный документооборот вводится работодателем на основании локального нормативного акта»; «Порядок осуществления электронного документооборота утверждается работодателем»; «Ознакомление лица, поступающего на работу, с документами, предусмотренными частью третьей статьи 68 настоящего Кодекса, может осуществляться в электронной форме»; «Работодатель несет расходы на получение работником электронной подписи (в случае ее отсутствия) и ее использование». ТК ст. 22.1 ч. 4: «Электронный документооборот может осуществляться работодателем посредством следующих информационных систем».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В отдельном ЛНА с предлагаемым названием <strong>Порядок электронного документооборота в сфере трудовых отношений<\/strong> закрепить, а в 12, п. 1.3, заменить ссылку на узкий дистанционный порядок:<\/p>\n<blockquote>\n<p>1.3. Электронный документооборот в сфере трудовых отношений осуществляется в соответствии со статьями 22.1–22.3, 68 и иными применимыми нормами Трудового кодекса Российской Федерации и Порядком электронного документооборота Общества. Правила настоящего раздела применяются с учетом указанного Порядка. Для документов, для которых законом предусмотрена бумажная форма или отдельный способ ознакомления, применяется установленный законом способ.<\/p>\n<\/blockquote>\n<p>В новом ЛНА перечислить систему работодателя, категории работников, документы, подпись, способ фиксации получения, сроки, доступ, хранение, резервный бумажный маршрут и оплату подписи. Не называть Диадок частью правил, пока юристы не подтвердят ввод именно этой системы. Пункты 12, пп. 5.5–5.7 и 03, п. 2.5 синхронизировать с новым ЛНА; бумажные исключения сохранить.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель компании утверждает ЛНА о ЭДО и уведомляет работников по предусмотренному порядку.<\/li>\n<li>КДП при приёме выбирает бумагу или ЭДО по категории документа и работника.<\/li>\n<li>Система фиксирует отправку, получение, подпись и отказ; КДП сверяет реестр.<\/li>\n<li>При недоступности системы применяется заранее описанный резервный маршрут.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельный приказ/ЛНА о введении кадрового ЭДО, помимо ПВТР? Какие категории работников подписывают документы не через Диадок?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. ответы HR 10.11 оценивает процедуры, уходящие на подпись работнику и руководству, как регулярные; фактическое количество документов не выгружено.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пробелу в ПВТР; средняя по юридической оценке уже подписанных документов.<\/p>"}, {"id": "К-PRIEM-09", "slug": "PRIEM-09", "title": "Шаги приёма не сведены в один чек-лист", "imp": "высокая", "docs": ["03", "12", "13"], "meta": [["Документы", "12, пп. 2.2–2.3, 2.6, 2.10–2.13; 13, пп. 2.1–2.2, 3.2.1–3.2.3; 03, пп. 3.3–3.8"], ["Тип", "лишняя ручная работа и пробел исполнителя"], ["Кто решает", "руководитель HR и руководитель КДП; ИТ и ОТ подтверждают свои шаги"], ["Важность", "высокая: приём включает документы, подпись, технику, доступы и инструктаж, но события разнесены по положениям"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>13, п. 2.1: «до выхода сотрудника предполагаемого первого рабочего дня нового сотрудника создает задачу в Jira на получение техники».<\/li>\n<li>13, п. 2.2: «К моменту первого рабочего дня нового сотрудника Офис-менеджером должно быть полностью подготовлено рабочее место».<\/li>\n<li>13, п. 3.2.3: «Системный администратор осуществляет выдачу техники и настройку корпоративных информационных систем в соответствии с задачей в Jira».<\/li>\n<li>12, п. 2.12: «Не позднее одного рабочего дня с момента фактического выхода на работу, Работнику создается служебный адрес электронной почты».<\/li>\n<li>03, п. 3.5: «Первичное ознакомление проводит лицо, на которое приказом генерального директора возложены эти обязанности».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> У 13 есть задача на технику, но нет единого владельца приёмного события, статусов и срока подтверждения доступа. В 12 почта создаётся в срок, а в ответы HR 10.11 фактический план включает почту, Mattermost, Confluence и онлайн-встречу. В 03 лицо по инструктажу определяется отдельным приказом, которого в рассмотренных ЛНА нет. Нельзя утверждать, что техника или инструктаж пропускаются: не хватает общей контрольной точки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 214 (ред. 25.05.2026) содержит обязанность работодателя «недопущение работников к исполнению ими трудовых обязанностей без прохождения в установленном порядке обучения по охране труда»; ТК ст. 219: «Обучение по охране труда предусматривает получение знаний, умений и навыков в ходе проведения: … инструктажей по охране труда». Для дистанционных работников применимость общих обязанностей проверяется с учетом ТК 312.7. Правила ОТ в данном кейсе не переписываются и не объявляются одинаковыми для всех режимов.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 13 добавить после п. 2.2 новый п. 2.3:<\/p>\n<blockquote>\n<p>2.3. Сотрудник Отдела персонала ведет карточку приёма нового сотрудника до закрытия всех обязательных шагов: документы и договор; ознакомление с локальными нормативными актами; рабочее место; техника; служебная почта и корпоративные системы; применимые к данному работнику мероприятия по охране труда, определенные ответственным специалистом с учетом режима работы и законодательства. До первого рабочего дня Отдел персонала назначает владельца карточки; непосредственный руководитель подтверждает состав доступа и трудовую функцию; КДП проверяет обязательное ознакомление до договора. ИТ и офис-менеджер подтверждают готовность техники, места и необходимых доступов к началу исполнения работы; если доступы ещё не готовы, руководитель определяет допустимые вводные задачи и фиксирует препятствие. Срок создания служебного адреса сохраняется по пункту 2.12 ПВТР. За каждый шаг назначается исполнитель и срок. Исполнитель отмечает результат в карточке и передает подтверждающий документ сотруднику Отдела персонала. Карточка приёма не считается закрытой до проверки обязательных шагов. Допуск к конкретным работам определяется применимыми требованиями охраны труда, а не одним статусом карточки.<\/p>\n<\/blockquote>\n<p>В п. 2.1 использовать <strong>карточку приёма<\/strong>, а не новую отдельную карточку в дополнение к действующему Jira-процессу. До проверки интеграции общий статус ведёт Отдел персонала вручную со ссылкой на существующую задачу Jira. После подтверждения HR можно вести карточку целиком в Jira, если она уже является системой приёмного события. Если Jira только создаёт задачу на технику, не расширять её функции без проверки. В 12 добавить ссылку на чек-лист; в 03 указать реквизиты приказа о лице, ответственном за инструктаж, после его предъявления.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП вручную регистрирует подтверждённое событие приёма с датой выхода; автоматическое получение из 1С допускается только после проверки интеграции.<\/li>\n<li>До выхода HR, ИТ и офис-менеджер подтверждают место, технику и готовность доступов; КДП подтверждает договор и ЛНА.<\/li>\n<li>В первый день КДП и ИТ отмечают выдачу, почту и системы; специалист ОТ определяет применимые мероприятия, включая специальные требования для дистанционных работников, и фиксирует исполнение по своему порядку.<\/li>\n<li>Карточка закрывается только после всех подтверждений; просрочка идёт руководителю HR.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Jira сейчас ведёт весь приём или только технику/доступы? Какой приказ назначает лицо для вводного инструктажа?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в разрозненности правил; средняя в фактических пропусках.<\/p>"}, {"id": "К-PRIEM-10", "slug": "PRIEM-10", "title": "В таблице адаптации разная частота одной встречи", "imp": "средняя", "docs": ["13"], "meta": [["Документы", "13, п. 3.3.4 и раздел 4, страницы 2–3 скана"], ["Тип", "ошибка в тексте, меняющая срок"], ["Кто решает", "руководитель HR"], ["Важность", "средняя: наставник и новичок получают разные интервалы"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>13, п. 3.3.4: «В течение последующих 2-х недель работы нового сотрудника встречи проводятся один раз в два дня».<\/li>\n<li>13, раздел 4, стр. 2: в заголовке блока напечатано «Встречи с наставником на 3й и 4й недели работы нового сотрудника», в колонке частоты — «1 раз в 2 рабочих дня». Это чтение скана; проверка цитат текстового слоя для этих сканированных фрагментов невозможна.\nСтр. 3 скана: заголовок начинается как «Встречи с HR … работы сотрудника»; полный вариант с границами приведён ниже как предложение после сверки, а не как цитата текстового слоя.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Для первых четырёх недель это почти одно правило, но «два дня» и «два рабочих дня» дают разные интервалы при выходных и графиках. Период HR-встреч тоже имеет орфографическую ошибку «в течении» и разные границы. Не следует молча исправлять скан: руководитель HR должен выбрать рабочие или календарные дни.<\/p>\n<p><strong>Закон.<\/strong> Специальной нормы о частоте внутренних адаптационных встреч в разрешённой базе нет, проверить юристам не требуется для выбора внутреннего расписания; нормы о рабочем времени и сверхурочных проверяет VREM.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 13, п. 3.3.4 и разделе 4 оставить единый вариант:<\/p>\n<blockquote>\n<p>В течение первых 2-х недель работы нового сотрудника Наставник проводит с ним встречи каждый рабочий день. В течение 3-й и 4-й недель работы нового сотрудника встречи проводятся один раз в 2 рабочих дня. Встречи планируются в рабочее время участников в соответствии с пунктом 3.3.4 настоящего Регламента.<\/p>\n<\/blockquote>\n<p>Заменить заголовки раздела 4:<\/p>\n<blockquote>\n<p>Встречи с HR в течение первых 30 календарных дней работы сотрудника<\/p>\n<p>Встречи с HR с 31-го календарного дня по окончание периода адаптации, определенного пунктом 1.3<\/p>\n<\/blockquote>\n<p>Удалить из текста двойной вариант границ и исправить «в течении» на «в течение». Ссылку на пункт 3.3.4 оставить только после согласования с <a href=\"#/k/PRIEM-06\">К-PRIEM-06<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Процесс считает рабочие дни по графику конкретного участника, а не вручную по календарю.<\/li>\n<li>HR получает задачи на еженедельные и двухнедельные встречи по единой границе.<\/li>\n<li>Любое изменение расписания фиксирует HR; Наставник не меняет частоту молча.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Нужны рабочие дни или календарные? Вторая HR-фаза начинается с 31-го дня или с 30-го?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: длительность и число встреч фактически не представлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: оба варианта видны в скане, а разницу рабочих и календарных дней подтверждает страница 2.<\/p>"}, {"id": "К-PRIEM-11", "slug": "PRIEM-11", "title": "Сроки отчёта и заключения не подходят короткому испытанию", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "07, пп. 2.15, 2.17–2.20, 3.1–3.2; 12, п. 2.7"], ["Тип", "пробел в процессе и сроках"], ["Кто решает", "руководитель HR; юристы проверяют юридическое исчисление"], ["Важность", "высокая: обязательные действия могут быть назначены после даты, когда испытание уже закончилось"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>07, п. 2.15: «не позднее чем за две недели до окончания испытательного срока».<\/li>\n<li>07, п. 2.17: «За две недели до окончания испытательного срока».<\/li>\n<li>07, п. 2.20: «не позднее чем за неделю до окончания испытания работника».<\/li>\n<li>07, п. 3.1: «не позднее чем за три дня с указанием причин».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В положении все сроки заданы от конца, но нет проверки, что испытание достаточно длинное. Для двухнедельного испытания с первого рабочего дня 16.11.2026 программа показывает условный последний день 29.11.2026, а дата «за две недели» — 15.11.2026, раньше начала; расчёт (расчёт программой). Для трёхмесячного условного примера остаётся 4 дня между заключением за неделю и последним днём трёхдневного предупреждения; расчёт там же, строки 3–4. Это не расчёт юридических сроков, а проверка, что текущая схема требует ветвления.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 71 ч. 1 (ред. 25.05.2026): «При неудовлетворительном результате испытания работодатель имеет право до истечения срока испытания расторгнуть трудовой договор с работником, предупредив его об этом в письменной форме не позднее чем за три дня с указанием причин». ТК ст. 71 ч. 3: «Если срок испытания истек, а работник продолжает работу, то он считается выдержавшим испытание».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 07 добавить п. 2.20.1:<\/p>\n<blockquote>\n<p>2.20.1. При установлении испытания КДП рассчитывает календарь испытания по условию трудового договора с учетом периодов, не включаемых в срок. Если даты по пунктам 2.15, 2.17 и 2.20 наступают до начала работы или не оставляют времени для фактической оценки, для такого работника эти внутренние упреждающие сроки заменяются индивидуальными датами, определенными КДП и непосредственным руководителем до начала работы. В календаре отдельно указываются задания, срок отчета, беседы и заключения, предполагаемый день расторжения при отрицательном результате и крайний срок письменного предупреждения. Невозможность установить обоснованный результат в оставшийся законный срок не дает права продлевать испытание или увольнять после его окончания. При неудовлетворительном результате руководитель кадровой службы обеспечивает письменное предупреждение работника не позднее чем за три дня до предполагаемого расторжения договора; расторжение допускается только до истечения испытания. После истечения срока испытания увольнение по результату испытания не оформляется.<\/p>\n<\/blockquote>\n<p>В п. 2.20 конкретную роль адресата определить после ответа HR; до этого использовать исходное обозначение руководителя кадровой службы. В 13 не дублировать этот календарь; только ссылаться на 07.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Приём с испытанием создаёт конец срока и обратные напоминания.<\/li>\n<li>Система проверяет конфликт с коротким договором и передаёт исключение руководителю HR.<\/li>\n<li>Руководитель даёт заключение; при «не прошёл» КДП проверяет дату письменного предупреждения и причины.<\/li>\n<li>При пропуске допустимого срока процесс блокирует увольнение по этому основанию до решения юристов.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас рассчитывают конец испытания при больничном и коротком договоре? Кто именно скрывается за «руководителем кадровой службы» в 07?<\/p>\n<p><strong>Цена вопроса.<\/strong> 4 дня в условном трёхмесячном примере и дата беседы до начала работы в коротком примере рассчитаны программой, строки 3–4; это не данные сотрудников.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по отсутствию ветки и срокам; средняя по календарному исчислению — проверить юристам.<\/p>"}, {"id": "К-PRIEM-12", "slug": "PRIEM-12", "title": "Удовлетворительный итог испытания не оставляет события для следующих процессов", "imp": "средняя", "docs": ["07", "10"], "meta": [["Документы", "07, пп. 2.18–2.20, 3.3, 3.9; 10, пп. 6.8.2–6.8.3, 9.5"], ["Тип", "пробел процесса"], ["Кто решает", "руководитель HR; по ДМС — руководитель компании, вариант из черновика выборов не принят"], ["Важность", "средняя: КДП не получает подтверждённый статус для связанных кадровых действий"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>07, п. 2.18: «письменное заключение … о результатах испытания, указывая \"прошел испытание\" или \"не прошел испытание\"».<\/li>\n<li>07, п. 2.20: «Заключение о прохождении испытания поступают к лицу, осуществляющему руководство кадровой службой, не позднее чем за неделю до окончания испытания работника».<\/li>\n<li>07, п. 3.3: «Об удовлетворительном результате испытания работнику устно сообщает непосредственный руководитель».<\/li>\n<li>10, п. 6.8.2: «Выплата премий … осуществляется не позднее календарного месяца, следующего за месяцем издания Приказа».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Письменное заключение есть, но положительный итог наружу сообщается устно и отдельная запись/дата/исполнитель окончательного статуса не заданы. Нельзя утверждать, что запись в 1С отсутствует: это вопрос к КДП. Но без единого события невозможно надёжно запустить выбранные позднее процессы, например ДМС, и отличить «прошёл» от пропущенного заключения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 71 ч. 3 (ред. 25.05.2026): «Если срок испытания истек, а работник продолжает работу, то он считается выдержавшим испытание». Специальной нормы о записи результата в 1С нет; это предлагаемый внутренний способ учета. Условия ДМС проверяются по действующим договорам и правилам компании.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 07, п. 3.3:<\/p>\n<blockquote>\n<p>3.3. В случае признания результата испытания удовлетворительным непосредственный руководитель передает письменное заключение руководителю кадровой службы не позднее срока, установленного пунктом 2.20. Руководитель кадровой службы регистрирует заключение, а окончательный статус испытания, дату и основание фиксирует при наступлении соответствующего юридического события. Заключение за неделю до окончания само по себе не означает досрочного прекращения испытания. Работнику сообщается итог установленным способом. Истечение срока при продолжающейся работе фиксируется как прохождение испытания независимо от наличия заключения. Запись не изменяет дату окончания испытания и не заменяет трудовой договор.<\/p>\n<\/blockquote>\n<p>Добавить после него:<\/p>\n<blockquote>\n<p>3.3.1. Сведения о результате испытания передаются только в связанные кадровые процессы, для которых такое событие предусмотрено утверждённым правилом: выплату по действующей схеме, социальную программу или иной процесс. Само по себе прохождение испытания не создаёт право на выплату или льготу, если такое право не установлено отдельным документом.<\/p>\n<\/blockquote>\n<p>В 10, пп. 6.8.2–6.8.3 и 9.5 не вставлять автоматическое право; добавить ссылку на событие только после решения компании о ДМС и проверки условий договора страхования. Пункт 3.9 оставить.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель передаёт заключение в срок.<\/li>\n<li>КДП регистрирует результат и дату; работнику направляется сообщение.<\/li>\n<li>Процесс читает событие только в разрешённых маршрутах; КДП проверяет основание премии или программы.<\/li>\n<li>Если заключения нет, задача эскалируется. Если испытание истекло и работник продолжает работу, он считается выдержавшим испытание по закону независимо от наличия заключения; КДП фиксирует это основание, а не ждёт разрешения руководителя.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где сейчас отмечают результат испытания? Выбран ли вариант ДМС и есть ли в договоре страхования правило после испытательного срока?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; количество приёмов и действий после испытания не выгружено.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по отсутствию описанного события; низкая по фактической записи, которую нужно спросить.<\/p>"}, {"id": "К-PRIEM-13", "slug": "PRIEM-13", "title": "ПВТР и Положение об оплате не дают полный маршрут расчёта при увольнении", "imp": "высокая", "docs": ["07", "10", "12"], "meta": [["Документы", "12, пп. 2.16.2, 2.16.6–2.16.7; 07, п. 3.8; 10, п. 10.13"], ["Тип", "пробел и разрыв между документами"], ["Кто решает", "КДП и бухгалтерия; юристы проверяют формы и сроки"], ["Важность", "высокая: термин «окончательный расчёт» должен охватывать все причитающиеся суммы"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 10.13: «При прекращении действия трудового договора окончательный расчет по причитающейся Работнику заработной плате производится в последний день работы».<\/li>\n<li>12, п. 2.16.6: «Трудовая книжка выдается работнику в день увольнения».<\/li>\n<li>07, п. 3.8: «производится полный расчет при увольнении (заработная плата за фактически отработанное время, денежная компенсация за все неиспользованные отпуска и др.)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> 07 говорит о полном расчёте и перечисляет компенсацию за отпуска, а 10.13 сужает формулировку до зарплаты. ПВТР отдельно говорит о книжке/сведениях, но не связывает это с листом проверки бухгалтерии и выдачей других документов. Фактическая задержка не установлена; риск — расхождение чек-листов КДП и бухгалтерии.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 84.1 ч. 4 (ред. 25.05.2026): «В день прекращения трудового договора работодатель обязан выдать работнику трудовую книжку или предоставить сведения о трудовой деятельности … у данного работодателя и произвести с ним расчет в соответствии со статьей 140 настоящего Кодекса». ТК ст. 140 ч. 1 (ред. 25.05.2026): «При прекращении трудового договора выплата всех сумм, причитающихся работнику от работодателя, производится в день увольнения работника». ТК ст. 127 ч. 1: «При увольнении работнику выплачивается денежная компенсация за все неиспользованные отпуска».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 10, п. 10.13:<\/p>\n<blockquote>\n<p>10.13. При прекращении действия трудового договора выплата всех сумм, причитающихся Работнику от Работодателя, включая заработную плату за фактически отработанное время, денежную компенсацию за все неиспользованные отпуска и иные предусмотренные законом и трудовым договором выплаты, производится в день увольнения. Если Работник в день увольнения не работал, соответствующие суммы выплачиваются не позднее следующего дня после предъявления Работником требования о расчете. В случае спора выплачивается неоспариваемая сумма в установленный срок.<\/p>\n<\/blockquote>\n<p>В 12, п. 2.16.6 добавить: <strong>В день прекращения трудового договора Работодатель производит расчет с Работником в соответствии со статьей 140 Трудового кодекса Российской Федерации и пунктом 10.13 Положения об оплате труда.<\/strong> В 07, п. 3.8 добавить ту же отсылку, сохранив перечень полного расчета. В форме задачи увольнения разделить обязательные выходы: приказ, сведения/книжка, расчёт, компенсация отпуска, документы по письменному запросу. Не делать обходной лист условием расчёта.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП регистрирует дату прекращения и передаёт событие бухгалтерии.<\/li>\n<li>Бухгалтерия проверяет все суммы, а КДП — документы и способ выдачи.<\/li>\n<li>В день увольнения фиксируются выдача/отправка и платёж; спорная сумма выделяется отдельно.<\/li>\n<li>При отсутствии работника запускается ветка требования и даты выплаты.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас подтверждается выплата компенсации отпуска и иных сумм? Есть ли отдельный общий чек-лист бухгалтерии и КДП?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: живой реестр увольнений и суммы не предоставлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по расхождению формулировок и нормам; средняя по практике.<\/p>"}, {"id": "К-PRIEM-14", "slug": "PRIEM-14", "title": "Обходной лист описан как предложение, а практика ждёт общего маршрута", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "12, п. 2.16.5; 12, п. 3.2.24; встреча с HR и КДП 11.11"], ["Тип", "расходится с практикой и пробел в процессе"], ["Кто решает", "руководитель HR; юридические последствия обходного листа проверяют юристы"], ["Важность", "высокая при массовых увольнениях: участники не получают единых задач и сроков"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 2.16.5: «До даты увольнения работник должен сдать непосредственному руководителю или назначенному лицу текущие дела, все материалы, программное обеспечение, документацию, созданные с участием работника по заданиям компании по акту приёма-сдачи документов и материалов, Работнику предлагается подписать обходной лист установленного образца».<\/li>\n<li>12, п. 3.2.24: «не позднее дня увольнения Работник обязан вернуть Обществу все оборудование, а также иные материальные ценности».<\/li>\n<li>встреча с HR и КДП 11.11: «Системы задач для кадров нет, “всё в почте”. … задачи в одном месте: увольнение с обходным листом, где все участники отмечаются к сроку».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Текст требует передачу дел и возврат имущества, но обходной лист предлагает, а не делает его обязательным; нет владельца сводного задания, сроков для ИТ, руководителя, КДП и бухгалтера. ответы HR 10.11 оценивает увольнения как 30% времени руководителя КДП в период оптимизации; причина и длительность пика — сведения HR, не прогноз. Не следует превращать обходной лист в условие выдачи документов или расчёта.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 84.1 ч. 4 и ТК ст. 140 ч. 1 — см. <a href=\"#/k/PRIEM-13\">К-PRIEM-13<\/a>: документы и все суммы выдаются/выплачиваются в установленные сроки. Нормы в доступной базе об обходном листе нет, проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 2.16.5, после акта передачи дел добавить:<\/p>\n<blockquote>\n<p>Не позднее рабочего дня регистрации КДП подтвержденного основания и даты прекращения договора Отдел персонала открывает карточку прекращения трудового договора. При увольнении в день поступления основания карточка открывается незамедлительно. В карточке указываются исполнитель, срок, результат и подтверждающий документ по передаче дел, возврату оборудования, закрытию доступов и обязательным кадровым выходам. Руководитель до даты увольнения назначает принимающего дела; ответственный ИТ принимает имущество и закрывает доступы в момент, согласованный с руководителем с учетом последнего рабочего времени и требований ИБ; КДП и бухгалтерия обеспечивают документы и расчет в установленные законом сроки. Обходной лист используется как внутренний реестр исполнения и не является условием выдачи документов, выплаты причитающихся сумм или прекращения трудового договора. Неисполненные задачи передаются руководителю HR и не переносят обязательную дату расчёта и выдачи документов.<\/p>\n<\/blockquote>\n<p>В 04, пп. 5.5.2, 6.2.14, 15, п. 2.3 не добавлять новые кадровые обязанности: КДП сверяет их с отдельными маршрутами ИБ и такси. В каталоге процесса использовать роли, а не фамилии, и закрывать доступы только уполномоченным ИТ/ИБ.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП регистрирует дату увольнения и открывает карточку.<\/li>\n<li>Руководитель принимает дела по акту; ИТ проверяет оборудование и доступы; администратор такси удаляет данные не позднее даты увольнения по 15, п. 2.3.<\/li>\n<li>КДП и бухгалтерия параллельно готовят обязательные документы и расчёт.<\/li>\n<li>Не закрытый пункт эскалируется, но не задерживает обязательные выходы.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Используется ли сейчас обходной лист и кто его утверждает? Какие участники должны быть в нём по фактической схеме?<\/p>\n<p><strong>Цена вопроса.<\/strong> ответы HR 10.11: 30% времени руководителя КДП относится к увольнениям. Программный пересчёт для 40-часовой недели: 173,3 часа в месяц × 30% = 52,0 часа в месяц, расчёт программой. Это средняя оценка без праздников и не подсчёт человеко-часов увольнений.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пробелу текста и практике; средняя по объёму экономии.<\/p>"}, {"id": "К-PRIEM-15", "slug": "PRIEM-15", "title": "Приём без военного документа не совпадает с ПВТР", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "12, пп. 2.2–2.3; встреча с HR и КДП 11.11; ПП 719, пп. 30, 32"], ["Тип", "расходится с практикой"], ["Кто решает", "руководитель КДП совместно с юристами; ответственный за воинский учёт исполняет подтверждённый маршрут"], ["Важность", "высокая: КДП работает по фактическому исключению, которого ПВТР не описывает"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 2.2: «документы воинского учета (для военнообязанных и лиц, подлежащих призыву на военную службу)».<\/li>\n<li>12, п. 2.3: «Прием на работу без предъявления вышеперечисленных документов не допускается».<\/li>\n<li>встреча с HR и КДП 11.11: «На работу принимают и без военного билета. Человеку говорят сходить в военкомат; в военкомат уходит письмо, что принят человек без военного билета».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Документ обещает запрет, а HR описала фактическое исключение. Это не повод утверждать, что каждый такой приём незаконен: документы и порядок воинского учёта требуют проверки по статусу человека. Но КДП не может каждый раз изобретать маршрут, а сотруднику надо понимать, какие действия обязательны после приёма.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 65 ч. 1 (ред. 25.05.2026): «документы воинского учета - для военнообязанных и лиц, подлежащих призыву на военную службу»; ПП 719, п. 30, подп. «а» (ред. 24.03.2026): «проверяют у граждан, принимаемых на работу, наличие и подлинность военных билетов»; ПП 719, п. 32, подп. «а»: «направляют в течение 5 дней со дня принятия (поступления) или увольнения (отчисления) граждан с работы … сведения о гражданах». Полный порядок и случаи отсутствия документа — в группе VU; здесь юридический вывод не делаем.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, пп. 2.2–2.3, не оставлять безусловный запрет. После проверки юристами вставить формулировку:<\/p>\n<blockquote>\n<p>2.3. При приеме специалист по кадровому делопроизводству проверяет документы, указанные в пункте 2.2, с учетом категории лица и требований законодательства. При отсутствии документа воинского учета КДП не принимает самостоятельное решение об отказе или оформлении исключения: фиксирует отсутствие, передает вопрос ответственному за воинский учет и действует по утвержденной инструкции. При принятии на работу сведения направляются ответственным работником в сроки, установленные Положением о воинском учете.<\/p>\n<\/blockquote>\n<p>До утверждения этой редакции не обещать в документе ни автоматический отказ, ни автоматический приём без документа. В детальную форму и порядок направления не дублировать в ПВТР: сослаться на ЛНА/приказ о воинском учёте после его предъявления.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП проверяет статус и предъявленный документ.<\/li>\n<li>При отсутствии документа создаётся задача ответственному за воинский учёт; причина и решение хранятся в кадровом контуре.<\/li>\n<li>После решения КДП оформляет приём либо возвращает кандидату список недостающих действий.<\/li>\n<li>Для принятого человека ответственное лицо отправляет сведения по ПП 719 и фиксирует дату.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой приказ назначает ответственного за воинский учёт? В каких случаях приём без военного билета сейчас разрешают и какой документ это подтверждает?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; число таких приёмов не предоставлено.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в расхождении текста и практики; низкая в юридической оценке исключений — требуется группа VU и юристы.<\/p>"}, {"id": "К-PRIEM-16", "slug": "PRIEM-16", "title": "Закрытие доступа при увольнении распределено по разным ЛНА", "imp": "средняя", "docs": ["04", "12", "15"], "meta": [["Документы", "12, п. 2.16.5; 15, п. 2.3; 04, пп. 5.5.2, 6.2.14; встреча с HR и КДП 11.11"], ["Тип", "пробел процесса"], ["Кто решает", "руководитель HR; ИТ/ИБ и юристы проверяют свои маршруты"], ["Важность", "средняя: дата увольнения есть, но единого владельца закрытия всех доступов нет"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 2.3: «В случае увольнения Сотрудника, которому открыт доступ к использованию Корпоративного такси … Администратор корпоративного такси не позднее даты увольнения Сотрудника удаляет его данные в Аккаунте».<\/li>\n<li>04, п. 6.2.14: «при прекращении трудового договора по любому основанию … передать Материальные носители … иным работникам Общества по указанию Руководства Общества».<\/li>\n<li>12, п. 2.16.5: «До даты увольнения работник должен сдать непосредственному руководителю … текущие дела, все материалы, программное обеспечение, документацию».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Один документ знает только корпоративное такси, другой — носители коммерческой тайны, ПВТР — передачу дел. Почта, Jira, Mattermost, Confluence, УКЭП и другие доступы в едином увольнительном маршруте не перечислены. Это не доказывает, что ИТ не закрывает их, но КДП не видит подтверждения и сроков.<\/p>\n<p><strong>Закон.<\/strong> Нормы ТК о списке корпоративных доступов при увольнении в доступной базе нет, проверить юристам и ИБ. ТК ст. 86 ч. 7 (ред. 25.05.2026): «защита персональных данных работника от неправомерного их использования или утраты должна быть обеспечена работодателем за счет его средств»; доступ к кадровой карточке должен оставаться у уполномоченных ролей.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 2.16.5, дополнить ссылкой на карточку из <a href=\"#/k/PRIEM-14\">К-PRIEM-14<\/a>:<\/p>\n<blockquote>\n<p>Карточка прекращения трудового договора включает отдельные задачи по возврату имущества и передаче материалов, отключению учётных записей и доступов, удалению доступа к корпоративному такси, а также проверке обязательств по конфиденциальной информации. Состав доступов и сроки закрытия утверждаются ответственными за информационные системы; результат подтверждается в карточке. Кадровая дата увольнения и закрытие доступа не изменяют сроки выдачи документов и расчёта.<\/p>\n<\/blockquote>\n<p>В 15 оставить конкретное удаление администратором такси. В 04 не переписывать режим тайны этим кадровым кейсом; добавить только ссылку на карточку, если юристы ИБ её одобрят. В ИТ-порядке перечислить системы фактически, после инвентаризации; Jira, Slack и Mattermost не считать взаимозаменяемыми.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП создаёт карточку до даты увольнения.<\/li>\n<li>ИТ/ИБ получают список систем от владельцев и закрывают доступы в назначенный срок.<\/li>\n<li>Администратор такси выполняет п. 2.3 документа 15.<\/li>\n<li>КДП фиксирует подтверждения, не собирая лишние данные в общем журнале.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас получает событие увольнения и закрывает почту, Jira, Mattermost, Confluence и УКЭП? Есть ли список систем и подтверждение выполнения?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: инвентаризации доступов и числа увольнений нет.<\/p>\n<p><strong>Уверенность.<\/strong> Средняя: пробел виден в кадровых текстах, но фактический ИТ-процесс отдельно не проверен.<\/p>"}, {"id": "К-PRIEM-17", "slug": "PRIEM-17", "title": "Перечень документов при приёме требует лишнее и описывает старые действия", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "12, пп. 2.2–2.3"], ["Тип", "расходится с законом"], ["Кто решает", "КДП и юристы до утверждения"], ["Важность", "высокая: диплом затребован без связи с трудовой функцией, утрата книжки ведёт к неверному действию"]], "html": "<p><strong>Было.<\/strong> 12, п. 2.2: «документы об образовании, о квалификации или наличии специальных знаний или специальной подготовки)»; п. 2.3: «страховое свидетельство государственного пенсионного страхования оформляется работодателем»; «оформляет дубликат трудовой книжки».<\/p>\n<p><strong>Что не так.<\/strong> Диплом обязателен по формулировке для всех, а закон связывает его с работой, требующей специальных знаний. В п. 2.3 сохранена старая операция с пенсионным свидетельством и подменена новой книжкой операция выдачи дубликата. Это касается текста; фактическую ошибку КДП не предполагаем.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 65 ч. 1 (ред. 25.05.2026): «документ об образовании и (или) о квалификации или наличии специальных знаний - при поступлении на работу, требующую специальных знаний или специальной подготовки». Ч. 4: «работодателем представляются в соответствующий территориальный орган Фонда пенсионного и социального страхования Российской Федерации сведения, необходимые для регистрации указанного лица в системе индивидуального (персонифицированного) учета». Ч. 5: «оформить новую трудовую книжку» с исключением случаев, когда книжка не ведётся.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 2.2, заменить строки:<\/p>\n<blockquote>\n<p>• документ, подтверждающий регистрацию в системе индивидуального (персонифицированного) учета, в том числе в форме электронного документа;\n• документ об образовании и (или) о квалификации или наличии специальных знаний — при поступлении на работу, требующую специальных знаний или специальной подготовки.<\/p>\n<\/blockquote>\n<p>В п. 2.3 заменить соответствующие исключения:<\/p>\n<blockquote>\n<p>Если на лицо, поступающее на работу впервые, не был открыт индивидуальный лицевой счет, Работодатель представляет в соответствующий территориальный орган Фонда пенсионного и социального страхования Российской Федерации сведения, необходимые для регистрации. При отсутствии трудовой книжки в связи с утратой, повреждением или по иной причине Работодатель по письменному заявлению лица с указанием причины оформляет новую трудовую книжку, кроме случаев, когда по законодательству трудовая книжка на работника не ведется.<\/p>\n<\/blockquote>\n<p>Не превращать этот текст в исчерпывающий перечень всех специальных документов: КДП проверяет применимые требования закона по конкретной работе. Формы запроса кандидату и список приёма обновить одновременно; воинский учёт — отдельно <a href=\"#/k/PRIEM-15\">К-PRIEM-15<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП определяет обязательный набор по должности и статусу лица.<\/li>\n<li>Кандидат получает только применимый список, включая специальные требования при наличии основания.<\/li>\n<li>При первом трудоустройстве и утрате книжки КДП выбирает соответствующую законную операцию.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> В реальном списке кандидату диплом требуют всем? Как сейчас оформляют отсутствие книжки и лицевого счёта?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: сопоставлены прямые формулировки ст. 65 и ПВТР.<\/p>"}, {"id": "К-PRIEM-18", "slug": "PRIEM-18", "title": "Отправка задания считается получением независимо от подтверждения", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "07, пп. 2.3–2.5, 2.9–2.10, 2.12–2.14; 12, пп. 3.2.25, 5.12"], ["Тип", "противоречие внутри документа"], ["Кто решает", "руководитель HR и юристы"], ["Важность", "высокая: отсутствие результата может оцениваться по заданию, с получением которого спорят"]], "html": "<p><strong>Было.<\/strong> 07, п. 2.9: «задание и план считаются полученными принятым в Общество работником в день их отправки»; п. 2.10: «работник обязан уведомить отправителя задания или плана об их получении тем же способом»; п. 2.12: «приравнивается к обмену документами на бумажных носителях».<\/p>\n<p><strong>Что не так.<\/strong> Одно правило делает получение автоматическим, другое требует подтверждения. При споре о доступе или содержании письма это разные доказательства. Отдельное рабочее задание допустимо фиксировать в почте/Jira, но общее приравнивание любой переписки к подписанным кадровым документам слишком широко. YouTrack упомянут, но его фактическое использование неизвестно.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.3 ч. 2 (ред. 25.05.2026): иная форма взаимодействия дистанционных должна позволять «обеспечить фиксацию факта получения работником и (или) работодателем документов в электронном виде». Для подписываемых кадровых документов применяется режим ТК 22.1–22.3 либо специальный дистанционный порядок, а не одно правило об отправке письма. Допустимость конкретного доказательства оценивают юристы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 07, п. 2.9:<\/p>\n<blockquote>\n<p>2.9. При направлении задания или плана по рабочей электронной почте либо через утвержденную систему задач руководитель фиксирует содержание, дату отправки и подтверждение получения работником. При отсутствии подтверждения в срок, установленный Правилами внутреннего трудового распорядка, руководитель проверяет доступность канала и повторно доводит задание до работника. Сам факт отправки не признается безусловным подтверждением получения. План также направляется руководителю кадровой службы.<\/p>\n<\/blockquote>\n<p>Заменить п. 2.12:<\/p>\n<blockquote>\n<p>2.12. Переписка по рабочим заданиям сохраняется вместе с результатами и объяснениями работника. Оформление и вручение кадровых документов, для которых законом установлены требования к форме или подписи, осуществляется в установленном законом порядке; направление обычного письма или сообщения системы задач не заменяет такой порядок.<\/p>\n<\/blockquote>\n<p>Пп. 2.3–2.4, 2.10 привести к перечню фактически утверждённых систем без удаления действующей системы до ответа ИТ. В 12 срок подтверждения оставить единым; общий ЛНА об ЭДО готовит DISC.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель выдаёт задание с критериями и сроком из п. 2.5; план на весь период по-прежнему не обязателен.<\/li>\n<li>Работник подтверждает получение; отсутствие подтверждения порождает проверку канала.<\/li>\n<li>Результаты и объяснения прикладываются к исходной версии задания, а не восстанавливаются задним числом.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где сейчас выдают задания и сохраняют подтверждение? Используют ли YouTrack?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в текстовом разрыве; средняя в оценке достаточности конкретных доказательств.<\/p>"}, {"id": "К-PRIEM-19", "slug": "PRIEM-19", "title": "Контроль почты помещён в положение только для работников на испытании", "imp": "высокая", "docs": ["04", "07", "09"], "meta": [["Документы", "07, пп. 1.3, 2.4, 2.11; 04, п. 6.7; 09 — только связь, без переписывания"], ["Тип", "пробел предмета и пределов правила"], ["Кто решает", "ИБ и юристы, не HR в одиночку"], ["Важность", "высокая: неограниченно читается полномочие администратора проверять содержание почты"]], "html": "<p><strong>Было.<\/strong> 07, п. 2.11: «возможность проверки сообщений почтового ящика рабочей электронной почты работника без его уведомления системным администратором Общества». 07, п. 1.3 ограничивает действие работниками с установленным испытанием. 04, п. 6.7: «Общество сохраняет за собой право осуществлять мониторинг использования Корпоративного оборудования и Корпоративных электронных информационных систем».<\/p>\n<p><strong>Что не так.<\/strong> В документ об испытании попало общее правило контроля почты без объёма, основания доступа и сохранения результатов. Общий мониторинг в 04 не отвечает автоматически на вопрос о просмотре любого содержания ящика. Нельзя на основе одной цели контроля количества и качества работы объявлять это полномочие ни безусловно законным, ни незаконным. Проверка допустимости и тайны переписки остаётся юристам/ИБ; регламенты тайны и данных в рамках HR не переписываются.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 86 п. 1 (ред. 25.05.2026) допускает обработку в целях «контроля количества и качества выполняемой работы и обеспечения сохранности имущества»; п. 6: «работодатель не имеет права основываться на персональных данных работника, полученных исключительно в результате их автоматизированной обработки или электронного получения». ТК ст. 88: «разрешать доступ к персональным данным работников только специально уполномоченным лицам» и только необходимые для функции данные. Полного набора норм о тайне переписки и допустимости просмотра конкретного содержания в базе нет, проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После проверки ИБ/юристами заменить последнее предложение 07, п. 2.11:<\/p>\n<blockquote>\n<p>Контроль выполнения работником заданий проводится непосредственным руководителем на основании заданий, результатов и объяснений работника. Настоящее Положение не устанавливает самостоятельного основания для доступа к содержанию электронной переписки. Доступ к информационным системам и персональным данным осуществляется только специально уполномоченными лицами в пределах их функций и по утвержденным правилам защиты информации и персональных данных.<\/p>\n<\/blockquote>\n<p>Общее правило о законном рабочем использовании ресурсов сохранить. Перенос в иной документ возможен только после проверки оснований, целей, объёма, круга доступа и информирования работников; текст 04 и 09 данным кейсом не заменяется. Автоматическую негативную оценку работника по одному анализу переписки не создавать.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель оценивает задания и результат, не получает общий доступ к ящику.<\/li>\n<li>При необходимости специальной проверки обращается к ИБ по действующему утверждённому порядку.<\/li>\n<li>Решение о результате испытания принимает человек на проверенных материалах с учётом объяснений.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельное проверенное ИБ/юристами положение о контроле почты и ознакомление с ним работников?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по неуместности и неполноте нормы; низкая по допустимости конкретного доступа — заключение не сделано.<\/p>"}, {"id": "К-PRIEM-20", "slug": "PRIEM-20", "title": "Перевод и проектная аллокация не различены в кадровом маршруте", "imp": "средняя", "docs": ["07", "12"], "meta": [["Документы", "12, п. 2.15; 07, пп. 1.3, 2.6; ответы HR 10.11, строка переводов и аллокаций"], ["Тип", "пробел"], ["Кто решает", "КДП и юристы; руководитель определяет содержание изменения"], ["Важность", "средняя: задача Jira сама не показывает, требуется ли соглашение и изменение условий"]], "html": "<p><strong>Было.<\/strong> 12, п. 2.15: «Решение об изменении условий трудового договора оформляется дополнительным соглашением к трудовому договору». 07, п. 2.6: «Не допускается выдача заданий, а также включение в план работы задач, выполнение которых не входит в трудовые обязанности работника». ответы HR 10.11 отдельно называет переводы, аллокацию на проекты и совмещения через Jira.<\/p>\n<p><strong>Что не так.<\/strong> Общее правило соглашения верно, но операционный маршрут не различает изменение трудовой функции, перемещение, проектное назначение и дополнительную работу. Не вся аллокация есть перевод, и не вся задача руководителя может оформляться без согласия. Адаптацию на новой работе можно назначить, но нельзя автоматически создавать новое испытание как при новом приёме.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 72.1 ч. 1 (ред. 25.05.2026): «Перевод на другую работу допускается только с письменного согласия работника, за исключением случаев, предусмотренных частями второй и третьей статьи 72.2 настоящего Кодекса». Ч. 3: перемещение не требует согласия, «если это не влечет за собой изменения определенных сторонами условий трудового договора». ТК ст. 70 ч. 1 устанавливает испытание «При заключении трудового договора». Дополнительная работа — ТК 60.2, не автоматическое следствие тикета.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После 12, п. 2.15 добавить п. 2.15.1:<\/p>\n<blockquote>\n<p>2.15.1. До изменения трудовой функции, подразделения, места работы либо условий труда непосредственный руководитель направляет в КДП описание изменения и предполагаемую дату. КДП определяет применимый порядок: перевод, перемещение, изменение условий договора либо поручение дополнительной работы. Изменение осуществляется после получения необходимых согласий и оформления документов. Проектная задача или запись в системе учета проектов не заменяет обязательного соглашения. Адаптация на новой работе не означает установления нового испытания.<\/p>\n<\/blockquote>\n<p>В 13 при необходимости добавить индивидуальный ввод в новую роль без повторения испытательного маршрута. Не вводить автоматическое испытание после внутреннего перевода.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель задаёт новое содержание работы и дату в запросе.<\/li>\n<li>КДП классифицирует изменение, при споре обращается к юристу.<\/li>\n<li>После оформления изменяются кадровая запись и проектная аллокация; для передачи данных ВУ проверяется отдельное основание.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие поля и решения есть в текущем Jira-запросе и когда подключается КДП?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии описанного разграничения; средняя в реальной необходимости дополнительной формы.<\/p>"}, {"id": "К-PRIEM-21", "slug": "PRIEM-21", "title": "Заявление по собственному желанию не имеет маршрута получения и отзыва", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "12, п. 2.16.1; 07, п. 3.7; ТК 80"], ["Тип", "пробел"], ["Кто решает", "КДП и юристы"], ["Важность", "высокая: нельзя считать срок от согласования руководителем вместо получения заявления"]], "html": "<p><strong>Было.<\/strong> 12, п. 2.16.1: «Прекращение трудового договора осуществляется по основаниям, предусмотренным Трудовым Кодексом Российской Федерации и иными федеральными законами». 07, п. 3.7: «он имеет право расторгнуть трудовой договор по собственному желанию, предупредив об этом работодателя в письменной форме за три дня».<\/p>\n<p><strong>Что не так.<\/strong> Общая отсылка правильная, но не задаёт регистрацию получения, право отзыва и разные сроки. ответы HR 10.11 говорит о процедуре через Диадок; дата сообщения, дата юридического получения и дата отметки в рабочей карточке могут различаться. Это не установленная практика задержки, а недостающая защита от неверного расчёта.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 80 ч. 1 (ред. 25.05.2026): «Течение указанного срока начинается на следующий день после получения работодателем заявления работника об увольнении». Ч. 2: «По соглашению между работником и работодателем трудовой договор может быть расторгнут и до истечения срока предупреждения об увольнении». Ч. 4: «До истечения срока предупреждения об увольнении работник имеет право в любое время отозвать свое заявление». Для испытания — ТК 71 ч. 4. Исключения из права отзыва и обязательное увольнение в указанную дату по ст. 80 ч. 3 проверяет КДП по полному тексту статьи. Для кадрового ЭДО учитывать специальный момент получения по ТК 22.3 ч. 9.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Добавить 12, п. 2.16.1.1:<\/p>\n<blockquote>\n<p>2.16.1.1. КДП регистрирует заявление работника об увольнении и юридически значимую дату его получения с учетом применимого способа подачи. Срок предупреждения составляет не менее двух недель со следующего дня после получения заявления, если иной срок не установлен Трудовым кодексом Российской Федерации или иным федеральным законом; при действующем испытании применяется трехдневный срок статьи 71 ТК РФ. Срок не исчисляется с даты согласования заявления руководителем. Более ранняя дата оформляется соглашением сторон, кроме случаев, когда Работодатель обязан расторгнуть договор в срок, указанный работником. Полученный отзыв заявления регистрируется и проверяется КДП с учетом предусмотренных законом исключений. При допустимом отзыве задачи увольнения прекращаются, участникам направляется сообщение об отмене.<\/p>\n<\/blockquote>\n<p>В 07, п. 3.7 сохранить специальный срок, добавить ссылку на этот порядок. Не создавать новое согласование права уйти; решение работодателя нужно только там, где оно требуется законом.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП подтверждает получение и проверяет форму заявления.<\/li>\n<li>Определяет дату и основание; при предложении ранней даты получает решение уполномоченного работодателя.<\/li>\n<li>Отзыв останавливает рабочие задачи после правовой проверки, включая закрытие доступов и расчёт.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где фиксируется юридическая дата получения и как сейчас доводят отзыв до всех участников?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по нормам и отсутствию маршрута в ПВТР; средняя по фактической реализации.<\/p>"}, {"id": "К-PRIEM-22", "slug": "PRIEM-22", "title": "Невыдача сведений о трудовой деятельности не имеет своей ветки", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "12, пп. 2.16.6–2.16.7; 07, п. 3.8"], ["Тип", "пробел"], ["Кто решает", "КДП и юристы"], ["Важность", "высокая: ветка отсутствия работника описана только для бумажной книжки"]], "html": "<p><strong>Было.<\/strong> 12, п. 2.16.7: «В случае, когда в день прекращения трудового договора выдать трудовую книжку работнику невозможно, в связи с его отсутствием либо отказом от ее получения, ему направляется уведомление о необходимости явиться за трудовой книжкой либо дать согласие на отправление ее по почте».<\/p>\n<p><strong>Что не так.<\/strong> Предыдущий пункт верно различает книжку и сведения, но исключительная ветка оставляет только книжку. При отсутствии работника недостаточно отправить ему приглашение за документом, который ему не ведут. Нельзя переносить освобождение от ответственности по бумажной книжке на любой случай и любой способ отправки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 84.1 ч. 6 (ред. 25.05.2026): «или направить работнику по почте заказным письмом с уведомлением сведения о трудовой деятельности за период работы у данного работодателя на бумажном носителе, заверенные надлежащим образом». В местной копии конец части повреждён: особые случаи освобождения от ответственности и возможное продолжение статьи не восстанавливаются по памяти.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 2.16.7 после правила о книжке добавить:<\/p>\n<blockquote>\n<p>Если работнику предоставляются сведения о трудовой деятельности и их невозможно выдать в день прекращения трудового договора в связи с отсутствием работника либо отказом от получения, КДП направляет надлежащим образом заверенные сведения за период работы в Обществе по почте заказным письмом с уведомлением. Вид документа, основание невозможности вручения, дата и подтверждение отправки фиксируются отдельно. Освобождение от ответственности определяется только в случаях, предусмотренных статьей 84.1 Трудового кодекса Российской Федерации.<\/p>\n<\/blockquote>\n<p>П. 2.16.6 и 07, п. 3.8 не менять в части обычной выдачи; дополнить ссылкой на исключительную ветку. Позднейшие обращения за документами регулируются после получения полного текста ст. 84.1 и ст. 62, а не данным сокращённым пунктом.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП выбирает книжку либо сведения по кадровому статусу.<\/li>\n<li>При невозможности выдачи фиксирует причину и запускает соответствующую ветку.<\/li>\n<li>Сохраняет отправление и подтверждение в кадровом деле; не закрывает задачу одним письмом в мессенджере.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какая форма и почтовое отправление используются для сведений, когда работник отсутствует?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по отсутствующей ветке; ограниченная по неполному продолжению ст. 84.1.<\/p>"}, {"id": "К-PRIEM-23", "slug": "PRIEM-23", "title": "Электронное ознакомление дистанционного с приказом об увольнении не закрывает бумажную отправку", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "12, пп. 2.16.2, 5.6, 5.15; 07, п. 3.4"], ["Тип", "пробел"], ["Кто решает", "КДП и юристы; синхронизация с DISC"], ["Важность", "высокая: кадровый маршрут может завершиться на электронной подписи"]], "html": "<p><strong>Было.<\/strong> 12, п. 2.16.2: «Прекращение трудового договора оформляется приказом, с которым работник должен ознакомиться под роспись». П. 5.6: «осуществляется с помощью ЭДО путем проставления УКЭП работника, либо в письменной форме под подпись».<\/p>\n<p><strong>Что не так.<\/strong> В ПВТР есть электронное ознакомление, но нет отдельной задачи отправки копии приказа дистанционному работнику. Это не доказательство, что копию не отправляют: требуется сверить действующий чек-лист. Здесь не вопрос законности всего ЭДО — только обязательный выход конкретного кадрового события.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.8 ч. 3 (ред. 25.05.2026): «работодатель обязан в течение трех рабочих дней со дня издания указанного приказа (распоряжения) направить дистанционному работнику по почте заказным письмом с уведомлением оформленную надлежащим образом копию указанного приказа (распоряжения) на бумажном носителе» — когда ознакомление производится в форме электронного документа. Полная вводная о постоянной либо временной дистанционной работе прочитана в той же статье.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12 добавить п. 2.16.2.1:<\/p>\n<blockquote>\n<p>2.16.2.1. При ознакомлении дистанционного работника с приказом о прекращении трудового договора в форме электронного документа КДП в течение трех рабочих дней со дня издания приказа направляет ему надлежащим образом оформленную копию приказа на бумажном носителе по почте заказным письмом с уведомлением в соответствии с частью третьей статьи 312.8 Трудового кодекса Российской Федерации. Подтверждение отправки сохраняется в кадровом деле.<\/p>\n<\/blockquote>\n<p>В 07, п. 3.4 добавить ссылку на этот пункт; в 12, п. 5.15 — ту же отсылку. Не смешивать данную отправку с выдачей трудовой книжки/сведений.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП определяет дистанционный статус и форму ознакомления с приказом.<\/li>\n<li>Электронное ознакомление запускает отдельную почтовую задачу.<\/li>\n<li>КДП сохраняет подтверждение отправки и срок исполнения.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Отправляют ли сейчас такую копию, где подтверждение и кто контролирует срок?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: число дистанционных увольнений не предоставлено.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по норме и пробелу текста; фактическое исполнение не проверено.<\/p>"}, {"id": "К-PRIEM-24", "slug": "PRIEM-24", "title": "Редактура, которая мешает пользоваться кадровыми правилами", "imp": "низкая", "docs": ["07", "13"], "meta": [["Документы", "07, пп. 2.5, 2.20, 3.4–3.5, приложение 2; 13, пп. 2.1, 3.1, 3.2, 3.3.5 и раздел 4"], ["Тип", "ошибка в тексте — редактура"], ["Кто решает", "КДП и юристы; подпись приложения — только уполномоченное лицо"], ["Важность", "низкая: смысл в основном понятен, но шаблон нельзя давать без чистки"]], "html": "<p><strong>Было.<\/strong> 07, п. 2.5: «дата выдачи здания»; п. 2.20: «Заключение о прохождении испытания поступают». В п. 3.4 ссылка на ч. 1 ст. 84.1 относится к ознакомлению под роспись, хотя в базе это ч. 2; в п. 3.5 правило без выходного пособия отнесено к ч. 3 ст. 71, в базе это ч. 2. В 13, п. 2.1: «до выхода сотрудника предполагаемого первого рабочего дня нового сотрудника»; п. 3.2: «работника.).».<\/p>\n<p><strong>Что не так.<\/strong> Ошибки не нужно раздувать в самостоятельные нарушения. Но опечатка в поле задания и неверная часть статьи затрудняют применение, а приложение с заранее вписанным человеком не должно подменять проверку полномочия подписанта. Имена и реквизиты людей сюда не перенесены.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 84.1 ч. 2 и ст. 71 ч. 2 (ред. 25.05.2026), номера проверены расчёт программой. Закон не обязывает исправлять стилистику; ссылка должна вести к соответствующей норме.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Внести единым редакционным листом:<\/p>\n<blockquote>\n<p>07, п. 2.5: дата выдачи задания, дата составления плана.<\/p>\n<p>07, п. 2.20: Заключение о прохождении испытания поступает руководителю кадровой службы в установленный срок.<\/p>\n<p>07, п. 3.4: ссылку при ознакомлении под роспись заменить на часть вторую статьи 84.1 ТК РФ.<\/p>\n<p>07, п. 3.5: ссылку при отсутствии выходного пособия заменить на часть вторую статьи 71 ТК РФ.<\/p>\n<p>07, приложение 2: поле подписи — Генеральный директор либо иное надлежаще уполномоченное лицо; данные подписанта заполняются при оформлении уведомления после проверки полномочий.<\/p>\n<p>13, п. 2.1: До предполагаемого первого рабочего дня нового сотрудника сотрудник Отдела персонала создает задачу в Jira на получение техники либо направляет информацию альтернативным утвержденным способом связи.<\/p>\n<p>13, п. 3.1: заменить окончание предложения на: процесс состоит из общей, технической и индивидуальной частей; продолжительность определяется пунктом 1.3; п. 3.2 — убрать лишнюю закрывающую скобку и точку; п. 3.3.5 — а также; раздел 4 — в течение.<\/p>\n<\/blockquote>\n<p>Пункт 2.20 принять вместе с календарём <a href=\"#/k/PRIEM-11\">К-PRIEM-11<\/a>, сохранив недельный срок для обычного испытания. В сканах не считать OCR-ошибки оригинальными: HR, Jira и пропавшие фрагменты таблицы восстановлены по изображениям, а не предлагаются как изменение действующего правила.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП правит одну контролируемую редакцию с таблицей изменений.<\/li>\n<li>Юрист проверяет ссылки и поля подписанта, HR — ссылки на связанные кейсы.<\/li>\n<li>Утверждается редакция, затем обновляются формы и ознакомление; черновик не заменяет действующий документ.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой актуальный шаблон уведомления используют сейчас и как проверяют подписанта?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту и номерам частей, средняя по актуальности используемого шаблона.<\/p>"}, {"id": "К-PRIEM-25", "slug": "PRIEM-25", "title": "Выплаты после испытания не учитывают приём без испытания", "imp": "средняя", "docs": ["07", "10"], "meta": [["Документы", "10, пп. 6.8.3, 6.10.2–6.10.3; 07, пп. 1.6, 3.3, 3.9"], ["Тип", "пробел"], ["Кто решает", "руководитель компании — выбор внутреннего правила; юристы и PLAT — проверка допустимости"], ["Важность", "средняя: событие для части реферальной премии и допуска к проектной схеме не наступает в буквальном смысле"]], "html": "<p><strong>Было.<\/strong> 10, п. 6.8.3, строка реферальной программы: «50% по выходу кандидата на работу»; «50% после прохождения кандидатом испытательного срока». П. 6.10.2: «для Работников, прошедших испытательный срок и занимающих должность Руководитель продукта». П. 6.10.3 повторяет условие прохождения испытательного срока.<\/p>\n<p><strong>Что не так.<\/strong> Закон разрешает и иногда требует приём без испытания. ЛНА не говорит, какое событие заменяет его прохождение для таких случаев, и не различает истечение испытания и положительное заключение до конца. Это не доказанная невыплата или дискриминация: нужно проверить фактический порядок и основания. ДМС здесь не дописывается как обязательное право: п. 9.5 говорит лишь об изменении программы, а базовые условия и выбор компании ещё не проверены.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 70 ч. 2 (ред. 25.05.2026): «Отсутствие в трудовом договоре условия об испытании означает, что работник принят на работу без испытания». Ч. 3: «В период испытания на работника распространяются положения трудового законодательства». Эти нормы сами по себе не выбирают дату дополнительной реферальной выплаты; оценка условий премии остаётся юристам и PLAT.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Вариант А — считать условие выполненным при начале работы без испытания; вариант Б — определить отдельный срок работы для соответствующей выплаты, не называя его испытанием. Рекомендация А: меньше исключений и нет скрытого нового испытания. Только после решения работодателя добавить в 10 после п. 6.8.3:<\/p>\n<blockquote>\n<p>Для целей реферальной программы при отсутствии условия об испытании в трудовом договоре условие о прохождении испытания считается выполненным в день начала работы привлеченного работника. При установленном испытании основанием является подтвержденное КДП юридическое событие его завершения, в том числе истечение срока при продолжении работы. Положительное заключение руководителя до истечения срока само по себе не изменяет дату наступления права. Оформление приказа и срок выплаты определяются пунктом 6.8.2.<\/p>\n<\/blockquote>\n<p>Для пп. 6.10.2–6.10.3 добавить:<\/p>\n<blockquote>\n<p>Для работника, принятого без испытания, отсутствие испытания само по себе не препятствует включению в схему при соблюдении остальных условий настоящего Положения и согласовании схемы в установленном порядке.<\/p>\n<\/blockquote>\n<p>Суммы и пропорции не менять этим кейсом. Отсылка к несуществующему п. 5.9.1 — отдельная редактура PLAT; в готовом маршруте использовать подтверждённый пункт согласования, а не повторять ошибку.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП фиксирует отсутствие испытания или его законное завершение, не причину запрета испытания.<\/li>\n<li>Отдел персонала проверяет реферальное основание; бухгалтерия действует по приказу и действующей схеме.<\/li>\n<li>При проектной премии руководитель и уполномоченные согласующие проверяют остальные условия; процесс не начисляет премию автоматически.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас платят реферальную премию, если привлечённый работник принят без испытания, и когда допускают его к проектной схеме?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: числа таких кандидатов и начислений нет; проценты приведены дословно из п. 6.8.3, не рассчитаны.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле, средняя в рекомендуемом варианте — решение за компанией.<\/p>"}, {"id": "К-PRIEM-26", "slug": "PRIEM-26", "title": "Реальный адаптационный трек и календарь ЛНА не сведены", "imp": "средняя", "docs": ["07", "13"], "meta": [["Документы", "13, п. 3.3.3 и раздел 4; 07, пп. 2.15–2.20; ответы HR 10.11, блок онбординга"], ["Тип", "расходится с практикой — требует подтверждения"], ["Кто решает", "руководитель HR; сроки правовых действий не предмет свободного выбора"], ["Важность", "средняя: контрольные встречи могут дублироваться, а финальное ретро не заменяет письменного заключения"]], "html": "<p><strong>Было.<\/strong> 13, п. 3.3.3: «проводят с сотрудником регулярные встречи на протяжении ИС в соответствии с Разделом 4». Раздел 4, стр. 3: в строке HR указана частота раз в неделю — HR-встречи первого периода. ответы HR 10.11, онбординг: «По адаптационному треку контроль основных точек: 1 неделя встреча с руководителем (введение в должность, план задач на ИС), после 1 месяца работы, после 2х месяцев»; затем описана финальная встреча-ретро.<\/p>\n<p><strong>Что не так.<\/strong> Это могут быть не противоречащие, а дополнительные встречи: HR перечислила контрольные точки, а не обязательно весь календарь. Но документ и описание практики не показывают, какое мероприятие закрывает какое требование. Финальная встреча без отдельной заблаговременной оценки не обеспечивает сроки письменного заключения и предупреждения по 07. Нельзя делать вывод, что HR-встречи по регламенту фактически отменены.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 71 ч. 1 (ред. 25.05.2026) требует письменное предупреждение «не позднее чем за три дня с указанием причин» при расторжении до окончания испытания. Число организационных встреч закон в доступной базе не задаёт.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После подтверждения фактической практики добавить в 13, п. 3.3.3:<\/p>\n<blockquote>\n<p>Отдел персонала ведет единый календарь адаптационных встреч. Контрольные точки с руководителем в течение первой недели, после первого и второго месяцев работы и итоговая встреча включаются в него вместе со встречами HR и Наставника по разделу 4. Совпадающие по участникам и содержанию встречи могут быть объединены с сохранением отметки о выполнении каждого требования. При наличии испытания беседа, отчет и письменное заключение оформляются отдельно в сроки Положения о порядке прохождения испытания при приеме на работу; итоговая встреча адаптации их не переносит и не заменяет.<\/p>\n<\/blockquote>\n<p>Если HR выбирает иной календарь вместо текущей частоты, заменить соответствующие строки раздела 4 утверждённым расписанием, а не просто перестать им следовать. Данный текст сохраняет частоту, уже установленную в ЛНА, и сводит её с названными HR точками; не навязывает новые параллельные встречи.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR подтверждает единый календарь и участников до запуска трека.<\/li>\n<li>Одно событие встречи может закрыть несколько содержательно совпадающих задач без повторного созвона.<\/li>\n<li>Контроль испытания остаётся отдельным юридическим календарём КДП; участники видят напоминания до конца срока.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Названные в ответах точки дополняют HR/наставнические встречи раздела 4 или фактически заменили их? Кто сохраняет результат встреч?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: длительность, совмещение и фактическое количество встреч неизвестны.<\/p>\n<p><strong>Уверенность.<\/strong> Средняя: источники описывают разные уровни детализации, нужна сверка HR.<\/p>"}]}, {"kod": "VREM", "nazv": "Рабочее время и сверхурочные", "glavnoe": "<ul>\n<li><strong><a href=\"#/k/VREM-01\">К-VREM-01<\/a> — не ослабить действующий предел незаметно.<\/strong> Политика компании строже закона по двум соседним дням, а черновик улья и каталог процессов HR (проект) проверяют только день. Сначала решить, сохраняется ли защита, потом собирать процесс. <a href=\"#/k/VREM-02\">К-VREM-02<\/a> отдельно закрывает допуск сверх годового порога: новая возможность закона не означает разрешения компании.<\/li>\n<li><strong><a href=\"#/k/VREM-03\">К-VREM-03<\/a> — проверить оплату начиная со 121-го часа.<\/strong> В Положении 10 нет нового годового порога. Это проверяемая связка текста, табеля и расчёта; фактическая недоплата пока не установлена. Проверку начислений делать даже тогда, когда правомерность самого привлечения вызывает вопрос.<\/li>\n<li><strong><a href=\"#/k/VREM-04\">К-VREM-04<\/a> — отделить НРД от оплачиваемых сверхурочных.<\/strong> Политика 02 верно выделяет регулярную работу, но Положение 10 связывает доплаты с отдельным решением. Начать с перечня должностей, договоров и фактического времени, а не с обвинения в неоплате; отпускную часть сверить с <a href=\"#/k/OTP-17\">К-OTP-17<\/a>.<\/li>\n<li><strong><a href=\"#/k/VREM-07\">К-VREM-07<\/a> — подтвердить один связанный маршрут до упрощения согласований.<\/strong> Сейчас письмо и служебная записка могут быть нормальными последовательными этапами; считать их лишним дублем без ответа HR нельзя. Нужны ясная отсылка между 02 и 10, решение о роли ИБ и связанный учёт плановых/фактических часов по <a href=\"#/k/VREM-12\">К-VREM-12<\/a>.<\/li>\n<li><strong><a href=\"#/k/VREM-11\">К-VREM-11<\/a> — не потерять доплату за неиспользованный день отдыха при увольнении.<\/strong> Правило ст. 153 должно давать конкретные данные бухгалтерии, а не оставаться ссылкой на закон. Реестр дней нужен также для годового срока использования по <a href=\"#/k/VREM-06\">К-VREM-06<\/a>; денежную формулу для окладников сверить с <a href=\"#/k/VREM-05\">К-VREM-05<\/a>.<\/li>\n<\/ul>\n<p>Это порядок разговора, а не решен
