К ст. 238: «Работник обязан возместить работодателю причиненный ему прямой действительный ущерб.» ТК ст. 247: «До принятия решения о возмещении ущерба конкретными работниками работодатель обязан провести проверку для установления размера причиненного ущерба и причин его возникновения» и «Истребование от работника письменного объяснения для установления причины возникновения ущерба является обязательным.» ТК ст. 248: «Взыскание с виновного работника суммы причиненного ущерба, не превышающей среднего месячного заработка, производится по распоряжению работодателя.» Далее дословно: «Распоряжение может быть сделано не позднее одного месяца со дня окончательного установления работодателем размера причиненного работником ущерба.» И: «Если месячный срок истек или работник не согласен добровольно возместить причиненный работодателю ущерб, а сумма причиненного ущерба, подлежащая взысканию с работника, превышает его средний месячный заработок, то взыскание может осуществляться только судом.» Условия этой нормы не заменяются произвольным правилом о любом несогласии. Ст. 241: предел ответственности и основания полной ответственности проверяют юристы; полного набора ст. 239–250 в базе нет.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 15 заменить п. 2.6:<\/p>\n<blockquote>\n<p>2.6. Администратор корпоративного такси или Бухгалтерия вправе запросить у Работника пояснения по поездке. Поездка, совершённая с нарушением настоящего Регламента, передаётся на проверку уполномоченному работодателем лицу. До решения устанавливаются обстоятельства, размер прямого действительного ущерба и причинная связь; у Работника запрашивается письменное объяснение. Возмещение ущерба и удержания из заработной платы осуществляются только в порядке, пределах и случаях, установленных Трудовым кодексом Российской Федерации. Нарушение Регламента само по себе не означает наличие ущерба и не является основанием для автоматического удержания полной стоимости поездки.<\/p>\n<\/blockquote>\n<p>В 12, п. 10.4 дать ссылку на 15 и ТК 137, 238, 247, 248; не добавлять новый способ взыскания. Форму проверки и полномочие проверяющего определить приказом после юристов. Если работник добровольно возмещает ущерб, нужен письменный документ; удержание не скрывать в «компенсации».<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Администратор фиксирует поездку и запрашивает объяснение; доступ к данным ограничен.<\/li>\n<li>Уполномоченный работник проводит проверку, определяет прямой ущерб и даёт возможность ознакомиться с материалами.<\/li>\n<li>Работодатель выбирает законный способ возмещения; бухгалтерия удерживает только при наличии основания и подтверждения.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли случаи требования или удержания стоимости такси; кто уполномочен проводить проверку?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет количества спорных поездок, сумм и удержаний.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: нормы и конфликт формулировок подтверждены; фактическое применение не установлено.<\/p>"}, {"id": "К-KOM-13", "slug": "KOM-13", "title": "Исполнителей по ГПХ нельзя оставлять в ЛНА без договорного основания", "imp": "высокая", "docs": ["15"], "meta": [["Документы", "15, п. 1.2; пп. 2.1–2.6"], ["Тип", "ошибка области действия; проверить юристам"], ["Кто решает", "юристы; руководитель компании выбирает, нужен ли отдельный сервисный порядок"], ["Важность", "высокая: один термин создаёт неясные обязательства подрядчика и работодателя"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 1.2: «Сотрудник- лицо, работающее в Организации по трудовому договору или выполняющее работы/оказывающее услуги для Организации по гражданско-правовому договору.»<\/li>\n<li>15, п. 2.6: «Сотрудник обязуется компенсировать Организации стоимость поездки на такси в случае, если будет установлено осуществление поездки с нарушением Сотрудником требований настоящего Регламента.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Текст называет исполнителя по ГПХ «Сотрудником» и распространяет на него обязанности ЛНА без ссылки на договор. Само по себе это не доказывает, что такой ЛНА не включён в договор. До ответа юристов нельзя сказать «ЛНА не действует»: нужно разделить трудовой порядок и договорное условие.<\/p>\n<p><strong>Закон.<\/strong> Нормы о гражданско-правовом договоре и разграничении с трудовыми отношениями в базе для этого кейса нет, проверить юристам. ТК ст. 8 (ред. от 25.05.2026) говорит о локальных актах, содержащих нормы трудового права, и не даёт готового основания распространить их на подрядчика.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 15 заменить определение:<\/p>\n<blockquote>\n<p>Сотрудник — работник Организации, состоящий с ней в трудовых отношениях. Настоящий Регламент в части корпоративного такси для работников применяется к работникам по трудовому договору. Исполнитель по гражданско-правовому договору может использовать сервис только при наличии в его договоре или дополнительном соглашении условия о таком использовании, целях, лимитах, порядке подтверждения поездок и возмещении документально подтверждённого ущерба в пределах, установленных договором и законом.<\/p>\n<\/blockquote>\n<p>В 2.3 и 2.6 заменить «Сотрудник» на «Работник», а для подрядчика сделать отдельный пункт «Исполнитель» после договора и согласования юристами. Не употреблять «увольнение» к ГПХ: прекращение доступа привязывается к прекращению договора или необходимости доступа. В 14 аналогично не включать подрядчиков через общий термин «работник» без решения юристов.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Заказчик проверяет тип договора до выдачи доступа.<\/li>\n<li>Для работника действует 15; для исполнителя — только прямо согласованное условие договора.<\/li>\n<li>При прекращении договора заказчик направляет задачу отключить доступ; спор об ущербе идёт по соответствующему договору и закону.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли исполнители по ГПХ с доступом к Яндекс Go или OneTwoTrip и что сказано в их договорах?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа исполнителей и стоимости поездок.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в неясности термина; правовой вывод — только после проверки юристами.<\/p>"}, {"id": "К-KOM-14", "slug": "KOM-14", "title": "В приказе и сертификате ЭДО различаются роли подписанта", "imp": "средняя", "docs": ["15"], "meta": [["Документы", "15, приказ, пп. 1–3, блок подписей ЭДО"], ["Тип", "ошибка оформления/подтверждения полномочий"], ["Кто решает", "юристы и руководитель компании"], ["Важность", "средняя: нужно подтвердить, кто вправе утвердить и контролировать ЛНА"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, приказ, п. 3: «Контроль за исполнением настоящего приказа возлагаю на Специалиста по закупкам».<\/li>\n<li>15, блок ЭДО: сертификат подписанта содержит роль «Советник генерального директора».<\/li>\n<li>15, заголовок приказа: «О введении в действие Регламента по порядку использования корпоративного такси».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Приказ в тексте подписан от имени генерального директора, а сертификат ЭДО отображает другую должность. Это не доказывает недействительность: роль может быть указана в доверенности или сертификате с полномочием. Но в комплекте не приложена доверенность/приказ о полномочиях и нет подтверждения ознакомления работников: страница 2 содержит только «С приказом № 23-Т/2022 от 01.08.2022г. ознакомлены:». Юристам нужно проверить, кто утвердил ЛНА и как подтверждается ознакомление.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 8 (ред. от 25.05.2026): «Работодатели … принимают локальные нормативные акты, содержащие нормы трудового права … в пределах своей компетенции». ТК ст. 22: «знакомить работников под роспись с принимаемыми локальными нормативными актами, непосредственно связанными с их трудовой деятельностью». ФЗ № 63‑ФЗ, ст. 6 ч. 1: «Информация в электронной форме, подписанная квалифицированной электронной подписью, признается электронным документом, равнозначным документу на бумажном носителе, подписанному собственноручной подписью».<\/p>\n<p><strong>Стало (предлагается).<\/strong> До изменения текста юристы оформляют лист проверки:<\/p>\n<blockquote>\n<p>Полномочия лица, подписывающего приказ об утверждении настоящего Регламента, подтверждены документом с указанием вида полномочия и срока его действия. Лицо, ответственное за контроль исполнения, назначено отдельным пунктом приказа. Ознакомление работников фиксируется в ЭДО или на бумаге с возможностью подтвердить дату и документ.<\/p>\n<\/blockquote>\n<p>Если полномочия действительно подтверждены, в новой редакции оставить подписанта как уполномоченное лицо и добавить реквизиты основания; если нет — переутвердить приказ надлежащим подписантом. Пустой лист ознакомления не считать доказательством ознакомления; фактические записи нужно получить у КДП. В 14 аналогично хранить реквизиты утверждения и доказательство ознакомления, не переносить имена.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Юрист сверяет сертификат, доверенность/приказ и дату действия.<\/li>\n<li>КДП получает реестр ознакомления из ЭДО, не включая его персональные данные в кейс.<\/li>\n<li>При новой редакции приказ подписывает лицо с подтверждённым полномочием; доступ к ЛНА публикуется в согласованном внутреннем канале.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли доверенность или приказ, подтверждающий полномочия подписанта; где хранится заполненный лист ознакомления?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: реестр ознакомления и комплект полномочий не предоставлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в различии отображаемых ролей; юридическая действительность подписи — вопрос юристам.<\/p>"}, {"id": "К-KOM-15", "slug": "KOM-15", "title": "Цены авиабилетов названы примерами, а статус остальных пределов и тариф топ-менеджера не определены", "imp": "средняя", "docs": ["14"], "meta": [["Документы", "14, приложение 1: пп. 1.1, 3.1, 5; пп. 1.4, 2.2.3, 2.5"], ["Тип", "пробел"], ["Кто решает", "руководитель компании (выбор 9), финансовый директор и руководитель HR"], ["Важность", "средняя: сервису нужны однозначные правила, а не оценка разумного отклонения"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, приложение 1, сноска к п. 1.1: «Средняя и максимальная стоимость авиабилетов приведена для примера, допускается разумное отклонение в большую сторону в зависимости от сезона и времени вылета».<\/li>\n<li>14, приложение 1, п. 5: «Работник», «Руководитель», «Эконом», «Комфорт (Комфорт+)». Отдельной колонки топ-менеджера здесь нет (сверено с изображением PDF, страница 6).<\/li>\n<li>14, приложение 1, сноска к п. 1.1: «В центральном федеральном округе необходимо использовать ж/д транспорт.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Авиацены нельзя проверять как жёсткий предел: приёмка 13.11 прямо исправила такую ошибку карты. Для жилья таблица задаёт стоимость, но не поясняет порядок исключения; денежного предела для такси в таблице вообще нет. В других таблицах есть топ-менеджер, а в такси — только работник и руководитель; отнесение роли к группе не определено. Это пробел для настройки, а не основание поднять тариф автоматически.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 4 (ред. от 25.05.2026): «Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам других работодателей определяются коллективным договором или локальным нормативным актом». Закон не задаёт классы перелёта и тариф такси.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14, приложение 1 после сносок к п. 1.1 добавить:<\/p>\n<blockquote>\n<p>Указанные цены авиабилетов являются ориентиром для подготовки сметы и не образуют самостоятельного запрета на приобретение более дорогого билета. В смете указывается фактическая цена; её согласование производится по пункту 2.1 Регламента, изменение согласованного бюджета — по пункту 2.5. Установленный класс обслуживания сохраняется.<\/p>\n<\/blockquote>\n<p>После таблицы 3.1 добавить:<\/p>\n<blockquote>\n<p>Стоимость проживания по таблице является пределом для подготовки обычной сметы. Превышение отражается отдельно с обоснованием и прямо разрешается при согласовании сметы. Если необходимость превышения возникла после согласования, применяется пункт 2.5.<\/p>\n<\/blockquote>\n<p>В п. 5 приложения добавить:<\/p>\n<blockquote>\n<p>Отнесение Работника к тарифной группе подтверждается HR-директором по утверждённому перечню должностей. До утверждения отдельного тарифа топ-менеджера применяется тариф группы, к которой его должность отнесена указанным перечнем; повышение тарифа без решения не допускается. Тариф сервиса и денежный лимит являются разными условиями и отражаются в заявке раздельно.<\/p>\n<\/blockquote>\n<p>Перечень необходимо утвердить одновременно; без него последняя вставка не завершена. Рекомендация по выбору 9: сначала сохранить действующие суммы жилья и классы, затем пересматривать их по выгрузке. Отдельно решить исключения из требования ж/д в ЦФО, если такие поездки бывают; не придумывать их. В улье 06 и выборе 9 убрать утверждение о готовых размерах суточных в 14 и различать пределы жилья и примерные авиацены. Другие числовые значения исходной таблицы не менять.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR подтверждает классификацию должностей без передачи персональных списков в кейс.<\/li>\n<li>Администратор переносит правила, а не все суммы как блокирующие ограничения.<\/li>\n<li>При заказе сверяются класс, фактическая смета и утверждённое исключение; тестовые сценарии топ-менеджера и дорогого авиабилета проверяются человеком.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли утверждённый перечень тарифных групп и разрешённые исключения из ж/д по ЦФО?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа превышений, стоимости отелей и авиабилетов по сезонам.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по таблицам и сноске; смысл предела жилья и классификацию подтверждает HR.<\/p>"}, {"id": "К-KOM-16", "slug": "KOM-16", "title": "Срочная заявка и сбой сервиса не имеют полного маршрута до выезда", "imp": "средняя", "docs": ["14"], "meta": [["Документы", "14, пп. 2.1, 2.2.1, 2.3, 5.1"], ["Тип", "пробел"], ["Кто решает", "руководитель HR и финансовый директор; руководитель компании утверждает исключение"], ["Важность", "средняя: поздняя поездка не должна обходить письменное решение и обязательные гарантии"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.1: «не позднее, чем за 3 (три) рабочих дня до ее начала».<\/li>\n<li>14, п. 5.1: «В случае сбоя в работе Сервиса OneTweTrip Работнику после согласования заявки на командировку».<\/li>\n<li>14, п. 2.3: «Работнику перед командировкой необходимо ознакомиться и подписать Приказ на командировку.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Заявка позже срока не означает, что закон запрещает поездку: это внутренний срок компании. Но в 14 нет порядка разрешения такой заявки и нет альтернативы сервису в срочном случае, когда сервис работает, а обычный заказ уже не успеть оформить. Сбой не должен означать покупку до решения работодателя или обязательное финансирование работником.<\/p>\n<p><strong>Закон.<\/strong> ПП № 501 п. 3 (акт от 16.04.2025): «Работники направляются в командировки на основании письменного решения работодателя». ТК ст. 167 ч. 1 (ред. от 25.05.2026): «ему гарантируются сохранение места работы (должности) и среднего заработка, а также возмещение расходов». Срок подачи за три рабочих дня — из ЛНА, а не из приведённой нормы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 после 2.1.1 из <a href=\"#/k/KOM-05\">К-KOM-05<\/a> добавить 2.1.2:<\/p>\n<blockquote>\n<p>2.1.2. Заявка, поданная позднее срока пункта 2.1, содержит причину срочности и рассматривается Финансовым директором и HR-директором до начала командировки. Нарушение срока подачи не заменяет согласование бюджета, проверку ограничений и письменное решение работодателя. При невозможности завершить обязательное оформление до выезда дата поездки переносится либо заявка отклоняется уполномоченным лицом. Отсутствие ответа не признаётся согласованием.<\/p>\n<\/blockquote>\n<p>В 5.1 после исправления названия OneTwoTrip добавить:<\/p>\n<blockquote>\n<p>Факт сбоя и выбранный способ приобретения фиксирует Администратор сервиса. Одновременно с согласованием заявки он подтверждает отсутствие уже оплаченных дублирующих заказов. После восстановления сервиса Бухгалтерия сверяет самостоятельные расходы Работника и документы сервиса; одна услуга не оплачивается повторно.<\/p>\n<\/blockquote>\n<p>Выбор вне сервиса не при сбое — отдельный вариант руководителю, не включён автоматически. Срок 2.1 сохранить как рабочие, не календарные дни; в улье 06 и каталоге исправить единицу срока.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Заявка отмечает срочность или подтверждённый администратором сбой.<\/li>\n<li>У тех же согласующих — готовая смета и причина; КДП выполняет обязательную проверку.<\/li>\n<li>До выезда оформляется приказ, до самостоятельной покупки выдаётся аванс по <a href=\"#/k/KOM-08\">К-KOM-08<\/a>. Действия сервиса выполняет человек, пока интеграция не проверена.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой срочный маршрут используют сейчас; кто разрешает заказ вне сервиса при его исправной работе?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет статистики поздних заявок и сбоев.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии исключения в тексте; практика не установлена.<\/p>"}, {"id": "К-KOM-17", "slug": "KOM-17", "title": "Заведение аккаунта отделено от проверки основания передачи данных", "imp": "высокая", "docs": ["09", "14", "15"], "meta": [["Документы", "14, п. 2.2.2; 15, пп. 2.1–2.2; 09, раздел 7 (связь, без переписывания ИБ)"], ["Тип", "пробел связи между документами"], ["Кто решает", "юристы и ответственный за данные/ИБ; КДП и администраторы исполняют"], ["Важность", "высокая: данные попадают внешнему поставщику до явно указанной проверки основания"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.2: «В случае отсутствия аккаунта командированных вносит персональные данные работника.»<\/li>\n<li>15, п. 2.1: «в том числе номера мобильных телефонов сотрудников, с помощью которых возможно будет осуществлять заказ».<\/li>\n<li>15, п. 2.2: «с указанием условий и лимитов предполагаемого использования, а также мобильного телефона с помощью которого будет осуществляться заказ корпоративного такси».<\/li>\n<li>Связь с 09, раздел 7: передача третьей стороне ограничена условиями этого раздела; номер подпункта по распознаванию не используется.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Загрузка данных предусмотрена, но 14 и 15 не отсылают к проверке основания и минимального состава данных. Это не доказательство незаконной передачи: отдельные согласия и договорные основания могли быть оформлены. Почтовые копии широкому кругу согласующих не должны становиться рассылкой паспортов и медицинских сведений. Разбор и переписывание 09 не входят в работу HR, поэтому исправляется только кадровый шаг.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 88 (ред. от 25.05.2026): «не сообщать персональные данные работника третьей стороне без письменного согласия работника, за исключением случаев, когда это необходимо в целях предупреждения угрозы жизни и здоровью работника, а также в других случаях, предусмотренных настоящим Кодексом или иными федеральными законами». ФЗ № 152‑ФЗ ст. 9 ч. 1 (ред. от 26.07.2026): «Согласие на обработку персональных данных должно быть оформлено отдельно от иных информации и (или) документов, которые подтверждает и (или) подписывает субъект персональных данных.» Наличие необходимого основания определяют юристы, а не сервисная форма или помощник с ИИ.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14, п. 2.2.2 после существующего текста добавить:<\/p>\n<blockquote>\n<p>До внесения данных во внешний сервис КДП проверяет подтверждение правового основания передачи, определённого юристами и ответственным за персональные данные. В сервис вносится только необходимый для организации поездки состав данных. Отсутствие аккаунта не является самостоятельным правовым основанием передачи. Смета для согласования не содержит паспортных, медицинских и иных избыточных сведений.<\/p>\n<\/blockquote>\n<p>В 15 после 2.2 добавить 2.2.1 с тем же условием для администратора такси:<\/p>\n<blockquote>\n<p>Данные для подключения к корпоративному аккаунту передаются Администратору по утверждённому защищённому каналу после подтверждения правового основания. В письме о согласовании лимита указываются только сведения, необходимые согласующему; документы и реквизиты, необходимые исключительно поставщику, широкому кругу получателей не рассылаются.<\/p>\n<\/blockquote>\n<p>Юристы сверяют договоры с поставщиками, согласия и 09. Сервис нельзя включать в Decision Flow с данными работников до этой проверки. 04, 05, 09 здесь не редактируются; конкретный защищённый канал утверждает ответственный за данные/ИБ.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Юристы определяют основание и состав передачи по каждому поставщику.<\/li>\n<li>КДП/администратор отмечает проверку и вводит только нужные поля.<\/li>\n<li>Согласующие видят бюджет и результат допуска; доступ к исходным данным остаётся у уполномоченных ролей.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какими документами оформлена передача каждому сервису и кто утверждает состав данных и канал?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: фактов утечки и объёма переданных данных нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в разрыве ссылок; законность реальной передачи не оценена без документов.<\/p>"}, {"id": "К-KOM-18", "slug": "KOM-18", "title": "Месячная история такси не закрывает проверку целей, лимитов и расхождений", "imp": "средняя", "docs": ["14", "15"], "meta": [["Документы", "15, пп. 2.4, 2.6; 14, пп. 4.1–4.2"], ["Тип", "пробел; лишняя ручная работа"], ["Кто решает", "финансовый директор и руководитель HR с бухгалтерией"], ["Важность", "средняя: файл передан бухгалтерии, но результат сверки нигде не закреплён"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 2.4: «Ежемесячно не позднее 10 числа месяца следующего за отчетным Администратор корпоративного такси предоставляет в бухгалтерию Организации историю поездок из Аккаунта за отчетный месяц.»<\/li>\n<li>15, п. 2.6: «Администратор корпоративного такси или бухгалтерия Организации вправе запросить у Сотрудника, а Сотрудник обязан предоставить пояснения по поездкам».<\/li>\n<li>14, п. 4.1: «счета на оплату и акты выполненных работ проходят согласование по цепочке». <\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Действующий срок и получатель отчёта определены — нельзя заменять их неопределённой передачей раз в месяц финансовому директору и HR. Не определены результат проверки и лицо, закрывающее расхождение. При двух сервисах и личных авансовых отчётах потребуется ещё сверка одной услуги, а не только пересылка истории.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 1 (ред. от 25.05.2026): «иные расходы, произведенные работником с разрешения или ведома работодателя.» Нормы, назначающей корпоративный срок сверки после месячного отчёта, в базе нет; это предложение организации процесса, а не требование закона.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 15 сохранить срок и адресата 2.4, дополнить:<\/p>\n<blockquote>\n<p>Бухгалтерия сопоставляет историю с выставленными поставщиком документами, установленными целями и лимитами, а по командировкам — с согласованными сметами и возмещением личных расходов. По каждой выявленной разнице фиксируются сумма, причина и ответственное за разбор лицо. Администратор подтверждает полноту выгрузки. Итог сверки — отсутствие расхождений либо перечень незакрытых позиций с назначенным исполнителем и сроком решения, согласованным Финансовым директором.<\/p>\n<\/blockquote>\n<p>В 14, п. 4.1 добавить ссылку на сверку такси по 15, п. 2.4. Из каталога убрать подмену бухгалтерии другими получателями: финансовый директор и HR получают незакрытые позиции для решений в рамках своих полномочий. Не делать новую параллельную таблицу, если учёт расхождений уже есть в бухгалтерии.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Администратор до действующего срока передаёт штатную выгрузку бухгалтерии.<\/li>\n<li>Программа после настройки сопоставляет идентификаторы и суммы; человек проверяет спорные совпадения.<\/li>\n<li>Человеку на экране Decision Flow предлагается готовая разница и варианты: подтверждено / уточнить / передать на проверку ущерба. Последний вариант не является взысканием. Пока экрана нет, журнал ведут в существующем учёте, согласованном бухгалтерией.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где сейчас фиксируют результат сверки и кто закрывает расхождения по двум поставщикам?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет выгрузок, числа ручных сверок и времени бухгалтерии.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в тексте 2.4; наличие уже работающего бухгалтерского контроля неизвестно.<\/p>"}, {"id": "К-KOM-19", "slug": "KOM-19", "title": "Лимит работника, остаток в сервисе и предел договора названы одним денежным вопросом", "imp": "средняя", "docs": ["14"], "meta": [["Документы", "14, пп. 2.2.3–2.2.4, 3.4–3.5, 4.1"], ["Тип", "лишняя ручная работа; пробел разграничения проверок"], ["Кто решает", "финансовый директор, бухгалтерия и администратор сервиса"], ["Важность", "средняя: согласование расхода смешано с возможностью его оплатить"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.3: «В случае нехватки денежных средств, сообщает Бухгалтерии о необходимости пополнения Сервиса по реквизитам на согласованнуюсумму.»<\/li>\n<li>14, п. 2.2.4: «В случае нехватки денежных средств (лимита по постоплате), инициирует внесение авансового платежа для уменьшения суммы задолженности» и «согласовывает оформление дополнительного соглашения».<\/li>\n<li>14, п. 3.5: «Заказы могут оформляться работниками в Сервисе OneTwoTrip самостоятельно при установке в Сервисе OneTwoTrip лимита и привязке соответствующей Тревел-политики.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Текст содержит разные уровни: разрешённая смета поездки, персональная настройка и расчёты по договору. Пополнение аккаунта не разрешает потратить больше сметы; согласованная поездка не гарантирует свободный кредит поставщика. По 3.4 заказ ещё согласует человек, а 3.5 допускает самостоятельный режим, но условия выбора режима не связаны явно. Автоматизация без разведения этих проверок либо сохранит все повторные визы, либо снимет существенную проверку договора.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 4 (ред. от 25.05.2026): «Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам других работодателей определяются коллективным договором или локальным нормативным актом». Способ постоплаты и предел договора — не из ТК; договор поставщика отсутствует, проверить бухгалтерии и юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 объединить 2.2.3–2.2.4 в разграниченные подпункты:<\/p>\n<blockquote>\n<p>2.2.3. Администратор сервиса на основании согласованной сметы устанавливает индивидуальный лимит заказа и применимую Тревел-политику. Лимит заказа не может расширять бюджет без решения по пункту 2.5.\n2.2.4. Независимо от индивидуального лимита Администратор проверяет доступные денежные средства или лимит постоплаты по договору с поставщиком. При недостаточности он направляет Бухгалтерии задачу на платёж в пределах действующего договора. Изменение договорного предела оформляется после согласования уполномоченными лицами по действующему порядку договорной работы. Платёж или увеличение договорного предела не заменяют согласование сметы.<\/p>\n<\/blockquote>\n<p>В 3.5 добавить:<\/p>\n<blockquote>\n<p>Самостоятельный заказ допускается только после проверки Администратором сервиса, что настройки реально ограничивают класс, сумму и условия заказа по согласованной смете. Если это не подтверждено, заказ согласуется по пункту 3.4. Повторное решение о той же смете не требуется; согласующий проверяет соответствие заказа ей.<\/p>\n<\/blockquote>\n<p>Невозвратный тариф остаётся исключением по 3.2, размещение для корпоративного мероприятия по 3.3 не теряется, счета и акты по 4.1 сохраняются. Возможности OneTwoTrip не предполагаются: нужны проверка настроек и тестовый заказ без оплаты.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Администратор переносит утверждённую смету и проверяет работу ограничений.<\/li>\n<li>Бухгалтерия отдельно подтверждает расчётный ресурс и договорный предел.<\/li>\n<li>Обычный заказ в проверенной политике проходит без повторной визы бюджета; исключение идёт тому, кто вправе его разрешить.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой режим расчётов действует по договору и какие ограничения OneTwoTrip действительно блокирует?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа повторных согласований и договорного лимита.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в наличии разных проверок; средняя в предложении их объединить до проверки сервиса.<\/p>"}, {"id": "К-KOM-20", "slug": "KOM-20", "title": "Приказ об утверждении командировок отсутствует в переданном PDF, а подпись пакета не равна ознакомлению", "imp": "средняя", "docs": ["12", "14", "15"], "meta": [["Документы", "14, титул, пп. 1.2, 2.2.1; 15, приказ п. 2 и лист ознакомления; 12, п. 13.8"], ["Тип", "пробел подтверждающего комплекта"], ["Кто решает", "КДП и юристы; сквозная сверка SKVOZ и DISC"], ["Важность", "средняя: без комплекта нельзя окончательно установить отменённые редакции и факт ознакомления"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, титул: «Приказ № 33/2024 от 20.11.2024 (Приложение № 1)». Первая страница самого PDF отмечена в Диадоке: «Страница 3 из 9».<\/li>\n<li>14, п. 1.2: «Настоящий Регламент вступает в силу с даты его утверждения приказом Генерального директора».<\/li>\n<li>15, страница 2: «С приказом № 23-Т/2022 от 01.08.2022г. ознакомлены:». Под заголовком нет заполненных строк — сверено по изображению страницы.<\/li>\n<li>12, п. 13.8: «Изменения в Правилах утверждаются приказом генерального директора Общества и с такими изменениями (или новой редакцией Правил) работники ознакамливаются под роспись». <\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 14 передано приложение, а не полный вводящий приказ; нельзя по нему установить все отменённые редакции или распоряжения о переходе. Штамп Диадока подтверждает сведения о пакете, но не даёт доказательство, что каждый работник ознакомлен с нужной редакцией. Пустая страница 15 не доказывает неознакомление: отдельный реестр может существовать.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22 (ред. от 25.05.2026): «знакомить работников под роспись с принимаемыми локальными нормативными актами, непосредственно связанными с их трудовой деятельностью». ТК ст. 8 ч. 4 в той же базе: «локальные нормативные акты, принятые без соблюдения установленного статьей 372 настоящего Кодекса порядка учета мнения представительного органа работников, не подлежат применению». Это действует в предусмотренных законом случаях; отсутствие отметки в PDF не доказывает несоблюдение процедуры.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В приказ об утверждении каждой новой редакции 14/15 включить:<\/p>\n<blockquote>\n<p>КДП обеспечить хранение настоящего приказа совместно с утверждённой редакцией Регламента, приложениями и документами об отмене прежних редакций. До введения новой редакции ознакомить работников, чья деятельность ею регулируется, под роспись в надлежащем порядке. КДП обеспечить возможность подтвердить версию документа, дату и факт ознакомления.<\/p>\n<\/blockquote>\n<p>Перед утверждением юристы определяют применимость учёта мнения представительного органа и проверяют порядок ЭДО совместно с DISC. Не подставлять в приказ номер отменяемого акта из догадки: сначала запросить страницы пакета и реестр. Документам ИБ новые правила ознакомления этим кейсом не назначаются.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП предоставляет полный приказ № 33/2024 и сведения о редакциях, без персонального реестра в результате кейса.<\/li>\n<li>Юрист подтверждает действующий комплект, требуемую процедуру и способ подписи.<\/li>\n<li>В журнале новой редакции есть ссылка на приказ и подтверждение ознакомления; технические интеграции не считаются уже работающими.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где полный приказ № 33/2024 и доказательства ознакомления с обеими редакциями?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет реестра ознакомления и времени восстановления комплектов.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии страниц в переданном PDF; наличие документов в компании неизвестно.<\/p>"}, {"id": "К-KOM-21", "slug": "KOM-21", "title": "Редактура: опечатки не нужно превращать в отдельные политики", "imp": "низкая", "docs": ["14", "15"], "meta": [["Документы", "14, пп. 1.4, 2.2.3–2.2.4, 4.2, 5.1–5.2; 15, п. 1.2"], ["Тип", "ошибка в тексте; редактура"], ["Кто решает", "редактор и руководитель HR, названия договора сверяют юристы"], ["Важность", "низкая: исправляется одновременно с содержательными пунктами"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.3: «на согласованнуюсумму».<\/li>\n<li>14, п. 2.2.4: «заказа такси»; «к договору, заключенного с Сервисом OneTwoTrip».<\/li>\n<li>14, п. 4.2: «порядок возмещениях таких расходов».<\/li>\n<li>14, п. 5.1: «в работе Сервиса OneTweTrip».<\/li>\n<li>14, п. 5.2: «бронь отеля.» — перечисление начато открывающей скобкой, закрывающей нет.<\/li>\n<li>15, п. 1.2: «Лимит- сумму денежных средств в рублях, устанавливаемая».<\/li>\n<li>14, п. 1.4: «в соответствии локальными нормативными актами». <\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Ошибки есть в текстовом слое и не означают неработающего процесса. Название OneTweTrip затрудняет поиск, несогласованные обороты мешают чтению; исправлять их надо при выпуске новой редакции, а не выдавать за значимые правонарушения. Дословные цитаты выше намеренно оставлены без исправления.<\/p>\n<p><strong>Закон.<\/strong> Специальная норма для исправления запятых и опечаток не требуется. Порядок утверждения изменения ЛНА проверяют юристы; утверждение, что перечисленные опечатки нарушают закон, не делается.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новой редакции исправить соответствующие места:<\/p>\n<blockquote>\n<p>на согласованную сумму;\nна приобретение билетов, бронирование отелей, заказ такси;\nк договору, заключённому с поставщиком услуг сервиса OneTwoTrip;\nпорядок возмещения таких расходов;\nв работе Сервиса OneTwoTrip;\nс приложенными подтверждающими документами о расходах (авиабилеты, ж/д билеты, билеты на аэроэкспресс, бронь отеля);\nЛимит — сумма денежных средств в рублях, устанавливаемая в Аккаунте за определённый период для конкретных Сотрудников;\nв соответствии с локальными нормативными актами.<\/p>\n<\/blockquote>\n<p>Точное наименование договорного контрагента сохранить по договору, а не подменять названием интернет-сервиса. Содержательные замены 4.2 и 5.2 согласовать с <a href=\"#/k/KOM-08\">К-KOM-08<\/a>, не выпускать две несовместимые редакции. Пункт о двух работниках в номере на корпоративном мероприятии (14, 3.3), возвратных билетах/отелях (3.2), ж/д по ЦФО и допустимых целях курьерской доставки (15, 1.4) не терять при объединении.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Редактор собирает лист замен вместе с содержательными кейсами.<\/li>\n<li>КДП проверяет номера пунктов и сверяет текст с PDF; юрист сверяет договорное название.<\/li>\n<li>После утверждения обновляются ссылки улья, а работники знакомятся с единой редакцией.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли более новая авторизованная редакция, кроме переданных PDF?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: экономия от редактуры отдельно не оценивалась.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по текстовым опечаткам; это не самостоятельный вывод о правонарушении.<\/p>"}, {"id": "К-KOM-22", "slug": "KOM-22", "title": "Мелкая редактура и ссылки, меняющие смысл", "imp": "средняя", "docs": ["14", "15"], "meta": [["Документы", "14, пп. 2.2.3–2.2.4, 4.2, 5.1–5.2, приложение 1; 15, пп. 1.2, 2.3"], ["Тип", "ошибка в тексте; редактура"], ["Кто решает", "руководитель HR; юристы до утверждения"], ["Важность", "средняя: часть ошибок мешает исполнению, часть — поиску правила"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.3: «на согласованнуюсумму».<\/li>\n<li>14, п. 2.2.4: «заказа такси».<\/li>\n<li>14, п. 4.2: «порядок возмещениях таких расходов».<\/li>\n<li>14, п. 5.1: <code>Сервис OneTweTrip<\/code> — в этой строке сохраняется точная цитата ошибочного написания; исправленный вариант ниже: «Сервис OneTwoTrip».<\/li>\n<li>14, п. 5.2: «бронь отеля.»<\/li>\n<li>15, п. 1.2: «Лимит- сумму денежных средств в рублях, устанавливаемая».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Первые пять мест — опечатки или незакрытая скобка, но они ухудшают поиск и понимание. В 15 «Лимит» имеет несогласование рода; это мелкая редактура, не новый смысл. Отдельно нельзя молча исправлять название сервиса в действующей цитате: сначала сохранить точную цитату, затем внести исправление в редакцию.<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе нет, проверить юристам: это редактура ЛНА, а не вывод о нарушении.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новой редакции 14 и 15 исправить:<\/p>\n<blockquote>\n<p>на согласованную сумму;\nна приобретение билетов, бронирование отелей, заказ такси;\nпорядок возмещения таких расходов определяется в приказах;\nСервис OneTwoTrip;\nбронь отеля»;\nЛимит — сумма денежных средств в рублях, устанавливаемая в Аккаунте за определённый период для конкретных Сотрудников.<\/p>\n<\/blockquote>\n<p>Сверить с оригиналом PDF и с договором сервиса до утверждения. После этого обновить все ссылки в политиках 06 и 07; не делать отдельную политику на каждую запятую.<\/p>\n<p><strong>Как будет работать.<\/strong> Редактор готовит лист правок, КДП сверяет каждую строку с PDF, юристы проверяют название сервиса и утверждающий документ, затем новая редакция проходит ознакомление.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли авторизованный текст 14 после 20.11.2024 и 15 после 01.08.2022, кроме переданных PDF?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: ручная правка нескольких строк.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в перечисленных опечатках текстового слоя; полномочия и новая редакция требуют сверки.<\/p>"}]}, {"kod": "DISC", "nazv": "Распорядок, дисциплина, ЭДО, дистанционные", "glavnoe": "<p>Пять кейсов, с которых начать разговор с руководителем HR:<\/p>\n<ol>\n<li><strong><a href=\"#/k/DISC-01\">К-DISC-01<\/a>, общий ЭДО.<\/strong> По встрече 11.11 почти все кадровые документы подписывают в Диадоке, а ПВТР (п. 1.3) описывают ЭДО только для дистанционных по ст. 312.2–312.3. Вводящего ЛНА по ст. 22.2 и согласий в комплекте нет. От ответа зависит законность всего электронного маршрута, на котором будут строиться процессы; исключения из ЭДО — <a href=\"#/k/DISC-02\">К-DISC-02<\/a>.<\/li>\n<li><strong><a href=\"#/k/DISC-17\">К-DISC-17<\/a>, ознакомление с ПВТР.<\/strong> Лист к приказу в копии пуст, а п. 5.5 считает ознакомлением и простую рассылку. Это не доказывает, что люди не ознакомлены, но доказательство надо связать с редакцией. Это её же боль из ответов 10.11 (бумажный лист для офисных) и ручная проверка подписей у КДП (встреча 11.11).<\/li>\n<li><strong><a href=\"#/k/DISC-07\">К-DISC-07<\/a>, дисциплинарный порядок.<\/strong> По тексту п. 9.3 акт об отказе можно составить сразу, без двух рабочих дней; нет снятия взыскания. Правится текстом за один заход, а ошибка процедуры ставит под спор любое взыскание. Рядом <a href=\"#/k/DISC-18\">К-DISC-18<\/a>: неответ дистанционного за час не равен основанию увольнения.<\/li>\n<li><strong><a href=\"#/k/DISC-10\">К-DISC-10<\/a> вместе с 06 и 11, материальная ответственность.<\/strong> Солидарная ответственность при передаче дел (п. 4.19), взаимная формула п. 10.4 и нет проверки ущерба по ст. 247–248. Здесь самый вероятный спор о деньгах; с этим порядком связаны <a href=\"#/k/PLAT-13\">К-PLAT-13<\/a> и <a href=\"#/k/KOM-12\">К-KOM-12<\/a>.<\/li>\n<li><strong><a href=\"#/k/DISC-22\">К-DISC-22<\/a>, учёт мнения представительного органа.<\/strong> Правки ПВТР, порядок ЭДО и порядок дистанционного взаимодействия принимаются с учётом мнения органа, если он есть (ст. 190, 22.2, 312.3). Пока наличие органа не подтверждено, ни один текст из этого файла нельзя нести на утверждение.<\/li>\n<\/ol>\n<p>Почему эти: первые два о том, как у них на деле подписывают и знакомят, это ручная работа КДП и основа для Decision Flow; третий и четвёртый о местах, где ошибка текста прямо становится спором и деньгами; пятый задаёт условие, без которого не примут ни одну правку. Следом: каналы и резерв (<a href=\"#/k/DISC-04\">К-DISC-04<\/a>–05), дистанционные по документу 03 (<a href=\"#/k/DISC-12\">К-DISC-12<\/a>–16), невыход на связь (<a href=\"#/k/DISC-18\">К-DISC-18<\/a>), конфликт интересов и контроль (<a href=\"#/k/DISC-19\">К-DISC-19<\/a>–20), обучение (<a href=\"#/k/DISC-23\">К-DISC-23<\/a>), редактура (<a href=\"#/k/DISC-21\">К-DISC-21<\/a>).<\/p>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Противоречие или недостающая связь<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Общий кадровый ЭДО<\/td>\n<td style=\"text-align: left;\">12: 1.3, 2.5, 2.15, 5.4–5.7; 02: 1.4, 3.5–3.7; 14: 1.4, 2.2.1; 10: 10.11<\/td>\n<td style=\"text-align: left;\">генеральный директор, КДП, юристы, ИТ, работник<\/td>\n<td style=\"text-align: left;\">Диадок; упоминание Кадрового ЭДО; бумага<\/td>\n<td style=\"text-align: left;\">12 и 02 ограничивают режим дистанционными, 14 такого ограничения не содержит; отдельный ЛНА по ст. 22.2 не прислан<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Исключения из общего ЭДО<\/td>\n<td style=\"text-align: left;\">12: 2.16.2, 5.6–5.7, 5.15; 03: 1.3–1.4<\/td>\n<td style=\"text-align: left;\">КДП, генеральный директор, работник, специалист ОТ<\/td>\n<td style=\"text-align: left;\">Диадок, бумага, заказное письмо<\/td>\n<td style=\"text-align: left;\">нельзя одинаково оформлять обычный документ, увольнение и инструктаж; у дистанционного увольнения своя норма<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ознакомление с новой редакцией<\/td>\n<td style=\"text-align: left;\">приказ к 12: п. 3; 12: 2.10, 5.5, 13.5–13.8; 10: 12.3; 13: 3.2.2<\/td>\n<td style=\"text-align: left;\">КДП, HR, руководитель, работник<\/td>\n<td style=\"text-align: left;\">почта, ММ по ответам HR, Диадок, Confluence, бумага<\/td>\n<td style=\"text-align: left;\">отправка, получение и ознакомление различаются; лист в копии пуст, доказательства могут храниться отдельно<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Подтверждение получения<\/td>\n<td style=\"text-align: left;\">12: 3.2.25, 5.12; 03: 2.8<\/td>\n<td style=\"text-align: left;\">работник и работодатель, КДП<\/td>\n<td style=\"text-align: left;\">ЭДО, почта, телефон<\/td>\n<td style=\"text-align: left;\">срок есть только у работника в ПВТР; 03 говорит об обеих сторонах, но отсылает к договору<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Задача, совещание, отпускной автоответ<\/td>\n<td style=\"text-align: left;\">12: 3.2.29–3.2.30, 5.8–5.14; 07: 2.3–2.4; 13: 2.1; 16: 2.6<\/td>\n<td style=\"text-align: left;\">руководитель, работник, ИТ, КДП<\/td>\n<td style=\"text-align: left;\">Slack, Zoom, Jira, YouTrack, Confluence; ММ в ответах<\/td>\n<td style=\"text-align: left;\">смена Slack не подтверждена ИТ; перечни разнятся; нельзя считать наличие аккаунта правом подписи<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Резервная связь с работником<\/td>\n<td style=\"text-align: left;\">12: 3.2.9, 5.8, 5.11; 04: 6.2.5; 09: 9.3<\/td>\n<td style=\"text-align: left;\">КДП, ИБ, работник, юристы<\/td>\n<td style=\"text-align: left;\">служебная и личная почта, телефон<\/td>\n<td style=\"text-align: left;\">запрет личной деловой почты одновременно с разрешением обмена; правила ИБ и ПДн меняет их владелец<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Срочная задача и дежурство<\/td>\n<td style=\"text-align: left;\">12: 3.2.26, 5.13, 4.3; 02: раздел 3<\/td>\n<td style=\"text-align: left;\">руководитель, дежурный, работник, КДП<\/td>\n<td style=\"text-align: left;\">почта/мессенджер, Confluence, Диадок<\/td>\n<td style=\"text-align: left;\">названный регламент критичных инцидентов не прислан; получение, реакция и завершение задачи не разделены<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Дисциплинарное дело<\/td>\n<td style=\"text-align: left;\">12: 4.7, раздел 9, 10.2; 13: 1.6; 01: 10.3; 10: 6.3<\/td>\n<td style=\"text-align: left;\">руководитель, КДП, юристы, генеральный директор<\/td>\n<td style=\"text-align: left;\">запрос объяснения, приказ, акт, реестр<\/td>\n<td style=\"text-align: left;\">нет двух рабочих дней в 9.3; неполны сроки и снятие; премии отдельно проверяет PLAT<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Не выходит на связь<\/td>\n<td style=\"text-align: left;\">12: 4.8, 5.11–5.15; 03: 2.8<\/td>\n<td style=\"text-align: left;\">руководитель, КДП, HR, юристы<\/td>\n<td style=\"text-align: left;\">ЭДО, резервный канал, акт<\/td>\n<td style=\"text-align: left;\">неответ за час не равен отсутствию взаимодействия более двух рабочих дней; нужна фиксация поступления запроса<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Замещение на отпуск<\/td>\n<td style=\"text-align: left;\">12: 4.18–4.19, 10.4; 16: 2.1–2.3; 10: доплаты<\/td>\n<td style=\"text-align: left;\">уходящий, замещающий, руководитель, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">почта, акт, соглашение, 1С<\/td>\n<td style=\"text-align: left;\">передача дел превращена в общую солидарную ответственность; допработа и доплата — отдельное действие<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Возмещение ущерба<\/td>\n<td style=\"text-align: left;\">12: 3.2.22, 9.1, 9.9, 10.1–10.4; 04: 9.5–9.6<\/td>\n<td style=\"text-align: left;\">работодатель, работник, КДП, бухгалтерия, юристы<\/td>\n<td style=\"text-align: left;\">проверка, объяснение, расчёт, соглашение, приказ/суд<\/td>\n<td style=\"text-align: left;\">не собраны пределы и порядок; 10.4 также ограничивает ответственность работодателя<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Дистанционная работа и бумажные документы<\/td>\n<td style=\"text-align: left;\">03: 2.4–2.19; 12: раздел 5, 2.5, 2.15<\/td>\n<td style=\"text-align: left;\">КДП, работник, юристы, специалист ОТ<\/td>\n<td style=\"text-align: left;\">договор, ЭДО, заказная почта<\/td>\n<td style=\"text-align: left;\">раздел 2 документа ОТ ссылается на части статей, которые в действующей базе говорят о другом; 03 требует безусловную бумажную отправку договора, 12 исключает бумажный порядок при УКЭП<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Страховые документы дистанционного<\/td>\n<td style=\"text-align: left;\">03: 2.18; 12: 4.23, 6.6<\/td>\n<td style=\"text-align: left;\">работник, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">почта, электронные сведения листка<\/td>\n<td style=\"text-align: left;\">03 требует почтовые оригиналы без электронной ветви; профильного закона в базе нет<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Возмещение затрат на обучение<\/td>\n<td style=\"text-align: left;\">12: 3.2.23; 10: 10.10<\/td>\n<td style=\"text-align: left;\">КДП, юристы, бухгалтерия, работник<\/td>\n<td style=\"text-align: left;\">соглашение об обучении, расчёт<\/td>\n<td style=\"text-align: left;\">нет проверки основания и расчёта; норма об обучении в базе отсутствует<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Оборудование и компенсация<\/td>\n<td style=\"text-align: left;\">03: 2.12–2.13; 12: 3.2.24, 5.4; 13: 2.1, 3.2.3<\/td>\n<td style=\"text-align: left;\">ИТ, КДП, работник, бухгалтерия<\/td>\n<td style=\"text-align: left;\">заявка Jira/почта, выдача, акт, договор<\/td>\n<td style=\"text-align: left;\">размер и порядок компенсации могут быть в договорах; в комплекте они не представлены<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Гибрид и вызов в офис<\/td>\n<td style=\"text-align: left;\">12: 5.1–5.3, 5.14; 03: 2.16–2.17; 14: раздел 2<\/td>\n<td style=\"text-align: left;\">руководитель, работник, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">договор, приказ, почта/Slack, поездка<\/td>\n<td style=\"text-align: left;\">приказ должен соответствовать договору; вызов в другую местность проверить как командировку<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Контроль и наблюдение<\/td>\n<td style=\"text-align: left;\">12: 3.4, раздел 11; 09: правила данных<\/td>\n<td style=\"text-align: left;\">ИБ, юристы, HR, работник<\/td>\n<td style=\"text-align: left;\">камеры, ПО; СКУД/VPN по ответам HR<\/td>\n<td style=\"text-align: left;\">заголовок о скрытом наблюдении, текст об открытом/закрытом; объявленное согласие не заменяет отдельное информированное основание<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение ЛНА<\/td>\n<td style=\"text-align: left;\">12: 13.8; 02: 1.3; 10: 12.3<\/td>\n<td style=\"text-align: left;\">директор, HR, юристы, представительный орган при наличии<\/td>\n<td style=\"text-align: left;\">проект, обоснование, мнение, приказ<\/td>\n<td style=\"text-align: left;\">наличие органа не установлено; в черновике отсутствие прямо помечено допущением<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Конфликт интересов<\/td>\n<td style=\"text-align: left;\">12: 13.2–13.4; 01: 7.5–7.6<\/td>\n<td style=\"text-align: left;\">работник, уполномоченный по комплаенсу, HR, юристы, директор<\/td>\n<td style=\"text-align: left;\">сообщение и ограниченный реестр<\/td>\n<td style=\"text-align: left;\">в ПВТР нет получателя и маршрута; нельзя самовольно подменять комплаенс кадровой службой<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<ol>\n<li>Есть ли ЛНА о введении ЭДО по ст. 22.2, согласия и перечень категорий? Варианты: есть ЛНА и согласия / только дистанционные по главе 49.1 / работаем по факту без ЛНА / не знаем.<\/li>\n<li>Где подтверждение ознакомления именно с ПВТР ред. 4 и приложениями? Варианты: бумажный лист у КДП / подписанный документ в Диадоке / только рассылка / не найдено.<\/li>\n<li>Есть ли представительный орган работников и коллективный договор? Варианты: есть / нет, подтверждено / неизвестно.<\/li>\n<li>Применяли ли п. 4.19 о солидарной ответственности; есть ли договоры о полной или коллективной материальной ответственности? Варианты: не применяли и договоров нет / договоры есть / случаи были.<\/li>\n<li>Кто назначает проверку ущерба, берёт объяснение и решает о взыскании; были ли удержания за ущерб или за обучение? Варианты: единый порядок / каждый раз по-разному / случаев не было.<\/li>\n<li>Кто запрашивает объяснение по дисциплинарному делу, каким каналом и сколько ждут ответа? Варианты: руководитель / КДП; почта / Диадок / бумага; ждут два рабочих дня / меньше / не фиксируют.<\/li>\n<li>Какой мессенджер действует: Slack, Mattermost или оба; кто владелец каналов и резерва; что отправляют на личную почту дистанционным?<\/li>\n<li>Существует ли «Регламент работы с критичными инцидентами», кто дежурит и где график? Варианты: есть, пришлём / есть в другом виде / нет.<\/li>\n<li>Как работают с дистанционными: бумажный договор отправляют всегда или по заявлению; как вызывают в офис и оформляют ли поездку из другой местности командировкой; как компенсируют личное оборудование?<\/li>\n<li>Кто ответственный за комплаенс и куда сообщать о конфликте интересов; какие средства контроля (камеры, ПО, СКУД/VPN) реально работают и используются ли их данные в кадровых решениях?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li>ТК ст. 239, 240, 246: для <a href=\"#/k/DISC-10\">К-DISC-10<\/a>–11. Это соседние статьи главы 39 о материальной ответственности, которых нет в доборе; номера по справочным сведениям, не по тексту закона, содержание по памяти не пересказываем, проверить юристам. Без них проверка конкретного дела неполна.<\/li>\n<li>Утверждённые перечни работ и категорий и типовые формы договоров о полной материальной ответственности (ст. 244 ч. 2): для <a href=\"#/k/DISC-10\">К-DISC-10<\/a>.<\/li>\n<li>ТК ст. 249 и нормы об ученическом договоре: для <a href=\"#/k/DISC-23\">К-DISC-23<\/a> (номер по справочным сведениям, не по тексту закона).<\/li>\n<li>ТК ст. 66, 66.1: трудовая книжка и сведения о трудовой деятельности, для <a href=\"#/k/DISC-14\">К-DISC-14<\/a>.<\/li>\n<li>ТК ст. 76, 81, 261: отстранение, увольнение по инициативе работодателя, гарантии при увольнении; для <a href=\"#/k/DISC-18\">К-DISC-18<\/a> (и <a href=\"#/k/PRIEM-03\">К-PRIEM-03<\/a>).<\/li>\n<li>ТК ст. 157: оплата простоя при невозможности перевода по ст. 312.9 ч. 7, для <a href=\"#/k/DISC-16\">К-DISC-16<\/a>.<\/li>\n<li>Нормы об обязательном социальном страховании и электронном листке нетрудоспособности: для <a href=\"#/k/DISC-15\">К-DISC-15<\/a>.<\/li>\n<li>ФЗ № 152‑ФЗ с датой редакции (в редакция не указана): для <a href=\"#/k/DISC-05\">К-DISC-05<\/a> и 20.<\/li>\n<li>Специальные нормы о конфликте интересов, если они применимы к компании: для <a href=\"#/k/DISC-19\">К-DISC-19<\/a>.<\/li>\n<li>ТК ст. 104 в базе есть: ночная запись в <a href=\"#/k/DISC-08\">К-DISC-08<\/a> о её отсутствии была ошибкой и исправлена.<\/li>\n<\/ul>", "keysy": [{"id": "К-DISC-01", "slug": "DISC-01", "title": "Для общего кадрового ЭДО не представлен вводящий ЛНА", "imp": "высокая", "docs": ["02", "10", "12", "14"], "meta": [["Документы", "12: 1.3, 2.5, 2.15, 5.4–5.7; 02: 1.4, 3.5–3.7; 14: 1.4, 2.2.1; 10: 10.11"], ["Тип", "противоречие между документами; пробел"], ["Кто решает", "руководитель компании — вводить ли общий ЭДО; юристы — правовой режим; HR и КДП — подготовка"], ["Важность", "высокая: практика Диадока шире описанного в ПВТР режима"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 1.3: «Электронный документооборот, предусмотренный настоящими Правилами трудового распорядка осуществляется в соответствии со статьями 312.2 и 312.3 Трудового кодекса Российской Федерации.»<\/li>\n<li>02, п. 3.6: «Согласие и заявление направляются работником в систему ЭДО (если работник является дистанционным и у него есть электронная подпись) либо предоставляются на бумаге.»<\/li>\n<li>14, п. 2.2.1: «направляет его Работнику на ознакомление в систему ЭДО (при наличии у работника электронной подписи)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>12 и 02 ограничивают описанный электронный обмен дистанционными работниками, а 14 разрешает его без такого ограничения. По встрече 11.11 почти все кадровые документы подписываются в Диадоке, по ответам 10.11 офисные знакомятся с ЛНА на бумаге: это может быть различием видов документов, а не ошибкой HR. Не представлен отдельный вводящий ЛНА и согласия; это не доказывает их отсутствия. До расширения процесса надо установить, кто участвует по главе 49.1, а кто по ст. 22.1–22.3.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 22.2 ч. 2, ред. от 25.05.2026: «Электронный документооборот вводится работодателем на основании локального нормативного акта», содержащего систему, доступ, перечни документов и категорий работников, срок уведомления и дату введения. Ч. 5: «Переход на взаимодействие с работодателем посредством электронного документооборота осуществляется с письменного согласия работника, за исключением случая, указанного в части седьмой настоящей статьи.» Ч. 7: «Согласие на взаимодействие с работодателем посредством электронного документооборота не требуется от лиц, которые приняты (принимаются) на работу после 31 декабря 2021 года и у которых по состоянию на 31 декабря 2021 года отсутствует трудовой стаж.» ТК ст. 312.1 ч. 5: работодатель вправе распространить на дистанционных правила ст. 22.1–22.3; делать это автоматически нельзя.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>В 12 п. 1.3 заменить последнее предложение:<\/p>\n<blockquote>\n<p>Электронное взаимодействие с дистанционными работниками осуществляется по статьям 312.2–312.3 ТК РФ, если отдельным решением Работодателя на него не распространены статьи 22.1–22.3 ТК РФ. Общий кадровый ЭДО вводится отдельным локальным нормативным актом; наличие электронной подписи само по себе не означает перехода работника на этот режим.<\/p>\n<\/blockquote>\n<p>Если вводящего ЛНА нет, предлагается отдельный Порядок ЭДО, не смешанный с определениями ПВТР. Готовая основа его пунктов:<\/p>\n<blockquote>\n<ol>\n<li>ЭДО осуществляется через информационную систему [точное наименование и состав сервисов после проверки ИТ], обеспечивающую подписание, хранение и фиксацию получения. Доступ предоставляется КДП совместно с ИТ по персональной учётной записи; перед первым использованием работнику выдаётся инструкция.<\/li>\n<li>В приложении № 1 перечисляются виды электронных документов, категории работников и допустимые подписи; исключения ТК РФ не включаются.<\/li>\n<li>Дата введения — [дата]; срок индивидуального уведомления до неё — [срок, утверждаемый работодателем]. До этой даты КДП уведомляет каждого адресата и фиксирует письменное согласие, кроме прямо установленного законом исключения.<\/li>\n<li>Отсутствие согласия или подписи не служит основанием отказа в приёме или увольнения. Не участвующему в ЭДО работнику связанные с работой документы предоставляются безвозмездно на бумаге.<\/li>\n<li>Работодатель оплачивает создание и эксплуатацию системы, получение необходимой подписи работника и её использование. Работник вправе использовать ранее самостоятельно полученную УКЭП. КДП организует замену истёкшей подписи; при сбое используется предусмотренный настоящим Порядком бумажный маршрут.<\/li>\n<li>Каждое получение, подписание и ознакомление фиксируется с документом и редакцией. До отправки КДП проверяет категорию работника, вид документа и допустимую подпись по статье 22.3 ТК РФ. Электронные подлинники и подписи сохраняются в установленные архивные сроки.<\/li>\n<\/ol>\n<\/blockquote>\n<p>Квадратные поля требуют решения, это НЕ готовый к подписанию приказ. Порядок подписей по видам документов сверяют юристы: УКЭП работодателя для документов ст. 22.3 ч. 1, допустимые подписи работника по ч. 4–5. При этом слов о другой подписи без соглашения недостаточно. После принятия одновременно изменить 02 пп. 1.4, 3.5–3.7, 14 пп. 1.4, 2.2.1, 10 п. 10.11 и 12 пп. 2.5, 2.15: ссылка на Порядок и категорию, а не только наличие УКЭП. Условия дистанционного обмена не отменять до отдельного решения. Выбора о введении общего ЭДО в список выборов руководителя компании, нет — его надо вынести отдельно; это не выбор о согласовании трат.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) HR и юристы проверяют существующие ЛНА, согласия и категории. 2) ИТ подтверждает состав системы и доступные доказательства, не обещая интеграцию. 3) Компания решает, сохранять два правовых маршрута или вводить общий; HR готовит ЛНА и процедуру принятия. 4) КДП уведомляет, собирает согласия, настраивает бумажный маршрут. 5) Decision Flow предлагается как заявка, маршрут и журнал; до проверки выгрузок данные вносит КДП вручную, подпись остаётся в установленной системе.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли такой ЛНА; какой сервис реально используется; категории участников и согласия; распространялись ли общие правила на дистанционных?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: цена лицензии, число участников и согласия не представлены. Упомянутую на встрече примерную цену другого сервиса не используем как стоимость Диадока.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая по содержанию ЛНА; средняя по фактическому объёму и законности общего ЭДО — нет вводящих документов.<\/p>"}, {"id": "К-DISC-02", "slug": "DISC-02", "title": "Общий ЭДО нельзя распространять на увольнение и инструктажи без исключений", "imp": "высокая", "docs": ["03", "07", "12"], "meta": [["Документы", "12: 2.16.2, 5.5–5.7, 5.15; 03: 1.3–1.4; 07: раздел об увольнении"], ["Тип", "пробел: отсутствует разграничение видов документов"], ["Кто решает", "юристы, КДП и специалист по ОТ до утверждения"], ["Важность", "высокая: наличие УКЭП не отменяет специальные способы оформления"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 5.7: «а также подписать любой акт или документ связанный с его трудовой деятельностью в Обществе, дистанционный работник делает это с помощью ЭДО, путем проставления УКЭП, либо в письменной форме под подпись.»<\/li>\n<li>12, п. 2.16.2: «Прекращение трудового договора оформляется приказом, с которым работник должен ознакомиться под роспись.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Слова о любом документе нельзя переносить в общий ЭДО без проверки вида документа. Ответ КДП о почти всех документах в Диадоке не доказывает незаконное оформление конкретного инструктажа или увольнения. Общий режим ст. 22.1 исключает эти документы; для дистанционного увольнения есть отдельное правило электронной формы и бумажного письма. Если маршрут не разделить, можно потерять необходимую бумажную копию.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 22.1 ч. 3, ред. от 25.05.2026: «Положения настоящей статьи и статей 22.2 и 22.3 настоящего Кодекса не применяются в отношении трудовых книжек и формируемых в соответствии с трудовым законодательством в электронном виде сведений о трудовой деятельности работников, акта о несчастном случае на производстве по установленной форме, приказа (распоряжения) об увольнении работника, документов, подтверждающих прохождение работником инструктажей по охране труда, в том числе лично подписываемых работником.» ТК ст. 312.8 ч. 3, та же редакция: при электронном ознакомлении дистанционного работника с приказом работодатель «обязан в течение трех рабочих дней со дня издания указанного приказа (распоряжения) направить дистанционному работнику по почте заказным письмом с уведомлением оформленную надлежащим образом копию указанного приказа (распоряжения) на бумажном носителе».<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Дополнить 12 п. 5.7 и заменить 2.16.2:<\/p>\n<blockquote>\n<p>5.7, заключительное предложение. Способ оформления и ознакомления определяется видом документа и применимым правовым режимом. Исключения статьи 22.1 ТК РФ не оформляются по общему Порядку ЭДО; специальные правила для дистанционных работников применяются отдельно.\n2.16.2. Прекращение трудового договора оформляется приказом. Ознакомление проводится по статье 84.1 ТК РФ. При электронном ознакомлении дистанционного работника КДП в течение трёх рабочих дней со дня издания приказа направляет надлежаще оформленную бумажную копию заказным письмом с уведомлением и сохраняет доказательства отправки.<\/p>\n<\/blockquote>\n<p>В Порядок ЭДО из <a href=\"#/k/DISC-01\">К-DISC-01<\/a> включить таблицу: обычные кадровые документы / приказ об увольнении / трудовая книжка и сведения / акт о несчастном случае / подтверждение инструктажа. Для каждого — правовое основание, способ и ответственный. Инструктаж как мероприятие, ознакомление с ЛНА ОТ и документ о прохождении инструктажа — не одно и то же. Разделы ОТ согласует группа OT; общий порядок увольнения — PRIEM. Ни документ 03, ни ПВТР не должны объявлять инструктаж обычным ознакомлением.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП выбирает вид документа в карточке Decision Flow. 2) По утверждённой таблице выбирает ЭДО, бумагу или специальный смешанный маршрут. 3) Для дистанционного приказа ставится срок отправки копии; КДП отправляет почтой. 4) В журнал прикладываются реквизиты отправки и уведомление; решение не считается завершённым по одному PDF.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Какие приказы об увольнении и подтверждения инструктажа реально подписывают в Диадоке; отправляются ли бумажные копии?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: числа таких отправлений и тарифов нет.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в норме и необходимости разграничения; фактическое нарушение не установлено.<\/p>"}, {"id": "К-DISC-03", "slug": "DISC-03", "title": "Подтверждение получения требуется от обеих сторон, а срок работодателя не назван", "imp": "средняя", "docs": ["03", "10", "12"], "meta": [["Документы", "12: 3.2.25, 5.12; 03: 2.8; 10: 10.11"], ["Тип", "пробел и несогласованная отсылка"], ["Кто решает", "руководитель HR и КДП; юристы по правовому режиму"], ["Важность", "средняя: работник не понимает, принято ли заявление, а КДП ищет его по нескольким каналам"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 5.12: «Дистанционный/частично дистанционный работник обязан в рабочее время подтверждать получение любых электронных документов, писем, приказов, распоряжений, отчетов или иной информации от Работодателя и иных работников Общества в течение 1 (одного) рабочего дня».<\/li>\n<li>03, п. 2.8: «каждая из сторон электронного обмена обязана направлять в форме электронного документа подтверждение получения электронного документа от другой стороны»; срок — «определенный трудовым договором о дистанционной работе».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Работнику дан срок рабочего дня, а для получения его заявления работодателем ПВТР не называет ответственного и срок. В 03 обязанность уже двусторонняя, но отсылка только к договору. Подтверждение получения не равно подписи ознакомления и не равно решению по заявлению; смешение даёт ложный статус закрытой задачи. Для общего ЭДО закон отдельно определяет получение работодателем, его нельзя отодвигать внутренним подтверждением.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 312.3 ч. 3, ред. от 25.05.2026: «каждая из осуществляющих взаимодействие сторон обязана направлять в форме электронного документа подтверждение получения электронного документа от другой стороны в срок, определенный коллективным договором, локальным нормативным актом» либо договором/допсоглашением. ТК ст. 22.3 ч. 9: «Заявления, уведомления и сообщения, направленные работником или лицом, поступающим на работу, способами, указанными в части восьмой настоящей статьи, считаются полученными работодателем на следующий рабочий день после их направления.»<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 12 п. 5.12:<\/p>\n<blockquote>\n<p>5.12. При обмене электронными документами с дистанционным работником каждая сторона подтверждает получение документа в течение одного рабочего дня по своему режиму рабочего времени. От имени Работодателя подтверждение кадрового документа направляет КДП, рабочего поручения или отчёта — непосредственный руководитель. Подтверждение содержит документ или его идентификатор, отправителя, получателя и дату; подтверждение получения не означает согласия с содержанием, ознакомления под подпись или принятия решения. Специальные сроки закона и правила получения по статье 22.3 ТК РФ применяются независимо от технического подтверждения.<\/p>\n<\/blockquote>\n<p>В 3.2.25 оставить обязанность работника со ссылкой на это различие. В 03 п. 2.8 отсылку заменить ссылкой на кадровый порядок после согласования с ОТ. Для заявления о выдаче копий отдельно сохраняются три рабочих дня по ст. 312.3 ч. 7 и ст. 22.3 ч. 11; отсутствие квитанции их не приостанавливает.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Поступившее заявление КДП регистрирует с датой и режимом ЭДО. 2) КДП отправляет подтверждение, не ждёт согласующего. 3) Decision Flow предлагается хранить отдельно статусы направлено, получено, ознакомлен, решено. 4) Просрочка квитанции идёт КДП, срок исполнения закона продолжает считаться.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли срок в договорах; какие квитанции уже формируются и доступны для выгрузки?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: объём переспросов о получении не замерен.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая по разрыву между 03 и 12; средняя по фактическому отсутствию подтверждений.<\/p>"}, {"id": "К-DISC-04", "slug": "DISC-04", "title": "Slack в ЛНА и Mattermost в ответах HR: действующий канал не подтверждён", "imp": "высокая", "docs": ["07", "12", "13", "16"], "meta": [["Документы", "12: 3.2.29–3.2.30, 5.9; 16: 2.6; 07: 2.3–2.4; 13: 2.1"], ["Тип", "расходится с практикой; возможная устаревшая система"], ["Кто решает", "ИТ/ИБ подтверждают систему; HR предлагает текст; юристы проверяют границы"], ["Важность", "высокая: неверный канал ломает уведомление и задачу"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.29: «быть доступными для обращений со стороны Работодателя с использованием телефона, корпоративного мессенджера Slack, платформы для организации аудио и видеоконференций Zoom, служебной электронной почты, системы управления задачами и проектами Jira».<\/li>\n<li>16, п. 2.6: «продублировать данную информацию как статус в корпоративном мессенджере Slack».<\/li>\n<li>13, п. 2.1: «создает задачу в Jira на получение техники».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Ответы HR называют общий канал Mattermost, а ЛНА — Slack; встреча 11.11 говорит, что кадровые задачи живут в почте, приём ведут в Jira. Это не доказывает отключение Slack: нужно подтверждение ИТ. Но правило с конкретным старым каналом может быть невыполнимым; канал не должен быть доказательством кадровой подписи.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>Нормы ТК о выборе конкретного мессенджера в базе нет, проверить юристам. ТК ст. 312.3 ч. 2 и 9, ред. от 25.05.2026: иная форма должна позволять «обеспечить фиксацию факта получения работником и (или) работодателем документов в электронном виде»; порядок взаимодействия устанавливается ЛНА/договором. Требование достоверно определить отправителя прямо сформулировано для исключительного перевода в ст. 312.9 ч. 3; не приписываем его ч. 9 ст. 312.3.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>До подтверждения систем не менять Slack на Mattermost в действующем ЛНА. В 12 пп. 3.2.29–3.2.30, 5.9, 5.14 и 16 п. 2.6 дать ссылку на Матрицу каналов и систем; в 13 п. 2.1 сохранить разрешённую альтернативу Jira через почту/иные утверждённые средства, сверяя её с Матрицей. Матрицу оформить как утверждаемое приложение к соответствующему порядку, а не изменяемую без процедуры веб-страницу. Пример вставляемой нормы: «Рабочие обращения направляются по официальному каналу, указанному в Матрице. Матрица содержит назначение, владельца, резерв, способ фиксации отправки и получения. Кадровые документы, требующие подписи, оформляются допустимым способом по применимому Порядку ЭДО либо на бумаге». Изменение сервиса — утверждённая редакция и доведение до работников; конкретное название согласовать с ИТ. Отсутствие регламента критичных инцидентов не закрывать ссылкой «например». Общая смена системы — <a href=\"#/k/SKVOZ-03\">К-SKVOZ-03<\/a>; здесь требования к рабочему каналу и доказательству получения.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) ИТ/ИБ составляют реестр систем и владельцев. 2) HR подтверждает канал каждого сценария. 3) КДП обновляет связанные ЛНА и карточки. 4) Тестовая отправка проверяет доставку; подпись остаётся в ЭДО.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Действует Slack или Mattermost; действуют ли Jira, YouTrack, Zoom, Confluence; кто владелец и резерв; существует ли регламент инцидентов?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: число правил и стоимость миграции неизвестны.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в текстовом расхождении; средняя в фактической смене Slack<\/p>"}, {"id": "К-DISC-05", "slug": "DISC-05", "title": "Личная почта одновременно запрещена и допущена для дистанционного работника", "imp": "высокая", "docs": ["04", "09", "12"], "meta": [["Документы", "12: 3.2.9, 5.8, 5.11; 04: 6.2.5; 09: 9.3 — только связи"], ["Тип", "противоречие между пунктами и связанными ЛНА"], ["Кто решает", "юристы и ИБ; HR только описывает кадровый маршрут"], ["Важность", "высокая: кадровое объяснение может уйти по неразрешённому каналу"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.9: «вести деловую переписку с использованием личной электронной почты» — в перечне запретов.<\/li>\n<li>12, п. 5.8: «Взаимодействие Организации с дистанционным/частично дистанционным работником возможно в том числе по служебному адресу электронной почты, личной электронной почте, личному мобильному и домашнему номерам телефонов».<\/li>\n<li>12, п. 5.11: «при ее отсутствии - личной электронной почте».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Пункт 3.2.9 запрещает деловую переписку всем, а 5.8 и 5.11 разрешают личную почту дистанционным как резерв. План по данным зафиксировал такое же расхождение. Нельзя заранее объявить письмо нарушением: нужно определить тип сведений, согласие и резервный канал. Мессенджер не подменяет ЭДО.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>Нормы о конкретном разрешении личной почты для кадрового обмена в базе нет, проверить юристам. ТК ст. 312.3 ч. 2, 5 и 9 (ред. от 25.05.2026) допускает иную установленную форму; по ч. 2 она должна позволять «обеспечить фиксацию факта получения работником и (или) работодателем документов в электронном виде». Это не разрешение игнорировать действующие правила ИБ. ФЗ № 152‑ФЗ, ст. 9 ч. 1 и 3–4 в локальной базе без даты редакции не используется как окончательно проверенное основание; форму и доказательство согласия при необходимости проверяют юристы.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>До решения юристов заменить 12 п. 5.11: «При отсутствии служебного адреса или технической возможности использовать утверждённый корпоративный канал руководитель КДП выбирает резервный способ, согласованный с ИБ, при условии подтверждения отправителя, содержания и получения. Кадровые документы для подписи направляются через ЭДО или на бумаге. Личная почта используется только для видов сведений, прямо разрешённых отдельным Порядком и правилами обработки данных». В 5.8 дать ссылку на Матрицу каналов и Порядок ЭДО; изменения 04/09 делает их владелец.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП классифицирует сообщение. 2) ЭДО/бумага выбираются до канала. 3) Резерв проверяется по Матрице и правилам ИБ. 4) Получение фиксируется в реестре. 5) Ошибка отправки передаётся ИБ/юристам.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Что реально отправляли на личную почту; какие согласия; что значит «при её отсутствии»; кто утверждает резерв?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали; число резервных отправлений отсутствует.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в противоречии; низкая в фактическом ущербе<\/p>"}, {"id": "К-DISC-06", "slug": "DISC-06", "title": "Пункт о солидарной финансовой ответственности при передаче дел нужно отделить от ущерба", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "12: 4.19, 10.4, 3.2.22; 16: 2.3"], ["Тип", "противоречие внутри ПВТР; юридически значимое условие"], ["Кто решает", "руководитель HR — убрать/уточнить; юристы до утверждения"], ["Важность", "высокая: неясный общий риск без процедуры установления вины"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 4.19: «С этого момента оба работника несут солидарную ответственность по обязанностям … уходящего в отпуск работника, включая финансовую ответственность».<\/li>\n<li>12, п. 10.4: «Работник и Работодатель возмещают друг другу только прямой действительный ущерб».<\/li>\n<li>16, п. 2.3: «Уходящий в отпуск сотрудник передает текущие задачи (дела) исполняющему обязанности».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Пункт 4.19 устанавливает передачу не позже чем за два дня до отпуска, но не определяет акт, объём передаваемых обязанностей, имущество или вину. Пункт 3.2.22 о возмещённом третьим лицам ущербе сам по себе не противоречит определению прямого ущерба из ст. 238; вопрос к 10.4 — смешение ответственности работника и работодателя. Безопаснее разделить передачу задач, дополнительную работу и ответственность. Связанный <a href=\"#/k/OTP-12\">К-OTP-12<\/a> разбирает передачу дел; здесь — граница ответственности, а её пределы и взыскание раскрыты в <a href=\"#/k/DISC-10\">К-DISC-10<\/a>–11.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 238 (ред. от 25.05.2026): «Работник обязан возместить работодателю причиненный ему прямой действительный ущерб. Неполученные доходы (упущенная выгода) взысканию с работника не подлежат». ТК ст. 241: «За причиненный ущерб работник несет материальную ответственность в пределах своего среднего месячного заработка». ТК ст. 247 требует проверку размера и причины и письменное объяснение. ТК ст. 245 допускает коллективную ответственность лишь в специальной работе с ценностями и при письменном договоре; применимость к передаче дел проверить.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Заменить 12 п. 4.19: «Не позже чем за 2 дня до начала отпуска работник передаёт замещающему текущие задачи и материалы по акту. В акте указываются задачи, сроки, необходимые служебные доступы, незавершённые действия, ответственные и риски. Передача дел сама по себе не изменяет пределы и основания материальной ответственности и не создаёт солидарной ответственности. Дополнительная работа поручается с письменного согласия работника с указанием срока, содержания, объёма и доплаты». Доступы в акте — перечень необходимых прав, не пароли. Пункт 3.2.22 сохранить по существу и дополнить ссылкой на <a href=\"#/k/DISC-10\">К-DISC-10<\/a>–11; взаимную формулу 10.4 заменить отдельно по <a href=\"#/k/DISC-10\">К-DISC-10<\/a>, не текстом только об ответственности работника. В 16 п. 2.3 добавить ссылку на акт и 12 п. 4.19, совместно с <a href=\"#/k/OTP-12\">К-OTP-12<\/a>; доплату вести по ТК ст. 60.2 и 151, документу 10 пп. 4.4, 4.10.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Уходящий формирует список. 2) Замещающий принимает по акту. 3) Руководитель подтверждает объём; КДП оформляет доплату. 4) При ущербе проводится проверка и берётся объяснение. 5) Работник получает материалы проверки.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Был ли случай применения 4.19; есть ли договоры полной/коллективной ответственности; какой акт используется; кто оформляет доплату?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: сумма ущерба и число передач не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в противоречии; средняя в правовом выводе<\/p>"}, {"id": "К-DISC-07", "slug": "DISC-07", "title": "Порядок дисциплинарного взыскания ПВТР не содержит двух рабочих дней и части срока", "imp": "высокая", "docs": ["10", "12", "13"], "meta": [["Документы", "12: 4.7, 9.2–9.9; 13: 1.6; 10: 6.3 — только связь"], ["Тип", "расходится с законом; неполный порядок"], ["Кто решает", "руководитель HR и КДП; юристы до утверждения"], ["Важность", "высокая: пропуск шага ставит взыскание под спор"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 9.3: «До применения дисциплинарного взыскания работодатель должен затребовать от работника объяснение в письменной форме. В случае отказа работника дать указанное объяснение составляется соответствующий акт».<\/li>\n<li>12, п. 9.6: «Приказ работодателя о применении дисциплинарного взыскания объявляется работнику по роспись в течение 3-х рабочих дней со дня его издания».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/st
