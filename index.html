чае увольнения до истечения срока, обусловленного соглашением об обучении».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>В пункте есть соглашение и неотработанный срок, но нет отсылки к проверке конкретного законного основания, причин увольнения и расчёта. Сам текст не доказывает, что компания удерживает деньги автоматически: соглашения и случаи не представлены. Принимать эту сумму за обычный ущерб и механически применять <a href=\"#/k/DISC-10\">К-DISC-10<\/a>–11 также нельзя: обучение требует отдельной нормы. Увольнение и выдача документов не должны превращаться в ожидание решения об этом требовании; основной маршрут — <a href=\"#/k/PRIEM-13\">К-PRIEM-13<\/a>/14, общие удержания — <a href=\"#/k/PLAT-03\">К-PLAT-03<\/a>.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>Нормы ТК о возмещении затрат на обучение и об ученическом договоре в разрешённых базах нет (по справочным сведениям, не по тексту закона, это ст. 249; номер и текст проверить юристам); по памяти основания и формулу не восполняем. ТК ст. 137 ч. 1, ред. от 25.05.2026: «Удержания из заработной платы работника производятся только в случаях, предусмотренных настоящим Кодексом и иными федеральными законами». Эта норма сама по себе не устанавливает сумму обучения и не доказывает, что удержание по любому заявлению допустимо.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Дополнить 12, п. 3.2.23 организационной гарантией, не сочиняя отсутствующую норму:<\/p>\n<blockquote>\n<p>До предъявления требования о возмещении затрат на обучение КДП передаёт юристу соглашение, документы об оплате обучения, сведения о сроке работы и основании увольнения. Юрист проверяет применимость действующей нормы, условия соглашения и обстоятельства конкретного случая; бухгалтерия готовит документально подтверждённый расчёт только после определения законного основания и порядка. Настоящий пункт сам по себе не является основанием автоматического удержания или задержки окончательного расчёта и выдачи документов при увольнении.<\/p>\n<\/blockquote>\n<p>Полную замену обязанности из первого предложения подготовить только после получения текста ст. 249 и проверки соглашений, а не после одобрения общего процесса. В 10, 10.10 не добавлять самостоятельного разрешения удержать всё обучение; связать его с юридически проверенным основанием <a href=\"#/k/PLAT-03\">К-PLAT-03<\/a>. Решения о долге и расчёт при увольнении вести разными статусами.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП выявляет действующее соглашение при подготовке увольнения и передаёт комплект юристу. 2) Юрист устанавливает норму и допустимость требования, бухгалтерия — подтверждённую сумму по проверенному основанию. 3) Работодатель выбирает законный способ урегулирования, не автоматический вычет по отметке в обходном листе. 4) КДП отдельно завершает увольнение в законные сроки; Decision Flow предлагается как журнал двух независимых ветвей.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли соглашения и случаи взыскания обучения: нет / есть, требования не предъявляли / предъявляли добровольно / удерживали / взыскивали через суд? Нужны обезличенные условия и проверенная юристами ст. 249.<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: договоры, расходы и события не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая в неполноте организационного маршрута; окончательный правовой вывод о самом условии не сделан без ст. 249.<\/p>"}]}, {"kod": "VU", "nazv": "Воинский учёт", "glavnoe": "<ol>\n<li><strong><a href=\"#/k/VU-01\">К-VU-01<\/a> — календарный срок против «пяти рабочих дней».<\/strong> Это риск просрочки; сначала юристы должны закрепить единый способ счёта.<\/li>\n<li><strong><a href=\"#/k/VU-03\">К-VU-03<\/a> — приём без военного билета.<\/strong> Текст ПВТР и реальная практика расходятся, а правильный маршрут зависит от категории работника.<\/li>\n<li><strong><a href=\"#/k/VU-05\">К-VU-05<\/a> — нет журнала в 1С.<\/strong> 667 записей/документов за исходный период нельзя контролировать одной бумажной папкой; это главный кандидат на автоматизацию.<\/li>\n<li><strong><a href=\"#/k/VU-04\">К-VU-04<\/a> — направление вне 1С.<\/strong> Обязательный документ имеет поля вручения и отметки, но нет связанного статуса и доказательства вручения.<\/li>\n<li><strong><a href=\"#/k/VU-08\">К-VU-08<\/a> — ответственный и ежегодная сверка.<\/strong> Формы называют роль, но приказ и замещение в переданном комплекте не найдены.<\/li>\n<\/ol>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Связи и разрывы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Приём / увольнение<\/td>\n<td style=\"text-align: left;\">ПВТР (12), пп. 2.2–2.3; формы КДП, прил. 2; ПП № 719, пп. 30, 32<\/td>\n<td style=\"text-align: left;\">специалист КДП; руководитель организации; работник<\/td>\n<td style=\"text-align: left;\">1С; бумага; почта РФ; опись<\/td>\n<td style=\"text-align: left;\">ПВТР требует документы воинского учёта, но не описывает проверку, направление и фиксацию срока; отдельного ЛНА о ВУ среди 16 документов нет.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение сведений<\/td>\n<td style=\"text-align: left;\">форма 1, форма 3; ПВТР (12), п. 3.2.13; ПП № 719, п. 32; 53‑ФЗ, ст. 4, 10<\/td>\n<td style=\"text-align: left;\">работник; специалист КДП; руководитель организации<\/td>\n<td style=\"text-align: left;\">1С; бумага; почта РФ<\/td>\n<td style=\"text-align: left;\">Форма 1 заполняется руками, адрес военкомата не загружается; срок работник сообщает за 10 дней, организация по норме — 5 дней.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Направление на постановку<\/td>\n<td style=\"text-align: left;\">форма «Корешок направления / Направление», прил. 4; 53‑ФЗ, ст. 4; ПП № 719, п. 30 подп. «д»<\/td>\n<td style=\"text-align: left;\">специалист КДП; работник; руководитель организации<\/td>\n<td style=\"text-align: left;\">Word/бумага; почта/личная явка<\/td>\n<td style=\"text-align: left;\">Направления нет в 1С; процесс, нумерация, отметка вручения и возврат подтверждения в материалах не описаны.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Сверка<\/td>\n<td style=\"text-align: left;\">форма 5, форма 6; ПП № 719, п. 32 подп. «г», «д»<\/td>\n<td style=\"text-align: left;\">специалист КДП; руководитель КДП; руководитель организации<\/td>\n<td style=\"text-align: left;\">1С; бумага; военкомат<\/td>\n<td style=\"text-align: left;\">Форма сверки есть, но нет журнала в 1С и не найден календарь ежегодной сверки.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Повестка<\/td>\n<td style=\"text-align: left;\">форма/описание КДП; ПП № 719, п. 32 подп. «ж»; 53‑ФЗ, ст. 4<\/td>\n<td style=\"text-align: left;\">специалист КДП; работник; руководитель группы<\/td>\n<td style=\"text-align: left;\">бумага и/или электронное сообщение<\/td>\n<td style=\"text-align: left;\">В описании форм не найден маршрут повестки, срок «в тот же день» есть только в черновике политики, а не в действующем документе.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Защита данных<\/td>\n<td style=\"text-align: left;\">Положение о персональных данных (09), пп. 2.2, 8.2; ПВТР (12), п. 1.3<\/td>\n<td style=\"text-align: left;\">специалист КДП; уполномоченные роли<\/td>\n<td style=\"text-align: left;\">1С; бумага; почта<\/td>\n<td style=\"text-align: left;\">ВУ прямо включён в состав ПД, военкоматы названы внешними получателями; порядок доступа, минимизация и журнал передачи ВУ не описаны.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Оговорка об исходнике.<\/strong> Отдельного действующего ЛНА о воинском учёте среди 16 переданных документов нет. Поэтому «было» ниже — формы и описание КДП, ПВТР и Положение о ПД; предлагаемый порядок нужно утвердить отдельным ЛНА либо приказом с приложением, после решения юристов.<\/p>", "voprosy": "<ol>\n<li>Есть ли действующий приказ о назначении ответственного и замещающего по каждой организации?<\/li>\n<li>Сколько граждан фактически состоит на воинском учёте, отдельно по каждой организации?<\/li>\n<li>Что именно входит в 605 и 62 документов: события, формы, письма или страницы?<\/li>\n<li>Как сейчас фиксируются входящие запросы и повестки?<\/li>\n<li>Какой канал официально принимается каждым военкоматом: бумага, портал или оба?<\/li>\n<li>В каких случаях принимают без документа ВУ и кто разрешает такой приём?<\/li>\n<li>Где хранятся корешки направлений и отметки военкоматов?<\/li>\n<li>Когда была последняя ежегодная сверка и где её акт/подтверждение?<\/li>\n<li>Какие реквизиты форм 1, 2, 5 и 6 актуальны, а какие являются образцами?<\/li>\n<li>Кто обновляет справочник адресов военкоматов и проверяет комплект перед отправкой?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li>Нормы в базе не дают полного действующего текста требований к форме, хранению и заполнению учетных документов Министерства обороны; нужны официальный перечень/методические документы и сверка юристами.<\/li>\n<li>Нужен полный применимый режим персональных данных и бумажной/электронной передачи сведений ВУ; в имеющейся базе это не собрано в связке с процессом.<\/li>\n<li>Нужен официальный календарь переноса январских выходных для точного расчёта предельных дат; в локальной базе его нет.<\/li>\n<li>Нужен источник о приказе назначения ответственного и плане работы; в локальной базе отдельной нормы не найдено, проверить юристам.<\/li>\n<\/ul>", "keysy": [{"id": "К-VU-01", "slug": "VU-01", "title": "Срок в практике считается рабочими днями, а в норме — днями", "imp": "высокая", "docs": [], "meta": [["Документы", "Ответы HR от 10.11.2026; проект процесса, раздел «Воинский учёт»; ПП № 719, п. 32 подп. «а», «е»"], ["Тип", "расходится с законом / расходится с практикой"], ["Кто решает", "юристы до утверждения; руководитель HR внедряет после решения"], ["Важность", "высокая: рабочий срок может позднее календарного, и у организации нет единого правила"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Ответы HR: «не позднее 5ти рабочих дней, почтой РФ, опись с почты».<\/li>\n<li>Проект процесса: в нём предложено считать 5 календарных дней, хотя кадры сейчас считают рабочие дни.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В действующем ПП № 719, п. 32 подп. «а» и «е» указано «в течение 5 дней»; слово «рабочих» там отсутствует. Рабочие дни — это в той же норме отдельный срок для выявленных неточностей и подделок (п. 30 подп. «г»). Нельзя утверждать, что текущий рабочий подсчёт уже нарушает закон без юридической проверки исчисления срока; безопасный процесс должен считать календарные дни и отправлять не позднее пятого дня.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 32 подп. «а»: «направляют в течение 5 дней со дня принятия (поступления) или увольнения (отчисления) граждан с работы»; подп. «е»: «в течение 5 дней со дня изменения соответствующих сведений сообщают об указанных изменениях». ПП № 719, п. 30 подп. «г»: «в течение 5 рабочих дней со дня их выявления». Текст нормы есть в, а короткие цитаты — в, строки 636–646.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый документ «Порядок ведения воинского учёта», раздел «Сроки и контроль», вставить:<\/p>\n<blockquote>\n<p>«Специалист по воинскому учёту направляет сведения о приёме, увольнении и изменении сведений в соответствующий военный комиссариат в течение пяти календарных дней со дня события. Если последний день срока приходится на нерабочий день, специалист направляет сведения не позднее рабочего дня, предшествующего последнему дню срока, если иной порядок не установлен юристами. Сведения о выявленных исправлениях, неточностях, подделках, неполном количестве листов и случаях неисполнения обязанностей направляются в течение пяти рабочих дней со дня выявления. В реестре событий хранятся дата события, крайний срок, дата отправки, способ отправки и подтверждение.»<\/p>\n<\/blockquote>\n<p>В проекте HR заменить «пять рабочих дней» на «пять календарных дней»; в ПВТР (12) не добавлять срок ВУ, чтобы не дублировать специальный порядок.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Событие из 1С получает дату и календарный крайний срок. 2) Программа предупреждает специалиста за два дня. 3) Специалист проверяет сведения, печатает, подписывает и отправляет. 4) Дата отправки и номер описи заносятся в реестр. 5) Просроченное событие уходит руководителю КДП и руководителю организации.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Считать срок по календарным дням подтверждают юристы? Как фиксируется дата события для перевода, изменения семейного положения и места пребывания? Принимает ли конкретный военкомат электронную подачу или нужен бумажный комплект?<\/p>\n<p><strong>Цена вопроса.<\/strong> расчёт программой: учебное событие 20.11.2026; при отсчёте со следующего дня +5 календарных дней = 25.11.2026, +5 рабочих дней = 27.11.2026, разница 2 дня. Это демонстрация различия алгоритмов, не юридическое заключение о сроке фактической отправки. Новогодние даты исключены: постановления о переносах в базе нет.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в цитате и различии формулировок; средняя в способе исчисления последнего дня — подтвердить юристам.<\/p>"}, {"id": "К-VU-02", "slug": "VU-02", "title": "ПВТР обязывает сообщить кадрам об изменении анкетных данных, но не связывает это с ВУ", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "ПВТР (12), п. 3.2.13; форма 1; форма 3; ПП № 719, п. 32 подп. «е»"], ["Тип", "пробел / несогласованный процесс"], ["Кто решает", "руководитель HR; юристы до утверждения текста"], ["Важность", "высокая: событие может не попасть в форму ВУ и реестр срока"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>ПВТР (12), п. 3.2.13: «в течение 10 дней сообщить в подразделение, занимающееся кадровым делопроизводством, об изменении своих анкетных данных (фамилии, имени, отчества, места жительства, образовании, паспортных данных и др.).»<\/li>\n<li>Форма 1: «Сведения об изменениях семейного положения, образования, структурного подразделения организации, должности, места жительства или места пребывания, состояния здоровья (получении инвалидности) граждан, состоящих на воинском учете».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> ПВТР охватывает личные данные, но не говорит работнику, что часть изменений запускает воинский учёт и что сведения нужно подтвердить документом. Форма 1 охватывает также семейное положение, подразделение, должность и здоровье, которых п. 3.2.13 прямо не перечисляет. Поэтому КДП может получить сообщение, но не поставить задачу ВУ и не доказать дату изменения.<\/p>\n<p><strong>Закон.<\/strong> 53‑ФЗ (ред. от 04.08.2026), ст. 4: «направлять необходимые для ведения воинского учета сведения о гражданах, состоящих на воинском учете, а также не состоящих, но обязанных состоять на воинском учете, в течение пяти дней со дня изменения соответствующих сведений». ПП № 719 (ред. от 24.03.2026), п. 32 подп. «е»: «вносят в учетные документы сведения об изменениях семейного положения, образования, структурного подразделения организации, должности, места жительства или места пребывания, в том числе не подтвержденных регистрацией по месту жительства и (или) месту пребывания, состояния здоровья граждан, состоящих на воинском учете, и в течение 5 дней со дня изменения соответствующих сведений сообщают об указанных изменениях в военные комиссариаты».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В ПВТР (12) заменить п. 3.2.13 на:<\/p>\n<blockquote>\n<p>3.2.13. Работник сообщает в подразделение, занимающееся кадровым делопроизводством, об изменении анкетных данных в течение 10 дней, кроме сведений, необходимых для ведения воинского учёта. Об изменении семейного положения, образования, места жительства или места пребывания и иных изменениях, о которых необходимо сообщить для воинского учёта, Работник, состоящий или обязанный состоять на воинском учёте, уведомляет КДП незамедлительно после того, как ему стало известно об изменении, по установленному каналу с фиксацией даты. Имеющиеся подтверждающие документы представляются одновременно; отсутствие документа не задерживает сообщение. Указанный порядок не заменяет самостоятельных обязанностей гражданина по воинскому учёту.<\/p>\n<p>При выезде за рубеж в период выполнения трудовой функции дистанционно/частично дистанционно Работник обязан предварительно согласовать изменение местонахождения рабочего места и места работы со своим руководителем и Управлением ИБ, а также выполнить предусмотренные действующими правилами согласования и рекомендации об оборудовании.<\/p>\n<\/blockquote>\n<p>В новом Порядке — п. 3.1:<\/p>\n<blockquote>\n<p>Получив сообщение, КДП регистрирует отдельно дату изменения, дату получения и дату подтверждения. Изменения должности и подразделения, известные работодателю из кадровых документов, передаются специалисту ВУ без ожидания сообщения Работника. Законный срок сообщения организации считается от изменения сведений, а не от загрузки документа в 1С. При позднем получении данных сведения отправляются без дополнительного ожидания; причина задержки сохраняется в реестре.<\/p>\n<\/blockquote>\n<p>Сохранена вторая часть действующего п. 3.2.13 о выезде за рубеж: разбор ВУ не должен случайно отменить согласование с ИБ. Предлагаемое внутреннее требование незамедлительного сообщения и канал уведомления согласуют юристы и HR, затем знакомят работников; это не пересказ установленного законом срока гражданина.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Работник сообщает через согласованный канал. 2) КДП регистрирует дату и просит недостающий документ. 3) Реестр определяет форму 1 или листок сообщения. 4) Специалист отправляет сведения в срок. 5) При неполных данных задача остаётся жёлтой, а не закрывается без решения.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие изменения работник сейчас сообщает через Диадок, а какие — почтой или лично? Как подтверждается дата брака, рождения ребёнка, смены регистрации и состояния здоровья? Нужно ли включать в п. 3.2.13 сведения о месте работы и должности или только направить их в отдельный порядок ВУ?<\/p>\n<p><strong>Цена вопроса.<\/strong> расчёт программой: разница между сроками 10 и 5 дней = 5 дней. Это несогласованный запас времени в документах, не установленная фактическая просрочка и не вывод о вине работодателя.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в пробеле между ПВТР и формой; средняя в предлагаемом сроке работника — решают юристы.<\/p>"}, {"id": "К-VU-03", "slug": "VU-03", "title": "Приём без военного билета не имеет описанного маршрута проверки и направления", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "ПВТР (12), пп. 2.2–2.3; форма 2; форма направления; ПП № 719, п. 30"], ["Тип", "расходится с практикой / пробел"], ["Кто решает", "юристы до утверждения; руководитель HR внедряет"], ["Важность", "высокая: приём и передача сведений не оставляют единого следа проверки"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>ПВТР (12), п. 2.2: «документы воинского учета (для военнообязанных и лиц, подлежащих призыву на военную службу)».<\/li>\n<li>ПВТР (12), п. 2.3: «Прием на работу без предъявления вышеперечисленных документов не допускается.»<\/li>\n<li>Ответы HR: «На работу принимают и без военного билета. Человеку говорят сходить в военкомат; в военкомат уходит письмо, что принят человек без военного билета.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Текст ПВТР выглядит как запрет приёма без документов воинского учёта, а практика допускает приём без военного билета. Это не следует объявлять незаконным без проверки всех категорий и причины отсутствия документа. При этом в описании нет обязательного шага: проверить подлинность документа, отметки о постановке, мобилизационное предписание и зарегистрировать результат.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 30 подп. «а»: «проверяют у граждан, принимаемых на работу, наличие и подлинность военных билетов (временных удостоверений, выданных взамен военных билетов), справок взамен военных билетов или удостоверений граждан, подлежащих призыву на военную службу, в том числе в форме электронного документа»; подп. «б»: «заполняют учетные документы в соответствии с записями в документах воинского учета»; подп. «в»: «разъясняют гражданам порядок исполнения ими обязанностей по воинскому учету».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В ПВТР (12) заменить п. 2.3 на:<\/p>\n<blockquote>\n<p>2.3. Приём оформляется с проверкой документов, предусмотренных законодательством. Документы воинского учёта предъявляются военнообязанными и лицами, подлежащими призыву на военную службу. Проверку документов и записей в них осуществляет работник, назначенный ответственным за воинский учёт. Отсутствие документа, отсутствие постановки на учёт и выявленные недостатки документа фиксируются раздельно; специалист незамедлительно передаёт вопрос руководителю КДП для правовой проверки и выполняет предусмотренные законодательством уведомления и вручение документов. Отсутствие документа воинского учёта не признаётся автоматически отсутствием постановки на учёт. Решение об оформлении приёма не отменяет обязанностей по воинскому учёту.<\/p>\n<\/blockquote>\n<p>Текст согласуют с агентом PRIEM: не следует удалять из действующего п. 2.3 правила об иных документах без проверки ТК ст. 65 (ред. 25.05.2026, раздел ст. 65): «документы воинского учета - для военнообязанных и лиц, подлежащих призыву на военную службу». В новом Порядке — п. 2.1: проверка по полному перечню п. 30 подп. «а» ПП № 719, уточнение данных по подп. «б», разъяснение обязанностей по подп. «в», отдельные статусы отсутствия документа и отсутствия учёта. Удалён прямой допуск приёма одним лишь внутренним правилом: правовую позицию об отсутствии документа сначала подтверждают юристы. Регламент адаптации (13), п. 3.2.2 не переписывается в части ВУ: его общая ссылка на оформление по ТК связывается с Порядком ссылкой в контрольном листе приёма. Пункт 3.2.2 сверен со сканом.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) КДП получает пакет приёма. 2) Специалист сверяет документ и отметки с формой карточки. 3) При отсутствии документа фиксирует причину и выдаёт направление, если есть основания. 4) Формирует форму 2 и письмо. 5) Подписывает, отправляет и сохраняет подтверждение.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> В каких случаях реально принимают без документа: документ утрачен, кандидат не состоит на учёте, документ электронный или иное? Кто принимает решение о допуске к оформлению? Вручается ли направление под расписку и возвращается ли корешок с отметкой?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки. Измерить отдельно число приёмов без документа, время проверки одного пакета и число повторных запросов работнику.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в расхождении текста ПВТР и описанной практики; средняя в окончательном тексте допуска — нужна квалификация юристов.<\/p>"}, {"id": "К-VU-04", "slug": "VU-04", "title": "Направление на постановку есть на бумаге, но отсутствует в 1С и в маршруте", "imp": "высокая", "docs": [], "meta": [["Документы", "форма «Корешок направления / Направление для постановки на воинский учёт»; форма 2; ПП № 719, п. 30 подп. «д»; 53-ФЗ, ст. 4"], ["Тип", "пробел / лишняя ручная работа"], ["Кто решает", "руководитель HR; юристы проверяют форму и порядок"], ["Важность", "высокая: обязательный документ не связан с событием приёма или увольнения"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Описание КДП: «Направление для постановки на воинский учёт (прил 4) – нет в 1С».<\/li>\n<li>В форме направления есть поля: «Направление вручено», «Расписка гражданина в получении направления для постановки на воинский учет», «Отметка (мастичный штамп) о постановке на воинский учет».<\/li>\n<li>53‑ФЗ, ст. 4: «вручать гражданам, не состоящим на воинском учете, но обязанным состоять на воинском учете, направление в военный комиссариат для постановки на воинский учет».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Бумажный шаблон существует, но событие его выдачи, номер, вручение и отметка военкомата не попадают в общий реестр. Описание не показывает, кто и в какой срок формирует направление, а 1С его не создаёт. Нельзя отличить, выдали направление или сотрудник его не получил, и своевременно поднять просроченное действие.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 30 подп. «д»: «выдают гражданам, подлежащим воинскому учету и не имеющим регистрации по месту жительства и месту пребывания, а также гражданам, прибывшим на место пребывания на срок более 3 месяцев и не имеющим регистрации по месту пребывания, при принятии их на работу … или увольнении … сведения по форме согласно приложению N 2 для постановки на воинский учет по месту пребывания (учебы)». 53‑ФЗ, ст. 4 требует вручать направление гражданину, не состоящему, но обязанному состоять на учёте.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>2.2. Гражданину, не состоящему на воинском учёте, но обязанному состоять на нём, специалист вручает направление в военный комиссариат по статье 4 Федерального закона № 53‑ФЗ. Направление и сведения о выявлении не состоящего на учёте гражданина — самостоятельные действия; каждое фиксируется отдельно. Направление формируется по утверждённому юристами действующему шаблону вне 1С до проверки возможности автоматизации. В реестре сохраняются основание, номер, дата вручения и подтверждение либо причина невручения.<\/p>\n<p>2.3. При приёме или увольнении гражданина, подлежащего воинскому учёту и не имеющего регистрации по месту жительства и пребывания, а также прибывшего на место пребывания на срок более трёх месяцев без регистрации по месту пребывания, специалист выдаёт гражданину сведения по приложению № 2 к ПП № 719. Выдача этих сведений гражданину не заменяется направлением из пункта 2.2 и не отменяет отправку сведений работодателем по пункту 32 подпункту «а» ПП № 719.<\/p>\n<\/blockquote>\n<p>В рабочей инструкции добавить описание ручной ветки до интеграции. Не менять фактическую запись КДП «нет в 1С» на утверждение о готовой автоматизации. Различать документы: приложение № 2 к ПП № 719 (форма 2 из комплекта), направление (форма 4), листок сообщения (форма 3). Корешок, отметка или иной допустимый результат отслеживаются отдельно; отсутствие штампа само по себе не доказывает неисполнение гражданином обязанности.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) 1С или специалист отмечает основание. 2) Реестр создаёт задачу и номер. 3) Специалист печатает и вручает направление под подпись. 4) Корешок и отметка хранятся в папке ВУ. 5) Еженедельная проверка показывает невручённые и неподтверждённые направления.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас определяет отсутствие регистрации и срок пребывания? Где хранится корешок? Что делать, если военкомат не возвращает отметку? Есть ли единая форма для обеих организаций, чьи документы отражены в бумажном массиве?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки. Отдельно измерить число направлений, минут на ручное заполнение и долю возврата корешков.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в наличии формы и отсутствии её в 1С; средняя в конкретном триггере — проверить фактический порядок.<\/p>"}, {"id": "К-VU-05", "slug": "VU-05", "title": "Бумажный массив не заменяет журнал и не даёт контроля срока по каждому событию", "imp": "высокая", "docs": [], "meta": [["Документы", "описание КДП; формы 1–6; проект HR-процесса; ПП № 719, пп. 31, 32"], ["Тип", "лишняя ручная работа / пробел контроля"], ["Кто решает", "руководитель HR; руководитель организации утверждает порядок"], ["Важность", "высокая: просрочку нельзя доказать или увидеть по событию без ручного поиска"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Описание КДП: «Журнала в 1С нет – в бумажном за 10,5 мес порядка 605 документов по [компания], и 62 документа по [вторая компания].»<\/li>\n<li>Ответы HR: «Выгрузка из 1С + сопроводительное письмо = 30%»; «не позднее 5ти рабочих дней, почтой РФ, опись с почты».<\/li>\n<li>Формы 1–6 содержат отдельные поля событий и отметок, но не единый реестр: в форме 5 есть «Дата и исходящий номер сведений гражданина», в форме 6 — список для сверки.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Бумажные формы подтверждают отдельные действия, но не дают сводного списка, где у каждого события видны срок, отметка об отправке и доказательство. За 10,5 месяца накопилось около 667 документов (605 + 62); это программа посчитала из исходного описания, а не пересчёт оригиналов. Поэтому нельзя считать этот массив точным числом событий или доказательством своевременности. При 30% времени специалиста ручная сборка и отправка занимают значимую долю недели.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 31 подп. «б»: «ведут и хранят учетные документы граждан, поставленных на воинский учет, в порядке, определяемом Министерством обороны Российской Федерации». ПП № 719, п. 32 подп. «г», «д»: «сверяют не реже 1 раза в год» сведения с документами граждан и соответствующих военкоматов.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>«По каждому событию воинского учёта специалист ведёт электронный реестр: идентификатор события, дата события, вид события, организация, применимая форма, военкомат, крайний срок, дата подготовки, дата подписания, способ отправки, дата отправки, номер описи или иной документ-подтверждение, результат и причина отклонения. Бумажные формы и подтверждения хранятся в папке воинского учёта и связываются с записью реестра по идентификатору. Отсутствие записи в 1С не освобождает от внесения события в реестр.»<\/p>\n<\/blockquote>\n<p>В проекте процесса оставить человеку проверку, подпись, печать и отправку; программе — получение событий, расчёт срока, черновик формы и светофор. В форме 5 использовать поле исходящего номера как ссылку на запись реестра, а форму 6 и ежегодную сверку ставить отдельной задачей.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) 1С ежедневно отдаёт события. 2) Реестр создаёт запись и срок. 3) Специалист проверяет поля и формирует комплект. 4) Человек печатает, подписывает и отправляет. 5) Вносит дату и номер описи. 6) Руководитель КДП видит жёлтые и красные записи; ежегодная сверка закрывается актом/отметкой.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Что именно входит в 605 и 62 документов: события, страницы или исходящие письма? Отдельно ли учитываются формы 1–6? Какой документ подтверждает доставку письма и где хранится опись?<\/p>\n<p><strong>Цена вопроса.<\/strong> расчёт программой: около 667 документов за указанные КДП 10,5 месяца; около 63,5 в месяц, из них [компания] 57,6, [вторая компания] 5,9. Оценка HR 10.11 — 30% рабочего времени на весь ВУ, не только печать. При допущении полной обычной недели по ПВТР 12 пп. 4.1–4.2 это 12 часов в неделю; не замер и не экономия. Минуты на документ исключены: разнородный журнал и процент всей работы не дают достоверной трудоёмкости одного письма.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в наличии пробела «журнала в 1С нет»; средняя в составе бумажного массива и оценке времени.<\/p>"}, {"id": "К-VU-06", "slug": "VU-06", "title": "Список форм содержит ручной адрес и раздельные каналы, но не описывает контроль комплекта", "imp": "средняя", "docs": [], "meta": [["Документы", "описание КДП; форма 1; форма 2; форма 3; форма 5; форма 6; скриншоты 1–5"], ["Тип", "лишняя ручная работа / пробел"], ["Кто решает", "руководитель HR; юристы проверяют форму и канал"], ["Важность", "средняя: ручной адрес и ручной ввод повышают риск ошибки и возврата письма"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li><strong>Описание КДП:<\/strong> «нет полноценной выгрузки, заполняю руками»; «не загружается адрес ВК - копирую руками в печатныю форму».<\/li>\n<li>По описанию КДП, отчёт лежит в 1С по пути «Кадры - Кадровые отчеты – Отчетность для военкоматов – Сведения об изменениях для военкоматов»; на снимке экрана в описании отчёт не сформирован; отдельной отметки о журнале или адресе на экране нет.<\/li>\n<li>В форме 1 есть «Военный комиссариат …» и поле адреса; в форме 6 есть адрес организации и реквизиты военкомата.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Нельзя по описанию утверждать, что 1С умеет отправлять сведения в военкомат: на экране есть лишь общее «Отправить», а практика — бумажная почта. Ручное копирование адреса и ручная сборка формы не имеют второго контроля в описанном процессе. Это не доказанная ошибка адреса, а операционный риск, который нужно закрыть обязательной проверкой комплекта.<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе не устанавливают способ заполнения адресного поля и не подтверждают электронную отправку именно из этой 1С; проверить юристам и КДП по требованиям конкретного военкомата. ПП № 719, п. 32 подп. «а» устанавливает обязанность направления сведений в срок, но не снимает требования проверить адресата.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>«Перед подписанием специалист сверяет по карточке воинского учёта: адрес и наименование военного комиссариата, организацию, событие, дату события, состав сведений, подпись и приложения. Реквизиты военного комиссариата хранятся в справочнике с датой последней проверки. При ручном заполнении адреса второй работник проверяет комплект либо специалист фиксирует самостоятельную повторную сверку. Отправка через 1С считается подготовкой отчёта, а не доказательством передачи, пока не получено подтверждение принятия.»<\/p>\n<\/blockquote>\n<p>В описании КДП добавить строку «Канал передачи: бумажное письмо с описью; электронная подача — только после подтверждения возможности и реквизитов». В экранном маршруте не называть общее меню «Отправить» электронной отправкой военкомату.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Программа подставляет доступные реквизиты. 2) Специалист проверяет адрес по справочнику. 3) Второй контроль — руководитель КДП или повторная сверка. 4) Комплект печатается, подписывается и отправляется. 5) Опись и подтверждение связываются с реестром.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой адресат сейчас считается правильным для каждой организации? Кто обновляет справочник? Принимает ли военкомат электронные сведения через портал и есть ли УКЭП работника, осуществляющего учёт?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; измерить число комплектов с ручным адресом и возвратов/исправлений.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в ручном вводе; средняя в риске возврата и способе электронной подачи.<\/p>"}, {"id": "К-VU-07", "slug": "VU-07", "title": "ВУ включён в ПД, но порядок доступа и передачи не связан с процессом", "imp": "средняя", "docs": ["09"], "meta": [["Документы", "Положение о ПД (09), пп. 2.2, 8.2; формы 1–6; ПП № 719, пп. 31–32"], ["Тип", "пробел в связи документов"], ["Кто решает", "юристы и руководитель HR"], ["Важность", "средняя: сведения ВУ передаются внешнему адресату и должны быть доступны только по роли"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li><strong>Положение о ПД (09), п. 2.2:<\/strong> «сведения о воинском учете;».<\/li>\n<li><strong>Положение о ПД (09), п. 8.2:<\/strong> «военкоматы;».<\/li>\n<li>ПВТР (12), п. 1.3: «Электронный документооборот (далее ЭДО) – это система подписания документов с помощью УКЭП или иной электронной подписи с использованием информационной системы Работодателя- программного обеспечения «Диадок» и сервисов «Кадровый ЭДО»…».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Документы признают ВУ персональными данными и называют военкоматы внешним получателем, но не связывают форму ВУ, роль доступа, место хранения, журнал передачи и бумажную почту с конкретным процессом. Нельзя автоматически переносить правила Диадока на почту РФ: в материалах HR отправка ВУ описана как бумажная.<\/p>\n<p><strong>Закон.<\/strong> Нормы по защите персональных данных и допустимому каналу передачи ВУ в имеющейся базе не собраны в нужном объёме; проверить юристам. По ПП № 719, п. 31 подп. «б», организация «ведут и хранят учетные документы граждан, поставленных на воинский учет, в порядке, определяемом Министерством обороны Российской Федерации».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>«Доступ к сведениям воинского учёта и учетным документам имеют только руководитель организации, руководитель КДП, специалист, осуществляющий воинский учёт, и замещающий его работник — в объёме, необходимом для их функций. Передача сведений военному комиссариату выполняется только по утверждённому адресу и каналу. Каждая передача фиксируется в реестре: дата, адресат, форма, способ, отправитель и подтверждение. Бумажные документы хранятся в папке воинского учёта с ограниченным доступом; электронные файлы не передаются через неутверждённые каналы.»<\/p>\n<\/blockquote>\n<p>Положение о ПД дополнить ссылкой на порядок ВУ и реестр передач; не расширять список получателей до конкретных адресов без проверки актуальности. ПВТР оставить описанием Диадока, но не использовать его как основание для отправки ВУ.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Реестр ограничивает просмотр по роли. 2) Специалист формирует комплект. 3) Перед отправкой проверяет канал и адресат. 4) После отправки сохраняет подтверждение. 5) Руководитель КДП периодически проверяет журнал доступа и передачи.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто назначен ответственным и замещающим приказом? Где физически и электронно хранятся формы? Есть ли утверждённый список адресатов и правила доступа в 1С?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки.<\/p>\n<p><strong>Уверенность.<\/strong> средняя: пробел виден в переданных документах, юридический режим передачи нужно подтвердить.<\/p>"}, {"id": "К-VU-08", "slug": "VU-08", "title": "Назначение ответственного и замещение не подтверждены переданными документами", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "формы 1–6; описание КДП; ПП № 719, пп. 9, 12, 32; черновик политики HR от 12.11.2026"], ["Тип", "пробел в ролях и сроках"], ["Кто решает", "руководитель организации; юристы проверяют приказ"], ["Важность", "высокая: невозможно понять, кто отвечает и закрыта ли ежегодная обязанность"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Описание КДП называет ответственную роль в формах: «Ответственный за ВУР» и «Специалист по воинскому учету».<\/li>\n<li>В форме 5 есть: «Работник, осуществляющий воинский учет» и «Специалист по кадровому делопроизводству».<\/li>\n<li>В материалах нет приказа о назначении ответственного и замещающего; черновик политики прямо оставляет: «нужно от HR: ответственный по приказу и заменяющий».<\/li>\n<li>ПП № 719, п. 9: «За состояние воинского учета, осуществляемого организациями, отвечают руководители этих организаций.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Роль в шаблоне формы не доказывает назначение конкретного работника приказом. При отсутствии приказа, замещения и календаря сверки ответственность и резервный маршрут не видны. Нельзя утверждать, что обязанности не исполняются; можно утверждать, что в переданном комплекте нет доказательства управления процессом.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 9: «За состояние воинского учета, осуществляемого организациями, отвечают руководители этих организаций.» ПП № 719, п. 12: «1 работник, выполняющий обязанности по совместительству, - при наличии на воинском учете менее 500 граждан». ПП № 719, п. 32 подп. «г», «д»: «сверяют не реже 1 раза в год» сведения с документами граждан и соответствующих военкоматов.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Отдельным приказом руководителя организации назначить специалиста, осуществляющего воинский учёт, и замещающего работника; в приложении установить область ответственности и срок замещения. В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>Воинский учёт ведёт специалист по кадровому делопроизводству, назначенный приказом руководителя организации. На период его отсутствия обязанности исполняет замещающий работник, назначенный тем же приказом или отдельным приказом. Руководитель КДП еженедельно проверяет сроки событий. Ежегодно специалист организует сверку сведений с документами граждан и соответствующим военным комиссариатом, оформляет результат и хранит его в реестре воинского учёта.<\/p>\n<\/blockquote>\n<p>Шаблоны официальных форм сохраняют предусмотренные поля подписантов и заполняются действительными реквизитами при официальном оформлении. Роли вместо персональных реквизитов используются только в этом аналитическом результате, а не как замена обязательных полей официального документа. Приказ может уже существовать: сначала запросить копию, а не выпускать дублирующий.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Приказ назначает исполнителя и заменяющего. 2) Реестр назначает задачи исполнителю. 3) При отсутствии исполнителя задачи получает замещающий. 4) Руководитель КДП смотрит сроки еженедельно. 5) Раз в год создаётся задача сверки и хранится её результат.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сколько граждан состоит на учёте, отдельно по каждой организации? Кто назначен приказом сейчас? Когда была последняя сверка и где её подтверждение? Есть ли один порядок на обе организации или нужны разные ответственные?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали потребность в штатных единицах. Порог п. 12 зависит от числа граждан на воинском учёте по организации; число всех работников из ответа HR о группе не заменяет этот показатель. Форму оформления дополнительной работы специалиста и заменяющего (совмещение/совместительство и т. п.) проверяют юристы по фактическим договорам, а не выводят автоматически из процента нагрузки.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в отсутствии приказа среди переданных материалов; низкая в фактическом числе граждан на учёте.<\/p>"}, {"id": "К-VU-09", "slug": "VU-09", "title": "Повестки и запросы военкомата не имеют маршрута в действующих материалах", "imp": "высокая", "docs": [], "meta": [["Документы", "описание КДП; ПП № 719, п. 32 подп. «б», «ж»; 53-ФЗ, ст. 4; черновик политики HR от 12.11.2026"], ["Тип", "пробел процесса"], ["Кто решает", "руководитель HR; юристы проверяют каналы"], ["Важность", "высокая: отдельные сроки — тот же день для работы с повесткой и две недели для запроса"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>В описании форм КДП отдельного раздела о повестках и входящих запросах нет.<\/li>\n<li>ПП № 719, п. 32 подп. «б»: «направляют в 2-недельный срок по запросам соответствующих военных комиссариатов … необходимые сведения».<\/li>\n<li>ПП № 719, п. 32 подп. «ж»: «оповещают граждан о вызовах (повестках), направленных в письменной и (или) электронной форме … и обеспечивают им возможность своевременной явки».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В материалах не видно входящего реестра запросов, даты получения, ответственного и подтверждения оповещения. Черновик проекта говорит о повестке «в тот же день», но это не найдено в переданном действующем документе; не выдаём это за норму. Без маршрута нельзя доказать, что двухнедельный ответ или оповещение выполнены.<\/p>\n<p><strong>Закон.<\/strong> 53‑ФЗ (ред. от 04.08.2026), ст. 4: «оповещать граждан о вызовах (повестках) военных комиссариатов при поступлении, в том числе в электронной форме, таких вызовов (повесток) от военных комиссариатов»; «обеспечивать гражданам возможность своевременной явки по вызовам (повесткам) военных комиссариатов». ПП № 719, п. 32 подп. «б», «ж» — цитаты выше.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В новый порядок ВУ вставить:<\/p>\n<blockquote>\n<p>«Входящие запросы и повестки военного комиссариата регистрируются в день получения: дата, канал, адресат, сотрудник, крайний срок и комплект документов. По запросу специалист готовит и направляет ответ в двухнедельный срок. По повестке специалист в день получения передаёт её гражданину способом, позволяющим подтвердить оповещение, разъясняет дату и место явки и фиксирует подпись либо причину невозможности вручения. Руководитель КДП контролирует просрочки, а при необходимости руководитель организации обеспечивает сотруднику возможность своевременной явки.»<\/p>\n<\/blockquote>\n<p><strong>Как будет работать.<\/strong> 1) Почта/электронный канал проверяется ежедневно. 2) Входящий запрос или повестка получает запись. 3) Срок считается от даты получения. 4) Специалист готовит ответ или вручает повестку. 5) Подтверждение и причина сбоя прикладываются к записи.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто принимает почту и электронные сообщения? Какой канал считается официальным? Как фиксируется отказ или отсутствие работника? Кто согласует ответ на запрос до отправки?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в требованиях норм; средняя в отсутствии фактического маршрута — описание могло не включать все действия.<\/p>"}, {"id": "К-VU-10", "slug": "VU-10", "title": "Форма 3 содержит устаревшую ссылку на пункт 50 Положения", "imp": "средняя", "docs": [], "meta": [["Документы", "форма 3, листок сообщения; ПП № 719, актуальная структура пп. 32, 50"], ["Тип", "устарело / ошибка в форме"], ["Кто решает", "юристы до замены шаблона"], ["Важность", "средняя: ссылка затрудняет проверку формы и может вводить гражданина в заблуждение"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Форма 3: «На основании статьи 10 Федерального закона \"О воинской обязанности и военной службе\" и статьи 50 Положения о воинском учете, утвержденного постановлением Правительства Российской Федерации от 27 ноября 2006 г. N 719…».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В текущем тексте ПП № 719, который использован в базе, обязанности организации по приёму, изменениям и сообщениям находятся в пп. 30 и 32; пункт 50 в представленном извлечении отсутствует. При этом нельзя по одной выгрузке утверждать юридическую недействительность формы: проверить юристам и владельцу официального шаблона, относится ли ссылка к иной редакции/приложению.<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе не дают отдельного правила о корректности ссылки в этой форме; проверить юристам по действующему официальному образцу ПП № 719 и ведомственным формам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> До юридической сверки не печатать форму 3 как «актуальную» без пометки о проверке. После подтверждения заменить ссылку в шаблоне на точную норму действующей формы либо удалить ссылку, если форма является официальным приложением и должна применяться без редакторских изменений. В реестре шаблонов указать редакцию и дату проверки.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Юрист сверяет источник формы. 2) КДП получает утверждённый шаблон. 3) Старый шаблон блокируется. 4) Реестр хранит редакцию и дату. 5) При изменении нормы создаётся задача проверки.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Откуда взята форма 3 и кто утвердил её копию? Есть ли официальный файл с пунктом 50? Применяется ли форма к конкретному муниципальному образованию или это старый образец?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки.<\/p>\n<p><strong>Уверенность.<\/strong> средняя: цитата формы проверена, юридический статус ссылки требует проверки.<\/p>"}, {"id": "К-VU-11", "slug": "VU-11", "title": "Формы смешивают разные реквизиты, организации и редакции", "imp": "высокая", "docs": [], "meta": [["Документы", "формы 1, 2, 5, 6; описание КДП"], ["Тип", "пробел в управлении шаблонами"], ["Кто решает", "руководитель HR и руководитель организации; юристы проверяют формы"], ["Важность", "высокая: адрес и реквизиты другой организации/военкомата могут попасть в письмо"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Форма 1 (форма КДП, ячейка K5): «Военный комиссариат (объединенный, Красносельского района ЦАО города Москвы)»; описание: «не загружается адрес ВК - копирую руками в печатныю форму». Адреса из форм не переносятся в этот результат.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В перечне исходных форм есть адресные реквизиты разных военкоматов и регионов; этот результат не воспроизводит их из-за ограничения по данным. Точный пример из формы 1: «Военный комиссариат (объединенный, Красносельского района ЦАО города Москвы)»; описание КДП отдельно говорит: «не загружается адрес ВК - копирую руками в печатныю форму».<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе не определяют конкретный адрес военкомата для данной организации; проверить юристам и КДП по месту воинского учёта каждого гражданина. ПП № 719, п. 32 требует направлять сведения «в соответствующие военные комиссариаты и (или) органы местного самоуправления».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В реестр шаблонов добавить обязательные поля «организация», «военкомат/орган», «адрес», «дата проверки», «источник реквизитов», «редакция формы». В новый порядок вставить:<\/p>\n<blockquote>\n<p>«Специалист применяет шаблон только после выбора организации и соответствующего военного комиссариата по документам воинского учёта гражданина. Реквизиты другого шаблона не переносятся. Перед отправкой специалист проверяет адресат и адрес; при несоответствии комплект не подписывается и возвращается на исправление.»<\/p>\n<\/blockquote>\n<p>В 1С хранить справочник реквизитов либо, до интеграции, вести контролируемую таблицу; формы 1, 2, 5 и 6 связать с редакцией шаблона. Связь с формами ПД оставить только на уровне роли и доступа.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Событие определяет организацию и карточку гражданина. 2) Система выбирает реквизиты. 3) Специалист сверяет адрес с документом учёта. 4) Второй контроль/повторная сверка. 5) В реестре сохраняются версия и результат.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие формы относятся к какой организации? Какие военкоматы фактически обслуживают работников? Это реальные текущие адреса или демонстрационные/старые шаблоны? Кто обновляет реквизиты после изменения военкомата?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в различии реквизитов; низкая в том, что это ошибки, а не образцы.<\/p>"}, {"id": "К-VU-12", "slug": "VU-12", "title": "Черновик политики уже описал процесс, которого нет в действующем ЛНА", "imp": "высокая", "docs": [], "meta": [["Документы", "формы и описание КДП; проект процесса HR; черновик политики HR от 12.11.2026"], ["Тип", "устарело / смешение проекта с действующим правилом"], ["Кто решает", "руководитель организации; юристы до утверждения; руководитель HR выбирает документ"], ["Важность", "высокая: черновик нельзя выдавать за утверждённый порядок"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>Проект процесса HR от 11.11.2026: «Событие в 1С … попадает в список с крайним сроком»; «Светофор по событиям; раз в год сверка с военкоматом».<\/li>\n<li>Черновик политики HR от 12.11.2026: «Светофор по каждому событию: сколько дней прошло и отправлено ли»; «Раз в год … Сверка учётных данных с военкоматом».<\/li>\n<li>В действующем описании КДП: «Журнала в 1С нет» и «нет полноценной выгрузки, заполняю руками».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Decision Flow, светофор и электронный реестр — проект, не действующий порядок. Их можно предлагать как целевое состояние, но нельзя ссылаться на них как на уже работающие средства контроля. Отдельного ЛНА ВУ нет, поэтому сначала нужно определить документ, владельца и дату вступления, затем обучить КДП.<\/p>\n<p><strong>Закон.<\/strong> ПП № 719 (ред. от 24.03.2026), п. 31 подп. «б»: «ведут и хранят учетные документы граждан, поставленных на воинский учет, в порядке, определяемом Министерством обороны Российской Федерации». Детали Decision Flow в норме не установлены; проверить юристам и ИТ.<\/p>\n<p><strong>Стало (предлагается).<\/strong> До запуска ввести приказом временный порядок:<\/p>\n<blockquote>\n<p>«До ввода электронного реестра специалист ведёт контрольный журнал воинского учёта в утверждённой таблице. После утверждения реестра в системе записи переносятся с сохранением даты и номера бумажного подтверждения. Проект Decision Flow, светофор и автоматические черновики являются способом исполнения утверждённого порядка и не заменяют его.»<\/p>\n<\/blockquote>\n<p>После пилота утвердить отдельный ЛНА «Порядок ведения воинского учёта» с приложениями: реестр событий, контрольный лист комплекта, шаблон направления, матрица ролей и календарь сверки. В проекте HR заменить слова «политика» на «проект порядка» до утверждения.<\/p>\n<p><strong>Как будет работать.<\/strong> 1) Приказ вводит временный журнал. 2) Специалист ежедневно вносит события и отправки. 3) ИТ проверяет коннектор и права. 4) КДП прогоняет процесс на реальных обезличенных образцах. 5) После приёмки журнал переводится в реестр.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой документ будет утверждён: отдельный ЛНА или приказ с приложениями? Кто владелец реестра и кто имеет право исправлять запись? Когда завершена последняя ежегодная сверка?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали число ошибок/возвратов. Расчёт программой считает только объём бумажного массива и долю рабочего времени; цена ручного адреса зависит от числа комплектов и результатов сверки.<\/p>\n<p><strong>Уверенность.<\/strong> высокая: отсутствие отдельного ЛНА и проектный статус прямо видны в материалах.<\/p>"}]}, {"kod": "OT", "nazv": "Охрана труда", "glavnoe": "<p>Начать разговор руководителя HR с этих пяти кейсов:<\/p>\n<ol>\n<li><strong><a href=\"#/k/OT-04\">К-OT-04<\/a> — допуск после приёма.<\/strong> Это связывает адаптацию, КДП, подрядчика и ОТ; ошибка в маршруте может превратиться в допуск без обязательного мероприятия.<\/li>\n<li><strong><a href=\"#/k/OT-01\">К-OT-01<\/a> — форма инструктажа и Диадок.<\/strong> Практика уже названа HR, а специальный режим документов о инструктажах нельзя подменять общей загрузкой в ЭДО.<\/li>\n<li><strong><a href=\"#/k/OT-06\">К-OT-06<\/a> — медосмотры.<\/strong> В 08 одновременно участвуют специалист по ОТ, КДП и руководители; без входного события нельзя понять, кто обеспечивает допуск.<\/li>\n<li><strong><a href=\"#/k/OT-08\">К-OT-08<\/a> — дубль 03 и 06.<\/strong> Устранение двух источников уменьшает риск разных действий при несчастном случае и не требует переписывать весь документ.<\/li>\n<li><strong><a href=\"#/k/OT-09\">К-OT-09<\/a> — адресат извещения.<\/strong> Пропуск органа местного самоуправления однозначно виден в тексте и норме; исправление срочного маршрута важнее косметики.<\/li>\n<\/ol>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Разрыв или зависимость<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Приём и допуск к работе<\/td>\n<td style=\"text-align: left;\">12, 2.13–2.13.3; 13, 2.1–2.2, 3.2.1–3.2.3; 08, 7.3.5 к), 8.4.1–8.4.4; 11, 2.4<\/td>\n<td style=\"text-align: left;\">КДП, HR, руководитель подразделения, специалист по ОТ, системный администратор<\/td>\n<td style=\"text-align: left;\">По 13 — Jira или почта; по ответам HR — форма от подрядчика и загрузка в Диадок<\/td>\n<td style=\"text-align: left;\">Общая презентация и выдача техники описаны; передачи от КДП специалисту по ОТ и подтверждения допуска в регламенте адаптации нет. Это не доказательство отсутствия инструктажей на деле<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ознакомление дистанционного работника<\/td>\n<td style=\"text-align: left;\">03, 1.2–1.4, 3.1–3.20; 12, 5.5–5.6; 08, 8.8.3–8.8.4<\/td>\n<td style=\"text-align: left;\">Назначенное приказом лицо, специалист по ОТ, руководитель подразделения, КДП<\/td>\n<td style=\"text-align: left;\">В 03 первично — специально оборудованное помещение и лист; повторно — электронные материалы; в ПВТР — почта, бумага, ЭДО<\/td>\n<td style=\"text-align: left;\">Очный способ первичного ознакомления; нет приложенного листа; периодическая рассылка без установленного доказательства получения; нельзя смешать ознакомление с ЛНА и обязательный инструктаж<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Выбор правил для офисных, дистанционных и гибридных работников<\/td>\n<td style=\"text-align: left;\">03, 2.4, 2.14–2.15, раздел 3; 12, 3.2.5, 3.5, 5.1–5.3, 10.3; 08, 8.4<\/td>\n<td style=\"text-align: left;\">КДП, специалист по ОТ, непосредственный руководитель<\/td>\n<td style=\"text-align: left;\">Трудовой договор, дополнительное соглашение, приказ о чередовании периодов<\/td>\n<td style=\"text-align: left;\">В ПВТР учитываются дистанционные периоды гибридной работы; в 03 это не раскрыто. Исключение обязанностей работодателя в ПВТР не учитывает дополнительные обязанности, принятые в ЛНА<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Приём, перевод, медосмотр, допуск<\/td>\n<td style=\"text-align: left;\">08, 7.3.2 в), 7.3.4 б), 7.3.5 б), е), н), 7.3.6 а), в), ж), 7.3.7 б)–в), 8.3.1–8.3.5; 12, 2.13; 10, 10.3–10.4<\/td>\n<td style=\"text-align: left;\">Специалист по ОТ, КДП, руководитель подразделения, генеральный директор, бухгалтерия, медицинская организация<\/td>\n<td style=\"text-align: left;\">Списки, календарный план, направление и заключение; конкретная система в 08 не определена<\/td>\n<td style=\"text-align: left;\">Несколько уровней отвечают за медосмотры; нет переданного отдельного положения о медосмотрах. Кто сообщает кадровое событие, оформляет направление и подтверждает допуск, из комплекта не ясно<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Сообщение о происшествии и расследование<\/td>\n<td style=\"text-align: left;\">06, 6.1–6.2, 7.1–7.3, 8.1–8.8, раздел 9, 10.5, 11.1–12.5; 03, раздел 8; 08, 7.3.7 в), 8.11.1–8.11.8<\/td>\n<td style=\"text-align: left;\">Работник, руководитель, специалист по ОТ, комиссия, генеральный директор, КДП<\/td>\n<td style=\"text-align: left;\">Немедленное сообщение руководителю, извещения, приказ, материалы и журнал; электронные опросы допустимы по 06, 10.2<\/td>\n<td style=\"text-align: left;\">Дублирующие порядки; в извещениях нет органа местного самоуправления; внутри порядка расходятся сроки повторного извещения. Получение заявления и передача акта пострадавшему не выстроены<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Документы по профессиональному заболеванию и микротравмам<\/td>\n<td style=\"text-align: left;\">03, раздел 9; 08, 8.11.1, 8.11.7<\/td>\n<td style=\"text-align: left;\">Специалист по ОТ, работодатель, медицинская организация, КДП как держатель кадровых сведений<\/td>\n<td style=\"text-align: left;\">Извещения, материалы расследования<\/td>\n<td style=\"text-align: left;\">08 ссылается на отдельные СУОТ.П09 и П10; их нет в комплекте. Раздел 9 документа 03 не доказан как замена П09<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Нормы, выдача и ознакомление со смывающими средствами<\/td>\n<td style=\"text-align: left;\">11, 2.4, 6.1–6.2, 7.1–7.8, 8.1, приложение 1; 08, 7.3.5 и), 8.5; 12, 3.2.5<\/td>\n<td style=\"text-align: left;\">Специалист по ОТ, назначенный ответственный, руководитель подразделения, генеральный директор, КДП<\/td>\n<td style=\"text-align: left;\">Перечень, утверждённые нормы, трудовой договор, карточка, дозаторы<\/td>\n<td style=\"text-align: left;\">Перечень составляют разные роли; нормы должны попадать в договор, но передача в КДП не описана; основание расчёта норм не учитывает прямо оценку профессиональных рисков<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Назначение ответственных и хранение документов<\/td>\n<td style=\"text-align: left;\">03, 1.3–1.4; 06, 7.1, 11.4; 08, 7.1.1–7.1.7, 7.3.1–7.3.7, 12.1–12.6; 11, 8.1<\/td>\n<td style=\"text-align: left;\">Генеральный директор, специалист по ОТ, назначенные работники, подрядчик, руководитель КДП<\/td>\n<td style=\"text-align: left;\">Приказы, должностные инструкции; по встрече 11.11 подписанные комплекты из Диадока скачивают на сервер<\/td>\n<td style=\"text-align: left;\">Подрядчик в практике есть; 08 допускает делегирование, но конкретные приказы и договор не переданы. Decision Flow предлагается только как маршрут и журнал, не как юридическая подпись или установленная интеграция<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<ol>\n<li>Что именно является <code>формой на инструктаж<\/code> подрядчика и каким способом её подписывают?<\/li>\n<li>Кто и как проводит первичное ознакомление дистанционных работников с оборудованием?<\/li>\n<li>Есть ли приложение 1 к 03 и где подтверждения ежегодного/внеочередного ознакомления?<\/li>\n<li>Есть ли отдельные П09, П10 и положение о медосмотрах, названные в 08?<\/li>\n<li>Кто передаёт кадровое событие специалисту по ОТ при приёме, переводе и замене оборудования?<\/li>\n<li>Кто сейчас определяет категории работников для медосмотра, оформляет направление и получает итог допуска?<\/li>\n<li>Где действующие приказы о назначении ответственных по ОТ и договор внешнего исполнителя; кто замещает каждого?<\/li>\n<li>Были ли случаи расследования; кому выдавали акт и где подтверждение выдачи?<\/li>\n<li>Есть ли перечень и нормы смывающих средств, как обновляются при приёме/переводе и попадают ли в трудовые договоры?<\/li>\n<li>Есть ли коллективный договор или представительный орган работников, чьё мнение учитывали при ЛНА по ОТ?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li><strong>ТК ст. 76<\/strong> — нужен для законного отстранения от работы, последствий для допуска и оплаты; при медосмотрах и противопоказаниях его нельзя заменять общей фразой.<\/li>\n<li><strong>ТК ст. 220<\/strong> — нужен для правового основания обязательных медосмотров и связи с перечнями; в разрешённых базах группы этой нормы нет.<\/li>\n<li><strong>ТК ст. 223<\/strong> — нужен для медицинского обеспечения и первой помощи; полное содержание не найдено в разрешённых базах.<\/li>\n<li><strong>ТК ст. 230<\/strong> — есть в и использован; <strong>ТК ст. 231<\/strong> — нужен для споров и обжалования, но в базе отсутствует.<\/li>\n<li><strong>ПП РФ № 2464<\/strong> — 08 называет акт, но его полный текст и редакция в разрешённых базах отсутствуют; нужен для видов инструктажей, обучения, стажировки и проверки знаний.<\/li>\n<li><strong>Порядок медосмотров по приказу № 29н и психиатрических освидетельствований по приказу № 342н<\/strong> — 08 называет их, но тексты не переданы; нужны для определения категорий и сроков, а не для общих слов.<\/li>\n<li><strong>Порядок СИЗ и смывающих средств / единые Типовые нормы<\/strong> — ст. 221 есть, но полный подзаконный акт и актуальные нормы не переданы; нужны для проверки 11.<\/li>\n<li><strong>ТК ст. 231<\/strong> и <strong>Федеральный закон № 125‑ФЗ<\/strong> — нужны для обжалования и страховой части расследований; в рабочей базе полного регулирования для вывода нет.<\/li>\n<\/ul>", "keysy": [{"id": "К-OT-01", "slug": "OT-01", "title": "Форму инструктажа загружают в Диадок, но обычного кадрового ЭДО для неё недостаточно", "imp": "высокая", "docs": ["03", "08", "12"], "meta": [["Документы", "08, 8.4.3–8.4.4, 8.8.4; 03, 3.8, 3.20; 12, 2.13.3, 5.5–5.6"], ["Тип", "расходится с практикой: требуется проверка правового основания, не установленное нарушение"], ["Кто решает", "юристы и специалист по ОТ до утверждения; руководитель HR организует раздельные маршруты"], ["Важность", "высокая: в проверке нужен надлежащий документ о прохождении инструктажа, а не только файл в системе"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>08, п. 8.4.4: «Проверка знания требований охраны труда работников является неотъемлемой частью проведения инструктажа по охране труда и обучения по охране труда и направлена на определение качества знаний, усвоенных и приобретенных работником при инструктаже по охране труда и обучении по охране труда.»<\/li>\n<li>12, п. 5.6, фрагмент о документах: «осуществляется с помощью ЭДО путем проставления УКЭП работника, либо в письменной форме под подпись.»<\/li>\n<li>Практика по ответам HR 10.11, блок специалиста КДП, ВУ и ОТ: «есть компания на аутсорсе - форма на инструктаж, загрузка в Диадок».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Загрузка формы и подпись в Диадоке сами по себе не доказывают, что соблюдён специальный порядок оформления инструктажа. ТК исключает документы о прохождении инструктажей из общего режима кадрового ЭДО. Неизвестно, загружают ли бумажный оригинал, оформляют ли специальный электронный документ или называют инструктажем ознакомление дистанционного работника с оборудованием. Пока это вопрос для проверки, а не вывод о незаконном использовании Диадока.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.1 ч. 3, ред. от 25.05.2026: «Положения настоящей статьи и статей 22.2 и 22.3 настоящего Кодекса не применяются в отношении … акта о несчастном случае на производстве по установленной форме … документов, подтверждающих прохождение работником инструктажей по охране труда, в том числе лично подписываемых работником.» Порядка электронного оформления именно таких инструктажей в базе нет, проверить специалисту по ОТ и юристам. Это исключение само по себе не доказывает запрет любой электронной формы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 08 после 8.8.4 добавить:<\/p>\n<blockquote>\n<p>8.8.5. При организации документооборота разграничиваются ознакомление с локальными нормативными актами, ознакомление дистанционного работника с требованиями охраны труда при использовании оборудования и документы, подтверждающие прохождение обязательных инструктажей по охране труда. Документы, подтверждающие прохождение инструктажей, и акт о несчастном случае на производстве не оформляются исключительно на основании общего порядка кадрового электронного документооборота по статьям 22.1–22.3 Трудового кодекса Российской Федерации. Специалист по охране труда совместно с юридической службой определяет применимый порядок и форму их оформления. До подтверждения правового основания специального электронного оформления документы о прохождении инструктажей оформляются на бумажном носителе с предусмотренными подписями; электронная копия используется для учёта и контроля. Загрузка копии или отметка о выполнении задачи не заменяет надлежаще оформленного документа.<\/p>\n<\/blockquote>\n<p>В 12, 5.6, добавить в конце: Особенности оформления документов по охране труда определяются пунктом 8.8.5 Положения о СУОТ; общий порядок ЭДО не заменяет установленного специального порядка. Для 03, раздела 3, сначала определить вид действия, затем способ фиксации по кейсам <a href=\"#/k/OT-02\">К-OT-02<\/a>–03. Рекомендация — не отключать действующий канал вслепую, сначала проверить образец и основание, а для новых обязательных инструктажей обеспечить подтверждённый способ.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП и подрядчик предъявляют специалисту по ОТ и юристам обезличенный образец формы, исходный документ и способ подписания.<\/li>\n<li>Специалист отмечает вид действия и допустимый способ оформления; юристы подтверждают основание.<\/li>\n<li>КДП хранит надлежащий оригинал; Decision Flow, если внедрён, хранит статус и ссылку на него, но не подменяет подписи.<\/li>\n<li>Ответственный закрывает задачу только после проверки комплектности доказательств, не по одному факту загрузки файла.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Что именно называют формой на инструктаж: бумажный оригинал, документ о проведённом обязательном инструктаже или ознакомление дистанционного работника? Какое специальное основание используют?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Количество затронутых форм и фактическое время выгрузки неизвестны; штраф не начислялся, факт допуска без обучения не установлен.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в исключении из общего ЭДО; средняя в оценке практики — образец и правовое основание не предоставлены.<\/p>"}, {"id": "К-OT-02", "slug": "OT-02", "title": "Дистанционного работника предписано первично знакомить в специально оборудованном помещении", "imp": "средняя", "docs": ["03", "12", "13"], "meta": [["Документы", "03, 3.5–3.9; 12, 5.5–5.6; 13, 3.2.3"], ["Тип", "пробел: не предусмотрен дистанционный способ первичного ознакомления"], ["Кто решает", "руководитель HR и специалист по ОТ; юристы проверяют способ фиксации"], ["Важность", "средняя: либо лишний приезд, либо фактический порядок отличается от текста"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 3.5: «Первичное ознакомление проводит лицо, на которое приказом генерального директора возложены эти обязанности, в специально оборудованном помещении с использованием современных технических средств обучения и наглядных пособий (плакатов, презентаций).»<\/li>\n<li>03, п. 3.7: «Дистанционных работников ознакамливают с требованиями охраны труда при работе с оборудованием и средствами, рекомендованными или предоставленными организацией, а при необходимости, с дополнительными специальными требованиями безопасности и охраны труда.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Место описано как для очной процедуры, хотя работник дистанционный. Электронная отправка материалов после первичного ознакомления по 3.9 не заменяет способ его проведения. Не утверждаем, что компания действительно требует приезда: это выясняется у КДП.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.7, единственная часть, ред. от 25.05.2026: «…осуществляет ознакомление дистанционных работников с требованиями охраны труда при работе с оборудованием и средствами, рекомендованными или предоставленными работодателем.» ТК ст. 312.3 ч. 2 той же редакции допускает иную форму взаимодействия, «позволяющей обеспечить фиксацию факта получения работником и (или) работодателем документов в электронном виде». Норма не предписывает приезд в оборудованное помещение. Это не относится автоматически к обязательному инструктажу из <a href=\"#/k/OT-01\">К-OT-01<\/a>.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 03 заменить 3.5:<\/p>\n<blockquote>\n<p>3.5. Первичное ознакомление с требованиями охраны труда при использовании рекомендованных или предоставленных работодателем оборудования и средств проводит лицо, назначенное приказом генерального директора. Ознакомление может проводиться очно либо дистанционно с предоставлением материалов по используемому оборудованию и возможностью задать вопросы ответственному лицу. До начала использования оборудования фиксируются дата ознакомления, состав оборудования, редакция материалов, лицо, проводившее ознакомление, и подтверждение получения материалов работником в порядке пункта 3.20. Для прохождения обязательных инструктажей применяется отдельный установленный порядок; настоящее ознакомление его не заменяет.<\/p>\n<\/blockquote>\n<p>В 13 после 3.2.3 добавить 3.2.4 по <a href=\"#/k/OT-04\">К-OT-04<\/a>: выдача или замена техники запускает проверку необходимости ознакомления, а не только настройку доступов. ПВТР 5.5–5.6 не дают самостоятельного основания считать рассылку обязательным инструктажем.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП передаёт назначенному лицу событие приёма и сведения о формате работы; техническая служба — перечень техники.<\/li>\n<li>Ответственный проводит ознакомление до использования оборудования и отвечает на вопросы работника.<\/li>\n<li>Фиксируются подтверждение и версия материалов; способ записи согласуется по <a href=\"#/k/OT-01\">К-OT-01<\/a> и <a href=\"#/k/OT-03\">К-OT-03<\/a>.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как первично знакомят дистанционных сейчас: очно, по видеосвязи, рассылкой? Кто проводит и где хранится подтверждение?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет данных о числе приездов или затратах времени.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в чтении текста; средняя в влиянии на фактическую работу.<\/p>"}, {"id": "К-OT-03", "slug": "OT-03", "title": "Повторное ознакомление сводится к рассылке, а обещанного листа первичного ознакомления нет в копии", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "03, 3.8, 3.11–3.12, 3.14–3.20; 12, 5.5–5.6"], ["Тип", "пробел в фиксации результата и отсутствующее приложение"], ["Кто решает", "специалист по ОТ и руководитель HR; юристы подтверждают электронную форму"], ["Важность", "высокая: невозможно уверенно отличить отправленные материалы от полученных конкретным работником"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 3.8: «Регистрация первичного ознакомления дистанционных работников оформляется в листе ознакомления (примерная форма листа ознакомления Приложение № 1).»<\/li>\n<li>03, п. 3.20: «Периодическое и внеочередное ознакомление с требованиями охраны труда проводится путем предоставления дистанционным работникам методических материалов в электронном виде без регистрации в листах ознакомления (обмен документами в электронном виде при условии, если это оговорено трудовым договором).»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В переданной копии 03 после раздела 9 и строки разработчика следует страница электронных подписей; листа приложения 1 нет. Повторная рассылка может быть допустимой формой ознакомления, но пункт не определяет подтверждение получения и место хранения. Требование ежегодного ознакомления — уже принятое компанией правило по 3.11; его не отменяем и не называем обязательной ежегодной нормой закона.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.3 ч. 3, ред. от 25.05.2026: «При осуществлении взаимодействия дистанционного работника и работодателя путем обмена электронными документами каждая из осуществляющих взаимодействие сторон обязана направлять в форме электронного документа подтверждение получения электронного документа от другой стороны в срок, определенный коллективным договором, локальным нормативным актом, принимаемым с учетом мнения выборного органа первичной профсоюзной организации, трудовым договором, дополнительным соглашением к трудовому договору.» Часть 4 предусматривает отдельный порядок подтверждения для иной формы взаимодействия. Обязанность иметь именно бумажный лист повторного ознакомления из этой нормы не следует.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 03 заменить 3.8 и 3.20; приложить форму, а не только сослаться на неё:<\/p>\n<blockquote>\n<p>3.8. Первичное ознакомление регистрируется в листе ознакомления по приложению № 1 либо посредством согласованного электронного подтверждения в порядке пункта 3.20. В записи указываются работник, должность, дата, вид ознакомления, редакция материалов, оборудование и лицо, проводившее ознакомление. Форма и способ подтверждения выбираются с учётом вида документа и специальных требований законодательства.<\/p>\n<p>3.20. Периодическое и внеочередное ознакомление проводится посредством предоставления работнику соответствующих методических материалов и фиксации факта их получения. При электронном обмене используются порядок и сроки подтверждения, установленные ПВТР, трудовым договором или дополнительным соглашением. Ответственный сохраняет направленные материалы, сведения об их редакции и подтверждение работника в месте хранения документов по охране труда. Одна запись об отправке не является подтверждением получения. При отсутствии подтверждения руководитель структурного подразделения организует завершение ознакомления и уведомляет специалиста по охране труда. Обязательные инструктажи оформляются по специальным правилам и не заменяются настоящей рассылкой.<\/p>\n<\/blockquote>\n<p>Содержание приложения № 1: вид ознакомления; дата; работник и должность; материалы и их редакция; оборудование; проводившее лицо; подписи/сведения о допустимом подтверждении; место хранения доказательств. При наличии действующего листа у подрядчика — приложить его после сверки вместо создания конкурирующей формы. Срок повторного ознакомления по 3.11 и основания внеочередного по 3.14–3.18 сохранить.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Ответственный ведёт список дат следующего ознакомления и событий, требующих внеочередного ознакомления.<\/li>\n<li>Направляет конкретную редакцию материалов; работник подтверждает получение утверждённым способом.<\/li>\n<li>В журнале маршрута фиксируются полученное подтверждение и ссылка на документ; неподтверждённая рассылка остаётся открытой задачей.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельное приложение 1 и установленный порядок подтверждения для этих материалов? Не нужно ли только собрать разрозненный комплект?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Ежегодность взята из 03, 3.11, а не рассчитана как новый срок.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по переданному файлу и норме; наличие формы вне комплекта неизвестно.<\/p>"}, {"id": "К-OT-04", "slug": "OT-04", "title": "Между оформлением новичка и допуском к работе нет описанной передачи специалисту по ОТ", "imp": "высокая", "docs": ["03", "08", "11", "12", "13"], "meta": [["Документы", "12, 2.13–2.13.3; 13, 2.1–2.2, 3.2.1–3.2.3; 08, 7.3.5 к), 8.4; 03, раздел 3; 11, 2.4"], ["Тип", "пробел на стыке кадрового процесса и охраны труда"], ["Кто решает", "руководитель HR и специалист по ОТ; группа PRIEM согласует общий текст адаптации"], ["Важность", "высокая: вводная HR-презентация и выдача техники не равны необходимым мероприятиям по ОТ"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 2.13: «Перед допуском работника к исполнению обязанностей (выполнению работ), предусмотренных заключенным трудовым договором, Работодатель:»; п. 2.13.3: «Проводит инструктаж по правилам техники безопасности на рабочем месте, противопожарной безопасности и охране труда.»<\/li>\n<li>08, п. 7.3.5 к): «проводит вводный инструктаж по охране труда».<\/li>\n<li>13, п. 3.2.2: «Специалист по кадровому делопроизводству оформляет нового сотрудника в соответствии с ТК РФ, знакомит с внутренними документами под подпись.» Номер и текст сверены с.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 13 есть передача от HR к КДП и системному администратору, но нет передачи специалисту по ОТ и контрольного результата перед допуском. В 08 перечислены виды подготовки, но не указан источник кадрового события. Это разрыв описания, а не установленный факт отсутствия обучения: по ответам HR подрядчик и формы уже есть. Дистанционное ознакомление с оборудованием надо выделить из общего перечня, а не назначать всем одинаковые инструктажи и стажировку.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 214 ч. 3 абз. 15, ред. от 25.05.2026: «недопущение работников к исполнению ими трудовых обязанностей без прохождения в установленном порядке обучения по охране труда … инструктажа по охране труда, стажировки на рабочем месте (для определенных категорий работников) и проверки знания требований охраны труда, обязательных медицинских осмотров, обязательных псих
