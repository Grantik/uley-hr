rong><\/p>\n<p>ПВТР не даёт работнику двух рабочих дней на объяснение и не говорит, что срок объявления приказа не считает отсутствие работника. Нет проверки тяжести и обстоятельств и снятия взыскания. Главный риск в 9.3: по тексту акт об отказе можно составить сразу, до истечения двух рабочих дней. Пропуски в 9.4 и 9.6 сами по себе строже для работодателя, а не хуже для работника; закон действует и без их повторения, правка нужна, чтобы КДП не ошибся в процедуре. Неответ дистанционного работника за час не равен проступку или автоматическому увольнению; конкретное дело надо проверять (<a href=\"#/k/DISC-18\">К-DISC-18<\/a>).<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 192 (ред. 25.05.2026): «При наложении дисциплинарного взыскания должны учитываться тяжесть совершенного проступка и обстоятельства, при которых он был совершен». ТК ст. 193: «Если по истечении двух рабочих дней указанное объяснение работником не предоставлено, то составляется соответствующий акт»; взыскание применяется не позднее месяца с учётом болезни, отпуска и времени учёта мнения; приказ объявляется в три рабочих дня «не считая времени отсутствия работника на работе». ТК ст. 194: после года без нового взыскания работник считается не имеющим взыскания; его можно снять раньше.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Заменить 12 п. 9.3: «Работодатель затребует письменное объяснение с указанием события и срока. Если по истечении двух рабочих дней оно не представлено, КДП составляет акт. Заявление об отказе дать объяснение фиксируется, но не сокращает предоставленный законом двухдневный срок. Непредоставление объяснения не препятствует решению после соблюдения процедуры. До приказа проверяются событие, трудовая обязанность, вина, тяжесть, обстоятельства и сроки статьи 193 ТК РФ. За один проступок применяется одно дисциплинарное взыскание. КДП хранит объяснение, акты и материалы проверки».<\/p>\n<p>В 9.4 добавить исключаемое время учёта мнения представительного органа работников, когда это требуется; 9.5 дополнить отсылкой к полному применимому сроку и исключениям ч. 4 ст. 193, не оставлять прежний пересказ исчерпывающим. В 9.6: «Приказ объявляется под роспись в течение трёх рабочих дней со дня издания, не считая времени отсутствия работника на работе; отказ ознакомиться под роспись фиксируется актом». Добавить 9.11: «Если в течение года со дня применения взыскания работник не подвергнут новому взысканию, он считается не имеющим взыскания. До истечения года Работодатель вправе снять взыскание по собственной инициативе, просьбе работника, ходатайству руководителя или представительного органа работников. КДП отражает погашение или снятие в реестре и уведомляет участников, которым статус нужен для исполнения кадровых правил; автоматическое погашение не ставится в зависимость от отдельного приказа». Добавить 9.12: «Работник вправе обжаловать взыскание в государственную инспекцию труда и (или) органы по рассмотрению индивидуальных трудовых споров». В 4.7 записать, что фиксация отсутствия сама по себе не означает проступок. Пункт 9.10 и премии согласовать только с <a href=\"#/k/PLAT-07\">К-PLAT-07<\/a>, не снимать общим правилом уже заработанные выплаты.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель фиксирует событие и сообщает КДП. 2) КДП проверяет график, задачу, канал и получение. 3) Направляет запрос с двухдневным сроком. 4) После объяснения/акта проводится проверка. 5) Приказ и реестр сроков закрывают дело.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Кто направляет запрос; какой канал доказывает получение; кто проверяет вину; есть ли реестр взысканий?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: число дисциплинарных дел неизвестно. Оценка руководителя КДП по всем увольнениям — 30% времени (ответы HR 10.11), это не доля дисциплинарных увольнений и не экономия от данного кейса. Только условный перевод при 40-часовой неделе и 52 неделях: = 52,0 часа в месяц и 624,0 в год; команда расчёт программой.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая по пропущенным элементам и разделению невыхода/взыскания<\/p>"}, {"id": "К-DISC-08", "slug": "DISC-08", "title": "ПВТР допускает дежурства и критичные инциденты без порядка учёта и самого регламента", "imp": "средняя", "docs": ["02", "12"], "meta": [["Документы", "12: 4.3, 3.2.26, 5.13; 02: 3.7–3.8"], ["Тип", "пробел и ссылка на документ, которого нет в комплекте"], ["Кто решает", "руководитель HR; руководитель компании — режим/пороги; юристы"], ["Важность", "средняя: сроки и ответственные не видны работнику и КДП"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 4.3: «Для отдельных подразделений и должностей, начало работы определяется согласно графику дежурств, который размещается на Confluence (система ведения документации)».<\/li>\n<li>12, п. 3.2.26: «исключение составляют Работники, находящиеся на дежурстве или Работники, действующие в рамках отдельных регламентов и иных локальных нормативных актов Работодателя (например, «Регламент работы с критичными инцидентами»)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Названного регламента среди присланных ЛНА нет. П. 4.3 допускает суммированный учёт, но не назначает владельца графика, порядок изменения и источник табеля. Практика КДП говорит, что задачи живут в почте, а документ указывает Confluence/Jira; текущий маршрут надо спросить.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 104 ч. 4, ред. от 25.05.2026: «Порядок введения суммированного учета рабочего времени устанавливается правилами внутреннего трудового распорядка». Норма в базе есть; её отсутствие ранее было указано ошибочно. ТК ст. 312.3 ч. 9 той же редакции: «Порядок взаимодействия работодателя и работника, в том числе в связи с выполнением трудовой функции дистанционно, передачей результатов работы и отчетов о выполненной работе по запросам работодателя, устанавливается» ЛНА/договором. Конкретной нормы о названном регламенте нет. Режим и суммированный учёт полностью разобраны <a href=\"#/k/VREM-08\">К-VREM-08<\/a>/09; здесь только отсутствующая связь с регламентом и каналом.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо второго и третьего предложений 12.4.3: «Для подразделений и должностей с дежурствами график составляет руководитель подразделения на учётный период, проверяет КДП и публикует в системе из Матрицы каналов. Работник знакомится по Порядку ЭДО или на бумаге. Суммированный учёт вводится приказом для указанных категорий; ПВТР устанавливают порядок графика, изменения, ответственного за учёт и хранение табеля; учётный период не превышает допустимый ТК РФ». В 3.2.26 и 5.13 оставить иной срок только после приложения действующего регламента с номером, редакцией, владельцем и каналом; до этого убрать конкретный пример.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель формирует график. 2) КДП проверяет договоры и лимиты. 3) Работодатель утверждает приказ. 4) КДП знакомит работников. 5) Табель и инциденты получают общий журнал; ссылка обновляется во всех документах.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Кто работает по суммированному учёту; где график; существует ли регламент; кто дежурит; как табель получает часы?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: число работников и исправлений не установлено.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в отсутствии названного документа и неполноте 4.3; средняя в текущем маршруте<\/p>"}, {"id": "К-DISC-09", "slug": "DISC-09", "title": "Дистанционному работнику обещана УКЭП, но порядок расходов и личного оборудования не собран", "imp": "средняя", "docs": ["03", "12", "13"], "meta": [["Документы", "12: 5.4; 03: 2.13; 13: 2.1, 3.2.3"], ["Тип", "пробел"], ["Кто решает", "HR; бухгалтерия и юристы — расходы; ИТ — оборудование"], ["Важность", "средняя: сотрудник и КДП не видят маршрут оплаты, выдачи и возврата"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 5.4: «Все работники Общества, с которыми заключен трудовой договор или дополнительное соглашение к трудовому договору на выполнение дистанционной/частично дистанционной работы обязуются получить УКЭП».<\/li>\n<li>03, п. 2.13: «в) размер, порядок и сроки выплаты компенсации за использование дистанционными работниками принадлежащих им либо арендованных ими оборудования».<\/li>\n<li>13, п. 2.1: «создает задачу в Jira на получение техники».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>ПВТР требует подпись, но не говорит о расходах и варианте бумаги. 03 перечисляет компенсацию как условие, но порядок и размер в переданном пакете не найдены. Задача на технику не связана с актом, личным оборудованием и возвратом.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 22.2 ч. 12: «Работодатель несет расходы на получение работником электронной подписи (в случае ее отсутствия) и ее использование». ТК ст. 312.6 ч. 1–2 (ред. 25.05.2026): работодатель обеспечивает оборудование; при согласованном использовании оборудования работника выплачивает компенсацию и возмещает расходы по порядку в ЛНА/договоре. Текст добора не проверен юристом.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 12.5.4: «Работодатель обеспечивает необходимой для выбранного законного маршрута электронной подписью и несёт предусмотренные законом расходы. Отсутствие подписи само по себе не основание для отказа в приёме или увольнении; до подключения используется допустимое бумажное оформление». Для общего ЭДО обязанность расходов прямо установлена ст. 22.2 ч. 12; для отдельного дистанционного режима обеспечиваемую компанией подпись закрепить явно как предлагаемое обязательство, не приписывать этой статье автоматическое действие без решения по ст. 312.1 ч. 5. Допустимые виды подписи — <a href=\"#/k/DISC-12\">К-DISC-12<\/a>. В 03.2.13 и договоры добавить ссылку на утверждённый порядок оборудования/компенсации: выдача, акт, возврат, использование личного устройства с согласия или ведома работодателя и в его интересах, размер/формула, расходы на связь, сроки выплаты и защита данных. Одно отсутствие предварительной формы не отменяет проверку фактического ведома работодателя по 312.6. В 13, пп. 2.1/3.2.3, после подтверждения ИТ указать Матрицу каналов и связать заявку с актом; 2.1 уже допускает почту/иные утверждённые способы, Jira не единственный канал. Размеры/формулу и сроки должны утвердить уполномоченные лица до применения, здесь они не выдуманы.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП определяет режим и подпись. 2) ИТ создаёт заявку. 3) КДП фиксирует выдачу/возврат/личное устройство. 4) Бухгалтерия начисляет по основанию. 5) КДП проверяет подпись, не задерживая процесс.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Кто платит УКЭП; сколько личной техники; есть ли соглашения и акты; кто согласует расходы; где задача?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Обновление УКЭП: 3% времени; = 5,2 часа в месяц и 62,4 в год, расчёт программой. Компенсации не считали.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>высокая в пробеле расходов; средняя в практике оборудования<\/p>"}, {"id": "К-DISC-10", "slug": "DISC-10", "title": "Прямая величина ущерба не означает полную ответственность, а ответственность работодателя нельзя ограничить той же формулой", "imp": "высокая", "docs": ["04", "10", "12"], "meta": [["Документы", "12, пп. 3.2.22, 3.2.24, 9.1, 9.9, 10.1–10.4; 04, 9.5–9.6 — только связь; 10, 11.1–11.2"], ["Тип", "пробел в пределах ответственности; чрезмерно общая взаимная формула"], ["Кто решает", "юристы до утверждения; руководитель HR и КДП — исполнение"], ["Важность", "высокая: ПВТР не дают отличить обычный предел от специального основания полной ответственности"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.22: «работник обязан возместить работодателю причиненный ему прямой действительный ущерб»; далее: «работник несет материальную ответственность как за прямой действительный ущерб, так и за ущерб, возникший у Общества в результате возмещения им ущерба иным лицам».<\/li>\n<li>12, п. 10.4: «Работник и Работодатель возмещают друг другу только прямой действительный ущерб».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Прямой действительный ущерб — вид ущерба, а не разрешение взыскать всю сумму с любого работника. Возмещение работодателем вреда третьим лицам может входить в прямой ущерб по ст. 238: саму фразу 3.2.22 ошибкой не считаем. В ПВТР нет связи с пределом среднего месячного заработка и специальными основаниями полной ответственности; акт выдачи оборудования сам по себе не доказывает применимость договора полной ответственности. Взаимная формула 10.4 также не должна отменять денежную компенсацию работодателя за задержку выплат; её расчёт отдельно в <a href=\"#/k/PLAT-20\">К-PLAT-20<\/a>. Солидарная передача дел разобрана в <a href=\"#/k/DISC-06\">К-DISC-06<\/a>/<a href=\"#/k/OTP-12\">К-OTP-12<\/a>, здесь её повторно не переписываем.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 241, ТК, ред. от 25.05.2026: «За причиненный ущерб работник несет материальную ответственность в пределах своего среднего месячного заработка, если иное не предусмотрено настоящим Кодексом или иными федеральными законами». Ст. 242 ч. 2: «Материальная ответственность в полном размере причиненного ущерба может возлагаться на работника лишь в случаях, предусмотренных настоящим Кодексом или иными федеральными законами». Ст. 244 ч. 1: договоры могут заключаться «с работниками, достигшими возраста восемнадцати лет и непосредственно обслуживающими или использующими денежные, товарные ценности или иное имущество»; ч. 2 предусматривает утверждённые перечни работ и категорий и типовые формы. Ст. 243 ч. 1 содержит специальные случаи; п. 2 относится к недостаче вверенных ценностей, не ко всякому повреждению. Ст. 236 ч. 2: «Обязанность по выплате указанной денежной компенсации возникает независимо от наличия вины работодателя». Текстов ст. 239, 240, 246 и утверждённых перечней/форм по ст. 244 в разрешённых базах нет; без них проверка конкретного дела неполна. ТК ст. 8 ч. 4: «Нормы локальных нормативных актов, ухудшающие положение работников по сравнению с установленным трудовым законодательством» … «не подлежат применению»; поэтому буквальное чтение 10.4 не отменяет законную ответственность работодателя, но вводит работника и бухгалтерию в заблуждение.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>В 12 после 3.2.22 добавить: «Размер возмещения, пределы ответственности и порядок взыскания определяются трудовым законодательством и разделом 10 настоящих Правил. Упущенная выгода с работника не взыскивается».<\/p>\n<p>Вместо 10.4:<\/p>\n<blockquote>\n<p>10.4. Работодатель и работник несут материальную ответственность на основаниях, в пределах и в порядке, установленных ТК РФ и иными федеральными законами. Работник возмещает прямой действительный ущерб; по общему правилу его ответственность ограничена средним месячным заработком. Полная материальная ответственность применяется только при наличии предусмотренного законом основания, проверенного юристом до решения о взыскании. Получение оборудования или передача дел сами по себе не устанавливают полную или солидарную ответственность. Договор о полной материальной ответственности заключается только с работником, для которого допустимо его заключение по закону и действующим перечням; оформляет КДП после юридической проверки.\nОтветственность Работодателя перед Работником, в том числе за задержку выплат, не ограничивается правилами об ответственности Работника; предусмотренные законом компенсации сохраняются.<\/p>\n<\/blockquote>\n<p>Добавить 10.5–10.6 по <a href=\"#/k/DISC-11\">К-DISC-11<\/a>. В 9.9 сохранить различие видов ответственности: дисциплинарное взыскание не заменяет отдельного основания взыскания ущерба. В 04 не менять режим тайны; владельцу документа передать требование сверить кадровую связь 9.5–9.6 с новым разделом 10. Правки зарплатных удержаний 10, п. 10.10 — <a href=\"#/k/PLAT-03\">К-PLAT-03<\/a>/13; такси — <a href=\"#/k/KOM-12\">К-KOM-12<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель передаёт сведения о событии, а не готовую сумму удержания. 2) Юрист проверяет основание, исключающие обстоятельства, категорию работника и договор; КДП прилагает акт выдачи и ознакомление. 3) Расчёт и проверка по <a href=\"#/k/DISC-11\">К-DISC-11<\/a> оформляются отдельно. 4) В Decision Flow предлагается журнал основания и решения; полное возмещение не выбирается автоматически по наличию акта оборудования.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли договоры полной ответственности и действующий перечень работ/категорий? Варианты: есть с основанием / есть без проверенной связи с перечнем / нет / требуется поиск у юристов. Были ли взыскания сверх среднего заработка?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: сведения о частоте случаев, суммах и трудозатратах не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по различию вида ущерба и предела; средняя по применимости конкретных договоров — они и перечни не представлены.<\/p>"}, {"id": "К-DISC-11", "slug": "DISC-11", "title": "От установления ущерба до взыскания нет единого маршрута с проверкой, сроком и правом работника на материалы", "imp": "высокая", "docs": ["04", "10", "12", "15"], "meta": [["Документы", "12, пп. 9.1, 9.9, 10.1–10.4; 04, 8.7, 9.5–9.6 — связь; 10, 10.10; 15, 2.6"], ["Тип", "пробел: не собраны исполнители и порядок возмещения"], ["Кто решает", "юристы — законный способ взыскания; работодатель — решение; КДП и бухгалтерия — оформление"], ["Важность", "высокая: внутреннее признание вины или акт не являются готовым основанием любого удержания"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 10.1: «Ответственность сторон предусмотрена Трудовым кодексом Российской Федерации».<\/li>\n<li>12, п. 9.9: «Применение дисциплинарного взыскания не освобождает работника, совершившего проступок, от материальной и административной ответственности, предусмотренной действующим законодательством и трудовым договором».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Общая ссылка на ТК правильная, но работнику и КДП не показывает, кто проверяет размер и причину, получает объяснение и предоставляет материалы. В документе о тайне 04 уже есть комиссия и добровольное возмещение; такой специальный маршрут нельзя считать универсальным для любой поломки или поездки. Нельзя приравнивать отказ дать объяснение к согласию с долгом или автоматически требовать согласие работника для всякого распоряжения в пределах среднего заработка. Удержания и такси переданы <a href=\"#/k/PLAT-13\">К-PLAT-13<\/a> и <a href=\"#/k/KOM-12\">К-KOM-12<\/a>; здесь общий кадровый порядок, которого они ожидают от DISC.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК, ред. от 25.05.2026: ст. 247 ч. 1 — «До принятия решения о возмещении ущерба конкретными работниками работодатель обязан провести проверку для установления размера причиненного ущерба и причин его возникновения»; ч. 2 — «Истребование от работника письменного объяснения для установления причины возникновения ущерба является обязательным»; ч. 3 даёт работнику и представителю доступ ко всем материалам проверки и обжалование. Ст. 248 ч. 1: «Распоряжение может быть сделано не позднее одного месяца со дня окончательного установления работодателем размера причиненного работником ущерба». Ч. 2: «Если месячный срок истек или работник не согласен добровольно возместить причиненный работодателю ущерб, а сумма причиненного ущерба, подлежащая взысканию с работника, превышает его средний месячный заработок, то взыскание может осуществляться только судом». Ч. 4 допускает добровольное полное/частичное возмещение и рассрочку с письменным обязательством; ч. 5 — равноценное имущество или исправление с согласия работодателя. Ст. 239, 240, 246 отсутствуют; норму ст. 248 нельзя заменять произвольным правилом о любом споре.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Добавить в 12 после новой 10.4:<\/p>\n<blockquote>\n<p>10.5. До решения о возмещении ущерба Работодатель назначает проверку, при необходимости создаёт комиссию с участием специалистов. КДП затребует письменное объяснение; при отказе или уклонении составляется акт. Проверка устанавливает размер и причину ущерба, участие и вину конкретного работника, учитывает обстоятельства, исключающие ответственность, и законные пределы. Работник и его представитель вправе знакомиться со всеми материалами и обжаловать их. Дата окончательного установления размера фиксируется в материалах проверки.\n10.6. До взыскания юрист проверяет материалы, основания и соблюдение сроков. Взыскание суммы не свыше среднего месячного заработка по распоряжению Работодателя осуществляется в пределах срока части первой статьи 248 ТК РФ. При наличии условий части второй статьи 248 ТК РФ взыскание возможно только через суд. Добровольное возмещение, в том числе рассрочка, оформляется отдельно, без принуждения; при рассрочке Работник представляет письменное обязательство с конкретными сроками. Передача равноценного имущества или исправление повреждённого допускаются с согласия Работодателя. Бухгалтерия удерживает суммы только на надлежащем основании с соблюдением законных ограничений.<\/p>\n<\/blockquote>\n<p>В 10, п. 10.10 добавить отсылку к этому порядку совместно с PLAT, не переносить формулу о любом заявлении как достаточном основании. В 04, 9.5–9.6 и 15, 2.6 владельцам согласовать ссылки, но не переписывать здесь режим тайны и правила такси. До получения ст. 239, 240, 246 и норм об удержаниях это организационный проект, не готовый контрольный лист расчёта.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель регистрирует событие и материалы у КДП. 2) Работодатель назначает проверку; КДП запрашивает объяснение и обеспечивает доступ к материалам. 3) Расчёт специалиста и средний заработок бухгалтерии юрист сверяет с законными пределами и сроком. 4) Работодатель оформляет выбранный законный способ; Decision Flow лишь ведёт даты и статус. 5) Бухгалтерия исполняет основание; непогашенный долг не задерживает документы и расчёт при увольнении (<a href=\"#/k/PRIEM-13\">К-PRIEM-13<\/a>/14).<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Кто сейчас назначает проверку и фиксирует окончательное установление суммы? Варианты: единый порядок / разные комиссии по виду события / каждый случай согласуют заново / случаев не было. Где хранится доступный работнику комплект?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: сведения о частоте случаев, суммах и трудозатратах не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по содержанию ст. 247–248 и отсутствию общего маршрута в ПВТР; фактических неправомерных удержаний не установлено.<\/p>"}, {"id": "К-DISC-12", "slug": "DISC-12", "title": "Раздел 2 документа 03 ссылается на части статей, которые в действующей редакции говорят о другом, и смешивает виды электронной подписи", "imp": "средняя", "docs": ["03", "12"], "meta": [["Документы", "03, пп. 2.5–2.8, 2.12–2.13, 2.18–2.19; 12, 1.3, 2.5, 2.15, 5.4–5.7"], ["Тип", "устаревшие ссылки на нормы; неполное разграничение электронного обмена"], ["Кто решает", "юристы и руководитель HR; перенос раздела — только совместно с владельцем ОТ"], ["Важность", "средняя: юрист и КДП попадают по ссылке не в нужную часть действующей статьи"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 2.5: «Из части 4 статьи 312.1 ТК РФ следует, что взаимодействие между работодателем и дистанционным работником может осуществляться путем обмена электронными документами».<\/li>\n<li>03, п. 2.7: «они должны использовать усиленные квалифицированные электронные подписи»; основанием названа «часть 4 статьи 312.1 ТК РФ».<\/li>\n<li>03, п. 2.6: ссылка «часть 6 статьи 312.1 ТК РФ» при заявлении и объяснении.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>В действующей базе ст. 312.1 ч. 4 говорит о распространении трудового законодательства, частей 6–8 в ней нет вовсе (пять частей; у ст. 312.2 шесть частей, поэтому ссылки 03 на её ч. 7–8 тоже ведут в пустоту; команда расчёт программой), а нужный порядок взаимодействия находится в ст. 312.3. Для договоров из ч. 1 ст. 312.3 работнику допустима также усиленная неквалифицированная подпись; для иных действий закон допускает другие подписи и формы при соблюдении условий. Это не значит, что собственное требование УКЭП автоматически незаконно или все письма равны подписанному договору. Главный риск — применять ошибочные ссылки как действующую инструкцию; расходы и общий ЭДО уже разобраны <a href=\"#/k/DISC-01\">К-DISC-01<\/a>/09, подтверждение получения — <a href=\"#/k/DISC-03\">К-DISC-03<\/a>.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК, ред. от 25.05.2026: ст. 312.1 ч. 4 — «На дистанционных работников в период выполнения ими трудовой функции дистанционно распространяется действие трудового законодательства и иных актов, содержащих нормы трудового права, с учетом особенностей, установленных настоящей главой». Ст. 312.3 ч. 1 для перечисленных договоров: «используются усиленная квалифицированная электронная подпись работодателя и усиленная квалифицированная электронная подпись или усиленная неквалифицированная электронная подпись работника». Ч. 2 для иных случаев допускает другую подпись/форму при установлении её в ЛНА/договоре и фиксации получения; ч. 5–7 — ознакомление, заявления/объяснения и копии, ч. 8 — страховое обеспечение, ч. 9 — порядок взаимодействия. Историю изменения закона по памяти не восстанавливаем: несоответствие номеров видно из действующего текста базы.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Кадровые правила 03, пп. 2.5–2.13, 2.16–2.19 предлагается держать в разделе 5 ПВТР/Порядке дистанционного взаимодействия: иначе кадровый обмен остаётся внутри объёмного документа ОТ и дублируется. Перенос оформить одновременно с ОТ; разделы ОТ не удалять.<\/p>\n<p>Вместо 03, пп. 2.5–2.8 после такого переноса:<\/p>\n<blockquote>\n<p>2.5. Кадровое взаимодействие с дистанционным работником осуществляется по разделу 5 ПВТР и Порядку электронного документооборота в применимом правовом режиме. При заключении и изменении в электронном виде договоров, указанных в части первой статьи 312.3 ТК РФ, используются УКЭП Работодателя и УКЭП либо УНЭП работника в соответствии с законодательством об электронной подписи. Иные подписи и формы взаимодействия допускаются только в случаях и на условиях, установленных законом и утверждённым порядком.\n2.6. Ознакомление, заявления, объяснения, выдача копий и подтверждение получения оформляются по отдельным видам действий; направление обычного письма само по себе не считается подписью.\n2.7. Подтверждение получения осуществляется обеими сторонами в сроки пункта 5.12 ПВТР. Правила работы с электронным документом не изменяют специальных требований закона к конкретному документу.\n2.8. Ссылки на кадровые правила в настоящем Положении не заменяют проведение и оформление мероприятий по охране труда.<\/p>\n<\/blockquote>\n<p>В 03, 2.12–2.13 убрать ссылки на ч. 8 ст. 312.2 и ч. 1 ст. 312.3 (в действующей базе ч. 8 у ст. 312.2 нет, а ч. 1 ст. 312.3 говорит о подписях): условия об оборудовании и компенсации связать со ст. 312.6 ч. 1–2, отчёты и порядок взаимодействия — со ст. 312.3 ч. 9, с учётом того, что закон допускает их установление не только договором, но и ЛНА; 2.19 — на 312.3 ч. 7. Правки 2.9–2.11, 2.16–2.18 даны в <a href=\"#/k/DISC-13\">К-DISC-13<\/a>–15. Матрицу подписей утвердить вместе с <a href=\"#/k/DISC-01\">К-DISC-01<\/a>, не объявлять УНЭП внедрённой до проверки системы и соглашений. Строгий УКЭП-маршрут можно сохранить осознанно, если он обеспечен работодателем; это вариант, а не обязанность перейти на УНЭП.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Юрист проверяет вид договора/документа и применимый режим. 2) ИТ подтверждает фактически поддерживаемую подпись, КДП — возможность бумажного оформления. 3) HR совместно с ОТ готовит единые ссылки и таблицу изменений. 4) После утверждения КДП использует новый маршрут и хранит документ с подписью, а не только изображение.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Какой вариант нужен: сохранить обеспечиваемую УКЭП / допустить УНЭП для указанных договоров после проверки / вопрос ещё не решён? Есть ли отдельный Порядок дистанционного взаимодействия?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: сведения о частоте случаев, суммах и трудозатратах не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по неверным номерам частей; средняя по выбору допустимой фактической подписи — настройки и соглашения не представлены.<\/p>"}, {"id": "К-DISC-13", "slug": "DISC-13", "title": "Документ 03 требует бумажный договор всегда, ПВТР исключают бумагу, а закон связывает выдачу с заявлением", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "03, п. 2.9 подп. «б»; 12, пп. 2.5, 2.15"], ["Тип", "противоречие документов; устаревшее условие бумажного обмена"], ["Кто решает", "руководитель HR и КДП; юристы до изменения обязательства"], ["Важность", "высокая: можно отправлять лишние письма и одновременно не исполнить конкретное заявление работника"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 2.9 подп. «б»: «не позднее трех календарных дней со дня заключения в электронной форме трудового договора работодатель обязан направить дистанционному работнику по почте заказным письмом с уведомлением оформленный надлежащим образом экземпляр данного трудового договора на бумажном носителе».<\/li>\n<li>12, п. 2.5: «в этом случае вышеуказанный в настоящем пункте порядок оформления, передачи работнику и хранения экземпляров трудового договора на бумажном носителе не применяется».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Два ЛНА дают КДП противоположные указания. Безусловную бумажную отправку компания вправе сохранить как своё обязательство, но нельзя выдавать её за действующую формулировку закона; общая оговорка ПВТР не отменяет право работника запросить бумажный экземпляр. Допсоглашение тоже входит в действующее правило. Практика отправки договоров в материалах не описана; действующий более благоприятный порядок не отменяем задним числом.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 312.2 ч. 2, ред. от 25.05.2026: «По письменному заявлению дистанционного работника работодатель не позднее трех рабочих дней со дня получения такого заявления обязан направить дистанционному работнику оформленный надлежащим образом экземпляр трудового договора или дополнительного соглашения к трудовому договору на бумажном носителе». Это рабочие, не календарные дни, и начало срока связано с заявлением. Норма о бумажной копии приказа об увольнении иная — <a href=\"#/k/DISC-02\">К-DISC-02<\/a>/<a href=\"#/k/PRIEM-23\">К-PRIEM-23<\/a>; её не отменяем.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Рекомендация — единый маршрут заявления, если HR и юристы после проверки действующих договоров решат отказаться от безусловной отправки. Альтернатива — сохранить автоматическую бумажную отправку как дополнительную гарантию компании и указать это прямо. Ни один вариант не отменяет право по ст. 312.2 ч. 2.<\/p>\n<p>При выборе маршрута заявления заменить 03, п. 2.9 подп. «б»:<\/p>\n<blockquote>\n<p>б) По письменному заявлению дистанционного работника КДП не позднее трёх рабочих дней со дня получения заявления направляет надлежаще оформленный экземпляр трудового договора либо дополнительного соглашения на бумажном носителе. КДП регистрирует заявление и сохраняет подтверждение направления.<\/p>\n<\/blockquote>\n<p>В 12, пп. 2.5 и 2.15 после исключения обычного бумажного порядка добавить:<\/p>\n<blockquote>\n<p>Исключение бумажного порядка при электронном заключении не ограничивает выдачу бумажного экземпляра по письменному заявлению дистанционного работника в порядке части второй статьи 312.2 ТК РФ. Заявление регистрирует КДП; срок направления — не позднее трёх рабочих дней со дня его получения.<\/p>\n<\/blockquote>\n<p>Канал кадрового заявления — <a href=\"#/k/DISC-01\">К-DISC-01<\/a>/03; способ почтовой доставки сверх требования закона компания выбирает явно. До одновременного утверждения правок не объявлять действующее обязательство 03 отменённым.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП получает и регистрирует заявление с видом документа. 2) Проверяет электронный подлинник и готовит бумажный экземпляр. 3) Направляет в законный срок и сохраняет подтверждение в кадровом архиве. 4) Decision Flow предлагается как контроль даты заявления и исполнения; подписывание договора повторно не запускается.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Как сейчас отправляют бумажный договор: всегда / по заявлению / не отправляют / неизвестно? Есть ли аналогичные обязательства в индивидуальных договорах; какой вариант HR рекомендует оставить?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём случаев и стоимость не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по противоречию и норме; средняя по последствиям изменения дополнительной гарантии без договоров.<\/p>"}, {"id": "К-DISC-14", "slug": "DISC-14", "title": "Документ 03 считает договор основным документом о стаже и описывает соглашение о трудовой книжке, которого нет в действующей ч. 6 ст. 312.2", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "03, пп. 2.9 подп. «г», 2.10–2.11; 12, пп. 2.2–2.3, 2.14"], ["Тип", "устаревшие кадровые правила; противоречие с действующей нормой базы"], ["Кто решает", "юристы и КДП; общие документы приёма — группа PRIEM"], ["Важность", "высокая: новичку могут выдать неверную инструкцию о трудовой книжке и подтверждении стажа"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 2.10: «по соглашению сторон трудового договора о дистанционной работе сведения о дистанционной работе могут не вноситься в трудовую книжку дистанционного работника»; далее: «основным документом о трудовой деятельности и трудовом стаже дистанционного работника является экземпляр трудового договора о дистанционной работе».<\/li>\n<li>03, п. 2.11: «При отсутствии такого соглашения дистанционный работник должен представить работодателю трудовую книжку лично или направить ее по почте заказным письмом с уведомлением».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>В действующей ст. 312.2 ч. 6 база говорит о желании работника и предоставлении книжки, а не о соглашении, делающем договор универсальным документом стажа. Нельзя из 03 выводить освобождение работодателя от формирования сведений о трудовой деятельности. В 2.9 подп. «г» осталось название страхового свидетельства вместо действующей формулировки документа о регистрации. Общее переименование и порядок приёма уже у <a href=\"#/k/PRIEM-17\">К-PRIEM-17<\/a>; здесь исправляется только отдельная инструкция для дистанционных. Полных ст. 66–66.1 в базе нет, поэтому детальный порядок книжек не сочиняем.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 312.2 ч. 6, ред. от 25.05.2026: «По желанию дистанционного работника сведения о его трудовой деятельности вносятся работодателем в трудовую книжку дистанционного работника при условии ее предоставления им, в том числе путем направления по почте заказным письмом с уведомлением (за исключением случаев, если в соответствии с настоящим Кодексом, иным федеральным законом трудовая книжка на работника не ведется)». Ч. 4: впервые заключающий договор при электронном обмене получает «документ, подтверждающий регистрацию в системе индивидуального (персонифицированного) учета, в том числе в форме электронного документа, самостоятельно». Полных ст. 66, 66.1 в разрешённых базах нет; сведения/сроки отчётности проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 03, пп. 2.10–2.11:<\/p>\n<blockquote>\n<p>2.10. По желанию дистанционного работника и при предоставлении им трудовой книжки Работодатель вносит сведения о трудовой деятельности в порядке части шестой статьи 312.2 ТК РФ, кроме случаев, когда книжка на работника по закону не ведётся. Книжка может быть предоставлена лично либо по почте заказным письмом с уведомлением.\n2.11. КДП до оформления определяет применимый порядок ведения книжки и сведений о трудовой деятельности по действующему законодательству и документам Работника. Договор о дистанционной работе сам по себе не отменяет обязанности Работодателя по оформлению сведений о трудовой деятельности.<\/p>\n<\/blockquote>\n<p>В 03, п. 2.9 подп. «г» заменить предложение:<\/p>\n<blockquote>\n<p>При электронном заключении трудового договора впервые поступающий на работу получает документ о регистрации в системе индивидуального (персонифицированного) учёта самостоятельно в соответствии с частью четвёртой статьи 312.2 ТК РФ.<\/p>\n<\/blockquote>\n<p>В 12, 2.14 сохранить отдельно установленное правило для дистанционных и отсылку к действующему закону; общие правки 2.2–2.3 согласовать с <a href=\"#/k/PRIEM-17\">К-PRIEM-17<\/a>. Не требовать бумажную книжку от лица, для которого она не ведётся.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП до договора проверяет документы и применимый книжный/электронный маршрут. 2) Получает желание работника и книжку там, где это применимо. 3) Делает запись и оформляет сведения по проверенным правилам; в журнале — основание и место хранения. 4) Документ 03 больше не выдаётся как самостоятельная инструкция о стаже.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли у КДП действующий шаблон для дистанционных и используют ли в нём правила 2.10–2.11? Варианты: применяется буквально / отдельно исправлен / не используется / надо проверить.<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём случаев и стоимость не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по несовпадению с 312.2; ограниченная по полному порядку сведений — ст. 66–66.1 не представлены.<\/p>"}, {"id": "К-DISC-15", "slug": "DISC-15", "title": "Документ 03 безусловно требует почтовые оригиналы для страхового обеспечения, не показывая электронную ветвь", "imp": "средняя", "docs": ["03", "12"], "meta": [["Документы", "03, п. 2.18; 12, пп. 4.23, 6.6; 03, 2.19 — связь с выдачей копий"], ["Тип", "устаревшая ссылка и неполный маршрут документов"], ["Кто решает", "КДП и бухгалтерия; юристы проверяют актуальное страховое обеспечение"], ["Важность", "средняя: КДП может запросить лишнюю бумагу по общей инструкции"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 2.18: «На основании части 7 статьи 312.1 ТК РФ для предоставления обязательного страхового обеспечения»; далее: «дистанционный работник должен направить работодателю оригиналы документов» и «по почте заказным письмом с уведомлением».<\/li>\n<li>12, п. 6.6: «Оплата больничного листа производится в соответствии с Трудовым законодательством Российской Федерации».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Указанной части 7 в действующей ст. 312.1 нет: в статье пять частей (расчёт программой). Аналогичное правило в действующей базе содержится в 312.3 ч. 8 и включает альтернативу сведений электронного листка при названных в ней условиях. Это не доказательство, что КДП на деле требует бумагу: практика пособий не описана. Нельзя на основании одной статьи ТК обещать полную актуальность страхового маршрута — профильные нормы и настройки обмена здесь не получены. Болезнь во время отпуска отдельно у <a href=\"#/k/OTP-22\">К-OTP-22<\/a>; общая инструкция о страховых документах не должна её дублировать.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 312.3 ч. 8, ред. от 25.05.2026: дистанционный работник направляет оригиналы предусмотренных актами документов по почте «либо представляет работодателю сведения о серии и номере листка нетрудоспособности, сформированного медицинской организацией в форме электронного документа», при названном в части условии участия медицинской организации и работодателя в системе информационного взаимодействия. Это точный текст имеющейся базы, не подтверждение актуальности всех страховых процедур. Профильных норм об обязательном социальном страховании и полном электронном обмене в разрешённых базах нет — проверить юристам и бухгалтерии.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 03, п. 2.18:<\/p>\n<blockquote>\n<p>2.18. Документы и сведения для обязательного страхового обеспечения предоставляются по действующему законодательству; порядок взаимодействия дистанционного работника и Работодателя в этой части определяется частью восьмой статьи 312.3 ТК РФ и применимыми специальными нормами. КДП совместно с бухгалтерией определяет, какие сведения уже получены в установленном электронном обмене и какие документы закон требует от Работника. Почтовые оригиналы запрашиваются только для документов, для которых это требуется; общий запрос всех оригиналов не применяется вместо проверки электронного маршрута. Работнику сообщается конкретный необходимый документ или сведение и законный способ предоставления.<\/p>\n<\/blockquote>\n<p>До проверки профильных норм не заполнять перечень документов и сроков по памяти. В 12, 4.23 правило уведомления о невыходе сохранить, но дополнить: «Способ подтверждения нетрудоспособности определяется применимым законодательством; наличие электронных сведений проверяют КДП и бухгалтерия». Пункт 6.6 не менять на собственный пересказ расчёта пособия. В 03, 2.19 сохранить три рабочих дня для копий и исправить ссылку на 312.3 ч. 7 по <a href=\"#/k/DISC-12\">К-DISC-12<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Работник уведомляет о невыходе по установленному каналу. 2) КДП и бухгалтерия проверяют имеющиеся электронные сведения. 3) Если закон требует документ, КДП сообщает конкретное требование и способ. 4) В Decision Flow предлагается только дата и статус достаточности; медицинские документы — в ограниченном кадровом архиве.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Какой обмен с системой страхового обеспечения действует и какие оригиналы сейчас реально запрашивают? Варианты: электронный маршрут / смешанный / только бумага / требуется проверка бухгалтерии.<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём случаев и стоимость не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по неверной ссылке и наличию альтернативы в базе; средняя по текущим страховым правилам без профильного закона.<\/p>"}, {"id": "К-DISC-16", "slug": "DISC-16", "title": "Режим и вызов дистанционного работника регулируются разными документами, а выезд в другую местность не связан с командировкой", "imp": "высокая", "docs": ["03", "12", "14"], "meta": [["Документы", "03, пп. 2.16–2.17; 12, пп. 4.2, 5.1–5.3, 5.10, 5.13–5.14; 14, раздел 2"], ["Тип", "противоречие между ЛНА; пробел маршрута вызова"], ["Кто решает", "руководитель HR и юристы; работодатель и работник в предусмотренных законом формах; руководитель инициирует вызов"], ["Важность", "высокая: одна сторона может считать день свободно организованным, другая — обязательной явкой в офис"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 2.16: «режим рабочего времени и времени отдыха дистанционного работника устанавливается им по своему усмотрению, если иное не предусмотрено трудовым договором о дистанционной работе».<\/li>\n<li>12, п. 5.2: «порядок чередования периодов дистанционной работы с периодами выполнения трудовой функции на стационарном рабочем месте определяется Приказом работодателя».<\/li>\n<li>12, п. 5.14: «При производственной необходимости Общество вправе вызвать работника, выполняющего дистанционную работу временно, для выполнения им трудовой функции на стационарном месте».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Пункт 03, 2.16 учитывает только договор, хотя действующая ст. 312.4 учитывает также ЛНА и коллективный договор; ПВТР уже задают общий режим с договорными исключениями. Приказ о чередовании не должен противоречить согласованным условиям, а производственная необходимость не превращает постоянную дистанционную работу во временную. Сроки 5.14 привязаны к региону, но командировка по 312.6 ч. 3 — к другой местности, это разные критерии. Учёт обязательных встреч и время сверх режима — <a href=\"#/k/VREM-10\">К-VREM-10<\/a>, отпускной порядок — OTP; здесь только единый режим и кадровый маршрут вызова. Фактических незаконных вызовов не установлено.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК, ред. от 25.05.2026: ст. 312.4 ч. 1 позволяет определять режим коллективным договором, ЛНА, трудовым договором и допсоглашением; ч. 2 — «Если иное не предусмотрено коллективным договором, локальным нормативным актом» или договором/допсоглашением, режим устанавливается работником по своему усмотрению. Ч. 3 допускает условия и порядок вызова временно дистанционного работника. Ст. 312.6 ч. 3: «В случае направления работодателем дистанционного работника для выполнения служебного поручения в другую местность (на другую территорию), отличную от местности (территории) выполнения трудовой функции, на дистанционного работника распространяется действие статей 166 – 168 настоящего Кодекса». Ст. 72 — изменение договорных условий по письменному соглашению, кроме предусмотренных Кодексом случаев. Ст. 312.9 ч. 1–5 устанавливает отдельный исключительный перевод по ЛНА, а не по обычной производственной необходимости.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 03, п. 2.16:<\/p>\n<blockquote>\n<p>2.16. Режим рабочего времени дистанционного работника определяется применимыми условиями ПВТР, коллективного договора при его наличии, трудового договора и дополнительного соглашения в соответствии со статьёй 312.4 ТК РФ. Если режим ими не установлен, Работник определяет его по своему усмотрению. Время обязательного взаимодействия с Работодателем включается в рабочее время и подлежит учёту.<\/p>\n<\/blockquote>\n<p>В 12, п. 5.2 добавить:<\/p>\n<blockquote>\n<p>Приказ о периодичности и чередовании периодов должен соответствовать условиям трудового договора и применимых ЛНА. Изменение договорных условий оформляется в установленном законом порядке; приказ сам по себе не изменяет трудовой договор.<\/p>\n<\/blockquote>\n<p>В 12, п. 5.14 добавить после действующих сроков:<\/p>\n<blockquote>\n<p>До направления вызова руководитель передаёт КДП основание, дату, место, срок работы и сведения о месте выполнения дистанционной работы. КДП проверяет, относится ли Работник к временно дистанционным, применимые договорные условия и необходимость оформления командировки по части третьей статьи 312.6 ТК РФ. Различие регионов само по себе не определяет командировку. При подтверждении необходимости КДП запускает Регламент 14 до поездки; уведомление о вызове не заменяет его документы. Вызов доводится по установленному каналу с фиксацией получения.<\/p>\n<\/blockquote>\n<p>Сроки уведомления 5.14 не сокращать; канал обновляется по <a href=\"#/k/DISC-04\">К-DISC-04<\/a>. В 03, 2.17 дать ссылку на раздел отпусков ПВТР с учётом 312.4 ч. 4–5, вместе с OTP. Исключительный перевод по 312.9 оформить отдельным ЛНА при возникновении предусмотренных обстоятельств: основание, круг переводимых работников, срок, оборудование/компенсации, организация труда и подтверждение получения. Обычным приказом о гибридном графике этот ЛНА не заменять. При отсутствии технической возможности отдельно проверить ч. 7 ст. 312.9; норму о простое и оплате не подменять отсутствующей здесь полной ст. 157.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель создаёт заявку на вызов с местом и задачей. 2) КДП проверяет договор, формат и режим, бухгалтерия/КДП — командировочную ветвь. 3) Работодатель оформляет необходимые документы, работник получает уведомление в сохранённый срок. 4) Участие и поездка учитываются по VREM/KOM, а не как бесплатная обязательная явка. 5) Результат и подтверждение получения хранятся в журнале; автоматическая интеграция не предполагается.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Какие режимы есть в договорах и где установлен гибридный график: договор / ПВТР и приказ / только приказ / разные варианты? Откуда фактически вызывают и оформляют ли поездки как командировки?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём случаев и стоимость не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по текстовому расхождению и критерию другой местности; средняя по применимости конкретного вызова без договора.<\/p>"}, {"id": "К-DISC-17", "slug": "DISC-17", "title": "Пустой лист относится к приказу, а доказательства ознакомления с самими ПВТР не собраны в переданной копии", "imp": "высокая", "docs": ["12", "13"], "meta": [["Документы", "12, приказ п. 3 и стр. 2, пп. 2.10, 5.5–5.6, 13.5–13.8; блок ЭДО стр. 16; 13, 3.2.2 — связь"], ["Тип", "пробел в подтверждении ознакомления; неоднозначный электронный способ"], ["Кто решает", "руководитель КДП — архив и охват; HR — маршрут; юристы — допустимая форма"], ["Важность", "высокая: отправка пакета и подпись отправителя не показывают, кто ознакомился с конкретной редакцией"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, стр. 2: «С приказом № 29/2022 от 03.11.2022 г. ознакомлены:». Лист в переданной копии пуст; изображение просмотрено.<\/li>\n<li>12, п. 13.5: «С правилами внутреннего трудового распорядка должны быть ознакомлены все работники Общества».<\/li>\n<li>12, п. 5.5: «осуществляется путем рассылки информации по официальным служебным адресам электронной почты работников Общества либо путем подписания документа на бумаге либо в формате ЭДО путем проставления УКЭП работника».<\/li>\n<li>Блок ЭДО стр. 16: «Подпись соответствует файлу документа»; «Ожидается ответная подпись». Изображение просмотрено.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Страница 2 — лист к приказу, не готовый реестр ознакомления с приложенными ПВТР. Пустая копия и ожидание ответной подписи не доказывают, что работники не ознакомлены: по ответам HR 10.11, раздел 3.5, офисные подписывают лист у КДП, остальных направляют в Диадок; по встрече 11.11 подписи скачивают в отдельные папки. Даже подпись на приказе следует проверить: подтверждает ли она прочтение конкретного приложения. Пункт 5.5 допускает рассылку как ознакомление, но не описывает подтверждение; публикация в Confluence сама по себе этого не добавляет. Для дистанционных возможна иная законная форма, поэтому не называем единственной формой УКЭП или бумагу. Приём до договора — <a href=\"#/k/PRIEM-07\">К-PRIEM-07<\/a>, инструктирование — <a href=\"#/k/DISC-02\">К-DISC-02<\/a>/<a href=\"#/k/OT-01\">К-OT-01<\/a>/03.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК, ред. от 25.05.2026: ст. 22 ч. 2 — «знакомить работников под роспись с принимаемыми локальными нормативными актами, непосредственно связанными с их трудовой деятельностью»; ст. 68 ч. 3 — «При приеме на работу (до подписания трудового договора) работодатель обязан ознакомить работника под роспись с правилами внутреннего трудового распорядка». ТК ст. 312.3 ч. 5 той же редакции допускает письменную форму, обмен электронными документами либо иную форму, установленную указанными там документами; ч. 2–4 требуют фиксации получения и установленного подтверждения действий. Общий ЭДО — только после введения и с подписями по ст. 22.1–22.3, <a href=\"#/k/DISC-01\">К-DISC-01<\/a>.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Вместо 12, п. 5.5:<\/p>\n<blockquote>\n<p>5.5. Направление ссылки или материалов по корпоративной почте и размещение в системе документации уведомляют о документе и обеспечивают доступ к нему. Ознакомление дистанционного работника оформляется по части пятой статьи 312.3 ТК РФ: на бумаге, обменом электронными документами либо иной установленной допустимой формой с сохранением подтверждения действий и получения. Если на взаимодействие распространены статьи 22.1–22.3 ТК РФ, применяется утверждённый Порядок ЭДО. КДП фиксирует конкретную редакцию, работника, дату и основание применённой формы; одна рассылка без предусмотренного подтверждения не считается завершённым ознакомлением. Документы-исключения оформляются по специальным правилам.<\/p>\n<\/blockquote>\n<p>Связать с <a href=\"#/k/SKVOZ-05\">К-SKVOZ-05<\/a>: его общий учёт ЛНА предлагается как п. 13.10. Чтобы не создать два реестра, в 13.5–13.6 оставить только специфику ПВТР и дать ссылку на этот общий учёт:<\/p>\n<blockquote>\n<p>13.5. С ПВТР и относящимися к работнику приложениями знакомят в порядке пункта 2.10 при приёме и в порядке пункта 13.8 при изменениях. Подтверждение учитывается по пункту 13.10 с указанием редакции ПВТР; одна рассылка без предусмотренного подтверждения не считается завершённым ознакомлением.\n13.6. Актуальная утверждённая редакция и приложения размещаются в доступном работникам месте; доступ не заменяет подтверждения ознакомления. Отказ или техническая ошибка разбираются отдельно, без проставления подписи за работника или даты задним числом.<\/p>\n<\/blockquote>\n<p>В приказ к новой редакции включить поручение КДП обеспечить ознакомление именно с ПВТР и приложениями и сохранить подтверждения; лист к приказу назвать по фактически подтверждаемому действию. В 13.8 оставить отсылку к исправленному 5.5. Не подписывать прошлую редакцию как текущую; сначала проверить доказательства действовавших редакций. Отдельное правило хранения подписи не должно уничтожать электронный подлинник.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП определяет работников и подлежащие им редакции, не выводя отсутствие подписи из пустой страницы. 2) Сверяет бумажные листы и комплект электронных документов с подписями. 3) Недостающие подтверждения получает по законному маршруту с текущей фактической датой. 4) Decision Flow предлагается сводить статус и ссылку на доказательство; сначала ручной ввод, выгрузка Диадока не подтверждена. 5) Руководитель КДП проверяет исключения и полноту, система не принимает дисциплинарных решений.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Где подтверждено ознакомление именно с редакцией 4 и приложениями: отдельный бумажный лист / электронный документ с подписью / иная установленная форма / только рассылка / пока не найдено? Можно ли связать доказательство с конкретным приложением?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём и трудозатраты не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по виду страниц и пробелу фиксации; отсутствие ознакомления на практике не установлено.<\/p>"}, {"id": "К-DISC-18", "slug": "DISC-18", "title": "Акт о невыходе на связь не отделён от проверки причины, получения запроса и специального основания увольнения", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "12, пп. 3.2.11–3.2.12, 3.2.25–3.2.26, 4.7–4.8, 4.23, 5.11–5.15, раздел 9; 03, 2.8"], ["Тип", "пробел в маршруте; риск смешения разных сроков и оснований"], ["Кто решает", "руководитель фиксирует событие; КДП проверяет; HR и юристы — спорный случай; решение принимает уполномоченный работодатель"], ["Важность", "высокая: отсутствие ответа в течение часа может ошибочно стать основанием приказа без нужных доказательств"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 5.11: «Работники, отвечающие за кадровое делопроизводство в организации, должны составить акт о невыходе дистанционного работника на связь».<\/li>\n<li>12, п. 5.13: «срок реагирования на поставленные рабочие задачи не более 1 (одного) рабочего часа».<\/li>\n<li>12, п. 5.15: «более двух рабочих дней подряд со дня поступления соответствующего запроса работодателя»; исключение — «если более длительный срок для взаимодействия с работодателем не установлен».<\/li>\n<li>12, п. 3.2.11: «в день невыхода на работу до 12 часов информировать своего непосредственного руководителя и специалистов, занимающихся кадровым делопроизводством».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Пункт 5.15 в существенной части воспроизводит действующий закон: его двухдневный срок не ошибочен. Но 5.11 не объясняет, когда акт — фиксация сбоя, а когда собранные материалы позволяют обсуждать ответственность; рабочий час на реакцию, рабочий день на квитанцию и более двух рабочих дней на взаимодействие — разные события. Запрос должен поступить, причины должны быть проверены; отпуск, болезнь и недоступность системы нельзя автоматически считать виновным молчанием. Уведомление о болезни по 4.23 и до 12 часов по 3.2.11 различается по адресатам/сроку; для графика, начинающегося позже, нужен согласованный маршрут. Реальную практику применения актов и увольнений материалы не показывают.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 312.8 ч. 1, ред. от 25.05.2026: специальное основание связано с тем, что «в период выполнения трудовой функции дистанционно работник без уважительной причины не взаимодействует с работодателем» по рабочим вопросам «более двух рабочих дней подряд со дня поступления соответствующего запроса работодателя», с оговоркой о более длительном установленном сроке. Ст. 192 ч. 1 определяет дисциплинарный проступок через вину; ст. 193 ч. 1 требует объяснение и два рабочих дня до акта о его непредоставлении. Это не тот же срок, что ст. 312.8. Полных ст. 76, 81 и 261 в разрешённой базе нет: отстранение, прогул и гарантии увольнения проверять отдельно, не выводить из неответа.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Заменить 12, п. 5.11 (резервные каналы согласовать с <a href=\"#/k/DISC-05\">К-DISC-05<\/a>):<\/p>\n<blockquote>\n<p>5.11. Если дистанционный работник не выходит на связь в установленное рабочее время, непосредственный руководитель фиксирует запрос, время и предусмотренный канал, проверяет доступность канала и передаёт сведения КДП и HR-директору. КДП проверяет режим, известное отсутствие и причины, фиксирует установленные факты и затребует письменное объяснение законным способом, позволяющим подтвердить получение. Акт о невыходе на связь фиксирует событие, а не устанавливает автоматически вину или основание увольнения. Получение запроса, получение объяснения и технические сбои отражаются отдельно.<\/p>\n<\/blockquote>\n<p>Дополнить 5.15:<\/p>\n<blockquote>\n<p>До решения по части первой статьи 312.8 ТК РФ КДП совместно с юристом проверяет применимость основания, рабочие дни по режиму Работника, поступление соответствующего запроса, истечение именно установленного для этого основания срока, возможный более длительный срок взаимодействия и уважительность причин. Неответ в течение рабочего часа и отсутствие подтверждения в течение рабочего дня сами по себе не заменяют эти условия. Проверка объяснения и применимой процедуры оформляется до решения. Приказ и его бумажная отправка оформляются по пункту 2.16.2.<\/p>\n<\/blockquote>\n<p>В 3.2.11 и 4.23 согласовать единое правило без ухудшения положения:<\/p>\n<blockquote>\n<p>В день невыхода на работу Работник до 12 часов, а если установленное ему рабочее время начинается позднее — до его начала, информирует непосредственного руководителя и КДП о причинах; если сообщить невозможно, Работник сообщает при первой возможности. КДП регистрирует сообщение и проверяет подтверждающие сведения.<\/p>\n<\/blockquote>\n<p>Срок не сокращать по сравнению с действующими 12 часами; HR и юристы утверждают единый текст одновременно в 3.2.11 и 4.23. <a href=\"#/k/DISC-07\">К-DISC-07<\/a> регулирует дисциплинарное дело; специальное увольнение, прогул и длительность объяснения не объединять в один автоматический таймер. Защищённые категории и запреты — <a href=\"#/k/PRIEM-03\">К-PRIEM-03<\/a>, копия приказа — <a href=\"#/k/PRIEM-23\">К-PRIEM-23<\/a>/<a href=\"#/k/DISC-02\">К-DISC-02<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Руководитель сообщает о событии и сохраняет запрос. 2) КДП проверяет получение, график, уважительную причину и резерв. 3) Запрашивает объяснение; при дисциплинарной ветви выдерживает самостоятельный срок <a href=\"#/k/DISC-07\">К-DISC-07<\/a>. 4) Юрист проверяет конкретное основание и гарантии; только работодатель принимает решение. 5) В Decision Flow предлагаются разные поля и сроки, без автоматического назначения взыскания.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли действующий порядок, более длительный срок взаимодействия и примеры актов? Варианты: сбой / отсутствие по известной причине / запрос получен, ответа нет / получение не подтверждено. Как сейчас различают эти случаи?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём и трудозатраты не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по необходимости разделить сроки и проверку; фактическое нарушение процедуры не установлено.<\/p>"}, {"id": "К-DISC-19", "slug": "DISC-19", "title": "ПВТР требуют раскрывать конфликт интересов, но не указывают получателя и связь с комплаенсом", "imp": "средняя", "docs": ["01", "12"], "meta": [["Документы", "12, пп. 13.2–13.4; 01, пп. 7.5–7.6, 9.1–9.3 — только кадровая связь"], ["Тип", "пробел исполнителя и канала; несогласованная связь документов"], ["Кто решает", "руководитель компании определяет/подтверждает уполномоченную роль; юристы и комплаенс — порядок; HR только кадровая часть"], ["Важность", "средняя: работник не знает, кому направить сообщение, а КДП может получить сведения вне своих полномочий"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 13.3: «раскрывать информацию о конфликте интересов или вероятности его возникновения, как только ему становится известно о нем».<\/li>\n<li>12, п. 13.4: «Работодатель вправе проводить служебные расследования с запросом у Работника объяснений».<\/li>\n<li>01, п. 7.6: «уведомлять Организацию и ответственного за комплаенс в Организации о конфликте интересов или вероятности его возникновения». Номер и получатель сверены с изображением.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>ПВТР устанавливают обязанность, но не получателя, форму и место регистрации. Кодекс уже называет комплаенс, поэтому нельзя без решения компании направить все конфликты только HR или объявить HR новым владельцем. Проверка по 13.4 не должна автоматически превращаться в дисциплинарное взыскание: это отдельная процедура <a href=\"#/k/DISC-07\">К-DISC-07<\/a>. Не доказано, что роль или рабочий канал отсутствуют; они просто не названы в ПВТР и не подтверждены ответами HR. Содержание Кодекса за рамками кадровой связи здесь не переписываем.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 189 ч. 2, ред. от 25.05.2026: «Работодатель обязан ... создавать условия, необходимые для соблюдения работниками дисциплины труда». Это основание обеспечить исполнимый маршрут, не универсальная норма о любых конфликтах интересов. ТК ст. 192–193 той же редакции: виновный проступок и отдельная процедура взыскания. Специальных норм о конфликте интересов для данной категории компании/работников в базе нет — проверить юристам, не заявляем нарушение специального закона.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>В 12 после 13.3 добавить:<\/p>\n<blockquote>\n<p>13.3.1. Сообщение о конфликте интересов или вероятности его возникновения направляется Работником Организации и ответственному за комплаенс по утверждённому корпоративному каналу, указанному в Матрице каналов. Ответственная роль и порядок её замещения определяются распорядительным документом Работодателя. Получатель подтверждает получение и регистрирует сообщение в реестре ограниченного доступа; сведения передаются только уполномоченным участникам проверки. Если сообщение касается получателя, применяется предусмотренный Матрицей независимый резервный маршрут к иному уполномоченному лицу, назначенному Работодателем.<\/p>\n<\/blockquote>\n<p>В 13.4 добавить:<\/p>\n<blockquote>\n<p>Служебная проверка фиксирует обстоятельства и объяснения. Решение о дисциплинарной ответственности принимается отдельно при наличии законного основания и с соблюдением раздела 9 ПВТР. Объём запрашиваемых сведений и доступ определяются полномочиями и правилами обработки данных; общее требование всей информации не заменяет такую проверку.<\/p>\n<\/blockquote>\n<p>До утверждения уточнить действующего ответственного и реальный канал. Кодекс 01 не переписывать; владелец сверяет ссылку 7.6 с ПВТР. HR не становится комплаенсом по умолчанию. Конкретный срок решения не выдумывать: сначала подтвердить действующий порядок; отсутствие нового SLA не блокирует немедленное уведомление работника.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) Компания подтверждает ответственного и резерв, HR доводит канал. 2) Работник направляет сведения без рассылки всей команде. 3) Получатель регистрирует и проверяет по своим полномочиям. 4) При кадровом последствии передаёт КДП необходимый минимум и юридически проверенное основание. 5) Decision Flow предлагается для ограниченного маршрута/статуса, не для общего открытого реестра конфликтов.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли ответственный за комплаенс и канал: назначены / роль есть, канал не опубликован / временно замещает уполномоченный / требуется решение компании? Кто рассматривает сообщение о самом получателе?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём и трудозатраты не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по разрыву ссылки; средняя по фактическому отсутствию маршрута — оно не доказано.<\/p>"}, {"id": "К-DISC-20", "slug": "DISC-20", "title": "Контроль рабочего места объявлен согласием в ПВТР, но не связан с уведомлением о конкретной системе и кадровым решением", "imp": "высокая", "docs": ["09", "11", "12"], "meta": [["Документы", "12, п. 3.4 и раздел 11; 09 — только связь с данными; ответы HR 10.11, загрузка КДП, строка об отчёте посещений"], ["Тип", "пробел кадрового информирования; несогласованный заголовок и текст контроля"], ["Кто решает", "ИБ и юристы — цели, основания и способы контроля; HR/КДП — информирование и кадровое применение"], ["Важность", "высокая: технический сигнал может быть принят за доказанную дисциплинарную вину"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.4: «о чем Работник уведомлен и выражает свое согласие»; далее: «использовать специализированное программное обеспечение и системы наблюдения за рабочим местом и оборудованием Работника».<\/li>\n<li>12, заголовок раздела 11: «Использование системы скрытого наблюдения»; текст: «устанавливаются камеры открытого (закрытого) видеонаблюдения».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Заголовок не совпадает с описанием открытых/закрытых камер; по одной этой формулировке нельзя доказать фактическую скрытую съёмку. Фраза ПВТР не показывает конкретный состав средств, цели, права, объём данных и информирование работника и не доказывает отдельное согласие там, где оно требуется. По ответам HR КДП готовит отчёт посещения по СКУД/VPN; не установлено, что эти системы используются именно как доказательство взыскания или что камеры работают. Кадровый риск — заменить проверку графика, задач и причин единственным техническим статусом. Правила ИБ/ПДн здесь не переписываем и не утверждаем, что любой контроль требует согласия: основание определяют юристы.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК ст. 86 п. 6, ред. от 25.05.2026: «при принятии решений, затрагивающих интересы работника, работодатель не имеет права основываться на персональных данных работника, полученных исключительно в результате их автоматизированной обработки или электронного получения»; п. 8: «работники и их представители должны быть ознакомлены под роспись с документами работодателя, устанавливающими порядок обработки персональных данных работников, а также об их правах и обязанностях в этой области». Ст. 192–193 — отдельная проверка проступка и процедура. Специальной нормы о законности именно скрытой камеры/конкретного ПО в базе нет — проверить юристам; ФЗ 152‑ФЗ в без даты редакции недостаточен для окончательного решения.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Кадровое дополнение к 12, п. 3.4 (не самостоятельный Порядок контроля):<\/p>\n<blockquote>\n<p>Применение средств контроля осуществляется в соответствии с законом и утверждёнными документами Работодателя, определяющими конкретные цели, средства, объём обработки, доступ и сроки хранения. До применения соответствующего порядка Работодатель обеспечивает установленное законом информирование и ознакомление Работников; согласие, когда оно требуется, оформляется в установленном порядке и не подразумевается только фактом включения настоящего пункта в ПВТР. Принятие кадрового решения исключительно по результату автоматизированной обработки или электронного получения данных не допускается. КДП совместно с руководителем проверяет исходные сведения и объяснения Работника, а юрист — законное основание решения.<\/p>\n<\/blockquote>\n<p>Заголовок раздела 11 после проверки фактической системы ИБ/юристами привести к описанному предмету: «Контроль и видеонаблюдение на территории Работодателя». Саму конфигурацию, режим и документ 09 здесь не менять; владельцам передать несоответствие заголовка и текста и кадровое требование информирования. Если отдельный порядок ещё не принят, ссылка на него не считается достаточной для внедрения нового контроля. Порядок дисциплинарного дела — <a href=\"#/k/DISC-07\">К-DISC-07<\/a>/18.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) ИБ и юристы устанавливают, какие средства действительно работают и на каком основании. 2) КДП проверяет доведение установленного порядка и хранение подтверждений. 3) Руководитель проверяет технический сигнал вместе с графиком/задачей и объяснением. 4) Уполномоченный работодатель принимает решение по законному основанию; Decision Flow лишь фиксирует проверенные действия, не назначает взыскание по VPN/СКУД.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Какие системы реально используются: камеры / ПО / СКУД/VPN / иное? Есть ли отдельный порядок, подтверждения информирования и случаи кадровых решений на основе этих данных?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём и трудозатраты не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по содержанию ПВТР и гарантии ст. 86; низкая по фактической конфигурации — её не проверяли.<\/p>"}, {"id": "К-DISC-21", "slug": "DISC-21", "title": "Редактура ПВТР: ссылка о подтверждении ведёт к совещанию, а дополнительные соглашения названы трудовыми договорами", "imp": "средняя", "docs": ["03", "12"], "meta": [["Документы", "12, пп. 2.15, 3.2.25, 5.10, 5.12, 13.8; 03, 2.18"], ["Тип", "ошибка в тексте — ссылки и самоназвания"], ["Кто решает", "КДП и HR — редакция; юристы сверяют смысл"], ["Важность", "средняя для неправильной ссылки; низкая для опечаток: затрудняют поиск нужного действия"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.25: «а для дистанционных/частично дистанционных работников также в порядке, предусмотренном п. 5.10 настоящих Правил».<\/li>\n<li>12, п. 5.10: «В случае проведения дистанционного совещания посредством платформы конференций».<\/li>\n<li>12, п. 2.15 внутри правила о допсоглашениях: «трудовой договор может подписываться путем обмена электронными документами».<\/li>\n<li>03, п. 2.18: «Российской Фе67дерации».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>В 3.2.25 требуется подтверждать получение, но ссылка ведёт к присутствию на совещании вместо 5.12; это не только стилистика. В 2.15 повторяется предмет договора, хотя пункт регулирует допсоглашение; это создаёт ненужный спор о применимости электронной формы. Опечатку 03 не превращаем в самостоятельное нарушение. Неверные правовые ссылки документа 03 уже разобраны <a href=\"#/k/DISC-12\">К-DISC-12<\/a>–15; отпускная редактура — <a href=\"#/k/OTP-23\">К-OTP-23<\/a>, приёмная — <a href=\"#/k/PRIEM-24\">К-PRIEM-24<\/a>, не дублируем.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>Специальной нормы об исправлении этих опечаток в базе нет, проверить юристам при утверждении редакции. Правовой смысл подтверждения — ТК ст. 312.3 ч. 3–4 (ред. 25.05.2026); возможность электронного допсоглашения — ст. 312.2 ч. 1, допустимые подписи — 312.3 ч. 1. Редакционные исправления не заменяют принятие изменённого ЛНА.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>Единый лист редакционных изменений:<\/p>\n<blockquote>\n<p>12, п. 3.2.25: вместо ссылки на п. 5.10 указать п. 5.12; отдельно оставить ссылку на применимые каналы, не на совещание.\n12, п. 2.15: «Дополнительное соглашение может заключаться путём обмена электронными документами в установленном законом порядке»; далее употреблять «дополнительное соглашение», а не «трудовой договор». Подписи и бумажное заявление сверить с <a href=\"#/k/DISC-12\">К-DISC-12<\/a>/13.\n12, п. 13.8: «дистанционные/частично дистанционные работники» вместо опечатки в слове; способ — исправленный п. 5.5 из <a href=\"#/k/DISC-17\">К-DISC-17<\/a>.\n03, п. 2.18: «Российской Федерации»; весь кадровый маршрут заменить по <a href=\"#/k/DISC-15\">К-DISC-15<\/a>, не ограничиваться одной буквой.<\/p>\n<\/blockquote>\n<p>В 12, 1.3 грамматическую правку правообладателя/названия сервиса делать только после подтверждения точного состава системы по <a href=\"#/k/DISC-01\">К-DISC-01<\/a>/04, не подставлять неподтверждённое название продукта. Не смешивать редакционный лист с незаметной сменой сроков или обязанностей.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) КДП готовит одну таблицу исправлений и связанных кейсов. 2) Юрист открывает каждую исправляемую ссылку и проверяет предмет. 3) Изменения проходят тот же порядок утверждения ЛНА и ознакомления, что содержательные; технические шаблоны обновляются после него.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли более поздняя редактируемая версия, в которой ссылки уже исправлены? Варианты: есть / нет / требуется поиск; новую редакцию сверять с ней, не поверх неизвестной.<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: фактический объём и трудозатраты не представлены.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая: ссылка 5.10 и предмет 2.15 проверены по текстовому слою; актуальность последней версии требует подтверждения.<\/p>"}, {"id": "К-DISC-22", "slug": "DISC-22", "title": "Пункт об изменении ПВТР называет приказ директора, но не показывает проверку представительного органа", "imp": "высокая", "docs": ["02", "03", "10", "12"], "meta": [["Документы", "12, п. 13.8; 03, раздел 2; 02, 1.3; 10, 12.3 — связанные процедуры"], ["Тип", "пробел процедуры принятия ЛНА, не доказанное нарушение"], ["Кто решает", "HR и юристы — наличие органа и применимая процедура; работодатель — утверждение"], ["Важность", "высокая: поправки по всем кейсам нельзя вводить по неполному маршруту"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 13.8: «Изменения в Правилах утверждаются приказом генерального директора Общества»; далее: «работники ознакамливаются под роспись».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong><\/p>\n<p>Приказ и ознакомление описаны, но до приказа не видна проверка наличия представительного органа и процедуры учёта мнения. Это не доказывает, что орган есть или что порядок когда-либо нарушен. Отсутствие органа в черновике общих правил HR помечено допущением, а не подтверждённым ответом компании. Учёт мнения не равен обязательному согласию и не ограничивается ожиданием пяти рабочих дней: при несогласии есть консультации. Общая тема относится и к SKVOZ; здесь готовый текст именно 13.8, не отдельный универсальный регламент для всех ЛНА.<\/p>\n<p><strong>Закон.<\/strong><\/p>\n<p>ТК, ред. от 25.05.2026: ст. 190 ч. 1 — «Правила внутреннего трудового распорядка утверждаются работодателем с учетом мнения представительного органа работников в порядке, установленном статьей 372 настоящего Кодекса для принятия локальных нормативных актов». Ст. 8 ч. 2 — мнение учитывается в установленных законом случаях при наличии такого органа; ч. 3 — коллективный договор может предусматривать согласование. Ст. 22.2 ч. 2–3: ЛНА об ЭДО и порядок ЭДО принимаются «с учетом мнения выборного органа первичной профсоюзной организации» по ст. 372; то же условие для ЛНА о дистанционном взаимодействии записано в ст. 312.3 ч. 2–5, 9. Ст. 372 ч. 2 — «не позднее пяти рабочих дней со дня получения проекта» орган направляет мотивированное мнение; ч. 3 при несогласии/предложениях — согласиться с ними либо «в течение трех дней после получения мотивированного мнения провести дополнительные консультации». В ч. 3 это дни, не рабочие дни; ч. 4 предусматривает протокол разногласий и последующее право принять ЛНА с возможностью обжалования. Установление органа и сроков применительно к конкретной организации — юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong><\/p>\n<p>В 12, п. 13.8 перед утверждением приказом вставить:<\/p>\n<blockquote>\n<p>До утверждения изменений или новой редакции руководитель HR совместно с юристом проверяет наличие представительного органа работников, применимые требования ТК РФ, коллективного договора и соглашений. При наличии соответствующего органа проект ПВТР и обоснование направляются для учёта мнения в порядке статьи 372 ТК РФ. В календарь включаются срок мотивированного мнения, при необходимости дополнительные консультации и оформление разногласий; одно отсутствие согласия само по себе не означает запрета на принятие ЛНА после соблюдения установленной процедуры. Документы направления, мнение и результаты консультаций сохраняются с утверждённой редакцией. При отсутствии органа факт проверки фиксируется, согласование с несуществующим органом не организуется.<\/p>\n<\/blockquote>\n<p>Далее сохранить утверждение уполномоченным работодателем и ознакомление, заменив ссылку на 5.5 по <a href=\"#/k/DISC-17\">К-DISC-17<\/a>. Правила 02, 10 и кадровый порядок 03 принимаются по применимым к ним нормам отдельно: не объявлять процедуру ПВТР автоматически одинаковой для всякого документа. Для общего ЭДО учесть прямое требование ст. 22.2, для дистанционного порядка — 312.3/312.4; проект кадровой части 03 согласовать с владельцем ОТ. Этот пункт не вводит вместо директора обязательное решение руководителя компании группы: проверяется полномочие работодателя.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<p>1) HR передаёт юристу проект и перечень затрагиваемых ЛНА. 2) Юрист проверяет орган, коллективный договор и норму процедуры. 3) HR ведёт календарь направления, мнения и консультаций при необходимости, сохраняет документы. 4) Работодатель утверждает; КДП знакомит работников по законному маршруту. 5) В Decision Flow предлагается журнал этапов, но направление органу и юридическая оценка остаются реальными действиями людей.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong><\/p>\n<p>Есть ли представительный орган/профсоюз и коллективный договор: есть / орган отсутствует, подтверждено / неизвестно? Кто хранит документы о его полномочиях и мнения; как принимали редакцию 4?<\/p>\n<p><strong>Цена вопроса.<\/strong><\/p>\n<p>Не считали: наличие органа и календарь конкретного принятия не установлены; готовую дату утверждения не обещаем.<\/p>\n<p><strong>Уверенность.<\/strong><\/p>\n<p>Высокая по неполноте текста и норме; фактическое нарушение при принятии не установлено.<\/p>"}, {"id": "К-DISC-23", "slug": "DISC-23", "title": "Возмещение обучения при увольнении описано только как обязанность без проверки причины и расчёта", "imp": "средняя", "docs": ["10", "12"], "meta": [["Документы", "12, п. 3.2.23; 10, п. 10.10; 12, пп. 2.16.5–2.16.7 — связи"], ["Тип", "пробел кадрового процесса; правовая оценка ограничена отсутствующей нормой"], ["Кто решает", "юристы — применимость соглашения и основания; КДП и бухгалтерия — документы/расчёт"], ["Важность", "средняя: сумму обучения можно ошибочно принять за готовый вычет из окончательного расчёта"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.23: «работник обязан возместить расходы, понесенные работодателем на его обучение, в соответствии с условиями такого соглашения об обучении»; условие пункта — «в слу
