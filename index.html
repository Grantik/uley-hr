огласуются премиальные записки?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: время маршрута и число возвратов неизвестны.<\/p>\n<p><strong>Уверенность.<\/strong> Средняя: документы точны, практика описана коротко и требует подтверждения.<\/p>"}, {"id": "К-PLAT-15", "slug": "PLAT-15", "title": "Конец испытания не связан с запуском второго этапа реферальной премии", "imp": "средняя", "docs": ["07", "10", "13"], "meta": [["Документы", "10, таблица п. 6.8.3, пп. 6.8.2, 6.11; 07, пп. 2.18–2.20, 3.3; 13, разделы 3–4"], ["Тип", "пробел процесса"], ["Кто решает", "руководитель HR; КДП и бухгалтерия исполняют; юристы проверяют условия"], ["Важность", "средняя: второй этап реферальной премии может потеряться между испытанием и зарплатой"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 6.8.3, стр. 5: «Выплата производится в два этапа: 1. 50% по выходу кандидата на работу, 2. 50% после прохождения кандидатом испытательного срока».<\/li>\n<li>07, п. 2.20, стр. 3: «Заключение о прохождении испытания поступают ... не позднее чем за неделю до окончания испытания работника».<\/li>\n<li>07, п. 3.3, стр. 3: «Об удовлетворительном результате испытания работнику устно сообщает непосредственный руководитель».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В документе 07 есть заключение руководителя и передача в кадровую службу, но отдельного события «испытание пройдено» для реферальной премии нет; устное сообщение не оставляет проверяемого следа. Это не значит, что событие обязательно теряется на практике. По картам и каталогу процесс предлагает связать запись о пройденном испытании с реферальной премией; вносить имена и персональные данные в этот файл не нужно.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 71 ч. 3 (ред. 25.05.2026): «Если срок испытания истек, а работник продолжает работу, то он считается выдержавшим испытание»., ст. 71, https://www.consultant.ru/document/cons_doc_LAW_34683/c4fb132fe85cc97656824c71c0727e1ef5cb8e10/. Поэтому отсутствие заключения не должно блокировать событие. ТК ст. 135 ч. 3 требует определить «виды премий и их размеры, сроки, основания и условия выплаты премий работникам»., ст. 135.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 07, после 3.3, добавить:<\/p>\n<blockquote>\n<p>3.3.1. Ответственный за кадровое делопроизводство фиксирует окончание испытания с учётом незасчитываемых периодов отсутствия. Если срок истёк и Работник продолжает работу, результат фиксируется независимо от наличия заключения руководителя. КДП передаёт событие Отделу персонала для оформления второго этапа реферальной премии по пункту 6.8.3 Положения об оплате труда. После проверки возможности передачи между системами этот шаг может выполнять процесс; запись не заменяет приказ.<\/p>\n<\/blockquote>\n<p>В 10, после таблицы 6.8.3 добавить:<\/p>\n<blockquote>\n<p>Право на второй этап определяется фактом прохождения испытания; отсутствие служебного заключения само по себе не приостанавливает выплату при наступлении основания, предусмотренного законом. КДП фиксирует событие, Отдел персонала готовит документы на премирование; отсутствие приказа не отменяет возникшее право. Приоритет вакансии и лицо, предложившее кандидата, должны быть определены до первого этапа и храниться в материалах заявки.<\/p>\n<\/blockquote>\n<p>КДП проверяет, что 6.8.3 — правильный пункт: приёмка карты исправила ошибочное упоминание 6.8.1. Срок выплаты оставить только после сверки с <a href=\"#/k/PLAT-06\">К-PLAT-06<\/a> и выбранным видом премии.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП регистрирует приём с испытанием и выбранный приоритет вакансии.<\/li>\n<li>При истечении испытания и продолжении работы КДП фиксирует событие; HR готовит документы, генеральный директор утверждает приказ. Раннее заключение за неделю до конца само по себе не означает досрочное окончание испытания.<\/li>\n<li>Бухгалтерия выплачивает второй этап и закрывает задачу; отказ требует причины и журнала.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как фиксируются приоритет вакансии и событие окончания испытания; что происходит со вторым этапом при приёме без испытания? Рекомендуемый вариант для решения компании — выплата обеих частей при выходе, но это изменение ещё не выбрано.<\/p>\n<p><strong>Цена вопроса.<\/strong> Суммы известны из ЛНА: 100 000/50 000/20 000 рублей общей премии, двумя равными этапами; фактическое число рефералов не считали (расчёт программой).<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии отдельного правила в 10 и 07; средняя в фактическом маршруте.<\/p>"}, {"id": "К-PLAT-16", "slug": "PLAT-16", "title": "ДМС регулирует доплату, но не отвечает, кому и когда положена программа", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 9.1–9.5; 12, пп. 7.1–7.2; ответы HR от 10.11, разделы 1.1 и 4.4; выборы руководителя компании, раздел 5"], ["Тип", "пробел"], ["Кто решает", "руководитель компании: вариант; HR и юристы: текст; КДП исполняет"], ["Важность", "высокая: новый договор и право сотрудника нельзя настроить по одному пункту о доплате"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 9.5, стр. 7–8: «один раз в год запросить у страховой компании изменения программы страхования конкретного Работника»; «HR-директор рассматривает возможность изменить программу страхования»; «Работник вносит сумму доплаты на расчётный счет компании».<\/li>\n<li>12, пп. 7.1–7.2, стр. 13: «Работники Общества пользуются пособиями и льготами по обязательному социальному и медицинскому страхованию»; «Дополнительные льготы ... предусмотрены внутренними положениями».<\/li>\n<li>Ответ HR от 10.11, раздел 4.4: новый договор ДМС — «с 1 февраля 2027»; выборы руководителя компании: варианты после испытательного срока, после года или после года/грейда.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Пункт 9.5 описывает изменение программы для конкретного застрахованного, но не определяет право на базовое ДМС, дату подключения, отключение при увольнении, сохранение обещанного при найме, родственников и переход между договорами. Ответ HR подтверждает действующий договор и дату обсуждаемого запуска, но не выбирает вариант. Нельзя выдавать один из вариантов выбора за действующее правило.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 57 ч. 4 (ред. 25.05.2026) допускает дополнительные условия договора, не ухудшающие положение работника, в том числе «о видах и об условиях дополнительного страхования работника» и «об улучшении социально-бытовых условий работника и членов его семьи». ТК ст. 8 ч. 4: «Нормы локальных нормативных актов, ухудшающие положение работников ... не подлежат применению»., ст. 57;, ст. 8.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После выбора руководителя компании добавить в 10 новый раздел 9.6:<\/p>\n<blockquote>\n<p>9.6. Право Работника на добровольное медицинское страхование, дата его возникновения, базовая программа, порядок изменения программы, условия подключения членов семьи, размер доплаты и порядок прекращения участия определяются приложением к настоящему Положению и договором страхования. Изменение программы по заявлению Работника допускается не чаще одного раза в год, если иное не предусмотрено договором страхования. Доплата Работника перечисляется на расчётный счёт Организации отдельно от удержаний из заработной платы. Изменение способа оплаты возможно только после отдельной юридической проверки и изменения соответствующего правила. При увольнении КДП направляет страховщику сведения в срок, установленный договором.<\/p>\n<\/blockquote>\n<p>В приложение подставить <strong>только выбранный вариант<\/strong> (А, Б или В) и дату перехода; обещания в трудовых договорах и действующее покрытие проверить до изменения. В 9.5 оставить процедуру изменения программы и дать ссылку на 9.6. В 12, п. 7.2 сохранить общую ссылку на внутренние положения, дополнив ссылками на разделы 8–9 документа 10; не сузить другие льготы одним ДМС. Каталог должен различать первичное подключение, отключение и изменение программы.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR и руководитель компании выбирают вариант; КДП формирует список по кадровым событиям, без публикации лишних данных.<\/li>\n<li>КДП направляет страховщику подключение или отключение; HR принимает заявление на изменение программы.<\/li>\n<li>Бухгалтерия сверяет добровольный перевод доплаты отдельно; КДП фиксирует дату действия программы и закрывает задачу.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кому сейчас предоставляется ДМС, с какой даты и есть ли обещания в трудовых договорах; действует ли приложение страховщика для массовых событий?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: стоимость вариантов и число застрахованных отсутствуют; договор действует до 31.01.2027 по ответам HR.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле ЛНА; средняя в выборе варианта и дате перехода.<\/p>"}, {"id": "К-PLAT-17", "slug": "PLAT-17", "title": "Материальная помощь содержит суммы, но не содержит сроков и полного маршрута решения", "imp": "средняя", "docs": ["10", "12"], "meta": [["Документы", "10, пп. 8.1–8.8; 12, п. 7.2"], ["Тип", "пробел процесса"], ["Кто решает", "руководитель HR и генеральный директор; бухгалтерия исполняет"], ["Важность", "средняя: сотрудник не знает, когда будет ответ и какие документы нужны по каждому основанию"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 8.1, стр. 7: «По заявлению Работника, Организация вправе оказать Работнику материальную помощь».<\/li>\n<li>10, п. 8.3: «Работник подает ... запрос HR-директору напрямую или через своего непосредственного руководителя»; выплата — «на основании приказа Генерального директора».<\/li>\n<li>10, п. 8.4: «установлен в размере 4 (Четыре) минимальных размеров оплаты труда ... в зависимости от региона проживания Работника».<\/li>\n<li>10, п. 8.5: «50 000,00 ... после удержания подоходного налога».<\/li>\n<li>10, п. 8.8: «при представлении Работником документов, подтверждающих наступление чрезвычайных обстоятельств».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Размеры для двух случаев записаны, но нет срока ответа, выплаты, перечня документов для рождения ребёнка и смерти близкого, правила определения даты/региона МРОТ и этапа, на котором HR возвращает неполный запрос. 8.8 буквально относится к чрезвычайным обстоятельствам, поэтому не следует молча распространять его на каждый вид помощи. Общее слово «вправе» надо согласовать с фиксированными размерами 8.4–8.5: вопрос, когда возникает обязательство и допустим ли отказ при подтверждённом событии, передать юристам; безусловную свободу отказа не утверждаем.<\/p>\n<p><strong>Закон.<\/strong> В разрешённой базе нет специальной нормы о материальной помощи и сроке рассмотрения таких заявлений; проверить юристам. ТК ст. 57 ч. 4 допускает дополнительные условия, не ухудшающие положение работника, в том числе социально-бытовые условия; цитата в <a href=\"#/k/PLAT-16\">К-PLAT-16<\/a>.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 8.3:<\/p>\n<blockquote>\n<p>HR-директор регистрирует заявление и в течение трёх рабочих дней сообщает о достаточности документов либо направляет полный перечень недостающих документов. Заявление на помощь при рождении ребёнка подтверждается документом о рождении, при смерти близкого — документом о смерти и документом о родстве; по иным обстоятельствам прилагаются документы, позволяющие установить событие и его последствия. Генеральный директор рассматривает полный комплект в течение пяти рабочих дней; решение фиксируется письменно. Приказ содержит основание, размер и дату выплаты. Бухгалтерия выплачивает утверждённую сумму в течение пяти рабочих дней после приказа, если не установлен более ранний срок.<\/p>\n<\/blockquote>\n<p>Сроки выше — предложенные компании, не сроки закона или установленная практика. В 8.4 после юридической проверки определить базу на дату события по месту проживания и правило для проживания за рубежом; до выбора не подставлять региональную минимальную зарплату вместо МРОТ. В 8.5 уже прямо указано 50 000 рублей после удержания налога: эту сумму на руки не уменьшать; Бухгалтерия определяет начисление и налоговый режим по проверенным нормам. В каталоге отдельный процесс: заявление → HR → решение → приказ → бухгалтерия.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник подаёт заявление и документы; HR регистрирует и проверяет комплект.<\/li>\n<li>Генеральный директор решает; КДП хранит заявление, документы и приказ с ограниченным доступом.<\/li>\n<li>Бухгалтерия рассчитывает и выплачивает; процесс фиксирует дату и статус.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой срок ответа ожидают на практике и какие документы принимают по каждому основанию?<\/p>\n<p><strong>Цена вопроса.<\/strong> Из ЛНА: 4 МРОТ или 50 000 рублей; фактическое число заявлений и расходов не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле маршрута; средняя в налоговой и региональной формулировке — нужна проверка.<\/p>"}, {"id": "К-PLAT-18", "slug": "PLAT-18", "title": "Сроки выдачи справок о заработке в ЛНА не названы", "imp": "средняя", "docs": ["10", "12"], "meta": [["Документы", "10, п. 10.11; 12, п. 6.7; встреча 11.11, раздел «Диадок»"], ["Тип", "пробел"], ["Кто решает", "руководитель HR и КДП; юристы проверяют срок"], ["Важность", "средняя: запрос может зависеть от ручного поиска и не иметь контрольной даты"]], "html": "<p><strong>Было.<\/strong> 10, п. 10.11, стр. 8: «Справки о размере заработной платы, начислениях и удержаниях из нее выдаются Работнику на основании его заявления и лично под подпись или путем направления через систему электронного документооборота Контур.Диадок».<\/p>\n<p><strong>Что не так.<\/strong> Каналы названы, срок не назван. Справка отличается от расчётного листка: нельзя считать, что отправка листка закрывает этот запрос. В ответах HR КДП указала справки в перечне регулярных приказов и документов, но отдельный маршрут и срок не зафиксированы; это вопрос практики, не установленный факт.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.3 ч. 11 (ред. 25.05.2026): «работодатель обязан безвозмездно предоставить работнику ... не позднее чем в течение трех рабочих дней со дня подачи указанного заявления» документы или копии по заявлению о выдаче документов, связанных с работой., ст. 22.3, https://www.consultant.ru/document/cons_doc_LAW_34683/00a8ce6ce116fc26361a0c9a23eebf37074acf6e/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 10, п. 10.11:<\/p>\n<blockquote>\n<p>Справки выдаются безвозмездно не позднее трёх рабочих дней со дня подачи заявления. КДП регистрирует дату подачи и выдачи. Бумажная справка выдаётся лично под подпись либо предоставляется электронный документ способом, указанным в заявлении Работника, если в отношении соответствующих документов правомерно осуществляется электронный документооборот. Правила технической регистрации не продлевают срок выдачи.<\/p>\n<\/blockquote>\n<p>Перед утверждением юрист сверяет, какая часть 22.3 применяется к данной справке и как фиксируется получение в системе. В каталоге создать процесс выдачи справки о заработке: заявление → дата получения → КДП/бухгалтерия → выдача → журнал.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник подаёт заявление; КДП фиксирует канал и дату.<\/li>\n<li>Бухгалтерия готовит данные, КДП формирует справку и проверяет комплект.<\/li>\n<li>Выдача фиксируется; просрочка поднимается руководителю HR.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас готовит справку и есть ли отдельный шаблон с основаниями начислений и удержаний?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: количество заявлений и просрочек нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии срока 10.11; средняя в применимости именно ч. 11 к форме справки — юристам.<\/p>"}, {"id": "К-PLAT-19", "slug": "PLAT-19", "title": "Приостановка работы при задержке сформулирована как сохранение оклада, а не среднего заработка", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 11.1–11.2"], ["Тип", "расходится с законом"], ["Кто решает", "юристы и HR до изменения; бухгалтерия исполняет"], ["Важность", "высокая: текст может занизить выплату при приостановке"]], "html": "<p><strong>Было.<\/strong> 10, п. 11.2, стр. 9: «В случае задержки выплаты заработной платы на срок более 15 дней Работник имеет право ... приостановить работу ... при этом за Работником сохраняется должность и оклад».<\/p>\n<p><strong>Что не так.<\/strong> Пункт фиксирует право приостановки, но говорит только об окладе. В действующей базе ТК для периода приостановки прямо назван средний заработок; если средний выше оклада, текущая формулировка не отражает норму. Исправление не должно расширять право тех, кому закон запрещает приостановку; эти исключения в действующем ЛНА не перечислены.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 142 чч. 2–4 (ред. 25.05.2026): «В случае задержки выплаты заработной платы на срок более 15 дней работник имеет право, известив работодателя в письменной форме, приостановить работу»; «На период приостановления работы за работником сохраняется средний заработок»., ст. 142, https://www.consultant.ru/document/cons_doc_LAW_34683/67f5b7767847d2483a67262f342f35cf922855a2/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 10, п. 11.2:<\/p>\n<blockquote>\n<p>В случае задержки выплаты заработной платы на срок более 15 дней Работник вправе, письменно известив Работодателя, приостановить работу до выплаты задержанной суммы, если законом не установлено исключение. На период приостановления за Работником сохраняются место работы и средний заработок в порядке и пределах, установленных Трудовым кодексом Российской Федерации. Работодатель регистрирует уведомление, рассчитывает задолженность и денежную компенсацию за задержку; после письменного уведомления о готовности произвести выплату Работник выходит не позднее следующего рабочего дня.<\/p>\n<\/blockquote>\n<p>В 11.1 дать ссылку на ст. 236; отдельно проверить перечень исключений ст. 142 до включения. Не обещать «оклад», если закон говорит средний заработок. КДП проверяет уведомление и исключение, бухгалтерия считает сумму.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник подаёт письменное уведомление; КДП фиксирует дату.<\/li>\n<li>Бухгалтерия считает долг и компенсацию; HR проверяет исключение.<\/li>\n<li>Работодатель сообщает о готовности выплаты; КДП фиксирует выход.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли задержки более 15 дней и есть ли процедура уведомления и расчёта компенсации?<\/p>\n<p><strong>Цена вопроса.<\/strong> Иллюстрация: если средний заработок 1,5 оклада, сохранение одного оклада меньше на 33,3% за месяц (расчёт программой); фактических задержек не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в расхождении с цитатой ст. 142; высокая в необходимости проверки исключений.<\/p>"}, {"id": "К-PLAT-20", "slug": "PLAT-20", "title": "Компенсация за задержку не имеет ответственного за расчёт", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 11.1–11.2; 10, п. 10.7"], ["Тип", "пробел"], ["Кто решает", "главный бухгалтер и юристы; HR утверждает процесс"], ["Важность", "высокая: задержка требует отдельного расчёта, а не только общей ссылки на закон"]], "html": "<p><strong>Было.<\/strong> 10, п. 11.1, стр. 9: «За задержку выплаты заработной платы Работодатель несет ответственность в соответствии с законодательством РФ».<\/p>\n<p><strong>Что не так.<\/strong> Общая ссылка не назначает расчёт, данные, срок и проверку компенсации. Пункт 11.2 говорит о приостановке, но не связывает её с выплатой компенсации. Нельзя заявить, что компания не платит компенсацию только по отсутствию шага в ЛНА; можно утверждать, что процесс не описан.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 236 ч. 1 (ред. 25.05.2026): «При нарушении работодателем установленного срока соответственно выплаты заработной платы, оплаты отпуска, выплат при увольнении и (или) других выплат ... работодатель обязан выплатить их с уплатой процентов (денежной компенсации) в размере не ниже одной сто пятидесятой действующей в это время ключевой ставки Центрального банка Российской Федерации ... за каждый день задержки ... по день фактического расчета включительно»., ст. 236, https://www.consultant.ru/document/cons_doc_LAW_34683/7c8d2fe49f0c8b8d13723803f2e82228f99b6d7e/.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 11.1:<\/p>\n<blockquote>\n<p>При нарушении срока выплаты заработной платы, отпускных, выплат при увольнении или иных причитающихся выплат Бухгалтерия рассчитывает и выплачивает денежную компенсацию по статье 236 Трудового кодекса Российской Федерации за каждый день задержки до дня фактического расчёта включительно. Расчёт хранится вместе с платёжными документами и отражается в расчётном листке. Обязанность возникает независимо от вины Работодателя. При неполной выплате компенсация рассчитывается от фактически не выплаченной в срок суммы.<\/p>\n<\/blockquote>\n<p>Связать 11.2 с этим пунктом; добавить в 12, приложение 1 к ПВТР, поле компенсации, если его нет по проверке картинки. КДП получает событие просрочки из платёжного календаря, но сумму считает бухгалтерия.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Платёжный календарь фиксирует плановую и фактическую дату.<\/li>\n<li>Бухгалтерия считает компенсацию программой по действующей ключевой ставке; человек проверяет ввод.<\/li>\n<li>Сумма отражается в листке и выплачивается вместе с долгом или отдельным платежом.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас отслеживает просрочку и где хранится расчёт компенсации?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: задержек и ставок для конкретных периодов нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле процесса и цитате ст. 236; конкретный расчёт не выполнялся.<\/p>"}, {"id": "К-PLAT-21", "slug": "PLAT-21", "title": "Неденежная часть оплаты ограничена, но основание и форма не доведены до процесса", "imp": "средняя", "docs": ["10", "12"], "meta": [["Документы", "10, п. 1.3; 12, п. 6.1"], ["Тип", "пробел"], ["Кто решает", "руководитель компании; бухгалтерия и юристы проверяют"], ["Важность", "средняя: нужна проверка допустимости и учёта формы оплаты"]], "html": "<p><strong>Было.<\/strong> 10, п. 1.3, стр. 2: «По письменному заявлению Работника оплата труда может производиться и в иных формах»; «доля заработной платы, выплачиваемой в не денежной форме, не должна превышать 20 процентов от общей суммы заработной платы».<\/p>\n<p><strong>Что не так.<\/strong> Пункт устанавливает процент и заявление, но не вид, оценку, срок, подтверждение добровольности, налоговый и бухгалтерский учёт. В ПВТР 6.1 речь только о конфиденциальности оплаты. Норма закона о 20% не была включена в разрешённую базу; нельзя объявить 20% действующим безопасным пределом без проверки юристами.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 131 и правила выдачи зарплаты в неденежной форме в разрешённой базе отсутствуют; проверить юристам. ТК ст. 129 ч. 1 определяет зарплату как вознаграждение и включает компенсационные и стимулирующие выплаты: ст. 129.<\/p>\n<p><strong>Стало (предлагается).<\/strong> До юридической проверки не расширять практику. Если юристы подтвердят возможность, дополнить 1.3:<\/p>\n<blockquote>\n<p>Неденежная форма оплаты допускается только по письменному заявлению Работника, при наличии законного основания и с предварительным согласованием формы, оценки, периода и порядка учёта. Бухгалтерия подтверждает соблюдение установленного законом предела и отражает форму в расчётном листке. Неденежная форма не может ухудшать положение Работника и не заменяет обязательные денежные выплаты, если иное не допускается законом.<\/p>\n<\/blockquote>\n<p>Связать с формой расчётного листка и 10.10; конкретный процент оставить только после проверки юристов. Если практика отсутствует, пункт можно сохранить как резерв без запуска процесса.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник подаёт заявление; HR проверяет добровольность и документ.<\/li>\n<li>Юрист и бухгалтерия проверяют форму, предел и оценку.<\/li>\n<li>Бухгалтерия проводит выплату и отражает её в листке; КДП хранит заявление.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли неденежные выплаты и какая форма использовалась?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; фактических операций нет в материалах.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле процесса; низкая в юридической оценке предела, нормы в базе нет.<\/p>"}, {"id": "К-PLAT-22", "slug": "PLAT-22", "title": "Роль исполнительного директора и три названия кадровой функции не сведены", "imp": "высокая", "docs": ["02", "10", "12"], "meta": [["Документы", "10, пп. 4.2, 5.2, 6.4–6.5; 12, пп. 6.7, 10.3; 02, пп. 2.5, 3.7"], ["Тип", "разные названия роли"], ["Кто решает", "руководитель компании и HR; юристы оформляют замены"], ["Важность", "высокая: платёж или доплата может зависеть от человека, которого нет в текущей оргструктуре"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 4.2, стр. 3: доплаты НРД «по решению Исполнительного директора и на основании Приказа Генерального директора».<\/li>\n<li>10, п. 5.2: надбавки «по решению Исполнительного директора».<\/li>\n<li>10, п. 6.4: «Премии выплачиваются по решению руководителя Организации».<\/li>\n<li>10, п. 10.3, стр. 8: «Табели учета рабочего времени заполняют и подписывают Руководитель группы кадрового делопроизводства и Главный бухгалтер».<\/li>\n<li>12, п. 6.7: документ направляется «в его Личном кабинете в программе 1С»; 02, п. 3.7: «Работник, отвечающий за кадровое делопроизводство, оформляет Приказ».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В документах используются исполнительный директор, руководитель организации, отдел/HR-директор, начальник кадрового делопроизводства, руководитель группы кадрового делопроизводства и работник, отвечающий за КДП. Это может быть одна роль, разные роли или исторические названия; документы не дают оснований отождествлять их. Ошибка в назначении не превращается автоматически в недействительность приказа, но создаёт ручную проверку и риск пропуска срока.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22 ч. 2 возлагает на работодателя обязанность «выплачивать в полном размере причитающуюся работникам заработную плату в сроки» и «знакомить работников под роспись с принимаемыми локальными нормативными актами»., ст. 22, ред. 25.05.2026.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После подтверждения соответствий HR добавить в 10 пункт 1.5 и связанные ссылки в 12 и 02, сохраняя полномочия:<\/p>\n<blockquote>\n<p>В настоящем Положении под ответственным за кадровое делопроизводство понимается роль, назначенная приказом Работодателя. При отсутствии или замене лица задача передаётся роли-заместителю, указанной в реестре ролей. Полномочия по принятию решения, согласованию, оформлению приказа, подписанию табеля и начислению выплаты не совмещаются автоматически и указываются в матрице процесса.<\/p>\n<\/blockquote>\n<p>Отдельно решить, существует ли исполнительный директор; если нет, компания определяет правопреемника полномочий и меняет 5.2. Пункт 4.2 о ненормированном дне согласовывается с VREM: замена роли не делает законным отказ в обязательной оплате сверхурочных. «Руководитель Организации» привести к выбранной роли в 6.4–6.5. Не перепутать роль главного бухгалтера с руководителем КДП.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR подтверждает реестр ролей и заместителей.<\/li>\n<li>Юристы сверяют полномочия и доверенности; КДП вносит роли в процесс.<\/li>\n<li>При уходе или отсутствии человека задача идёт роли-заместителю, а не на старый адрес.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас исполняет полномочия исполнительного директора и какие названия ролей используются в 1С/Диадок?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: реестр ролей и возвраты задач отсутствуют.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в том, что названия ролей в документах расходятся (видно по текстам); кто сейчас исполняет полномочия исполнительного директора, из документов не видно — уточнить у HR.<\/p>"}]}, {"kod": "KOM", "nazv": "Командировки и такси", "glavnoe": "<p>Начать разговор с руководителем HR с этих пяти кейсов:<\/p>\n<ol>\n<li><strong><a href=\"#/k/KOM-01\">К-KOM-01<\/a>, суточные и отсутствующий приказ.<\/strong> Сначала восстановить действующую норму и не называть черновую формулу политикой: она определяет деньги работника.<\/li>\n<li><strong><a href=\"#/k/KOM-03\">К-KOM-03<\/a>, два канала такси.<\/strong> Связать OneTwoTrip и Яндекс Go, чтобы одна командировка не проходила по двум несвязанным правилам и не возникало двойного возмещения.<\/li>\n<li><strong><a href=\"#/k/KOM-05\">К-KOM-05<\/a>, специальные гарантии.<\/strong> Поставить проверку до приказа и покупки: закон действует сейчас, а подпись приказа не заменяет согласие и уведомление о праве отказа.<\/li>\n<li><strong><a href=\"#/k/KOM-12\">К-KOM-12<\/a>, компенсация такси.<\/strong> Убрать риск автоматического удержания полной поездки; нужны проверка ущерба, объяснение и законный порядок взыскания.<\/li>\n<li><strong><a href=\"#/k/KOM-04\">К-KOM-04<\/a>, передача дел.<\/strong> До ухода роли должны иметь нового владельца и заместителя; иначе даже хороший процесс не имеет исполнителя.<\/li>\n<\/ol>\n<p>Именно эти пять сначала закрывают деньги и права работника, затем сервисный маршрут, доказуемость ответственности и непрерывность работы. Кейсы 02, 06–11 и 13–14 детализируют их; сначала получить ответы HR и юристов, затем объединять пункты в новые редакции.<\/p>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы по источнику<\/th>\n<th style=\"text-align: left;\">Разрыв или связь<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Смета и разрешение поездки<\/td>\n<td style=\"text-align: left;\">14: 2.1, 2.2.1, 2.3; 1.4<\/td>\n<td style=\"text-align: left;\">работник/руководитель/администратор отдела; финансовый директор, HR-директор; КДП<\/td>\n<td style=\"text-align: left;\">почта; приказ в Диадоке либо бумага<\/td>\n<td style=\"text-align: left;\">согласование бюджета не равно письменному решению работодателя; срочный маршрут не описан<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Превышение и исключение<\/td>\n<td style=\"text-align: left;\">14: 2.5, 3.2, 4.1<\/td>\n<td style=\"text-align: left;\">HR-директор; финансовый директор; бухгалтерия<\/td>\n<td style=\"text-align: left;\">почта, OneTwoTrip, ЭДО<\/td>\n<td style=\"text-align: left;\">увеличение бюджета без финансового директора, но невозвратный билет согласуют оба; счета снова у финансового директора<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Аккаунт, остаток денег, заказ<\/td>\n<td style=\"text-align: left;\">14: 1.4, 2.2.2–2.2.4, 3.1, 3.4–3.5<\/td>\n<td style=\"text-align: left;\">КДП, администратор сервиса, согласующий подразделения, бухгалтерия<\/td>\n<td style=\"text-align: left;\">OneTwoTrip<\/td>\n<td style=\"text-align: left;\">смешаны персональный лимит, деньги сервиса, договорная постоплата; два режима согласования заказа<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Передача ведения поездок<\/td>\n<td style=\"text-align: left;\">14: 1.4, 2.1–2.2; 15: 1.2; приказ 15: 3; ответы HR 10.11, 2.1<\/td>\n<td style=\"text-align: left;\">уходящая роль, руководитель HR, администраторы сервисов, КДП<\/td>\n<td style=\"text-align: left;\">почта, OneTwoTrip, Яндекс Go<\/td>\n<td style=\"text-align: left;\">получатель дел и замещение не установлены представленными материалами<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Суточные и расходы<\/td>\n<td style=\"text-align: left;\">14: 4.2–4.3, 5.1–5.2, приложение 1; 10: разделы 4 и 10<\/td>\n<td style=\"text-align: left;\">работник, бухгалтерия, финансовый директор<\/td>\n<td style=\"text-align: left;\">авансовый отчёт, ЭДО сервиса<\/td>\n<td style=\"text-align: left;\">нет размера суточных и названных приказов о возмещении; авансовый отчёт не равен счетам сервиса<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение/отмена<\/td>\n<td style=\"text-align: left;\">14: 2.4, 3.6; 3.2; 4.1<\/td>\n<td style=\"text-align: left;\">инициатор, КДП, бухгалтерия, согласующий, администратор сервиса<\/td>\n<td style=\"text-align: left;\">письмо; OneTwoTrip; приказ<\/td>\n<td style=\"text-align: left;\">письмо не адресовано явно администратору, не закреплены изменение приказа и контроль возврата<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Выходной по работе / личная задержка<\/td>\n<td style=\"text-align: left;\">14: 2.6, приложение 2; 02: 3.2, 3.4, 3.7; 10: раздел 4; 12: разделы 4–5<\/td>\n<td style=\"text-align: left;\">руководитель, работник, КДП, бухгалтерия, генеральный директор<\/td>\n<td style=\"text-align: left;\">приказ, согласие, табель; служебная записка<\/td>\n<td style=\"text-align: left;\">личные выходные не равны работе в выходной; нет связи командировки с кадровым оформлением работы<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Такси в командировке<\/td>\n<td style=\"text-align: left;\">14: 2.2.4, 3.1, приложение 1 п. 5; 15: 1.3–1.4, 2.1<\/td>\n<td style=\"text-align: left;\">финансовый директор, HR-директор, администраторы двух сервисов<\/td>\n<td style=\"text-align: left;\">OneTwoTrip / Яндекс Go<\/td>\n<td style=\"text-align: left;\">документы не разграничивают каналы и повторные согласования; в таблице тарифов нет топ-менеджера<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Городское такси и поздняя работа<\/td>\n<td style=\"text-align: left;\">15: 1.3–1.4; 02: 2.3, 3.2; 10: 4.1 и далее; 12: 4.17<\/td>\n<td style=\"text-align: left;\">работник, руководитель, администратор такси, КДП<\/td>\n<td style=\"text-align: left;\">Яндекс Go; табель, приказ<\/td>\n<td style=\"text-align: left;\">оплата такси не подтверждает законность сверхурочных и не заменяет оплату работы<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Доступ и месячный контроль такси<\/td>\n<td style=\"text-align: left;\">15: 2.1–2.4, 2.6; 14: 2.2.2, 3.5; 12: 2.16<\/td>\n<td style=\"text-align: left;\">администраторы, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">аккаунты, история поездок, кадровое сообщение<\/td>\n<td style=\"text-align: left;\">при увольнении Яндекс отключается, OneTwoTrip не описан; нет окончания временного доступа и подтверждения отключения<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Возмещение спорной поездки<\/td>\n<td style=\"text-align: left;\">15: 2.6; 12: 10.4<\/td>\n<td style=\"text-align: left;\">работник, бухгалтерия, работодатель, юрист<\/td>\n<td style=\"text-align: left;\">история поездок, письменное объяснение<\/td>\n<td style=\"text-align: left;\">нарушение регламента не само по себе разрешение удержать полную стоимость из зарплаты<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Исполнитель по ГПХ<\/td>\n<td style=\"text-align: left;\">15: 1.2, 2.3, 2.6; 14: 1.4<\/td>\n<td style=\"text-align: left;\">заказчик, исполнитель, юрист, администратор<\/td>\n<td style=\"text-align: left;\">договор; аккаунт Яндекс Go<\/td>\n<td style=\"text-align: left;\">трудовой и гражданский режимы смешаны; увольнения у исполнителя по ГПХ нет<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Данные и документы в поездке<\/td>\n<td style=\"text-align: left;\">14: 2.2.2; 15: 2.1–2.2; 09: раздел 7; 04: 6.2.14<\/td>\n<td style=\"text-align: left;\">КДП, администратор, юристы, ответственный за данные/ИБ<\/td>\n<td style=\"text-align: left;\">внешние сервисы; почта<\/td>\n<td style=\"text-align: left;\">нет явной проверки основания передачи; перед длительной поездкой требуется передача носителей по 04<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Несчастный случай<\/td>\n<td style=\"text-align: left;\">03: раздел 8; 06: 2.4<\/td>\n<td style=\"text-align: left;\">работник, руководитель, ответственный по ОТ<\/td>\n<td style=\"text-align: left;\">уведомление и расследование по 06<\/td>\n<td style=\"text-align: left;\">поездка входит в сферу правил расследования; правила не переписывать в 14, дать связь (основной разбор OT)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Утверждение и ознакомление<\/td>\n<td style=\"text-align: left;\">14: титул; 15: приказ, лист ознакомления, блок ЭДО; 12: 2.6<\/td>\n<td style=\"text-align: left;\">генеральный директор/уполномоченное лицо, КДП, работник, юрист<\/td>\n<td style=\"text-align: left;\">Диадок, бумага<\/td>\n<td style=\"text-align: left;\">подпись организации не доказывает ознакомление работников; должность в сертификате 15 отличается от роли в приказе<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<ol>\n<li>Где действующий приказ или иной ЛНА о размере и порядке выплаты суточных?<\/li>\n<li>Кто сейчас согласует увеличение бюджета: только HR-директор или также финансовый директор?<\/li>\n<li>Используются ли OneTwoTrip и Яндекс Go одновременно для одной командировки?<\/li>\n<li>Кто администратор и заместитель каждого сервиса?<\/li>\n<li>Кому и в какой форме передают командировки при уходе ответственного работника?<\/li>\n<li>Есть ли проверка специальных гарантий до приказа и покупки билетов?<\/li>\n<li>Как оформляют работу в выходной и дни пути во время командировки?<\/li>\n<li>Кто и в какой срок подтверждает возврат денег при изменении/отмене?<\/li>\n<li>Были ли случаи требования или удержания стоимости такси; кто проводит проверку?<\/li>\n<li>Есть ли исполнители по ГПХ с доступом к сервисам и условия в договорах?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li><strong>ПП № 501, п. 9 — полный текст<\/strong>, включая все условия суточных и ежедневного возвращения домой: в есть только короткие фрагменты; нужен для <a href=\"#/k/KOM-01\">К-KOM-01<\/a> и <a href=\"#/k/KOM-08\">К-KOM-08<\/a>.<\/li>\n<li><strong>ПП № 501, п. 23 — полный текст<\/strong>, включая часть про документы и аванс: в базе есть только фрагмент про три рабочих дня; нужен для <a href=\"#/k/KOM-08\">К-KOM-08<\/a>.<\/li>\n<li><strong>НК РФ ст. 217 ч. 3<\/strong> — необлагаемый предел суточных: в базе нет; нужен бухгалтерии до выбора размера, но налоговый предел не подменяет ЛНА.<\/li>\n<li><strong>ТК РФ ст. 15 и связанные нормы о разграничении трудовых и гражданско-правовых отношений<\/strong> — в доступной базе не найдено; нужно юристам для <a href=\"#/k/KOM-13\">К-KOM-13<\/a>.<\/li>\n<li><strong>ТК РФ ст. 264 и 268 в полном объёме с актуальными исключениями<\/strong> — текст есть в, но в отсутствует; добавить в общую норму политики командировок после юридической сверки.<\/li>\n<li><strong>Актуальные нормы о днях в пути и работе в командировке в выходной<\/strong> — в имеющемся наборе нет полного однозначного текста; нужны для <a href=\"#/k/KOM-06\">К-KOM-06<\/a>.<\/li>\n<li><strong>Договоры OneTwoTrip/Яндекс Go и поручения обработки персональных данных<\/strong> — не нормы закона, но нужны юристам для <a href=\"#/k/KOM-03\">К-KOM-03<\/a>, <a href=\"#/k/KOM-11\">К-KOM-11<\/a> и <a href=\"#/k/KOM-13\">К-KOM-13<\/a>.<\/li>\n<\/ul>", "keysy": [{"id": "К-KOM-01", "slug": "KOM-01", "title": "Размер суточных уходит в неназванный приказ", "imp": "высокая", "docs": ["14"], "meta": [["Документы", "14, пп. 4.2–4.3; приложение 1"], ["Тип", "пробел"], ["Кто решает", "руководитель HR запрашивает приказ; руководитель компании выбирает размер; юристы до утверждения"], ["Важность", "высокая: из комплекта нельзя определить выплату работнику"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 4.3: «Суточные выплачиваются в размере, определённом действующим законодательством, или приказом Общества ООО «[компания]».»<\/li>\n<li>14, п. 4.2: «порядок возмещениях таких расходов определяется в приказах ООО «[компания]»».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В представленном комплекте нет ни размера суточных, ни определённого реквизитами приказа. Это не доказательство, что компания не платит суточные: приказ может храниться отдельно. Формула из черновика улья об оставлении суточных по регламенту не закрывает пробел; налоговый предел нельзя без основания объявить размером выплаты компании.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 4 (ред. от 25.05.2026): «Порядок и размеры возмещения расходов, связанных со служебными командировками, работникам других работодателей определяются коллективным договором или локальным нормативным актом, если иное не установлено настоящим Кодексом, другими федеральными законами и иными нормативными правовыми актами Российской Федерации.» ПП № 501, п. 9, в базе только фрагмент: «Суточные возмещаются работнику за каждый день нахождения в командировке, включая выходные и нерабочие праздничные дни,»; полного порядка исключений в базе нет.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 заменить п. 4.3:<\/p>\n<blockquote>\n<p>4.3. Размеры суточных и порядок их выплаты устанавливаются Приложением № 3 к настоящему Регламенту. До утверждения новой редакции Приложения № 3 применяются размеры и порядок, установленные действующим локальным нормативным актом Общества. Реквизиты такого акта и применяемый размер указываются Бухгалтерией в расчёте каждой командировки. Само по себе освобождение выплаты от налогообложения не определяет размер суточных.<\/p>\n<\/blockquote>\n<p>Приложение № 3 должно быть утверждено одновременно с изменением: территория/валюта, размер за день, условия выплаты, ссылка на применимые исключения после добора полного ПП № 501. Без найденного приказа или решения о размере эта вставка <strong>не готова к введению<\/strong>. В 4.2 вместо неназванных приказов дать реквизиты найденного порядка; в улье 06 и выборе 9 убрать утверждение, что размер есть в 14. Рекомендация: сначала восстановить действующую норму, затем выбирать сохранение или пересмотр, не придумывая сумму.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Бухгалтерия и КДП находят действующий акт и подтверждают его применение.<\/li>\n<li>Руководитель HR готовит таблицу; руководитель компании утверждает сохранение либо пересмотр.<\/li>\n<li>В заявке на поездку расчёт берётся из версии таблицы; бухгалтерия проверяет, машина только считает по утверждённым правилам.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где приказ о суточных и о возмещении расходов; охватывает ли он все виды поездок?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет размера, дней командировок и фактических выплат.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле комплекта; факт отсутствия действующего приказа в компании не установлен.<\/p>"}, {"id": "К-KOM-02", "slug": "KOM-02", "title": "Дополнительные деньги согласуют иначе, чем исходный бюджет", "imp": "высокая", "docs": ["14"], "meta": [["Документы", "14, пп. 2.1, 2.5, 3.2, 4.1"], ["Тип", "противоречие между документами/этапами одного процесса"], ["Кто решает", "руководитель компании (выбор маршрута), руководитель HR и финансовый директор"], ["Важность", "высокая: финансовый контроль возвращается уже на счетах"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.1: «отправив заявку на командировку со сметой расходов Финансовому директору, HR-директору».<\/li>\n<li>14, п. 2.5: «согласовать увеличение бюджета по электронной почте с HR-директором».<\/li>\n<li>14, п. 3.2: «дополнительно согласованных работником с Финансовым директором и HR- директором».<\/li>\n<li>14, п. 4.1: «Администратор сервиса, Бухгалтерия и Финансовый директор».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Разница прямо написана, но не доказывает ошибку: возможно, HR-директору сознательно делегированы дополнительные расходы. Тогда полномочие и предел нужно видеть финансовому директору при оплате. Иначе увеличение уже разрешено, а счёт возвращается на повторный спор; один человек может увеличивать бюджет, который изначально согласовывали двое.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 1 (ред. от 25.05.2026): «иные расходы, произведенные работником с разрешения или ведома работодателя.» Закон не назначает финансового директора согласующим: это выбор компании, а не установленное нарушение.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Без перехода к бюджетам команд заменить 14, п. 2.5:<\/p>\n<blockquote>\n<p>2.5. Увеличение ранее согласованного бюджета оформляется изменённой сметой с указанием причины, суммы увеличения и итогового бюджета. Изменённая смета согласуется Финансовым директором и HR-директором до принятия соответствующих обязательств, а при непредвиденной необходимости — направляется им незамедлительно с подтверждением обстоятельств. Решение доводится до Главного бухгалтера, работника, отвечающего за кадровое делопроизводство, и Администратора сервиса. Согласованный новый бюджет заменяет предыдущий; подтверждение счетов по пункту 4.1 не является повторным согласованием уже разрешённых расходов.<\/p>\n<\/blockquote>\n<p>В 3.2 добавить: согласование невозвратного тарифа включает одновременно изменение бюджета, если оно требуется. Варианты руководителю: сохранить делегирование HR-директору с письменным пределом либо добавить финансового директора (рекомендуется до утверждения лимитов). Выбор 6 в список выборов руководителя компании предлагает бюджет команды и иные маршруты; его вариант А тоже не тождествен действующему п. 2.1. Если выбран бюджет команды, одновременно заменить 2.1, 2.5, 3.2 и права в сервисе, а не применять выбор поверх старого текста.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Автор изменяет одну смету, сохраняя исходную и причину.<\/li>\n<li>Decision Flow после настройки показывает согласующим разницу и итог; до запуска остаётся действующий почтовый маршрут.<\/li>\n<li>Бухгалтерия сверяет счёт с последней согласованной версией; отклонение отправляет на решение, а не подтверждает автоматически.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Исключение финансового директора из п. 2.5 намеренное; есть ли отдельное делегирование?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа превышений, возвратов счетов и времени участников.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в различии маршрутов; средняя в последствиях до ответа о практике.<\/p>"}, {"id": "К-KOM-03", "slug": "KOM-03", "title": "Одну поездку на такси регулируют два несвязанных маршрута", "imp": "высокая", "docs": ["14", "15"], "meta": [["Документы", "14, пп. 2.2.4, 3.1, приложение 1 п. 5; 15, пп. 1.3–1.4, 2.1"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR и финансовый директор; руководитель компании при изменении прав"], ["Важность", "высокая: доступ, тариф и разрешение поездки могут проверяться разными людьми"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.4: «Администратор сервиса устанавливает лимит для аккаунта каждого сотрудника на приобретение билетов, бронирование отелей, заказа такси.»<\/li>\n<li>15, п. 1.3: «на территории других регионов РФ в период командировок сотрудников в такие регионы».<\/li>\n<li>15, п. 2.1: «по согласованию по электронной почте с Финансовым директором или иным уполномоченным Генеральным директором лицом - для сотрудников, имеющих необходимость использовать корпоративное такси в рамках командировки.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 14 есть OneTwoTrip, в 15 — Яндекс Go. Это может быть нормальными параллельными каналами, но ни один документ не говорит, какой выбрать, кто открывает доступ и применяются ли тарифы 14 к Яндекс Go. Отсутствие связи — подтверждённый разрыв текста, а не доказанный двойной расход на практике.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 168 ч. 1 (ред. от 25.05.2026): «расходы по проезду; … иные расходы, произведенные работником с разрешения или ведома работодателя.» Сам закон не требует двух сервисов или повторной визы.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 15 добавить п. 1.5:<\/p>\n<blockquote>\n<p>1.5. Использование корпоративного такси в командировке осуществляется в пределах бюджета командировки и тарифов раздела 5 Приложения № 1 к Регламенту оформления командировок. В заявке на командировку указывается используемый канал: OneTwoTrip либо Яндекс Go. Администратор соответствующего сервиса открывает доступ в пределах согласованного бюджета. Если решение Финансового директора по заявке прямо включает такси, его повторное согласование для открытия доступа в Яндекс Go не требуется. Согласование бюджета не заменяет выполнение технических действий по открытию доступа.<\/p>\n<\/blockquote>\n<p>В 14, п. 3.1 добавить:<\/p>\n<blockquote>\n<p>При использовании Яндекс Go доступ оформляется по Регламенту по порядку использования корпоративного такси с учётом его пункта 1.5. Учёт поездок в обоих сервисах ведётся в составе одной командировки без повторного возмещения одной и той же поездки.<\/p>\n<\/blockquote>\n<p>15, п. 2.1 сохранить с отсылкой к 1.5; льготы городского такси не расширять автоматически. Рекомендуется сохранить оба канала, если они используются; исключить неиспользуемый можно только после ответа HR. В улье 07 заменить тезис, что он ничего не заменяет: он меняет 15 и связан с 14.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Автор сметы выбирает канал и включает такси в бюджет.<\/li>\n<li>Согласующие видят этот расход; администратор выдаёт доступ по решению.<\/li>\n<li>Бухгалтерия сопоставляет отчёты обоих сервисов с одной поездкой; подключение этих сервисов к Decision Flow пока не подтверждено, выгрузки допускаются вручную.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Используются ли оба сервиса для такси сейчас; распространяют ли фактически тарифы 14 на Яндекс Go?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: отчётов обоих сервисов нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в несвязанности правил; средняя в предлагаемом общем маршруте до ответа HR.<\/p>"}, {"id": "К-KOM-04", "slug": "KOM-04", "title": "Передают ведение командировок, но новый владелец и заместитель не определены", "imp": "высокая", "docs": ["14", "15"], "meta": [["Документы", "14, пп. 1.4, 2.1–2.2, 3.4; 15, п. 1.2, приказ п. 3; ответы HR 10.11, раздел 2.1"], ["Тип", "пробел; возможное расхождение с практикой"], ["Кто решает", "руководитель HR предлагает; генеральный директор закрепляет полномочия"], ["Важность", "высокая: после передачи могут остаться заявки без исполнителя"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 1.4: «Администратор сервиса – ответственное лицо – работник ООО «[компания]», ответственный за администрирование сервиса OneTwoTrip».<\/li>\n<li>14, п. 3.4: «а в случае его отсутствия – Администратору сервиса».<\/li>\n<li>Ответы HR 10.11, раздел 2.1, список дел уходящей коллеги: «Командировки - согласование расходов на командировоки в рамках установленных лимитов».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> HR сообщила о передаче дел до ухода коллеги в конце ноября, но кому передают командировки, в ответах не указано. Нельзя называть эту коллегу согласующей по ЛНА: 2.1 назначает финансового директора и HR-директора. В документе есть замена согласующего администратором, но нет замены самого администратора; специалист по закупкам контролирует приказ о такси, что не доказывает его назначение администратором аккаунта.<\/p>\n<p><strong>Закон.<\/strong> ПП № 501, п. 3 (акт от 16.04.2025): «Работники направляются в командировки на основании письменного решения работодателя для выполнения в определенный срок». Правило не позволяет считать технического исполнителя лицом, уполномоченным направить работника.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14, после определения администратора в 1.4:<\/p>\n<blockquote>\n<p>Администратор сервиса и замещающий его работник назначаются приказом Генерального директора. Приказ определяет дату передачи, права доступа и обязанности по открытым заказам. Техническое администрирование не предоставляет права согласования бюджета или направления работников в командировку, если такие полномочия отдельно не предоставлены.<\/p>\n<\/blockquote>\n<p>В 15, п. 1.2 добавить аналогичное правило назначения и замещения администратора такси. В приказе о передаче:<\/p>\n<blockquote>\n<p>Передача считается завершённой после подтверждения принимающим работником перечня открытых заявок, заказов, возвратов и отчётных документов и проверки предоставленных ему прав доступа. Передача личных паролей не допускается. Контроль завершения передачи возложить на HR-директора.<\/p>\n<\/blockquote>\n<p>Не вписывать офис-менеджера вместо администратора без подтверждения. Это рекомендуемый способ передачи, а не утверждение, что такого приказа нет в компании.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель HR сверяет реальные функции уходящей роли с ЛНА и выбирает получателя каждой функции.<\/li>\n<li>Принимающий проверяет доступ и незавершённые поездки; фиксируется акт передачи.<\/li>\n<li>В Decision Flow после внедрения назначаются роли и заместители; до этого используется утверждённый список ответственных.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кому передают командировки, кто сейчас администраторы обоих сервисов и их заместители?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: перечня открытых поездок и трудозатрат нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в содержании ответа HR; средняя в полноте представленных назначений.<\/p>"}, {"id": "К-KOM-05", "slug": "KOM-05", "title": "До оформления приказа не выделена проверка запретов и согласий", "imp": "высокая", "docs": ["12", "14"], "meta": [["Документы", "14, пп. 2.1–2.3; 12, п. 2.6"], ["Тип", "пробел"], ["Кто решает", "руководитель КДП, юристы до утверждения"], ["Важность", "высокая: бюджет может быть согласован для запрещённой поездки"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.2.1: «Работник, отвечающий за кадровое делопроизводство, оформляет Приказ на командировку».<\/li>\n<li>14, п. 2.3: «Работнику перед командировкой необходимо ознакомиться и подписать Приказ на командировку.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Само ознакомление с приказом не равно письменному согласию на командировку или ознакомлению с правом отказа. В 14 нет точки, в которой КДП проверяет запрет и специальные гарантии. Закон действует и без переписывания в ЛНА; по тексту нельзя утверждать, что КДП на деле пропускает проверку или уже нарушает запреты.<\/p>\n<p><strong>Закон.<\/strong> ТК, ред. от 25.05.2026: ст. 167 ч. 2 — «Направление инвалидов в служебные командировки допускается только с их письменного согласия и при условии, если это не запрещено им по состоянию здоровья в соответствии с медицинским заключением»; ст. 259 ч. 1 — «Запрещаются направление в служебные командировки, привлечение к сверхурочной работе, работе в ночное время, выходные и нерабочие праздничные дни беременных женщин.» Ст. 259 ч. 2–3 и 264 содержат специальные гарантии лицам с семейными обязанностями. Ст. 268 ч. 1: «Запрещаются направление в служебные командировки, привлечение к сверхурочной работе, работе в ночное время, в выходные и нерабочие праздничные дни работников в возрасте до восемнадцати лет, за исключением случаев, предусмотренных частями второй и третьей настоящей статьи.» Исключение для творческих профессий требует отдельной проверки юристом; перечня в базе нет.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 перед п. 2.2.1 добавить п. 2.1.1:<\/p>\n<blockquote>\n<p>2.1.1. До оформления приказа и приобретения билетов работник, отвечающий за кадровое делопроизводство, проверяет допустимость направления Работника с учётом статей 167, 259, 264 и 268 Трудового кодекса Российской Федерации. При установленном законом запрете направление не оформляется. Если направление допускается с согласия Работника, до приказа оформляются письменное согласие, письменное ознакомление с правом отказаться и проверка медицинских ограничений в предусмотренных законом случаях. Подпись об ознакомлении с приказом не заменяет указанные документы. Согласующим бюджет передаётся только результат проверки, без сведений о здоровье и семейных обстоятельствах.<\/p>\n<\/blockquote>\n<p>В 2.2.1 дать ссылку на 2.1.1. В ПВТР ничего не дублировать: при необходимости добавить ссылку на проверку в 14 при общем перечне кадровых процедур. Полный перечень категорий берётся КДП из действующей нормы, не определяется помощником с ИИ по анкете.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП по заявке проверяет право на направление и наличие необходимых документов.<\/li>\n<li>Согласующий видит статус допустимости, не основание льготы.<\/li>\n<li>Приказ оформляется после проверки и согласования бюджета; Decision Flow не заменяет медицинскую или юридическую оценку.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли сейчас отдельная проверка до покупки билетов и где хранится результат без раскрытия чувствительных данных?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: фактов нарушений и денежных последствий нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: пробел текста и нормы подтверждены; нарушение на практике не установлено.<\/p>"}, {"id": "К-KOM-06", "slug": "KOM-06", "title": "Личные выходные после поездки не связаны с оформлением работы в выходной", "imp": "высокая", "docs": ["02", "10", "14"], "meta": [["Документы", "14, п. 2.6, приложение 2; 02, пп. 3.2, 3.4–3.7; 10, пп. 4.3, 4.7"], ["Тип", "пробел"], ["Кто решает", "руководитель КДП и юристы; генеральный директор по личной задержке"], ["Важность", "высокая: риск смешать отдых, работу и дни в пути"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.6: «В случае если Работник в личных целях остается в месте командировки на выходные после окончания даты командировки, ему необходимо написать на имя Генерального директора Служебную записку».<\/li>\n<li>14, приложение 2: «прошу дать согласие на приобретение обратного билета из командировки позднее даты окончания командировки».<\/li>\n<li>02, п. 3.2: «оформляется приказом Работодателя на основании: - служебной записки Руководителя структурного подразделения, инициирующего работы за пределами рабочего времени (далее – Инициатора); - письменного согласия Работника.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Записка в приложении 2 разрешает более поздний билет, а не работу в выходной и не продление командировки. Указания, что делать при рабочем поручении в выходной во время поездки, в 14 нет; процедура есть в 02, но не связана с поездкой. Нельзя объявить любой выходной в командировке рабочим; также нельзя заранее объявить любой день в пути личным отдыхом.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 113 ч. 8 (ред. от 25.05.2026): «Привлечение работников к работе в выходные и нерабочие праздничные дни производится по письменному распоряжению работодателя.» ТК ст. 153 ч. 4: «По желанию работника, работавшего в выходной или нерабочий праздничный день, ему может быть предоставлен другой день отдыха.» ПП № 501, п. 9 (акт от 16.04.2025): «Суточные возмещаются работнику за каждый день нахождения в командировке, включая выходные и нерабочие праздничные дни,». Полной нормы об оплате выезда, возвращения и пути в выходной в базе нет, проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 после 2.6 добавить:<\/p>\n<blockquote>\n<p>2.6.1. В заявке отдельно указываются даты служебного поручения, предполагаемые работа в выходные и нерабочие праздничные дни, дни выезда и возвращения, а также дни личного пребывания после окончания командировки. Привлечение к работе в выходной или нерабочий праздничный день оформляется по Политике о сверхурочной работе и работе в выходные и нерабочие праздничные дни с соблюдением требований Трудового кодекса Российской Федерации. Приказ о командировке и согласие на более поздний обратный билет не заменяют требуемые документы о привлечении к такой работе.\n2.6.2. Личное пребывание после окончания командировки само по себе не продлевает срок служебного поручения. Решение по служебной записке определяет дату обратного билета и разрешённые расходы. КДП и Бухгалтерия отдельно определяют учёт дней пути и выплаты по применимым нормам; без такой проверки дни не относятся автоматически к личному отдыху.<\/p>\n<\/blockquote>\n<p>В приложение 2 добавить поля: последний день поручения, личный период, дата возвращения, согласованные расходы. В 02 добавить отсылку к 14 для работы в поездке, без нового согласования уже оформленной работы. Правила оплаты 10 правит VREM; здесь не подменять расчёт одной общей формулой двойной оплаты.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Автор отмечает рабочие и личные даты; КДП сверяет индивидуальный график, не только субботу и воскресенье.<\/li>\n<li>Для работы формируется связанная процедура 02, для личной задержки — записка генеральному директору.<\/li>\n<li>Бухгалтерия получает раздельные основания для табеля и возмещения; спорные дни пути идут юристу.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас оформляют работу и дни пути в выходной; кто согласует расходы при личной задержке?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет графиков, часов и поездок с личной задержкой.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в разрыве процедур; средняя по дням пути до добора нормы.<\/p>"}, {"id": "К-KOM-07", "slug": "KOM-07", "title": "Изменение дат не доведено до приказа, лимита и возврата денег", "imp": "высокая", "docs": ["14"], "meta": [["Документы", "14, пп. 2.4, 3.6, 4.1"], ["Тип", "пробел"], ["Кто решает", "руководитель HR с бухгалтерией и администратором сервиса"], ["Важность", "высокая: отмена может оставить действующий заказ и незакрытый расчёт"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 2.4: «незамедлительно отправить соответствующую информацию об изменениях по электронной почте в Бухгалтерию и работникам, отвечающим за кадровое делопроизводство.»<\/li>\n<li>14, п. 3.6: «оформить новые билеты, аналогично п. 3.1. и 3.2. Регламента, либо оформить возврат билетов и отмену бронирования отеля.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Получатели письма не включают прямо администратора сервиса и согласующего заказ. Пункт о переоформлении не закрепляет подтверждение изменения приказа, возврата денег и корректировки лимита. Это не означает, что возвраты теряются на деле, но уведомление само по себе не закрывает процедуру.<\/p>\n<p><strong>Закон.<\/strong> ПП № 501, п. 3 (акт от 16.04.2025): «Работники направляются в командировки на основании письменного решения работодателя для выполнения в определенный срок». Сроки обработки возвратов и штрафы сервиса в базе законов и договоре отсутствуют; их не устанавливаем по памяти.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 заменить 2.4 и уточнить 3.6:<\/p>\n<blockquote>\n<p>2.4. Об изменении дат или отмене командировки ответственное за её организацию лицо незамедлительно уведомляет КДП, Бухгалтерию, Администратора сервиса и согласующего заказ с указанием номера заявки и изменённых условий. КДП оформляет изменение либо отмену приказа. При изменении бюджета применяется пункт 2.5. Администратор сервиса подтверждает получение задания на изменение заказов.\n3.6. Администратор сервиса организует изменение или отмену заказов до истечения применимого срока бесплатной отмены, а если срок уже истёк — незамедлительно после получения информации. Работник либо согласующий выполняет действия в сервисе в пределах предоставленных ему прав. Администратор фиксирует результат, сумму ожидаемого возврата и удержания по условиям заказа. Бухгалтерия подтверждает фактический возврат или зачёт; до подтверждения соответствующая сумма учитывается как незакрытый расчёт.<\/p>\n<\/blockquote>\n<p>Добавить в 4.1: счета по отменённым заказам сверяются с результатом отмены. Удержания сервиса не перекладываются автоматически на работника: при ущербе действует процедура закона (<a href=\"#/k/KOM-12\">К-KOM-12<\/a>).<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Одна карточка изменения создаёт задачи КДП и администратору, не новое независимое дело.<\/li>\n<li>Администратор подтверждает отмену и ожидаемую сумму; бухгалтерия сверяет поступление.<\/li>\n<li>В журнале остаётся открытый возврат до подтверждения; автоматическое чтение статуса сервиса — только после проверки интеграции.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас проверяет возврат и кому приходит подтверждение отмены?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет отменённых заказов, удержаний и незакрытых возвратов.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле; потеря денег на практике не установлена.<\/p>"}, {"id": "К-KOM-08", "slug": "KOM-08", "title": "Авансовый отчёт имеет срок, а аванс и окончательный расчёт — нет", "imp": "высокая", "docs": ["14"], "meta": [["Документы", "14, пп. 4.1–4.2, 5.1–5.2"], ["Тип", "пробел; лишняя ручная работа"], ["Кто решает", "финансовый директор, бухгалтерия, руководитель HR; юристы по полному ПП № 501"], ["Важность", "высокая: сотрудник знает срок своего отчёта, но не срок возмещения"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>14, п. 4.2: «Работник по возвращении из командировки в течение 3 (трех) рабочих дней обязан предоставить в Бухгалтерию авансовый отчет об израсходованных в связи с командировкой суммах.»<\/li>\n<li>14, п. 5.1: «Бухгалтер на зарплатную карту или иным реквизитам Работника, указанным Работником, перечисляет согласованную сумму для приобретения билетов и бронирования отеля.»<\/li>\n<li>14, п. 5.2: «в течение 3 (трех) рабочих дней обязан предоставить в Бухгалтерию авансовый отчет».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Срок отчёта правильный и не требует сокращения. Но выдача денег прямо описана только при сбое сервиса, без срока; порядок окончательного возмещения отослан к неприложенным приказам. Счета OneTwoTrip и личные расходы работника закрываются разными основаниями — нельзя оплаченный сервисом билет ещё раз возместить работнику; нельзя и считать акт сервиса отчётом за его личные расходы.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 167 ч. 1 (ред. от 25.05.2026): «ему гарантируются сохранение места работы (должности) и среднего заработка, а также возмещение расходов, связанных со служебной командировкой.» ПП № 501 п. 23 (акт от 16.04.2025): «обязан представить работодателю в течение 3 рабочих дней авансовый отчет». В базе цитата п. 23 обрезана; полный порядок аванса, подтверждений и окончательного расчёта нужно добрать. Установленный ЛНА срок по возвращении сохраняем, не выдавая неполную цитату за полную.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 сохранить первую фразу 4.2, после неё добавить:<\/p>\n<blockquote>\n<p>В отчёте раздельно отражаются расходы, оплаченные Обществом непосредственно поставщикам, и расходы, оплаченные Работником. Повторное возмещение расходов, оплаченных Обществом, не производится. Бухгалтерия при получении отчёта подтверждает его приём либо сообщает перечень недостающих документов и согласованный срок их представления. Бухгалтерия сообщает Работнику сумму окончательного расчёта и дату выплаты в соответствии с действующим порядком возмещения расходов Общества.<\/p>\n<\/blockquote>\n<p>В 5.1 добавить:<\/p>\n<blockquote>\n<p>Перечисление согласованного аванса производится до приобретения Работником билетов и бронирования отеля. Сбой сервиса не возлагает на Работника обязанность финансировать командировку за свой счёт.<\/p>\n<\/blockquote>\n<p>Одновременно найти приказ из 4.2 и включить его <strong>действующие сроки<\/strong> в единый раздел 4; если сроков в нём нет, финансовый директор предлагает их руководителю компании до введения редакции. Новый произвольный числовой срок здесь не выбран. В 5.2 заменить дублирующее правило ссылкой на 4.2, сохранив перечень подтверждений после сверки полного ПП № 501.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>После возвращения работник сдаёт отчёт в существующий срок; процесс напоминает по подтверждённому рабочему календарю.<\/li>\n<li>Бухгалтерия сверяет источник каждой оплаты и сообщает недостающие документы.<\/li>\n<li>У отчёта есть статус приёма, дата расчёта и подтверждение выплаты, а не только отметка о подаче.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой приказ задаёт авансы и срок возмещения; где принимают отчёт и фиксируют выплату?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет сроков фактической выплаты и сумм личных расходов.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в тексте; средняя в неполноте действующего порядка до получения приказов.<\/p>"}, {"id": "К-KOM-09", "slug": "KOM-09", "title": "В городе и в командировке разные основания для корпоративного такси", "imp": "высокая", "docs": ["02", "14", "15"], "meta": [["Документы", "15, п. 1.4; 14, п. 3.1, приложение 1 п. 5; 02, пп. 3.2–3.7"], ["Тип", "расходится с практикой/выбор руководителя не перенесён в ЛНА"], ["Кто решает", "руководитель компании (выбор 10), руководитель HR и юристы"], ["Важность", "высокая: «после 22:00» не означает автоматически согласованную сверхурочную работу"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 1.4: «поездки из офиса до места жительства сотрудника в случае задержки сотрудника для работы в офисе после 22.00».<\/li>\n<li>15, п. 1.4: «такси от аэропорта/жд вокзала до отеля и обратно в случае направления сотрудника в командировку».<\/li>\n<li>02, п. 3.2: «оформляется приказом Работодателя на основании: - служебной записки Руководителя структурного подразделения, инициирующего работы за пределами рабочего времени (далее – Инициатора); - письменного согласия Работника.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> 15 разрешает поездку домой после любой задержки после 22:00, а 02 требует отдельные документы для работы сверхурочно или в выходной. Такси не заменяет приказ, согласие и табель. В черновике выбора 10 вариант Б сужает правило до согласованной сверхурочной/работы в выходной; это не текущий текст и станет правилом только после решения и изменения 15.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 96 (ред. от 25.05.2026): «Ночное время - время с 22 часов до 6 часов.» ТК ст. 99 ч. 1 в той же базе: «Сверхурочная работа - работа, выполняемая работником по инициативе работодателя за пределами установленной для работника продолжительности рабочего времени». ТК ст. 113: «Работа в выходные и нерабочие праздничные дни запрещается, за исключением случаев, предусмотренных настоящим Кодексом.»<\/p>\n<p><strong>Стало (предлагается).<\/strong> Если руководитель компании выберет вариант Б, заменить абзац о поездке домой в 15, п. 1.4:<\/p>\n<blockquote>\n<p>поездки из офиса до места жительства Работника, если сверхурочная работа либо работа в выходной или нерабочий праздничный день оформлена по Политике о сверхурочной работе и работе в выходные и нерабочие праздничные дни и окончена после 22.00; для поездки используется лимит, установленный в аккаунте.<\/p>\n<\/blockquote>\n<p>Добавить в 15:<\/p>\n<blockquote>\n<p>Использование такси после 22.00 не подтверждает факт привлечения к сверхурочной работе или работе в выходной день и не заменяет приказ, письменное согласие Работника, если оно требуется, и запись рабочего времени.<\/p>\n<\/blockquote>\n<p>Если выберут А, оставить городской маршрут только для деловых поездок и командировки; если В — добавить утверждённую месячную сумму и период её действия. Числа без выгрузки не назначать. В каталоге процесса заменить «заранее не согласуются» на действующий персональный лимит до принятия нового ЛНА.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>До поздней работы руководитель оформляет работу по 02; поездка домой запускается по выбранному варианту политики.<\/li>\n<li>КДП и табель подтверждают основание, администратор такси проверяет лимит.<\/li>\n<li>Бухгалтерия сверяет поездку с журналом такси и оформленной работой; поездка не меняет оплату труда.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Вариант 10 А, Б или В; что сейчас делают при поездке домой после 22:00 без оформленной сверхурочной?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет истории поездок и табеля по времени.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в различии текстов; средняя в действующей практике.<\/p>"}, {"id": "К-KOM-10", "slug": "KOM-10", "title": "Лимит такси привязан к человеку, а контроль — месячный", "imp": "средняя", "docs": ["15"], "meta": [["Документы", "15, пп. 1.4, 2.1–2.4; каталог процессов "], ["Тип", "расходится с практикой/лишняя ручная работа"], ["Кто решает", "руководитель компании (выбор 6 и 10), финансовый директор и руководитель HR"], ["Важность", "средняя: до поездки нет единого лимита на конкретную поездку"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 1.4: «только в пределах, согласованных в порядке п. 2.1. для конкретного сотрудника лимитов».<\/li>\n<li>15, п. 2.1: «установленных лимитов для использования».<\/li>\n<li>Каталог: «отчёт корпоративного аккаунта раз в месяц» и «поездку дороже лимита руководитель группы объясняет».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В ЛНА лимит персональный и заранее установлен. В каталоге описан разбор после поездки, а в черновике варианта Б выборов 6 — лимит команды. Это разные контрольные точки. Если на деле поездка заранее не согласуется, это нужно подтвердить и изменить ЛНА; пока нельзя выдавать каталог за практику.<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе нет, проверить юристам: закон не задаёт корпоративный лимит городского такси и не заменяет решение компании.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 15, п. 2.1 заменить последний абзац:<\/p>\n<blockquote>\n<p>Администратор корпоративного такси вносит в Аккаунт лимит и срок его действия по утверждённому решению. В решении указываются Работник или команда, цель поездок, период, сумма или иной предел и лицо, согласовавшее лимит. Поездка сверх лимита блокируется либо направляется на предварительное решение согласно выбранному порядку согласований. Постфактум объяснение не заменяет предварительного решения, если иное прямо не установлено решением.<\/p>\n<\/blockquote>\n<p>Вместо каталожного «дороже лимита» внести выбранный маршрут из список выборов руководителя компании: выбор 6: Б — командный лимит, сверх него деньги решает финансовый директор; В — единый годовой бюджет команды и ежемесячный отчёт. Выбор 10 отдельно определяет цели такси. Пункты 1.4 и 2.1, каталог 07 и процесс должны быть изменены одной редакцией; автоматические зелёные и красные флаги вводятся только после определения источника лимита.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель подаёт запрос с целью и периодом; решающий утверждает предел.<\/li>\n<li>Администратор вносит его в аккаунт, журнал хранит версию лимита.<\/li>\n<li>Каждая поездка проверяется сервисом; отчёт месяца показывает использованный остаток и исключения.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли персональные лимиты сейчас и кто решает поездку сверх них до, а не после заказа?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: выгрузки по лимитам и поездкам нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в различии ЛНА и каталога; низкая в практике до ответа HR.<\/p>"}, {"id": "К-KOM-11", "slug": "KOM-11", "title": "При увольнении отключают Яндекс Go, но не описан OneTwoTrip", "imp": "высокая", "docs": ["12", "14", "15"], "meta": [["Документы", "15, п. 2.3; 14, пп. 2.2.2, 3.5; 12, п. 2.16"], ["Тип", "пробел"], ["Кто решает", "руководитель КДП и администраторы сервисов; юристы по данным"], ["Важность", "высокая: доступ к сервису может остаться после прекращения работы"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 2.3: «В случае увольнения Сотрудника, которому открыт доступ к использованию Корпоративного такси в приложении Яндекс.Такси (Яндекс Go), Администратор корпоративного такси не позднее даты увольнения Сотрудника удаляет его данные в Аккаунте.»<\/li>\n<li>14, п. 2.2.2: «проверяет наличие аккаунтов командированных работников в Сервисе OneTwoTrip».<\/li>\n<li>14, п. 3.5: «открывает доступ к Сервису OneTwoTrip работникам».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Явная дата отключения есть только для Яндекс Go. OneTwoTrip тоже хранит аккаунты, а 14 не связывает удаление с увольнением. Это пробел правила, не факт оставшегося доступа. Кроме увольнения, не описаны окончание временного доступа и отзыв доступа после отменённой поездки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 88 (ред. от 25.05.2026): «разрешать доступ к персональным данным работников только специально уполномоченным лицам, при этом указанные лица должны иметь право получать только те персональные данные работника, которые необходимы для выполнения конкретных функций». ФЗ № 152‑ФЗ, ст. 6 ч. 3 (ред. в ): «Оператор вправе поручить обработку персональных данных другому лицу с согласия субъекта персональных данных, если иное не предусмотрено федеральным законом, на основании заключаемого с этим лицом договора». Порядок хранения и удаления в сервисах нужно проверить юристам по договорам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 14 добавить п. 2.2.5:<\/p>\n<blockquote>\n<p>2.2.5. КДП направляет Администратору сервиса сообщение о дате увольнения или прекращения необходимости доступа Работника. Администратор сервиса в тот же рабочий день, но не позднее даты увольнения, прекращает персональный доступ Работника к Сервису OneTwoTrip и фиксирует результат. Для временного доступа срок указывается при открытии; по истечении срока доступ прекращается автоматически либо вручную с фиксацией результата.<\/p>\n<\/blockquote>\n<p>В 15 п. 2.3 заменить «В случае увольнения» на новый оборот: при увольнении или прекращении необходимости доступа; в 2.4 включить администраторов обоих сервисов в месячную сверку. КДП не передаёт сервису лишние данные, а договоры с операторами и поручения обработки проверяют юристы; в ЛНА не копировать реквизиты персональных данных.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Событие увольнения в 1С создаёт задачу двум администраторам; до интеграции КДП направляет сообщение.<\/li>\n<li>Каждый администратор отключает доступ и оставляет отметку.<\/li>\n<li>Руководитель КДП ежемесячно сверяет список активных аккаунтов с действующими работниками и открытыми поездками.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли сейчас индивидуальные аккаунты в OneTwoTrip и кто удаляет их при увольнении?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет списка аккаунтов и сроков фактического удаления.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в пробеле текста; действующий доступ не установлен.<\/p>"}, {"id": "К-KOM-12", "slug": "KOM-12", "title": "Возмещение стоимости нарушенной поездки нельзя превращать в автоматическое удержание", "imp": "высокая", "docs": ["12", "15"], "meta": [["Документы", "15, п. 2.6; 12, п. 10.4"], ["Тип", "правовой риск; пробел процедуры"], ["Кто решает", "юристы до утверждения; работодатель по процедуре проверки ущерба"], ["Важность", "высокая: требование полной стоимости может стать удержанием из зарплаты"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>15, п. 2.6: «Сотрудник обязуется компенсировать Организации стоимость поездки на такси в случае, если будет установлено осуществление поездки с нарушением Сотрудником требований настоящего Регламента.»<\/li>\n<li>12, п. 10.4: «Работник и Работодатель возмещают друг другу только прямой действительный ущерб».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> 15 не различает ошибку в заказе, нарушение лимита, умысел и фактический ущерб, не устанавливает проверку, объяснение и предел взыскания. Нельзя автоматически удержать всю стоимость поездки только по отметке администратора. Факт незаконного удержания или ущерба не установлен; это риск формулировки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 137 (ред. от 25.05.2026): «Удержания из заработной платы работника производятся только в случаях, предусмотренных настоящим Кодексом и иными федеральными законами.» Т
