е.<\/li>\n<li>Из бумажных листов, Диадока и кадровых папок собирает подтверждения; проверяет комплект, а не только наличие PDF. Известную выгрузку сначала проверяет человек, интеграция не обещана.<\/li>\n<li>Decision Flow показывает КДП только недостающее подтверждение и причину: не направлено, не подписано, ошибочная редакция, доказательство не найдено. Прочтение файла не отмечает как подпись.<\/li>\n<li>КДП организует ознакомление сейчас либо разбирает отказ/сбой с юристом, сохраняя фактические даты.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где единый учет бумажных и электронных ознакомлений и как связаны файлы подписи с редакцией ЛНА? Есть реестр / отдельные списки / только папки; показать обезличенный пример достаточного комплекта.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет выгрузки подписей, состава применимых актов и времени ручного поиска. Число неподписавших по отметке в одном PDF не выводим.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по содержимому копий; средняя по полноте фактического учета — папки и бумажные листы не проверены.<\/p>"}, {"id": "К-SKVOZ-06", "slug": "SKVOZ-06", "title": "Ссылки ведут к приказам и правилам, которых нет в полученном комплекте", "imp": "высокая", "docs": ["04", "08", "09", "12", "14", "16"], "meta": [["Документы", "12, пп. 3.2.26, 4.17, 5.13, 9.2, 2.16.5; 14, пп. 4.2–4.3; 04, пп. 5.2.2, 7.1; 09, пп. 1.4, 9.1; 08, пп. 5.3, 8.11.7, 12.1; шапки 02–11, 13–14, 16"], ["Тип", "пробел"], ["Кто решает", "руководитель HR организует добор; КДП, юристы, ИБ и специалист ОТ подтверждают свои документы"], ["Важность", "высокая: применение выплаты, режима или обязанности зависит от недоступного основания"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 4.17: «Перечень должностей с ненормированным рабочим графиком подлежит утверждению и изменению приказом Генерального директора».<\/li>\n<li>14, п. 4.3: «Суточные выплачиваются в размере, определённом действующим законодательством, или приказом Общества ООО «[компания]»».<\/li>\n<li>08, п. 12.1: «Единые требования к планированию, разработке, согласованию, утверждению, введению, хранению, актуализации и отмене всех видов внутренних документов СУОТ в Организации устанавливаются \"Процедурой управления документацией СУОТ …».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Среди присланных файлов нет полного набора оснований, на которые опираются кадровые действия; отсутствие в подборке не равно отсутствию в компании. На встрече 11.11 КДП говорила о 50–60 положениях, с которыми знакомят до приёма; прислано 16, часть оснований может быть среди остальных. У 14 получены страницы приложения, а не весь пакет приказа; у 09 номер вводящего приказа не виден. Приказ о такси № 23-Т/2022 <strong>есть<\/strong> в 15, повторно запрашивать его как потерянный нельзя. Размер суточных и НРД не придумываем, отраслевые решения уже есть в <a href=\"#/k/KOM-01\">К-KOM-01<\/a>, <a href=\"#/k/OTP-17\">К-OTP-17<\/a>, <a href=\"#/k/DISC-08\">К-DISC-08<\/a>, <a href=\"#/k/OT-13\">К-OT-13<\/a>; здесь один перечень добора вместо несогласованных запросов от разных авторов.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Что добрать или подтвердить<\/th>\n<th style=\"text-align: left;\">Где упомянуто<\/th>\n<th style=\"text-align: left;\">Для чего и кому ответить<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Полные приказы введения/изменения 02, 10, 14, 16, включая отмену редакций<\/td>\n<td style=\"text-align: left;\">Грифы в реестре А; 14 начинается с третьей страницы пакета<\/td>\n<td style=\"text-align: left;\">КДП/юристам: установить состав редакции и переход; <a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>, <a href=\"#/k/KOM-20\">К-KOM-20<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Приказы введения 03/06/08/11, 07/13; 04/05 — владельцам ИБ; вводящий приказ 09<\/td>\n<td style=\"text-align: left;\">Грифы; 09, 1.4<\/td>\n<td style=\"text-align: left;\">Подтвердить введение и назначенных исполнителей; не требовать повторно имеющиеся приказы 12/15<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Перечень должностей с НРД<\/td>\n<td style=\"text-align: left;\">12, 4.17<\/td>\n<td style=\"text-align: left;\">КДП: право на дополнительный отпуск; <a href=\"#/k/OTP-17\">К-OTP-17<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Действующий регламент критичных инцидентов<\/td>\n<td style=\"text-align: left;\">12, 3.2.26, 5.13<\/td>\n<td style=\"text-align: left;\">Руководителю процесса и КДП: график, реагирование, учет; <a href=\"#/k/DISC-08\">К-DISC-08<\/a>, <a href=\"#/k/VREM-09\">К-VREM-09<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Приказ/ЛНА о суточных и возмещении расходов<\/td>\n<td style=\"text-align: left;\">14, 4.2–4.3<\/td>\n<td style=\"text-align: left;\">Бухгалтерии/КДП: источник расчета, <a href=\"#/k/KOM-01\">К-KOM-01<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Коллективный договор, соглашения — либо подтверждение отсутствия применимых<\/td>\n<td style=\"text-align: left;\">12, 3.5; 03, раздел 2<\/td>\n<td style=\"text-align: left;\">Юристам: условия и процедура принятия ЛНА; отсутствие договора не объявлять нарушением<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Должностные инструкции, закрепление кадровых и контрольных полномочий<\/td>\n<td style=\"text-align: left;\">12, 9.2; 09, 9.1; 08, 7.3.1<\/td>\n<td style=\"text-align: left;\">КДП, юристам и владельцам: обязанности и границы доступа; сами инструкции не считаем всеобщей обязательной формой<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Установленный образец обходного листа и маршрут<\/td>\n<td style=\"text-align: left;\">12, 2.16.5<\/td>\n<td style=\"text-align: left;\">КДП: увольнение/доступы, <a href=\"#/k/PRIEM-14\">К-PRIEM-14<\/a> и 16<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Приказы о назначении ответственных и замещении, основания полномочий подписантов<\/td>\n<td style=\"text-align: left;\">03, 1.3; 04, 7.1; 15, приказ; 07, 3.2<\/td>\n<td style=\"text-align: left;\">Владельцам функций: не назначать за них людей, <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a> и 07<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Список третьих лиц с доступом, формы обязательств/согласий, схема доступа<\/td>\n<td style=\"text-align: left;\">04, 5.2.2 и прил. 1; 05, прил. 1; 09, 3.1.9, 8.1<\/td>\n<td style=\"text-align: left;\">ИБ/юристам: подтвердить действующие основания; HR не переписывает содержание<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Общий ЛНА ЭДО, перечни документов/категорий и порядок подписания<\/td>\n<td style=\"text-align: left;\">Сопоставление 12, 1.3 и 5.5–5.7, с 14, 1.4<\/td>\n<td style=\"text-align: left;\">Юристам/КДП: <a href=\"#/k/DISC-01\">К-DISC-01<\/a>–03 и <a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Политика ОТ, процедуры документации, профзаболеваний и микротравм и прочие ссылки СУОТ<\/td>\n<td style=\"text-align: left;\">08, 5.3, 8.11.7, 12.1 и места из <a href=\"#/k/OT-13\">К-OT-13<\/a><\/td>\n<td style=\"text-align: left;\">Специалисту ОТ: полный перечень у него, не заводить параллельный реестр HR<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Закон.<\/strong> ТК ст. 101 ч. 1, ред. 25.05.2026: «Перечень должностей работников с ненормированным рабочим днем устанавливается коллективным договором, соглашениями или локальным нормативным актом, принимаемым с учетом мнения представительного органа работников». Это подтверждает значение конкретного основания, но не устанавливает обязательность каждого названного в таблице документа. Порядок по иным строкам проверяется по соответствующей норме, не по аналогии с НРД.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В реестре по предлагаемому ПВТР 13.9 сделать отдельное поле <strong>Ссылочные основания<\/strong>. В приказ о приведении комплекта ЛНА в порядок вставить:<\/p>\n<blockquote>\n<p>Руководителю HR организовать получение актуальных копий документов, перечисленных в приложении к настоящему приказу, у владельцев соответствующих процессов. Руководителю кадрового делопроизводства по каждому основанию указать реквизиты, редакцию, место хранения и связанное кадровое действие. Если документ не представлен, зафиксировать статус проверки и передать вопрос владельцу процесса и юристу; отсутствие копии не считать отменой документа и основанием для уменьшения гарантий работника. До утверждения изменения ссылку заменять только после подтверждения действующего основания.<\/p>\n<\/blockquote>\n<p>Срок исполнения и владельцев приложение получает при согласовании HR; новый универсальный срок без оценки объема не навязываем. В 14, 4.3, ставится решение <a href=\"#/k/KOM-01\">К-KOM-01<\/a>, а не еще одна редакция суточных; в 12, 4.17, — <a href=\"#/k/OTP-17\">К-OTP-17<\/a>; в СУОТ — <a href=\"#/k/OT-13\">К-OT-13<\/a>.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП направляет внутренним владельцам одну таблицу недостающих оснований со ссылками на пункты, не запрос всех документов компании заново.<\/li>\n<li>Владелец отмечает: действует, заменен, не принимался либо требует проверки, прикладывает копию/реквизиты; доступ к ИБ-материалам остается ограниченным.<\/li>\n<li>Юрист решает, какую ссылку исправить и нужен ли новый акт; Decision Flow показывает кадровому исполнителю проверенное основание или вопрос владельцу, не выдуманный документ.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли общий перечень сверх присланной подборки и кто выдаст действующие версии по строкам таблицы? Варианты: общий архив / раздельно у владельцев / нужно собрать.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет времени поиска и частоты кадровых действий без доступного основания.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по отсутствию отдельных файлов среди переданных; средняя по фактической неполноте внутреннего архива.<\/p>"}, {"id": "К-SKVOZ-07", "slug": "SKVOZ-07", "title": "Исторический подписант остался в рабочих формах после смены руководства", "imp": "средняя", "docs": ["02", "07", "10", "12", "14", "15", "16"], "meta": [["Документы", "07, п. 3.2, приложение 2; 16, приложения 1–2; 12, приказ пп. 3–4; 15, приказ и блок ЭДО; 14, 02, 10, титулы/подписи"], ["Тип", "устарело"], ["Кто решает", "КДП и HR проверяют шаблоны; юристы подтверждают полномочия; работодатель утверждает изменения"], ["Важность", "средняя: форма может уйти прежнему адресату или содержать неверного подписанта"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>07, п. 3.2: «представляет его на подпись генеральному директору Общества или иному уполномоченному им лицу».<\/li>\n<li>16, приложения 1–2, адресная строка: «Генеральному директору» (страницы PDF 3–4; роль и фиксированное имя адресата сверены с изображениями обеих страниц; строка согласования руководителя — пустой шаблон; имя не переносится).<\/li>\n<li>В 07, приложение 2, после роли генерального директора напечатан конкретный исторический подписант; в 16 — конкретный адресат, а не пустое поле. В 15 текст приказа содержит роль генерального директора, сертификат — советника генерального директора; имена не воспроизводятся.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Программная сверка подписей без вывода имён (команда ниже) даёт три разных подписанта по периодам: 05, 07, 13, 16 (2018–2021; то же лицо на титуле скана 09, 2017); 15, 12, 03, 06, 08, 11 (2022–2023); 14, 02, 10 (2024–2025); 01 утверждён решением единственного участника, в 04 подписант программой не найден. Формы 07 и 16 сохраняют адресата первого периода. Подписант сменился между 25.01.2023 (последние документы второго периода) и 20.11.2024 (первая подпись третьего); после смены в присланном комплекте только 14, 02 и 10. Более поздних редакций ПВТР, 16, 07, 13 и остальных среди присланных нет, а новые 02 и 10 с ними расходятся (<a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>, <a href=\"#/k/VREM-07\">К-VREM-07<\/a>); пересматривались ли они на деле, спросить КДП. Точных дат смены и нынешних полномочий из этого получить нельзя; исторический акт не становится недействительным только потому, что руководитель сменился. В приказах 12/15 закреплены конкретные исполнители прежнего периода. Сверка программой без вывода имён (расчёт программой): люди, которым приказ 29/2022 (пп. 3–4) и приказ 23-Т/2022 (пп. 2–3) поручают ознакомление и контроль, не совпадают ни с кем из названных в ответах HR 10.11. Это не значит, что должности упразднены; значит, поручения по ознакомлению и контролю адресованы прежним людям, а действующее назначение надо подтвердить. Несоответствие ролей в 15 отдельно разобрано в <a href=\"#/k/KOM-14\">К-KOM-14<\/a>, здесь только общий контроль рабочих форм и назначений, без нового вывода о недействительности. По встрече 11.11 заявка на отпуск идёт через 1С Кабинет сотрудника; если бумажные бланки 16 уже не применяются, их правка нужна только в новой редакции 16 (<a href=\"#/k/OTP-03\">К-OTP-03<\/a>), а не отдельным приказом.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 8 ч. 1, ред. 25.05.2026: «Работодатели, за исключением работодателей - физических лиц, не являющихся индивидуальными предпринимателями, принимают локальные нормативные акты, содержащие нормы трудового права … в пределах своей компетенции». Правила о полномочиях органа общества, доверенности и прекращении полномочий в нужном объеме в базе задания не найдены: проверить юристам по документам компании; старый сертификат и имя не заменяют такой проверки.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 07, приложение 2, заменить только фиксированное имя под ролью блоком:<\/p>\n<blockquote>\n<p>Генеральный директор / иное уполномоченное лицо Общества\nДолжность <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em>_ Основание полномочий <\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_\nПодпись <\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><strong><em> Расшифровка подписи <\/em><\/strong><strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>___<\/p>\n<\/blockquote>\n<p>В 16, приложениях 1–2, убрать фиксированное имя адресата, оставить роль и наименование работодателя. Для актуальных форм HR рекомендует роль без фамилии; лицо и основание полномочий определяются <strong>при оформлении<\/strong>, не навсегда в бланке. В будущий приказ об изменении ЛНА включить:<\/p>\n<blockquote>\n<p>Руководителю кадрового делопроизводства проверить актуальность адресатов и подписантов рабочих форм, а также назначение исполнителей и контролирующих лиц по связанным приказам. Изменение данных рабочего шаблона не изменяет исторический экземпляр утвержденного документа и не наделяет лицо полномочием подписывать документ. При изменении полномочия оформить соответствующее распорядительное решение.<\/p>\n<\/blockquote>\n<p>Подлинники старых приказов и подписей не редактировать, автоматически переутверждать все ЛНА из-за смены руководителя не предлагать. По 15 — проверка <a href=\"#/k/KOM-14\">К-KOM-14<\/a>, а не исправление роли в сертификате задним числом.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП сверяет активные шаблоны с подтвержденным юристами перечнем полномочий по каждому работодателю.<\/li>\n<li>Для исходящего документа выбирает роль, действующее уполномоченное лицо и основание; Decision Flow не копирует подпись из образца.<\/li>\n<li>Исторический экземпляр хранится неизменным; новый шаблон получает дату версии, старый исключается из рабочего доступа.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие формы реально используются и где проверяют полномочия? Варианты: централизованная библиотека / копии в папках / формирование системой. Подтвердить действующее назначение функций, не присылать имена для отчета.<\/p>\n<p><strong>Цена вопроса.<\/strong> 13 из 16 документов датированы раньше 20.11.2024 — первой даты подписи в комплекте лица, подписавшего документы 2024–2025 годов; с этой даты и позже — только 14, 02 и 10 (расчёт программой). Это объём документов для проверки адресатов и назначений, не число ошибок. Количество оформлений по старым бланкам и возвратов на переподписание не считали: данных нет. Программная сверка без вывода имен (расчёт программой); результат — различие подписантов периодов, не дата прекращения полномочий.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по разным подписантам и фиксированным именам в формах; средняя по использованию старых шаблонов сегодня и юридическим полномочиям.<\/p>"}, {"id": "К-SKVOZ-08", "slug": "SKVOZ-08", "title": "Общая кадровая работа группы не определяет, чей ЛНА применять", "imp": "высокая", "docs": ["02", "07", "10", "12"], "meta": [["Документы", "02, п. 1.5; 10, п. 1.2; 12, пп. 1.1–1.6; 07, п. 1.3; шапки 01–16; описание КДП по формам КДП"], ["Тип", "пробел"], ["Кто решает", "руководитель HR и КДП уточняют охват; юристы проверяют; каждый работодатель принимает свои решения"], ["Важность", "высокая: можно выбрать чужой порядок, согласующего или бланк работодателя"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 1.2: «Настоящее Положение распространяется на лиц, принятых на работу в Организацию и осуществляющих трудовую деятельность на основании заключенных с ними трудовых договоров».<\/li>\n<li>07, п. 1.3: «Действие настоящего Положения распространяется на принятых на работу в Общество работников, которым установлено испытание при приеме на работу».<\/li>\n<li>Описание КДП: «Журнала в 1С нет – в бумажном за 10,5 мес порядка 605 документов по [компания], и 62 документа по [вторая компания].»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Полученные ЛНА оформлены для ООО [компания], но кадровая практика охватывает и другие компании группы: это прямо видно в описании ВУ и ответах HR 10.11, разделы 1.2, 2.1, 3.1. Практика уже различает работодателей: по ответам 10.11, раздел 3.1, работу в выходной для сотрудников [компания] и [вторая компания] согласуют с разными согласующими, а подбор (раздел 1.2) идёт и для [другая компания группы]. Но из общего HR Space, команды КДП и одинаковых сервисов не следует, что один работодатель ввел акты другого. Не установлено и обратное — что по другим компаниям нет собственных актов: их не запрашивали в этой группе. <a href=\"#/k/VU-11\">К-VU-11<\/a> закрывает реквизиты форм ВУ; этот кейс — выбор <strong>работодателя и применимых правил до любого кадрового события<\/strong>.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 8 ч. 1, ред. 25.05.2026: «Работодатели … принимают локальные нормативные акты … в пределах своей компетенции». ТК ст. 135 ч. 1, та же редакция: «Заработная плата работнику устанавливается трудовым договором в соответствии с действующими у данного работодателя системами оплаты труда». Общая принадлежность к группе не названа в этих нормах основанием подмены работодателя; конкретные механизмы принятия/полномочий проверяют юристы, не делаем вывод об автоматическом распространении.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>1.8<\/strong> (после проекта 1.7 из <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>):<\/p>\n<blockquote>\n<p>1.8. Настоящие Правила регулируют трудовые отношения с ООО «[компания]» как работодателем. Совместное использование кадровых ресурсов и информационных систем с иными организациями само по себе не распространяет настоящие Правила на их работников. При оформлении кадрового события КДП устанавливает работодателя по трудовому договору и применяет действующие у этого работодателя локальные акты, формы и полномочия согласующих лиц.<\/p>\n<\/blockquote>\n<p>В реестр 13.9 добавить обязательный разрез работодателя; для иных компаний сначала получить их перечни актов и подтверждение принятия, не переименовывать полученные ЛНА автоматической заменой названия. В 02/10/14/15/16 достаточно действующей отсылки к Обществу и подтвержденного выбора работодателя в процессе; массовое дублирование одинаковой оговорки не нужно. Содержание документов 01/04/05/09 проверяют их владельцы, включая границы доступа между компаниями.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП при начале события устанавливает работодателя и категорию работника; при нескольких трудовых отношениях обрабатывает каждое отдельно.<\/li>\n<li>Decision Flow подбирает утвержденные именно этим работодателем редакцию, маршрут, бланк и подпись; до внедрения выбор проверяет КДП вручную.<\/li>\n<li>Если основания нет в подборке, вопрос идет владельцу и юристу, а не получает статус применить правила головной компании по умолчанию.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Для каких работодателей строим процесс? Варианты: только [компания] / единый интерфейс с раздельными актами / иное подтвержденное юристами устройство. Есть ли отдельные приказы и ЛНА остальных компаний?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; объем другой компании в описании ВУ — указание на охват, не основание рассчитывать число работников, стоимость риска или трудоемкость всех кадровых операций.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по работодателю полученных актов и работе КДП с другой компанией; средняя по устройству принятия ЛНА в группе — подтверждающие документы не получены.<\/p>"}, {"id": "К-SKVOZ-09", "slug": "SKVOZ-09", "title": "Два положения о тайне оставляют КДП без подтвержденного комплекта для новичка", "imp": "высокая", "docs": ["04", "05", "12"], "meta": [["Документы", "04, пп. 1.3–1.4, 1.27, 5.1, приложение 1; 05, пп. 1.1–1.3, 3.2, приложение 1; 12, пп. 2.10, 3.2.9"], ["Тип", "противоречие между документами"], ["Кто решает", "ИБ и юристы определяют состав действующих документов; HR/КДП меняют только кадровый перечень после решения"], ["Важность", "высокая: ознакомление и обязательство могут ссылаться на разный объем правил"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>04, п. 1.4: «Настоящее Положение применяется наряду и с учетом положений иных локальных нормативных актов Общества в сфере режима коммерческой тайны».<\/li>\n<li>04, п. 1.27: «Если до вступления в силу настоящего Положения действовали иные правила, которые регулировали режим коммерческой тайны, то данные правила являются действительными и надлежащими до момента принятия данного Положения».<\/li>\n<li>05, приложение 1: «Форма обязательства о соблюдении Положения»; связь приложения с Положением о конфиденциальности информации и коммерческой тайне сверена по.<\/li>\n<li>04, п. 5.1.1: «Ознакомление Работника под роспись с текстом настоящего Положения и иными локальными нормативными актами, регламентирующими в Обществе вопросы, связанные с Режимом коммерческой тайны».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Документ 04 задает приоритет и окончание прежних правил в части коммерческой тайны, но не называет 05 по реквизитам; 05 регулирует также более широкую конфиденциальную информацию и имеет собственную форму обязательства. Поэтому нельзя ни признать весь 05 отмененным по дате, ни автоматически выдавать оба документа как равнозначные правила одного режима. Для КДП не подтверждено, какое обязательство и перечень доступа выдавать при приеме и изменении должности. Сам режим и перечни тайны здесь не переписываются: по границам задания это работа ИБ/юристов, не HR.<\/p>\n<p><strong>Закон.<\/strong> 98‑ФЗ ст. 11 ч. 1 пп. 1–2, ред. 08.08.2024: «ознакомить под расписку работника, доступ которого к этой информации, обладателями которой являются работодатель и его контрагенты, необходим для исполнения данным работником своих трудовых обязанностей, с перечнем информации, составляющей коммерческую тайну»; «ознакомить под расписку работника с установленным работодателем режимом коммерческой тайны и с мерами ответственности за его нарушение». Из этой нормы не следует, что достаточно любой подписанной формы с похожим заголовком.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После заключения ИБ/юристов добавить к кадровому перечню при приеме (12, п. 2.10; реестр 13.9) запись:<\/p>\n<blockquote>\n<p>До предоставления доступа к информации, составляющей коммерческую тайну, КДП получает от ответственного за режим коммерческой тайны подтверждение применимых к должности действующих документов, перечня информации и формы обязательства, если оно предусмотрено утвержденным порядком. В записи об ознакомлении указываются наименование и редакция каждого документа. Само по себе наличие формы обязательства из прежней редакции не подтверждает ознакомления с последующей редакцией режима и перечня информации. КДП не определяет самостоятельно состав коммерческой тайны и не отменяет документы ИБ.<\/p>\n<\/blockquote>\n<p>Владельцам 04/05 — готовая формулировка предмета решения, <strong>не утвержденная отмена<\/strong>: <strong>Определить по реквизитам, какие положения документа 05 сохраняются, какие заменены документом 04 и какая форма обязательства применяется. Указать необходимые переходные действия и ознакомление.<\/strong> Выбор: сохранить остаточную часть 05 с разграничением / утвердить единый документ; рекомендация — единый актуальный комплект после проверки, без потери правил о конфиденциальной информации вне коммерческой тайны. До ответа в реестре 05 остается под вопросом в соответствующей части.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>ИБ/юристы подтверждают версию режима, перечня информации, доступа и формы для работодателя и должности; вывод связывается с 04/05 в реестре.<\/li>\n<li>При кадровом событии КДП выдает подтвержденный комплект, сохраняет подписи; доступ разрешает уполномоченный владелец, а не факт закрытия кадровой задачи.<\/li>\n<li>При обновлении ИБ передает КДП круг затронутых должностей и порядок переознакомления; Decision Flow лишь отслеживает выполнение.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой комплект выдают сейчас: 04 / 05 / оба / отдельная форма? Кто из ИБ подтвердит, что он соответствует действующему режиму?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: неизвестно число выдач двух комплектов и необходимость повторного ознакомления.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пересечению и отсутствию прямой отмены 05 по реквизитам; средняя по фактически используемому комплекту.<\/p>"}, {"id": "К-SKVOZ-10", "slug": "SKVOZ-10", "title": "Расследование встроено в документ для дистанционных и одновременно вынесено в отдельное положение", "imp": "средняя", "docs": ["03", "06", "08"], "meta": [["Документы", "03, разделы 8–9, п. 8.1.1; 06, разделы 1–13; 08, п. 8.11.7"], ["Тип", "противоречие между документами"], ["Кто решает", "специалист ОТ и юристы; работодатель утверждает; КДП обеспечивает кадровый стык"], ["Важность", "средняя: кадровый участник может выбрать параллельную процедуру и не ту версию извещения; правит специалист ОТ, HR только стык"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 8.1.1: «устанавливает особенности расследования несчастных случаев на производстве происшедших в ООО «[компания]»».<\/li>\n<li>06, п. 2.2: «Действие положения распространяется на работников Организации, других лиц, участвующих в производственной деятельности ООО «[компания]»».<\/li>\n<li>08, п. 8.11.7: «Положении о расследовании и учете профессиональных заболеваний … СУОТ.П09-2022-1».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Название 03 адресует его дистанционным работникам, но раздел 8 воспроизводит самостоятельный общий порядок расследования, пересекающийся с 06. Раздел 9 посвящен <strong>профзаболеваниям<\/strong>, а не второму экземпляру 06: считать оба раздела полным дублем и удалить их вместе нельзя. В 08 отдельным источником назван П09; его копии нет, тождество с разделом 9 документа 03 не установлено. Подробное сравнение сроков и готовая правка раздела 8 уже в <a href=\"#/k/OT-08\">К-OT-08<\/a>–11; не создаем второй вариант этих сроков.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 228, ред. 25.05.2026: «принять иные необходимые меры по организации и обеспечению надлежащего и своевременного расследования несчастного случая и оформлению материалов расследования в соответствии с настоящей главой». Дублирование само по себе не названо нарушением; риск — расхождение применяемых процедур. Специальный состав обязанности для дистанционных и исключения ЭДО проверяет специалист ОТ, <a href=\"#/k/OT-01\">К-OT-01<\/a> и 05.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Принять <strong>один<\/strong> проект изменения 03/06 из <a href=\"#/k/OT-08\">К-OT-08<\/a>, а не отдельную кадровую процедуру. Для кадрового перечня и реестра 13.9 готовая запись:<\/p>\n<blockquote>\n<p>По несчастным случаям основным документом процесса после утверждения согласованных изменений является Положение об особенностях расследования несчастных случаев на производстве СУОТ.П08-2022-1 (06); раздел 8 документа 03 содержит отсылку к нему и порядок первоначального сообщения дистанционного работника. Раздел 9 документа 03 учитывается отдельно как правила о профессиональных заболеваниях; его изменение или замена допускается после проверки специалистом по охране труда действующего документа СУОТ.П09-2022-1 и связанных норм. КДП направляет сведения специалисту по охране труда и работодателю и не квалифицирует случай самостоятельно.<\/p>\n<\/blockquote>\n<p>В 08, 8.11.7, связать ссылку с подтвержденной редакцией 06; П09 и П10 добрать по <a href=\"#/k/OT-13\">К-OT-13<\/a>/<a href=\"#/k/SKVOZ-06\">К-SKVOZ-06<\/a>. Раздел 9 не отменять до проверки. Из кадровой памятки не делать новый источник расследования: только ссылка и первый адресат.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Специалист ОТ сверяет и утверждает с работодателем единый источник и изменения 03/06, сохраняя порядок немедленного реагирования.<\/li>\n<li>Работник/руководитель сообщает о событии; КДП передает известные кадровые сведения уполномоченному участнику по действующей процедуре.<\/li>\n<li>Decision Flow хранит ссылку на редакцию, задачи и сроки из утвержденного порядка; комиссия и работодатель принимают решения, не кадровый бот.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас принимает первое сообщение о случае и каким документом пользуется: 03 / 06 / порядком подрядчика ОТ? Подтвердит специалист ОТ.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа случаев и времени сопровождения. Отсутствие случаев не снимает необходимость согласованного маршрута.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пересечению раздела 8 и 06 и отдельному предмету раздела 9; средняя по источнику, реально применяемому сегодня.<\/p>"}, {"id": "К-SKVOZ-11", "slug": "SKVOZ-11", "title": "В пакете принятия ЛНА не видно проверки представительства работников", "imp": "высокая", "docs": ["02", "08", "10", "11", "12"], "meta": [["Документы", "12, приказ, п. 13.8; 10, пп. 12.1–12.3; 08, п. 5.5 ж; 11, п. 6.4; 02, п. 2.4; будущий ЛНА ЭДО"], ["Тип", "пробел"], ["Кто решает", "юристы определяют основание и представительный орган; HR организует; работодатель принимает"], ["Важность", "высокая: обязательная процедура принятия может быть пропущена либо ошибочно назначена там, где не требуется"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 13.8: «Правила вступают в силу с даты их утверждения и действуют до утверждения новой редакции».<\/li>\n<li>10, п. 12.3: «Любые изменения вносятся в настоящее Положение на основании Приказа руководителя Организации и должны быть доведены до сведения всех Работников».<\/li>\n<li>08, п. 5.5 ж: «учитывает мнение выборного органа первичной профсоюзной организации или иного уполномоченного работниками органа (при наличии)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Нельзя писать, что документы совсем не знают представителей работников: 08 и 11 упоминают их, 02 делает это для привлечения к сверхурочным. Но учет мнения при <strong>принятии/изменении ЛНА<\/strong> — другой шаг; материалов такого шага в переданных пакетах нет. Наличие органа, применимого коллективного договора и фактическая процедура не подтверждены, поэтому нарушения не устанавливаем. Для общего пакета изменений нужна развилка до подписи; отпускной календарь остается в <a href=\"#/k/OTP-01\">К-OTP-01<\/a>, форма расчетного листка — <a href=\"#/k/PLAT-11\">К-PLAT-11<\/a>.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 8 ч. 2, ред. 25.05.2026: «В случаях, предусмотренных настоящим Кодексом, другими федеральными законами и иными нормативными правовыми актами Российской Федерации, коллективным договором, соглашениями, работодатель при принятии локальных нормативных актов учитывает мнение представительного органа работников (при наличии такого представительного органа)». ТК ст. 190 ч. 1: «Правила внутреннего трудового распорядка утверждаются работодателем с учетом мнения представительного органа работников в порядке, установленном статьей 372 настоящего Кодекса для принятия локальных нормативных актов». ТК ст. 372 ч. 1: «перед принятием решения направляет проект локального нормативного акта и обоснование по нему в выборный орган первичной профсоюзной организации, представляющий интересы всех или большинства работников». ТК ст. 8 ч. 4: «а также локальные нормативные акты, принятые без соблюдения установленного статьей 372 настоящего Кодекса порядка учета мнения представительного органа работников, не подлежат применению» — это последствие пропуска обязательной процедуры, а не довод, что она нужна всегда. Требование распространять эту процедуру на любой документ независимо от основания из цитат не следует; ТК 8 ч. 3 отдельно допускает согласование по коллективному договору/соглашению.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>13.11<\/strong>; этот же проверочный шаг включить в подготовку нового приказа и реестр 13.9:<\/p>\n<blockquote>\n<p>13.11. До утверждения проекта локального нормативного акта и изменений к нему лицо, организующее подготовку проекта, совместно с юристом устанавливает необходимость учета мнения либо согласования с представительным органом работников по законодательству, коллективному договору и соглашениям. В материалах принятия указываются применимое основание, наличие и полномочия соответствующего органа, результат процедуры и место хранения документов либо подтвержденное основание ее неприменения. Если требуется процедура статьи 372 Трудового кодекса Российской Федерации, до ее завершения проект не передается на утверждение как окончательный. Неполучение сведений о представительном органе само по себе не считается подтверждением его отсутствия.<\/p>\n<\/blockquote>\n<p>Для самих ПВТР действует текст <a href=\"#/k/DISC-22\">К-DISC-22<\/a> в п. 13.8; 13.11 распространяет ту же проверку на остальные ЛНА и не повторяет 13.8. Рабочий лист принятия: <strong>вид акта → норма/договор → надлежащий орган → проект и обоснование/дата получения → мнение → консультации при разногласии → протокол → решение работодателя<\/strong>. Для 10 — ТК 135 ч. 5, для ЭДО — 22.2 ч. 2–3, для графика — 123 ч. 1; эти статьи есть в базе. Не подменять мнение согласованием и не отменять более строгую процедуру договора без проверки. Редакции 01/04/05/09 HR этим кейсом не меняет: юрист определит применимость отдельно.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Юрист и HR подтверждают наличие/полномочия органа и основания по каждому работодателю; неопределенность остается вопросом, не автоматическим пропуском.<\/li>\n<li>КДП прикладывает проект и обоснование, фиксирует получение и этапы; Decision Flow считает сроки по норме и фактическим датам после проверки календаря.<\/li>\n<li>При отрицательном мнении включаются консультации и протокол; при отсутствии обязанности сохраняется подтвержденное основание, а не пустая ячейка.<\/li>\n<li>Работодатель утверждает акт после надлежащей процедуры, затем запускается ознакомление <a href=\"#/k/SKVOZ-05\">К-SKVOZ-05<\/a>.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть выборный орган первичной профсоюзной организации, иной представительный орган или договорная обязанность согласования? Варианты: нет подтвержденных оснований / есть, реквизиты у юристов / не знаем, запросить подтверждение.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: для этого кейса календарную дату утверждения не назначаем. ТК 372 ч. 2–3 (та же база) прямо говорит «не позднее пяти рабочих дней со дня получения проекта» и «в течение трех дней после получения мотивированного мнения» для дополнительных консультаций; разные виды дней не складываем в произвольный общий срок.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по нормам и отсутствию материалов процедуры в комплекте; средняя по необходимости процедуры для каждого конкретного принятия без сведений о представительстве.<\/p>"}, {"id": "К-SKVOZ-12", "slug": "SKVOZ-12", "title": "Для сообщения об одних изменениях данных установлены разные сроки", "imp": "средняя", "docs": ["09", "12"], "meta": [["Документы", "12, п. 3.2.13; 09, п. 4.2; формы/описание ВУ; связь с К-VU-02"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR и КДП; владелец 09 и юристы подтверждают стык; режим ВУ отдельно"], ["Важность", "средняя: сотрудник может соблюсти один ЛНА и пропустить срок другого"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 3.2.13: «в течение 10 дней сообщить в подразделение, занимающееся кадровым делопроизводством, об изменении своих анкетных данных».<\/li>\n<li>09, п. 4.2: «Своевременно в разумный срок, не превышающий 5 дней, сообщать работодателю об изменении своих персональных данных» (номер и срок сверены с ).<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Одно изменение места жительства или иных анкетных сведений попадает в оба правила, но предельный срок различается. Это не конфликт двух норм закона: оба срока записаны самой компанией, практика получения уведомлений не установлена. ВУ может требовать отдельного более раннего действия; нельзя отложить внешнюю обязанность до истечения общего срока работника. Проект <a href=\"#/k/VU-02\">К-VU-02<\/a> сохраняет для невоинских сведений срок ПВТР; рекомендованный ниже вариант с ним совпадает, второго текста п. 3.2.13 не вводим.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 87, ред. 25.05.2026: «Порядок хранения и использования персональных данных работников устанавливается работодателем с соблюдением требований настоящего Кодекса и иных федеральных законов». Эта норма <strong>не задает<\/strong> общий срок сообщения работником. Универсальной нормы о сроке для всех перечисленных изменений в базе не найдено; сроки ВУ рассматриваются по своей норме в <a href=\"#/k/VU-01\">К-VU-01<\/a>–02, не распространяются на все данные по аналогии.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Вариант А (рекомендуем): один срок для общих анкетных данных — 10 дней, как сейчас в ПВТР, и отдельная ветка воинского учёта. Текст 12, п. 3.2.13, — в редакции <a href=\"#/k/VU-02\">К-VU-02<\/a>, без второго варианта: в нём уже есть 10 дней для невоинских сведений, незамедлительное сообщение для ВУ и канал с фиксацией даты. Владельцу 09 HR передаёт готовый текст п. 4.2, сам 09 не переписывает:<\/p>\n<blockquote>\n<p>4.2. Своевременно сообщать работодателю об изменении своих персональных данных в срок и в порядке, установленные Правилами внутреннего трудового распорядка Общества, а в случаях, когда законодательством или утвержденным порядком воинского учета предусмотрено иное, — в предусмотренный ими срок.<\/p>\n<\/blockquote>\n<p>Плюс А: срок для работника не сокращается, текст <a href=\"#/k/VU-02\">К-VU-02<\/a> не меняется. Минус: нужна правка 09 его владельцем. Вариант Б: 5 дней в обоих актах, правка только ПВТР; так срок по ПВТР для работника сокращается на пять дней — юристам проверить такое изменение. При любом варианте внешние сроки (ВУ) идут своей веткой, а КДП фиксирует дату получения сообщения и не ждёт истечения общего срока.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник подает одно защищенное сообщение КДП; ознакомление с правилами и прием сообщения не требуют публикации личных данных в общем чате.<\/li>\n<li>КДП фиксирует фактические даты события и получения; определяет, какие кадровые действия и ВУ затронуты.<\/li>\n<li>Ответственный исполняет внешние сроки по своей норме; Decision Flow не считает датой изменения дату чтения письма и не ждет общего срока при уже полученных сведениях.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Что сообщают сейчас, когда и где это регистрируется? Варианты: отдельное обращение / письмо / изменение в кабинете / не установлен единый способ. Как достоверно узнают дату изменения?<\/p>\n<p><strong>Цена вопроса.<\/strong> Разница текстовых пределов — 5 дней: расчёт программой (выражение <code>10-5<\/code>). Это не размер просрочки и не доказательство штрафа: событий и дат нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по несовпадению сроков и скану; средняя по последствию в реальном событии без данных о получении уведомлений.<\/p>"}, {"id": "К-SKVOZ-13", "slug": "SKVOZ-13", "title": "Кадровые маршруты передачи данных не связаны с действующими правилами доступа", "imp": "высокая", "docs": ["04", "09", "10", "12", "14"], "meta": [["Документы", "09, пп. 7.1, 8.1, 9.1, 9.3; 12, пп. 6.7, 2.11; 14, п. 2.2.2; 10, п. 10.11; 04, приложение 1"], ["Тип", "пробел"], ["Кто решает", "юристы и ответственный за ПД/ИБ определяют основания; HR и КДП меняют только кадровые стыки"], ["Важность", "высокая: кадровый шаг можно выполнить технически, не проверив допустимые данные, роль и канал"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>09, п. 9.3: «Передача информации, содержащей сведения о персональных данных работников организации, по телефону, факсу, электронной почте без письменного согласия работника запрещается» (сверено с, внутренняя страница 6).<\/li>\n<li>12, п. 6.7: «работнику в его Личном кабинете в программе 1С или по его служебному адресу электронной почты»; продолжение того же предложения: «направляется расчетный листок по форме Приложения № 1 к настоящим Правилам».<\/li>\n<li>14, п. 2.2.2: «В случае отсутствия аккаунта командированных вносит персональные данные работника».<\/li>\n<li>10, п. 10.11: «или путем направления через систему электронного документооборота Контур.Диадок».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Электронные каналы в ЛНА названы; проблема в отсутствии связки конкретного кадрового действия с допуском, основанием и каналом. Письмо работнику, доступ коллеги к его данным, передача внешнему сервису и передача уполномоченному органу — разные случаи; один запрет электронной почты и одно общее согласие при приеме не позволяют оценить их одинаково. Согласия/договорные основания могли быть оформлены отдельно, поэтому незаконность текущей практики не установлена. Расчетный листок уже разобран в <a href=\"#/k/PLAT-11\">К-PLAT-11<\/a>, поездки — <a href=\"#/k/KOM-17\">К-KOM-17<\/a>, ВУ — <a href=\"#/k/VU-07\">К-VU-07<\/a>; этот кейс соединяет их с владельцем 09 и не переписывает ИБ-регламент.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 88, ред. 25.05.2026: «разрешать доступ к персональным данным работников только специально уполномоченным лицам, при этом указанные лица должны иметь право получать только те персональные данные работника, которые необходимы для выполнения конкретных функций»; «не сообщать персональные данные работника третьей стороне без письменного согласия работника, за исключением случаев, когда это необходимо в целях предупреждения угрозы жизни и здоровью работника, а также в других случаях, предусмотренных настоящим Кодексом или иными федеральными законами». ТК ст. 87, та же редакция: «Порядок хранения и использования персональных данных работников устанавливается работодателем с соблюдением требований настоящего Кодекса и иных федеральных законов». Правовой режим каждой передачи устанавливают юристы, не общий технический доступ к папке.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>1.9<\/strong> — кадровая отсылка, не новый регламент ПД:<\/p>\n<blockquote>\n<p>1.9. При выполнении кадровых действий работники, которым поручена обработка персональных данных, используют только подтвержденные ответственным за персональные данные и юристом основания, состав данных, роли доступа, получателей и каналы. Эти сведения учитываются по каждому работодателю и кадровому процессу. Техническая возможность создать учетную запись, отправить письмо или открыть папку не является самостоятельным основанием доступа или передачи. При неясности основания КДП обращается к ответственному за персональные данные и юристу, не распространяя данные дополнительным получателям; установленные законом обязанности и сроки при этом исполняются в надлежащем порядке.<\/p>\n<\/blockquote>\n<p>В реестре кадровых процессов добавить поля <strong>данные / цель / основание / допущенная роль / получатель / утвержденный канал / хранение / подтверждение владельца<\/strong>. Для 12, 6.7, применить <a href=\"#/k/PLAT-11\">К-PLAT-11<\/a> с проверкой владельцем 09; для 14, 2.2.2, — <a href=\"#/k/KOM-17\">К-KOM-17<\/a>; для ВУ — <a href=\"#/k/VU-07\">К-VU-07<\/a>. 04/09 и их матрицы не менять силами HR; ИБ/юристам дать вопрос о стыке и получить решение. Не объявлять 09, 9.3, отмененным более новым упоминанием Диадока или почты.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Владелец ПД и юрист проверяют каждую передачу на примере обезличенного маршрута, не единого разрешения на все кадровые данные.<\/li>\n<li>КДП/бухгалтерия используют подтвержденные канал, состав и получателя; при работе между работодателями не считают ее автоматически внутренним обменом одной организации.<\/li>\n<li>Decision Flow контролирует наличие подтвержденного основания, но не получает весь массив личных дел по умолчанию; право доступа и способ подключения согласуются отдельно.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли действующая таблица доступов, согласий/иных оснований и каналов по кадровым процессам? Варианты: есть у ИБ/юристов / набор отдельных документов / не сопоставляли. Какие кадровые шаги уже согласованы?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; нет перечня передач и расходов на проверку, утечка или размер штрафа не установлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по несведенным формулировкам; средняя по фактическим основаниям, которых нет в полученной подборке.<\/p>"}, {"id": "К-SKVOZ-14", "slug": "SKVOZ-14", "title": "ЛНА пересказывают закон в редакции на дату принятия и не обновляются, когда он меняется", "imp": "средняя", "docs": ["02", "03", "05", "06", "07", "12"], "meta": [["Документы", "12, п. 2.6; 03, пп. 8.3.1 е), 8.3.3 г), 8.4.6; 06, раздел 5, пп. 7.1 е), 7.3 г), 8.3; 05, п. 1.2; сводно: 02, п. 2.2; 07, пп. 1.6, 3.4–3.5; 12, пп. 1.3, 4.12; 03, раздел 2"], ["Тип", "устарело"], ["Кто решает", "юристы подтверждают изменения закона; руководитель HR и владельцы документов меняют свои пункты"], ["Важность", "средняя: по пересказу КДП делает шаг, которого закон уже не требует, или не видит нового правила"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 2.6: «Прием на работу оформляется приказом, изданным на основании заключенного трудового договора. Содержание приказа, соответствующее условиям заключенного трудового договора, предъявляется или отправляется через ЭДО для ознакомления работнику под подпись в трехдневный срок со дня фактического начала работы».<\/li>\n<li>06, п. 7.1 е): «в исполнительный орган страховщика (ФСС)»; то же в 03, п. 8.3.1 е); в комиссии по 06, п. 8.3, и 03, п. 8.4.6: «представитель ФСС России по месту регистрации работодателя в качестве страхователя».<\/li>\n<li>05, п. 1.2: «Федеральным Законом \"Об информации, информатизации и защите информации\"» (сверено с ).<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> По 12, п. 2.6, ПВТР 2022 года называют приказ формой приёма и делают ознакомление с ним за три дня обязательным. В базе ТК 68 ч. 1 в редакции 377‑ФЗ от 22.11.2021: приём оформляется трудовым договором, приказ — право работодателя; часть вторая утратила силу тем же законом. Это <strong>не нарушение<\/strong>: издавать приказ и знакомить с ним можно. Но пока шаг записан в ЛНА, работодатель обязан его соблюдать (ТК 22 ч. 2), а КДП выполняет его как требование закона. Действовала ли новая редакция ТК 68 на дату ПВТР, по базе не видно: дата вступления в силу изменений в ней не приведена.<\/p>\n<p>Остальные устаревшие пересказы уже разобраны группами — здесь только указатель, без второго варианта правки: 02, п. 2.2 и ТК 99 ч. 6 — <a href=\"#/k/VREM-01\">К-VREM-01<\/a>; 07, п. 1.6 и ТК 70 ч. 4 — <a href=\"#/k/PRIEM-01\">К-PRIEM-01<\/a>; 07, пп. 3.4–3.5 — <a href=\"#/k/PRIEM-24\">К-PRIEM-24<\/a>; 12, п. 4.12 и ТК 115 — <a href=\"#/k/OTP-16\">К-OTP-16<\/a>; 12, п. 1.3 и ТК 22.1–22.3 — <a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a>, <a href=\"#/k/DISC-01\">К-DISC-01<\/a>; 03, раздел 2 — <a href=\"#/k/DISC-12\">К-DISC-12<\/a>; 03, пп. 2.14–2.15 — <a href=\"#/k/OT-05\">К-OT-05<\/a>. Новое здесь, кроме 12, п. 2.6: в 03 и 06 адресат извещения назван сокращением ФСС, тогда как ТК 228.1 называет его без сокращения; переименование фонда база прямо не показывает — проверить специалисту ОТ. В 05 указан закон, названия которого в базе нет; в базе есть 149‑ФЗ от 27.07.2006 с другим названием, отмена старого закона не видна — вопрос владельцу 05, HR его не переписывает.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 68 ч. 1, ред. 25.05.2026: «Прием на работу оформляется трудовым договором. Работодатель вправе издать на основании заключенного трудового договора приказ (распоряжение) о приеме на работу»; пометка базы: «(часть первая в ред. Федерального закона от 22.11.2021 N 377‑ФЗ)»; там же: «Часть вторая утратила силу. - Федеральный закон от 22.11.2021 N 377‑ФЗ.» ТК ст. 8 ч. 4: «Нормы локальных нормативных актов, ухудшающие положение работников по сравнению с установленным трудовым законодательством … не подлежат применению». ТК ст. 228.1 ч. 1: «в исполнительный орган страховщика по вопросам обязательного социального страхования от несчастных случаев на производстве и профессиональных заболеваний по месту регистрации работодателя в качестве страхователя». 53‑ФЗ ст. 4 п. 7, ред. 04.08.2026: «Фонд пенсионного и социального страхования Российской Федерации обязан предоставлять необходимые для ведения воинского учета сведения».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 12, п. 2.6 (вариант А):<\/p>\n<blockquote>\n<p>2.6. Прием на работу оформляется трудовым договором. На основании заключенного трудового договора Работодатель издает приказ о приеме на работу; содержание приказа должно соответствовать условиям заключенного трудового договора. Работник знакомится с приказом в порядке, установленном для ознакомления с кадровыми документами, в трехдневный срок со дня фактического начала работы.<\/p>\n<\/blockquote>\n<p>Вариант Б: «Работодатель вправе издать приказ о приеме на работу…» без обязательного ознакомления. Рекомендация — А, если КДП и так оформляет приказ в 1С: шаг остаётся, но ЛНА больше не называет приказ формой приёма. В 03 и 06 (одним пакетом с <a href=\"#/k/OT-08\">К-OT-08<\/a>–11, без отдельной редакции) заменить «исполнительный орган страховщика (ФСС)» и «представитель ФСС России …» на формулировку ТК 228.1: <strong>исполнительный орган страховщика по месту регистрации работодателя в качестве страхователя<\/strong>; в 06, раздел 5, убрать строку сокращения ФСС.<\/p>\n<p>Чтобы пересказы не устаревали молча, в реестр по предлагаемому ПВТР 13.9 (<a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>) добавить поле <strong>нормы, которые пересказывает акт<\/strong>, а в 13.9 — предложение:<\/p>\n<blockquote>\n<p>При изменении нормы, указанной в реестре, руководитель кадрового делопроизводства совместно с юристом определяет затронутые пункты и передает владельцу акта предложение об изменении. До изменения акта применяется закон; пункт акта, ухудшающий положение работника по сравнению с законом, не применяется.<\/p>\n<\/blockquote>\n<p>В новых редакциях не пересказывать закон без нужды: ссылка на статью вместо копии её текста.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Юрист отмечает в реестре изменение закона и дату вступления в силу.<\/li>\n<li>Decision Flow находит по реестру акты и пункты с этой нормой и ставит владельцу задачу с готовой ссылкой; без подтверждённой интеграции перечень составляет КДП.<\/li>\n<li>До утверждения правки КДП применяет закон; правки копятся в пакет по документу, а не в отдельную редакцию на каждую статью.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Приказ о приёме КДП оформляет всегда и знакомит за три дня? Варианты: всегда, Диадок / всегда, бумага / не всегда. Кто сейчас следит за изменениями закона: юристы / КДП / никто системно?<\/p>\n<p><strong>Цена вопроса.<\/strong> На 17.11.2026 новые редакции ТК 99 ч. 6 и ТК 70 ч. 4 действуют 77 дней, а 02 и 07 их не отражают: расчёт программой (строка вывода со словами От 01.09.2026 до 17.11.2026). Деньги не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по 12, п. 2.6: текст нормы и пометки базы однозначны. Средняя по ФСС и 05: переименование фонда и отмена старого закона в базе прямо не показаны.<\/p>"}, {"id": "К-SKVOZ-15", "slug": "SKVOZ-15", "title": "Редактура: опечатки в шапках, ссылках и самоназваниях документов", "imp": "низкая", "docs": ["01", "03", "04", "06", "08", "11", "12"], "meta": [["Документы", "01, титул и преамбула; 04, п. 1.4; 06, раздел 3; 12, п. 1.6, приложение 1; 03/06/08/11, грифы"], ["Тип", "ошибка в тексте — редактура списком"], ["Кто решает", "владелец документа при следующей редакции; отдельный приказ ради опечаток не нужен"], ["Важность", "низкая: смысл понятен, но ссылка или название может не найтись поиском и реестром"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>01, заголовок: «Кодекс деловой этики»; преамбула: «Настоящий Кодекс корпоративной этики (далее — Кодекс)» (сверено с ). 13, п. 3.3.5, ссылается на «Кодекса деловой этики компании».<\/li>\n<li>06, раздел 3, внутренние документы: «СБТ СУОТ.П01-Год_№_док]-1»; правильный шифр того же положения в 11, раздел 3: «СБТ СУОТ.П01-2022-1».<\/li>\n<li>06, раздел 3: «Об обязательном социальном страховании от несчастных, случаев на производстве».<\/li>\n<li>04, п. 1.4: «Настоящий Положение имеет приоритет».<\/li>\n<li>12, п. 1.6: «Действия Правил распространяется на всех работников»; приложение 1: «ООО «[компания]»» при «ООО «[компания]»» во всём остальном тексте.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Ни одна из этих ошибок не меняет права и обязанности, поэтому каждая не стоит отдельного кейса. Но шаблонный шифр в 06 не даёт найти связанный документ по коду, а два названия Кодекса — найти его по названию в реестре по предлагаемому ПВТР 13.9. Номера приказов 08 и 11 записаны без года («№ 4-ЛС», «№ 6-ЛС»), а 03 и 06 — с годом («№ 8-ЛС/2023», «№ 7-ЛС/2023»): это не ошибка, но в реестр номер переносится так, как в документе, год не дописывается (см. раздел А). Грамматика ОТ-документов — в <a href=\"#/k/OT-15\">К-OT-15<\/a>, 07 и 13 — в <a href=\"#/k/PRIEM-24\">К-PRIEM-24<\/a>, 14 и 15 — в <a href=\"#/k/KOM-21\">К-KOM-21<\/a>, ПВТР — в <a href=\"#/k/DISC-21\">К-DISC-21<\/a>; здесь только то, чего там нет.<\/p>\n<p><strong>Закон.<\/strong> Нормы о редактуре нет; не требуется.<\/p>\n<p><strong>Стало (предлагается).<\/strong> При ближайшей редакции каждого документа:<\/p>\n<ul>\n<li>01: одно название; рекомендуем <strong>Кодекс деловой этики<\/strong>, как в заголовке и в 13, п. 3.3.5. Решает владелец 01, HR не переписывает.<\/li>\n<li>06, раздел 3: <strong>СБТ СУОТ.П01-2022-1<\/strong>; там же <strong>от несчастных случаев на производстве<\/strong> без запятой (одним пакетом с <a href=\"#/k/OT-15\">К-OT-15<\/a>).<\/li>\n<li>04, п. 1.4: <strong>Настоящее Положение имеет приоритет<\/strong> (владелец 04).<\/li>\n<li>12, п. 1.6: <strong>Действие Правил распространяется на всех работников<\/strong>; в приложении 1 — <strong>ООО «[компания]»<\/strong>.<\/li>\n<\/ul>\n<p><strong>Как будет работать.<\/strong> Владелец вносит правки в ближайшую содержательную редакцию; КДП в реестре отмечает исправленное название и шифр.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Нет.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: всё видно в тексте; скан 01 сверен с изображением.<\/p>"}]}], "n_voprosov": 90, "stranicy": {"dokumenty": {"eyebrow": "16 документов", "h1": "Документы: реестр", "html": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">№<\/th>\n<th style=\"text-align: left;\">Документ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">01<\/td>\n<td style=\"text-align: left;\">Кодекс деловой этики (ред. 2, 05.10.2021)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">02<\/td>\n<td style=\"text-align: left;\">Политика о сверхурочной работе и работе в выходные и праздничные дни (ред. 2, приказ № 51/2025 от 01.07.2025)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">03<\/td>\n<td style=\"text-align: left;\">Положение для дистанционных работников (приказ № 8-ЛС.2023 от 25.01.2023)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">04<\/td>\n<td style=\"text-align: left;\">Положение о коммерческой тайне (ред. 28.04.2020, приказ № 12_2020)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">05<\/td>\n<td style=\"text-align: left;\">Положение о конфиденциальной информации и коммерческой тайне (ред. 14.06.2018, приказ № 03_2018)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">06<\/td>\n<td style=\"text-align: left;\">Положение о несчастных случаях (приказ 7-ЛС.2023 от 25.01.2023)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">07<\/td>\n<td style=\"text-align: left;\">Положение о порядке прохождения испытания при приёме на работу (ред. 27.01.2020)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">08<\/td>\n<td style=\"text-align: left;\">Положение о системе управления охраной труда (приложение к приказу 4-ЛС.2023 от 25.01.2023)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">09<\/td>\n<td style=\"text-align: left;\">Положение об обработке и защите персональных данных работников (ред. 01.06.2017)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">10<\/td>\n<td style=\"text-align: left;\">Положение об оплате труда, премировании и доп. социальных мероприятиях (ред. 4 от 18.07.2025)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">11<\/td>\n<td style=\"text-align: left;\">Положение по СОУТ/СОС (приказ 6-ЛС.2023 от 25.01.2023)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">12<\/td>\n<td style=\"text-align: left;\">Правила внутреннего трудового распорядка (ред. 4, приказ № 29_2022 от 03.11.2022)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">13<\/td>\n<td style=\"text-align: left;\">Регламент адаптации новых сотрудников (ред. 25.03.2021)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">14<\/td>\n<td style=\"text-align: left;\">Регламент оформления командировок (ред. 3 от 20.11.2024)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">15<\/td>\n<td style=\"text-align: left;\">Регламент по использованию такси (от 01.08.2022)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">16<\/td>\n<td style=\"text-align: left;\">Регламент согласования отпусков (ред. 2 от 08.09.2021)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h2>Редакции, связи, статус<\/h2>\n<p><strong>Статус<\/strong> означает результат разбора полученного комплекта, а не юридическое прекращение действия: <em>действует<\/em> — прислан как действующий, отмена не найдена; <em>под вопросом<\/em> — не хватает комплекта или определения применимости; <em>дубль<\/em> — пересечение, требующее решения; <em>устарел в части<\/em> — конкретный пункт разошёлся с практикой или нормой. Возраст сам по себе ничего не отменяет. Историческое утверждение генеральным директором не доказывает его полномочия сегодня.<\/p>\n<p>Возраст — календарные дни от даты в шапке до 17.11.2026, без включения начального дня. Для 09 дата сверена по картинке титула. Для остальных сканов даты и редакции сверены по картинкам 01/05/13/16, стр. 1. Расчёт программой. Результат программы: <strong>16 документов, 237 страниц<\/strong>. Сверка таблицы с программой: расчёт программой — 16 строк, даты и дни совпадают, расхождений 0.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">№, документ<\/th>\n<th style=\"text-align: left;\">Редакция; дата; возраст, дней<\/th>\n<th style=\"text-align: left;\">Кто утвердил / чем введён / что отменяет<\/th>\n<th style=\"text-align: left;\">На что ссылается и кто ссылается на него<\/th>\n<th style=\"text-align: left;\">Статус и границы проверки<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">01. Кодекс деловой этики<\/td>\n<td style=\"text-align: left;\">№ 2; 05.10.2021; 1869<\/td>\n<td style=\"text-align: left;\">Единственный участник; решение от 05.10.2021 без видимого номера, титул. Прямого перечня отменённых актов в прочитанном нет<\/td>\n<td style=\"text-align: left;\">П. 1.2 требует учитывать Кодекс во всех документах; п. 3.2.7 — Устав и внутренние документы; 7.6 — ответственный за комплаенс; 9.1 — отдел персонала. На него: 13, п. 3.3.5. ПВТР 13.2–13.4 тематически повторяют конфликт интересов без прямой ссылки<\/td>\n<td style=\"text-align: left;\">Действует по переданному статусу; название в преамбуле — корпоративной этики, в заголовке — деловой. Сквозной вопрос: кто принимает сообщения по 7.6 и 9.1. Последний лист — заверение прошивки, не подтверждение ознакомления<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">02. Политика о сверхурочной работе и работе в выходные и нерабочие праздничные дни<\/td>\n<td style=\"text-align: left;\">№ 2; 01.07.2025; 504<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2025 года; приказ № 51/2025 по титулу, самого распорядительного текста приказа нет. Предыдущая редакция в полученном тексте прямо не отменена<\/td>\n<td style=\"text-align: left;\">На 12 и 10 — 1.2; на 10 — 2.8–2.9. На 02 по названию другие документы не ссылаются. Содержательно связана с 10, разд. 4, и 12, разд. 4; приложения: записка, согласия, отдых<\/td>\n<td style=\"text-align: left;\">Действует; устарел в части описания закона и ЭДО, есть несогласованность с 10. Стр. 11: подпись отправителя, ожидание ответной — не список ознакомленных<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">03. <strong>Положение о требованиях охраны труда дистанционных работников<\/strong>, СБТ СУОТ.П12-2022-1<\/td>\n<td style=\"text-align: left;\">Номер редакции отдельно не указан; 25.01.2023; 1392<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2023 года; приложение 1 к приказу № 8-ЛС/2023. Сам приказ не включён; отмена прежнего акта не указана<\/td>\n<td style=\"text-align: left;\">ПВТР — 4.1.5 и 8.1.7; трудовые договоры — разд. 2; форма листа ознакомления — 3.8; расследование — собственные разд. 8–9. Прямых входящих ссылок по полному названию не найдено<\/td>\n<td style=\"text-align: left;\">Действует; устарел разд. 2 в части пересказа дистанционного труда; <strong>дубль<\/strong> 06 по расследованию несчастных случаев. Не общий кадровый регламент дистанционной работы. Стр. 58 — ожидание ответной подписи<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">04. Положение об информации, составляющей коммерческую тайну<\/td>\n<td style=\"text-align: left;\">Редакция по дате; 28.04.2020; 2394<\/td>\n<td style=\"text-align: left;\">Генеральный директор; приказ № 12/2020 по грифу, самого приказа нет. Пп. 1.4 и 1.27 задают приоритет и окончание прежних правил о коммерческой тайне без перечисления их номеров<\/td>\n<td style=\"text-align: left;\">Прил. 1 — схема доступа по должностям; 5.1 — трудовой договор и ознакомление; 5.2.2 — список третьих лиц приказом; 7.1 — приказ об ответственном. Прямых входящих ссылок по названию нет; связь с 12, п. 3.2.9, и 05 тематическая<\/td>\n<td style=\"text-align: left;\">Действует; кадровая схема доступа требует сверки с актуальным штатом. Частично перекрывает 05. Только постановка вопроса ИБ/юристам, без переписывания<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">05. Положение <strong>о конфиденциальности информации<\/strong> и коммерческой тайне<\/td>\n<td style=\"text-align: left;\">Номер редакции не указан; 14.06.2018; 3078<\/td>\n<td style=\"text-align: left;\">Генеральный директор; приказ № 03/2018 по грифу. Приказ отдельно не прислан; прямой отмены в собственном тексте нет<\/td>\n<td style=\"text-align: left;\">Прил. 1 — обязательство работника; пп. 1.3, 3.2, 3.7 — обязательство/инструктаж/допуск; п. 1.2 — закон об информации под названием, которого нет в базе (<a href=\"#/k/SKVOZ-14\">К-SKVOZ-14<\/a>). Прямых ссылок на 05 по названию не найдено; термин конфиденциальной информации используется в 12, п. 3.2.9<\/td>\n<td style=\"text-align: left;\"><strong>Дубль / под вопросом<\/strong> в части коммерческой тайны после 04; конфиденциальная информация вне коммерческой тайны шире 04. Нельзя объявить весь документ отменённым только по его возрасту<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">06. Положение об особенностях расследования несчастных случаев на производстве, СУОТ.П08-2022-1<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 25.01.2023; 1392<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2023 года; приложение 1 к приказу № 7-ЛС/2023; самого приказа нет, отмена не названа<\/td>\n<td style=\"text-align: left;\">На 08 — разд. 3, но шифр остался шаблонным; ПВТР — 2.4, общее упоминание правил распорядка в перечне событий, не ссылка по реквизитам; прил. 1 — журнал. На 06: 08, п. 8.11.7; в 03, разд. 8, не ссылка на 06, а отдельный повтор процедуры<\/td>\n<td style=\"text-align: left;\">Действует; дубль по предмету с 03, разд. 8. Стр. 19 — ожидание ответной подписи. Отраслевой разбор — OT<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">07. Положение о порядке прохождения испытания при приёме на работу<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 27.01.2020; 2486<\/td>\n<td style=\"text-align: left;\">Генеральный директор, указанный в документе 2020 года; приказ № 01/2020 по грифу, самого приказа нет; отмена не названа<\/td>\n<td style=\"text-align: left;\">ПВТР — 2.16; прил. 1 — план; прил. 2 — уведомление; YouTrack/Jira — 2.3–2.12. Прямых входящих ссылок по названию нет; тематические 12, пп. 2.7–2.8, и 13<\/td>\n<td style=\"text-align: left;\">Действует; устарел п. 1.6 после изменения ТК 70; в шаблоне уведомления фиксирован подписант исторического периода. Подробно — PRIEM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">08. Положение о системе управления охраной труда, СБТ СУОТ.П01-2022-1<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 25.01.2023; 1392<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2023 года; титул: приложение 1 к приказу <strong>№ 4-ЛС<\/strong>, без в самом грифе. Отмену не называет<\/td>\n<td style=\"text-align: left;\">06, СУОТ.П08 — 8.11.7; отдельные СУОТ.П09 и П10 — там же; ПВТР — 7.3.6–7.3.7, 7.3.9 (упоминание без реквизитов), 8.12.1; процедура управления документацией — 12.1. Входящие: 06, разд. 3 (неполный шифр), 11, разд. 3. Приложения: структура, двухступенчатый контроль и формы, план, библиография<\/td>\n<td style=\"text-align: left;\">Действует; комплект связанных документов неполон. Политика ОТ по 5.2 — раздел положения, по 5.3 — отдельный документ, его не прислали. Стр. 49 — ожидание ответной подписи<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">09. Положение об обработке и защите персональных данных работников<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 01.06.2017 по грифу; 3456<\/td>\n<td style=\"text-align: left;\">Генеральный директор, указанный на титуле 2017 года; подпись и печать видны. П. 1.4 требует приказа о введении; номер и текст приказа в копии отсутствуют. Отмену не называет<\/td>\n<td style=\"text-align: left;\">Должностные инструкции КДП — 9.1; формы согласия/отзыва — 3.1.9; доступ — 8.1; обязательство получателя — разд. 7. Прямых входящих ссылок по названию нет; пересечения с 12, пп. 2.11, 3.2.13, 6.7, и 14, п. 2.2.2<\/td>\n<td style=\"text-align: left;\">Действует по переданному статусу; комплект введения под вопросом. Бумажные способы не описывают всю нынешнюю кадровую цепочку. Только кадровые стыки, без переписывания<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">10. Положение об оплате труда, премировании и дополнительных социальных мероприятиях<\/td>\n<td style=\"text-align: left;\">№ 4; 18.07.2025; 487<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2025 года; приказ № 53/2025 по титулу, самого приказа нет. По 12.1 бессрочно; прежняя редакция прямо не перечислена как отменённая<\/td>\n<td style=\"text-align: left;\">Прил. 1 — схема премирования; 6.10.3 — отдельный квартальный приказ о стейкхолдерах; трудовые договоры и штатное расписание — 10.2. На 10: 02, пп. 1.2, 2.8–2.9; 12, пп. 3.5, 8.3<\/td>\n<td style=\"text-align: left;\">Действует; отдельные несогласованности с 02 и 12. В протоколе ЭДО на стр. 10 обе подписи — генерального директора, не работников. Устаревшая ссылка на 5.9.1 — пп. 6.10.2–6.10.3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">11. <strong>Положение по обеспечению работников смывающими и обезвреживающими средствами<\/strong>, СУОТ.П07-2022-1<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 25.01.2023; 1392<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2023 года; титул: приложение 1 к приказу <strong>№ 6-ЛС<\/strong>, без в грифе. Отмену не называет<\/td>\n<td style=\"text-align: left;\">На 08 — разд. 3; приложения — нормы и карточка выдачи. Прямых входящих ссылок по названию не найдено, 08, п. 8.5, регулирует тот же процесс<\/td>\n<td style=\"text-align: left;\">Действует; это СОС, <strong>не полноценное положение по всем СИЗ<\/strong>, несмотря на сокращённое название входного списка. Стр. 9 — ожидание ответной подписи. Подробно — OT<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">12. Правила внутреннего трудового распорядка<\/td>\n<td style=\"text-align: left;\">№ 4; 03.11.2022; 1475<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2022–2023 годов; <strong>сам приказ № 29/2022 есть<\/strong>, стр. 1, п. 1 — ввод с подписания; п. 2 отменяет редакцию по приказу № 18/2022 от 27.06.2022<\/td>\n<td style=\"text-align: left;\">На 10 — 3.5, 8.3; перечень НРД — 4.17; критичные инциденты — 3.2.26, 5.13; должностные инструкции — 9.2; коллективный договор — 3.5; прил. 1 — расчётный листок. На ПВТР: 02, п. 1.2; 03, пп. 4.1.5, 8.1.7; 06, п. 2.4 (общее упоминание); 07, п. 2.16; 08, пп. 7.3.6–7.3.7, 7.3.9 (упоминание без реквизитов), 8.12.1; 14, п. 1.3<\/td>\n<td style=\"text-align: left;\">Действует; связующий акт, устарел в части каналов и согласованности с новыми актами. Стр. 2 пустая; стр. 16 — ожидание ответной подписи. Это не доказательство отсутствия отдельных ознакомлений<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">13. Регламент адаптации новых сотрудников<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 25.03.2021; 2063<\/td>\n<td style=\"text-align: left;\">Генеральный директор, указанный в документе 2021 года; приказ № 06/2021 по грифу; приказ не включён, отмена не названа<\/td>\n<td style=\"text-align: left;\">Кодекс 01 — 3.3.5; внутренние документы под подпись — 3.2.2. Прямой ссылки на 07 нет, хотя 1.3 связывает адаптацию с испытанием. Jira — 2.1, 3.2.3<\/td>\n<td style=\"text-align: left;\">Действует; кадровые стыки с 07 и 12 не определены. Конец — таблица встреч, листа ознакомления нет. Подробно — PRIEM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">14. Регламент оформления командировок<\/td>\n<td style=\"text-align: left;\">№ 3; 20.11.2024; 727<\/td>\n<td style=\"text-align: left;\">Генеральный директор, подписавший документы 2024–2025 годов; приказ № 33/2024 по титулу. <strong>Полученная копия начинается со страницы 3 из 9 Диадока<\/strong>: самого приказа и первых страниц пакета нет. Отмена прежних актов не видна<\/td>\n<td style=\"text-align: left;\">На 12 — 1.3; приказы о возмещении — 4.2, о суточных — 4.3; OneTwoTrip и договор сервиса — 1.4; прил. 1 — тарифы, прил. 2 — записка. Ссылки на 15 нет, хотя обе регулируют такси в командировках. Прямых входящих ссылок по названию нет<\/td>\n<td style=\"text-align: left;\">Действует; полный приказ под вопросом, пересечение с 15 не разведено. Подписи отправителя/получателя — генерального директора. Подробно — KOM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">15. Регламент по порядку использования корпоративного такси<\/td>\n<td style=\"text-align: left;\">Редакция отдельно не указана; 01.08.2022; 1569<\/td>\n<td style=\"text-align: left;\"><strong>Приказ № 23-Т/2022 есть<\/strong>, стр. 1; п. 1 вводит регламент, п. 2 — поручение начальнику КДП ознакомить всех работников, п. 3 — контроль специалиста по закупкам. Отмена не названа. В приказе роль подписанта — генеральный директор; сертификат ЭДО указывает советника генерального директора<\/td>\n<td style=\"text-align: left;\">Согласования лимитов — 2.1; договор Яндекс.Такси — 1.2. Прямых входящих ссылок по названию нет; 14 содержит параллельные правила такси без ссылки на 15<\/td>\n<td style=\"text-align: left;\">Действует по переданному статусу; дублирование с 14, полномочия подписанта проверить юристам. <strong>Приказ о такси 2022 года не потерян<\/strong>, он в этом файле. Стр. 2 пустая, отдельные ознакомления не проверены<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">16. Регламент согласования отпусков<\/td>\n<td style=\"text-align: left;\">№ 2; 08.09.2021; 1896<\/td>\n<td style=\"text-align: left;\">Генеральный директор, указанный в документе 2021 года; приложение 1 к приказу № 63 от 08.09.2021 по титулу, <strong>сам приказ не включён<\/strong>. Отмена прежней редакции не видна<\/td>\n<td style=\"text-align: left;\">Прил. 1–2 — заявления; указ мэра Москвы от 05.03.2020 — 1.1; график отпусков — 1.2, 1.5, 2.4. Прямых входящих ссылок по названию нет; содержательные стыки с 12, пп. 4.18–4.19, и 10, п. 10.12<\/td>\n<td style=\"text-align: left;\">Действует по переданному статусу; устарел в части бумажного маршрута относительно описанной практики, конфликтует по срокам/адресату с 12. Формы адресованы историческому генеральному директору. Подробно — OTP<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Важно о полноте реестра<\/h3>\n<p>Входящая ссылка в таблице — только прямая ссылка по названию или шифру, не придуманная зависимость. Например, 03, разд. 8, повторяет процедуру 06, но не ссылается на полученный документ 06. 04 <strong>не содержит прямой ссылки на 05<\/strong>: слова о положениях о конфиденциальности в 5.2.1 относятся к условиям договоров, не к названию ЛНА. Отсутствие входящей ссылки не означает, что документ не нужен.<\/p>\n<p>Номера приказов воспроизведены <strong>по самим шапкам<\/strong>: у 08 — 4-ЛС, у 11 — 6-ЛС. Год из имени входного файла не дописан к номеру. В отдельный запрос входят полные приказы введения, а не повторный запрос уже полученного приказа 23-Т/2022.<\/p>"}, "karta": {"eyebrow": "Как документы связаны", "h1": "Карта связей", "html": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы: текст / практика<\/th>\n<th style=\"text-align: left;\">Разрыв и место исправления<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Принятие/изменение ЛНА<\/td>\n<td style=\"text-align: left;\">12, приказ пп. 1–4, 13.8; 10, 12.1–12.3; 04, 10.2–10.3; 09, 1.4; 08, 12.1–12.4; шапки остальных<\/td>\n<td style=\"text-align: left;\">Генеральный директор; HR; КДП; ИБ; специалист ОТ; юристы; представительный орган при наличии и предусмотренной обязанности<\/td>\n<td style=\"text-align: left;\">Приказ; Диадок; бумага; размещение в HR Space/Confluence по ответам 10.11, 2.1 и 3.1<\/td>\n<td style=\"text-align: left;\">Нет полученной общей цепочки: версия → отмена/изменение связанных пунктов → применимость → доказательство ознакомления. <a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>, 05, 06, 11, 14<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Приём и первый доступ<\/td>\n<td style=\"text-align: left;\">12, 2.10–2.13; 13, 2.1–3.2.3; 04, 5.1; 05, 3.2, 3.7; 09, 8.1–9.1; 03, 1.3, 3.8; 11, 2.4<\/td>\n<td style=\"text-align: left;\">КДП; HR по подбору/адаптации; руководитель; системный администратор; ответственный за тайну; специалист ОТ<\/td>\n<td style=\"text-align: left;\">Jira и почта; бумага/Диадок; папка сотрудника на сервере по встрече 11.11<\/td>\n<td style=\"text-align: left;\">Нужен набор ЛНА именно этого работодателя и должности, не одинаковая папка всем. Знакомить до договора там, где требует ТК 68; техника и инструктаж — отдельные действия. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 05, 08, 09, 13, 14<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Испытание и адаптация<\/td>\n<td style=\"text-align: left;\">07, 2.1–2.20, 3.1–3.9, прил. 2; 13, 1.3, 3.3, разд. 4; 12, 2.7–2.8<\/td>\n<td style=\"text-align: left;\">Непосредственный руководитель; куратор/наставник; руководитель кадровой службы; HR; КДП; генеральный директор<\/td>\n<td style=\"text-align: left;\">YouTrack/Jira/почта по 07; Jira по 13; сейчас Jira подтверждена встречей 11.11; статус YouTrack неизвестен<\/td>\n<td style=\"text-align: left;\">Нельзя без подтверждения приравнивать руководителя кадровой службы к HR или КДП. Исторический подписант в форме, разные роли куратора/наставника. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 07; содержание — PRIEM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Отпуск и замещение<\/td>\n<td style=\"text-align: left;\">16, 1.1–1.7, 2.1–2.6; 12, 4.11–4.23; 10, 10.12<\/td>\n<td style=\"text-align: left;\">Работник; непосредственный руководитель; руководитель проекта; ассистент; КДП; бухгалтерия; HR<\/td>\n<td style=\"text-align: left;\">Текст: почта, скан, бумага, Slack; практика: 1С Кабинет → задача руководителю в 1С → Диадок, встреча 11.11<\/td>\n<td style=\"text-align: left;\">Несовпадение сроков и адресатов, лишний повторный ручной маршрут; статус отсутствия не в нынешнем мессенджере. <a href=\"#/k/SKVOZ-03\">К-SKVOZ-03<\/a>, 04, 07; конкретные отпускные пункты — OTP<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Работа сверх нормы, дежурство и оплата<\/td>\n<td style=\"text-align: left;\">02, 1.2–1.5, 2.1–3.9, разд. 4–5; 10, разд. 4; 12, 3.2.26, 4.3–4.4, 4.17, 5.13<\/td>\n<td style=\"text-align: left;\">Инициатор; руководитель; генеральный директор; директор ИБ; HR; финансовый директор; КДП; главный бухгалтер; исполнительный директор по 10<\/td>\n<td style=\"text-align: left;\">Почта → служебная записка → Диадок/бумага → табель; Jira в форме 02. Подпись в 02 доступна по тексту только дистанционным<\/td>\n<td style=\"text-align: left;\">Разные маршруты в 02 и 10; не прислан перечень НРД/критичные инциденты; исполнительный директор не подтверждён. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 04, 06, 11; содержание — VREM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Табель, выплаты, премии и ДМС<\/td>\n<td style=\"text-align: left;\">10, 6.8–6.11, 7.2, 9.5, 10.2–10.11; 12, 6.7, 8.3, 9.10; 09, 8.1, 9.3<\/td>\n<td style=\"text-align: left;\">Руководитель КДП/начальник КДП; главный бухгалтер; HR; финансовый и генеральный директора; работник<\/td>\n<td style=\"text-align: left;\">1С, Диадок, почта; ДМС — приложение страховщика по ответам 10.11, 1.1<\/td>\n<td style=\"text-align: left;\">В 10 одной кадровой функции даны разные названия; рассылка зарплатных данных стыкуется с 09 не автоматически. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 13; премии/выплаты — PLAT<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Командировка и такси<\/td>\n<td style=\"text-align: left;\">14, 1.4, 2.1–2.5, 3.1–3.5, 4.1–4.3, прил. 1; 15, приказ п. 3, 1.2–1.4, 2.1–2.6<\/td>\n<td style=\"text-align: left;\">Работник; руководитель; администратор отдела; администратор OneTwoTrip; администратор такси;
