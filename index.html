ие об очередности всех изменений. После него — суммированный учёт и графики (<a href=\"#/k/VREM-08\">К-VREM-08<\/a>, 09, 15), проверка защищённых категорий (<a href=\"#/k/VREM-16\">К-VREM-16<\/a>), обязательное неполное время (<a href=\"#/k/VREM-17\">К-VREM-17<\/a>) и рабочее время адаптации (<a href=\"#/k/VREM-10\">К-VREM-10<\/a>). Опасные случаи допуска не ждут окончания переписывания ЛНА.<\/p>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Участники — роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Разрыв или связь<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Допуск к сверхурочной работе<\/td>\n<td style=\"text-align: left;\">02: 1.4, 2.1–2.7, 3.1–3.7; 10: 4.10<\/td>\n<td style=\"text-align: left;\">инициатор, руководитель работника, генеральный директор, директор департамента ИБ, HR-директор, финансовый директор, КДП, работник<\/td>\n<td style=\"text-align: left;\">корпоративная почта; служебная записка; бумага/ЭДО; Jira в форме; по ответы HR 10.11 — Диадок<\/td>\n<td style=\"text-align: left;\">10 сокращает маршрут до записки генеральному директору; 02 добавляет предварительное письмо и ИБ; неполно описаны новые условия сверх 120 часов<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Контроль часов до согласования<\/td>\n<td style=\"text-align: left;\">02: 2.1–2.3; 10: 4.7, 10.2–10.3; 12: 4.8<\/td>\n<td style=\"text-align: left;\">КДП, главный бухгалтер, руководитель<\/td>\n<td style=\"text-align: left;\">1С, рассылка руководителям, Диадок (ответы HR 10.11, перечень задач КДП, строка о табеле)<\/td>\n<td style=\"text-align: left;\">табель после факта не резервирует уже согласованные будущие часы; лимит за два дня строже нового закона<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Начисление сверхурочных<\/td>\n<td style=\"text-align: left;\">10: 4.2, 4.7–4.8; 02: 2.9, прил. 2А<\/td>\n<td style=\"text-align: left;\">КДП, бухгалтерия, работник<\/td>\n<td style=\"text-align: left;\">табель в 1С, приказ, согласие<\/td>\n<td style=\"text-align: left;\">нет повышенной оплаты с 121-го часа; форма просит двойную оплату всех сверхурочных, Положение — 150/200 процентов<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ненормированный день<\/td>\n<td style=\"text-align: left;\">02: 3.8; 10: 4.2; 12: 4.17<\/td>\n<td style=\"text-align: left;\">генеральный и исполнительный директора, HR, КДП, руководитель, работник<\/td>\n<td style=\"text-align: left;\">трудовой договор, приказ с перечнем должностей, отпускной учёт<\/td>\n<td style=\"text-align: left;\">перечень упомянут, но в предоставленном комплекте его нет; оплата сверхурочных поставлена в зависимость от отдельного решения<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Выходной/праздник и компенсация<\/td>\n<td style=\"text-align: left;\">02: 2.8, 3.2, 3.9, 5.1–5.4, прил. 2–3; 10: 4.3, 4.9<\/td>\n<td style=\"text-align: left;\">руководитель, работник, КДП, бухгалтерия<\/td>\n<td style=\"text-align: left;\">письмо, согласие, заявление, приказ, табель<\/td>\n<td style=\"text-align: left;\">не прописаны год на использование дня и расчёт при увольнении; для оклада не сказано, что доплата идёт сверх оклада<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Смены, скользящий график, суммированный учёт<\/td>\n<td style=\"text-align: left;\">12: 4.1–4.4; 02: 1.4, 2.8, 3.9; 10: 4.2, 4.8<\/td>\n<td style=\"text-align: left;\">руководитель подразделения, КДП, генеральный директор, работник<\/td>\n<td style=\"text-align: left;\">Confluence в ПВТР; ежемесячный график в Диадоке по ответы HR 10.11<\/td>\n<td style=\"text-align: left;\">смешаны график дежурств, сменность и суммированный учёт; порядка введения учёта нет; надо установить, какая версия графика утверждена<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Дежурства и инциденты<\/td>\n<td style=\"text-align: left;\">02: 4.1–4.4; 12: 3.2.26, 4.3, 5.13<\/td>\n<td style=\"text-align: left;\">руководитель, дежурный, ИБ, КДП<\/td>\n<td style=\"text-align: left;\">Confluence, рабочие каналы; отдельный регламент инцидентов упомянут в ПВТР<\/td>\n<td style=\"text-align: left;\">мониторинг и дополнительное время инцидента надо разделить без двойного учёта; регламент инцидентов не предоставлен<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ночные часы<\/td>\n<td style=\"text-align: left;\">02: 2.8, 3.8; 10: 4.6; 12: 4.3<\/td>\n<td style=\"text-align: left;\">руководитель, КДП, работник, бухгалтерия<\/td>\n<td style=\"text-align: left;\">график, согласие, табель<\/td>\n<td style=\"text-align: left;\">доплата 20 процентов записана; специальные проверки допуска к ночи и организация ночных смен не описаны<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение режима по заявлению<\/td>\n<td style=\"text-align: left;\">12: 4.2–4.3, 4.9; 03: 2.16<\/td>\n<td style=\"text-align: left;\">работник, руководитель, КДП, генеральный директор<\/td>\n<td style=\"text-align: left;\">письменное заявление, соглашение, приказ<\/td>\n<td style=\"text-align: left;\">приказ не заменяет изменение договорного режима; не назван новый срок решения по обязательному неполному времени<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Обязательные встречи и время взаимодействия<\/td>\n<td style=\"text-align: left;\">13: 3.3.4, разд. 4; 12: 5.10, 5.13; 03: 2.16<\/td>\n<td style=\"text-align: left;\">наставник, новый работник, участники команды, руководитель, КДП<\/td>\n<td style=\"text-align: left;\">встречи, Zoom и рабочие каналы по ПВТР<\/td>\n<td style=\"text-align: left;\">адаптация предписана после рабочего дня; для удалённой работы надо согласовать режим и учёт обязательных коммуникаций<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Отдых и краткое отсутствие<\/td>\n<td style=\"text-align: left;\">02: 5.1–5.4; 10: 4.9; 12: 4.5–4.6; 16: 1.1–1.7<\/td>\n<td style=\"text-align: left;\">работник, руководитель, КДП<\/td>\n<td style=\"text-align: left;\">заявление, почта, бумага/ЭДО<\/td>\n<td style=\"text-align: left;\">отпускной маршрут 16 распространён на любые отсутствия; он не должен подменять порядок отдыха за переработку или обед<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<p>Если подходят несколько вариантов, отметить их все; отсутствие ответа не считать подтверждением отсутствия документа или нарушения. Персональные данные для первого ответа не нужны.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">№<\/th>\n<th style=\"text-align: left;\">Вопрос и связанные кейсы<\/th>\n<th style=\"text-align: left;\">Готовые варианты ответа<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Какой предел компания хочет сохранить и нужен ли вообще режим сверх 120 часов? <a href=\"#/k/VREM-01\">К-VREM-01<\/a>, 02<\/td>\n<td style=\"text-align: left;\">А — оставляем нынешний предел за два дня и годовой предел; Б — хотим обсудить дневной предел, годовой не меняем; В — нужно рассмотреть расширение годового предела; Г — пока не решали. Для В: применимый коллективный договор/отраслевое соглашение подтверждён / требуется проверка / документа нет. Решение за руководителем компании; ответа HR недостаточно для изменения гарантии.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Были ли после начала действия новых правил часы начиная со 121-го и как рассчитана оплата? <a href=\"#/k/VREM-03\">К-VREM-03<\/a>, 13, 14<\/td>\n<td style=\"text-align: left;\">А — часов не было, подтверждено табелем; Б — были, 1С использует новый порог и проверена; В — были, настройки надо проверить; Г — годового отчёта пока нет. Дополнительно: первые часы по форме 2А всегда оплачивают вдвойне / применяют 150–200 процентов / условия различаются по договорам / требуется сверка.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Чем подтверждены НРД и фактическая работа за пределами дня? <a href=\"#/k/VREM-04\">К-VREM-04<\/a><\/td>\n<td style=\"text-align: left;\">А — есть перечень должностей, договорные условия и учёт; Б — перечень есть, договоры или часы надо сверить; В — перечень не найден в наличии у КДП; Г — НРД фактически не используется. Роль исполнительного директора: действует / полномочия переданы / не установлено; сведения о регулярной работе: есть / не выявлена / не проверяли.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Как связаны письмо, записка, согласие и приказ и зачем согласование ИБ? <a href=\"#/k/VREM-07\">К-VREM-07<\/a><\/td>\n<td style=\"text-align: left;\">А — последовательные этапы одной заявки, связь сохраняется; Б — параллельные несвязанные действия; В — маршрут различается по подразделениям; Г — нужно показать пример без данных сотрудников. ИБ согласует каждый случай / только технические случаи / фактически не участвует / нужно уточнить. Любое сокращение нынешнего маршрута — отдельное решение руководителя компании.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">5<\/td>\n<td style=\"text-align: left;\">Кто подтверждает факт и проверяет ещё не отработанные согласованные часы до подписания табеля? <a href=\"#/k/VREM-12\">К-VREM-12<\/a><\/td>\n<td style=\"text-align: left;\">А — КДП сверяет общий реестр с руководителями; Б — проверяет каждый руководитель отдельно; В — есть только фактический табель; Г — иной способ, описать. Даты закрытия: утверждены / сложились на практике / не определены. Передача факта: 1С / почта / Диадок / другой канал; интеграция проверена / нет.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">6<\/td>\n<td style=\"text-align: left;\">Где реестр дней отдыха за выходные и как он участвует в увольнении? <a href=\"#/k/VREM-05\">К-VREM-05<\/a>, 06, 11<\/td>\n<td style=\"text-align: left;\">А — отдельный реестр с датой работы, оплатой, остатком и расчётом; Б — остаток есть без связки с начислением; В — сведения собираются перед увольнением; Г — общего остатка нет. Использование даты: согласуется конкретная дата / может откладываться из-за загрузки / иной порядок. Доплата при увольнении: проверяется всегда / по запросу / пока не проверяли.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">7<\/td>\n<td style=\"text-align: left;\">Какие режимы и версии графиков действуют у сменных работников и дежурных? <a href=\"#/k/VREM-08\">К-VREM-08<\/a>, 09, 15<\/td>\n<td style=\"text-align: left;\">А — сменность и суммированный учёт, период и ознакомление подтверждены; Б — скользящий график без суммированного учёта; В — отдельные дежурства вне обычного дня; Г — сочетание, нужно разнести по категориям. Основной утверждённый график: Confluence / Диадок / иной источник. Регламент инцидентов: есть, укажем версию и владельца / готовится / не найден. Учёт мониторинга и вызова: раздельный / общий / требуется проверка.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">8<\/td>\n<td style=\"text-align: left;\">Кто проверяет запреты, право отказа и медицинское заключение отдельно для сверхурочных, ночи и выходных? <a href=\"#/k/VREM-16\">К-VREM-16<\/a><\/td>\n<td style=\"text-align: left;\">А — назначенный специалист КДП по действующему списку; Б — руководитель с последующей проверкой КДП; В — только общее согласие работника; Г — иной порядок. Актуальность списка и размер ночной доплаты: проверены юристами / требуют проверки. Ответ без диагнозов, семейных сведений и документов конкретного работника.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">9<\/td>\n<td style=\"text-align: left;\">Как регистрируется обращение об обязательном неполном времени и отделяется от обычного сдвига графика? <a href=\"#/k/VREM-17\">К-VREM-17<\/a><\/td>\n<td style=\"text-align: left;\">А — отдельная регистрация с датой и контролем срока; Б — общий маршрут через руководителя; В — таких обращений не было; Г — требуется проверить. Договоры с фиксированным режимом: перечень категорий есть / надо собрать; менять договорные условия одним приказом не предполагается.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">10<\/td>\n<td style=\"text-align: left;\">Что происходит с обязательной вечерней встречей и коротким отсутствием, не являющимся отпуском? <a href=\"#/k/VREM-10\">К-VREM-10<\/a>, 18<\/td>\n<td style=\"text-align: left;\">По встречам: А — проходят внутри рабочего времени всех участников; Б — после него с учётом и оформлением; В — после него, порядок надо проверить; Г — правило не используется. Длительность: установлена / разная / не определена. По отсутствиям: самостоятельные маршруты / применяют общий отпускной / зависит от основания, нужна карта. Обед: только организационное уведомление / требуется разрешение / правило фактически не применяется / иное.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "nehvatilo": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Норма или источник<\/th>\n<th style=\"text-align: left;\">Для чего нужен<\/th>\n<th style=\"text-align: left;\">Граница вывода<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">ТК ст. 203, полный текст, в том числе ч. 3<\/td>\n<td style=\"text-align: left;\">Проверить запрет сверхурочных в период ученического договора; <a href=\"#/k/VREM-16\">К-VREM-16<\/a> и 19<\/td>\n<td style=\"text-align: left;\">Ссылка есть в 02, п. 2.7, но полного текста в базах не найдено. Категорию из ЛНА не удалять. Проверить юристам.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Действующий акт Правительства о минимальном повышении оплаты за ночную работу<\/td>\n<td style=\"text-align: left;\">Проверить размер 20 процентов в 10, п. 4.6; <a href=\"#/k/VREM-16\">К-VREM-16<\/a><\/td>\n<td style=\"text-align: left;\">В есть указатель на ПП 554 и пометка, что текст не найден; это не доказательство действующей редакции или действия именно этого постановления. ТК ст. 154 есть, но сам процент она не устанавливает. Проверить юристам.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ТК ст. 185.1, полный актуальный текст после перенумерации частей<\/td>\n<td style=\"text-align: left;\">Подготовить отдельный медицинский маршрут, если компания решит разрешать сверх 120 часов; <a href=\"#/k/VREM-02\">К-VREM-02<\/a><\/td>\n<td style=\"text-align: left;\">Новая ч. 2 дословно есть в 144‑ФЗ, ст. 1 п. 7, это достаточный источник приведённой цитаты. Полного консолидированного порядка в базе не найдено; не достраивать остальные гарантии по памяти.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Нормативный порядок исчисления нормы часов, на который отсылает ТК ст. 91 ч. 3<\/td>\n<td style=\"text-align: left;\">Проверить календарную норму для приложения о суммированном учёте и методики ставки; <a href=\"#/k/VREM-08\">К-VREM-08<\/a> и 14<\/td>\n<td style=\"text-align: left;\">Сама ст. 91 в базе есть. Текста внешнего порядка в разрешённом комплекте не найдено; готовую универсальную формулу не выдаём.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>ТК ст. 259 <strong>есть<\/strong> в базе законов: первоначальная запись о её отсутствии исправлена. Все статьи из специального списка задания для VREM найдены в базе законов; недостающие источники выше возникли при проверке связей и окончательной методики. Номера статей, срок в рабочих днях и пороги здесь взяты из текстов базы, а не вычислены. Юридическую применимость базы и редакций подтверждают юристы компании; интернет не использовался.<\/p>", "keysy": [{"id": "К-VREM-01", "slug": "VREM-01", "title": "Старый предел сверхурочных строже нового закона: нельзя незаметно ослабить его", "imp": "высокая", "docs": ["02"], "meta": [["Документы", "02, п. 2.2; каталог процессов HR (проект), образец, шаг 2; черновик улья 02, раздел о пределах"], ["Тип", "устарело; расхождение чернового процесса с действующим ЛНА"], ["Кто решает", "руководитель компании и руководитель HR; юристы проверяют порядок изменения ЛНА"], ["Важность", "высокая: процесс может разрешить часы, запрещённые действующим правилом компании"]], "html": "<p><strong>Было.<\/strong> 02, п. 2.2: «Продолжительность сверхурочной работы не должна превышать для каждого работника 4 часа в течение двух дней подряд и 120 часов в год, за исключением случаев, предусмотренных ТК РФ.»<\/p>\n<p><strong>Что не так.<\/strong> Это не незаконно мягкий предел, а более строгий: он защищает от повторных переработок подряд. каталог процессов HR (проект) и черновик улья проверяют предел за день, поэтому без правки пропустят сочетание часов, которое Политика ещё запрещает. Новый закон не требует автоматически увеличивать нагрузку. Это выбор компании, а не исправление опечатки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 99 ч. 6, ред. 144‑ФЗ от 25.05.2026 (144‑ФЗ): «Продолжительность сверхурочной работы не должна превышать для каждого работника 4 часов в день и 120 часов в год, за исключением случаев, предусмотренных настоящим Кодексом.» ТК ст. 8 ч. 4, ред. 25.05.2026: «Нормы локальных нормативных актов, ухудшающие положение работников по сравнению с установленным трудовым законодательством ... не подлежат применению.»<\/p>\n<p><strong>Стало (предлагается).<\/strong> Рекомендация — сохранить нынешнюю защиту; заменить 02, п. 2.2:<\/p>\n<blockquote>\n<p>2.2. В Организации сохраняется ограничение сверхурочной работы: не более 4 часов в течение двух дней подряд и не более 120 часов в год для каждого Работника. Предусмотренные ТК РФ исключительные случаи рассматриваются кадровой службой совместно с юридической службой отдельно; согласование руководителя само по себе не является основанием превысить установленное ограничение.<\/p>\n<\/blockquote>\n<p>Альтернатива, только после отдельного решения об изменении защиты и проверки юристами порядка его введения:<\/p>\n<blockquote>\n<p>2.2. Продолжительность сверхурочной работы не должна превышать для каждого Работника 4 часов в день и 120 часов в год, за исключением случаев, предусмотренных ТК РФ.<\/p>\n<\/blockquote>\n<p>В Каталоге и черновике улья использовать именно утверждённый вариант. Решение о дневном пределе не означает решения разрешить работу свыше годового предела; это <a href=\"#/k/VREM-02\">К-VREM-02<\/a>. До изменения действует нынешний текст, включая его оговорку об исключениях по ТК.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. HR выносит два варианта с последствиями. 2. До утверждения нового текста КДП проверяет соседние дни и годовой итог по текущей Политике. 3. В Decision Flow закладывают утверждённый предел; пока нет проверенного источника данных, КДП подтверждает проверку вручную. 4. Решение и версия правила остаются в журнале.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сохраняем предел за два дня или сознательно меняем его? В каких случаях применяли оговорку об исключениях?<\/p>\n<p><strong>Цена вопроса.<\/strong> Иллюстрация, не фактическая загрузка: по 3 часа в два соседних дня допустимы по дневному пределу закона, но не по Политике. За два дня максимумы 4 и 8 часов соответственно (расчёт программой). Денег не считали.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в сравнении текстов; порядок изменения существующей гарантии проверяют юристы.<\/p>"}, {"id": "К-VREM-02", "slug": "VREM-02", "title": "Оговорка об исключениях не заменяет допуск к работе сверх 120 часов", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 2.2, 2.5, 3.2–3.7; 10, п. 4.2"], ["Тип", "устарело; пробел"], ["Кто решает", "руководитель компании выбирает необходимость расширения; юристы и HR готовят основания"], ["Важность", "высокая: обычное согласование не даёт права повысить годовой предел"]], "html": "<p><strong>Было.<\/strong> 02, п. 2.2: «120 часов в год, за исключением случаев, предусмотренных ТК РФ». В п. 3.2 названы «служебной записки» и «письменного согласия Работника»; отдельной процедуры допуска сверх годового предела в Политике нет.<\/p>\n<p><strong>Что не так.<\/strong> После изменений закона потенциальное повышение годового предела не происходит автоматически. Нужны коллективный договор и/или применимое отраслевое соглашение; одного нового ЛНА и согласия директора недостаточно. Затем проверяются категории работников, письменные согласия и правила медицинского маршрута. Наличие этих оснований в компании не подтверждено; отсутствие документов в комплекте не доказывает их отсутствия вообще.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 99 ч. 6, ред. 144‑ФЗ от 25.05.2026: «может быть увеличена до 240 часов в год, если это предусмотрено коллективным договором и (или) отраслевым (межотраслевым) соглашением, распространяющимся на данного работодателя». Ч. 7: «работники, условия труда на рабочих местах которых по результатам специальной оценки условий труда отнесены к вредным условиям труда подклассов 3.3 и 3.4» включены в категории с пределом 120 часов. Ч. 8 для пенсионного/предпенсионного возраста и подклассов 3.1–3.2: «допускается только с их письменного согласия и при условии, что это не запрещено им по состоянию здоровья в соответствии с медицинским заключением». Ч. 9: «Привлечение работника к сверхурочной работе сверх 120 часов в год допускается с его письменного согласия ... которыми предусматривается порядок направления на предварительное прохождение работником по его письменному заявлению профилактического медицинского осмотра, диспансеризации или периодического медицинского осмотра». 144‑ФЗ, ст. 1 п. 7, новая ч. 2 ст. 185.1: «имеют право на освобождение от работы на один рабочий день в год с сохранением за ними места работы (должности) и среднего заработка» при диспансеризации работников, привлекаемых сверх 120 часов.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 02 после п. 2.2:<\/p>\n<blockquote>\n<p>2.2.1. Увеличение годового предела сверхурочной работы обычным согласованием заявки не допускается. До введения отдельного порядка и подтверждения юридической службой предусмотренных статьей 99 ТК РФ оснований плановые заявки сверх 120 часов в год не согласуются. Исключительные случаи, предусмотренные непосредственно ТК РФ, проверяются юридической службой отдельно.\n2.2.2. При рассмотрении вопроса об увеличении предела кадровая и юридическая службы подтверждают применимость коллективного договора и (или) отраслевого соглашения, установленный ими предел, ограничения по категориям работников и условиям труда. До привлечения вводятся правила допуска с письменными согласиями, ознакомлением с правом отказа в предусмотренных законом случаях и порядком направления на медицинские мероприятия по письменному заявлению Работника. Предусмотренные законом гарантии при диспансеризации сохраняются. Решение руководителя не заменяет перечисленных оснований и документов.<\/p>\n<\/blockquote>\n<p>Это предохранитель, а не готовое разрешение работать до 240 часов. Рекомендация — пока сохранить нынешний годовой предел. Вариант расширения готовить отдельно, только если компания действительно нуждается в нём; специальный медицинский порядок сверить с группой OT. В улье убрать неподтверждённое утверждение, что коллективного договора нет.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП проверяет годовой итог до отправки на согласование. 2. Заявка с превышением не получает обычного положительного решения. 3. Юристы проверяют основания; HR при необходимости готовит отдельный пакет изменения правил. 4. Условия медицинского допуска подтверждает уполномоченный специалист, без раскрытия медицинских сведений в общей карточке Decision Flow.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли коллективный договор, применимое отраслевое соглашение и случаи сверх 120 часов? Нужен ли компании расширенный режим вообще?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет выгрузки фактических часов и оснований расширения.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в обязательности нескольких условий; применимость конкретных исключений — юристам.<\/p>"}, {"id": "К-VREM-03", "slug": "VREM-03", "title": "В оплате сверхурочных отсутствует правило 121-го часа", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "10, п. 4.2; 02, п. 2.9"], ["Тип", "расходится с законом; устарело"], ["Кто решает", "HR и бухгалтерия; юристы до утверждения"], ["Важность", "высокая: текст допускает оплату ниже минимума, если такие часы фактически есть"]], "html": "<p><strong>Было.<\/strong> 10, п. 4.2: «за первые два часа сверхурочной работы — в размере 150 процентов»; «за последующие часы сверхурочной работы — в размере 200 процентов».<\/p>\n<p><strong>Что не так.<\/strong> Текст не различает часы до и после годового порога. Поэтому первые часы конкретного дня, оказавшиеся сверх 120 часов за год, по Положению получат меньший коэффициент. Факт недоплаты не установлен: неизвестны фактические часы и настройки расчёта. Законность самого привлечения сверх предела проверяется отдельно и не подменяется повышенной оплатой.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 152 ч. 1, ред. 144‑ФЗ от 25.05.2026 (144‑ФЗ): «в пределах 120 часов в год за первые два часа работы не менее чем в полуторном размере, за последующие часы - не менее чем в двойном размере, начиная со 121-го часа - не менее чем в двойном размере за каждый час». Для суммированного учёта: «исходя из величины сверхурочного времени, приходящегося на день (смену), в который (которую) осуществляется сверхурочная работа».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 10, п. 4.2 заменить абзацы о размере оплаты; блок о НРД правится отдельно в <a href=\"#/k/VREM-04\">К-VREM-04<\/a>:<\/p>\n<blockquote>\n<p>Сверхурочная работа оплачивается исходя из размера заработной платы, установленного действующей системой оплаты труда в период выполнения работы, включая компенсационные и стимулирующие выплаты. В пределах 120 часов в год первые два часа оплачиваются в размере 150 процентов, последующие часы — 200 процентов. Начиная со 121-го часа сверхурочной работы в году каждый час оплачивается в размере 200 процентов. При суммированном учете расчет производится по величине сверхурочного времени, приходящегося на день (смену) выполнения сверхурочной работы, с применением указанных коэффициентов и годового порога. Более высокий размер, установленный для Работника, сохраняется. Компенсация отдыхом по желанию Работника осуществляется в порядке раздела 5 Политики 02.<\/p>\n<\/blockquote>\n<p>02, п. 2.9 сохранить как ссылку на 10; не дублировать денежную формулу в нескольких ЛНА. С бухгалтерией и группой PLAT сверить методику часовой ставки (<a href=\"#/k/VREM-14\">К-VREM-14<\/a>).<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП и бухгалтерия сопоставляют часы с годовым накоплением и днями/сменами. 2. Проверяют переход через порог внутри дня и корректировки прошлых периодов. 3. При обнаружении разницы рассчитывают её и передают юристам вопрос о сроках и компенсации задержки. 4. В Decision Flow остаётся подтверждение проверки, а расчёт зарплаты — в учётной системе.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли такие часы после начала действия новой нормы и как их рассчитала 1С?<\/p>\n<p><strong>Цена вопроса.<\/strong> Иллюстрация: за один час после порога текст 10 даёт 1,5 часовой ставки вместо 2; разница 0,5 ставки. За два таких первых часа — 1 ставка (расчёт программой). Фактических рублей не считали.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по недостаточности текста; фактическая недоплата не доказана.<\/p>"}, {"id": "К-VREM-04", "slug": "VREM-04", "title": "Доплата за сверхурочные при ненормированном дне зависит от отдельного решения", "imp": "высокая", "docs": ["02", "10", "12"], "meta": [["Документы", "02, п. 3.8; 10, п. 4.2; 12, п. 4.17"], ["Тип", "противоречие между документами; пробел"], ["Кто решает", "руководитель HR; юристы определяют окончательную конструкцию"], ["Важность", "высокая: КДП и работник не понимают, когда работа оплачивается и кто вправе её назначить"]], "html": "<p><strong>Было.<\/strong> 02, п. 3.8: «Работник с ненормированным рабочим днем не можетпривлекаться к сверхурочным работам, так как за ненормированный рабочий день Работник получает дополнительный оплачиваемый отпуск. Исключения составляют регулярные (а не эпизодические) привлечения работника к работе за пределами установленной продолжительности рабочего времени.» 10, п. 4.2: «Указанные доплаты могут производиться в исключительных случаях Работникам, которым установлен ненормированный рабочий день, по решению Исполнительного директора и на основании Приказа Генерального директора, при отсутствии такого Приказа указанные доплаты Работникам, которым установлен ненормированный рабочий день, не производятся.» 12, п. 4.17: «Перечень должностей с ненормированным рабочим графиком подлежит утверждению и изменению приказом Генерального директора.»<\/p>\n<p><strong>Что не так.<\/strong> Политика 02 верно отделяет эпизодическое привлечение при НРД от регулярной работы вне установленного времени; слова «регулярные» и «эпизодические» в ней не перепутаны. Противоречие возникает с Положением 10: оно ставит доплаты в зависимость от отдельного решения. Квалификацию конкретной работы проверяют по инициативе работодателя, режиму и фактическим обстоятельствам, а не только по её регулярности. В 10 оплата поставлена в зависимость от решения должностного лица и приказа, хотя выполненное время нельзя превращать в неоплачиваемое отсутствием приказа. При этом сам перечень должностей в предоставленных материалах не приложен, поэтому нельзя установить, кому НРД назначен. Практику выплат HR не подтверждала; утверждать, что деньги уже не платятся, нельзя.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 97, ред. 25.05.2026: «для сверхурочной работы (статья 99 настоящего Кодекса);»; «если работник работает на условиях ненормированного рабочего дня (статья 101 настоящего Кодекса).». ТК ст. 101, ред. 25.05.2026: «могут по распоряжению работодателя при необходимости эпизодически привлекаться к выполнению своих трудовых функций за пределами установленной для них продолжительности рабочего времени». ТК ст. 152 ч. 1: «Сверхурочная работа оплачивается ... начиная со 121-го часа - не менее чем в двойном размере за каждый час.» Прямой нормы в базе, которая разрешала бы не платить за фактически выполненную сверхурочную работу из-за отсутствия приказа, нет; проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 02, п. 3.8:<\/p>\n<blockquote>\n<p>3.8. Работники, которым установлен ненормированный рабочий день, привлекаются к выполнению своих трудовых функций за пределами установленной продолжительности рабочего времени эпизодически по распоряжению Работодателя. Регулярная работа за пределами установленной продолжительности рабочего времени ненормированным рабочим днем не признается и оформляется как сверхурочная работа с соблюдением настоящей Политики и ТК РФ. Работа в ночное время оплачивается в порядке статьи 154 ТК РФ, работа в выходной или нерабочий праздничный день оформляется согласно пункту 3.2 настоящей Политики.<\/p>\n<\/blockquote>\n<p>Заменить 10, п. 4.2, абзацы о НРД:<\/p>\n<blockquote>\n<p>Работа за пределами установленной продолжительности рабочего времени работника с ненормированным рабочим днем, если она имеет признаки сверхурочной работы, оформляется и оплачивается по правилам настоящего Положения и Политики о сверхурочной работе. Отсутствие отдельного приказа не лишает Работника права на оплату фактически выполненной работы; порядок фиксации и оформления нарушения устанавливается отдельно юристами.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.17 оставить три дня, но заменить «рабочим графиком» на «рабочим днем» и добавить: перечень должностей хранится у КДП вместе с приказом и датой действия. Принять отдельный приказ с перечнем после проверки должностей и трудовых договоров; не подменять им изменение трудового договора.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП сверяет перечень НРД с договорами. 2. Руководитель заявляет эпизодическое привлечение либо сверхурочную работу; форма не позволяет выбрать «работу по НРД без фиксации часов». 3. Работник знакомится с распоряжением, часы попадают в табель. 4. При регулярности HR поднимает вопрос о прекращении практики или законном оформлении, а бухгалтерия начисляет оплату за подтверждённое время.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где приказ с перечнем должностей? Кто сейчас исполняет роль исполнительного директора? Были ли регулярные привлечения у работников с НРД и как их отражали в табеле?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет списка должностей, часов и начислений.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в противоречии текстов; окончательное толкование и текст оплаты — юристам.<\/p>"}, {"id": "К-VREM-05", "slug": "VREM-05", "title": "Оплата работы в выходной не говорит, что доплата начисляется сверх оклада", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 5.2–5.4; 10, п. 4.3"], ["Тип", "ошибка формулировки; неполно"], ["Кто решает", "HR и бухгалтерия; юристы проверяют расчётную практику"], ["Важность", "высокая: формула может быть понята как выплата только 100/200 процентов, а не сверх оклада"]], "html": "<p><strong>Было.<\/strong> 10, п. 4.3: «в размере 100 процентов часовой ставки - если работа в выходной или праздничный день производилась в пределах месячной нормы рабочего времени» и «в размере 200 процентов часовой ставки - если работа в выходной или праздничный день производилась сверх месячной нормы рабочего времени». 02, п. 5.2: «работа в выходной или нерабочий праздничный день оплачивается в одинарном размере, а день отдыха оплате не подлежит».<\/p>\n<p><strong>Что не так.<\/strong> Для работника на окладе важно прямо сказать, что ставка начисляется сверх оклада. Сейчас это видно только по сопоставлению с законом и может быть истолковано как замена части оклада. Политика 02 и Положение 10 также используют разные уровни детализации: 02 говорит о компенсации днём отдыха, 10 — о доплате. Проверить, как фактически считает 1С, нужно до утверждения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 153 ч. 1, ред. 25.05.2026: для окладников «в размере не менее одинарной дневной или часовой ставки ... сверх оклада ... если работа ... в пределах месячной нормы» и «в размере не менее двойной ... сверх оклада ... если работа производилась сверх месячной нормы». Ч. 4: «По желанию работника ... может быть предоставлен другой день отдыха. В этом случае работа ... оплачивается в одинарном размере, а день отдыха оплате не подлежит.»<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 10, п. 4.3:<\/p>\n<blockquote>\n<p>4.3. За часы, фактически отработанные в выходной или нерабочий праздничный день, Работникам, получающим оклад, производится доплата сверх оклада: в размере не менее одинарной часовой ставки за часы в пределах месячной нормы рабочего времени и не менее двойной часовой ставки за часы сверх месячной нормы рабочего времени. При выборе Работником другого дня отдыха работа оплачивается в одинарном размере, а день отдыха оплате не подлежит. Порядок заявления и использования дня отдыха установлен Политикой о сверхурочной работе и работе в выходные и нерабочие праздничные дни.<\/p>\n<\/blockquote>\n<p>В 02, п. 5.4 заменить условие «в соответствии с графиком отпусков и производственной загруженностью» на: «по желанию Работника день отдыха может быть использован в течение одного года со дня работы в выходной или нерабочий праздничный день либо присоединен к отпуску, предоставляемому в указанный период». В 02 добавить правило расчёта при увольнении из ст. 153 ч. 6; форму прил. 3 расширить на день отдыха за выходной. Обновить ссылку в прил. 2Б на ст. 153 вместо ст. 152.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. В согласии работник выбирает повышенную оплату или день отдыха. 2. КДП отражает фактические часы в табеле. 3. Бухгалтерия применяет ставку сверх оклада либо одинарную оплату при выбранном дне отдыха. 4. Реестр дней отдыха проверяется при увольнении; неиспользованные дни дают расчётную разницу по закону.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас 1С считает работу окладника в выходной: сверх оклада или заменяет часть оклада? Есть ли неиспользованные дни отдыха за 2025–2026 годы?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет фактических часов, окладов и выборов компенсации.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по нужной формулировке; фактическая ошибка начисления не доказана.<\/p>"}, {"id": "К-VREM-06", "slug": "VREM-06", "title": "День отдыха за выходной ограничен загрузкой и не связан с годовым сроком", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 5.2–5.4 и прил. 3; 10, п. 4.9"], ["Тип", "устарело; пробел"], ["Кто решает", "руководитель HR; юристы до утверждения"], ["Важность", "высокая: работник может потерять понятный срок использования компенсации"]], "html": "<p><strong>Было.<\/strong> 02, п. 5.4: «Дополнительное время отдыха предоставляется по заявлению Работника в соответствии с графиком отпусков и производственной загруженностью Организации.» Приложение 3 называется «Заявление на предоставление дополнительных дней отдыха» и содержит: «Прошу предоставить дополнительные дни отдыха ... за сверхурочную работу ...». Для работы в выходной форма отдельной строки не даёт. 10, п. 4.9: «По желанию Работника вместо указанных выше доплат свыше часовой ставки в пунктах 4.2-4.3 настоящего Положения ему могут предоставляться дополнительные дни отдыха.»<\/p>\n<p><strong>Что не так.<\/strong> Связка с графиком отпусков и загрузкой не отвечает на вопрос, когда день можно использовать, и превращает право работника в зависимость от неопределённого условия. Годовой срок использования дня отдыха за выходной и расчёт при увольнении в ред. 02 не описаны. Части 5–6 ст. 153 введены законом от 30.09.2024, то есть сам закон принят до редакции Политики от 01.07.2025, а не после неё (расчёт программой). Дата начала действия этих частей в разрешённой базе отдельно не установлена; в редакции базы на дату разбора они присутствуют. Фактически накопленные дни не выгружались для этого разбора.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 153 ч. 4–6, ред. 25.05.2026: «По желанию работника ... ему может быть предоставлен другой день отдыха»; «день отдыха ... может быть использован в течение одного года со дня работы ... либо присоединен к отпуску»; при увольнении «выплачивается разница между оплатой работы ... полагавшейся ему ... и фактически произведенной оплатой работы в этот день». ТК ст. 152 ч. 1: отдых за сверхурочные «не менее времени, отработанного сверхурочно».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 02, п. 5.4:<\/p>\n<blockquote>\n<p>5.4. По желанию Работника компенсация за сверхурочную работу предоставляется временем отдыха не менее фактически отработанного сверхурочно. День отдыха за работу в выходной или нерабочий праздничный день предоставляется по желанию Работника. Такой день отдыха может быть использован в течение одного года со дня работы в выходной или нерабочий праздничный день либо присоединен к отпуску, предоставляемому в указанный период. Заявление не отменяет право Работника на выбор компенсации и не ставит его предоставление в зависимость от графика отпусков или производственной загруженности, кроме согласования конкретной даты отдыха с учётом режима работы. При прекращении трудового договора КДП передаёт бухгалтерии сведения о неиспользованных днях для расчёта по статье 153 ТК РФ.<\/p>\n<\/blockquote>\n<p>Заменить приложение 3: добавить вид основания — сверхурочная работа / работа в выходной / нерабочий праздничный день; дата и часы; выбранная компенсация; желаемая дата отдыха; поле КДП «срок, к которому день отдыха можно использовать». В 10, п. 4.9 оставить отсылку к 02 и написать: «По желанию Работника вместо повышенной оплаты за сверхурочную работу предоставляется дополнительное время отдыха не менее времени, отработанного сверхурочно. Порядок установлен разделом 5 Политики 02». В каталоге процесс назвать «Компенсация за сверхурочные и выходной» и вести журнал.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник выбирает оплату или отдых в согласии до начала работы. 2. КДП записывает источник, часы и крайний срок. 3. Работник подаёт дату, руководитель согласует только рабочее планирование. 4. Ежемесячная сверка показывает приближение годового срока. 5. При увольнении неиспользованный день за выходной передаётся в расчёт.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сколько дней отдыха накоплено и где они учитываются? Как сейчас согласуется дата: отказ в любой дате или только перенос конкретной даты?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет реестра часов и дней отдыха.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по содержанию закона; детали учёта сверхурочного отдыха проверяют юристы и бухгалтерия.<\/p>"}, {"id": "К-VREM-07", "slug": "VREM-07", "title": "Политика требует письмо двум ролям, а Положение — только служебную записку", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 3.2–3.7; 10, п. 4.10; ответы HR 10.11, раздел о процессах"], ["Тип", "неполное перекрёстное регулирование; практика требует уточнения"], ["Кто решает", "руководитель компании выбирает маршрут; HR и юристы приводят ЛНА к нему"], ["Важность", "высокая: заявка может идти двумя маршрутами с разными ответственными"]], "html": "<p><strong>Было.<\/strong> 02, п. 3.4: «Инициатор до начала планируемых работ направляет письмо на согласование по корпоративной почте с обоснованием необходимости проведения работ, указанием списка работников, даты и времени проведения работ» генеральному директору и директору департамента ИБ; «в копии письма - HR-директор, Финансовый директор и работники кадровой службы». 10, п. 4.10: «Основанием для издания такого приказа является служебная записка непосредственного руководителя работника (работников) или руководителя подразделения – внутреннего заказчика работ на имя Генерального директора.» По ответы HR 10.11: руководитель согласует по почте с руководителем компании, затем направляет записку через Диадок, КДП оформляет работы на период.<\/p>\n<p><strong>Что не так.<\/strong> Документы не устанавливают взаимоисключающих оснований: Политика 02 сама требует и письмо, и записку. Положение 10 описывает только основание приказа и не отсылает к предварительному маршруту 02; если читать его отдельно, этап можно пропустить. По ответу HR почта затем Диадок действительно используются, но адресаты из ответа нельзя переносить в ЛНА: здесь оставлены только роли. Неясно, письмо — отдельное решение или черновик служебной записки; поэтому при сборке процесса нужно подтвердить связь двух документов и момент предварительного решения. Отсутствие общего журнала в фактической практике не установлено.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 99 ч. 4, ред. 25.05.2026: «В других случаях привлечение к сверхурочной работе допускается с письменного согласия работника и с учетом мнения выборного органа первичной профсоюзной организации.» ТК ст. 99 ч. 10: «Работодатель обязан обеспечить точный учет продолжительности сверхурочной работы каждого работника.» Форма маршрута — решение работодателя; закон не требует именно двух внутренних писем, но требует письменное согласие и точный учёт.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Выбрать единый маршрут и перенести его в 02, заменив пп. 3.2–3.5:<\/p>\n<blockquote>\n<p>3.2. Инициатор до начала работ создаёт одну заявку на привлечение к сверхурочной работе, работе в выходной или нерабочий праздничный день. В заявке указываются причина, невозможность выполнения работ в рабочее время, работники, дата, период, количество часов, задача в Jira при её наличии и предполагаемый вид компенсации.\n3.3. Заявка направляется генеральному директору; если работа затрагивает техническую безопасность или стабильность системы, одновременно направляется директору департамента информационной безопасности. Руководитель работника подтверждает возможность привлечения. HR-директор, КДП и финансовый директор получают заявку в копии либо через карточку процесса.\n3.4. После предварительного решения работник до начала работы даёт письменное согласие и выбирает компенсацию. КДП оформляет приказ и знакомит с ним работника; письмо, заявка, согласие и приказ хранятся в одной карточке.\n3.5. Служебная записка не является вторым несвязанным маршрутом: если она нужна для приказа, она формируется из заявки и содержит те же поля.<\/p>\n<\/blockquote>\n<p>В 10, п. 4.10 заменить «Основанием ... является служебная записка» на «Основания и маршрут установлены разделом 3 Политики 02». В каталоге заменить «распоряжение в Диадоке» на «приказ», как названо в 02, п. 3.7. Если руководитель компании выберет вариант Б из Выборов (лимиты команды), его нельзя вводить до сверки с обязательным маршрутом 02.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель создаёт карточку до начала работ. 2. Роли получают одну задачу и один набор полей. 3. Работник подписывает согласие. 4. КДП оформляет приказ, вносит часы в табель и закрывает карточку после факта. 5. Несовпадение факта с заявкой создаёт флаг.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Нужно ли согласование директора ИБ на каждый случай или только при техническом риске? Письмо и записка сейчас имеют разные юридические функции?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; лишние шаги и задержки видны качественно, длительность маршрута не выгружена.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в неполноте отсылок и наличии двух каналов по ответу HR; взаимоисключение действующих маршрутов не доказано, окончательное упрощение — выбор руководителя компании.<\/p>"}, {"id": "К-VREM-08", "slug": "VREM-08", "title": "Суммированный учёт разрешён договором, но его порядок не установлен в ПВТР", "imp": "высокая", "docs": ["02", "10", "12"], "meta": [["Документы", "12, п. 4.3; 02, пп. 1.4, 2.8, 3.9; 10, пп. 2.3, 4.2, 4.8"], ["Тип", "пробел; смешение режимов"], ["Кто решает", "руководитель HR; юристы и КДП до утверждения порядка"], ["Важность", "высокая: нельзя надёжно определить норму и сверхурочные за учётный период"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.3: «Для отдельных подразделений и должностей, начало работы определяется согласно графику дежурств, который размещается на Confluence ... Трудовым договором с Работником может быть установлен суммированный учет рабочего времени, с продолжительностью учетного период не более 1 года.» 02, п. 3.9: «Порядок привлечения к работе в выходные и нерабочие праздничные дни не распространяется ... если указанные дни являются для Работника рабочими в соответствии с утвержденным Графиком работы.»<\/p>\n<p><strong>Что не так.<\/strong> В одном пункте соединены график дежурств, график работы и суммированный учёт, но не названы начало и окончание смен, учётный период для конкретной категории, порядок утверждения, ознакомление и итоговая сверка. Договор может установить режим конкретному работнику, но ПВТР не объясняет, как система вводится и проверяется. По ответы HR 10.11 табель согласуют два раза в месяц в 1С; это практика учёта, но она не заменяет порядок суммированного учёта.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 104 ч. 1 и 4, ред. 25.05.2026: суммированный учёт допускается, чтобы за учётный период «продолжительность рабочего времени ... не превышала нормального числа рабочих часов»; для вредных/опасных условий учётный период по ч. 1 — «три месяца», исключение по ч. 2 требует отраслевого соглашения и коллективного договора; «Порядок введения суммированного учета рабочего времени устанавливается правилами внутреннего трудового распорядка.» ТК ст. 100: режим должен предусматривать «время начала и окончания работы ... чередование рабочих и нерабочих дней». ТК ст. 103: «При сменной работе каждая группа работников должна производить работу ... в соответствии с графиком сменности»; графики доводятся «не позднее чем за один месяц до введения».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 12, п. 4.3:<\/p>\n<blockquote>\n<p>4.3. По соглашению между Работником и Обществом может быть установлен иной режим рабочего времени. Если невозможно соблюдать установленную для категории Работников ежедневную или еженедельную продолжительность рабочего времени, допускается введение суммированного учета рабочего времени по порядку, установленному настоящими Правилами. Категории Работников, дата введения и учетный период определяются приложением к настоящим Правилам после проверки условий труда и трудовых договоров. Учетный период не превышает одного года, а для работников с вредными и (или) опасными условиями труда — трех месяцев, кроме предусмотренного частью второй статьи 104 ТК РФ исключения. Норма часов учитывает установленную Работнику продолжительность рабочего времени, в том числе неполное время. Для каждой категории утверждаются график работы, время начала и окончания смен, продолжительность смен, междусменный отдых, выходные дни и порядок ознакомления. График дежурств не заменяет график работы. Кадровая служба по итогам учетного периода сопоставляет фактически отработанные часы с нормой и оформляет сверхурочную работу по ТК РФ и Политике о сверхурочной работе и работе в выходные и нерабочие праздничные дни.<\/p>\n<\/blockquote>\n<p>Добавить после него отдельный п. 4.3.1: «Порядок и сроки утверждения графиков, их размещения в Confluence и ознакомления Работников устанавливаются приложением к настоящим Правилам. Если график является графиком сменности, он доводится до сведения Работников не позднее срока, установленного ТК РФ.» В 02, пп. 2.8–3.9 заменить термин «график работы» на конкретный вид графика после инвентаризации.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП получает список категорий и договоров. 2. HR выбирает учётный период и готовит приложение к ПВТР. 3. Руководитель утверждает графики заранее; работники знакомятся. 4. 1С ведёт фактические часы, КДП проверяет промежуточно. 5. В конце периода бухгалтерия и КДП считают сверхурочные по правилам 10 и 02.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> У кого сейчас суммированный учёт? Какой учётный период фактически применяется? Является ли Confluence-график графиком дежурств или графиком сменности?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет списка работников и графиков.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по пробелу в ПВТР; категории и фактический режим — вопрос HR.<\/p>"}, {"id": "К-VREM-09", "slug": "VREM-09", "title": "Дежурство и работа при инциденте записаны как один вид времени", "imp": "высокая", "docs": ["02", "12"], "meta": [["Документы", "02, пп. 4.1–4.4; 12, пп. 3.2.26, 5.13; карта 1, строка 4.1–4.4"], ["Тип", "пробел; ссылка на отсутствующий документ"], ["Кто решает", "руководитель HR; юристы и охрана труда/ИБ до утверждения"], ["Важность", "высокая: мониторинг и фактическая работа могут попасть в табель неполно или дважды"]], "html": "<p><strong>Было.<\/strong> 02, п. 4.1: «В целях обеспечения бесперебойной работы, могут устанавливаться дежурства в выходные и нерабочие праздничные дни.» П. 4.2: «Дежурство предполагает мониторинг ситуации в течении выходного или нерабочего праздничного дня. При этом в Служебной записке отображается количество часов работы в рамках дежурства.» П. 4.3: «Время разрешения инцидента оформляется дополнительным временем работы в выходной или нерабочий праздничный день.» П. 4.4: «Процедура оформления аналогична п.3 Положения.» 12, п. 5.13 ссылается на «Регламент работы с критичными инцидентами», которого среди предоставленных документов нет.<\/p>\n<p><strong>Что не так.<\/strong> П. 4.2 говорит о количестве часов дежурства, но не говорит, считается ли мониторинг рабочим временем и как фиксируется каждый вызов. П. 4.3 правильно выделяет разрешение инцидента как работу в выходной, но нет правила исключить двойной учёт часов дежурства и инцидента. Ссылка «п.3 Положения» не указывает ясно на Политику 02 и содержит неправильное наименование. Сам Регламент инцидентов не представлен, поэтому порядок реакции и роли неизвестны.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 91: «Работодатель обязан вести учет времени, фактически отработанного каждым работником.» ТК ст. 113 ч. 8, ред. 25.05.2026: работа в выходные «производится по письменному распоряжению работодателя». ТК ст. 153 ч. 3: «Оплата в повышенном размере производится всем работникам за часы, фактически отработанные в выходной ... день».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 02, разд. 4:<\/p>\n<blockquote>\n<p>4.1. Дежурство устанавливается для мониторинга ситуации в выходной или нерабочий праздничный день по утвержденному графику. В графике и служебной записке указываются период дежурства, ожидаемые действия, канал вызова и способ учёта времени.\n4.2. Время фактического мониторинга и время выполнения задания по вызову фиксируются раздельно. Если мониторинг и (или) вызов являются рабочим временем, КДП оформляет и оплачивает их по правилам работы в выходной день либо сверхурочной работы; одни и те же часы повторно не учитываются.\n4.3. При инциденте дежурный фиксирует время получения вызова, начала и окончания работ. Время разрешения инцидента оформляется как фактически отработанное время в выходной или нерабочий праздничный день с письменным распоряжением и согласием, если они требуются законом.\n4.4. Процедура оформления устанавливается настоящим разделом и разделом 3 настоящей Политики. Ссылка на отдельный Регламент допускается только после его утверждения, указания версии и места хранения.<\/p>\n<\/blockquote>\n<p>Уточнить у группы OT и юристов, не относится ли отдельная часть к охране труда или безопасности; не придумывать режим дежурств до их ответа. ПВТР 5.13 дополнить ссылкой на фактически утверждённый Регламент либо убрать ссылку.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП публикует график и форму дежурства. 2. Дежурный отмечает мониторинг и вызовы. 3. Руководитель подтверждает фактические интервалы. 4. КДП исключает пересечение, оформляет приказ и табель. 5. Бухгалтерия применяет оплату или выбранный отдых.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Считается ли мониторинг рабочим временем? Где хранятся графики и служебные записки? Сколько вызовов и часов было за последний год?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет графиков, записок и журнала инцидентов.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по пробелу и ошибке ссылки; правовая квалификация мониторинга — юристам.<\/p>"}, {"id": "К-VREM-10", "slug": "VREM-10", "title": "Рабочая встреча наставника назначена после рабочего дня без правила оплаты и учёта", "imp": "средняя", "docs": ["03", "12", "13"], "meta": [["Документы", "13, п. 3.3.4 и разд. 4 (две строки таблицы); 12, пп. 4.1–4.2; 03, п. 2.16"], ["Тип", "расходится с режимом рабочего времени; пробел"], ["Кто решает", "руководитель HR; юристы проверяют режим и оплату"], ["Важность", "средняя: обязательное время может стать неучтённой работой"]], "html": "<p><strong>Было.<\/strong> 13, п. 3.3.4: «Встречи должны проводиться вечером по завершении рабочего дня.» В таблице раздела 4 для встреч в первые полные две недели комментарий: «Проводятся после рабочего дня.» Для 3-й и 4-й недели комментарий: «Проводятся после рабочего дня.» Периодичность в п. 3.3.4: «ежедневные встречи» первые две недели и «один раз в два дня» следующие две недели. В таблице: «Каждый рабочий день» и частота один раз в два рабочих дня (скан 13, страница 2, повторно сверено по изображению; дословные читаемые фрагменты: «1 раз» и «рабочих ... дня», OCR склеил и перемешал ячейки). 12, п. 4.2 устанавливает для всех подразделений время «с 10-00 до 19-00», обед «1 час ... с 13-00 часов до 14-00 часов»; 03, п. 2.16: «режим рабочего времени и времени отдыха дистанционного работника устанавливается им по своему усмотрению, если иное не предусмотрено трудовым договором о дистанционной работе.»<\/p>\n<p><strong>Что не так.<\/strong> Документ адаптации делает вечерние встречи обязанностью, но не указывает, входят ли они в рабочий день, сколько длятся и кто переносит рабочие задачи. Для офисного режима «после рабочего дня» выглядит как время сверх установленного режима; для дистанционного работника режим может быть иным по договору. Если встреча обязательна и связана с трудовой функцией, её нельзя оставлять за пределами учёта без решения о режиме и компенсации. Время взаимодействия дистанционного работника с работодателем включается в рабочее время, но конкретный вывод о встрече проверяют юристы по условиям договора.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 91: «Рабочее время - время, в течение которого работник ... должен исполнять трудовые обязанности» и «Работодатель обязан вести учет времени, фактически отработанного каждым работником.» ТК ст. 100: режим устанавливает «время начала и окончания работы, время перерывов в работе». ТК ст. 312.4, ред. 25.05.2026: «Время взаимодействия дистанционного работника с работодателем включается в рабочее время.»<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 13, п. 3.3.4 заменить только предложение о вечернем времени встречи и комментарии таблицы. Остальные положения о знакомстве, частоте и приглашении коллег сохранить; частоту отдельно согласовать по <a href=\"#/k/PRIEM-10\">К-PRIEM-10<\/a>, рабочее время — по <a href=\"#/k/PRIEM-06\">К-PRIEM-06<\/a>:<\/p>\n<blockquote>\n<p>Встречи проводятся в пределах установленного рабочего времени всех участников с учетом режима каждого из них, в том числе дистанционных Работников. Если встреча не может пройти в это время, руководитель до её начала обеспечивает законное оформление работы за пределами установленной продолжительности рабочего времени по Политике 02 и Положению 10. Изменение договорного режима допускается только с соблюдением установленного ТК РФ порядка, а не односторонним переносом графика. Фактическое участие учитывается как рабочее время.<\/p>\n<\/blockquote>\n<p>В таблице раздела 4 заменить комментарии обеих строк на: «Проводятся в установленное рабочее время. При изменении графика или работе после него применяются Политика 02 и Положение 10». Добавить продолжительность встречи и владельца записи. В 12 и 03 не дублировать частоту; 03 дополнить ЛНА или договором, если компания хочет фиксировать обязательные окна взаимодействия.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель назначает встречу внутри рабочего времени. 2. Наставник фиксирует факт и длительность в карточке адаптации. 3. Если нужен вечер, руководитель до начала согласует изменение режима/сверхурочную работу. 4. КДП проверяет табель и не допускает двойного учёта.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сколько минут длится встреча? Встречи проходят для офисных, дистанционных или обеих категорий? Как сейчас учитывается вечернее время?<\/p>\n<p><strong>Цена вопроса.<\/strong> Условный расчёт для четырёх полных пятидневных недель без праздников и отсутствий: 15 встреч, из них 10 в первые две недели и 5 в следующие две (расчёт программой). Это не доказанное число встреч за любой календарный месяц и не фактические часы; длительность не указана.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по тексту о вечернем времени и отсутствию в нём специального правила учёта; фактический учёт не установлен, вывод о сверхурочной работе зависит от режима конкретного работника.<\/p>"}, {"id": "К-VREM-11", "slug": "VREM-11", "title": "При увольнении не предусмотрена доплата за неиспользованный день отдыха", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 5.2–5.4; 10, пп. 4.9, 10.13"], ["Тип", "устарело; пробел"], ["Кто решает", "HR и главный бухгалтер; юристы проверяют старые остатки"], ["Важность", "высокая: обязательная сумма может не попасть в окончательный расчёт"]], "html": "<p><strong>Было.<\/strong> 02, п. 5.2: «работа в выходной или нерабочий праздничный день оплачивается в одинарном размере, а день отдыха оплате не подлежит». 10, п. 10.13: «окончательный расчет по причитающейся Работнику заработной плате производится в последний день работы». Отдельного основания передачи неиспользованных дней за выходные из КДП в бухгалтерию нет.<\/p>\n<p><strong>Что не так.<\/strong> Оплата дня отдыха и доплата за ранее отработанный выходной при увольнении — разные вещи. Первая не производится, вторая прямо предусмотрена законом. Без реестра связки дата работы → фактическая оплата → неиспользованный день бухгалтерия не получает основание расчёта. Это отдельная проблема от согласования даты отдыха в <a href=\"#/k/VREM-06\">К-VREM-06<\/a>.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 153 ч. 6, ред. 25.05.2026, часть введена ФЗ от 30.09.2024 № 339‑ФЗ: «в день увольнения работнику выплачивается разница между оплатой работы в выходной или нерабочий праздничный день, полагавшейся ему в соответствии с частями первой - третьей настоящей статьи, и фактически произведенной оплатой работы в этот день». Далее: «за все дни отдыха ... не использованные им в период трудовой деятельности у данного работодателя».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 02 новым п. 5.5:<\/p>\n<blockquote>\n<p>5.5. При прекращении трудового договора КДП до передачи окончательного расчёта в бухгалтерию сверяет все неиспользованные дни отдыха за работу в выходные и нерабочие праздничные дни. Бухгалтерия в день увольнения выплачивает за все такие дни разницу между оплатой, полагавшейся по частям первой–третьей статьи 153 ТК РФ, и фактически произведенной оплатой работы в соответствующий день. КДП передает даты и часы работы, выбранный способ компенсации и сведения об использовании дней отдыха; бухгалтерия проверяет фактические начисления. Работник получает расчет с указанием основания доплаты.<\/p>\n<\/blockquote>\n<p>В 10, п. 10.13 добавить отсылку к п. 5.5 Политики 02. Не смешивать этот остаток с компенсацией ежегодного отпуска: её разбирает группа OTP. Истечение года не обозначать автоматическим списанием денежного требования: вопрос старых остатков передать юристам.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Событие увольнения запускает сверку КДП. 2. КДП передает реестр бухгалтерии; до подключения систем — проверенная выгрузка вручную. 3. Бухгалтерия сверяет начисления и считает разницу. 4. Выплата и основание закрывают запись; Decision Flow хранит журнал, а не заменяет расчёт зарплаты.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельный остаток дней за выходные и проводились ли такие доплаты при увольнениях?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет реестра дней и фактических начислений.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в обязанности по закону; применение к спорным старым остаткам — юристам.<\/p>"}, {"id": "К-VREM-12", "slug": "VREM-12", "title": "Табель фиксирует факт, но нет проверки будущих согласованных часов", "imp": "высокая", "docs": ["02", "10", "12"], "meta": [["Документы", "02, пп. 2.1–2.3, 3.4–3.7; 10, пп. 4.7, 10.3; 12, п. 4.8; ответы HR 10.11, перечень задач КДП"], ["Тип", "пробел; лишняя ручная работа"], ["Кто решает", "HR и руководитель КДП"], ["Важность", "высокая: параллельные заявки могут пройти по одному свободному остатку"]], "html": "<p><strong>Было.<\/strong> 02, п. 2.3: «Учет времени, отработанного сверх положенного, отражается в табеле учета рабочего времени.» 10, п. 10.3: «Табели учета рабочего времени заполняют и подписывают Руководитель группы кадрового делопроизводства и Главный бухгалтер.» ответы HR 10.11, строка о табеле: «согласование - 2 раза в месяц в 1С с рассылкой руководителям, выгрузка и отправка в Диадок на подпись Главбуху и Кадры».<\/p>\n<p><strong>Что не так.<\/strong> Табель — источник факта, а не плановых разрешений. Если несколько руководителей подают заявки одному работнику, каждая может опираться на один и тот же остаток, пока предыдущая не отработана и не внесена в табель. В ЛНА не назначен ответственный за сбор подтвержденного факта от руководителя и сопоставление с приказом. Это риск процесса; случаи реального превышения не доказаны.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 99 ч. 10 и ст. 91 ч. 4, ред. 25.05.2026: «Работодатель обязан обеспечить точный учет продолжительности сверхурочной работы каждого работника» и «Работодатель обязан вести учет времени, фактически отработанного каждым работником.»<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить 02, п. 2.3:<\/p>\n<blockquote>\n<p>2.3.1. До согласования заявки КДП проверяет фактически отработанные часы по табелю и ранее согласованные, но еще не отраженные в табеле часы. Плановые часы учитываются в журнале заявок отдельно от фактических; повторный учёт одних часов не допускается. После выполнения работ непосредственный руководитель подтверждает фактические дату, начало, окончание и перерывы до закрытия соответствующего табельного периода. При отмене или изменении работ КДП корректирует плановые записи, не заменяя ими фактический табель. Несовпадение с приказом передается руководителю КДП для выяснения и оформления фактически выполненной работы.<\/p>\n<\/blockquote>\n<p>В 10, п. 10.3 добавить предложение: «Непосредственные руководители подтверждают сведения о фактически отработанном времени и отклонениях до подписания табеля». Срок внутри периода устанавливает HR вместе с бухгалтерией; из нынешнего ответа про два согласования нельзя вывести конкретные даты закрытия.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП проверяет факт плюс незакрытые разрешения. 2. После согласования заявка резервирует плановые часы. 3. Руководитель подтверждает факт, КДП сверяет и переносит его в 1С. 4. Бухгалтерия и КДП подписывают табель; Decision Flow сохраняет связь с приказом. Интеграции 1С/Диадока не подтверждены — до испытания импорт и сверка выполняются человеком.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто и в какие даты закрывает периоды, как передают факт и где хранится список ещё не выполненных приказов?<\/p>\n<p><strong>Цена вопроса.<\/strong> ответы HR 10.11 оценивает табель в 5 процентов времени руководителя КДП; это оценка HR, не замер экономии. Часы экономии не считали.<\/p>\n<p><strong>Уверенность.<\/strong> высокая по отсутствию описанного предконтроля; фактический способ проверки нужно подтвердить.<\/p>"}, {"id": "К-VREM-13", "slug": "VREM-13", "title": "Форма согласия просит двойную оплату, а Положение устанавливает 150/200 процентов", "imp": "средняя", "docs": ["02", "10"], "meta": [["Документы", "02, приложения 2А, 2Б, 3; 10, пп. 4.2, 4.9"], ["Тип", "противоречие между документами; ошибка в тексте"], ["Кто решает", "HR и руководитель компании; юристы до изменения обещанных условий"], ["Важность", "средняя: подписанная форма и расчет могут обещать разные суммы"]], "html": "<p><strong>Было.<\/strong> 02, прил. 2А: «Оплату работы прошу произвести в двойном размере.» Форма применяется и к сверхурочной работе. 10, п. 4.2: «за первые два часа сверхурочной работы — в размере 150 процентов». 02, прил. 2Б: «с предоставлением дополнительного дня/времени отдыха (отгула) в соответствии со ст. 152 Трудового кодекса РФ», хотя в перечне работ названа и работа в выходной. Прил. 3 дает только дни «за сверхурочную работу».<\/p>\n<p><strong>Что не так.<\/strong> Двойная оплата первых часов не нарушает минимальную гарантию закона, но форма расходится с денежным правилом. Нельзя объявить работнику, что его просьба о двойной оплате автоматически была согласована, равно как нельзя без проверки убрать возможную повышенную гарантию. В формах отдыха смешаны часы по ст. 152 и день по ст. 153; это не просто запятая, а выбор разных компенсаций.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 152 ч. 1, ред. 144‑ФЗ от 25.05.2026: «Конкретные размеры оплаты сверхурочной работы могут определяться ... локальным нормативным актом или трудовым договором». ТК ст. 153 ч. 4: «По желанию работника ... может быть предоставлен другой день отдыха». Минимум и годовой порог приведены в <a href=\"#/k/VREM-03\">К-VREM-03<\/a>.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Сначала юристы и HR проверяют, не закреплена ли двойная оплата как более высокая гарантия. Рекомендация на переход — не снижать подтверждённые повышенные условия. Для новых форм после выбора компании заменить денежную строку прил. 2А:<\/p>\n<blockquote>\n<p>Прошу оплатить работу в размере, установленном пунктом 4.2 Положения об оплате труда для сверхурочной работы либо пунктом 4.3 для работы в выходной или нерабочий праздничный день, но не ниже требований ТК РФ. Установленный для меня более высокий размер оплаты сохраняется.<\/p>\n<\/blockquote>\n<p>Вариант, если компания выбирает двойную оплату всех сверхурочных: изменить 10, п. 4.2 на 200 процентов за каждый час, сохранив остальные гарантии, а форму оставить согласованной с этим правилом. Этот вариант требует решения руководителя компании и расчёта стоимости, не принят здесь.<\/p>\n<p>Заменить строку прил. 2Б:<\/p>\n<blockquote>\n<p>Прошу предоставить дополнительное время отдыха за сверхурочную работу по статье 152 ТК РФ либо другой день отдыха за работу в выходной или нерабочий праздничный день по статье 153 ТК РФ; нужный вариант отмечен. Дата использования отдыха определяется отдельным заявлением.<\/p>\n<\/blockquote>\n<p>В прил. 3 заменить основную строку:<\/p>\n<blockquote>\n<p>Прошу предоставить: дополнительное время отдыха продолжительностью ___ за сверхурочную работу либо день отдыха ___ за работу в выходной или нерабочий праздничный день <strong><em>. Основание: дата работы и приказ <\/em><\/strong>. Нужный вид компенсации отмечен.<\/p>\n<\/blockquote>\n<p><strong>Как будет работать.<\/strong> 1. HR с юристами сверяет договоры, приказы и выплаты. 2. Руководитель компании выбирает согласованный денежный вариант. 3. В форме разные ветви для сверхурочных часов и выходного дня. 4. КДП передает бухгалтерии выбранный вариант вместе с приказом; старые подтверждённые условия не переписывает задним числом.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли оплаченные по двойному тарифу первые часы по форме 2А и есть ли повышенные условия в договорах?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет начислений и распределения сверхурочных по дням.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в расхождении формы и Положения; наличие дополнительной гарантии — юридическая проверка.<\/p>"}, {"id": "К-VREM-14", "slug": "VREM-14", "title": "Часовая ставка для всех привязана к восьмичасовой пятидневке", "imp": "средняя", "docs": ["02", "10", "12"], "meta": [["Документы", "10, п. 4.8; 12, п. 4.3; 02, п. 1.4"], ["Тип", "пробел; несогласованность расчетной формулы с особыми режимами"], ["Кто решает", "главный бухгалтер и HR; юристы проверяют методику"], ["Важность", "средняя: неверная база возможна при неполном времени и ином графике"]], "html": "<p><strong>Было.<\/strong> 10, п. 4.8: «Расчет размера часовой ставки производится путем деления суммы начисленной в расчетном периоде заработной платы на количество рабочих дней в этом периоде по календарю пятидневной рабочей недели и на 8 часов (величину продолжительности рабочего дня).» 12, п. 4.3 допускает иной режим и суммированный учёт.<\/p>\n<p><strong>Что не так.<\/strong> Общая формула не объясняет состав начисленной зарплаты, период и базу часов при иной норме. В том числе нельзя без проверки включать саму рассчитываемую доплату в числитель: получится круговой расчет. Сменный график сам по себе не доказывает, что деление на календарную норму неправильно; поэтому здесь не утверждается ни нарушение закона, ни готовая универсальная замена формулы.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 152 ч. 1, ред. 144‑ФЗ от 25.05.2026: расчет «исходя из размера заработной платы ... в период выполнения сверхурочной работы, включая компенсационные и стимулирующие выплаты». ТК ст. 93 ч. 3 (ред. 25.05.2026): «оплата труда работника производится пропорционально отработанному им времени или в зависимости от выполненного им объема работ». Нормы в базе о единственно обязательной формуле часовой ставки нет, проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> До окончательной методики не отменять существующую формулу без проверки начислений. Дополнить 10, п. 4.8:<\/p>\n<blockquote>\n<p>4.8.1. При расчете часовой ставки для доплат бухгалтерия использует утвержденную методику, учитывающую систему оплаты труда и установленную для Работника норму рабочего времени. Методика определяет расчетный период, состав выплат и источник нормы часов, правила для неполного времени и суммированного учета; рассчитываемая доплата не включается в свою собственную расчетную базу. Методика утверждается как приложение к настоящему Положению после проверки юридической службой. Расчет не может уменьшать гарантии ТК РФ и установленные для Работника более высокие выплаты.<\/p>\n<\/blockquote>\n<p>Это готовый предохранительный пункт, а не готовая методика: числитель и знаменатель без данных о системе оплаты не подставлены. Группе PLAT передать состав базы и необходимость согласованного приложения. В 02 оставить ссылку на 10, не копировать формулу в процесс.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Бухгалтерия показывает обезличенные контрольные расчёты для обычного, неполного и суммированного режима. 2. Юристы сверяют гарантии. 3. Утверждается приложение и контрольные примеры. 4. В 1С проверяют результат; Decision Flow запрашивает подтверждение, но сам не выдумывает ставку.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какая база и норма реально заложены в 1С? Есть ли отдельная утверждённая методика?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет начислений и контрольных примеров.<\/p>\n<p><strong>Уверенность.<\/strong> средняя: риск обоснован текстом, окончательная денежная методика требует данных и юридической сверки.<\/p>"}, {"id": "К-VREM-15", "slug": "VREM-15", "title": "Праздничный день по графику освобождён от процедуры без указания границ исключения", "imp": "высокая", "docs": ["02", "10", "12"], "meta": [["Документы", "02, пп. 2.8, 3.9; 10, пп. 4.3, 4.6; 12, п. 4.3"], ["Тип", "пробел; неоднозначное исключение"], ["Кто решает", "HR и юристы"], ["Важность", "высокая: обычную субботу по графику можно спутать с государственным праздником"]], "html": "<p><strong>Было.<\/strong> 02, п. 2.8: «Если работник работает по скользящему графику, в соответствии с которым рабочий день выпадает на субботу или воскресенье, такой день считается рабочим и заработная плата начисляется в одинарном размере.» П. 3.9 исключает порядок привлечения в выходные и праздники, «если указанные дни являются для Работника рабочими в соответствии с утвержденным Графиком работы».<\/p>\n<p><strong>Что не так.<\/strong> Нормальная рабочая суббота при скользящем графике и нерабочий праздничный день — разные основания. П. 3.9 касается оформления, но можно ошибочно распространить его на оплату или на любой заранее запланированный праздник. Включение даты в график само по себе не отвечает на вопрос, разрешён ли такой вид работы в праздник. Факт неверной оплаты не установлен.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 113 ч. 6, ред. 25.05.2026: «В нерабочие праздничные дни допускается производство работ, приостановка которых невозможна по производственно-техническим условиям ... работ, вызываемых необходимостью обслуживания населения, а также неотложных ремонтных и погрузочно-разгрузочных работ». Ч. 8: «Привлечение работников ... производится по письменному распоряжению работодателя». ТК ст. 153 ч. 3: повышенная оплата за «часы, фактически отработанные в выходной или нерабочий праздничный день».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Заменить 02, п. 3.9:<\/p>\n<blockquote>\n<p>3.9. Работа в субботу или воскресенье, являющиеся обычными рабочими днями по установленному Работнику графику и не совпадающие с нерабочим праздничным днем, не считается работой в его выходной день. Привлечение в день отдыха по индивидуальному графику оформляется по разделу 3 настоящей Политики. Работа в нерабочий праздничный день независимо от включения в график допускается при наличии законного основания и оплачивается по пункту 4.3 Положения об оплате труда либо компенсируется другим днем отдыха по желанию Работника. Юридическая и кадровая службы определяют применимое основание и необходимое оформление до утверждения графика; один график не отменяет установленных законом гарантий.<\/p>\n<\/blockquote>\n<p>В 02, п. 2.8 добавить последнее предложение: «Правило об одинарной оплате обычной субботы или воскресенья не отменяет правила оплаты нерабочего праздничного дня». Ночную доплату сохранить отдельно: совпадение оснований её не поглощает.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП определяет для каждой даты вид дня по календарю и индивидуальному графику. 2. Руководитель обосновывает работу в праздник; юристы проверяют основание. 3. КДП оформляет необходимые документы. 4. В табеле выделяют праздничные и ночные интервалы для бухгалтерии.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие подразделения работают в праздники по графику и на каком основании? Есть ли утвержденные графики и приказы?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет праздничных часов и начислений.<\/p>\n<p><strong>Уверенность.<\/strong> высокая в различии обычного выходного и праздника; конкретный состав документов при работе по графику — юристам.<\/p>"}, {"id": "К-VREM-16", "slug": "VREM-16", "title": "Защищённые категории названы для сверхурочных, но не для ночи и выходных", "imp": "высокая", "docs": ["02", "10"], "meta": [["Документы", "02, пп. 2.5–2.7, приложения 2А–2Б; 10, п. 4.6"], ["Тип", "пробел"], ["Кто решает", "HR, КДП и юристы; медицинские сведения доступны только уполномоченным"], ["Важность", "высокая: одно универсальное согласие не проверяет разные ограничения"]], "html": "<p><strong>Было.<\/strong> 02, п. 2.5: «Привлечение к сверхурочной работе ... допускается только с их письменного согласия и при условии, если это не запрещено им по состоянию здоровья в соответствии с медицинским заключением». П. 2.7 отдельно добавляет «Работников в период действия ученического договора». В приложениях 2А и 2Б стоит заявление работника: «Медицинских противопоказаний к труду не имею.» Для ночной работы отдельной проверки нет; 10, п. 4.6 устанавливает доплату 20 процентов.<\/p>\n<p><strong>Что не так.<\/strong> Согласие, право отказаться и медицинское заключение не взаимозаменяемы. Пп. 2.5 и 2.7 частично повторяются, но второй содержит дополнительную категорию — удалять его целиком нельзя. Не требуется копировать весь ТК в ЛНА, однако процессу нужен владелец проверки для каждого вида работ, иначе ночное согласие ошибочно заменяется согласием на сверхурочные. Реальные нарушения допуска не установлены.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 96 ч. 5, ред. 25.05.2026: предусмотренные категории «могут привлекаться к работе в ночное время только с их письменного согласия ... в соответствии с медицинским заключением» и «должны быть в письменной форме ознакомлены со своим правом отказаться от работы в ночное время». ТК ст. 113 ч. 7 для инвалидов и женщин с детьми до трех лет: «должны быть под роспись ознакомлены со своим правом отказаться от работы в выходной или нерабочий праздничный день». ТК ст. 259 ч. 1–3, ред. 25.05.2026, в базе есть: «Запрещаются ... привлечение к сверхурочной работе, работе в ночное время, выходные и нерабочие праздничные дни беременных женщин»; ч. 3 распространяет гарантии, в частности, на «работникам, имеющим детей-инвалидов, работникам, осуществляющим уход за больными членами их семей». Полного текста ст. 203 в базе не найдено; перечень по ученическим договорам окончательно проверяют юристы. Минимальный процент ночной доплаты по действующему постановлению Правительства в базе не найден; не выдавать 20 процентов за независимо проверенный минимум.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Не сокращать существующие гарантии; дополнить 02 после п. 2.7:<\/p>\n<blockquote>\n<p>2.7.1. До привлечения к сверхурочной работе, работе в выходной, нерабочий праздничный день или ночное время КДП отдельно по каждому виду работ проверяет установленные ТК РФ запреты, необходимость письменного согласия, ознакомления с правом отказа и медицинского заключения. Общее заявление Работника об отсутствии противопоказаний не заменяет медицинское заключение, когда оно требуется законом. Перечень оснований проверки и актуальную редакцию норм ведёт кадровая служба после проверки юридической службой. При отсутствии обязательного документа привлечение не допускае
