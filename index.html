 специалист по закупкам; финансы; HR; бухгалтерия; КДП<\/td>\n<td style=\"text-align: left;\">Почта; OneTwoTrip; Яндекс Go; Диадок; бумага<\/td>\n<td style=\"text-align: left;\">Один случай такси в командировке попадает в обе системы без правила выбора; приказы о суточных и полномочиях не представлены; передача функций по ответам 10.11 не закрыта. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 06, 13; собственно тарифы/маршруты — KOM<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Увольнение и закрытие доступов<\/td>\n<td style=\"text-align: left;\">12, 2.16.5–2.16.7, 3.2.24; 07, 3.4, 3.8, прил. 2; 15, 2.3; 04, 6.2.15; 09, 9.1<\/td>\n<td style=\"text-align: left;\">КДП; руководитель; ИТ; администратор такси; генеральный директор; бухгалтерия<\/td>\n<td style=\"text-align: left;\">Обходной лист; акт передачи; Диадок/бумага; личные папки; кабинет такси<\/td>\n<td style=\"text-align: left;\">Нет в комплекте самой формы обходного листа и маршрута закрытия всех доступов. Отсутствие подписи по обходному не делает допустимой задержку расчёта/документов. Подробно — PRIEM; <a href=\"#/k/SKVOZ-06\">К-SKVOZ-06<\/a>, 07, 13<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Изменение данных работника и воинский учёт<\/td>\n<td style=\"text-align: left;\">12, 3.2.13; 09, 4.2; формы КДП; 12, 2.2<\/td>\n<td style=\"text-align: left;\">Работник; специалист/руководитель КДП; ответственный за ВУ<\/td>\n<td style=\"text-align: left;\">Текст: сообщение в кадровое подразделение; практика: 1С, бумажная почта, ручной журнал<\/td>\n<td style=\"text-align: left;\">Срок сообщения работником разный; изменение может запустить внешнюю обязанность. Формы содержат деятельность по другой компании группы. <a href=\"#/k/SKVOZ-08\">К-SKVOZ-08<\/a>, 12; нормы и автоматизация ВУ — VU<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Охрана труда, медосмотры и СОС<\/td>\n<td style=\"text-align: left;\">08, 7.3.4–7.3.9, 8.3–8.5; 11, 2.4, 7.1; 03, 1.3–1.4, разд. 3; 12, 2.13.3, 3.2.5, 10.3<\/td>\n<td style=\"text-align: left;\">Генеральный директор; специалист ОТ; назначенное ответственное лицо; начальник КДП; руководитель; работник<\/td>\n<td style=\"text-align: left;\">Приказы, инструктажи, листы/карточки, почта/ЭДО в пределах закона; аутсорсер ОТ по ответам 10.11, 1.1<\/td>\n<td style=\"text-align: left;\">Аутсорсер не означает снятие функций работодателя; ответственных по приказам не видно. Исключённые из общего кадрового ЭДО документы нельзя автоматически уравнять с обычными ЛНА. <a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a>, 05, 06; содержание — OT<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Несчастный случай/профзаболевание<\/td>\n<td style=\"text-align: left;\">03, разд. 8–9; 06, разд. 6–13; 08, 8.11.7<\/td>\n<td style=\"text-align: left;\">Работодатель; пострадавший; комиссия; специалист ОТ; назначенное лицо; КДП; страховщик; представители работников<\/td>\n<td style=\"text-align: left;\">Извещения, акты, журнал, подписи<\/td>\n<td style=\"text-align: left;\">Повтор расследования НС в 03 и 06; 08 ссылается отдельно на СУОТ.П09, которого нет отдельным файлом, хотя похожий текст включён в 03. <a href=\"#/k/SKVOZ-10\">К-SKVOZ-10<\/a>, 14<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Обращение об этике/конфликте интересов<\/td>\n<td style=\"text-align: left;\">01, 7.6, 9.1–9.3; 12, 13.2–13.4; 04, 7.1 — иная роль ответственного за тайну<\/td>\n<td style=\"text-align: left;\">HR; ответственный за комплаенс; уполномоченное лицо; генеральный директор; юристы<\/td>\n<td style=\"text-align: left;\">Канал и очередь обращений в этих пунктах не названы<\/td>\n<td style=\"text-align: left;\">Нельзя считать ответственного за тайну автоматически ответственным за комплаенс. Нужно назначение и конфиденциальный маршрут, не общий чат. <a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>; получатель сообщений по ПВТР — <a href=\"#/k/DISC-19\">К-DISC-19<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Системы: что подтверждено, а что лишь названо<\/h3>\n<ul>\n<li><strong>Mattermost<\/strong> подтверждён ответами HR 10.11 (1.1, 2.1, 3.5). В текстах 01–16 название Mattermost не найдено. Slack указан в 12, пп. 3.2.29–3.2.30, 5.9, 5.14, и 16, п. 2.6. Это подтверждённое расхождение текста и описанной практики, но не доказательство полного отключения Slack.<\/li>\n<li><strong>1С Кабинет сотрудника<\/strong> и отпускной маршрут подтверждены встречей 11.11. В 12, п. 6.7, 1С упоминается как место расчётного листка, а не как полный отпускной процесс. Диадок в документах есть; утверждение, что ЛНА его совсем не знают, неверно.<\/li>\n<li><strong>Jira<\/strong> подтверждена документами и практикой. <strong>YouTrack<\/strong>, <strong>Zoom<\/strong>, <strong>OneTwoTrip<\/strong>, <strong>Яндекс Go<\/strong> названы в ЛНА; отсутствие/прекращение использования из этого комплекта не следует. Контур.Толк назван в ответах HR 10.11 для собеседований, это не доказательство отмены Zoom для всех совещаний.<\/li>\n<li><strong>Decision Flow<\/strong> — проект будущего маршрута, не уже действующая кадровая система. Нет подтверждённых коннекторов к 1С, Диадоку или кадровым папкам. Ни один кейс не обещает автоматическую подпись или готовую интеграцию. До проверки чтение/загрузка выполняются человеком.<\/li>\n<\/ul>"}, "kak-zagruzit": {"eyebrow": "Пакет для ИИ-клиента", "h1": "Как загрузить пакет", "html": "<p>Для руководителя HR. ИИ-клиент компании — Open WebUI; база знаний в нём называется Knowledge.\nПакет: кадровые кейсы по 16 положениям, нормы закона дословно, системный промпт и контрольные вопросы.\nКейсы — предложения, а не утверждённые правила.<\/p>\n<h2>Что в архиве<\/h2>\n<ul>\n<li><code>zakony/<\/code> — нормы закона дословно, один закон в файле;<\/li>\n<li><code>keysy-polozheniy/<\/code> — кейсы «было — стало (предлагается)», одна тема в файле;<\/li>\n<li><code>materialy/<\/code> — реестр документов компании (названия, без самих документов) и границы базы;<\/li>\n<li><code>00-karta.md<\/code> — карта: что в каком файле и на какие вопросы он отвечает;<\/li>\n<li><code>sistemnyy-prompt.md<\/code>, <code>kontrolnye-voprosy.md<\/code> и этот файл — для настройки, в Knowledge их не загружай.<\/li>\n<\/ul>\n<h2>Как пользоваться<\/h2>\n<ol>\n<li>Распакуй архив.<\/li>\n<li>\n<p>Создай три коллекции: <strong>Workspace → Knowledge → Create<\/strong>. Названия, например: «HR: законы», «HR: кейсы»,\n   «HR: материалы». В каждую загрузи файлы своей папки, а <code>00-karta.md<\/code> — в «HR: материалы». Дождись, пока\n   обработка закончится.<\/p>\n<\/li>\n<li>\n<p>Подключи коллекции. Чтобы они были в каждом чате — к модели: <strong>Workspace → Models<\/strong>, поле <strong>Knowledge<\/strong>.\n   Для одного чата — набери <code>#<\/code> в поле сообщения и выбери коллекцию.<\/p>\n<\/li>\n<li>\n<p>Вставь текст из <code>sistemnyy-prompt.md<\/code> в поле <strong>System Prompt<\/strong> модели (там же, <strong>Workspace → Models<\/strong>)\n   и сохрани.<\/p>\n<\/li>\n<li>\n<p>Открой новый чат и задай вопросы из <code>kontrolnye-voprosy.md<\/code> по одному, не вставляя ожидаемый ответ.\n   Сверь ответ с ожидаемым и с названным файлом. На два последних вопроса правильный ответ — «в базе этого нет».\n   Если помощник называет не тот файл или додумывает, покажи это Илье: обычно помогает настройка поиска ниже.<\/p>\n<\/li>\n<\/ol>\n<h2>Что попросить у Ильи<\/h2>\n<p>Илья — администратор Open WebUI компании. Попроси его:<\/p>\n<ol>\n<li>\n<p>Вместо английской модели поиска по умолчанию поставить многоязычную, например <strong>BAAI/bge-m3<\/strong>\n   (<strong>Admin Settings → Documents → Embedding Model<\/strong>), и затем переиндексировать базы.<\/p>\n<\/li>\n<li>\n<p>Включить гибридный поиск (по словам и по смыслу) и переранжирование, например моделью\n   <strong>BAAI/bge-reranker-v2-m3<\/strong>.<\/p>\n<\/li>\n<li>\n<p>Поставить <strong>Top K<\/strong> 8–10.<\/p>\n<\/li>\n<li>Для модели включить нативный вызов функций (<strong>Function Calling: Native<\/strong>) и встроенный инструмент Knowledge.<\/li>\n<li>\n<p>Если Open WebUI версии 0.9.6 или новее, задать <strong>ENABLE_KB_EXEC=true<\/strong>: тогда модель сама листает файлы базы\n   и ищет по ним (ls, cat, grep).<\/p>\n<\/li>\n<li>\n<p>Когда улей переедет в GitLab компании, синхронизировать GitLab с Knowledge официальной программой <strong>oikb<\/strong>\n   (docs.openwebui.com/ecosystem/knowledge-base-sync).<\/p>\n<\/li>\n<\/ol>\n<h2>Три вопроса, чтобы попробовать<\/h2>\n<ul>\n<li>Что не так с запретом испытания в положении об испытании и что предлагается? (кейс К-PRIEM-01)<\/li>\n<li>Как по закону оплачивать сверхурочные начиная со 121-го часа в году? (кейс К-VREM-03)<\/li>\n<li>Как затребовать объяснение до дисциплинарного взыскания и когда составлять акт, если объяснения нет?<\/li>\n<\/ul>\n<h2>Как обновлять<\/h2>\n<p>Пакет собирает программа из улья, поэтому после любой правки кейсов или законов его можно пересобрать и загрузить\nзаново. В пакет не входят документы компании, персональные данные и черновики политик.<\/p>\n<p>Документация Open WebUI, просмотр 17–18.11.2026:\ndocs.openwebui.com/features/workspace/knowledge, docs.openwebui.com/features/workspace/models,\ndocs.openwebui.com/reference/env-configuration, docs.openwebui.com/ecosystem/knowledge-base-sync.<\/p>"}}};
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
  const KEY = "uley-hr-keysy-kommentarii-v1";
  const G = {}; const K = {}; const ORDER = [];
  DATA.gruppy.forEach(g => { G[g.kod] = g; g.keysy.forEach(k => { k.g = g; K[k.slug] = k; ORDER.push(k.slug); }); });
  const N = ORDER.length;
  const nImp = (arr, v) => arr.filter(k => k.imp === v).length;
  const impChip = v => `<span class="chip imp-${esc(v)}">важность: ${esc(v)}</span>`;
  const docChips = k => k.docs.map(d => `<a class="chip" href="#/vse?doc=${d}" title="${esc(DATA.dok[d] || "")}">док. ${d}</a>`).join("");

  // ---------- comments storage
  let CM = [];
  try { CM = JSON.parse(localStorage.getItem(KEY) || "[]") || []; } catch (e) { CM = []; }
  const saveCM = () => { try { localStorage.setItem(KEY, JSON.stringify(CM)); } catch (e) { alert("Браузер не дал сохранить комментарий: скопируй текст вручную."); } badge(); };
  function badge() { const b = $("#cm-n"); if (b) b.textContent = CM.length ? CM.length : ""; }

  // ---------- rail
  function rail() {
    let h = `<div class="brand">Разбор положений HR</div><div class="ver">было — стало · ${esc(DATA.data)}</div>`;
    h += `<h4>Начало</h4><a href="#/" data-r="home">С чего начать</a>`;
    h += `<a href="#/skachat" data-r="skachat">Готово для тебя: скачать<span class="n">${DATA.skachat.length}</span></a>`;
    h += `<a href="#/vse" data-r="vse">Все кейсы<span class="n">${N}</span></a>`;
    h += `<a href="#/voprosy" data-r="voprosy">Вопросы к HR и КДП<span class="n">${DATA.n_voprosov}</span></a>`;
    h += `<h4>Темы</h4>`;
    DATA.gruppy.forEach(g => { h += `<a href="#/t/${g.kod}" data-r="t/${g.kod}">${esc(g.nazv)}<span class="n">${g.keysy.length}</span></a>`; });
    h += `<h4>Справка</h4><a href="#/p/dokumenty" data-r="p/dokumenty">Документы: реестр<span class="n">16</span></a>`;
    h += `<a href="#/p/karta" data-r="p/karta">Карта связей</a>`;
    h += `<h4>Твои заметки</h4><a href="#/comments" data-r="comments">Мои комментарии <span class="badge" id="cm-n"></span></a>`;
    $("#rail").innerHTML = h; badge();
  }
  function markRail(r) { $$("#rail a").forEach(a => a.classList.toggle("on", a.dataset.r === r)); }
  function show(html, r) { $("#view").innerHTML = html; markRail(r); afterRender(); window.scrollTo(0, 0); }

  // ---------- views
  function viewHome() {
    let h = `<div class="eyebrow">Для руководителя HR · ${esc(DATA.data)}</div><h1>${esc(DATA.zagolovok)}</h1>`;
    h += `<div class="lead doc-body" data-doc="home" data-title="Главная">${DATA.vvedenie}</div>`;
    h += `<h2 id="skachat">Готово для тебя: скачать</h2>` + skachatHtml();
    h += `<div class="lead">${DATA.vvedenie2}</div>`;
    h += `<h2>С чего начать</h2><ol class="start">` + DATA.nachalo.map(x => { const k = K[x.slug];
      return `<li><a href="#/k/${k.slug}">${esc(k.id)}. ${esc(k.title)}</a><p>${esc(x.tekst)}</p></li>`; }).join("") + `</ol>`;
    h += `<h2>Темы</h2><div class="rows">` + DATA.gruppy.map(g => `<a class="row" href="#/t/${g.kod}"><span class="t">${esc(g.nazv)}</span>
      <span class="sub">${g.keysy.length} кейсов, из них высокой важности ${nImp(g.keysy, "высокая")}</span></a>`).join("") + `</div>`;
    h += `<div class="lead">${DATA.dalshe}</div><h2>Как мы проверяли</h2><div class="lead">${DATA.proverka}</div>`;
    show(h, "home");
  }
  function skachatHtml() {
    let h = `<div class="dl">` + DATA.skachat.map(c => `<div class="card"><div class="t">${esc(c.nazv)}</div><p>${esc(c.zachem)}</p>
      <div class="meta2">${esc(c.data)} · <span class="st${c.gotovo ? " ok" : ""}">${esc(c.status)}</span></div>
      <div class="files">` + c.fajly.map(f => `<a href="files/${esc(f.imya)}" download>↓ ${esc(f.format)} <span>${esc(f.razmer)}</span></a>`).join("") + `</div></div>`).join("");
    h += `<div class="card tizer"><div class="t">${esc(DATA.tizer.zagolovok)}</div><ol>` + DATA.tizer.voprosy.map(q => `<li>${esc(q)}</li>`).join("") +
      `</ol><p>Как загрузить пакет — <a href="#/p/kak-zagruzit">инструкция</a> (она же лежит в архиве).</p></div></div>`;
    return h;
  }
  function viewSkachat() {
    show(`<div class="eyebrow">Для руководителя HR · ${esc(DATA.skachat[0].data)}</div><h1>Готово для тебя: скачать</h1>` + skachatHtml(), "skachat");
  }
  function caseRow(k, withTheme) {
    return `<a class="row" href="#/k/${k.slug}"><span class="id">${esc(k.id)}${withTheme ? " · " + esc(k.g.nazv) : ""}</span>
      <span class="t">${esc(k.title)}</span><span class="chips">${impChip(k.imp)}${k.docs.map(d => `<span class="chip">док. ${d}</span>`).join("")}</span></a>`;
  }
  function viewTheme(kod) {
    const g = G[kod]; if (!g) return viewHome();
    let h = `<div class="eyebrow">Тема · ${g.keysy.length} кейсов, высокой важности ${nImp(g.keysy, "высокая")}</div><h1>${esc(g.nazv)}</h1>`;
    if (g.glavnoe) h += `<h2>Главное</h2><div class="doc-body" data-doc="t/${kod}" data-title="${esc(g.nazv)}: главное">${g.glavnoe}</div>`;
    h += `<h2>Кейсы</h2><div class="rows">` + g.keysy.map(k => caseRow(k, false)).join("") + `</div>`;
    if (g.karta) h += `<details><summary>Карта связей темы: процесс, документы, роли, системы</summary><div class="doc-body" data-doc="t/${kod}/karta" data-title="${esc(g.nazv)}: карта связей">${g.karta}</div></details>`;
    if (g.voprosy) h += `<details><summary>Вопросы к HR и КДП по теме</summary><div class="doc-body" data-doc="v/${kod}" data-title="${esc(g.nazv)}: вопросы">${g.voprosy}</div>
      <p><button class="btn main" type="button" data-answer="${kod}">Ответить на вопросы темы</button></p></details>`;
    if (g.nehvatilo) h += `<details><summary>Для юристов: каких норм не хватило в базе</summary><div class="doc-body" data-doc="t/${kod}/normy" data-title="${esc(g.nazv)}: нормы">${g.nehvatilo}</div></details>`;
    show(h, "t/" + kod);
  }
  const LBL = {"Было": "bylo", "Что не так": "ne", "Закон": "zakon", "Стало (предлагается)": "stalo", "Как будет работать": "kak",
    "Уточнить у HR и КДП": "utochnit", "Цена вопроса": "cena", "Уверенность": "uver"};
  function blocks(root) {
    $$("p > strong:first-child", root).forEach(s => {
      const p = s.parentNode; if (p.firstChild !== s) return;
      const t = s.textContent.replace(/[.:]\s*$/, "").trim(); const c = LBL[t]; if (!c) return;
      const h = document.createElement("div"); h.className = "lbl lbl-" + c; h.textContent = t;
      p.parentNode.insertBefore(h, p); s.remove(); if (!p.textContent.trim()) p.remove();
    });
    // «Было» и «Закон» — подложка до следующей метки
    $$(".lbl-bylo, .lbl-zakon", root).forEach(l => {
      const wrap = document.createElement("div"); wrap.className = "sec-" + l.className.match(/lbl-(\w+)/)[1];
      let n = l.nextSibling; const move = [];
      while (n && !(n.nodeType === 1 && n.classList.contains("lbl"))) { move.push(n); n = n.nextSibling; }
      if (!move.length) return;
      l.parentNode.insertBefore(wrap, l.nextSibling); move.forEach(x => wrap.appendChild(x));
    });
  }
  function viewCase(slug) {
    const k = K[slug]; if (!k) return viewHome();
    const i = ORDER.indexOf(slug), prev = K[ORDER[i - 1]], next = K[ORDER[i + 1]];
    let h = `<div class="eyebrow"><a href="#/t/${k.g.kod}">${esc(k.g.nazv)}</a> · ${esc(k.id)}</div><h1>${esc(k.title)}</h1>`;
    h += `<div class="chips">${impChip(k.imp)}${docChips(k)}</div>`;
    h += `<table class="meta">` + k.meta.map(([a, b]) => `<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("") + `</table>`;
    h += `<div class="doc-body" data-doc="k/${k.slug}" data-title="${esc(k.id + ". " + k.title)}">${k.html}</div>`;
    h += `<p><button class="btn main" type="button" id="cm-case">Комментарий к кейсу</button></p>`;
    h += `<div class="pager">${prev ? `<a href="#/k/${prev.slug}">← ${esc(prev.id)}</a>` : "<span></span>"}<a href="#/t/${k.g.kod}">все кейсы темы</a>${next ? `<a href="#/k/${next.slug}">${esc(next.id)} →</a>` : "<span></span>"}</div>`;
    show(h, "t/" + k.g.kod);
    blocks($(".doc-body"));
    afterRender();
    $("#cm-case").onclick = () => openDlg("k/" + k.slug, k.id + ". " + k.title, "", "");
  }
  function viewAll(qs) {
    const p = new URLSearchParams(qs || ""); const imp = p.get("imp") || "", doc = p.get("doc") || "";
    const list = ORDER.map(s => K[s]).filter(k => (!imp || k.imp === imp) && (!doc || k.docs.includes(doc)));
    const href = (i, d) => "#/vse" + ((i || d) ? "?" + new URLSearchParams(Object.assign({}, i ? {imp: i} : {}, d ? {doc: d} : {})).toString() : "");
    let h = `<div class="eyebrow">Все кейсы</div><h1>Все кейсы: ${list.length} из ${N}</h1>`;
    h += `<div class="filters"><div class="tabs">` + [["", "любая важность"], ["высокая", "высокая"], ["средняя", "средняя"], ["низкая", "низкая"]]
      .map(([v, t]) => `<a href="${href(v, doc)}" class="${v === imp ? "on" : ""}">${t}</a>`).join("") + `</div>`;
    h += `<select id="f-doc" aria-label="Документ"><option value="">все документы</option>` + Object.keys(DATA.dok).map(d =>
      `<option value="${d}" ${d === doc ? "selected" : ""}>${d}. ${esc(DATA.dok[d])}</option>`).join("") + `</select></div>`;
    if (doc) h += `<p class="count">Документ ${doc}: ${esc(DATA.dok[doc] || "")}</p>`;
    h += `<div class="rows">` + (list.length ? list.map(k => caseRow(k, true)).join("") : `<p class="count">Таких кейсов нет.</p>`) + `</div>`;
    show(h, "vse");
    $("#f-doc").onchange = e => { location.hash = href(imp, e.target.value); };
  }
  function viewVoprosy(kod) {
    let h = `<div class="eyebrow">Что нужно от тебя</div><h1>Вопросы к HR и КДП</h1><div class="lead">${DATA.voprosy_vvod}</div>`;
    DATA.gruppy.forEach(g => { if (!g.voprosy) return;
      h += `<h2 id="v-${g.kod}"><a href="#/t/${g.kod}" style="color:inherit;text-decoration:none">${esc(g.nazv)}</a></h2>
        <div class="doc-body" data-doc="v/${g.kod}" data-title="${esc(g.nazv)}: вопросы">${g.voprosy}</div>
        <p><button class="btn main" type="button" data-answer="${g.kod}">Ответить на вопросы темы</button></p>`; });
    show(h, "voprosy");
    if (kod) { const el = document.getElementById("v-" + kod); if (el) el.scrollIntoView(); }
  }
  function viewPage(id) {
    const s = DATA.stranicy[id]; if (!s) return viewHome();
    show(`<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.h1)}</h1><div class="doc-body" data-doc="p/${id}" data-title="${esc(s.h1)}">${s.html}</div>`, "p/" + id);
  }
  function viewComments() {
    let h = `<div class="eyebrow">Твои заметки</div><h1>Мои комментарии</h1>
      <p class="lead">Комментарии хранятся только в этом браузере. Когда закончишь, нажми «Скопировать всё» и пришли текст нам.</p>
      <p><button class="btn main" id="cm-copy" type="button">Скопировать всё</button> <span id="cm-state" class="eyebrow"></span></p><div class="cmlist">`;
    if (!CM.length) h += `<p class="count">Пока пусто. Нажми «Комментарий к кейсу» под кейсом или выдели текст, и появится кнопка «Комментарий».</p>`;
    CM.slice().sort((a, b) => a.ts - b.ts).forEach(c => {
      h += `<div class="item"><div class="eyebrow">${esc(c.title)}</div>${c.quote ? `<blockquote>${esc(c.quote)}</blockquote>` : ""}
        <div>${esc(c.text).replace(/\n/g, "<br>")}</div><div class="acts"><a href="#/${esc(c.doc.startsWith("v/") ? "voprosy/" + c.doc.slice(2) : c.doc === "home" ? "" : c.doc)}">открыть</a>
        <a href="#" data-del="${c.id}">удалить</a></div></div>`;
    });
    show(h + `</div>`, "comments");
    $$("[data-del]").forEach(a => a.onclick = e => { e.preventDefault(); if (confirm("Удалить комментарий?")) { CM = CM.filter(c => c.id !== a.dataset.del); saveCM(); viewComments(); } });
    $("#cm-copy").onclick = () => {
      const t = CM.slice().sort((a, b) => a.ts - b.ts).map(c => `${c.title}\n${c.quote ? "«" + c.quote + "»\n" : ""}Комментарий: ${c.text}\n`).join("\n");
      const done = () => { $("#cm-state").textContent = "скопировано"; };
      if (navigator.clipboard) navigator.clipboard.writeText(t || "(комментариев нет)").then(done, () => prompt("Скопируй текст:", t));
      else prompt("Скопируй текст:", t);
    };
  }

  // ---------- after render: answer buttons, comment highlights
  function afterRender() {
    $$("[data-answer]").forEach(b => b.onclick = () => { const g = G[b.dataset.answer]; openDlg("v/" + g.kod, g.nazv + ": ответы на вопросы", "", ""); });
    $$(".doc-body").forEach(body => CM.filter(c => c.doc === body.dataset.doc && c.quote && !body.querySelector(`[data-c="${c.id}"]`)).forEach(c => highlight(body, c)));
  }
  function textNodes(root) { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const a = []; let n; while ((n = w.nextNode())) a.push(n); return a; }
  function highlight(root, c) {
    const nodes = textNodes(root); let full = ""; const starts = [];
    nodes.forEach(n => { starts.push(full.length); full += n.data; });
    let i = c.before ? full.indexOf(c.before + c.quote) : -1;
    i = i >= 0 ? i + c.before.length : full.indexOf(c.quote);
    if (i < 0) return;
    const end = i + c.quote.length;
    for (let k = nodes.length - 1; k >= 0; k--) {
      const s = starts[k], e = s + nodes[k].data.length;
      if (e <= i || s >= end) continue;
      const a = Math.max(i, s) - s, b = Math.min(end, e) - s;
      if (!nodes[k].data.slice(a, b).trim()) continue;
      const r = document.createRange(); r.setStart(nodes[k], a); r.setEnd(nodes[k], b);
      const span = document.createElement("span"); span.className = "cm"; span.dataset.c = c.id; span.title = c.text;
      try { r.surroundContents(span); } catch (e) {}
    }
  }
  const pop = $("#pop");
  document.addEventListener("click", e => {
    if (window.getSelection().toString()) return;
    const cm = e.target.closest(".cm");
    if (cm) { const c = CM.find(x => x.id === cm.dataset.c);
      if (c) { pop.innerHTML = `<div class="eyebrow">Твой комментарий</div>${esc(c.text).replace(/\n/g, "<br>")}<p><a href="#/comments">все комментарии</a></p>`;
        pop.style.display = "block"; const r = cm.getBoundingClientRect();
        pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + "px";
        pop.style.top = (window.scrollY + r.bottom + 8) + "px"; return; } }
    if (!e.target.closest("#pop")) pop.style.display = "none";
  });

  // ---------- selection -> comment
  const cmbtn = $("#cmbtn"); let pending = null;
  function onSel() {
    const sel = window.getSelection();
    const body = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentNode).closest && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentNode).closest(".doc-body");
    if (!sel || sel.isCollapsed || !body || !body.contains(sel.focusNode)) { cmbtn.style.display = "none"; return; }
    const quote = sel.toString().replace(/\s+/g, " ").trim();
    if (quote.length < 2) { cmbtn.style.display = "none"; return; }
    const range = sel.getRangeAt(0);
    const pre = document.createRange(); pre.selectNodeContents(body); pre.setEnd(range.startContainer, range.startOffset);
    const start = pre.toString().length; const full = textNodes(body).map(n => n.data).join("");
    pending = {doc: body.dataset.doc, title: body.dataset.title, quote: range.toString(), before: full.slice(Math.max(0, start - 40), start)};
    const r = range.getBoundingClientRect();
    cmbtn.style.display = "block";
    cmbtn.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 140)) + "px";
    cmbtn.style.top = (window.scrollY + r.bottom + 10) + "px";
  }
  document.addEventListener("mouseup", () => setTimeout(onSel, 0));
  document.addEventListener("keyup", () => setTimeout(onSel, 0));
  document.addEventListener("selectionchange", () => { clearTimeout(onSel.t); onSel.t = setTimeout(onSel, 350); });
  cmbtn.addEventListener("mousedown", e => e.preventDefault());
  cmbtn.addEventListener("pointerdown", e => e.preventDefault());
  cmbtn.onclick = () => { if (pending) openDlg(pending.doc, pending.title, pending.quote, pending.before); cmbtn.style.display = "none"; };
  let dlgData = null;
  function openDlg(doc, title, quote, before) {
    dlgData = {doc, title, quote, before};
    $("#dlg-doc").textContent = title; $("#dlg-q").textContent = quote || "Комментарий целиком";
    $("#dlg-t").value = ""; $("#dlg").style.display = "block"; $("#dlg-t").focus();
  }
  $("#dlg-x").onclick = () => { $("#dlg").style.display = "none"; };
  $("#dlg-ok").onclick = () => {
    const t = $("#dlg-t").value.trim(); if (!t) { $("#dlg-t").focus(); return; }
    const c = Object.assign({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: t, ts: Date.now()}, dlgData);
    CM.push(c); saveCM(); $("#dlg").style.display = "none"; window.getSelection().removeAllRanges(); afterRender();
  };

  // ---------- router
  function route() {
    document.body.classList.remove("menu"); pop.style.display = "none"; cmbtn.style.display = "none";
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const [path, qs] = h.split("?"); const parts = path.split("/");
    if (parts[0] === "k") return viewCase(parts[1]);
    if (parts[0] === "t") return viewTheme(parts[1]);
    if (parts[0] === "vse") return viewAll(qs);
    if (parts[0] === "voprosy") return viewVoprosy(parts[1] || "");
    if (parts[0] === "p") return viewPage(parts[1]);
    if (parts[0] === "comments") return viewComments();
    if (parts[0] === "skachat") return viewSkachat();
    return viewHome();
  }
  $("#menu").onclick = () => document.body.classList.toggle("menu");
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    pop.style.display = "none"; cmbtn.style.display = "none"; $("#dlg").style.display = "none"; document.body.classList.remove("menu");
  });
  $("#rail").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("menu"); });
  window.addEventListener("hashchange", route);
  rail(); route();
})();
</script>
<noscript><p style="padding:24px">Страница работает только с включённым JavaScript. Открой ссылку в обычном браузере: Chrome, Safari или Firefox.</p></noscript>
</body>
