<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Улей HR</title>
<style>
:root { --paper: #f6f7f9; --sheet: #fff; --ink: #1d2433; --muted: #5d6677; --line: #d9dde5; --accent: #23497e; --bad: #a3312b; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
  font: 17px/1.5 "PT Sans", "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
form { width: min(100%, 380px); background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
h1 { margin: 0; font: 700 26px/1.2 "PT Serif", Georgia, serif; }
p { margin: 0; color: var(--muted); font-size: 15px; }
input[type=password] { width: 100%; font: 18px/1.4 inherit; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
label { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
button { font: 700 17px/1 inherit; padding: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#err { color: var(--bad); min-height: 1.5em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Улей HR</h1>
  <p>Кадровые политики, черновик. Страница закрыта паролем.</p>
  <input type="password" id="pw" placeholder="Пароль" autofocus aria-label="Пароль">
  <label><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div id="err" role="alert"></div>
  <p id="nojs">Если после ввода пароля ничего не происходит, открой ссылку в обычном браузере: Chrome, Safari или Firefox.</p>
</form>

  var KEY = "uley-hr-klyuch";
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  // Подменять документ только после полной загрузки: пока страница грузится, document.open() не очищает её,
  // и расшифрованная страница дописывается к странице входа.
  function show(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go, {once: true});
  }
  function open(key) {
    return crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct)).then(function (pt) {
      show(new TextDecoder().decode(pt));
    });
  }
  function fromRaw(raw) { return crypto.subtle.importKey("raw", b64(raw), {name: "AES-GCM"}, true, ["decrypt"]); }
  var err = document.getElementById("err"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Этот браузер не умеет открывать защищённые страницы. Открой ссылку в Chrome, Safari или Firefox."; go.disabled = true; return; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var form = document.getElementById("f");
  if (saved) {
    form.style.visibility = "hidden";
    fromRaw(saved).then(open).catch(function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      form.style.visibility = "";
    });
  }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value.trim();
    if (!pw) return;
    go.disabled = true; err.textContent = "";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (km) {

        }

      });
