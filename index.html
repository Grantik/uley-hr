иатрических освидетельствований, а также в случае медицинских противопоказаний». Для дистанционного периода — особенности ст. 312.7. Виды, сроки и освобождения по ПП 2464 в базе не приведены: специалисту по ОТ проверить, не выдумывать.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 13 добавить после 3.2.3 новый пункт, согласовав номер с группой PRIEM:<\/p>\n<blockquote>\n<p>3.2.4. При подготовке к приёму, переводе и изменении оборудования специалист по кадровому делопроизводству передаёт назначенному ответственному по охране труда сведения о должности, подразделении, дате начала работы и формате её выполнения. Ответственный по охране труда определяет применимые мероприятия, их основания и сроки, организует проведение и передаёт КДП и непосредственному руководителю подтверждение выполнения либо сведения об установленных ограничениях. До допуска к соответствующей работе руководитель проверяет выполнение обязательных для такого допуска мероприятий. Для дистанционной работы отдельно организуется ознакомление с требованиями охраны труда при использовании рекомендованных или предоставленных работодателем оборудования и средств. Вводная HR-презентация, выдача техники и ознакомление с внутренними документами не заменяют обязательные мероприятия по охране труда.<\/p>\n<\/blockquote>\n<p>В 12, 2.13.3, после существующего текста добавить: Применимые виды подготовки, категории работников, сроки и основания освобождения определяются специалистом по охране труда по действующим требованиям с учётом особенностей дистанционной работы; оформление и подтверждение допуска организуются во взаимодействии с КДП по регламенту адаптации. В 08, 8.4, не менять программы и сроки без специалиста. В 11, 2.4, включить выдачу сведений о положенных средствах в тот же маршрут.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Приём или перевод создаёт проверенную КДП карточку события; автоматическое получение из 1С не предполагается без проверки интеграции.<\/li>\n<li>Специалист по ОТ выбирает применимые действия и исполнителей; Decision Flow, если внедрён, выдаёт задачи и ведёт журнал.<\/li>\n<li>Исполнители прилагают подтверждения установленной формы; руководитель проверяет условия допуска, а не ждёт завершения всего испытательного срока.<\/li>\n<li>КДП хранит кадровые документы, специалист по ОТ — предусмотренную документацию; в маршруте остаются ссылки и статус.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли сейчас единый лист допуска и передача подрядчику по приёму/переводу? Кто сообщает о замене техники?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. КоАП ст. 5.27.1 ч. 3, ред. от 04.08.2026, только при доказанном допуске без обязательного обучения или осмотра: «на юридических лиц - от ста десяти тысяч до ста тридцати тысяч рублей». Здесь нарушение и сумма к взысканию не установлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в разрыве текста; средняя в потребности менять практику — существующий маршрут не предоставлен.<\/p>"}, {"id": "К-OT-05", "slug": "OT-05", "title": "ПВТР безусловно исключают дополнительные обязанности по ОТ на дистанционной работе", "imp": "высокая", "docs": ["03", "12"], "meta": [["Документы", "12, 3.2.5, 3.5, 10.3; 03, 2.4, 2.14–2.15, 3.11"], ["Тип", "противоречие между документами и неполное изложение действующей нормы"], ["Кто решает", "юристы и специалист по ОТ; группа DISC сводит изменения ПВТР"], ["Важность", "высокая: КДП может применить освобождение шире, чем разрешают принятые компанией правила"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 10.3: «другие обязанности работодателя по обеспечению безопасных условий труда и охраны труда, установленные Трудовым кодексом, другими федеральными законами и иными нормативными правовыми актами Российской Федерации, законами и иными нормативными правовыми актами субъектов Российской Федерации, на дистанционных работников/частично дистанционных работников в период выполнения ими трудовой функции дистанционно не распространяются.»<\/li>\n<li>03, п. 2.15: «…на дистанционных работников не распространяются, если иное не предусмотрено трудовым договором о дистанционной работе.»<\/li>\n<li>03, п. 3.11: «Периодическое ознакомление дистанционных работников с требованиями охраны труда проводится не реже одного раза в год.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> ПВТР не оговаривают дополнительные обязательства из ЛНА, а 03 сам вводит ежегодное ознакомление. 03 учитывает только трудовой договор как источник дополнительных обязанностей; действующая статья учитывает также ЛНА и коллективный договор. Кроме того, 03, 2.4, определяет дистанционного работника только через договор, а ПВТР предусматривают дополнительные соглашения и чередование периодов. Не предлагаем отменить дополнительные гарантии: сначала установить, что компания уже на себя приняла.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.7, единственная часть, ред. от 25.05.2026: «…на дистанционных работников в период выполнения ими трудовой функции дистанционно не распространяются, если иное не предусмотрено коллективным договором, локальным нормативным актом, принимаемым с учетом мнения выборного органа первичной профсоюзной организации, трудовым договором, дополнительным соглашением к трудовому договору.» Статья 312.1 ч. 3: «…работник, заключивший трудовой договор или дополнительное соглашение к трудовому договору … а также работник, выполняющий трудовую функцию дистанционно в соответствии с локальным нормативным актом … в соответствии со статьей 312.9 настоящего Кодекса».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12 заменить весь пункт 10.3, а в 3.5 вместо соответствующего абзаца дать ссылку на него:<\/p>\n<blockquote>\n<p>10.3. Работодатель обеспечивает безопасные условия и охрану труда в соответствии с трудовым законодательством. В период выполнения трудовой функции дистанционно обязанности работодателя определяются статьёй 312.7 Трудового кодекса Российской Федерации, включая ознакомление с требованиями охраны труда при работе с рекомендованными или предоставленными работодателем оборудованием и средствами, расследование и учёт несчастных случаев и профессиональных заболеваний, выполнение предусмотренных указанной статьёй предписаний и обязательное социальное страхование. Иные обязанности исполняются, если они предусмотрены коллективным договором, надлежащим образом принятым локальным нормативным актом, трудовым договором или дополнительным соглашением. При работе на стационарном рабочем месте применяются общие требования охраны труда. Дополнительные обязанности, принятые работодателем, не отменяются одним фактом дистанционного формата работы.<\/p>\n<\/blockquote>\n<p>В 03 заменить 2.4: Действие Положения распространяется на работников в период выполнения ими трудовой функции дистанционно на основании трудового договора, дополнительного соглашения либо локального нормативного акта о временном переводе в случаях статьи 312.9 ТК РФ; при чередовании периодов учитывается фактический формат работы. В 2.14–2.15 заменить прежние ссылки на ст. 212 ссылкой на ст. 312.7 и её действующее содержание; дополнительные обязанности по разделу 3 сохранить. В 12, 3.2.5, вместо самостоятельного распределения ответственности дать ссылку на 10.3, сохранив обязанности работника по применимым требованиям.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП отмечает основание и периоды дистанционной работы, специалист по ОТ — обязательные и дополнительно принятые меры.<\/li>\n<li>Перед выходом в офис руководитель проверяет применимые общие требования; удалённый период не считается пожизненным освобождением.<\/li>\n<li>Изменение правил согласуют с DISC; дополнительные гарантии не снимают без отдельной правовой проверки.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие дополнительные меры по ОТ закреплены в договорах, иных ЛНА и коллективном договоре, если он имеется?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: количество работников по форматам и стоимость мер не предоставлены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в расхождении формулировок; средняя в объёме фактически принятых компанией дополнительных обязанностей.<\/p>"}, {"id": "К-OT-06", "slug": "OT-06", "title": "Медосмотры поручены нескольким уровням, а передача кадрового события не определена", "imp": "высокая", "docs": ["08", "10", "12"], "meta": [["Документы", "08, 7.3.4 б), 7.3.5 б), е), 7.3.6 а), ж), 7.3.7 б)–в), 8.3.1; 12, 2.13; 10, 10.3–10.4"], ["Тип", "пробел: нет однозначной передачи между исполнителями"], ["Кто решает", "руководитель HR и специалист по ОТ; медицинские основания и допуск проверяют юристы"], ["Важность", "высокая: риск просрочить необходимый осмотр либо необоснованно отправлять всех подряд"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>08, п. 7.3.5 е): «списки работников, направляемых на обязательные предварительные (при поступлении на работу) и периодические (в течение трудовой деятельности) медицинские осмотры» — составляет специалист по ОТ.<\/li>\n<li>08, п. 7.3.7 б): «своевременное прохождение предварительных при поступлении на работу и периодических медицинских осмотров работниками Организации» — обеспечивает начальник КДП.<\/li>\n<li>08, п. 8.3.1 б): «определяется список профессий (должностей) работников, которые подлежат обязательным медицинским осмотрам, психиатрическим освидетельствованиям».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Распределение по уровням само по себе нормально: специалист определяет основания, кадры сопровождают людей, руководитель обеспечивает явку. Но из комплекта не видно, кто оформляет направление, получает заключение, передаёт ограничение руководителю и подтверждает возможность допуска. Отдельное положение, на которое ссылается 8.3.1 а), не передано; возможно, все шаги уже есть там. Нельзя считать ДМС заменой обязательного осмотра или автоматически распространять весь перечень 8.3.2 на каждого офисного работника.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 214 ч. 3 абз. 14, ред. от 25.05.2026: «в случаях, предусмотренных трудовым законодательством и иными нормативными правовыми актами, содержащими нормы трудового права, организацию проведения за счет собственных средств обязательных предварительных (при поступлении на работу) и периодических (в течение трудовой деятельности) медицинских осмотров … с сохранением за работниками места работы (должности) и среднего заработка на время прохождения указанных медицинских осмотров…». Основания конкретных осмотров по ст. 220 и медицинским порядкам в базе отсутствуют; их должен проверить специалист, включая особенности ст. 312.7.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Сначала запросить отдельное положение; при отсутствии описания в нём добавить в 08:<\/p>\n<blockquote>\n<p>8.3.6. При подготовке к приёму, переводе и изменении условий работы КДП передаёт специалисту по охране труда сведения, необходимые для определения обязательности медицинских осмотров и освидетельствований. Специалист по охране труда указывает основание, вид осмотра, срок и применимость к соответствующей работе. По его заданию КДП оформляет и передаёт направление, согласует организационные вопросы с работником и медицинской организацией и контролирует получение предусмотренного заключения. Непосредственный руководитель обеспечивает возможность прохождения обязательного осмотра и не допускает работника к работе при отсутствии обязательного заключения либо наличии противопоказаний. Решение о необходимых кадровых действиях принимается работодателем на основании применимых требований и медицинского заключения; сведения о диагнозе в общий журнал маршрута не включаются. Расходы на обязательные осмотры несёт работодатель; бухгалтерия получает основание для сохранения предусмотренного законом среднего заработка.<\/p>\n<\/blockquote>\n<p>В 7.3.7 добавить обязанность КДП сопровождать маршрут 8.3.6; не заменять этим медицинскую оценку специалиста. В 10 не вводить новый вид неоплачиваемого отсутствия; порядок отстранения и его оплаты без ст. 76 не переписывать. Утверждённые перечни и календарный план должны быть приложены либо точно указаны в едином месте хранения, а не восстановлены из черновика улья.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Событие приёма/перевода или очередная дата создаёт задачу специалисту по ОТ.<\/li>\n<li>После проверки основания КДП организует направление и явку; срок берётся из применимого порядка и заключения, не задаётся помощником с ИИ.<\/li>\n<li>Ответственный фиксирует заключение и ограничения, руководитель получает только необходимые сведения о допуске.<\/li>\n<li>Бухгалтерия получает документ-основание; Decision Flow контролирует маршрут, но не оценивает здоровье и не принимает решение об отстранении.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где отдельное положение, перечни, график и направления? Кто сейчас получает заключение и сообщает руководителю о допуске?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Денежные последствия зависят от применимости обязательного осмотра; санкция КоАП из <a href=\"#/k/OT-04\">К-OT-04<\/a> не является установленным долгом компании.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по недостаточности переданного комплекта; средняя по необходимости нового пункта — порядок может быть в непереданном документе.<\/p>"}, {"id": "К-OT-07", "slug": "OT-07", "title": "Роли в приказах и договоре с подрядчиком не связаны с реальным кадровым исполнителем", "imp": "высокая", "docs": ["03", "06", "08", "11"], "meta": [["Документы", "03, 1.3–1.4; 06, 7.1; 08, 7.1.1, 7.1.7, 7.3.1, 7.3.3 в); 11, 8.1"], ["Тип", "пробел в подтверждении полномочий и замещения"], ["Кто решает", "генеральный директор утверждает назначения; руководитель HR, специалист по ОТ и юристы готовят согласованную схему"], ["Важность", "высокая: внешняя компания не подменяет назначение ответственного и контроль работодателя"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 1.3: «Обязанности по своевременному ознакомлению с требованиями охраны труда дистанционных работников организации возлагаются на лиц, назначенных приказом генерального директора.»<\/li>\n<li>08, п. 7.3.3 в): «вправе делегировать функции и полномочия в области охраны труда иным должностным лицам Организации и/или аккредитованной организации, оказывающей услуги в области охраны труда».<\/li>\n<li>11, п. 8.1: «Ответственность за своевременную выдачу в полном объеме смывающих и обезвреживающих средств работникам Организации возлагается на лицо в соответствии с приказом Генерального директора.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В практике известны специалист КДП, ВУ и ОТ и подрядчик, но в комплекте нет конкретных приказов, границ договора и замещения. Нельзя сделать вывод, что назначения отсутствуют или что все похожие названия относятся к одному человеку. Без сверки маршрутизатор может отправить срочное извещение неуполномоченному или недоступному исполнителю.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 214 ч. 1, ред. от 25.05.2026: «Обязанности по обеспечению безопасных условий и охраны труда возлагаются на работодателя.» ТК ст. 229 ч. 1 той же редакции включает в комиссию «специалист по охране труда или лицо, назначенное ответственным за организацию работы по охране труда приказом (распоряжением) работодателя». Полного регулирования внешнего оказания услуг и требований к аккредитации в базе нет: проверить специалисту и юристам, не приравнивать любой договор к передаче всех полномочий.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 08 после 7.3.1 добавить пункт 7.3.1.1:<\/p>\n<blockquote>\n<p>7.3.1.1. Для каждого действия, предусмотренного настоящим Положением, в организационно-распорядительных документах указываются ответственная должность, основание полномочий, исполнитель и порядок замещения. При привлечении внешней организации разграничиваются выполняемые ею услуги, действия работников Организации и действия, остающиеся за работодателем. КДП ведёт доступный участникам перечень действующих назначений и передаёт изменения специалисту по охране труда при изменении должности, полномочий или прекращении трудовых отношений ответственного работника. Передача услуги подрядчику не освобождает работодателя от установленных законом обязанностей. Срочные действия выполняются без ожидания планового согласования с подрядчиком назначенным уполномоченным лицом.<\/p>\n<\/blockquote>\n<p>В ссылках 03, 1.3; 06, 7.1; 11, 8.1, указать точные реквизиты действующих приказов после их предъявления. В 08, 7.3.7, не заменять должность автоматически на специалиста КДП: сначала сопоставить полномочия. Это же сопоставление передать группе SKVOZ, не создавать параллельный реестр ролей.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR и специалист по ОТ сопоставляют роли с приказами и договором подрядчика.<\/li>\n<li>Генеральный директор устраняет непокрытые действия и назначает замещение в пределах закона.<\/li>\n<li>КДП при кадровом изменении обновляет перечень, а исполнитель процесса — маршрут; срочные задачи не остаются без получателя.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто назначен на каждую роль, где приказ и договор подрядчика, кто замещает ответственного при отсутствии?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Нет данных о задержках и объёме работ подрядчика; частоту упоминания роли нельзя переводить в трудозатраты.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в зависимости текста от приказов; средняя в наличии непокрытых функций — приказы не предоставлены.<\/p>"}, {"id": "К-OT-08", "slug": "OT-08", "title": "Расследование несчастного случая описано дважды, а источник правил не определён", "imp": "высокая", "docs": ["03", "06", "08"], "meta": [["Документы", "03, раздел 8; 06, разделы 6–13; 08, 8.11.1, 8.11.7"], ["Тип", "противоречие между документами: дубли с разными исполнителями и ссылками"], ["Кто решает", "специалист по ОТ и юристы; генеральный директор утверждает изменение"], ["Важность", "высокая: КДП и комиссия могут взять разные версии одного порядка"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 8.3.1, фрагмент об исполнителе: «специалист по охране труда в течение суток обязан направить извещение».<\/li>\n<li>06, п. 7.1, тот же фрагмент: «лицо, на которое приказом руководителя Организации возложено исполнение функций специалиста по охране труда в течение суток обязан направить извещение».<\/li>\n<li>08, п. 8.11.7: «Положении о расследовании и учете профессиональных заболеваний в ООО «[компания]» СУОТ.П09-2022-1, Порядке расследования и учета микроповреждений (микротравм) в ООО «[компания]» СУОТ.П10-2022-1».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Раздел 8 документа 03 воспроизводит порядок 06 с другой нумерацией и местами иными обозначениями ответственного. Правки приходится делать в обоих местах, в том числе по извещениям и выдаче акта из следующих кейсов. Раздел 9 документа 03 содержит порядок профзаболеваний, но это не доказательство, что он заменяет отдельный П09 из 08; П09 и П10 не переданы. Нельзя отменить раздел 9, пока не найден и проверен действующий источник.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 217 ч. 2, ред. от 25.05.2026: «Работодатель обязан обеспечить создание и функционирование системы управления охраной труда.» ТК ст. 214 ч. 3 абз. 18: «расследование и учет несчастных случаев на производстве и профессиональных заболеваний, учет и рассмотрение причин и обстоятельств событий, приведших к возникновению микроповреждений (микротравм), в соответствии с настоящим Кодексом, другими федеральными законами и иными нормативными правовыми актами Российской Федерации». Сам дубль законом не запрещён; проблема в управлении правилами.<\/p>\n<p><strong>Стало (предлагается).<\/strong> После исправлений 06 по <a href=\"#/k/OT-09\">К-OT-09<\/a>–11 заменить раздел 8 документа 03:<\/p>\n<blockquote>\n<ol start=\"8\">\n<li>Реагирование на несчастные случаи и их расследование.\n8.1. Дистанционный работник немедленно сообщает непосредственному или вышестоящему руководителю о происшествии. Руководитель обеспечивает незамедлительную передачу сообщения назначенному ответственному по охране труда и работодателю. Неотложная помощь и предотвращение дальнейшего вреда не откладываются до оформления сообщения.\n8.2. Расследование, извещение, оформление и выдача документов осуществляются в соответствии с действующим Положением об особенностях расследования несчастных случаев на производстве СУОТ.П08-2022-1 (документ 06). Сам по себе дистанционный формат не является основанием для отказа в расследовании; квалификация случая производится уполномоченной комиссией в установленном порядке.<\/li>\n<\/ol>\n<\/blockquote>\n<p>Раздел 9 документа 03 до отдельной проверки не исключать. В 08, 8.11.7, после получения П09 и П10 внести точные реквизиты и ссылки на действующие экземпляры; если отдельного П09 нет, специалист по ОТ и юристы решают, какой проверенный документ будет единственным источником, без обнуления действующего порядка. Общий реестр передать SKVOZ.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Специалист по ОТ сверяет 03 и 06 и готовит единую исправленную процедуру 06.<\/li>\n<li>Генеральный директор утверждает изменение и одновременно заменяет дублирующий раздел 03 ссылкой.<\/li>\n<li>КДП получает единую памятку передачи сведений; устаревшие копии изымаются по 08, 12.5. До утверждения действуют существующие документы и прямые требования закона.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельные П09, П10 и более поздняя редакция П08? Каким из двух порядков пользуется подрядчик?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; объём дублирования не переводился в часы или деньги.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по наличию дубля; средняя по выбору окончательного единственного источника до получения недостающих документов.<\/p>"}, {"id": "К-OT-09", "slug": "OT-09", "title": "В первичном извещении о тяжёлом или групповом случае пропущен орган местного самоуправления", "imp": "высокая", "docs": ["03", "06"], "meta": [["Документы", "06, 7.1–7.2; 03, 8.3.1–8.3.2"], ["Тип", "расходится с законом: неполный перечень адресатов"], ["Кто решает", "юристы и специалист по ОТ; КДП помогает подготовить сведения, не квалифицирует случай"], ["Важность", "высокая: исполнение списка ЛНА оставляет обязательного адресата без извещения"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>06, п. 7.1 в): «в орган исполнительной власти субъекта РФ»; остальные подпункты перечисляют инспекцию труда, прокуратуру, направившего работодателя, федеральный надзорный орган, страховщика и федеральный орган для подведомственной организации.<\/li>\n<li>03, п. 8.3.1 в): «в орган исполнительной власти субъекта РФ».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В списках отсутствует орган местного самоуправления по месту происшествия, прямо указанный в ТК. Срок в течение суток верен, но соблюдение срока не исправляет неполный список адресатов. Факт конкретного случая и ненаправления извещения не установлен: это дефект текста, а не готовое обвинение компании.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 228.1 ч. 1 абз. 4, ред. от 25.05.2026: «в орган исполнительной власти субъекта Российской Федерации, осуществляющий полномочия по реализации государственной политики в области охраны труда на территории субъекта Российской Федерации, и в орган местного самоуправления по месту происшедшего несчастного случая». Первая часть устанавливает извещение «в течение суток» при групповом, тяжёлом или смертельном случае.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 06, 7.1 в), заменить:<\/p>\n<blockquote>\n<p>в) в орган исполнительной власти субъекта Российской Федерации, осуществляющий полномочия по реализации государственной политики в области охраны труда на территории субъекта Российской Федерации, и в орган местного самоуправления по месту происшедшего несчастного случая;<\/p>\n<\/blockquote>\n<p>До замены раздела 8 документа 03 такую же правку сделать в 8.3.1 в). В 06 после 7.2 добавить:<\/p>\n<blockquote>\n<p>7.2.1. Назначенное уполномоченное лицо ведёт перечень обязательных адресатов и сохраняет подтверждения направления извещений. Адресаты определяются с учётом места и обстоятельств происшествия и требований статьи 228.1 ТК РФ; отсутствие сведений в локальном перечне не отменяет обязанности работодателя направить предусмотренное законом извещение. КДП по запросу незамедлительно предоставляет необходимые сведения о трудовых отношениях и командировании пострадавшего.<\/p>\n<\/blockquote>\n<p>Имена и контакты адресатов в публичную/общую карточку не переносить; рабочие реквизиты ведёт уполномоченный исполнитель. Срок не менять на рабочий день.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работник сообщает руководителю; ответственный и работодатель организуют неотложные действия и получение необходимых сведений.<\/li>\n<li>Уполномоченный исполнитель определяет обязательных адресатов по закону и направляет извещения в установленный срок.<\/li>\n<li>КДП передаёт требуемые кадровые документы; в журнале остаются время отправки и подтверждения. Согласование в Decision Flow не задерживает извещение.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли актуальный список адресатов и замещающий исполнитель для срочного извещения?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Возможность применения КоАП 5.27.1 ч. 1 зависит от установленных обстоятельств; штраф не рассчитан и не объявлен неизбежным.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: пропуск виден в обоих перечнях и однозначно сопоставляется с нормой.<\/p>"}, {"id": "К-OT-10", "slug": "OT-10", "title": "Для случая, ставшего тяжёлым позднее, внутри одного порядка заданы разные сроки", "imp": "высокая", "docs": ["03", "06"], "meta": [["Документы", "06, 7.3 и 12.4; 03, 8.3.3 и 8.8.4"], ["Тип", "противоречие внутри документа"], ["Кто решает", "специалист по ОТ и юристы; руководитель компании выбирает, сохранять ли более строгий внутренний срок"], ["Важность", "высокая: исполнитель не понимает, действует ли внутренний сокращённый срок или общий срок извещения"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>06, п. 7.3: «в течение трех календарных дней после получения сведений об этом».<\/li>\n<li>06, п. 12.4: «в течение суток извещение по установленной форме о несчастных случаях на производстве, которые по прошествии времени перешли в категорию тяжелых несчастных случаев или несчастных случаев со смертельным исходом».<\/li>\n<li>Те же формулировки повторены в 03, 8.3.3 и 8.8.4 соответственно.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Сокращение срока до суток само по себе не ухудшает положение работника и не является нарушением ТК. Но 12.4 смешивает сообщение о последствиях, извещение об изменившейся тяжести и повторяющихся адресатов, не разделяя события и начало отсчёта. Если компания хочет внутренний срок в сутки, его следует назвать внутренним и согласовать с исполнителем; по умолчанию нельзя объявить его юридически запрещённым.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 228.1 ч. 5, ред. от 25.05.2026: «…работодатель (его представитель) в течение трех календарных дней после получения сведений об этом направляет извещение по установленной форме…». Это иной случай, чем первичное суточное извещение по ч. 1.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Рекомендуемый вариант — единая ссылка вместо конкурирующего срока. В 06 заменить 12.4:<\/p>\n<blockquote>\n<p>12.4. При получении сведений о переходе несчастного случая в категорию тяжёлых либо случаев со смертельным исходом специалист по охране труда незамедлительно уведомляет работодателя и обеспечивает направление извещения в порядке, адресатам и в срок пункта 7.3 настоящего Положения. Дата получения сведений и подтверждения направления сохраняются в материалах дела. Сообщение о последствиях несчастного случая оформляется отдельно в установленном порядке и не заменяет указанного извещения.<\/p>\n<\/blockquote>\n<p>Пункт 7.3 сохранить после правовой сверки адресатов. До устранения дубля заменить 03, 8.8.4, ссылкой на 06, 12.4. Сроки сообщения о последствиях по 06, 12.5 (и 03, 8.8.5), не менять без проверки специального порядка: его текста в базе нет. Альтернатива по выбору руководителя — прямо утвердить внутренний срок в сутки от получения сведений без изменения законного предельного срока; не подставлять его автоматически.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП или иной получатель передаёт новые сведения назначенному специалисту и работодателю сразу после получения.<\/li>\n<li>Исполнитель фиксирует событие получения сведений отдельно от завершения расследования и окончания нетрудоспособности.<\/li>\n<li>Маршрут контролирует отдельные виды сообщений по проверенным срокам; не требует ждать итоговую справку, если сведения об изменившейся тяжести уже получены.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Суточный срок — сознательное внутреннее правило или оставшийся фрагмент шаблона? От кого и когда получают сведения об изменившейся тяжести?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: фактические случаи и затраты неизвестны; сроки дословно взяты из нормы и ЛНА, календарные даты не рассчитывались.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в противоречии текста; средняя в выборе внутреннего срока, который не принят за руководителя.<\/p>"}, {"id": "К-OT-11", "slug": "OT-11", "title": "Работник не получает в тексте ЛНА экземпляр утверждённого акта в срок по ТК", "imp": "высокая", "docs": ["03", "06"], "meta": [["Документы", "06, 10.6, 11.2–11.3; 03, 8.6.20–8.6.22, 8.7.2–8.7.3"], ["Тип", "пробел/расхождение с законом: выдача акта пострадавшему не описана"], ["Кто решает", "юристы и специалист по ОТ; КДП обеспечивает передачу и хранение кадровой копии"], ["Важность", "высокая: у работника нет ясного маршрута получения документа и доказательства передачи"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>06, п. 10.6: «Акт формы Н-1 составляется комиссией, проводившей расследование несчастного случая на производстве, в двух экземплярах.»<\/li>\n<li>06, п. 11.2–11.3 описывают направление акта и материалов в прокуратуру, инспекцию труда, федеральный орган и страховщику, но не содержат выдачи экземпляра пострадавшему.<\/li>\n<li>03, п. 8.6.20: «Результаты расследования обстоятельств происшествия оформляются комиссией актом о расследовании обстоятельств происшествия, предполагающего гибель работника в результате несчастного случая установленной по форме.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 06 есть изготовление двух экземпляров и внешние направления, но нет шага <code>утвердить работодателем и выдать пострадавшему в течение трёх календарных дней<\/code>. В 03 дублирующий раздел также не показывает выдачу. Это не доказывает, что работнику никогда не выдают акт; это означает, что по самому ЛНА исполнителю не задан кадровый результат и место доказательства.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 230 ч. 6, ред. от 25.05.2026: «Работодатель (его представитель) в течение трех календарных дней после завершения расследования несчастного случая на производстве обязан выдать один экземпляр утвержденного им акта о несчастном случае на производстве пострадавшему … Второй экземпляр указанного акта вместе с материалами расследования хранится в течение 45 лет работодателем…» Статья 230 ч. 1 требует акт в двух экземплярах при переводе, утрате трудоспособности не менее одного дня или смерти.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 06 после 10.6 добавить:<\/p>\n<blockquote>\n<p>10.6.1. После завершения расследования акт о несчастном случае утверждается работодателем в установленном порядке.\n10.6.2. В течение трех календарных дней после завершения расследования работодатель или назначенное им лицо выдаёт один экземпляр утверждённого акта пострадавшему, его законному представителю или иному доверенному лицу. При смертельном исходе акт выдаётся лицам, состоявшим на иждивении погибшего, либо лицам, состоявшим с ним в близком родстве или свойстве, их законному представителю или иному доверенному лицу, по их требованию. При невозможности личной передачи в указанный срок работодатель вправе направить акт по месту регистрации соответствующего адресата заказным письмом с уведомлением о вручении лично адресату и описью вложения в порядке статьи 230 Трудового кодекса Российской Федерации. Подтверждение выдачи или направления приобщается к материалам расследования.\n10.6.3. Второй экземпляр акта вместе с материалами расследования хранится в течение 45 лет работодателем, осуществляющим по решению комиссии учёт данного случая. При страховом случае третий экземпляр и копии материалов направляются в исполнительный орган страховщика по месту регистрации работодателя в качестве страхователя в течение трех календарных дней после завершения расследования.<\/p>\n<\/blockquote>\n<p>В 03 добавить после 8.6.6 новый пункт 8.6.6.1 с отсылкой к 06, 10.6.1–10.6.3; при замене всего раздела по <a href=\"#/k/OT-08\">К-OT-08<\/a> отдельная вставка не нужна. Существующие пункты 8.6.20–8.6.22 о предполагаемой гибели работника не удалять: они регулируют другой случай. В 06, 11.2–11.3 сохранить специальные внешние направления. В 10.6 дополнительно указать: при страховом случае составляется дополнительный экземпляр акта в соответствии со статьёй 230 ТК РФ. КДП получает копию/ссылку по установленному маршруту; хранение не заменяет выдачу.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Комиссия передаёт работодателю подписанный акт; работодатель утверждает.<\/li>\n<li>Назначенное лицо фиксирует дату завершения расследования, дату выдачи/отправки и подтверждение вручения.<\/li>\n<li>Работник получает экземпляр; второй экземпляр и материалы помещаются в архив на 45 лет, третий — страховщику при страховом случае.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто сейчас выдаёт акт и где лежит подтверждение? Установлен ли архивный срок 45 лет в номенклатуре дел?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Стоимость хранения и число дел неизвестны; срок 45 лет — из ТК, не расчёт.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по отсутствию шага выдачи в переданных пунктах и тексту нормы; средняя по фактической практике.<\/p>"}, {"id": "К-OT-12", "slug": "OT-12", "title": "Средства для кожи привязаны к трудовому договору, но передача нормы при кадровом событии не задана", "imp": "средняя", "docs": ["08", "11", "12"], "meta": [["Документы", "11, 7.1–7.2, 7.8, приложение 1; 08, 8.5; 12, 3.2.5"], ["Тип", "пробел в связи перечня и кадрового оформления"], ["Кто решает", "специалист по ОТ; КДП и руководители подразделений исполняют; юристы проверяют нормы"], ["Важность", "средняя: работник может не попасть в перечень после приёма или перевода"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>11, п. 7.1: «Специалист по охране труда на основании результатов специальной оценки условий труда, проведенной в установленном порядке, в соответствии с типовыми нормами бесплатной выдачи работникам смывающих и (или) обезвреживающих средств составляет и направляет на утверждение Генеральному директору перечень рабочих мест и список работников, которым выдаются смывающие и обезвреживающие средства».<\/li>\n<li>11, п. 7.2 а): «нормы выдачи смывающих и (или) обезвреживающих средств, соответствующие условиям труда на рабочем месте работника, указываются в трудовом договоре работника».<\/li>\n<li>11, п. 7.8: «Выдача работникам смывающих и обезвреживающих средств должна фиксироваться под роспись в личной карточке учета выдачи смывающих и обезвреживающих средств».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> 11 описывает ежегодный/исходный перечень и карточку, но не событие приёма, перевода, изменения условий или трудового договора. КДП не названо участником обновления. 08, 8.5 и 11, 7.1 называют норму и СОУТ, но не описывают передачу перечня в кадровый маршрут. Трудовой договор нельзя дополнять по догадке: сначала проверить фактические условия и применимые нормы.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 221 ч. 4, ред. от 25.05.2026: «Нормы бесплатной выдачи средств индивидуальной защиты и смывающих средств работникам устанавливаются работодателем на основании единых Типовых норм выдачи средств индивидуальной защиты и смывающих средств с учетом результатов специальной оценки условий труда, результатов оценки профессиональных рисков, мнения выборного органа первичной профсоюзной организации или иного уполномоченного представительного органа работников (при наличии такого представительного органа).» Статья 214 ч. 3 абз. 9 возлагает на работодателя приобретение и выдачу за свой счёт подтверждённых средств.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 11 после 7.1 добавить:<\/p>\n<blockquote>\n<p>7.1.1. При приёме, переводе, изменении условий труда или рабочего места КДП передаёт специалисту по охране труда сведения о должности, подразделении, рабочем месте и дате события. Специалист по охране труда проверяет применимость норм выдачи на основании специальной оценки условий труда, оценки профессиональных рисков и утверждённых норм, после чего направляет на утверждение изменения перечня и передаёт КДП сведения для включения предусмотренного условия в трудовой договор или дополнительное соглашение. До выдачи средства должны быть приобретены работодателем и соответствовать применимым требованиям.<\/p>\n<\/blockquote>\n<p>В 08, 8.5, добавить ссылку на порядок 11, 7.1.1 и на подтверждённую редакцию единых норм. В 12, 3.2.5, не перечислять средства как универсально обязательные без определения категорий. В приложение 1 к 11 добавить поле и согласовать форму с текущими правилами.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП сообщает о кадровом событии; специалист по ОТ проверяет условия и основания.<\/li>\n<li>Ответственный обновляет перечень, нормы и кадровый документ; генеральный директор утверждает, если это требуется текущим порядком.<\/li>\n<li>Ответственный выдаёт средство и оформляет карточку/допустимую запись; работник получает информирование и подтверждает получение.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли за период действия 11 приёмы/переводы в категории, где нужны средства? Вносятся ли нормы в трудовые договоры сейчас?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Неизвестны число работников и расход средств; типовые нормы и оценка рисков не перенесены из базы.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в отсутствии кадрового триггера в 11; средняя в том, что он не описан в другом документе.<\/p>"}, {"id": "К-OT-13", "slug": "OT-13", "title": "Документ 08 называет отдельные ЛНА, которых нет в переданном комплекте", "imp": "высокая", "docs": ["03", "06", "08", "11"], "meta": [["Документы", "08, 8.1.2, 8.2.2, 8.3.1, 8.5.1, 8.6.1, 8.11.1, 8.11.7, 8.12.3; 03, 06, 11"], ["Тип", "пробел/неполная связь реестра документов"], ["Кто решает", "специалист по ОТ и юристы; SKVOZ ведёт общий реестр"], ["Важность", "высокая: кадровый маршрут опирается на правила, которые нельзя проверить по присланным копиям"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>08, п. 8.3.1: «Положением о проведении обязательных предварительных и периодических медицинских осмотров, и психиатрических освидетельствований в ООО «[компания]»».<\/li>\n<li>08, п. 8.11.7: «Порядке расследования и учета микроповреждений (микротравм) в ООО «[компания]» СУОТ.П10-2022-1».<\/li>\n<li>08, п. 8.12.3: «Инструкции по охране труда при использовании персонального компьютера, копировальной и множительной техники».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Ссылки определяют решения в кадровых событиях — медосмотр, микротравма, работу за ПК — но копий этих актов среди 16 переданных документов нет. Так можно либо применить неактуальную версию, либо не выдать работнику правило, которое на него распространяется. <code>Нет в комплекте<\/code> не равно <code>нет в компании<\/code>; требуется реестр и статус каждой ссылки.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 214 ч. 3 абз. 25, ред. от 25.05.2026: «ведение реестра (перечня) нормативных правовых актов … содержащих требования охраны труда, в соответствии со спецификой своей деятельности, а также доступ работников к актуальным редакциям таких нормативных правовых актов». В базе нет нормы, которая по одному отсутствию копии среди переданных 16 признаёт ЛНА недействующим.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 08, 12.1–12.6, дополнить реестр документов СУОТ таблицей: код/название; вид; редакция и дата; чем утверждён; владелец; связанные кадровые события; источник актуальной копии; работники, которым доступна; дата следующего пересмотра; статус. Для каждой ссылки 08 назначить владельца и срок предоставления копии специалисту по ОТ. В 8.3.1, 8.11.7, 8.12.3 дать код документа вместо свободного названия, когда код подтверждён. 03, 06 и 11 включить в тот же реестр, не создавать второй список.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Специалист по ОТ собирает ссылки 08 и запрашивает действующие экземпляры.<\/li>\n<li>SKVOZ заносит документы в общий реестр; отсутствие копии помечается как «не получено», а не как отмена.<\/li>\n<li>Перед кадровым событием исполнитель проверяет статус и редакцию; при неактуальном документе не создаёт новое правило самостоятельно, а ставит задачу владельцу.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где хранятся П09, П10, положение о медосмотрах, положение об аудитах, процедура управления документацией и инструкция по ПК? Как работникам дают доступ?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали. Рассчитано программой: среди 14 найденных ссылок/упоминаний в 08 <strong>9<\/strong> не сопоставлены с присланными 16 документами; команда: расчёт программой (раздел 3). Это число сопоставлений, а не число отсутствующих актов компании.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в наличии ссылок; средняя в статусе актов вне переданного комплекта.<\/p>"}, {"id": "К-OT-14", "slug": "OT-14", "title": "Неверная ссылка в порядке разногласий мешает работнику обжаловать результат", "imp": "высокая", "docs": ["03", "06"], "meta": [["Документы", "06, 12.8, 13.1–13.2; 03, 8.9.1–8.9.3"], ["Тип", "ошибка ссылки, меняющая маршрут"], ["Кто решает", "специалист по ОТ и юристы"], ["Важность", "высокая: при споре комиссия и пострадавший получают неоднозначное указание"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>06, п. 13.2: «Решения органа, указанного в пункте 12.1. могут быть обжалованы в суде.»<\/li>\n<li>06, п. 12.1: «Специалист по охране труда обеспечивает:» — это не орган, рассматривающий разногласия.<\/li>\n<li>03, п. 8.9.2: «Решения органа, указанного в пункте 12.1. могут быть обжалованы в суде.»; в разделе 8 пункта 12.1 нет.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 06 ссылка ведёт на пункт о справке, а в 03 — на отсутствующий пункт. Пункт 13.1 называет федеральный надзорный орган, но 13.2 не ссылается на него. Это явная ошибка текста, которая становится кадровым действием при несогласии пострадавшего или представителя.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 231, ред. от 25.05.2026, в переданной базе отсутствует; нормы закона о порядке обжалования в разрешённых базах нет, проверить юристам. ТК ст. 229 ч. 10–11 подтверждает право пострадавшего и представителя участвовать и знакомиться с материалами, но не заменяет проверку статьи 231.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 06 заменить 13.2:<\/p>\n<blockquote>\n<p>13.2. Решения федерального органа исполнительной власти, уполномоченного на осуществление федерального государственного надзора за соблюдением трудового законодательства, и его территориальных органов по вопросам, указанным в пункте 13.1 настоящего Положения, могут быть обжалованы в судебном порядке в соответствии с законодательством Российской Федерации.<\/p>\n<\/blockquote>\n<p>В 03, 8.9.2, дать ту же формулировку либо ссылку на 06, 13.2. В 06, 12.8, ошибки ссылки на 12.1 нет: этот пункт о дополнительном расследовании не изменяется настоящим кейсом. Точный порядок и сроки не дописывать без текста ст. 231.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП передаёт пострадавшему или представителю материалы и сведения о решении по установленной процедуре.<\/li>\n<li>Специалист по ОТ фиксирует разногласие и направляет его в надлежащий орган.<\/li>\n<li>В выдаваемой копии указывают проверенный порядок обжалования; юридическая служба проверяет финальный текст.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Были ли случаи разногласий? Кто даёт пострадавшему актуальную инструкцию об обжаловании?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; число споров не дано.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в ошибке ссылки; низкая в окончательной формулировке порядка обжалования до проверки ст. 231.<\/p>"}, {"id": "К-OT-15", "slug": "OT-15", "title": "Мелкая редактура меняет читаемость и может смешать адресата с исполнителем", "imp": "низкая", "docs": ["03", "06", "08", "11"], "meta": [["Документы", "03, 1.1, 3.1, 3.16, 8.1.1, 8.4.7; 06, 1.2, 6.2, 8.3, 11.1, 12.1–12.5; 08, 8.3.1–8.3.5, 8.5.1, 10.4; 11, 7.2, 7.8"], ["Тип", "редактура: список для юристов и специалиста по ОТ"], ["Кто решает", "специалист по ОТ и юристы; не исправлять автоматически без сверки формы"], ["Важность", "низкая отдельно, высокая в комплекте: труднее понять, кто и что делает"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>03, п. 1.1: «Ознакомление дистанционных работников с требованиями охраны труда осуществляются».<\/li>\n<li>06, п. 1.2: «Положение разработано в соответствии со статьей 214, 227-231 Трудового кодекса РФ и Приказа Министерства труда и социальной защиты РФ от 20 апреля 2022 года № 223н».<\/li>\n<li>11, п. 7.2: «При составлении Перечня учитывается следующее: а) нормы выдачи … указываются в трудовом договоре работника.»<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Есть ошибки согласования, падежа, ссылок, нумерации, названий и незаполненных шаблонов: 06, 3.1 с таблицей и фрагментом; 06, 3, приказ №223 без «н»; 06, 7.1 и 11, 8.1 с неопределённым «лицом»; 03, 8.9.2 со ссылкой на 12.1; 08, 8.3.1 «процедуры организации и проведения наблюдения»; 11, 7.8 «с нормы выдачи». Это не объединять с правовыми выводами: сначала сверить смысл и первоисточник.<\/p>\n<p><strong>Закон.<\/strong> Нормы в базе нет, проверить юристам: это редактура ЛНА, а не вывод о нарушении.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В рамках одной редакции документов:<\/p>\n<ul>\n<li>согласовать 03, 1.1: <code>Ознакомление … осуществляется<\/code>;<\/li>\n<li>проверить 06, 1.2: <code>в соответствии со статьями 214, 227–231 Трудового кодекса Российской Федерации и приказом … № 223н<\/code>;<\/li>\n<li>в 06, 7.1, 11, 8.1 и аналогичных местах заменить неопределённое «лицо» на должность/роль и реквизиты приказа после проверки назначения;<\/li>\n<li>в 06, 3 и 08, 2 привести наименование внешних актов, номер 223н, 632н, 773н, 771н и названия внутренних документов к реестру, не объявляя акт отменённым;<\/li>\n<li>в 08, 8.3.1, исправить грамматику без изменения процесса: <code>С целью организации наблюдения за состоянием здоровья работников…<\/code>; в 11, 7.8: <code>ознакомления работника с нормами выдачи…<\/code>;<\/li>\n<li>все ссылки на пункты проверить машинно и глазами; содержательные изменения из <a href=\"#/k/OT-01\">К-OT-01<\/a>–14 не прятать в редактуре.<\/li>\n<\/ul>\n<p><strong>Как будет работать.<\/strong> Специалист по ОТ составляет таблицу <code>фрагмент — правка — основание — проверил<\/code>. Юрист проверяет правовой смысл. Генеральный директор утверждает новую редакцию и реестр заменённых копий.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли утверждённые формы и внутренний глоссарий ролей? Какой документ является последней редакцией?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: мелкие правки не переводились в часы.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в наличии видимых редакторских мест; средняя в допустимой формулировке до проверки юристом.<\/p>"}]}, {"kod": "SKVOZ", "nazv": "Сквозное: ознакомление, роли, ЭДО, профсоюз", "glavnoe": "<ol>\n<li><strong><a href=\"#/k/SKVOZ-05\">К-SKVOZ-05<\/a>. Подпись пакета ЛНА не показывает, кто ознакомлен с нужной редакцией.<\/strong> Почему первым: это боль самого отдела — в ответах 10.11, раздел 3.5, бумажный лист ознакомления для офисных назван очень неудобным; руководитель КДП на встрече 11.11 хотела утром видеть список, кто вчера подписал и кто нет. Быстрый результат без новых правил: разовая сверка того, что уже лежит в папках сотрудников, листах и Диадоке; сначала руками или выгрузкой, интеграция не обещана.<\/li>\n<li><strong><a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a>. Диадок почти для всех кадровых документов, а ПВТР знают ЭДО только для дистанционных.<\/strong> Почему: от одного ответа (есть ли акт о введении ЭДО) зависит, на чём стоит нынешний маршрут, и правки DISC, OTP, PRIEM; это вопрос одной бумаги, а не перестройки работы.<\/li>\n<li><strong><a href=\"#/k/SKVOZ-11\">К-SKVOZ-11<\/a>. Перед утверждением ЛНА не видно проверки представительного органа работников.<\/strong> Почему: это ворота для всех правок девяти групп и для графика отпусков 2027 года (ТК 123 тоже говорит об учёте мнения); ответ, есть ли профсоюз, нужен до первого приказа: если процедура обязательна и пропущена, принятые правки не подлежат применению (ТК 8 ч. 4).<\/li>\n<li><strong><a href=\"#/k/SKVOZ-08\">К-SKVOZ-08<\/a>. Не определено, чей ЛНА применять, когда КДП и HR работают на несколько компаний группы.<\/strong> Почему: она сама ведёт подбор и для других компаний группы (ответы 10.11, раздел 1.2), КДП ведёт воинский учёт и по [вторая компания]; от ответа зависит, для каких работодателей строим процессы и сколько комплектов ЛНА нужно.<\/li>\n<li><strong><a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>. Одной кадровой функции даны разные названия, назначения ролей не подтверждены.<\/strong> Почему: без таблицы функция → должность → заместитель ни один маршрут Decision Flow не запустить; таблицу заполняют HR и КДП без изменения штатного расписания.<\/li>\n<\/ol>\n<p>Дальше — работа КДП и юристов по её ответам: реестр и добор документов (<a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>, 06), подписанты и формы (07), устаревшие пересказы закона (14). Владельцам ИБ и охраны труда передаются стыки <a href=\"#/k/SKVOZ-09\">К-SKVOZ-09<\/a>, 10, 13 — без переписывания их документов силами HR. Каналы, сроки сообщения данных и редактура (<a href=\"#/k/SKVOZ-03\">К-SKVOZ-03<\/a>, 12, 15) — в ближайшие редакции.<\/p>", "karta": "", "voprosy": "<ol>\n<li>Есть ли реестр ЛНА и архив редакций с полными приказами введения (02, 10, 14, 16; 03, 06, 08, 11; 07, 13)? Варианты: есть общий / у каждого владельца свой / нет. (<a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>, 06)<\/li>\n<li>Как сводится ознакомление? Варианты: единый учёт / Диадок и бумажные листы по папкам / не сводится. Можно показать обезличенный пример полного комплекта? (<a href=\"#/k/SKVOZ-05\">К-SKVOZ-05<\/a>)<\/li>\n<li>Есть ли отдельный ЛНА о введении кадрового ЭДО: какие категории работников и документы, кто не дал согласия? Варианты: есть / есть только для дистанционных / нет. (<a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a>, <a href=\"#/k/DISC-01\">К-DISC-01<\/a>)<\/li>\n<li>Существуют ли сейчас функции исполнительного директора, руководителя кадровой службы, ответственного за комплаенс, администраторов OneTwoTrip и такси; кто их замещает? Нужна таблица функций, не имена. (<a href=\"#/k/SKVOZ-02\">К-SKVOZ-02<\/a>, 07)<\/li>\n<li>Mattermost заменил Slack везде, частично или работают оба? (<a href=\"#/k/SKVOZ-03\">К-SKVOZ-03<\/a>, <a href=\"#/k/DISC-04\">К-DISC-04<\/a>)<\/li>\n<li>Для каких работодателей строим процессы: только [компания] / [компания] и [вторая компания] / вся группа? Есть ли у других компаний свои ЛНА? (<a href=\"#/k/SKVOZ-08\">К-SKVOZ-08<\/a>)<\/li>\n<li>Есть ли выборный орган первичной профсоюзной организации, иной представитель работников или коллективный договор? Варианты: нет, подтверждено / есть, реквизиты у юристов / неизвестно. (<a href=\"#/k/SKVOZ-11\">К-SKVOZ-11<\/a>)<\/li>\n<li>Какой комплект о тайне выдают новичку: 04 / 05 / оба / отдельная форма — и кто из ИБ подтверждает его актуальность? (<a href=\"#/k/SKVOZ-09\">К-SKVOZ-09<\/a>)<\/li>\n<li>Как работник сообщает об изменении данных и где это регистрируется: отдельное обращение / письмо / личный кабинет / единого способа нет? (<a href=\"#/k/SKVOZ-12\">К-SKVOZ-12<\/a>)<\/li>\n<li>Приказ о приёме оформляют всегда и знакомят с ним в три дня? Кто следит за изменениями закона: юристы / КДП / никто системно? (<a href=\"#/k/SKVOZ-14\">К-SKVOZ-14<\/a>)<\/li>\n<\/ol>", "nehvatilo": "<p>Номера — для добора; их текст здесь не цитировался и по памяти не пересказывается.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Что добрать<\/th>\n<th style=\"text-align: left;\">Зачем<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">ТК ст. 20<\/td>\n<td style=\"text-align: left;\">Кто работодатель: какое юрлицо применяет свои ЛНА (<a href=\"#/k/SKVOZ-08\">К-SKVOZ-08<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ТК ст. 29–31<\/td>\n<td style=\"text-align: left;\">Кто представляет работников, если профсоюза нет (<a href=\"#/k/SKVOZ-11\">К-SKVOZ-11<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">ТК ст. 371<\/td>\n<td style=\"text-align: left;\">Общий порядок учёта мнения профсоюза при решениях работодателя (<a href=\"#/k/SKVOZ-11\">К-SKVOZ-11<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">377‑ФЗ от 22.11.2021, статья о вступлении в силу<\/td>\n<td style=\"text-align: left;\">С какой даты действует новая ТК 68 ч. 1 и был ли п. 2.6 ПВТР устаревшим уже при принятии (<a href=\"#/k/SKVOZ-14\">К-SKVOZ-14<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Федеральный закон об обществах с ограниченной ответственностью, ст. 40; ГК РФ о доверенности, ст. 185–189<\/td>\n<td style=\"text-align: left;\">Полномочия генерального директора и подписантов по доверенности (<a href=\"#/k/SKVOZ-07\">К-SKVOZ-07<\/a>, <a href=\"#/k/KOM-14\">К-KOM-14<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Акт о статусе ФСС как страховщика: переименован ли он или заменён другим фондом (в базе 53‑ФЗ уже называет Фонд пенсионного и социального страхования)<\/td>\n<td style=\"text-align: left;\">Правка адресатов извещений в 03 и 06 (<a href=\"#/k/SKVOZ-14\">К-SKVOZ-14<\/a>)<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Статус закона, названного в 05, п. 1.2 (действует ли), и 149‑ФЗ целиком (в базе только ст. 11)<\/td>\n<td style=\"text-align: left;\">Ссылка в 05 — вопрос владельцу 05 (<a href=\"#/k/SKVOZ-14\">К-SKVOZ-14<\/a>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "keysy": [{"id": "К-SKVOZ-01", "slug": "SKVOZ-01", "title": "Новая редакция не показывает, что стало с прежней и связанными правилами", "imp": "высокая", "docs": ["01", "02", "10", "12", "14", "16"], "meta": [["Документы", "02, пп. 1.2–1.3; 10, пп. 12.1–12.3; 12, приказ п. 2 и п. 13.8; шапки 01, 14, 16"], ["Тип", "пробел"], ["Кто решает", "руководитель HR; генеральный директор соответствующего работодателя; юристы до утверждения"], ["Важность", "высокая: сотрудник может найти формально актуальные, но несогласованные правила одного процесса"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>02, п. 1.2: «Настоящая Политика действует в соответствии с Трудовым кодексом Российской Федерации, иными актами трудового законодательства, Правилами внутреннего трудового распорядка ООО «[компания]», Положением об оплате труда, премировании и дополнительных социальных мероприятиях работников ООО «[компания]», иными локальными нормативными актами».<\/li>\n<li>10, п. 12.1: «Настоящее Положение вступает в силу с момента его утверждения и действует бессрочно».<\/li>\n<li>12, п. 13.8: «Правила вступают в силу с даты их утверждения и действуют до утверждения новой редакции».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 02 указана связь с 10 и 12, но из полученных копий нельзя восстановить, какие пункты старых актов менялись вместе с новой редакцией. В 12 сам приказ об отмене предыдущей редакции есть; у 02, 10, 14 и 16 получен в основном гриф, а не полный приказ. Это <strong>не доказательство<\/strong>, что прежние редакции юридически действуют одновременно: сначала надо добрать приказы. Но для опубликованной сотрудникам подборки цепочка версий сейчас не подтверждена.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22 ч. 2, ред. 25.05.2026: «соблюдать трудовое законодательство и иные нормативные правовые акты, содержащие нормы трудового права, локальные нормативные акты, условия коллективного договора, соглашений и трудовых договоров». Сам по себе формат реестра этой нормой не установлен: это предлагаемая организация работы, а не вывод о нарушении.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>13.9<\/strong>:<\/p>\n<blockquote>\n<p>13.9. Руководитель кадрового делопроизводства ведет реестр локальных нормативных актов Общества. По каждому акту указываются наименование, редакция, дата утверждения и вступления в силу, реквизиты утвердившего документа, область применения, ответственный за актуальность, отмененные и измененные документы и пункты, связанные акты, место хранения действующей редакции и документов об ознакомлении. Проект изменения локального нормативного акта передается на утверждение вместе с перечнем необходимых изменений в связанных актах. Реестр не изменяет содержание и юридическую силу локального нормативного акта.<\/p>\n<\/blockquote>\n<p>В шаблон приказа об изменении ЛНА добавить готовый пункт: <strong>Признать утратившими силу документы и пункты, перечисленные в приложении к настоящему приказу. Руководителю кадрового делопроизводства разместить новую редакцию и исключить отмененные редакции из раздела действующих документов, сохранив их в архиве.<\/strong> Приложение заполняется только после добора полного комплекта, не выдуманными номерами. У 02/10 одновременно правятся рабочие стыки VREM и PLAT, у 16/12/10 — OTP. Актам 01/04/05/09 HR не меняет содержание: владельцам передаётся перечень кадровых зависимостей. Документы СУОТ ведёт реестр 08 по <a href=\"#/k/OT-13\">К-OT-13<\/a>; общий реестр 13.9 ссылается на него, а не повторяет.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП собирает полные утверждающие документы, связывает их с полученными редакциями; неизвестное отмечает, а не признаёт отменённым.<\/li>\n<li>При правке пункта Decision Flow предлагает автору список затронутых актов из реестра; при неподтверждённой интеграции перечень заполняет КДП вручную.<\/li>\n<li>Владелец каждого связанного акта подтверждает правку или объясняет, почему она не нужна; юрист проверяет пакет, работодатель утверждает.<\/li>\n<li>КДП публикует действующую редакцию и запускает ознакомление; журнал сохраняет, на какой редакции принято решение.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли уже реестр, полные приказы и архив редакций? Если есть — дополняем их, не заводим второй учёт.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет данных о времени поиска редакций и числе повторных согласований.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по неполноте полученного комплекта; средняя по отсутствию такого учёта на практике — это вопрос, а не установленный факт.<\/p>"}, {"id": "К-SKVOZ-02", "slug": "SKVOZ-02", "title": "Одной кадровой функции даны разные названия, а непроверенные роли могут остановить маршрут", "imp": "высокая", "docs": ["02", "07", "08", "10", "12", "14", "15"], "meta": [["Документы", "02, пп. 2.5, 3.4, 3.7; 07, пп. 2.8–2.9, 2.20, 3.2; 08, п. 7.3.7; 10, пп. 4.2, 5.2, 7.2, 10.3; 12, приказ пп. 3–4; 14, п. 1.4; 15, приказ п. 3"], ["Тип", "пробел"], ["Кто решает", "руководитель HR; руководитель компании — только изменение полномочий; генеральный директор — назначения; юристы до утверждения"], ["Важность", "высокая: непонятно, кто сегодня обязан получить, оформить или согласовать документ"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>10, п. 7.2: «Представление после согласования с Генеральным директором или Финансовым директором необходимо передать Начальнику кадрового делопроизводства».<\/li>\n<li>10, п. 10.3: «Табели учета рабочего времени заполняют и подписывают Руководитель группы кадрового делопроизводства и Главный бухгалтер».<\/li>\n<li>07, п. 2.20: «Заключение о прохождении испытания поступают к лицу, осуществляющему руководство кадровой службой, не позднее чем за неделю до окончания испытания работника».<\/li>\n<li>10, п. 5.2: «Указанные надбавки могут устанавливаться в исключительных случаях Работникам по решению Исполнительного директора».<\/li>\n<li>02, п. 3.4: «Директору департамента информационной безопасности (согласование в части технической безопасности и стабильности работы системы)».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Даже внутри 10 используются начальник КДП и руководитель группы КДП. В 07 руководитель кадровой службы не отождествлён ни с HR, ни с КДП — это отдельно отмечала приёмка от 13.11; делать такое отождествление за компанию нельзя. Исполнительный директор, ответственный за комплаенс, администраторы сервисов и контролирующий такси специалист по закупкам названы в документах, но актуальные назначения не получены. Сведения, что какая-либо из этих <strong>ролей<\/strong> уже упразднена, не подтверждены: не путать уход конкретного человека с отсутствием функции.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22 ч. 2, ред. 25.05.2026: «предоставлять работникам работу, обусловленную трудовым договором». Норма не задаёт названия кадровых должностей. Самовольная передача полномочия из одного ЛНА другой роли из этой нормы не следует; назначения и объём функций проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>1.7<\/strong>:<\/p>\n<blockquote>\n<p>1.7. Для целей кадровых локальных нормативных актов используются единые функциональные наименования: руководитель HR — лицо, осуществляющее руководство кадровой функцией Общества; руководитель кадрового делопроизводства — лицо, осуществляющее организацию кадрового учета и контроль оформления кадровых документов; специалист кадрового делопроизводства — работник, которому поручено оформление соответствующего документа. Соответствие функциональных наименований должностям, объем полномочий и замещение отсутствующих работников устанавливаются организационно-распорядительными документами Общества. Функциональное наименование само по себе не наделяет полномочием утверждать или подписывать документы.<\/p>\n<\/blockquote>\n<p>После подтверждения КДП, что это одна функция, заменить в 10, п. 7.2, и 08, п. 7.3.7, <strong>Начальник кадрового делопроизводства<\/strong>, а в 10, п. 10.3, <strong>Руководитель группы кадрового делопроизводства<\/strong> на <strong>руководитель кадрового делопроизводства<\/strong>. Отраслевые обязанности 08 при этом не переносить на HR без согласования специалиста ОТ.<\/p>\n<p>По 07 выбор HR: <strong>А — руководитель кадрового делопроизводства получает планы и заключения и готовит документы; Б — руководитель HR получает/оценивает материалы, КДП оформляет<\/strong>. Рекомендация — А для оформления, с участием HR в адаптации; окончательные пп. 2.8, 2.9, 2.14, 2.18, 2.20, 3.2 меняет PRIEM после ответа, а не массовая автозамена. По исполнительному директору: подтвердить действующее назначение либо отдельно изменить полномочие в 10, пп. 4.2, 5.2; <strong>не подменять его автоматически генеральным директором<\/strong>. По 01/04/09 — владельцам направить таблицу соответствий, сам HR документы не переписывает. <a href=\"#/k/PLAT-22\">К-PLAT-22<\/a> предлагает такое же определение в 10, п. 1.5: принять одно (рекомендуем ПВТР 1.7, а в 10 дать ссылку на него), а не два параллельных.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>HR и КДП заполняют таблицу функция → должность → основание полномочия → заместитель → служебный канал без изменения штатного расписания.<\/li>\n<li>Назначенные владельцы ИБ, ОТ и сервисов подтверждают свои строки; незаполненная роль блокирует запуск маршрута, а не уходит случайному адресату.<\/li>\n<li>В Decision Flow задача адресуется функции соответствующего работодателя. При замене человека меняется назначение, а не текст каждого ЛНА; при изменении полномочия меняется сам ЛНА.<\/li>\n<li>Новую схему денежных согласований выбирают отдельно по список выборов руководителя компании, разделу о том, кто согласует траты и отступления (<code>g.soglasovaniya<\/code>); словарь ролей этого выбора не подменяет.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Существуют ли сейчас функции исполнительного директора, руководителя кадровой службы, ответственного за комплаенс и администраторов сервисов; кто их замещает? Это таблица назначений, не просьба сообщить персональные данные для этого отчёта.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа возвратов и времени ожидания не тому адресату.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по разнице терминов; средняя по риску незаполненных ролей, потому что назначения не присланы.<\/p>"}, {"id": "К-SKVOZ-03", "slug": "SKVOZ-03", "title": "Уведомления и статус отпуска остались в Slack, а HR описывает Mattermost", "imp": "средняя", "docs": ["12", "16"], "meta": [["Документы", "12, пп. 3.2.29–3.2.30, 5.9, 5.14; 16, п. 2.6"], ["Тип", "расходится с практикой"], ["Кто решает", "руководитель HR совместно с ИБ и ИТ; юристы до утверждения"], ["Важность", "средняя: поручение и сведения о замещении могут остаться не в том канале"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 5.9: «мессенджер Slack (далее – корпоративный мессенджер), система управления задачами и проектами Jira (далее – система управления), Confluence, платформа для организации аудио и видеоконференций Zoom (далее – платформа конференций)».<\/li>\n<li>16, п. 2.6: «а также продублировать данную информацию как статус в корпоративном мессенджере Slack» (номер и текст сверены с ).<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Ответы HR 10.11, пп. 1.1 и 3.5, называют Маттермост/ММ для доступов, welcome-письма, публикаций и уведомлений о новых ЛНА. В полученных ЛНА Mattermost не назван. При этом нельзя утверждать, что Slack отключён, а Zoom и YouTrack больше не используются: подтверждения нет. Нужно закрепить действующий канал и не путать рабочее сообщение с подписью ознакомления.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 312.3 ч. 2, ред. 25.05.2026: «позволяющей обеспечить фиксацию факта получения работником и (или) работодателем документов в электронном виде». Цитата относится к иной форме взаимодействия, предусмотренной перечисленными в статье документами; сам выбор названия мессенджера не превращает любое сообщение в юридически достаточное подтверждение.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Если ИБ/ИТ подтвердят Mattermost как общий корпоративный мессенджер, заменить в 12, пп. 3.2.29, 3.2.30, 5.9 и обоих упоминаниях 5.14, <strong>Slack<\/strong> на <strong>Mattermost<\/strong>; в 16, п. 2.6, последнюю часть изложить:<\/p>\n<blockquote>\n<p>…а также продублировать информацию о периоде отсутствия и замещении как статус в корпоративном мессенджере Mattermost. Размещение статуса не заменяет оформления отпуска и ознакомления с кадровыми документами в установленном порядке.<\/p>\n<\/blockquote>\n<p>В 12, п. 5.9, добавить:<\/p>\n<blockquote>\n<p>Использование рабочего канала связи не заменяет подписания документов и подтверждения их получения, если иной порядок не установлен трудовым законодательством и принятыми в соответствии с ним актами Общества.<\/p>\n<\/blockquote>\n<p>Предпочтительный вариант — <a href=\"#/k/DISC-04\">К-DISC-04<\/a>: в ЛНА ссылка на утверждённый перечень каналов вместо названия сервиса, тогда смена мессенджера не требует новой редакции ЛНА; прямая замена Slack на Mattermost — только если перечень не вводят. Если каналы различаются по подразделениям, вместо механической замены HR готовит перечень каналов по категориям и согласует его с ИБ; <strong>до ответа эта редакция условная<\/strong>. Zoom, Jira и YouTrack без подтверждения не удалять.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>ИТ и ИБ подтверждают действующие системы и допустимые сведения для каждого канала; HR сверяет доступность сотрудникам.<\/li>\n<li>КДП меняет связанные пункты одним пакетом и знакомит с изменением.<\/li>\n<li>Процесс отправляет напоминание/показывает заменяющего в утверждённом канале; подписываемый документ остаётся в законном ЭДО или на бумаге.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Mattermost заменил Slack везде или только в части команд? Что сейчас используют для конференций и заданий на испытание?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет числа потерянных уведомлений.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по разнице ЛНА и ответов HR; средняя по охвату замены систем.<\/p>"}, {"id": "К-SKVOZ-04", "slug": "SKVOZ-04", "title": "ПВТР описывает ЭДО как режим для дистанционных, а на деле Диадок используют почти для всех кадровых документов", "imp": "высокая", "docs": ["02", "10", "12", "14"], "meta": [["Документы", "12, пп. 1.3, 2.5–2.6, 5.5–5.7; 02, пп. 1.4, 3.5–3.7; 14, пп. 1.4, 2.2.1, 2.3; 10, п. 10.11"], ["Тип", "расходится с практикой"], ["Кто решает", "работодатель; руководитель HR и КДП готовят; профсоюзный орган — если есть и требуется; юристы до утверждения"], ["Важность", "высокая: маршрут и доказательство получения документа зависят от статуса работника и подписи"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 1.3: «Электронный документооборот, предусмотренный настоящими Правилами трудового распорядка осуществляется в соответствии со статьями 312.2 и 312.3 Трудового кодекса Российской Федерации».<\/li>\n<li>12, п. 5.5: «Ознакомление дистанционных/частично дистанционных работников с непосредственно связанными … с трудовой деятельностью приказами, локальными нормативными актами, инструкциями, положениями Общества, изменениями в них и новыми редакциями осуществляется путем рассылки информации по официальным служебным адресам электронной почты работников Общества либо путем подписания документа на бумаге либо в формате ЭДО путем проставления УКЭП работника».<\/li>\n<li>02, п. 3.7: «…направляет его Работнику на ознакомление в систему ЭДО (при наличии у работника электронной подписи и при условии, что работник является дистанционным), либо приглашает для подписания в офис».<\/li>\n<li>14, п. 2.2.1: «…направляет его Работнику на ознакомление в систему ЭДО (при наличии у работника электронной подписи), либо приглашает для подписания в офис».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> На встрече 11.11 руководитель КДП сказала, что почти все кадровые документы подписываются в Диадоке, а КДП скачивает подписанные образы в папку сотрудника; исключения не выяснены. ПВТР и 02 привязывают ЭДО к дистанционному статусу, тогда как 14 уже не делает это ограничение, а 10 допускает Диадок для справок. Нужно сначала установить: кто работодатель ЭДО, какие документы и какие категории работников охвачены, какая подпись используется. Нельзя задним числом объявлять нынешнюю практику нарушением без проверки введения ЭДО и согласий.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.1 ч. 1, ред. 25.05.2026: «Под электронным документооборотом в сфере трудовых отношений ... понимается создание, подписание, использование и хранение работодателем, работником или лицом, поступающим на работу, документов, связанных с работой, оформленных в электронном виде без дублирования на бумажном носителе». ТК ст. 22.2 ч. 2: «Электронный документооборот вводится работодателем на основании локального нормативного акта, который принимается им с учетом мнения выборного органа первичной профсоюзной организации … и который содержит: … сведения об информационной системе ... перечень электронных документов и перечень категорий работников ... срок уведомления работников ...». Текста отдельного общего ЛНА о введении ЭДО в 16 документах не обнаружено; проверить юристам.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Добавить в ПВТР пункт <strong>5.16<\/strong>. Согласовать его с единым проектом ЭДО из <a href=\"#/k/DISC-01\">К-DISC-01<\/a>–03: это одна правка, не параллельные порядки. В 12, пп. 1.3, 5.5–5.7, убрать только необоснованное ограничение общего ЭДО дистанционным статусом и дать ссылку на общий порядок; специальные правила для дистанционных, сроки и подтверждение получения не отменять целиком. В 02, п. 3.7, заменить соответствующее условие:<\/p>\n<blockquote>\n<p>5.16. Электронный документооборот в сфере трудовых отношений осуществляется на основании отдельного локального нормативного акта Общества о введении и порядке ЭДО. В этом акте указываются информационная система работодателя, порядок доступа, перечни электронных документов и категорий работников, сроки уведомления и правила подтверждения получения. Для работников, не включенных в ЭДО или отказавшихся от него в предусмотренном порядке, кадровые документы предоставляются на бумажном носителе. Кадровая служба ведет реестр факта отправки, получения, подписания или отказа и хранит электронные документы и сведения о подписи в установленный срок. Исключения из общего кадрового ЭДО, установленные частью третьей статьи 22.1 Трудового кодекса Российской Федерации, соблюдаются отдельно; настоящий пункт не вводит электронное оформление исключенных документов. Для дистанционных работников сохраняется специальный порядок взаимодействия в случаях и пределах, установленных статьями 312.2–312.3 Трудового кодекса Российской Федерации; общий порядок не подменяет эти правила. Использование электронной почты, мессенджера или размещение файла в системе документации без предусмотренного актом ЭДО подтверждения не заменяет подписание или ознакомление.<\/p>\n<\/blockquote>\n<p>В 02, п. 3.7, вместо условия «если ... дистанционным» поставить: <strong>«в порядке ЭДО, установленном локальным нормативным актом Общества, либо на бумажном носителе»<\/strong>. В 14, пп. 2.2.1 и 2.3, привести к той же формуле. Пункты о видах подписей и перечнях документов держать в одном ЛНА об ЭДО, а не размножать по 12, 02 и 14.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Работодатель принимает/проверяет ЛНА об ЭДО и основания его введения; КДП получает список охваченных лиц и документов.<\/li>\n<li>При событии КДП выбирает маршрут из реестра: ЭДО или бумага, не по памяти о дистанционности.<\/li>\n<li>Диадок фиксирует отправку, получение и подпись; КДП, как и сейчас, хранит полный комплект файлов с подписью (по встрече 11.11 — 7–8 файлов), а не один PDF-образ, и по правилам архива.<\/li>\n<li>Отказ/ошибка подписи запускает бумажный маршрут и журнал исключения.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельный ЛНА о введении ЭДО, кто его подписал, какие категории работников и документы включены, кто не дал согласия, и где хранится реестр подписей?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; число кадровых документов и доля ручной проверки из выгрузки Диадока не получены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по расхождению формулировок и описанной практике; средняя по юридическому статусу текущего ЭДО без отдельного акта.<\/p>"}, {"id": "К-SKVOZ-05", "slug": "SKVOZ-05", "title": "Подпись пакета ЛНА не показывает, кто ознакомлен с нужной редакцией", "imp": "высокая", "docs": ["03", "04", "09", "10", "12", "15"], "meta": [["Документы", "12, приказ п. 3, стр. 2, пп. 2.10, 5.5, 13.5–13.6; 15, приказ п. 2, стр. 2; 10, п. 12.3; 03, п. 3.8; 04, п. 5.1.1; 09, п. 1.4"], ["Тип", "пробел"], ["Кто решает", "руководитель КДП и HR; юристы проверяют способ подтверждения; работодатель утверждает"], ["Важность", "высокая: нельзя быстро подтвердить, какой работник получил какую редакцию и когда"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>12, п. 2.10: «При приеме на работу (до подписания трудового договора) Работодатель знакомит лицо, поступающее на работу, под подпись с настоящими Правилами внутреннего трудового распорядка, иными локальными нормативными актами, инструкциями и положениями, непосредственно связанными с трудовой деятельностью работника».<\/li>\n<li>12, стр. 2: «С приказом № 29/2022 от 03.11.2022 г. ознакомлены:».<\/li>\n<li>15, стр. 2: «С приказом № 23-Т/2022 от 01.08.2022г. ознакомлены:».<\/li>\n<li>10, п. 12.3: «Любые изменения вносятся в настоящее Положение на основании Приказа руководителя Организации и должны быть доведены до сведения всех Работников».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Листы в полученных копиях 12 и 15 пусты; отметки об ожидании ответной подписи в пакетах 02/03/06/08/11/12 не являются реестром ознакомления работников. Это <strong>не доказывает<\/strong>, что работники не ознакомлены: HR 10.11, раздел 3.5, описывает Диадок и отдельный бумажный лист для офисных, КДП 11.11 — папки с комплектом файлов подписи. Нужна связь работник → применимые ЛНА → редакция → дата → доказательство; подпись генерального директора под пакетом 10 или 14 эту связь не заменяет. Момент ознакомления при найме уже разобран в <a href=\"#/k/PRIEM-07\">К-PRIEM-07<\/a>, форма/первичное ознакомление по 03 — в <a href=\"#/k/OT-03\">К-OT-03<\/a>, ознакомление с самими ПВТР и их пп. 13.5–13.6 — в <a href=\"#/k/DISC-17\">К-DISC-17<\/a> (он ссылается на общий учёт 13.10 отсюда): здесь только общий контроль полноты по всем ЛНА, не повтор их порядка.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22 ч. 2, ред. 25.05.2026: «знакомить работников под роспись с принимаемыми локальными нормативными актами, непосредственно связанными с их трудовой деятельностью». ТК ст. 68 ч. 3, та же редакция: «При приеме на работу (до подписания трудового договора) работодатель обязан ознакомить работника под роспись с правилами внутреннего трудового распорядка, иными локальными нормативными актами, непосредственно связанными с трудовой деятельностью работника, коллективным договором». Исключения из общего ЭДО — ТК 22.1 ч. 3, порядок — <a href=\"#/k/DISC-01\">К-DISC-01<\/a>–03 и <a href=\"#/k/SKVOZ-04\">К-SKVOZ-04<\/a>; доказанного нарушения и штрафа по пустой копии не устанавливаем.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить ПВТР пунктом <strong>13.10<\/strong> (продолжение предлагаемого 13.9 из <a href=\"#/k/SKVOZ-01\">К-SKVOZ-01<\/a>):<\/p>\n<blockquote>\n<p>13.10. Руководитель кадрового делопроизводства обеспечивает учет ознакомления работников с локальными нормативными актами, непосредственно связанными с их трудовой деятельностью. Запись об ознакомлении позволяет установить работодателя, работника, наименование и редакцию акта, дату и способ ознакомления и место хранения подтверждающих документов. При приеме ознакомление проводится до подписания трудового договора. При изменении акта круг работников и срок ознакомления определяет руководитель кадрового делопроизводства совместно с владельцем акта с учетом содержания изменения и требований законодательства. Размещение акта в системе документации, рассылка сообщения о нем и подпись лица, утвердившего акт, сами по себе не заменяют подтверждения ознакомления работника. При отсутствии подтверждения КДП выясняет причину и организует надлежащее ознакомление без оформления прошедшей даты.<\/p>\n<\/blockquote>\n<p>В 10, п. 12.3, после действующего текста добавить: <strong>Ознакомление и его учет осуществляются в порядке пункта 13.10 Правил внутреннего трудового распорядка и применимого порядка электронного документооборота.<\/strong> В 15 при новой редакции приказа указать хранение индивидуальных подтверждений; прежний приказ задним числом не менять. Для 01/04/05/09 владельцы подтверждают перечень кадровых ознакомлений, HR их содержание не переписывает. Инструктаж, акт о несчастном случае и прочие исключения не переводить этим пунктом в общий кадровый ЭДО.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП сопоставляет применимость акта и перечень работников соответствующего работодателя; индивидуальный список остается в защищенном кадровом контуре, не в этом отчет
