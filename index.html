ьному маршруту не замеряли; 10–15% времени руководителя КДП на <code>отпуска, НРД, за свой счёт и т.д.<\/code> — ответ HR 10.11, но причинность не доказана. Рубли не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по различию правил в ЛНА; средняя по фактическому смешению маршрутов.<\/p>"}, {"id": "К-OTP-11", "slug": "OTP-11", "title": "Пункт «менее 1 года» в правиле замещения меняет смысл запрета", "imp": "высокая", "docs": ["10", "12", "16"], "meta": [["Документы", "16, п. 2.4; 12, п. 4.19; 10, пп. 4.4, 4.10"], ["Тип", "ошибка в тексте; пробел оформления дополнительной работы"], ["Кто решает", "руководитель HR; юристы — формулировка и согласие на допработу"], ["Важность", "высокая: кадровое правило буквально запрещает не то, что, вероятно, хотели запретить"]], "html": "<p><strong>Было.<\/strong> 16, п. 2.4: «Не допускаются одновременные отпуска руководителя подразделения и руководителя проекта в случае, если на время отпуска руководителя проекта нет возможности назначить исполняющего обязанности со стажем работы в должности руководителя проекта менее 1 года». Скан страницы 2 просмотрен: в оригинале именно «менее 1 года». 12, п. 4.19: «Не позже чем за 2 дня до начала отпуска работник должен передать дела заменяющему его другому работнику Общества». 10, п. 4.4: «За выполнение обязанностей временно отсутствующего Работника и совмещение устанавливается доплата в размере до 50 процентов оклада по основной работе»; п. 4.10 требует «при добровольном согласии Работника» и приказа.<\/p>\n<p><strong>Что не так.<\/strong> Буквальное «менее» запрещает одновременный отпуск, если нет замещающего со стажем меньше года, то есть может пропускать риск с неопытным замещающим. Карта положений и приёмка правильно пометили это как вероятную опечатку, но заменять слово без подтверждения нельзя. Передача дел сама по себе не оформляет поручение дополнительной работы и доплату.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 60.2 ч. 1: «С письменного согласия работника ему может быть поручено выполнение ... дополнительной работы ... за дополнительную оплату (статья 151 настоящего Кодекса)». Ч. 3: «Срок, в течение которого работник будет выполнять дополнительную работу, ее содержание и объем устанавливаются работодателем с письменного согласия работника». ТК ст. 151: «При ... исполнении обязанностей временно отсутствующего работника ... работнику производится доплата». ТК ст. 189 ч. 3: «Трудовой распорядок определяется правилами внутреннего трудового распорядка».<\/p>\n<p><strong>Стало (предлагается).<\/strong> До исправления спросить владельца процесса и юристов. При подтверждении смысла заменить в 16, п. 2.4:<\/p>\n<blockquote>\n<p>Не допускаются одновременные отпуска руководителя подразделения и руководителя проекта, если на период отпуска руководителя проекта невозможно назначить исполняющего обязанности со стажем работы в должности руководителя проекта не менее 1 года. При назначении исполняющего обязанности КДП проверяет полномочия, период, содержание и объём дополнительной работы, получает письменное согласие и оформляет доплату и приказ, если выполнение обязанностей осуществляется без освобождения от основной работы.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.19 заменить связку «солидарная ответственность» на обязанность передать перечень дел и ссылку на закон; в 10, пп. 4.4, 4.10 увязать назначение с <a href=\"#/k/OTP-11\">К-OTP-11<\/a>, но не вводить новую доплату без решения. Если руководитель HR подтвердит, что нужен опыт <strong>не менее<\/strong> года, изменить текст 16 и формы/процесс, где он цитируется. Если нет — оставить оригинал и описать буквальное действие.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. При графике КДП отмечает роли с обязательным замещением. 2. Руководитель предлагает заместителя. 3. КДП проверяет стаж и полномочия; работодатель отдельно оформляет дополнительную работу. 4. Работник передаёт задачи по перечню, заместитель подтверждает получение. 5. После отпуска задача закрывается и доплата прекращается по сроку приказа.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какой смысл подтверждает владелец документа — «менее» или «не менее»? Кто сейчас назначает исполняющего обязанности, как фиксируют срок и содержание работы и кому платят доплату?<\/p>\n<p><strong>Цена вопроса.<\/strong> По ответам HR от 10.11 (раздел 1.1) отпуска занимают 10–15% времени руководителя КДП, но доля замещений не выделена. Сумму доплат не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по дословному тексту скана и нормам о допработе; низкая по намерению автора слова «менее».<\/p>"}, {"id": "К-OTP-12", "slug": "OTP-12", "title": "Передача дел автоматически создаёт солидарную ответственность без отдельного основания", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "12, пп. 4.19, 10.4; 16, пп. 2.1–2.3; ТК 238, 241, 245"], ["Тип", "противоречие между документами; возможное ухудшение — юристам"], ["Кто решает", "юристы; руководитель HR — порядок передачи"], ["Важность", "высокая: передача задач не должна автоматически создавать ответственность за чужие действия"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.19: «С этого момента оба работника несут солидарную ответственность по обязанностям ... уходящего в отпуск работника, включая финансовую ответственность». 12, п. 10.4: «Работник и Работодатель возмещают друг другу только прямой действительный ущерб». 16, п. 2.1: «На время отпуска сотрудника назначается замещающий его сотрудник», а п. 2.3: «Уходящий в отпуск сотрудник передает текущие задачи (дела) исполняющему обязанности». Карта положений отмечает расхождение автоматической солидарной формулы с общим правилом в 12, п. 10.4.<\/p>\n<p><strong>Что не так.<\/strong> В 12 ответственность возникает автоматически «с этого момента», без акта передачи, вины, размера ущерба, полномочий и согласия на дополнительную работу. Передача текущих задач не равна передаче материальной ответственности. Утверждать нарушение закона без юридической сверки нельзя; формулировка создаёт спор и конфликтует с другими правилами, поэтому её лучше убрать.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 238: «Работник обязан возместить работодателю причиненный ему прямой действительный ущерб». ТК ст. 241: «За причиненный ущерб работник несет материальную ответственность в пределах своего среднего месячного заработка, если иное не предусмотрено настоящим Кодексом или иными федеральными законами». ТК ст. 245: «Письменный договор о коллективной (бригадной) материальной ответственности за причинение ущерба заключается между работодателем и всеми членами коллектива (бригады)».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.19 заменить:<\/p>\n<blockquote>\n<p>4.19. Не позже чем за 2 дня до начала отпуска работник передаёт замещающему работнику текущие задачи и материалы по перечню, согласованному с непосредственным руководителем. Замещающий подтверждает получение перечня. Передача задач не изменяет правила материальной ответственности и не создаёт солидарной ответственности автоматически. Дополнительная работа оформляется по письменному согласию работника, приказу и оплате в соответствии с Трудовым кодексом Российской Федерации и Положением об оплате труда.<\/p>\n<\/blockquote>\n<p>В 16, пп. 2.1–2.3 добавить владельца списка дел и подтверждение; в 10, пп. 4.4, 4.10 оставить маршрут доплаты. Удалить слова «солидарная» и «финансовая» из 12, а не переносить их в новую политику. Отдельно проверить уже заключённые договоры о полной/коллективной ответственности — их в корпусе OTP нет.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель назначает заменяющего. 2. Уходящий формирует перечень задач, сроков и доступов. 3. Замещающий и руководитель подтверждают получение. 4. Если есть дополнительная работа, КДП оформляет согласие, приказ и доплату. 5. Ущерб разбирается по общему законному порядку, а не списывается по реестру отпусков.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли отдельные договоры материальной ответственности у замещающих? Какой перечень дел подписывают сейчас? Были ли удержания/споры из-за замещения?<\/p>\n<p><strong>Цена вопроса.<\/strong> Денежный ущерб и число замещений не открыты; не считали. 10–15% времени КДП относится к широкому блоку отпусков, НРД и дней за свой счёт, не к этому кейсу отдельно.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по конфликту формулировок и необходимости убрать автоматическую солидарность; юридическая оценка допустимости отдельных договоров — средняя.<\/p>"}, {"id": "К-OTP-13", "slug": "OTP-13", "title": "Замещение руководителей не связано с уведомлением команды и контрагента", "imp": "средняя", "docs": ["10", "12", "16"], "meta": [["Документы", "16, пп. 2.1–2.6; 12, п. 4.19; 10, п. 4.4"], ["Тип", "пробел исполнителя и срока"], ["Кто решает", "руководитель HR; руководитель подразделения; КДП — форма контроля"], ["Важность", "средняя: без одного владельца контрагент и команда могут получить разные сведения"]], "html": "<p><strong>Было.<\/strong> 16, п. 2.2: «о чем по служебной электронной почте информируют как команду внутри компании, так и контрагента не менее, чем за 1 полный рабочий день до начала отпуска». 16, п. 2.1 называет ответственными «сотрудник, уходящий в отпуск, руководитель проекта, непосредственный руководитель сотрудника». 16, п. 2.6: сотрудник обязан поставить автоответ с «ФИО и контактных данных» замещающего и продублировать это «как статус в корпоративном мессенджере Slack». Встреча HR 10.11 говорит о письме за 2–3 недели руководителю и сотруднику, но не подтверждает контроль статуса в Slack и уведомления контрагента.<\/p>\n<p><strong>Что не так.<\/strong> Правило срока есть, но нет единого владельца, шаблона, доказательства отправки и исключения, когда контрагенту нельзя раскрывать внутренние данные. Круг получателей и рабочие сведения замещающего следует определить по функциям; наличие ФИО в рабочем сообщении само по себе не объявляется нарушением. В ПВТР передача дел за два дня, а уведомление контрагента за один рабочий день: порядок шагов не связан.<\/p>\n<p><strong>Закон.<\/strong> Специальной нормы о сроке такого корпоративного уведомления в использованных базах не найдено; это внутренний процесс. При этом ТК ст. 86, требует, чтобы «при определении объема и содержания обрабатываемых персональных данных работника работодатель должен руководствоваться ... федеральными законами», а обработка должна иметь трудовую цель. Статьи 5 закона 152‑ФЗ о принципах обработки в доступной базе нет; оценку конкретного раскрытия оставить юристам. Регламенты ИБ и персональных данных компании в рамках OTP не переписываются.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 16, пп. 2.1–2.2 и 2.6 заменить:<\/p>\n<blockquote>\n<p>2.1. Руководитель подразделения до начала отпуска назначает замещающего и определяет перечень задач и период замещения. КДП фиксирует назначение в кадровом процессе. Передача дел оформляется не позднее чем за 2 дня до начала отпуска.<\/p>\n<p>2.2. Руководитель подразделения не позднее чем за 1 полный рабочий день до начала отпуска направляет команде и, при необходимости по рабочей функции, контрагенту сообщение о периоде отсутствия и рабочем канале замещения. Сообщение содержит только необходимые сведения; персональные данные замещающего передаются только в необходимом объёме и в разрешённом канале.<\/p>\n<p>2.6. Работник устанавливает автоответ с периодом отсутствия и разрешёнными рабочими сведениями замещающего либо каналом его роли; личные контакты без необходимости не раскрываются. Статус в корпоративном мессенджере дублируется только если этот канал действует и включён в утверждённый порядок коммуникации.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.19 добавить ссылку на 16, 2.1; в процессе сделать чек-лист: назначение, перечень дел, внутреннее уведомление, внешнее уведомление при необходимости, автоответ. Сохранить Slack в цитате «было», но не предлагать Mattermost как факт действующего канала до подтверждения.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Руководитель назначает замещение при утверждении заявки. 2. КДП ставит контроль передачи дел за два дня. 3. Руководитель отправляет внутреннее сообщение за один рабочий день. 4. Внешний адресат получает только нужное сообщение. 5. Работник ставит автоответ, КДП закрывает чек-лист.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Действует ли Slack или фактический канал — Mattermost? Кто имеет право писать контрагентам? Какие данные замещающего разрешено передавать? Где хранится доказательство отправки?<\/p>\n<p><strong>Цена вопроса.<\/strong> Сумма и часы по уведомлениям не считали. Процент 10–15% относится ко всему блоку отпусков, НРД и дней за свой счёт, не к этому подпроцессу.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по пробелу владельца и чек-листа; средняя по фактическим каналам и требованиям к раскрытию.<\/p>"}, {"id": "К-OTP-14", "slug": "OTP-14", "title": "Страна отпуска обязательна по ссылке на указ 2020 года, которого нет в правовой базе", "imp": "средняя", "docs": ["12", "16"], "meta": [["Документы", "16, п. 1.1; 12, п. 3.2.13"], ["Тип", "устаревшее событийное основание, статус требует проверки"], ["Кто решает", "юристы — действие указа и основание; руководитель HR — отмена поля после проверки"], ["Важность", "средняя: обязательное поле и широкая рассылка сохраняются без проверенного основания"]], "html": "<p><strong>Было.<\/strong> 16, п. 1.1: «указывает страну в которой планируется провести отпуск в эти даты (указание страны обязательно на время действия режима повышенной готовности согласно Указа мэра Москвы от 5 марта 2020г.)». Скан стр. 1 проверен. 12, п. 3.2.13 отдельно требует «в случае выезда Работника зарубеж в период выполнения им трудовой функции дистанционно/частично дистанционно» предварительно согласовать с руководителем и ИБ изменение местонахождения рабочего места.<\/p>\n<p><strong>Что не так.<\/strong> В первом случае речь об отдыхе, во втором — о выполнении работы. Отмена поля страны в заявке об отпуске не отменяет отдельное правило о рабочем месте за рубежом. Текста указа и сведений о текущем режиме в разрешённых базах нет: объявлять указ отменённым или сбор незаконным нельзя. Из наличия старой ссылки следует задача юридической проверки, а не доказанное нарушение.<\/p>\n<p><strong>Закон.<\/strong> Указ мэра Москвы от 05.03.2020 и акты о его изменении/режиме — <strong>нормы в базе нет, проверить юристам<\/strong>. ТК ст. 86 п. 2: «при определении объема и содержания обрабатываемых персональных данных работника работодатель должен руководствоваться Конституцией Российской Федерации, настоящим Кодексом и иными федеральными законами».<\/p>\n<p><strong>Стало (предлагается).<\/strong> После подтверждения юристами отсутствия действующего основания удалить из 16, 1.1 фразу о стране и указе; на её место добавить 1.1.3:<\/p>\n<blockquote>\n<p>1.1.3. Сведения о стране проведения ежегодного отпуска не являются обязательным реквизитом заявки на отпуск. При необходимости выполнения работы за рубежом применяется отдельный порядок согласования рабочего места по п. 3.2.13 Правил внутреннего трудового распорядка. Планирование работы в период отпуска не допускается вместо предусмотренного законом оформления переноса или отзыва.<\/p>\n<\/blockquote>\n<p>Если основание действует — вместо удаления юристы готовят точную ссылку, срок действия требования, состав сведений и получателей. Правила ИБ не переписывать; в формах 16, прил. 1–2 поля страны сейчас нет, создавать его на основании старой ссылки не предлагать.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Юрист проверяет первичный акт и актуальный режим. 2. HR согласует исключение обязательного поля или ограниченный срок его действия. 3. КДП меняет форму и маршрут. 4. Запрос о работе за рубежом идёт отдельно руководителю и ИБ, не в отпускную рассылку.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Запрашивают ли страну сейчас и кто использует ответ? Есть ли отдельное действующее основание помимо упомянутого указа?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали; число писем и полей не замерялось.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту и разделению отдыха/работы; низкая по статусу указа без первоисточника.<\/p>"}, {"id": "К-OTP-15", "slug": "OTP-15", "title": "Компенсация при увольнении записана правильно, но не назначен контроль сверки всех рабочих лет", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "12, пп. 4.21, 2.16.4–2.16.5; 10, п. 10.13"], ["Тип", "пробел контрольного шага"], ["Кто решает", "руководители КДП и бухгалтерии; юристы — спорные периоды и отпуск с увольнением"], ["Важность", "высокая: при текущей оптимизации расходы на компенсации возникают сразу, а ошибка затрагивает окончательный расчёт"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.21: «При увольнении работник получает компенсацию за все неиспользованные дни отпуска». 12, п. 2.16.4: «днем увольнения считается последний день отпуска». 10, п. 10.13: «окончательный расчет по причитающейся Работнику заработной плате производится в последний день работы». По ответам HR 10.11 увольнения занимают 30% времени руководителя КДП из-за оптимизации. Данные по фактическим выплатам в архиве не открыты.<\/p>\n<p><strong>Что не так.<\/strong> Право на компенсацию уже есть: говорить, что компания его не установила или не выплачивает, нельзя. Но слова про расчёт только заработной платы уже, чем все суммы по закону; передача дел и обходной лист не должны задерживать бесспорную выплату. Нужна контрольная сверка КДП и бухгалтерии по всем рабочим годам, включая дополнительные дни. Для отпуска с последующим увольнением нужна отдельная юридическая схема дат, а не механическое применение последнего дня фактической работы.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 127 ч. 1–2: «При увольнении работнику выплачивается денежная компенсация за все неиспользованные отпуска»; «По письменному заявлению работника неиспользованные отпуска могут быть предоставлены ему с последующим увольнением (за исключением случаев увольнения за виновные действия). При этом днем увольнения считается последний день отпуска». ТК ст. 140 ч. 1–2: «При прекращении трудового договора выплата всех сумм, причитающихся работнику от работодателя, производится в день увольнения работника»; «В случае спора ... работодатель обязан ... выплатить не оспариваемую им сумму». Исключение для не работавшего в день увольнения в статье сохранено.<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 10 заменить 10.13:<\/p>\n<blockquote>\n<p>10.13. При прекращении трудового договора работодатель производит расчёт по всем причитающимся работнику суммам в сроки статьи 140 Трудового кодекса Российской Федерации, включая компенсацию за все неиспользованные отпуска по статье 127. Если работник в день увольнения не работал, соответствующие суммы выплачиваются не позднее следующего дня после предъявления требования о расчёте. При споре в установленный срок выплачивается неоспариваемая сумма. Возврат имущества и оформление обходного листа не являются дополнительными условиями выплаты.<\/p>\n<p>10.13.1. КДП передаёт бухгалтерии подтверждённый остаток основного и дополнительных отпусков по каждому рабочему году, основания корректировок и сведения об использованных днях. Бухгалтерия рассчитывает выплату, КДП сверяет количество компенсируемых дней; выявленные расхождения незамедлительно передаются руководителям КДП и бухгалтерии. Подтверждение расчёта и выплаты хранится вместе с кадровым основанием.<\/p>\n<\/blockquote>\n<p>В 12, 4.21 при переработке <a href=\"#/k/OTP-05\">К-OTP-05<\/a> сохранить компенсационное правило отдельным 4.21.5; 2.16.4 оставить верным, дополнив ссылкой на отдельную проверку дат при отпуске с увольнением. Основной процесс увольнения и обходной лист — группа PRIEM; сроки выплаты — согласовать с PLAT, не создавать разные редакции 10.13.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Подтверждённое событие увольнения создаёт контрольную карточку КДП. 2. КДП сверяет остаток по рабочим годам, виды и дополнительные дни. 3. Бухгалтерия считает средний заработок по действующим правилам, не по условной средней зарплате. 4. КДП и бухгалтерия подтверждают дни и сумму; спорная часть эскалируется, бесспорная выплачивается в срок. 5. В журнал попадают дата выплаты и основание без данных людей в отчёте.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Кто уже выполняет такую сверку и были ли корректировки компенсаций? Какой документ подтверждает остаток и как обрабатывают отпуск с увольнением?<\/p>\n<p><strong>Цена вопроса.<\/strong> По выгрузке КДП о компенсациях при увольнении за сентябрь–ноябрь (сводка программой, без ФИО): за 07.09–13.11.2026 при увольнении 15 человек выплачено 2 647 748,79 руб. за 286,66 неиспользованного дня; средняя выплата 176 516,59 руб.; по месяцам: сентябрь — 5 человек и 1 718 279,73 руб., октябрь — 7 и 459 777,93 руб., ноябрь (до 13-го) — 3 и 469 691,13 руб. Это деньги, которые уходят разово в день увольнения, пока остатки не погашаются отдыхом. 30% — оценка времени HR, не доля этих затрат.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по наличию права и необходимости сверки; средняя по тому, какого контрольного шага не хватает в фактической работе.<\/p>"}, {"id": "К-OTP-16", "slug": "OTP-16", "title": "ПВТР не обновлены после нормы о 30 днях отпуска инвалидам", "imp": "высокая", "docs": ["12"], "meta": [["Документы", "12, п. 4.12; ТК 115 в ред. 08.08.2024"], ["Тип", "устарело после изменения закона"], ["Кто решает", "руководитель HR; юристы — проверка категорий и форм"], ["Важность", "высокая: в ПВТР нет отдельного минимального права защищённой категории"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.12: «Ежегодный основной оплачиваемый отпуск предоставляется работникам продолжительностью 28 календарных дней». ПВТР введены приказом от 03.11.2022; редакция ТК с новым правилом вступила позже.<\/p>\n<p><strong>Что не так.<\/strong> Текст ПВТР не отражает минимальную продолжительность для работающих инвалидов. Это не доказывает, что 30 дней им не предоставляют: закон действует непосредственно, а реестр работников и расчёт не проверены. Но без правила в ЛНА процесс 1С и проверка графика могут считать 28 по умолчанию.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 115 ч. 1 и 3: «Ежегодный основной оплачиваемый отпуск предоставляется работникам продолжительностью 28 календарных дней»; «Ежегодный основной оплачиваемый отпуск предоставляется работающим инвалидам продолжительностью не менее 30 календарных дней». В базе указано: «часть введена Федеральным законом от 08.08.2024 N 268‑ФЗ».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.12 заменить:<\/p>\n<blockquote>\n<p>4.12. Ежегодный основной оплачиваемый отпуск предоставляется работникам продолжительностью 28 календарных дней, а работающим инвалидам — продолжительностью не менее 30 календарных дней. Удлинённые и дополнительные отпуска предоставляются также в случаях, установленных Трудовым кодексом Российской Федерации и иными федеральными законами. КДП проверяет продолжительность по документированному основанию до формирования графика.<\/p>\n<\/blockquote>\n<p>В 16, прил. 1 и в проверке графика добавить расчёт продолжительности без вывода чувствительных сведений в общий отчёт. В 10, 10.12 не менять срок оплаты, но передавать бухгалтерии фактическую продолжительность. Остальные категории удлинённых отпусков не перечислять без полного реестра оснований.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП получает подтверждённое основание. 2. КДП проверяет настроенную в 1С продолжительность: 28 или не менее 30 дней, а для иных оснований — установленную законом продолжительность. 3. График проверяет длительность и часть 14 дней. 4. Бухгалтерия получает число дней для оплаты.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли работающие инвалиды и как 1С определяет их продолжительность? Проверяли ли график 2026 года после 08.08.2024?<\/p>\n<p><strong>Цена вопроса.<\/strong> Разница минимальной гарантии — <code>30−28 = 2<\/code> календарных дня на работника (расчёт программой), но количество работников и стоимость не открыты.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по норме и расхождению дат редакций; средняя по фактическому расчёту компании.<\/p>"}, {"id": "К-OTP-17", "slug": "OTP-17", "title": "Три дня НРД установлены, но приказ с перечнем должностей не прислан", "imp": "средняя", "docs": ["12"], "meta": [["Документы", "12, п. 4.17; ТК 119; список выборов руководителя компании: выбор 3"], ["Тип", "пробел связанного документа и данных"], ["Кто решает", "руководитель HR; генеральный директор — перечень; юристы — проверка оснований"], ["Важность", "средняя: три дня установлены, но право зависит от отдельного приказа"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.17: «Работникам с ненормированным рабочим днем предоставляется ежегодный дополнительный оплачиваемый отпуск, продолжительностью 3 (три) календарных дня. Перечень должностей с ненормированным рабочим графиком подлежит утверждению и изменению приказом Генерального директора». В карте положений зафиксировано, что ответ о трёх днях уже есть, но сам приказ с перечнем в корпусе не приложен.<\/p>\n<p><strong>Что не так.<\/strong> Положение устанавливает длительность, но не даёт КДП источника, по которому определить право конкретной должности и дату действия перечня. Нельзя считать всех работников с фактическими переработками имеющими НРД. Без приказа график может потерять три дня или начислить их лишним людям.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 119 ч. 1: «Работникам с ненормированным рабочим днем предоставляется ежегодный дополнительный оплачиваемый отпуск, продолжительность которого определяется коллективным договором или правилами внутреннего трудового распорядка и который не может быть менее трех календарных дней».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12, п. 4.17 добавить:<\/p>\n<blockquote>\n<p>4.17.1. КДП проверяет установленный работнику режим ненормированного рабочего дня, действующий перечень должностей и основание его введения; при расхождении передаёт вопрос руководителю HR и юристам, не уменьшая установленную работнику гарантию автоматически. КДП хранит приказ, сверяет должность и рабочий год и включает три календарных дня в график и расчёт отпускных. Фактическое выполнение работы сверх установленной продолжительности само по себе не заменяет включение должности в перечень.<\/p>\n<\/blockquote>\n<p>В 10, 10.12 и процессе графика добавить источник приказа; в проекте правил отпусков снять пометку «нужно от HR: дни за ненормированный день» и заменить подтверждением 3 дня с вопросом о номере/дате приказа. Если приказа нет, генеральный директор принимает отдельное решение; не считать право автоматически по названию роли.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП получает действующий перечень. 2. 1С связывает должность и рабочий год. 3. График включает 3 дня. 4. При изменении приказа КДП пересчитывает будущие графики, не меняя уже использованные дни без основания.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где приказ с перечнем должностей? Какую дату его действия использовать? Менялся ли перечень после ПВТР 2022 года?<\/p>\n<p><strong>Цена вопроса.<\/strong> Количество работников с правом и стоимость трёх дней не открыты; не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по тексту ПВТР и ТК; средняя по отсутствию приказа, поскольку он мог быть вне переданного корпуса.<\/p>"}, {"id": "К-OTP-18", "slug": "OTP-18", "title": "Оплата и компенсация отпуска требуют средней зарплаты, но в процессе нет проверяемого источника расчёта", "imp": "высокая", "docs": ["10"], "meta": [["Документы", "10, пп. 10.12–10.13; ТК 127, 139; ответы HR 10.11"], ["Тип", "пробел расчётного контроля"], ["Кто решает", "руководитель КДП; бухгалтерия; юристы — спорные расчётные периоды"], ["Важность", "высокая: долг в днях уже значительный, но рубли по людям нельзя подтвердить"]], "html": "<p><strong>Было.<\/strong> 10, п. 10.12: «Оплата отпуска Работникам производится не позднее чем за три дня до его начала». 12, п. 4.21: «При увольнении работник получает компенсацию за все неиспользованные дни отпуска». Сводные цифры по выгрузке КДП — в <a href=\"#/k/OTP-05\">К-OTP-05<\/a> и <a href=\"#/k/OTP-15\">К-OTP-15<\/a>. Суммы по отдельным людям в этот разбор не переносятся.<\/p>\n<p><strong>Что не так.<\/strong> В ЛНА есть срок оплаты и право на компенсацию, но нет ссылки на источник расчёта, контроля 29,3, состава начислений и сверки дней по рабочим годам. Предложение посчитать долг в рублях по группам разумно как аналитика, но без закрытой выгрузки и проверки средней зарплаты цифры будут допущением. Нельзя использовать среднюю зарплату из отдельной программы как факт компании.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 139 ч. 4: «Средний дневной заработок для оплаты отпусков и выплаты компенсации за неиспользованные отпуска исчисляется за последние 12 календарных месяцев путем деления суммы начисленной заработной платы на 12 и на 29,3 (среднемесячное число календарных дней)». ТК ст. 236 ч. 1: «При нарушении работодателем установленного срока соответственно выплаты заработной платы, оплаты отпуска, выплат при увольнении ... работодатель обязан выплатить их с уплатой процентов (денежной компенсации) ... за каждый день задержки».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 10, раздел 10, добавить:<\/p>\n<blockquote>\n<p>10.12.1. Бухгалтерия рассчитывает оплату отпуска и компенсацию за неиспользованный отпуск по среднему заработку в порядке, установленном статьёй 139 Трудового кодекса Российской Федерации. КДП передаёт даты, виды и количество дней по каждому рабочему году. Расчёт хранится с кадровым основанием и подтверждением выплаты; исправления проходят повторную сверку КДП и бухгалтерии.<\/p>\n<p>10.12.2. Для управленческой аналитики остаток дней переводится в деньги только по выгрузке из учётной системы и начислениям за соответствующие 12 календарных месяцев. В отчёте используются табельные номера и роли руководителей; ФИО в рабочий отчёт не включаются. Аналитическая оценка не заменяет расчёт бухгалтерии.<\/p>\n<\/blockquote>\n<p>В процесс «Светофор и долг» добавить два показателя: дни по рабочим годам и расчётная сумма с датой выгрузки. Сводные цифры по выгрузке на 11.11.2026 приведены в <a href=\"#/k/OTP-05\">К-OTP-05<\/a> и <a href=\"#/k/OTP-15\">К-OTP-15<\/a>; разбивку по рабочим годам считает отдельная программа с проверкой исходных полей.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. КДП выгружает остатки и рабочие годы без ФИО. 2. Бухгалтерия связывает их с начислениями. 3. Программа считает контрольную оценку, бухгалтерия подтверждает. 4. Красный флаг показывает дни и сумму с датой среза. 5. При увольнении тот же источник используется для компенсации.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Какие поля есть в выгрузке 1С, как фиксируется рабочий год и кто подтверждает начисления? Можно ли получить остатки с разбивкой по рабочим годам?<\/p>\n<p><strong>Цена вопроса.<\/strong> Открытая арифметика только показывает нижнюю границу: <code>56×30 = 1 680<\/code> дней сверх порога; сумма неизвестна. Учебное допущение о заработке из программы 11.11 не используем как данные компании. Расчёт программой.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по требованию расчётного контроля; рублёвый размер на 11.11.2026 — по выгрузке КДП (сводка выше), по рабочим годам — нет данных.<\/p>"}, {"id": "К-OTP-19", "slug": "OTP-19", "title": "Работа вместо запланированного отпуска подтверждена HR, а способ оформления неясен", "imp": "высокая", "docs": ["02", "12", "16"], "meta": [["Документы", "12, п. 4.21; 16, пп. 1.1, 2.3; 02, пп. 5.2–5.4"], ["Тип", "расходится с практикой; пробел оформления"], ["Кто решает", "руководитель HR; руководитель компании — исключения; КДП и юристы — оформление"], ["Важность", "высокая: продолжение работы в отпуске не закрывает долг и смешивает отпуск с другим днём отдыха"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.21: «Запрещается не предоставление ежегодного оплачиваемого отпуска в течение двух лет подряд». 16, п. 2.3: «Уходящий в отпуск сотрудник передает текущие задачи (дела) исполняющему обязанности». Ответы HR 10.11: «сотрудники не идут в согласованные сроки в свой отпуск либо они выполняют проектные задачи и с согласования руководителя продолжают работать (из-за загрузки)». 02, п. 5.4: «Дополнительное время отдыха предоставляется по заявлению Работника в соответствии с графиком отпусков и производственной загруженностью Организации» — это правило для компенсации работы в выходной/праздничный день, а не для переноса ежегодного отпуска.<\/p>\n<p><strong>Что не так.<\/strong> Практика продолжать работать в даты отпуска подтверждена как ответ HR, но неясно, оформляют ли перенос или отзыв. Устная договорённость оставляет отпуск неиспользованным и не создаёт законного нового срока. Дополнительный день отдыха по 02 нельзя записывать в остаток ежегодного отпуска. Нужен запрет закрывать событие как <code>согласовано руководителем<\/code> без документа.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 124 ч. 4: «Запрещается непредоставление ежегодного оплачиваемого отпуска в течение двух лет подряд». ТК ст. 125 ч. 2: «Отзыв работника из отпуска допускается только с его согласия». ТК ст. 123 ч. 2: «График отпусков обязателен как для работодателя, так и для работника».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 16, раздел 2, после 2.3 добавить:<\/p>\n<blockquote>\n<p>2.3.1. Выполнение работником трудовых обязанностей в дни утверждённого ежегодного отпуска не оформляется устным согласованием и не закрывает отпуск. До начала отпуска КДП оформляет законное изменение дат по пункту 4.21 Правил; если отпуск уже начался — отзыв по пункту 4.20 Правил и статье 125 Трудового кодекса Российской Федерации. При отсутствии оформленного законного изменения работник освобождается от работы на период отпуска, а руководитель организует замещение.<\/p>\n<p>2.3.2. День отдыха за работу в выходной или нерабочий праздничный день по документу о сверхурочной работе ведётся отдельно от ежегодного оплачиваемого отпуска и не уменьшает его остаток.<\/p>\n<\/blockquote>\n<p>В 12, п. 4.21 добавить ссылку на 2.3.1; в 02, пп. 5.2–5.4 оставить отдельный маршрут дня отдыха. В предлагаемом обсуждении с HR заменить вопрос о наказании руководителей на контроль оформления переноса/отзыва и помощь в замещении; не предлагать дисциплинарные меры без решения работодателя и фактов.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. За четыре недели процесс напоминает руководителю о графике. 2. Если работа требует изменения, руководитель выбирает перенос или отзыв и запускает карточку. 3. КДП проверяет согласие, срок и приказ. 4. Если документа нет, сотрудник отдыхает, замещающий принимает дела. 5. Отдельный день отдыха из 02 не попадает в реестр ежегодного отпуска.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сколько случаев продолжения работы в отпуске было в 2026 году? Были ли приказы переноса/отзыва? Как сейчас отличают день отдыха за выходной от ежегодного отпуска?<\/p>\n<p><strong>Цена вопроса.<\/strong> По выгрузке КДП на 11.11.2026 60 человек больше 30 дней; дни сверх 30 стоят 23 544 296,90 руб.. Часы работы в даты отпусков не выделены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по различию правовых режимов и практике; средняя по отсутствию оформленных приказов.<\/p>"}, {"id": "К-OTP-20", "slug": "OTP-20", "title": "Общий ЭДО не подтверждён отдельным актом, а отпускной маршрут уже электронный", "imp": "высокая", "docs": ["12", "16"], "meta": [["Документы", "12, пп. 1.3, 5.5–5.7, 13.5; 16, пп. 1.3–1.6; встреча 11.11"], ["Тип", "устарело / расходится с практикой"], ["Кто решает", "руководитель HR; юристы — ЛНА об ЭДО; руководитель КДП — резерв"], ["Важность", "высокая: бумажный маршрут и фактический Диадок должны иметь законное основание и резерв"]], "html": "<p><strong>Было.<\/strong> 12, п. 1.3, описывает ЭДО как «это система подписания документов с помощью УКЭП или иной электронной подписи ... программного обеспечения \"Диадок\" и сервисов \"Кадровый ЭДО\"» и связывает его с ТК 312.2–312.3. 12, п. 5.7: дистанционный работник действует «с помощью ЭДО, путем проставления УКЭП, либо в письменной форме под подпись». 16, п. 1.3 требует бумажный оригинал/скан. По встрече 11.11 почти все кадровые документы подписываются в Диадоке, а по отпуску заявление приходит через Диадок.<\/p>\n<p><strong>Что не так.<\/strong> ПВТР ред. 2022 не описывают весь фактический маршрут для офисных работников; 16 ред. 2021 его не знает. Это не доказывает недействительность подписей: нужен ЛНА об ЭДО, перечень документов, категории, порядок согласия и бумажный резерв. Дублирование скачанных PDF и файлов подписи в папку сотрудника — факт встречи, но не доказательство требуемой системы хранения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 22.2 ч. 2: «Электронный документооборот вводится работодателем на основании локального нормативного акта»; он содержит «перечень электронных документов и перечень категорий работников». Ч. 9: «Работодатель обязан безвозмездно предоставлять работникам ... документы, связанные с их работой ... на бумажном носителе» для лиц, указанных в частях 5–6 этой статьи, не давших согласия. Это не общий запрет ЭДО у каждого, чья подпись временно отсутствует; исключения ч. 7 и возможность оформления подписи проверяет КДП. ТК ст. 22.1: положения об ЭДО применяются к документам, для которых предусмотрено бумажное оформление и/или письменное ознакомление, если они не исключены законом.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Принять/проверить отдельный ЛНА об ЭДО, а в 16, п. 1.3 заменить:<\/p>\n<blockquote>\n<p>1.3. Документы по отпуску подписываются и передаются через электронный документооборот только в случаях, когда работодатель ввёл такой порядок соответствующим локальным нормативным актом для данного документа и категории работников. Работнику без требуемого согласия или электронной подписи документы предоставляются на бумаге. КДП хранит электронный документ и сведения о подписи в установленном порядке; бумажная копия не требуется, если законный электронный порядок предусматривает иной способ хранения.<\/p>\n<\/blockquote>\n<p>В 12, раздел 1 и пп. 5.5–5.7 заменить ограниченную ссылку на 312.2–312.3 на утверждённый ЛНА и действующие статьи 22.1–22.3 после проверки юристами; в 16 убрать скан как универсальный промежуточный шаг. Не считать папку на сервере заменой архива ЭДО, пока КДП не подтвердит реквизиты и права доступа.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник получает понятный канал и резерв. 2. 1С/КДП создаёт документ; Диадок используется только для покрытой категории. 3. Подпись и дата проверяются. 4. При сбое или отсутствии права ЭДО КДП выдаёт бумагу. 5. Ежедневный список неподписавших формируется из подтверждённого журнала, а не из догадки по папкам.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Где ЛНА о введении ЭДО, когда и кем утверждён, какие категории и заявления покрывает? Есть ли согласия работников и бумажный резерв? Что именно скачивает КДП из Диадока и как проверяет подпись?<\/p>\n<p><strong>Цена вопроса.<\/strong> Время и стоимость перехода не считали. Цена кадрового ЭДО около 1 млн руб. в год на 100 пользователей прозвучала во встрече 11.11, но о конкретном продукте и подтверждении суммы не ясно; в расчёт не включаем.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по расхождению текстов и требованиям к ЛНА об ЭДО; средняя по юридическому статусу текущих подписей.<\/p>"}, {"id": "К-OTP-21", "slug": "OTP-21", "title": "Остаток больше 28 дней не означает право заменить весь избыток деньгами", "imp": "высокая", "docs": ["10", "12"], "meta": [["Документы", "12, п. 4.21; ТК 126; 12, п. 4.17; 10, п. 8.7"], ["Тип", "пробел маршрута и проверки"], ["Кто решает", "работодатель — согласие на замену; КДП и юристы — допустимые дни; бухгалтерия — выплата"], ["Важность", "высокая: совокупный долг нельзя погашать деньгами по простому порогу остатка"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.21: «Замена ежегодного основного отпуска денежной компенсацией не допускается». Есть дополнительные отпуска по 12, п. 4.17 и 10, п. 8.7, но нет процедуры проверки замены. В каталоге процессов 12.11 указано, что замену деньгами предлагает работник, принимает КДП, согласует финансовый директор; это проект, а не установленная полномочиями процедура компании.<\/p>\n<p><strong>Что не так.<\/strong> Запрет в ПВТР сохраняет отдых, но не разграничивает возможную замену части каждого ежегодного отпуска сверх 28 и обязательную компенсацию всех неиспользованных отпусков при увольнении. Совокупный остаток, например 175 дней, может состоять из основных отпусков разных лет: вычитать из него 28 и заменять остальное нельзя. Наличие дополнительного отпуска само по себе не доказывает допустимость замены конкретных дней.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 126 ч. 1–2: «Часть ежегодного оплачиваемого отпуска, превышающая 28 календарных дней, по письменному заявлению работника может быть заменена денежной компенсацией, если иное не предусмотрено настоящим Кодексом»; «При суммировании ежегодных оплачиваемых отпусков или перенесении ежегодного оплачиваемого отпуска на следующий рабочий год денежной компенсацией могут быть заменены часть каждого ежегодного оплачиваемого отпуска, превышающая 28 календарных дней, или любое количество дней из этой части». Ч. 3: «Не допускается замена денежной компенсацией ежегодного основного оплачиваемого отпуска и ежегодных дополнительных оплачиваемых отпусков беременным женщинам и работникам в возрасте до восемнадцати лет»; для вредных условий и исключений действует полный текст той же части.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Дополнить переработанный 12, 4.21 отдельным подпунктом:<\/p>\n<blockquote>\n<p>4.21.4. Основной отпуск не заменяется денежной компенсацией, кроме случаев, предусмотренных законом, включая увольнение. Возможность замены части каждого ежегодного оплачиваемого отпуска сверх 28 календарных дней проверяется КДП по рабочим годам и видам отпуска с учётом запретов и исключений статьи 126 Трудового кодекса Российской Федерации. Основанием рассмотрения является письменное заявление работника. Решение работодателя и подлежащие замене дни фиксируются кадровым документом; общий остаток дней без разбивки по рабочим годам не является основанием для замены.<\/p>\n<\/blockquote>\n<p>В 16 добавить отдельный маршрут <code>Замена части отпуска денежной компенсацией<\/code>; в 10 — основание начисления по согласованному кадровому документу. <a href=\"#/k/OTP-15\">К-OTP-15<\/a> о выплате при увольнении не смешивать с этим разрешительным маршрутом. Полномочия финансового директора из черновика утверждает руководитель компании; до этого решение принимает уполномоченный работодатель.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник подаёт подписанное заявление с днями и рабочим годом. 2. КДП проверяет вид и запреты, спорные дни направляет юристу. 3. Работодатель принимает решение; согласие работника не делает запрещённую замену разрешённой. 4. Бухгалтерия рассчитывает выплату по документу, КДП сверяет изменение остатка.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Бывает ли замена сверх 28 без увольнения и кто уполномочен её разрешать? Какие виды дополнительных дней заменяли?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: нет разбивки остатков и фактических заявлений. Наибольший остаток не используется как база разрешённой замены.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по необходимости разложения каждого отпуска; средняя по видам дней компании и фактическим полномочиям.<\/p>"}, {"id": "К-OTP-22", "slug": "OTP-22", "title": "Болезнь во время ежегодного отпуска и исполнение государственных обязанностей не включены в маршрут продления", "imp": "средняя", "docs": ["12", "16"], "meta": [["Документы", "12, пп. 4.21, 4.23; 16, п. 1.7; ТК 124 ч. 1"], ["Тип", "пробел"], ["Кто решает", "КДП и уполномоченный работодатель; юристы — спорные основания"], ["Важность", "средняя: обычная неявка и событие внутри отпуска требуют разных кадровых действий"]], "html": "<p><strong>Было.<\/strong> 12, п. 4.23: «В случае болезни работника или иной причины, по которой он не может выполнять свои служебные обязанности, работник обязан в первый день невыхода уведомить об этом своего непосредственного руководителя». 12, 4.21 говорит о переносе по производственным обстоятельствам, но не о продлении/переносе вследствие болезни. 16, 1.7 отсылает к общему порядку согласования отсутствий.<\/p>\n<p><strong>Что не так.<\/strong> Уведомление о болезни не завершает оформление отпуска: КДП нужно проверить документ, использованные дни и последствие для дат. Это пробел текста, а не доказательство того, что компания не продлевает отпуск. Болезнь самого работника и другие ситуации нельзя автоматически объединять в одну причину продления.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 124 ч. 1: «Ежегодный оплачиваемый отпуск должен быть продлен или перенесен на другой срок, определяемый работодателем с учетом пожеланий работника, в случаях:»; «временной нетрудоспособности работника»; «исполнения работником во время ежегодного оплачиваемого отпуска государственных обязанностей, если для этого трудовым законодательством предусмотрено освобождение от работы»; «в других случаях, предусмотренных трудовым законодательством, локальными нормативными актами».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 12 добавить:<\/p>\n<blockquote>\n<p>4.21.6. При возникновении обстоятельств части первой статьи 124 Трудового кодекса Российской Федерации КДП проверяет основание и подтверждающие сведения и организует продление либо перенос ежегодного оплачиваемого отпуска. Иной срок определяется работодателем с учётом пожеланий работника. Изменение отражается в кадровом документе, графике, учёте использованных дней и сведениях для бухгалтерии. Уведомление по пункту 4.23 не заменяет оформления последствий для отпуска.<\/p>\n<\/blockquote>\n<p>В 16, 1.8–1.9 выделить процесс; в 10, 10.12.1 добавить повторную сверку расчёта при изменении дат. Канал подтверждения нетрудоспособности проверить с КДП, не требовать без основания бумажный лист от всех.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Работник уведомляет руководителя/КДП о событии. 2. КДП проверяет вид отпуска и подтверждённое основание. 3. Фиксируются пожелания и решение о датах. 4. Обновляются график и табель, бухгалтерия проверяет расчёт.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Как сейчас оформляют болезнь внутри отпуска, откуда получают подтверждение, кто фиксирует новые даты?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: таких случаев и исправлений расчёта в открытых данных нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по правовой норме и отсутствию маршрута в присланных текстах; средняя по практике.<\/p>"}, {"id": "К-OTP-23", "slug": "OTP-23", "title": "Редактура: двойной заголовок и мелкие ошибки не должны становиться новыми правилами", "imp": "низкая", "docs": ["16"], "meta": [["Документы", "16, раздел 1, пп. 1.7, 2.1, 2.6"], ["Тип", "ошибка в тексте: редактура"], ["Кто решает", "руководитель HR и юрист-редактор"], ["Важность", "низкая: читаемость и ссылки; смысловые ошибки разобраны отдельно"]], "html": "<p><strong>Было.<\/strong> В 16, стр. 1, после раздела 1 идёт ещё один заголовок с номером 1; п. 1.7: «является релевантным»; п. 2.1: «по средствам корпоративной электронной почты»; п. 2.6 начинается «Сотрудник уходящий в отпуск обязан». Скан страниц 1–2 просмотрен.<\/p>\n<p><strong>Что не так.<\/strong> Повтор заголовка и канцелярская формулировка затрудняют ссылки; мелкая орфография не меняет обязанность и не является отдельным нарушением. Ошибки OCR в HR-должностях не переносим в список ошибок оригинала. Слово «менее» — не редактура, а отдельный <a href=\"#/k/OTP-11\">К-OTP-11<\/a>.<\/p>\n<p><strong>Закон.<\/strong> Специальной нормы о редактуре нет; правовые обязанности от исправления запятой не меняются.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Второй заголовок 1 сделать ненумерованным подзаголовком; в 2.1 заменить <code>по средствам<\/code> на <code>посредством<\/code>, в 2.6 поставить запятые: <code>Сотрудник, уходящий в отпуск, обязан ...<\/code>. Вместо 1.7 использовать разграниченные пункты 1.7–1.9 из согласованной схемы ниже. Наименование HR-директора унифицировать после подтверждения актуальных ролей, без имён.<\/p>\n<p><strong>Как будет работать.<\/strong> 1. Редактор вносит правки в новую редакцию, не меняя смысл самостоятельно. 2. КДП проверяет ссылки и формы. 3. HR утверждает комплект одновременно с содержательными изменениями, а не отдельным приказом ради запятых.<\/p>\n<p><strong>Уточнить у HR и КДП.<\/strong> Нет; актуальные названия должностей — в общей проверке SKVOZ.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: сверено со сканом; права и обязанности сохраняются.<\/p>"}]}, {"kod": "PRIEM", "nazv": "Приём, испытание, адаптация, увольнение", "glavnoe": "<p>Пять кейсов, с которых начать разговор с руководителем HR:<\/p>\n<ol>\n<li><strong><a href=\"#/k/PRIEM-06\">К-PRIEM-06<\/a>, встречи после рабочего дня.<\/strong> Это риск для двух людей сразу и понятный готовый текст: сначала подтвердить фактическое время, затем убрать обязательный вечер или провести его по общему порядку сверхурочной работы.<\/li>\n<li><strong><a href=\"#/k/PRIEM-01\">К-PRIEM-01<\/a>, запрет испытания до трёх лет.<\/strong> Норма вступила в силу 01.09.2026; короткая точечная правка 07 и контроль договора защищают от ошибки при новом приёме.<\/li>\n<li><strong><a href=\"#/k/PRIEM-07\">К-PRIEM-07<\/a>, ознакомление до договора.<\/strong> ПВТР и приказ требуют один срок, адаптационный регламент читается иначе; это связывает КДП, HR и ЭДО в одном приёмном шаге.<\/li>\n<li><strong><a href=\"#/k/PRIEM-13\">К-PRIEM-13<\/a>, полный расчёт при увольнении.<\/strong> Расчёт, компенсация отпуска и документы должны идти параллельно; правка снимает разрыв между 07, 10 и 12, не превращая обходной лист в удержание выплат.<\/li>\n<li><strong><a href=\"#/k/PRIEM-14\">К-PRIEM-14<\/a>, единая карточка увольнения.<\/strong> встреча с HR и КДП 11.11 прямо описывает ручную работу и отсутствие общей системы задач; маршрут можно сделать с ролями и сроками, не задерживая обязательные документы.<\/li>\n<\/ol>", "karta": "<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Процесс<\/th>\n<th style=\"text-align: left;\">Документы и пункты<\/th>\n<th style=\"text-align: left;\">Участники — роли<\/th>\n<th style=\"text-align: left;\">Системы и каналы<\/th>\n<th style=\"text-align: left;\">Несогласованность / недостающая связь<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">Проверка при приёме<\/td>\n<td style=\"text-align: left;\">12, пп. 2.1–2.6; ТК 57, 65, 67, 68<\/td>\n<td style=\"text-align: left;\">генеральный директор / представитель по доверенности, КДП, отдел персонала<\/td>\n<td style=\"text-align: left;\">по ПВТР бумага и ЭДО для дистанционных; по ответы HR 10.11 1С, заказ УКЭП и Диадок<\/td>\n<td style=\"text-align: left;\">диплом затребован без ограничения по работе; старые действия с пенсионным документом и дубликатом книжки<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Воинский учёт при приёме<\/td>\n<td style=\"text-align: left;\">12, пп. 2.2–2.3; ПП 719, пп. 30, 32; 53‑ФЗ<\/td>\n<td style=\"text-align: left;\">КДП, ответственный за воинский учёт, кандидат<\/td>\n<td style=\"text-align: left;\">сканы → ручной ввод в 1С, формы и бумажная почта по встреча с HR и КДП 11.11<\/td>\n<td style=\"text-align: left;\">ПВТР запрещает приём без комплекта; КДП описала приём без военного билета. Правовой порядок исключения требует юристов; подробности — группа VU<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Ознакомление до договора<\/td>\n<td style=\"text-align: left;\">12, п. 2.10 и приказ о введении п. 3; 13, пп. 3.2.1–3.2.2; 03, п. 2.5<\/td>\n<td style=\"text-align: left;\">КДП, новый работник, отдел персонала<\/td>\n<td style=\"text-align: left;\">бумага, применимый кадровый ЭДО; информационные материалы в Confluence<\/td>\n<td style=\"text-align: left;\">в адаптации не зафиксировано, что подпись под ЛНА предшествует договору; практика встреча с HR и КДП 11.11 говорит о знакомстве до приёма, нарушения на деле не установлено<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Допуск и оснащение<\/td>\n<td style=\"text-align: left;\">13, пп. 2.1–2.2, 3.2.3; 12, пп. 2.12–2.13; 03, пп. 3.4–3.8; 08, пп. 7.3.5, 8.4<\/td>\n<td style=\"text-align: left;\">отдел персонала, офис-менеджер, системный администратор, КДП, специалист ОТ<\/td>\n<td style=\"text-align: left;\">Jira, рабочая почта, выдача техники; инструктажи отдельно<\/td>\n<td style=\"text-align: left;\">заявка до выхода есть, срок готовности удалённого рабочего места и подтверждение готовности не заданы; welcome-презентация не равна инструктажу<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Назначение испытания<\/td>\n<td style=\"text-align: left;\">07, пп. 1.3–1.8; 12, пп. 2.7–2.8; ТК 70<\/td>\n<td style=\"text-align: left;\">КДП, руководитель, работодатель, кандидат<\/td>\n<td style=\"text-align: left;\">договор; приказ по действующим ПВТР<\/td>\n<td style=\"text-align: left;\">возраст ребёнка устарел; перечень для шести месяцев различается, исключения и короткий договор в ПВТР не отражены<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Задания и доказательства<\/td>\n<td style=\"text-align: left;\">07, пп. 2.2–2.15; 13, п. 3.3.2; 12, пп. 3.2.25, 5.5–5.12<\/td>\n<td style=\"text-align: left;\">непосредственный руководитель, наставник, работник, руководитель кадровой службы<\/td>\n<td style=\"text-align: left;\">бумага, рабочая почта, YouTrack/Jira; фактическое использование YouTrack не подтверждено<\/td>\n<td style=\"text-align: left;\">план необязателен, отдельные задания с критериями обязательны; отправка признана получением, хотя подтверждение тоже требуется; переписка слишком широко приравнена к документам<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Адаптация и наставничество<\/td>\n<td style=\"text-align: left;\">07, п. 2.1; 13, пп. 1.3, 1.5, 3.1, 3.3, раздел 4<\/td>\n<td style=\"text-align: left;\">руководитель отдела, непосредственный руководитель, куратор/наставник, HR<\/td>\n<td style=\"text-align: left;\">встречи; по ответы HR 10.11 welcome-письмо, Mattermost и контрольные точки<\/td>\n<td style=\"text-align: left;\">две роли и два назначающих; срок адаптации привязан к испытанию, схема только на начальный период; обязательные встречи после рабочего дня; частота в тексте и таблице различается<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Итог испытания<\/td>\n<td style=\"text-align: left;\">07, пп. 1.8, 2.15–2.20, 3.1–3.9<\/td>\n<td style=\"text-align: left;\">работник, непосредственный руководитель, руководитель кадровой службы, генеральный директор<\/td>\n<td style=\"text-align: left;\">отчёт, беседа, письменное заключение, уведомление и приказ<\/td>\n<td style=\"text-align: left;\">стандартные упреждающие сроки не работают при коротком испытании; нужны пересчёт конца и маршрут решения с доказательством предупреждения; защищённые категории требуют актуальной нормы<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Выплаты и ДМС после испытания<\/td>\n<td style=\"text-align: left;\">07, пп. 3.3, 3.9; 10, пп. 6.8.2–6.8.3, 6.10.2–6.10.3, 9.5<\/td>\n<td style=\"text-align: left;\">КДП, отдел персонала, руководитель, бухгалтерия<\/td>\n<td style=\"text-align: left;\">устное сообщение; по ответы HR 10.11 после ретро запрос КДП для ДМС<\/td>\n<td style=\"text-align: left;\">письменное заключение уже есть, но событие для последующих действий не задано; что делать без испытания, не определено; базовое право на ДМС в присланных ЛНА не найдено<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Внутренний перевод / аллокация<\/td>\n<td style=\"text-align: left;\">12, п. 2.15; 07, пп. 1.3, 2.6; ТК 72, 72.1<\/td>\n<td style=\"text-align: left;\">руководитель, работник, КДП, системный администратор<\/td>\n<td style=\"text-align: left;\">по ответы HR 10.11 задачи Jira; допсоглашение и 1С<\/td>\n<td style=\"text-align: left;\">нет маршрута различения перевода, перемещения и проектной аллокации; новая адаптация не означает новое испытание<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Заявление об увольнении<\/td>\n<td style=\"text-align: left;\">12, пп. 2.16.1–2.16.4; 07, п. 3.7; ТК 80, 71<\/td>\n<td style=\"text-align: left;\">работник, КДП, руководитель, уполномоченный работодатель<\/td>\n<td style=\"text-align: left;\">по ответы HR 10.11 заявление и Диадок; регистрация даты получения<\/td>\n<td style=\"text-align: left;\">нет операционного порядка расчёта срока, отзыва и исключений; заявление не должно превращаться в разрешение начальника<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Передача дел и закрытие доступов<\/td>\n<td style=\"text-align: left;\">12, пп. 2.16.5, 3.2.24; 15, п. 2.3; 04, пп. 5.5.2, 6.2.14; встреча с HR и КДП 11.11<\/td>\n<td style=\"text-align: left;\">работник, руководитель, КДП, ИТ, ИБ, администратор такси<\/td>\n<td style=\"text-align: left;\">акт, предлагаемый обходной лист, Jira/почта; бумага/ЭДО для соответствующих документов<\/td>\n<td style=\"text-align: left;\">нет общего события участникам и их сроков; обходной лист не условие расчёта; тексты 04 не переписываются — только связь<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Расчёт и документы<\/td>\n<td style=\"text-align: left;\">07, пп. 3.4, 3.8; 12, пп. 2.16.2, 2.16.6–2.16.7, 4.21; 10, пп. 10.10, 10.13; ТК 84.1, 127, 140<\/td>\n<td style=\"text-align: left;\">КДП, бухгалтерия, работодатель, работник<\/td>\n<td style=\"text-align: left;\">приказ, бумажная книжка либо сведения, выплаты; по ответы HR 10.11 почти всё в Диадоке<\/td>\n<td style=\"text-align: left;\">10.13 назван только расчёт по зарплате, хотя закон — все суммы; нет отдельной ветки невыдачи электронных сведений и бумажной копии приказа дистанционному<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Данные и контроль<\/td>\n<td style=\"text-align: left;\">07, пп. 2.4, 2.11; 04, пп. 6.2.18, 6.7; 09; ТК 86–90<\/td>\n<td style=\"text-align: left;\">работодатель, ИБ, юристы, системный администратор, уполномоченный КДП<\/td>\n<td style=\"text-align: left;\">рабочая почта, системы задач, личное дело<\/td>\n<td style=\"text-align: left;\">доступ администратора без уведомления дан в документе только об испытании; цели, пределы и допустимость требуют проверки ИБ/юристов, а не переноса в HR-бот<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "voprosy": "<ol>\n<li>Кто сейчас является «руководителем кадровой службы» в 07: руководитель HR, руководитель КДП или другая роль?<\/li>\n<li>Испытание для женщин с детьми до трёх лет после 01.09.2026 проверяли по действующим договорам?<\/li>\n<li>Есть ли отдельный приказ/ЛНА о введении кадрового ЭДО, его системе, категориях работников и резервном бумажном маршруте?<\/li>\n<li>Какие ЛНА подписываются до договора и через какой канал; есть ли полный список 50–60 документов из встречи?<\/li>\n<li>Jira ведёт весь приём или только задачу на технику/доступы; где фиксируются готовность места, систем и инструктажа?<\/li>\n<li>Куратор и Наставник — одна роль или две? Входит ли наставничество в трудовую функцию назначенного человека?<\/li>\n<li>Встречи наставника сейчас проходят после рабочего дня или в рабочее время; как учитывается участие коллег?<\/li>\n<li>Где фиксируют итог испытания и дату окончательного статуса; что делают при приёме без испытания?<\/li>\n<li>Кто регистрирует заявление об увольнении, его получение и отзыв; где подтверждение расчёта и компенсации?<\/li>\n<li>Кто получает событие увольнения для закрытия почты, Jira, Mattermost, Confluence, УКЭП и корпоративного такси?<\/li>\n<\/ol>", "nehvatilo": "<ul>\n<li><strong>ТК ст. 57<\/strong> — полная актуальная редакция для связи испытания, условий договора и ДМС; в доборе есть только фрагмент о дополнительных условиях.<\/li>\n<li><strong>ТК ст. 62 и 66.1<\/strong> — выдача документов и сведения о трудовой деятельности; для <a href=\"#/k/PRIEM-22\">К-PRIEM-22<\/a> нужна полная часть о способах и сроках, а не только фрагмент ст. 84.1.<\/li>\n<li><strong>ТК ст. 81 и 261<\/strong> — полный актуальный перечень запретов увольнения и гарантий; в <a href=\"#/k/PRIEM-03\">К-PRIEM-03<\/a> намеренно оставлена формулировка «проверить юристам».<\/li>\n<li><strong>ТК ст. 86–90<\/strong> — в доборе есть 86–90, но полный связанный текст и применимость к проверке содержимого почты должны быть подтверждены юристами/ИБ; <a href=\"#/k/PRIEM-19\">К-PRIEM-19<\/a> не делает вывода о законности мониторинга.<\/li>\n<li><strong>ТК ст. 312.7<\/strong> — для связки адаптации и охраны труда дистанционных работников; в разрешённой базе есть ссылка в доборе, но не разобран полный текст.<\/li>\n<li><strong>ТК ст. 136<\/strong> — срок оплаты зарплаты, который нужен для связи окончательного расчёта и оплаты; в доступных базах для этой группы полного текста нет.<\/li>\n<li><strong>КоАП ст. 5.27<\/strong> — приём и увольнение могут иметь административные последствия, но в этих кейсах штраф не заявлялся без доказанного нарушения; норма доступна в базе законов.<\/li>\n<\/ul>", "keysy": [{"id": "К-PRIEM-01", "slug": "PRIEM-01", "title": "Запрет испытания для женщин с детьми устарел", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "07, п. 1.6; 12, пп. 2.7–2.8"], ["Тип", "расходится с законом"], ["Кто решает", "юристы до утверждения; КДП — проверка каждого назначения"], ["Важность", "высокая: пункт допускает назначение испытания категории, для которой оно запрещено"]], "html": "<p><strong>Было.<\/strong> 07, п. 1.6: «беременных женщин и женщин, имеющих детей в возрасте до полутора лет».<\/p>\n<p><strong>Что не так.<\/strong> Перечень в документе уже не соответствует действующему запрету. Это не предположение о практике: в файле записан старый возраст. Назначалось ли такое испытание на деле, неизвестно; КДП следует проверить договоры соответствующего периода, не сообщая сведения о семьях в общие задачи.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 70 ч. 4, абзац о женщинах (ред. 25.05.2026): «беременных женщин и женщин, имеющих детей в возрасте до трех лет». 91‑ФЗ от 09.04.2026, ст. 2: «Настоящий Федеральный закон вступает в силу с 1 сентября 2026 года». После вступления прошло 77 дней (расчёт программой). ТК ст. 8 ч. 4: «Нормы локальных нормативных актов, ухудшающие положение работников … не подлежат применению».<\/p>\n<p><strong>Стало (предлагается).<\/strong> В 07, п. 1.6, заменить соответствующий абзац:<\/p>\n<blockquote>\n<p>• беременных женщин и женщин, имеющих детей в возрасте до трех лет;<\/p>\n<\/blockquote>\n<p>В 12, п. 2.7, добавить: <\/p>\n<blockquote>\n<p>Испытание не устанавливается лицам, указанным в части четвертой статьи 70 Трудового кодекса Российской Федерации и пункте 1.6 Положения о порядке прохождения испытания при приеме на работу. Перед включением условия об испытании специалист по кадровому делопроизводству проверяет отсутствие установленных законом запретов. Наличие в трудовом договоре условия об испытании не отменяет таких запретов.<\/p>\n<\/blockquote>\n<p>Связанные шаблоны договора и контрольный список КДП исправить одновременно; остальные исключения п. 1.6 не удалять. В последнем абзаце п. 1.6 сохранить также случаи, предусмотренные коллективным договором, если он есть: действующий ТК включает его в перечень оснований.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>До формирования договора КДП проверяет допустимость испытания в закрытой кадровой карточке.<\/li>\n<li>В общую задачу приёма передаётся только результат: испытание допускается / не устанавливается, без причины и семейных сведений.<\/li>\n<li>При ошибочном назначении КДП с юристами устраняет её и исключает маршрут увольнения по результату такого испытания.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли после вступления изменения договоры с испытанием у указанной категории? Само наличие таких работников не предполагается.<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали: данных о назначенных испытаниях нет.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая: текст пункта, новая норма и дата вступления прямо сопоставимы.<\/p>"}, {"id": "К-PRIEM-02", "slug": "PRIEM-02", "title": "Разные пределы испытания в положении и ПВТР", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "07, пп. 1.3, 1.5–1.8; 12, пп. 2.7–2.8"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR и юристы; расширение до шести месяцев — не автоматическое решение помощника"], ["Важность", "высокая: неопределённый круг руководителей и потеря ограничения для коротких договоров"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>07, п. 1.5: «Для руководителей и их заместителей, главных бухгалтеров и их заместителей, руководителей филиалов, представительств или иных обособленных структурных подразделений Общества, срок испытания не может превышать шести месяцев».<\/li>\n<li>12, п. 2.7: «на срок до 3 месяцев (для всех работников) или до 6 месяцев (для заместителей генерального директора, главных бухгалтеров и их заместителей, руководителей филиалов, представительств и иных обособленных структурных подразделений Общества)».<\/li>\n<li>07, п. 1.5: «При заключении трудового договора на срок от двух до шести месяцев испытание не может превышать двух недель».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> В 07 слово о руководителях без уточнения допускает чтение как о любых начальниках, хотя закон называет руководителей организаций. ПВТР не включают генерального директора в специальный перечень: это более короткое внутреннее ограничение, не нарушение закона само по себе. Но фраза о всех работниках без ссылки на исключения и короткие договоры даёт неверный самостоятельный алгоритм назначения.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 70 ч. 5–6 (ред. 25.05.2026): «Срок испытания не может превышать трех месяцев, а для руководителей организаций и их заместителей, главных бухгалтеров и их заместителей, руководителей филиалов, представительств или иных обособленных структурных подразделений организаций — шести месяцев, если иное не установлено федеральным законом». «При заключении трудового договора на срок от двух до шести месяцев испытание не может превышать двух недель». Ч. 1: «по соглашению сторон может быть предусмотрено условие об испытании».<\/p>\n<p><strong>Стало (предлагается).<\/strong> Рекомендация — не удлинять внутренний предел для генерального директора без отдельного решения. Единый текст для 07, п. 1.5, и 12, п. 2.7:<\/p>\n<blockquote>\n<p>Испытание устанавливается по соглашению сторон при заключении трудового договора с соблюдением запретов, предусмотренных законодательством и пунктом 1.6 Положения о порядке прохождения испытания при приеме на работу. Срок испытания не может превышать трех месяцев. Для заместителей генерального директора, главного бухгалтера и его заместителей, руководителей филиалов, представительств и иных обособленных структурных подразделений Общества срок испытания не может превышать шести месяцев, если иное не установлено федеральным законом. Руководителям отделов и проектов шестимесячное испытание только в силу названия должности не устанавливается. При заключении трудового договора на срок от двух до шести месяцев испытание не может превышать двух недель. В срок испытания не засчитываются периоды, предусмотренные частью седьмой статьи 70 Трудового кодекса Российской Федерации.<\/p>\n<\/blockquote>\n<p>Вариант для отдельного решения работодателя: включить в специальный перечень также генерального директора, если это соответствует его договору и порядку назначения. Это разрешённый максимум закона, а не обязанность его выбирать. Пп. 1.3, 1.7 документа 07 о договоре/соглашении до начала работы сохранить; приказ сам по себе испытание не создаёт.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>КДП выбирает категорию по реальной должности и сроку договора, затем проверяет исключения.<\/li>\n<li>Срок согласуется сторонами и вносится в договор; система проверяет максимум, но не назначает его сама.<\/li>\n<li>Приказы, календарь и задания берут срок из договора; отсутствие условия не исправляется задним числом.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Сохранить для генерального директора внутренний предел до трёх месяцев или специально пересмотреть? Бывают ли договоры с коротким сроком?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по расхождению; средняя по выбранному внутреннему перечню — требуется решение работодателя.<\/p>"}, {"id": "К-PRIEM-03", "slug": "PRIEM-03", "title": "Перечень защищённых от увольнения нельзя применять по старой копии", "imp": "высокая", "docs": ["07", "12"], "meta": [["Документы", "07, п. 3.6; 12, пп. 2.16.1, 5.15"], ["Тип", "пробел в проверке актуальности"], ["Кто решает", "юристы до любого спорного увольнения"], ["Важность", "высокая: ошибка в основании увольнения ведёт к трудовому спору"]], "html": "<p><strong>Было.<\/strong> 07, п. 3.6: «малолетнего ребенка - ребенка в возрасте до четырнадцати лет»; далее (через границу страниц): «если другой … родитель (иной законный представитель ребенка) не состоит в трудовых».<\/p>\n<p><strong>Что не так.<\/strong> Вторая фраза оборвана, а список категорий привязан к тексту, принятому ранее. По доступной базе нельзя установить, соответствует ли возраст и весь перечень действующей ст. 261: её полного текста здесь нет. Нельзя объявить именно этот возраст незаконным по памяти, но использовать список как исчерпывающую готовую проверку также нельзя. Изменение запрета назначения испытания не заменяет проверки запрета увольнения.<\/p>\n<p><strong>Закон.<\/strong> Полных текстов ТК ст. 81 ч. 6 и ст. 261 в разрешённых базах нет, проверить юристам. ТК ст. 71 ч. 1 (ред. 25.05.2026): «Решение работодателя работник имеет право обжаловать в суд». Это подтверждает риск спора, но не восполняет отсутствующие гарантии.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Вместо 07, п. 3.6:<\/p>\n<blockquote>\n<p>3.6. До подготовки уведомления о расторжении трудового договора в связи с неудовлетворительным результатом испытания руководитель кадровой службы совместно с юристом проверяет наличие действующего условия об испытании, неистечение его срока и установленные законодательством запреты и ограничения увольнения, в том числе предусмотренные статьями 81 и 261 Трудового кодекса Российской Федерации. Расторжение трудового договора производится только при отсутствии соответствующих запретов и соблюдении установленных гарантий. Заключение непосредственного руководителя не заменяет такой проверки.<\/p>\n<\/blockquote>\n<p>Это готовая организационная норма, не новый пересказ ст. 261. До её утверждения юристы должны восстановить по первоисточнику полный актуальный перечень в закрытом контрольном листе. На другие основания увольнения из ПВТР распространять отдельную проверку, а не вывод о допустимости по этому пункту.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель передаёт обоснование результата, не решение об увольнении.<\/li>\n<li>КДП проверяет договор и срок; юрист — гарантии по актуальным нормам.<\/li>\n<li>В журнале отмечается проверка и её итог; семейные и медицинские сведения остаются у специально уполномоченных кадровых работников.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Есть ли действующий юридически проверенный лист ограничений увольнения вне документа 07?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в наличии обрыва и отсутствии нормы в базе; низкая в оценке актуальности конкретных категорий — вывод не сделан.<\/p>"}, {"id": "К-PRIEM-04", "slug": "PRIEM-04", "title": "Без испытания адаптация теряет срок, а при длительном испытании — продолжение", "imp": "средняя", "docs": ["07", "13"], "meta": [["Документы", "13, пп. 1.3, 3.1, 3.3.3 и раздел 4; 07, пп. 1.5–1.6"], ["Тип", "противоречие внутри документа"], ["Кто решает", "руководитель HR; длительность адаптации — выбор компании"], ["Важность", "средняя: новичок без испытания формально выпадает из общего процесса"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>13, п. 1.3: «Продолжительность адаптационного периода нового сотрудника совпадает с его испытательным сроком».<\/li>\n<li>13, п. 3.1: «рассчитана на весь период установленного новому сотруднику испытательного срока».<\/li>\n<li>На стр. 3 скана заголовок HR-встречи начинается словами «Встречи с HR … работы сотрудника»; в предложении ниже границы приведены для утверждения, не как цитата.<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Регламент адресован новым сотрудникам вообще, но определяет срок только через испытание. Законные варианты отсутствия испытания и его другой длительности в календарь не помещаются. Три календарных месяца и девяносто дней также не всегда совпадают; на примере длительного испытания календарь не даёт схему на оставшийся период. Это не доказательство, что на деле новичков оставляют без помощи.<\/p>\n<p><strong>Закон.<\/strong> ТК ст. 70 ч. 2, 4–6 (ред. 25.05.2026): «Отсутствие в трудовом договоре условия об испытании означает, что работник принят на работу без испытания»; «испытание не может превышать двух недель» — о коротком договоре. Закон не устанавливает единую длительность адаптации: предлагаемое значение — внутренний выбор.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Рекомендуемый вариант — самостоятельный период адаптации. Заменить 13, п. 1.3:<\/p>\n<blockquote>\n<p>1.3. Адаптация проводится для каждого нового сотрудника независимо от наличия условия об испытании. Стандартная продолжительность адаптации составляет три календарных месяца со дня начала работы, но не дольше срока трудового договора. Руководитель подразделения совместно с Отделом персонала определяет индивидуальный календарь с учетом должности и продолжительности работы. Изменение календаря адаптации не устанавливает и не продлевает испытание.<\/p>\n<\/blockquote>\n<p>Заменить окончание п. 3.1:<\/p>\n<blockquote>\n<p>Продолжительность программы определяется пунктом 1.3 настоящего Регламента. Оценка результатов испытания, если оно установлено, проводится отдельно в сроки Положения о порядке прохождения испытания при приеме на работу.<\/p>\n<\/blockquote>\n<p>В п. 3.3.3 заменить привязку к ИС на период адаптации. В разделе 4 заменить верхнюю границу 90-го дня на окончание периода по п. 1.3; вторую фазу HR-встреч начинать с 31-го календарного дня. По истечении адаптации при продолжающемся испытании руководитель сохраняет контроль заданий и сроков по 07, а не прекращает испытание. Альтернатива HR — индивидуальная продолжительность без стандартного периода; тогда календарь обязателен каждому, иначе пробел останется.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Приём запускает адаптацию всегда, а испытание — только при действующем условии договора.<\/li>\n<li>HR задаёт календарь, ограничивая его сроком договора; срок испытания хранится отдельно.<\/li>\n<li>Завершение одного процесса не закрывает автоматически другой.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Подтверждает ли HR самостоятельный стандартный период и кто утверждает индивидуальные отклонения?<\/p>\n<p><strong>Цена вопроса.<\/strong> По условному примеру испытания с 16.11.2026: 181 календарный день против схемы на 90 дней, вне неё 91 день. Расчёт программой; это иллюстрация, не данные работника и не утверждение о юридической дате увольнения.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая по текстовой несогласованности; средняя по новому стандарту — его выбирает HR.<\/p>"}, {"id": "К-PRIEM-05", "slug": "PRIEM-05", "title": "Куратор и Наставник назначаются разными руководителями", "imp": "средняя", "docs": ["07", "13"], "meta": [["Документы", "07, пп. 2.1–2.2; 13, пп. 3.3.2–3.3.4"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR и руководитель подразделения"], ["Важность", "средняя: неясно, один ли это человек и кто отвечает за постановку задач"]], "html": "<p><strong>Было.<\/strong><\/p>\n<ul>\n<li>07, п. 2.1: «Непосредственный руководитель работника назначает куратора из числа работников того же подразделения».<\/li>\n<li>13, п. 3.3.2: «в первый рабочий день Руководителем отдела определяется Наставник»; далее: «а так же ставит ему задачи на ближайший период».<\/li>\n<li>07, п. 2.2: «выдачи непосредственным руководителем работнику отдельных заданий».<\/li>\n<\/ul>\n<p><strong>Что не так.<\/strong> Названия, назначающие и полномочия различаются. Нельзя без подтверждения объявлять это одной должностью, но если функции действительно совмещаются, два назначения лишние. Если наставник самостоятельно ставит оценочные задания, заключение руководителя может опираться на задачи, которых руководитель не утверждал.<\/p>\n<p><strong>Закон.<\/strong> Единая роль наставника — организационный выбор. Если наставничество выходит за трудовую функцию, ТК ст. 60.2 ч. 1 (ред. 25.05.2026): «С письменного согласия работника ему может быть поручено … дополнительной работы по другой или такой же профессии (должности) за дополнительную оплату». Автоматическую бесплатную дополнительную обязанность не предлагаем.<\/p>\n<p><strong>Стало (предлагается).<\/strong> Если HR подтверждает совмещение, заменить 07, п. 2.1:<\/p>\n<blockquote>\n<p>2.1. До первого рабочего дня непосредственный руководитель по согласованию с руководителем подразделения определяет Наставника нового работника из числа работников подразделения. Наставник выполняет функции куратора, предусмотренные настоящим Положением; отдельное назначение куратора не производится. О назначении Отдел персонала извещает Наставника и нового работника. При отсутствии Наставника его функции до замены выполняет непосредственный руководитель в пределах своей трудовой функции. Поручение дополнительной работы оформляется в соответствии с трудовым законодательством.<\/p>\n<\/blockquote>\n<p>Заменить 13, п. 3.3.2:<\/p>\n<blockquote>\n<p>3.3.2. Наставник определяется в порядке пункта 2.1 Положения о порядке прохождения испытания при приеме на работу независимо от установления испытания. Наставник знакомит нового сотрудника с командой, сервисами и рабочими материалами, разъясняет задания, утвержденные непосредственным руководителем, и помогает в их выполнении. Постановка оценочных заданий, критериев и сроков, а также итоговая оценка остаются за непосредственным руководителем.<\/p>\n<\/blockquote>\n<p>В п. 3.3.4 срок знакомства установить в первый рабочий день. Альтернатива — оставить две роли, но письменно разделить задачи: куратор организационного ввода и наставник профессионального сопровождения. Выбирать её стоит только если HR подтвердит такую практику.<\/p>\n<p><strong>Как будет работать.<\/strong><\/p>\n<ol>\n<li>Руководитель получает задачу назначения до выхода новичка; при несовпадении руководителей требуется их согласование.<\/li>\n<li>HR фиксирует одну роль и заменяющего в календаре.<\/li>\n<li>Наставник помогает, руководитель утверждает задания и оценивает результат.<\/li>\n<\/ol>\n<p><strong>Уточнить у HR и КДП.<\/strong> Это сейчас один человек или разные? Входит ли наставничество в его трудовую функцию?<\/p>\n<p><strong>Цена вопроса.<\/strong> Не считали.<\/p>\n<p><strong>Уверенность.<\/strong> Высокая в расхождении; средняя в объединении ролей.<\/p>"}, {"id": "К-PRIEM-06", "slug": "PRIEM-06", "title": "Обязательные встречи поставлены после рабочего дня", "imp": "высокая", "docs": ["02", "10", "12", "13"], "meta": [["Документы", "13, п. 3.3.4 и раздел 4; 12, пп. 4.1–4.3; 02, пп. 2.1–2.3, 3.2–3.5; 10, раздел 4"], ["Тип", "противоречие между документами"], ["Кто решает", "руководитель HR; юристы и группа VREM — оформление работы сверх нормы"], ["Важность", "высокая: регулярная обязательная работа за рамками рабочего времени"]], "html": "<p><strong>Было.<\/strong> 13, п. 3.3.4: «Встречи должны проводиться вечером по завершении рабочего дня». Раздел 4: «Проводятся после рабочего дня». Номер пункта и обе строки таблицы сверены со сканом стр. 2.<\/p>\n<p><strong>Что не так.<\
